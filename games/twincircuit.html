  /* ================= 音频 ================= */
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      } catch (err) {
        audioCtx = null;
      }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
  }

  function tone(freq, dur, type, vol, slide, delay) {
    if (!audioCtx || muted) return;
    const t0 = audioCtx.currentTime + (delay || 0);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(Math.max(30, freq), t0);
    if (slide) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t0 + dur);
    }
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol || 0.05), t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  }

  /* ================= 输入 ================= */
  window.addEventListener('keydown', (e) => {
    initAudio();
    const k = e.key.toLowerCase();
    if (k === ' ' || k.indexOf('arrow') === 0) e.preventDefault();
    if (e.repeat) return;
    keys.add(k);

    if (state === 'start') {
      if (k === ' ' || k === 'enter') startGame();
      return;
    }
    if (state === 'select') {
      if (k === 'escape' || k === 't') returnToTitle();
      return;
    }
    if (state === 'tutorialIntro') {
      if (k === ' ' || k === 'enter') startTutorial();
      else if (k === 'escape' || k === 't') returnToTitle();
      return;
    }
    if (state === 'tutorialDone') {
      if (k === ' ' || k === 'enter' || k === 'r') startGame(0);
      else if (k === 'escape' || k === 't') returnToTitle();
      return;
    }
    if (state === 'playing') {
      if (k === ' ') tryPulse(0);
      else if (k === 'enter') tryPulse(1);
      else if (k === 'escape' || k === 'p') togglePause();
      else if (k === 'm') toggleMute();
    } else if (state === 'paused') {
      if (k === 'escape' || k === 'p') togglePause();
      else if (k === 'r') replayLevel();
      else if (k === 'm') toggleMute();
      else if (k === 't') returnToTitle();
    } else if (state === 'over') {
      if (k === 'r' || k === 'enter' || k === ' ') retryLevel();
      else if (k === 't') returnToTitle();
    } else if (state === 'win') {
      if (k === 'r' || k === 'enter' || k === ' ') startGame();
      else if (k === 't') returnToTitle();
    }
  });

  window.addEventListener('keyup', (e) => {
    keys.delete(e.key.toLowerCase());
  });

  window.addEventListener('blur', () => {
    keys.clear();
    if (state === 'playing') togglePause();
  });

  overlayEl.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;
    if (action === 'start' || action === 'restart') startGame();
    else if (action === 'retry') retryLevel();
    else if (action === 'replay') replayLevel();
    else if (action === 'resume') togglePause();
    else if (action === 'title') returnToTitle();
    else if (action === 'select') showLevelSelect();
    else if (action === 'tutorial') showTutorialIntro();
    else if (action === 'tutorialStart') startTutorial();
    else if (action === 'adventure') startGame(0);
    else if (action === 'level') {
      const idx = parseInt(btn.dataset.value, 10);
      if (idx >= 0 && idx < LEVELS.length) startGame(idx);
    } else if (action === 'difficulty') {
      tuneFor(btn.dataset.value);
      showStartScreen();
      tone(520, 0.1, 'triangle', 0.03, 720);
    }
  });

  /* ================= 流程控制 ================= */
  function startGame(levelIndex) {
    initAudio();
    const startAt = (typeof levelIndex === 'number' && levelIndex >= 0 && levelIndex < LEVELS.length) ? levelIndex : 0;
    currentLevel = startAt;
    runTime = 0;
    runCores = 0;
    runCoresTotal = 0;
    perfectLevels = 0;
    hearts = MAX_HEARTS;
    particles.length = 0;
    hurtCooldown = 0;
    loadLevel(startAt);
    tone(440, 0.16, 'sine', 0.05, 660);
    tone(660, 0.2, 'sine', 0.04, 880, 0.1);
  }

  function loadLevel(index) {
    tutorialMode = false;
    currentLevel = index;
    activeLevel = LEVELS[index];
    buildLevel(activeLevel);
  }

  function startTutorial() {
    initAudio();
    tutorialMode = true;
    currentLevel = 0;
    activeLevel = TUTORIAL;
    runTime = 0;
    runCores = 0;
    runCoresTotal = 0;
    perfectLevels = 0;
    hearts = MAX_HEARTS;
    particles.length = 0;
    hurtCooldown = 0;
    buildLevel(TUTORIAL);
    tone(520, 0.16, 'sine', 0.05, 700);
    tone(700, 0.2, 'sine', 0.04, 920, 0.1);
  }

  function buildLevel(L) {
    levelAccent = tutorialMode ? '#ffd76a' : LEVEL_ACCENTS[currentLevel % LEVEL_ACCENTS.length];
    hitFlash = 0;
    walls = L.walls.map((w) => ({ x: w.x, y: w.y, w: w.w, h: w.h }));

    players = L.spawn.map((pos, idx) => ({
      x: pos[0],
      y: pos[1],
      vx: 0,
      vy: 0,
      r: 13,
      idx: idx,
      invuln: 1.0,
      shield: 0,
      pulseCd: 0,
      faceX: idx === 0 ? 1 : -1,
      faceY: 0,
      color: idx === 0 ? COL.p1 : COL.p2
    }));

    cores = L.cores.map((pos) => ({
      x: pos[0],
      y: pos[1],
      phase: Math.random() * TAU,
      collected: false
    }));

    sentinels = L.sentinels.map((s) => ({
      x: s.x,
      y: s.y,
      speed: s.speed * HAZARD_SPEED,
      r: 15,
      stun: 0,
      phase: Math.random() * TAU
    }));

    lasers = L.lasers.map((l) => ({
      cx: l.cx,
      cy: l.cy,
      speed: l.speed * LASER_SPEED,
      radius: l.radius,
      angle: l.offset || 0,
      phase: Math.random() * TAU
    }));

    portal = { x: L.portal[0], y: L.portal[1], r: 30, phase: 0 };

    totalCores = cores.length;
    runCoresTotal += totalCores;
    collected = 0;
    hearts = MAX_HEARTS;
    sync = 0.45;
    healTimer = 0;
    hurtCooldown = 0;
    shake = 0;
    elapsed = 0;
    tetherFlash = 0;
    levelHurt = false;
    syncReadyShown = false;
    particles.length = 0;
    state = 'playing';
    hideOverlay();
    if (tutorialMode) {
      tutorialStep = 0;
      tutorialMove = [0, 0];
      tutorialLast = players.map((p) => ({ x: p.x, y: p.y }));
    } else {
      showToast(L.name + ' · ' + (L.tip || '收集全部核心'), 3.2);
    }
  }

  function setTutorialStep(n) {
    if (!tutorialMode || n <= tutorialStep) return;
    tutorialStep = n;
    tone(600 + n * 70, 0.12, 'sine', 0.03, 760 + n * 70);
  }

  function updateTutorial() {
    if (!tutorialMode || players.length < 2) return;
    for (let i = 0; i < 2; i += 1) {
      const p = players[i];
      const last = tutorialLast[i];
      tutorialMove[i] += Math.hypot(p.x - last.x, p.y - last.y);
      last.x = p.x;
      last.y = p.y;
    }
    const movedBoth = tutorialMove[0] > 40 && tutorialMove[1] > 40;
    let target = 0;
    if (movedBoth) target = 1;
    if (movedBoth && collected >= 1) target = 2;
    if (movedBoth && totalCores > 0 && collected >= totalCores) target = 3;
    setTutorialStep(target);
  }

  function levelClear() {
    if (state !== 'playing') return;
    state = 'clear';
    clearTimer = 2.8;
    levelClearTime = elapsed;
    if (!levelHurt) perfectLevels += 1;
    shake = Math.max(shake, 7);
    ringFx(portal.x, portal.y, COL.portal, 16, 220, 0.9);
    burst(portal.x, portal.y, COL.portal, 38, 260);
    for (const p of players) burst(p.x, p.y, p.color, 16, 190);
    tone(523.25, 0.34, 'sine', 0.055);
    tone(659.25, 0.34, 'sine', 0.05, null, 0.1);
    tone(783.99, 0.5, 'sine', 0.05, null, 0.2);
  }

  function gameOver() {
    state = 'over';
    keys.clear();
    shake = 22;
    for (const p of players) {
      burst(p.x, p.y, COL.danger, 28, 260);
      ringFx(p.x, p.y, COL.danger, 6, 70, 0.5);
    }
    tone(220, 0.4, 'sawtooth', 0.06, 70);
    tone(160, 0.6, 'sine', 0.05, 50, null, 0.18);
    setTimeout(() => {
      if (state === 'over') showOverlay(gameOverHTML());
    }, 420);
  }

  function winGame() {
    state = 'win';
    keys.clear();
    showOverlay(winHTML());
    tone(523.25, 0.24, 'sine', 0.055);
    tone(659.25, 0.24, 'sine', 0.055, null, 0.12);
    tone(783.99, 0.24, 'sine', 0.055, null, 0.24);
    tone(1046.5, 0.6, 'sine', 0.05, null, 0.36);
  }

  function replayLevel() {
    if (state !== 'playing' && state !== 'paused' && state !== 'over') return;
    if (tutorialMode) {
      startTutorial();
      return;
    }
    runCores = Math.max(0, runCores - collected);
    runCoresTotal = Math.max(0, runCoresTotal - totalCores);
    hearts = MAX_HEARTS;
    particles.length = 0;
    hurtCooldown = 0;
    loadLevel(currentLevel);
  }

  function retryLevel() {
    if (state !== 'over') return;
    replayLevel();
    tone(392, 0.16, 'sine', 0.045, 523.25);
    tone(523.25, 0.2, 'sine', 0.04, 659.25, 0.1);
  }

  function returnToTitle() {
    hideOverlay();
    showStartScreen();
    tone(330, 0.16, 'sine', 0.04, 220);
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      keys.clear();
      showOverlay(pauseHTML());
    } else if (state === 'paused') {
      state = 'playing';
      keys.clear();
      hideOverlay();
    }
  }

  function toggleMute() {
    muted = !muted;
    showToast(muted ? '已静音 · 按 M 恢复' : '声音已开启', 1.2);
  }

  /* ================= 主更新 ================= */
  function update(dt) {
    if (state === 'playing') {
      elapsed += dt;
      runTime += dt;
      hurtCooldown = Math.max(0, hurtCooldown - dt);

      updatePlayers(dt);
      updateSentinels(dt);
      updateLasers(dt);
      updateCores();
      updateSync(dt);
      updatePortal();
      updateHealing(dt);
      if (tutorialMode) updateTutorial();

      portal.phase += dt;
      tetherFlash = Math.max(0, tetherFlash - dt);
    }

    if (state !== 'paused') {
      updateParticles(dt);
      shake = Math.max(0, shake - dt * 60);
      hitFlash = Math.max(0, hitFlash - dt * 2.4);
      if (toast.t > 0) toast.t = Math.max(0, toast.t - dt);

      if (state === 'clear') {
        clearTimer -= dt;
        portal.phase += dt;
        if (clearTimer <= 0) {
          if (tutorialMode) {
            showTutorialComplete();
            return;
          }
          currentLevel += 1;
          if (currentLevel >= LEVELS.length) winGame();
          else loadLevel(currentLevel);
        }
      }
    }
  }

  function updatePlayers(dt) {
    const p1 = players[0];
    const p2 = players[1];
    if (!p1 || !p2) return;

    for (const p of players) {
      let ax = 0;
      let ay = 0;
      if (p.idx === 0) {
        if (keys.has('a')) ax -= 1;
        if (keys.has('d')) ax += 1;
        if (keys.has('w')) ay -= 1;
        if (keys.has('s')) ay += 1;
      } else {
        if (keys.has('arrowleft')) ax -= 1;
        if (keys.has('arrowright')) ax += 1;
        if (keys.has('arrowup')) ay -= 1;
        if (keys.has('arrowdown')) ay += 1;
      }
      if (ax !== 0 && ay !== 0) {
        ax *= 0.7071;
        ay *= 0.7071;
      }

      p.vx += ax * ACCEL * dt;
      p.vy += ay * ACCEL * dt;

      const other = p.idx === 0 ? p2 : p1;
      let dx = other.x - p.x;
      let dy = other.y - p.y;
      const d = Math.hypot(dx, dy) || 1;
      if (d > TETHER_SOFT) {
        const force = (d - TETHER_SOFT) * 2.4;
        p.vx += (dx / d) * force * dt;
        p.vy += (dy / d) * force * dt;
      }

      const drag = Math.exp(-DRAG * dt);
      p.vx *= drag;
      p.vy *= drag;

      const sp = Math.hypot(p.vx, p.vy);
      if (sp > MAX_SPEED) {
        p.vx = (p.vx / sp) * MAX_SPEED;
        p.vy = (p.vy / sp) * MAX_SPEED;
      }

      p.x += p.vx * dt;
      p.y += p.vy * dt;

      if (sp > 12) {
        p.faceX = p.vx / sp;
        p.faceY = p.vy / sp;
      }

      for (const w of walls) resolveCircleRect(p, w);
      p.x = clamp(p.x, p.r, W - p.r);
      p.y = clamp(p.y, p.r, H - p.r);

      p.invuln = Math.max(0, p.invuln - dt);
      p.shield = Math.max(0, p.shield - dt);
      p.pulseCd = Math.max(0, p.pulseCd - dt);
    }

    let dx = p2.x - p1.x;
    let dy = p2.y - p1.y;
    let d = Math.hypot(dx, dy);
    const minD = p1.r + p2.r + 2;
    if (d > 0 && d < minD) {
      const push = (minD - d) * 0.5;
      const nx = dx / d;
      const ny = dy / d;
      p1.x -= nx * push;
      p1.y -= ny * push;
      p2.x += nx * push;
      p2.y += ny * push;
      for (const w of walls) {
        resolveCircleRect(p1, w);
        resolveCircleRect(p2, w);
      }
    }
  }

  function resolveCircleRect(p, rct) {
    const cx = clamp(p.x, rct.x, rct.x + rct.w);
    const cy = clamp(p.y, rct.y, rct.y + rct.h);
    let dx = p.x - cx;
    let dy = p.y - cy;
    const d2 = dx * dx + dy * dy;
    if (d2 >= p.r * p.r) return;

    let nx;
    let ny;
    if (d2 > 0.000001) {
      const d = Math.sqrt(d2);
      nx = dx / d;
      ny = dy / d;
      const overlap = p.r - d;
      p.x += nx * overlap;
      p.y += ny * overlap;
    } else {
      const left = p.x - rct.x;
      const right = rct.x + rct.w - p.x;
      const top = p.y - rct.y;
      const bottom = rct.y + rct.h - p.y;
      const m = Math.min(left, right, top, bottom);
      nx = 0;
      ny = 0;
      if (m === left) {
        p.x = rct.x - p.r;
        nx = -1;
      } else if (m === right) {
        p.x = rct.x + rct.w + p.r;
        nx = 1;
      } else if (m === top) {
        p.y = rct.y - p.r;
        ny = -1;
      } else {
        p.y = rct.y + rct.h + p.r;
        ny = 1;
      }
    }

    const vn = p.vx * nx + p.vy * ny;
    if (vn < 0) {
      p.vx -= vn * nx;
      p.vy -= vn * ny;
    }
  }

  function updateSentinels(dt) {
    for (const s of sentinels) {
      if (s.stun > 0) {
        s.stun = Math.max(0, s.stun - dt);
        continue;
      }
      let target = null;
      let best = Infinity;
      for (const p of players) {
        const d = dist(s.x, s.y, p.x, p.y);
        if (d < best) {
          best = d;
          target = p;
        }
      }
      if (!target) continue;

      let ang = Math.atan2(target.y - s.y, target.x - s.x);
      ang += Math.sin(time * 1.7 + s.phase) * 0.35;
      s.x += Math.cos(ang) * s.speed * dt;
      s.y += Math.sin(ang) * s.speed * dt;
      s.x = clamp(s.x, 16, W - 16);
      s.y = clamp(s.y, 16, H - 16);

      if (elapsed > START_GRACE) {
        for (const p of players) {
          if (dist(s.x, s.y, p.x, p.y) < s.r + p.r - HAZARD_HIT_PAD) {
            hurtPlayer(p);
          }
        }
      }
    }
  }

  function updateLasers(dt) {
    for (const l of lasers) {
      l.angle += l.speed * dt;
      if (elapsed <= START_GRACE) continue;
      const ex = l.cx + Math.cos(l.angle) * l.radius;
      const ey = l.cy + Math.sin(l.angle) * l.radius;
      for (const p of players) {
        if (distToSegment(p.x, p.y, l.cx, l.cy, ex, ey) < p.r * 0.72 + LASER_HIT_PAD) {
          hurtPlayer(p);
        }
      }
    }
  }

  function updateCores() {
    const p1 = players[0];
    const p2 = players[1];
    if (!p1 || !p2) return;

    for (const c of cores) {
      if (c.collected) continue;
      let hit = false;
      for (const p of players) {
        if (dist(c.x, c.y, p.x, p.y) < p.r + 12) {
          hit = true;
          break;
        }
      }
      if (!hit && distToSegment(c.x, c.y, p1.x, p1.y, p2.x, p2.y) < 15) {
        hit = true;
      }
      if (hit) collectCore(c);
    }
  }

  function collectCore(c) {
    c.collected = true;
    collected += 1;
    runCores += 1;
    tetherFlash = 0.3;
    burst(c.x, c.y, COL.core, 18, 190);
    ringFx(c.x, c.y, COL.core, 6, 34, 0.5);
    tone(880, 0.12, 'triangle', 0.05, 1320);

    if (collected >= totalCores) {
      showToast('全部核心已收集 · 传送门开启', 3);
      ringFx(portal.x, portal.y, COL.portal, 10, 100, 0.8);
      burst(portal.x, portal.y, COL.portal, 24, 160);
      tone(659.25, 0.22, 'sine', 0.05);
      tone(987.77, 0.3, 'sine', 0.045, null, 0.12);
    }
  }

  function updateSync(dt) {
    const p1 = players[0];
    const p2 = players[1];
    if (!p1 || !p2) return;
    const d = dist(p1.x, p1.y, p2.x, p2.y);
    const target = clamp(1 - (d - 90) / 280, 0.04, 1);
    sync += (target - sync) * Math.min(1, dt * 1.5);
    sync = clamp(sync, 0, 1);

    if (!syncReadyShown && elapsed > 3.2 && sync >= SYNC_THRESHOLD) {
      syncReadyShown = true;
      showToast('同步就绪 · 可释放脉冲', 1.4);
      tone(740, 0.12, 'triangle', 0.03, 990);
    }
  }

  function updatePortal() {
    if (!portal) return;
    if (collected < totalCores) return;
    const p1 = players[0];
    const p2 = players[1];
    if (!p1 || !p2) return;
    const d1 = dist(p1.x, p1.y, portal.x, portal.y);
    const d2 = dist(p2.x, p2.y, portal.x, portal.y);
    if (d1 < portal.r + 4 && d2 < portal.r + 4) levelClear();
  }

  function updateHealing(dt) {
    const p1 = players[0];
    const p2 = players[1];
    if (!p1 || !p2) return;
    const d = dist(p1.x, p1.y, p2.x, p2.y);
    if (hearts < MAX_HEARTS && d < HEAL_RANGE) {
      healTimer += dt;
      if (healTimer >= HEAL_TIME) {
        healTimer = 0;
        hearts = Math.min(MAX_HEARTS, hearts + 1);
        showToast('回路修复 · 生命 +1', 1.5);
        ringFx(p1.x, p1.y, COL.portal, 4, 44, 0.5);
        ringFx(p2.x, p2.y, COL.portal, 4, 44, 0.5);
        tone(660, 0.2, 'sine', 0.04, 990);
      }
    } else {
      healTimer = Math.max(0, healTimer - dt * 0.6);
    }
  }

  function tryPulse(idx) {
    if (state !== 'playing') return;
    const p = players[idx];
    if (!p) return;
    if (p.pulseCd > 0) {
      tone(180, 0.08, 'square', 0.02);
      return;
    }
    if (sync < SYNC_THRESHOLD) {
      showToast('同步不足 · 靠近队友充能', 1.5);
      tone(170, 0.1, 'square', 0.03);
      return;
    }

    sync = Math.max(0, sync - PULSE_COST);
    p.pulseCd = PULSE_CD;

    for (const o of players) o.shield = Math.max(o.shield, PULSE_SHIELD);

    ringFx(p.x, p.y, p.color, 12, 200, 0.55);
    burst(p.x, p.y, p.color, 26, 300);
    shake = Math.max(shake, 8);

    for (const s of sentinels) {
      const d = dist(s.x, s.y, p.x, p.y);
      if (d < PULSE_RADIUS) {
        s.stun = Math.max(s.stun, 2.2);
        const nx = (s.x - p.x) / (d || 1);
        const ny = (s.y - p.y) / (d || 1);
        s.x = clamp(s.x + nx * 46, 20, W - 20);
        s.y = clamp(s.y + ny * 46, 20, H - 20);
        ringFx(s.x, s.y, COL.danger, 6, 42, 0.4);
      }
    }

    tone(320, 0.28, 'sine', 0.07, 80);
    tone(640, 0.16, 'triangle', 0.04, 210);
  }

  function hurtPlayer(p) {
    if (state !== 'playing' || !p) return;
    if (p.invuln > 0 || p.shield > 0 || hurtCooldown > 0) return;

    hurtCooldown = 0.45;
    hearts -= 1;
    levelHurt = true;
    p.invuln = 1.7;
    healTimer = 0;
    sync = Math.max(0, sync - 0.14);
    shake = 16;
    hitFlash = 0.5;
    burst(p.x, p.y, '#ff5d7a', 24, 260);
    ringFx(p.x, p.y, '#ff5d7a', 8, 64, 0.45);
    tone(140, 0.28, 'sawtooth', 0.06, 60);

    if (hearts <= 0) {
      hearts = 0;
      gameOver();
    }
  }

  /* ================= 粒子 ================= */
  function burst(x, y, color, count, speed) {
    if (particles.length > 550) return;
    for (let i = 0; i < count; i += 1) {
      const a = Math.random() * TAU;
      const v = rand(speed * 0.2, speed);
      const life = rand(0.35, 0.9);
      particles.push({
        x: x,
        y: y,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v,
        life: life,
        maxLife: life,
        size: rand(1.2, 3.4),
        color: color,
        ring: false
      });
    }
  }

  function ringFx(x, y, color, r0, r1, dur) {
    particles.push({
      x: x,
      y: y,
      vx: 0,
      vy: 0,
      life: dur,
      maxLife: dur,
      r0: r0,
      r1: r1,
      color: color,
      ring: true
    });
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i -= 1) {
      const q = particles[i];
      q.life -= dt;
      if (q.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      if (!q.ring) {
        q.x += q.vx * dt;
        q.y += q.vy * dt;
        const damp = Math.exp(-2.4 * dt);
        q.vx *= damp;
        q.vy *= damp;
      }
    }
  }

  /* ================= 渲染 ================= */
  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(bgLayer, 0, 0);

    const sx = shake > 0 ? rand(-shake, shake) : 0;
    const sy = shake > 0 ? rand(-shake, shake) : 0;

    ctx.save();
    ctx.translate(sx, sy);
    drawBackdrop();

    if (players.length >= 2) {
      drawPortal();
      drawWalls();
      drawTether();
      drawCores();
      drawLasers();
      drawSentinels();
      drawPlayers();
      drawParticles();
      drawPortalLabel();
    } else {
      drawAttract();
    }
    ctx.restore();

    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);

    if (hitFlash > 0) {
      const a = clamp(hitFlash / 0.5, 0, 1);
      const hf = ctx.createRadialGradient(W / 2, H / 2, H * 0.30, W / 2, H / 2, H * 0.88);
      hf.addColorStop(0, 'rgba(255,40,80,0)');
      hf.addColorStop(1, 'rgba(255,28,72,' + (0.46 * a).toFixed(3) + ')');
      ctx.fillStyle = hf;
      ctx.fillRect(0, 0, W, H);
    }

    if (state !== 'start') drawHUD();
    drawBanners();
  }

  function drawBackdrop() {
    ctx.save();
    drawAtmosphere();

    /* 双层网格：细网格给纵深，主网格给结构 */
    ctx.lineWidth = 1;
    ctx.strokeStyle = rgba(levelAccent, 0.016);
    ctx.beginPath();
    for (let x = 0; x <= W; x += 16) {
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
    }
    for (let y = 0; y <= H; y += 16) {
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
    }
    ctx.stroke();

    ctx.strokeStyle = rgba(levelAccent, 0.055);
    ctx.beginPath();
    for (let x = 0; x <= W; x += 64) {
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
    }
    for (let y = 0; y <= H; y += 64) {
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
    }
    ctx.stroke();

    /* 闪烁星点，亮星带十字星芒 */
    for (const s of stars) {
      const tw = 0.5 + 0.5 * Math.sin(time * s.s + s.p);
      const a = 0.18 + 0.42 * tw;
      ctx.globalAlpha = a;
      ctx.fillStyle = s.big ? '#effaff' : '#bcdcff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * (s.big ? 1.25 : 1), 0, TAU);
      ctx.fill();
      if (s.big) {
        ctx.globalAlpha = a * 0.45;
        ctx.strokeStyle = '#dff4ff';
        ctx.lineWidth = 0.8;
        const l = 3 + s.r * 2.2;
        ctx.beginPath();
        ctx.moveTo(s.x - l, s.y);
        ctx.lineTo(s.x + l, s.y);
        ctx.moveTo(s.x, s.y - l);
        ctx.lineTo(s.x, s.y + l);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;

    /* 缓慢下移的扫描光带 */
    const scanY = ((time * 24) % (H + 140)) - 70;
    const sg = ctx.createLinearGradient(0, scanY - 50, 0, scanY + 50);
    sg.addColorStop(0, rgba(levelAccent, 0));
    sg.addColorStop(0.5, rgba(levelAccent, 0.038));
    sg.addColorStop(1, rgba(levelAccent, 0));
    ctx.fillStyle = sg;
    ctx.fillRect(0, scanY - 50, W, 100);

    /* 四角取景框 */
    ctx.strokeStyle = rgba(levelAccent, 0.38);
    ctx.lineWidth = 2;
    const c = 26;
    const pad = 12;
    ctx.beginPath();
    ctx.moveTo(pad, pad + c);
    ctx.lineTo(pad, pad);
    ctx.lineTo(pad + c, pad);
    ctx.moveTo(W - pad - c, pad);
    ctx.lineTo(W - pad, pad);
    ctx.lineTo(W - pad, pad + c);
    ctx.moveTo(W - pad, H - pad - c);
    ctx.lineTo(W - pad, H - pad);
    ctx.lineTo(W - pad - c, H - pad);
    ctx.moveTo(pad + c, H - pad);
    ctx.lineTo(pad, H - pad);
    ctx.lineTo(pad, H - pad - c);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(180,220,255,0.10)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 46; x < W - 46; x += 64) {
      ctx.moveTo(x, pad);
      ctx.lineTo(x + 16, pad);
      ctx.moveTo(x, H - pad);
      ctx.lineTo(x + 16, H - pad);
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawAtmosphere() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    const drift = Math.sin(time * 0.12) * 46;
    const a1 = ctx.createRadialGradient(W * 0.16 + drift, H * 0.78, 10, W * 0.16 + drift, H * 0.78, 370);
    a1.addColorStop(0, rgba(levelAccent, 0.075 + 0.018 * Math.sin(time * 0.7)));
    a1.addColorStop(0.55, rgba(levelAccent, 0.022));
    a1.addColorStop(1, rgba(levelAccent, 0));
    ctx.fillStyle = a1;
    ctx.fillRect(0, 0, W, H);

    const a2 = ctx.createRadialGradient(W * 0.84 - drift * 0.7, H * 0.2, 10, W * 0.84 - drift * 0.7, H * 0.2, 330);
    a2.addColorStop(0, 'rgba(120,96,255,0.07)');
    a2.addColorStop(1, 'rgba(120,96,255,0)');
    ctx.fillStyle = a2;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = levelAccent;
    for (const m of motes) {
      const y = (((m.y - time * 11 * m.s) % H) + H) % H;
      const x = m.x + Math.sin(time * 0.55 * m.s + m.p) * 17;
      ctx.globalAlpha = 0.08 + 0.18 * (0.5 + 0.5 * Math.sin(time * 1.4 * m.s + m.p));
      ctx.beginPath();
      ctx.arc(x, y, m.r, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawWalls() {
    for (const w of walls) {
      ctx.save();

      /* 落影 */
      ctx.shadowColor = 'rgba(0,0,0,0.55)';
      ctx.shadowBlur = 16;
      ctx.shadowOffsetY = 6;
      ctx.fillStyle = '#060c16';
      rr(w.x, w.y, w.w, w.h, 7);
      ctx.fill();
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;

      /* 金属面板 */
      const g = ctx.createLinearGradient(w.x, w.y, w.x, w.y + w.h);
      g.addColorStop(0, '#233b60');
      g.addColorStop(0.42, '#142440');
      g.addColorStop(1, '#08101f');
      ctx.fillStyle = g;
      rr(w.x, w.y, w.w, w.h, 7);
      ctx.fill();

      /* 顶部高光与底部反射 */
      const top = ctx.createLinearGradient(w.x, w.y, w.x, w.y + Math.min(12, w.h));
      top.addColorStop(0, 'rgba(190,228,255,0.20)');
      top.addColorStop(1, 'rgba(190,228,255,0)');
      ctx.fillStyle = top;
      rr(w.x + 2, w.y + 2, w.w - 4, Math.min(10, w.h - 4), 5);
      ctx.fill();

      /* 外框光边 */
      ctx.strokeStyle = rgba(levelAccent, 0.38);
      ctx.lineWidth = 1.4;
      rr(w.x, w.y, w.w, w.h, 7);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(220,242,255,0.14)';
      ctx.lineWidth = 1;
      rr(w.x + 1.5, w.y + 1.5, w.w - 3, w.h - 3, 5.5);
      ctx.stroke();

      /* 流动能量缝 */
      if (w.w > 46) {
        const sy = w.y + w.h - 5;
        ctx.strokeStyle = rgba(levelAccent, 0.36);
        ctx.lineWidth = 1;
        ctx.setLineDash([13, 9]);
        ctx.lineDashOffset = -time * 34;
        ctx.beginPath();
        ctx.moveTo(w.x + 9, sy);
        ctx.lineTo(w.x + w.w - 9, sy);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      /* 角落铆钉 */
      ctx.fillStyle = 'rgba(196,226,255,0.34)';
      const dots = [[w.x + 8, w.y + 8], [w.x + w.w - 8, w.y + 8], [w.x + 8, w.y + w.h - 8], [w.x + w.w - 8, w.y + w.h - 8]];
      for (const [dx, dy] of dots) {
        if (dx > w.x + 4 && dx < w.x + w.w - 4 && dy > w.y + 4 && dy < w.y + w.h - 4) {
          ctx.beginPath();
          ctx.arc(dx, dy, 1.4, 0, TAU);
          ctx.fill();
        }
      }

      /* 左侧能量条 */
      if (w.h > 16) {
        ctx.fillStyle = rgba(levelAccent, 0.75);
        rr(w.x + 3.5, w.y + 7, 2, Math.max(4, w.h - 14), 1);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawTether() {
    const p1 = players[0];
    const p2 = players[1];
    if (!p1 || !p2) return;

    const d = dist(p1.x, p1.y, p2.x, p2.y);
    const tension = clamp((d - TETHER_SOFT) / 120, 0, 1);
    const flash = tetherFlash > 0 ? tetherFlash / 0.3 : 0;
    const danger = tension > 0.05;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';

    const g = ctx.createLinearGradient(p1.x, p1.y, p2.x, p2.y);
    g.addColorStop(0, COL.p1);
    g.addColorStop(0.5, '#a9b8ff');
    g.addColorStop(1, COL.p2);
    const strand = danger ? COL.danger : g;

    /* 外层光晕 */
    ctx.strokeStyle = strand;
    ctx.globalAlpha = 0.09 + flash * 0.28;
    ctx.lineWidth = 20;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();

    ctx.globalAlpha = 0.24 + flash * 0.34;
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();

    /* 彩色主绳 */
    ctx.strokeStyle = g;
    ctx.globalAlpha = 0.78 + flash * 0.22;
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();

    /* 白色高光芯 */
    ctx.strokeStyle = 'rgba(240,253,255,' + (0.52 + flash * 0.38) + ')';
    ctx.globalAlpha = 1;
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();

    /* 流动虚线 */
    ctx.globalAlpha = 0.34 + flash * 0.3;
    ctx.lineWidth = 1.2;
    ctx.setLineDash([5, 11]);
    ctx.lineDashOffset = -time * 58;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
    ctx.setLineDash([]);

    /* 沿绳奔跑的能量脉冲 */
    for (let i = 0; i < 5; i += 1) {
      const tt = (time * 0.42 + i / 5) % 1;
      const px = lerp(p1.x, p2.x, tt);
      const py = lerp(p1.y, p2.y, tt);
      ctx.globalAlpha = 0.32 + 0.5 * Math.sin(tt * Math.PI);
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = danger ? COL.danger : (i % 2 ? COL.p2 : COL.p1);
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(px, py, 1.9, 0, TAU);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    if (hearts < 3 && d < 190 && healTimer > 0.05) {
      const hp = clamp(healTimer / 12, 0, 1);
      ctx.globalAlpha = 0.24 + hp * 0.34;
      ctx.strokeStyle = rgba(COL.portal, 0.95);
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();

      ctx.fillStyle = rgba(COL.portal, 0.9);
      for (let i = 0; i < 4; i += 1) {
        const tt = (time * 0.5 + i / 4) % 1;
        ctx.globalAlpha = 0.35 + 0.55 * Math.sin(tt * Math.PI);
        ctx.beginPath();
        ctx.arc(lerp(p1.x, p2.x, tt), lerp(p1.y, p2.y, tt), 2.3, 0, TAU);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawCores() {
    for (const c of cores) {
      if (c.collected) continue;
      const bob = Math.sin(time * 2.2 + c.phase) * 3;
      ctx.save();
      ctx.translate(c.x, c.y + bob);

      /* 光晕 */
      const halo = ctx.createRadialGradient(0, 0, 2, 0, 0, 30);
      halo.addColorStop(0, rgba(COL.core, 0.55));
      halo.addColorStop(0.42, rgba(COL.core, 0.17));
      halo.addColorStop(1, rgba(COL.core, 0));
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(0, 0, 30, 0, TAU);
      ctx.fill();

      /* 外圈虚线环 */
      ctx.save();
      ctx.rotate(-time * 0.8 + c.phase);
      ctx.strokeStyle = rgba(COL.core, 0.34);
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 6]);
      ctx.beginPath();
      ctx.arc(0, 0, 17, 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();

      /* 环绕光点 */
      for (let i = 0; i < 3; i += 1) {
        const a = time * 1.9 + c.phase + (i * TAU) / 3;
        const rad = 15 + Math.sin(time * 2 + i) * 1.6;
        ctx.globalAlpha = 0.42 + 0.4 * (0.5 + 0.5 * Math.sin(time * 3 + i + c.phase));
        ctx.fillStyle = '#fff6cf';
        ctx.shadowColor = COL.core;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * rad, Math.sin(a) * rad, 1.4, 0, TAU);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;

      /* 晶体 */
      ctx.save();
      ctx.rotate(time * 1.1 + c.phase);
      const cg = ctx.createLinearGradient(0, -13, 0, 13);
      cg.addColorStop(0, '#fff9d8');
      cg.addColorStop(0.42, '#ffd76a');
      cg.addColorStop(1, '#ff9d2e');
      ctx.fillStyle = cg;
      ctx.shadowColor = COL.core;
      ctx.shadowBlur = 18;
      diamond(0, 0, 8.5, 13);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255,255,238,0.78)';
      ctx.lineWidth = 1;
      diamond(0, 0, 8.5, 13);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.86)';
      diamond(-2.1, -1.4, 3, 6.4);
      ctx.fill();
      ctx.restore();

      ctx.globalAlpha = 0.35;
      ctx.strokeStyle = '#fff6d0';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, -21);
      ctx.lineTo(0, -15);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawLasers() {
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, H);
    ctx.clip();

    for (const l of lasers) {
      const ex = l.cx + Math.cos(l.angle) * l.radius;
      const ey = l.cy + Math.sin(l.angle) * l.radius;
      const warm = elapsed < 2.6;

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';

      /* 光束外辉 */
      ctx.strokeStyle = rgba(COL.danger, warm ? 0.05 : 0.11);
      ctx.lineWidth = 30;
      ctx.beginPath();
      ctx.moveTo(l.cx, l.cy);
      ctx.lineTo(ex, ey);
      ctx.stroke();

      ctx.strokeStyle = rgba(COL.danger, warm ? 0.22 : 0.52);
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.moveTo(l.cx, l.cy);
      ctx.lineTo(ex, ey);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255,232,238,' + (warm ? 0.3 : 0.92) + ')';
      ctx.lineWidth = 1.7 + Math.sin(time * 20 + l.phase) * 0.4;
      ctx.beginPath();
      ctx.moveTo(l.cx, l.cy);
      ctx.lineTo(ex, ey);
      ctx.stroke();

      /* 沿光束流动的能量点 */
      if (!warm) {
        ctx.fillStyle = 'rgba(255,236,242,0.9)';
        for (let i = 0; i < 4; i += 1) {
          const tt = (time * 0.9 + i / 4 + l.phase * 0.15) % 1;
          ctx.globalAlpha = 0.2 + 0.5 * Math.sin(tt * Math.PI);
          ctx.beginPath();
          ctx.arc(lerp(l.cx, ex, tt), lerp(l.cy, ey, tt), 1.4, 0, TAU);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      /* 束尾光斑 */
      const flare = ctx.createRadialGradient(ex, ey, 0, ex, ey, 24);
      flare.addColorStop(0, 'rgba(255,226,235,' + (warm ? 0.16 : 0.42) + ')');
      flare.addColorStop(1, 'rgba(255,77,109,0)');
      ctx.fillStyle = flare;
      ctx.beginPath();
      ctx.arc(ex, ey, 24, 0, TAU);
      ctx.fill();

      /* 发射器底座 */
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#210a13';
      ctx.beginPath();
      ctx.arc(l.cx, l.cy, 15, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = rgba(COL.danger, 0.55);
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(l.cx, l.cy, 15, 0, TAU);
      ctx.stroke();

      /* 旋转刻度环 */
      ctx.save();
      ctx.translate(l.cx, l.cy);
      ctx.rotate(time * 1.3 + l.phase);
      ctx.strokeStyle = rgba(COL.danger, 0.62);
      ctx.lineWidth = 2;
      for (let i = 0; i < 6; i += 1) {
        const a = (i / 6) * TAU;
        ctx.beginPath();
        ctx.arc(0, 0, 18.5, a, a + 0.34);
        ctx.stroke();
      }
      ctx.restore();

      /* 核心 */
      const hub = ctx.createRadialGradient(l.cx, l.cy, 0, l.cx, l.cy, 9);
      hub.addColorStop(0, '#fff0f3');
      hub.addColorStop(0.35, rgba(COL.danger, 0.9));
      hub.addColorStop(1, 'rgba(80,8,24,0.9)');
      ctx.fillStyle = hub;
      ctx.beginPath();
      ctx.arc(l.cx, l.cy, 8, 0, TAU);
      ctx.fill();

      /* 瞄准端 */
      ctx.fillStyle = warm ? 'rgba(255,150,170,0.55)' : 'rgba(255,120,145,0.95)';
      ctx.beginPath();
      ctx.arc(l.cx + Math.cos(l.angle) * 9, l.cy + Math.sin(l.angle) * 9, 3.6, 0, TAU);
      ctx.fill();

      if (warm) {
        ctx.strokeStyle = 'rgba(255,120,145,' + (0.22 + 0.18 * Math.sin(time * 12)) + ')';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(l.cx, l.cy, 22 + Math.sin(time * 8) * 2, 0, TAU);
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.restore();
  }

  function drawSentinels() {
    for (const s of sentinels) {
      const stunned = s.stun > 0;
      ctx.save();
      ctx.translate(s.x, s.y);

      /* 红色危险光晕 */
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const aura = ctx.createRadialGradient(0, 0, 2, 0, 0, 44);
      aura.addColorStop(0, rgba(COL.danger, stunned ? 0.05 : 0.20));
      aura.addColorStop(0.55, rgba(COL.danger, stunned ? 0.02 : 0.07));
      aura.addColorStop(1, rgba(COL.danger, 0));
      ctx.fillStyle = aura;
      ctx.beginPath();
      ctx.arc(0, 0, 44, 0, TAU);
      ctx.fill();
      ctx.restore();

      ctx.globalAlpha = stunned ? 0.45 : 1;

      /* 外圈虚线轨道 */
      ctx.save();
      ctx.rotate(time * (stunned ? 0.2 : 0.9) + s.phase);
      ctx.strokeStyle = rgba(COL.danger, 0.28);
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 7]);
      ctx.beginPath();
      ctx.arc(0, 0, 24, 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();

      /* 旋转尖刺本体 */
      const rot = time * (stunned ? 0.2 : 1.4) + s.phase;
      ctx.save();
      ctx.rotate(rot);
      const body = ctx.createRadialGradient(0, 0, 2, 0, 0, s.r * 1.15);
      body.addColorStop(0, '#4a1220');
      body.addColorStop(0.62, '#28070f');
      body.addColorStop(1, '#140309');
      ctx.shadowColor = COL.danger;
      ctx.shadowBlur = stunned ? 4 : 16;
      ctx.fillStyle = body;
      const spikes = 7;
      ctx.beginPath();
      for (let i = 0; i < spikes * 2; i += 1) {
        const r = i % 2 === 0 ? s.r : s.r * 0.62;
        const a = (i / (spikes * 2)) * TAU;
        if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
        else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = rgba(COL.danger, 0.9);
      ctx.lineWidth = 1.6;
      ctx.stroke();

      /* 反向内三角 */
      ctx.rotate(-rot * 2.3);
      ctx.strokeStyle = 'rgba(255,150,172,0.6)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      for (let i = 0; i < 3; i += 1) {
        const a = (i / 3) * TAU - Math.PI / 2;
        const x = Math.cos(a) * 7.6;
        const y = Math.sin(a) * 7.6;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.restore();

      /* 追踪核心 */
      let aimA = 0;
      let nd = Infinity;
      for (const p of players) {
        const dd = dist(s.x, s.y, p.x, p.y);
        if (dd < nd) {
          nd = dd;
          aimA = Math.atan2(p.y - s.y, p.x - s.x);
        }
      }
      const eye = ctx.createRadialGradient(0, 0, 0, 0, 0, 9);
      eye.addColorStop(0, '#fff6f8');
      eye.addColorStop(0.32, '#ff9fb2');
      eye.addColorStop(1, 'rgba(255,77,109,0)');
      ctx.fillStyle = eye;
      ctx.beginPath();
      ctx.arc(0, 0, 9, 0, TAU);
      ctx.fill();
      ctx.fillStyle = COL.danger;
      ctx.beginPath();
      ctx.arc(0, 0, 4.4, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#20050c';
      ctx.beginPath();
      ctx.arc(Math.cos(aimA) * 1.9, Math.sin(aimA) * 1.9, 2, 0, TAU);
      ctx.fill();
      ctx.restore();

      if (stunned) {
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.strokeStyle = 'rgba(255,226,138,0.5)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.arc(0, 0, 22 + Math.sin(time * 6) * 2, 0, TAU);
        ctx.stroke();
        for (let i = 0; i < 4; i += 1) {
          const a = time * 4 + (i * TAU) / 4;
          ctx.globalAlpha = 0.75;
          ctx.fillStyle = '#ffe28a';
          ctx.beginPath();
          ctx.arc(Math.cos(a) * 21, Math.sin(a) * 21, 1.8, 0, TAU);
          ctx.fill();
        }
        ctx.restore();
      }
    }
  }

  function drawPlayers() {
    for (const p of players) {
      ctx.save();
      if (p.invuln > 0) {
        ctx.globalAlpha = 0.35 + 0.55 * Math.abs(Math.sin(time * 22));
      }

      /* 速度拖尾 */
      const sp = Math.hypot(p.vx, p.vy);
      if (sp > 55) {
        const nx = p.vx / sp;
        const ny = p.vy / sp;
        const tg = ctx.createLinearGradient(p.x - nx * 34, p.y - ny * 34, p.x, p.y);
        tg.addColorStop(0, rgba(p.color, 0));
        tg.addColorStop(1, rgba(p.color, 0.34));
        ctx.strokeStyle = tg;
        ctx.lineWidth = 9;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(p.x - nx * 34, p.y - ny * 34);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      }

      /* 外层光晕 */
      const g = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, 36);
      g.addColorStop(0, 'rgba(255,255,255,0.92)');
      g.addColorStop(0.22, rgba(p.color, 0.62));
      g.addColorStop(0.55, rgba(p.color, 0.16));
      g.addColorStop(1, rgba(p.color, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 36, 0, TAU);
      ctx.fill();

      /* 外环 */
      ctx.strokeStyle = rgba(p.color, 0.38);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r + 7, 0, TAU);
      ctx.stroke();

      /* 球体 */
      const body = ctx.createRadialGradient(p.x - 4, p.y - 5, 1, p.x, p.y, p.r);
      body.addColorStop(0, '#ffffff');
      body.addColorStop(0.32, p.color);
      body.addColorStop(0.82, p.color);
      body.addColorStop(1, 'rgba(6,18,36,0.95)');
      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.55)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, TAU);
      ctx.stroke();

      /* 内核与视线 */
      ctx.fillStyle = 'rgba(255,255,255,0.78)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 0.46, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#041223';
      ctx.beginPath();
      ctx.arc(p.x + p.faceX * 4.6, p.y + p.faceY * 4.6, 3.1, 0, TAU);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath();
      ctx.arc(p.x + p.faceX * 5.6 - 1.1, p.y + p.faceY * 5.6 - 1.1, 1, 0, TAU);
      ctx.fill();

      /* 环绕卫星 */
      for (let i = 0; i < 2; i += 1) {
        const a = time * 2.1 + i * Math.PI + p.idx * 1.3;
        const rad = p.r + 8;
        ctx.globalAlpha = (p.invuln > 0 ? 0.35 : 1) * (0.42 + 0.3 * Math.sin(time * 3 + i));
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(p.x + Math.cos(a) * rad, p.y + Math.sin(a) * rad, 1.5, 0, TAU);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
      if (p.invuln > 0) ctx.globalAlpha = 0.35 + 0.55 * Math.abs(Math.sin(time * 22));
      else ctx.globalAlpha = 1;

      if (elapsed < 2.6) {
        const warm = 1 - elapsed / 2.6;
        ctx.globalAlpha = 0.18 + warm * 0.26;
        ctx.strokeStyle = rgba(COL.portal, 0.75);
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r + 11 + (1 - warm) * 5, 0, TAU);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      if (p.shield > 0) {
        ctx.globalAlpha = 0.55 + 0.35 * Math.sin(time * 12);
        ctx.beginPath();
        for (let i = 0; i < 6; i += 1) {
          const a = -Math.PI / 2 + (i / 6) * TAU + time * 0.6;
          const x = p.x + Math.cos(a) * (p.r + 10);
          const y = p.y + Math.sin(a) * (p.r + 10);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fillStyle = rgba(p.color, 0.08);
        ctx.fill();
        ctx.strokeStyle = 'rgba(191,248,255,0.78)';
        ctx.lineWidth = 1.7;
        ctx.stroke();

        ctx.strokeStyle = rgba(p.color, 0.6);
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r + 10, -time * 3, -time * 3 + 2.0);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      if (p.pulseCd > 0) {
        ctx.globalAlpha = 0.65;
        ctx.strokeStyle = rgba(p.color, 0.75);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r + 5, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - p.pulseCd / PULSE_CD));
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      if (hearts < 3 && healTimer > 0.05) {
        const hp = clamp(healTimer / 12, 0, 1);
        ctx.globalAlpha = 0.55;
        ctx.strokeStyle = rgba(COL.portal, 0.75);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r + 14, -Math.PI / 2, -Math.PI / 2 + TAU * hp);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.restore();

      /* 身份铭牌 */
      ctx.save();
      const label = p.idx === 0 ? 'P1' : 'P2';
      ctx.font = '700 10px ' + FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const tw = ctx.measureText(label).width;
      const ly = p.y - p.r - 21;
      ctx.fillStyle = 'rgba(3,9,18,0.72)';
      rr(p.x - tw / 2 - 7, ly - 8, tw + 14, 16, 8);
      ctx.fill();
      ctx.strokeStyle = rgba(p.color, 0.42);
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = p.color;
      ctx.fillText(label, p.x, ly + 0.5);
      ctx.restore();
    }
  }

  function drawPortal() {
    if (!portal) return;
    const ready = collected >= totalCores;
    const col = ready ? COL.portal : '#4a5d78';
    const glowA = ready ? 0.52 : 0.20;
    const pulse = 1 + Math.sin(time * 3.2) * (ready ? 0.045 : 0.02);

    ctx.save();
    ctx.translate(portal.x, portal.y);
    ctx.scale(pulse, pulse);

    /* 大光晕 */
    const g = ctx.createRadialGradient(0, 0, 4, 0, 0, 72);
    g.addColorStop(0, rgba(col, glowA));
    g.addColorStop(0.45, rgba(col, glowA * 0.35));
    g.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, 72, 0, TAU);
    ctx.fill();

    /* 内部涡流 */
    const v = ctx.createRadialGradient(0, 0, 1, 0, 0, 40);
    v.addColorStop(0, ready ? 'rgba(212,255,232,0.30)' : 'rgba(12,20,34,0.62)');
    v.addColorStop(0.42, ready ? 'rgba(44,140,104,0.18)' : 'rgba(6,12,24,0.50)');
    v.addColorStop(1, 'rgba(2,6,12,0)');
    ctx.fillStyle = v;
    ctx.beginPath();
    ctx.arc(0, 0, 40, 0, TAU);
    ctx.fill();

    /* 旋转能量弧 */
    ctx.save();
    ctx.rotate(time * 0.8);
    ctx.strokeStyle = rgba(col, ready ? 0.95 : 0.55);
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    if (ready) {
      ctx.shadowColor = col;
      ctx.shadowBlur = 12;
    }
    for (let i = 0; i < 4; i += 1) {
      ctx.beginPath();
      ctx.arc(0, 0, 19 + i * 6, i * 1.42, i * 1.42 + 1.75 + i * 0.12);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.restore();

    /* 外圈符文环 */
    ctx.save();
    ctx.rotate(-time * 1.2);
    ctx.strokeStyle = rgba(col, ready ? 0.58 : 0.35);
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 7]);
    ctx.beginPath();
    ctx.arc(0, 0, 40, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    /* 环绕光点 */
    ctx.fillStyle = rgba(col, ready ? 1 : 0.7);
    for (let i = 0; i < 8; i += 1) {
      const a = time * 0.85 + (i / 8) * TAU;
      const rad = 44 + Math.sin(time * 2 + i) * 2;
      ctx.globalAlpha = ready ? 0.42 + 0.35 * Math.sin(time * 2.4 + i) : 0.18;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * rad, Math.sin(a) * rad, 1.6, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    /* 核心 */
    const coreR = ready ? 5 + Math.sin(time * 4) * 1.5 : 3;
    const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, coreR * 3.4);
    cg.addColorStop(0, '#ffffff');
    cg.addColorStop(0.35, ready ? 'rgba(220,255,235,0.95)' : 'rgba(160,185,215,0.58)');
    cg.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.arc(0, 0, coreR * 3.4, 0, TAU);
    ctx.fill();
    ctx.fillStyle = ready ? 'rgba(235,255,242,0.98)' : 'rgba(160,185,215,0.58)';
    ctx.beginPath();
    ctx.arc(0, 0, coreR, 0, TAU);
    ctx.fill();

    /* 开启后的扩散脉冲 */
    if (ready) {
      const ph = (time * 0.62) % 1;
      ctx.strokeStyle = rgba(col, (1 - ph) * 0.24);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(0, 0, 24 + ph * 38, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPortalLabel() {
    if (!portal || state !== 'playing') return;
    const ready = collected >= totalCores;
    const text = ready ? '两人同时进入' : '传送门';
    const font = '600 11px ' + FONT;

    let ly = portal.y + 58;
    if (ly > H - 110) ly = portal.y - 58;
    ly = clamp(ly, 28, H - 28);

    ctx.save();
    ctx.font = font;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const tw = ctx.measureText(text).width;
    const padX = 7;
    const padY = 4;
    ctx.fillStyle = 'rgba(3,8,18,0.72)';
    rr(portal.x - tw / 2 - padX, ly - 8 - padY, tw + padX * 2, 16 + padY * 2, 5);
    ctx.fill();
    ctx.strokeStyle = ready ? 'rgba(123,255,178,0.28)' : 'rgba(120,155,200,0.18)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = ready ? 'rgba(205,255,230,0.92)' : 'rgba(165,192,222,0.72)';
    ctx.fillText(text, portal.x, ly);
    ctx.restore();
  }

  function drawParticles() {
    if (!particles.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const q of particles) {
      const a = q.life / q.maxLife;
      if (q.ring) {
        const t = 1 - a;
        const rad = lerp(q.r0, q.r1, 1 - Math.pow(1 - t, 2));
        ctx.globalAlpha = a * 0.8;
        ctx.strokeStyle = q.color;
        ctx.lineWidth = 2.5 * a + 0.5;
        ctx.beginPath();
        ctx.arc(q.x, q.y, rad, 0, TAU);
        ctx.stroke();
      } else {
        ctx.globalAlpha = a;
        ctx.fillStyle = q.color;
        ctx.beginPath();
        ctx.arc(q.x, q.y, q.size * (0.5 + a * 0.5), 0, TAU);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawAttract() {
    const t = time * 0.55;
    const cx = W / 2;
    const cy = H / 2;
    const p1 = {
      x: cx - 310 + Math.cos(t * 0.9) * 24,
      y: cy + Math.sin(t * 0.9) * 95
    };
    const p2 = {
      x: cx + 310 + Math.cos(t * 0.9 + 2.2) * 24,
      y: cy + Math.sin(t * 0.9 + 2.2) * 95
    };

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createLinearGradient(p1.x, p1.y, p2.x, p2.y);
    g.addColorStop(0, COL.p1);
    g.addColorStop(1, COL.p2);
    ctx.strokeStyle = g;
    ctx.globalAlpha = 0.28;
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
    ctx.globalAlpha = 0.85;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
    ctx.restore();

    drawOrb(p1, COL.p1);
    drawOrb(p2, COL.p2);

    for (let i = 0; i < 7; i += 1) {
      const a = t * 0.8 + (i * TAU) / 7;
      const orbit = 230 + Math.sin(t * 2 + i) * 18;
      const x = cx + Math.cos(a) * orbit;
      const y = cy + Math.sin(a) * orbit * 0.62;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(t * 2 + i);
      ctx.fillStyle = rgba(COL.core, 0.55 + 0.3 * Math.sin(t * 3 + i));
      diamond(0, 0, 5, 8);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawOrb(p, color) {
    const g = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, 32);
    g.addColorStop(0, 'rgba(255,255,255,0.95)');
    g.addColorStop(0.25, rgba(color, 0.85));
    g.addColorStop(1, rgba(color, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 32, 0, TAU);
    ctx.fill();

    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 12, 0, TAU);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 6, 0, TAU);
    ctx.fill();
  }

  /* ================= HUD ================= */
  function drawHeart(x, y, scale, filled) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.beginPath();
    ctx.moveTo(0, 6);
    ctx.bezierCurveTo(-10, -2, -7, -11, 0, -6);
    ctx.bezierCurveTo(7, -11, 10, -2, 0, 6);
    ctx.closePath();
    if (filled) {
      ctx.fillStyle = '#ff5d7a';
      ctx.shadowColor = '#ff2d55';
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255,220,230,0.8)';
      ctx.lineWidth = 1;
      ctx.stroke();
    } else {
      ctx.strokeStyle = 'rgba(255,120,150,0.35)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
    ctx.restore();
  }

  function pulseHint(p, keyName) {
    if (!p) return '';
    if (p.pulseCd > 0) return keyName + ' 脉冲 · 冷却 ' + p.pulseCd.toFixed(1) + 's';
    if (sync < SYNC_THRESHOLD) return keyName + ' 脉冲 · 同步不足';
    return keyName + ' 脉冲 · 就绪';
  }

  function pulseHintColor(p) {
    if (!p) return 'rgba(150,185,220,0.5)';
    if (sync >= SYNC_THRESHOLD && p.pulseCd <= 0) return 'rgba(190,255,235,0.85)';
    return 'rgba(150,185,220,0.55)';
  }

  function drawHUD() {
    ctx.save();
    ctx.textBaseline = 'middle';

    /* 顶部玻璃渐变 */
    const topFade = ctx.createLinearGradient(0, 0, 0, 86);
    topFade.addColorStop(0, 'rgba(2,6,14,0.62)');
    topFade.addColorStop(0.55, 'rgba(2,6,14,0.22)');
    topFade.addColorStop(1, 'rgba(2,6,14,0)');
    ctx.fillStyle = topFade;
    ctx.fillRect(0, 0, W, 86);

    ctx.fillStyle = 'rgba(4,10,20,0.42)';
    rr(14, 14, MAX_HEARTS * 26 + 10, 32, 16);
    ctx.fill();
    ctx.strokeStyle = rgba(levelAccent, 0.12);
    ctx.lineWidth = 1;
    ctx.stroke();

    for (let i = 0; i < MAX_HEARTS; i += 1) drawHeart(30 + i * 26, 30, 1, i < hearts);

    const ready = totalCores > 0 && collected >= totalCores;
    ctx.fillStyle = 'rgba(4,10,20,0.46)';
    rr(W / 2 - 58, 15, 112, 30, 15);
    ctx.fill();
    ctx.strokeStyle = ready ? rgba(COL.portal, 0.22) : rgba(levelAccent, 0.12);
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.save();
    ctx.translate(W / 2 - 40, 30);
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = ready ? COL.portal : COL.core;
    ctx.shadowColor = ready ? COL.portal : COL.core;
    ctx.shadowBlur = 14;
    rr(-5.5, -5.5, 11, 11, 2);
    ctx.fill();
    ctx.restore();

    ctx.textAlign = 'left';
    ctx.font = '700 17px ' + FONT;
    ctx.fillStyle = '#e8f5ff';
    ctx.fillText(collected + ' / ' + totalCores, W / 2 - 22, 31);

    if (tutorialMode) {
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = '600 13px ' + FONT;
      const guide = TUTORIAL_STEPS[tutorialStep] || TUTORIAL.tip;
      const gw = ctx.measureText(guide).width;
      ctx.fillStyle = 'rgba(6,16,32,0.68)';
      rr(W / 2 - gw / 2 - 20, 47, gw + 40, 26, 13);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,215,106,0.35)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,232,180,0.95)';
      ctx.fillText(guide, W / 2, 60);
      ctx.restore();
    } else {
      const x0 = W / 2 - (LEVELS.length - 1) * 5;
      const x1 = W / 2 + (LEVELS.length - 1) * 5;
      ctx.strokeStyle = 'rgba(160,200,240,0.14)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x0, 54);
      ctx.lineTo(x1, 54);
      ctx.stroke();

      for (let i = 0; i < LEVELS.length; i += 1) {
        const x = x0 + i * 10;
        const active = i === currentLevel;
        ctx.fillStyle = i < currentLevel
          ? 'rgba(123,255,178,0.55)'
          : active ? 'rgba(255,215,106,0.95)' : 'rgba(160,200,240,0.16)';
        if (active) {
          ctx.shadowColor = '#ffd76a';
          ctx.shadowBlur = 9;
        }
        ctx.beginPath();
        ctx.arc(x, 54, active ? 2.8 : 1.9, 0, TAU);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    ctx.textAlign = 'right';
    ctx.font = '600 14px ' + FONT;
    ctx.fillStyle = 'rgba(220,240,255,0.82)';
    const levelName = tutorialMode ? '新手试炼' : LEVELS[Math.min(currentLevel, LEVELS.length - 1)].name;
    ctx.fillText(levelName, W - 26, 25);
    ctx.font = '500 12px ' + FONT;
    ctx.fillStyle = rgba(levelAccent, 0.62);
    ctx.fillText(formatTime(runTime), W - 26, 45);
    if (muted) {
      ctx.font = '500 10px ' + FONT;
      ctx.fillStyle = 'rgba(255,190,120,0.75)';
      ctx.fillText('已静音 · M', W - 26, 64);
    }

    ctx.textAlign = 'left';
    ctx.font = '700 12px ' + FONT;
    ctx.fillStyle = rgba(COL.p1, 0.9);
    ctx.fillText('P1  W A S D', 26, H - 62);
    ctx.font = '500 11px ' + FONT;
    ctx.fillStyle = pulseHintColor(players[0]);
    ctx.fillText(pulseHint(players[0], '空格'), 26, H - 44);

    ctx.textAlign = 'right';
    ctx.font = '700 12px ' + FONT;
    ctx.fillStyle = rgba(COL.p2, 0.9);
    ctx.fillText('P2  方向键', W - 26, H - 62);
    ctx.font = '500 11px ' + FONT;
    ctx.fillStyle = pulseHintColor(players[1]);
    ctx.fillText(pulseHint(players[1], '回车'), W - 26, H - 44);

    const bw = 260;
    const bh = 8;
    const bx = W / 2 - bw / 2;
    const by = H - 32;

    ctx.fillStyle = 'rgba(4,10,22,0.62)';
    rr(bx - 18, by - 30, bw + 36, 50, 12);
    ctx.fill();
    ctx.strokeStyle = rgba(levelAccent, 0.16);
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.font = '600 11px ' + FONT;
    ctx.fillStyle = sync >= SYNC_THRESHOLD ? 'rgba(190,255,235,0.95)' : 'rgba(160,195,230,0.6)';
    let syncLabel = '同步率 ' + Math.round(sync * 100) + '%';
    if (hearts < 3 && healTimer > 0.2) {
      syncLabel += ' · 修复 ' + Math.round((healTimer / 12) * 100) + '%';
    }
    ctx.fillText(syncLabel, W / 2, by - 17);

    ctx.fillStyle = 'rgba(255,255,255,0.07)';
    rr(bx, by, bw, bh, 4);
    ctx.fill();

    ctx.save();
    rr(bx, by, bw, bh, 4);
    ctx.clip();
    const grad = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    grad.addColorStop(0, COL.p1);
    grad.addColorStop(1, COL.p2);
    ctx.fillStyle = sync >= SYNC_THRESHOLD ? grad : 'rgba(100,145,190,0.55)';
    ctx.fillRect(bx, by, bw * clamp(sync, 0, 1), bh);
    ctx.restore();

    const tx = bx + bw * SYNC_THRESHOLD;
    ctx.fillStyle = 'rgba(235,250,255,0.55)';
    ctx.fillRect(tx - 1, by - 3, 2, bh + 6);

    ctx.restore();
  }

  function drawBanners() {
    if (state === 'clear') {
      ctx.save();
      ctx.fillStyle = 'rgba(2,8,18,0.58)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = COL.portal;
      ctx.shadowBlur = 30;
      ctx.fillStyle = '#dfffe9';
      ctx.font = '700 44px ' + FONT;
      ctx.fillText('同 步 完 成', W / 2, H / 2 - 8);
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(180,230,210,0.8)';
      ctx.font = '500 14px ' + FONT;
      const tail = tutorialMode
        ? ' · 试炼完成，准备出发'
        : currentLevel >= LEVELS.length - 1 ? ' · 回路已贯通' : ' · 正在前往下一层回响';
      const clearName = tutorialMode ? '新手试炼' : LEVELS[currentLevel].name;
      ctx.fillText(clearName + tail, W / 2, H / 2 + 34);

      const statLine = '本层 ' + formatTime(levelClearTime) +
        ' · 核心 ' + collected + '/' + totalCores +
        ' · 生命 ' + hearts + '/' + MAX_HEARTS +
        (levelHurt ? '' : ' · 无伤');
      ctx.font = '500 12.5px ' + FONT;
      const statW = ctx.measureText(statLine).width;
      ctx.fillStyle = 'rgba(2,8,18,0.62)';
      rr(W / 2 - statW / 2 - 10, H / 2 + 50, statW + 20, 24, 8);
      ctx.fill();
      ctx.strokeStyle = 'rgba(123,255,178,0.12)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = levelHurt ? 'rgba(185,220,240,0.68)' : 'rgba(160,255,205,0.9)';
      ctx.fillText(statLine, W / 2, H / 2 + 62);
      ctx.restore();
    }

    if (toast.t > 0 && toast.dur > 0 && state === 'playing') {
      const a = clamp(Math.min(toast.t, toast.dur - toast.t) * 5, 0, 1);
      if (a > 0.01) {
        ctx.save();
        ctx.font = '600 14px ' + FONT;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const tw = ctx.measureText(toast.text).width;
        ctx.fillStyle = 'rgba(4,12,26,' + (0.62 * a) + ')';
        rr(W / 2 - tw / 2 - 18, 78, tw + 36, 34, 17);
        ctx.fill();
        ctx.strokeStyle = 'rgba(120,190,255,' + (0.16 * a) + ')';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.fillStyle = 'rgba(215,240,255,' + a + ')';
        ctx.fillText(toast.text, W / 2, 96);
        ctx.restore();
      }
    }
  }

  /* ================= 覆盖层界面 ================= */
  function showToast(text, duration) {
    toast = { text: text, t: duration, dur: duration };
  }

  function showOverlay(html) {
    overlayEl.innerHTML = html;
    overlayEl.classList.remove('hidden');
  }

  function hideOverlay() {
    overlayEl.classList.add('hidden');
    overlayEl.innerHTML = '';
  }

  function startHTML() {
    const coreTotal = LEVELS.reduce((n, L) => n + L.cores.length, 0);
    return '' +
      '<div class="panel">' +
        '<div class="kicker">LOCAL CO-OP · 双人同屏 · ' + LEVELS.length + ' 层 / ' + coreTotal + ' 核心</div>' +
        '<h1>双生回路</h1>' +
        '<p class="sub">一根光绳连接两个灵魂。先完成新手试炼，再收集核心、两人同时踏入传送门，穿过十五层回响。</p>' +
        '<div class="ctrl-grid">' +
          '<div class="ctrl p1">' +
            '<div class="who">P1 · 青</div>' +
            '<div class="keys"><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> 移动</div>' +
            '<div class="keys"><span class="key wide">空格</span> 脉冲</div>' +
          '</div>' +
          '<div class="ctrl p2">' +
            '<div class="who">P2 · 绯</div>' +
            '<div class="keys"><span class="key">↑</span><span class="key">←</span><span class="key">↓</span><span class="key">→</span> 移动</div>' +
            '<div class="keys"><span class="key wide">回车</span> 脉冲</div>' +
          '</div>' +
        '</div>' +
        '<ul class="tips">' +
          '<li><b>光绳</b>扫过核心即可拾取；两人靠近可积累同步率。</li>' +
          '<li>同步率 <b>≥ 55%</b> 才能释放脉冲：眩晕幽影、展开护盾。</li>' +
          '<li>受伤后靠近队友可缓慢修复；两人同时进入传送门即可过关。</li>' +
          '<li>失败后可从当前关重试，也可以在选关界面直接挑战任意一层。</li>' +
        '</ul>' +
        '<div class="actions"><button class="tutorial" data-action="tutorial">新手试炼</button><button data-action="start">开始游戏</button><button class="ghost" data-action="select">选择关卡</button></div>' +
        '<div class="hint">空格 / 回车 开始 · Esc 暂停 · M 静音</div>' +
      '</div>';
  }

  function pauseHTML() {
    const levelTip = tutorialMode
      ? (TUTORIAL_STEPS[tutorialStep] || TUTORIAL.tip)
      : (LEVELS[currentLevel] && LEVELS[currentLevel].tip ? LEVELS[currentLevel].tip : '收集全部核心');
    return '' +
      '<div class="panel">' +
        '<div class="kicker">PAUSED</div>' +
        '<h1 class="small">回路暂停</h1>' +
        '<p class="sub">本层提示：' + levelTip + '。松开手一会儿，也让光绳歇一歇。</p>' +
        '<div class="stats">' +
          '<div><span>关卡</span><b>' + (tutorialMode ? '新手试炼' : (currentLevel + 1) + ' / ' + LEVELS.length) + '</b></div>' +
          '<div><span>核心</span><b>' + collected + ' / ' + totalCores + '</b></div>' +
          '<div><span>用时</span><b>' + formatTime(runTime) + '</b></div>' +
        '</div>' +
        '<div class="actions">' +
          '<button data-action="resume">继续游戏</button>' +
          '<button class="ghost" data-action="replay">重试本关</button>' +
          '<button class="ghost" data-action="select">选择关卡</button>' +
          '<button class="ghost" data-action="restart">从头开始</button>' +
          '<button class="ghost" data-action="title">返回标题</button>' +
        '</div>' +
        '<div class="hint">Esc 继续 · R 重试本关 · M 静音 · T 返回标题</div>' +
      '</div>';
  }

  function gameOverHTML() {
    return '' +
      '<div class="panel end">' +
        '<div class="kicker">CIRCUIT BROKEN</div>' +
        '<h1 class="bad">回路断裂</h1>' +
        '<p class="sub">光绳没有断，只是暂时暗了下去。再试一次。</p>' +
        '<div class="stats">' +
          '<div><span>抵达关卡</span><b>' + Math.min(currentLevel + 1, LEVELS.length) + ' / ' + LEVELS.length + '</b></div>' +
          '<div><span>拾取核心</span><b>' + runCores + ' / ' + runCoresTotal + '</b></div>' +
          '<div><span>总用时</span><b>' + formatTime(runTime) + '</b></div>' +
          '<div><span>无伤关卡</span><b>' + perfectLevels + ' / ' + LEVELS.length + '</b></div>' +
        '</div>' +
        '<div class="actions">' +
          '<button data-action="retry">从本关重试</button>' +
          '<button class="ghost" data-action="select">选择关卡</button>' +
          '<button class="ghost" data-action="restart">从头开始</button>' +
          '<button class="ghost" data-action="title">返回标题</button>' +
        '</div>' +
        '<div class="hint">R 本关重试 · T 返回标题</div>' +
      '</div>';
  }

  function winHTML() {
    return '' +
      '<div class="panel end">' +
        '<div class="kicker">CIRCUIT COMPLETE</div>' +
        '<h1>回路同步完成</h1>' +
        '<p class="sub">十五层回响，一根光绳。你们没有松开彼此。</p>' +
        '<div class="stats">' +
          '<div><span>总用时</span><b>' + formatTime(runTime) + '</b></div>' +
          '<div><span>拾取核心</span><b>' + runCores + ' / ' + runCoresTotal + '</b></div>' +
          '<div><span>剩余生命</span><b>' + hearts + ' / ' + MAX_HEARTS + '</b></div>' +
          '<div><span>无伤关卡</span><b>' + perfectLevels + ' / ' + LEVELS.length + '</b></div>' +
        '</div>' +
        '<div class="actions">' +
          '<button data-action="restart">再来一次</button>' +
          '<button class="ghost" data-action="select">选择关卡</button>' +
          '<button class="ghost" data-action="title">返回标题</button>' +
        '</div>' +
        '<div class="hint">R 再来一次 · T 返回标题</div>' +
      '</div>';
  }

  function levelSelectHTML() {
    let grid = '';
    for (let i = 0; i < LEVELS.length; i += 1) {
      const short = (LEVELS[i].name.split('·')[1] || LEVELS[i].name).trim();
      grid += '<button class="level-btn' + (i === LEVELS.length - 1 ? ' final' : '') + '" data-action="level" data-value="' + i + '">' +
        '<b>' + String(i + 1).padStart(2, '0') + '</b><span>' + short + '</span></button>';
    }
    return '' +
      '<div class="panel">' +
        '<div class="kicker">LEVEL SELECT · ' + LEVELS.length + ' 层</div>' +
        '<h1 class="small">选择关卡</h1>' +
        '<p class="sub">点击任意一层直接开始。每一层都可以挑战，生命和计时会重新计算。</p>' +
        '<div class="level-grid">' + grid + '</div>' +
        '<div class="actions"><button class="tutorial" data-action="tutorial">新手试炼</button><button data-action="start">从第一关开始</button><button class="ghost" data-action="title">返回标题</button></div>' +
        '<div class="hint">Esc / T 返回标题</div>' +
      '</div>';
  }

  function showLevelSelect() {
    state = 'select';
    keys.clear();
    showOverlay(levelSelectHTML());
  }

  function tutorialIntroHTML() {
    return '' +
      '<div class="panel">' +
        '<div class="kicker">TUTORIAL · 新手试炼</div>' +
        '<h1 class="small">新手试炼</h1>' +
        '<p class="sub">这一局没有幽影和激光。先学会移动、拾取和汇合，再进入正式回路。</p>' +
        '<ul class="tips">' +
          '<li><b>P1</b> 用 <b>W A S D</b>，<b>P2</b> 用 <b>方向键</b>，各自先走几步。</li>' +
          '<li><b>光绳</b>扫过金色核心就能拾取，不必两个人都碰到。</li>' +
          '<li>收齐 3 颗核心后，两人<b>同时走进传送门</b>。</li>' +
          '<li>正式关卡里有幽影和激光；受伤后靠近队友可修复，同步率 ≥ 55% 可放脉冲。</li>' +
        '</ul>' +
        '<div class="actions"><button class="tutorial" data-action="tutorialStart">开始试炼</button><button class="ghost" data-action="title">返回标题</button></div>' +
        '<div class="hint">空格 / 回车 开始 · Esc 返回</div>' +
      '</div>';
  }

  function showTutorialIntro() {
    state = 'tutorialIntro';
    keys.clear();
    showOverlay(tutorialIntroHTML());
  }

  function tutorialDoneHTML() {
    return '' +
      '<div class="panel end">' +
        '<div class="kicker">TUTORIAL COMPLETE</div>' +
        '<h1>试炼完成</h1>' +
        '<p class="sub">光绳已经握稳，请开始你的冒险吧。</p>' +
        '<div class="stats">' +
          '<div><span>试炼用时</span><b>' + formatTime(runTime) + '</b></div>' +
          '<div><span>拾取核心</span><b>' + runCores + ' / ' + runCoresTotal + '</b></div>' +
          '<div><span>下一步</span><b>第一关</b></div>' +
        '</div>' +
        '<div class="actions">' +
          '<button data-action="adventure">进入第一关</button>' +
          '<button class="ghost" data-action="select">选择关卡</button>' +
          '<button class="ghost" data-action="title">返回标题</button>' +
        '</div>' +
        '<div class="hint">空格 / 回车 开始冒险 · T 返回标题</div>' +
      '</div>';
  }

  function showTutorialComplete() {
    state = 'tutorialDone';
    keys.clear();
    showOverlay(tutorialDoneHTML());
    tone(523.25, 0.22, 'sine', 0.05);
    tone(659.25, 0.22, 'sine', 0.05, null, 0.1);
    tone(783.99, 0.3, 'sine', 0.05, null, 0.2);
    tone(1046.5, 0.55, 'sine', 0.045, null, 0.3);
  }

  function showStartScreen() {
    state = 'start';
    tutorialMode = false;
    activeLevel = null;
    tutorialStep = 0;
    players = [];
    cores = [];
    sentinels = [];
    lasers = [];
    walls = [];
    portal = null;
    particles = [];
    showOverlay(startHTML());
  }

  /* ================= 主循环 ================= */
  let last = performance.now();

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.033);
    last = now;
    if (state !== 'paused') time += dt;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  showStartScreen();
  requestAnimationFrame(frame);

  /* 快速开始：?play=1/2/3 可直接进入对应关卡 */
  const playArg = new URLSearchParams(location.search).get('play');
  if (playArg) {
    const jumpLevel = parseInt(playArg, 10);
    if (jumpLevel >= 1 && jumpLevel <= LEVELS.length) {
      currentLevel = jumpLevel - 1;
      runTime = 0;
      runCores = 0;
      runCoresTotal = 0;
      hearts = MAX_HEARTS;
      particles.length = 0;
      hurtCooldown = 0;
      loadLevel(currentLevel);
    }
  }
})();
</script>
