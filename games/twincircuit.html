<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>双生回路 · 双人合作小游戏</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow: hidden;
    background:
      radial-gradient(1100px 620px at 50% 12%, rgba(22, 74, 140, 0.30), transparent 62%),
      radial-gradient(760px 480px at 84% 90%, rgba(120, 30, 110, 0.18), transparent 66%),
      #02040a;
    color: #e9f4ff;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #stage {
    position: relative;
    width: min(94vw, 146vh, 1180px);
    aspect-ratio: 960 / 600;
    border-radius: 20px;
    overflow: hidden;
    background: #040a16;
    box-shadow:
      0 0 0 1px rgba(96, 178, 255, 0.16),
      0 0 90px rgba(20, 90, 200, 0.22),
      0 40px 90px rgba(0, 0, 0, 0.70);
  }
  canvas { display: block; width: 100%; height: 100%; }

  #overlay {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: grid;
    place-items: center;
    padding: clamp(12px, 2.4vw, 30px);
    background:
      radial-gradient(circle at 50% 26%, rgba(12, 42, 82, 0.32), rgba(1, 4, 10, 0.76) 68%),
      rgba(1, 4, 10, 0.30);
    backdrop-filter: blur(9px);
    -webkit-backdrop-filter: blur(9px);
  }
  #overlay.hidden { display: none; }

  .panel {
    position: relative;
    width: min(690px, 100%);
    max-height: 96%;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: clamp(20px, 3vw, 34px) clamp(22px, 4vw, 42px);
    border-radius: 22px;
    background:
      radial-gradient(120% 88% at 50% 0%, rgba(40, 105, 190, 0.20), rgba(5, 10, 22, 0) 58%),
      linear-gradient(160deg, rgba(14, 28, 52, 0.96), rgba(5, 10, 22, 0.97));
    border: 1px solid rgba(120, 200, 255, 0.22);
    box-shadow:
      0 30px 90px rgba(0, 0, 0, 0.60),
      0 0 70px rgba(50, 140, 255, 0.07),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
    text-align: center;
    animation: panel-in 0.35s cubic-bezier(0.2, 0.85, 0.3, 1);
  }
  .panel::before {
    content: "";
    position: absolute;
    left: 12%;
    right: 12%;
    top: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(96, 220, 255, 0.62), transparent);
    pointer-events: none;
  }
  @keyframes panel-in {
    from { opacity: 0; transform: translateY(10px) scale(0.985); }
    to { opacity: 1; transform: none; }
  }
  .panel::-webkit-scrollbar { width: 6px; }
  .panel::-webkit-scrollbar-thumb { background: rgba(120, 190, 255, 0.22); border-radius: 3px; }

  .kicker {
    font-size: 11px;
    letter-spacing: 0.32em;
    color: rgba(140, 200, 255, 0.65);
    text-indent: 0.32em;
  }
  h1 {
    margin: 8px 0 6px;
    font-size: clamp(32px, 4.6vw, 50px);
    line-height: 1.15;
    letter-spacing: 0.14em;
    text-indent: 0.14em;
    background: linear-gradient(90deg, #4de3ff 0%, #a78bfa 52%, #ff5ec8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 26px rgba(80, 200, 255, 0.25));
  }
  h1.small { font-size: clamp(28px, 3.6vw, 38px); }
  h1.bad {
    background: linear-gradient(90deg, #ff9a8a 0%, #ff2d55 58%, #ff7ba8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 26px rgba(255, 70, 110, 0.28));
  }
  .sub {
    margin: 6px auto 18px;
    max-width: 540px;
    font-size: 13.5px;
    line-height: 1.85;
    color: rgba(200, 225, 250, 0.72);
  }

  .ctrl-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 16px 0 14px;
  }
  .ctrl {
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(10, 22, 40, 0.62);
    border: 1px solid rgba(120, 180, 255, 0.14);
    text-align: left;
  }
  .ctrl.p1 { border-left: 3px solid #4de3ff; }
  .ctrl.p2 { border-left: 3px solid #ff5ec8; }
  .who {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.16em;
    margin-bottom: 8px;
  }
  .ctrl.p1 .who { color: #4de3ff; }
  .ctrl.p2 .who { color: #ff5ec8; }
  .keys {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 6px;
    font-size: 12px;
    color: rgba(200, 225, 250, 0.72);
  }
  .key {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 26px;
    height: 24px;
    padding: 0 7px;
    border-radius: 6px;
    background: #0b1a2e;
    border: 1px solid rgba(140, 200, 255, 0.22);
    box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.35), 0 1px 0 rgba(255, 255, 255, 0.05);
    font-size: 11px;
    color: rgba(225, 242, 255, 0.9);
  }
  .key.wide { padding: 0 12px; }

  .tips {
    margin: 4px 0 20px;
    padding: 0;
    list-style: none;
    text-align: left;
    font-size: 12.5px;
    line-height: 1.9;
    color: rgba(190, 220, 250, 0.66);
  }
  .tips li { position: relative; padding-left: 16px; }
  .tips li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0.82em;
    width: 5px;
    height: 5px;
    border-radius: 1px;
    background: #4de3ff;
    opacity: 0.75;
    transform: rotate(45deg);
  }
  .tips b { color: rgba(226, 243, 255, 0.94); font-weight: 600; }

  .actions {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 4px;
  }
  button {
    appearance: none;
    padding: 12px 32px;
    border-radius: 999px;
    border: 1px solid rgba(120, 220, 255, 0.48);
    background: linear-gradient(180deg, rgba(40, 150, 255, 0.38), rgba(30, 100, 255, 0.16));
    color: #eaf8ff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-indent: 0.16em;
    cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 6px 18px rgba(30, 100, 255, 0.12);
    transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
  }
  button:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 32px rgba(70, 190, 255, 0.35);
    background: linear-gradient(180deg, rgba(50, 170, 255, 0.5), rgba(30, 100, 255, 0.22));
  }
  button:active { transform: translateY(0); }
  button.ghost {
    border-color: rgba(140, 180, 220, 0.22);
    background: rgba(10, 22, 40, 0.5);
    color: rgba(200, 225, 250, 0.75);
  }
  button.ghost:hover { box-shadow: 0 0 22px rgba(70, 160, 255, 0.18); }
  button.tutorial {
    border-color: rgba(255, 215, 106, 0.45);
    background: linear-gradient(180deg, rgba(255, 190, 80, 0.30), rgba(160, 100, 20, 0.14));
    color: #fff3cf;
  }
  button.tutorial:hover {
    box-shadow: 0 0 34px rgba(255, 190, 80, 0.32);
    background: linear-gradient(180deg, rgba(255, 200, 90, 0.42), rgba(170, 105, 20, 0.2));
  }
  .hint {
    margin-top: 13px;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    color: rgba(140, 180, 220, 0.45);
  }

  .stats {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin: 20px 0 24px;
  }
  .stats > div {
    flex: 1;
    max-width: 160px;
    padding: 12px 10px;
    border-radius: 12px;
    background: rgba(10, 22, 40, 0.55);
    border: 1px solid rgba(120, 180, 255, 0.12);
  }
  .stats span {
    display: block;
    margin-bottom: 6px;
    font-size: 10.5px;
    letter-spacing: 0.12em;
    color: rgba(140, 180, 220, 0.55);
  }
  .stats b {
    font-size: 18px;
    letter-spacing: 0.04em;
    color: #eaf7ff;
  }
  .end .sub { margin-bottom: 4px; }

  .level-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 9px;
    margin: 18px 0 20px;
  }
  .level-btn {
    appearance: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 9px 4px 8px;
    border-radius: 11px;
    border: 1px solid rgba(120, 180, 255, 0.16);
    background: linear-gradient(180deg, rgba(18, 38, 66, 0.72), rgba(8, 18, 34, 0.66));
    color: #eaf7ff;
    font-family: inherit;
    letter-spacing: 0.02em;
    text-indent: 0;
    cursor: pointer;
    transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
  }
  .level-btn b {
    font-size: 16px;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
    color: #dff3ff;
  }
  .level-btn span {
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 10px;
    color: rgba(170, 205, 240, 0.62);
  }
  .level-btn:hover {
    transform: translateY(-1px);
    border-color: rgba(120, 220, 255, 0.55);
    background: rgba(22, 58, 100, 0.66);
    box-shadow: 0 0 22px rgba(70, 190, 255, 0.22);
  }
  .level-btn.final {
    border-color: rgba(255, 215, 106, 0.38);
  }
  .level-btn.final b { color: #ffe6a3; }

  @media (max-width: 560px) {
    .ctrl-grid { grid-template-columns: 1fr; }
    .stats { flex-wrap: wrap; }
    .stats > div { min-width: 120px; }
    .panel { padding: 20px 18px; }
    .level-grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>

<body>

<script>
(() => {

    const d = DIFFICULTIES[mode] || DIFFICULTIES.casual;

    HAZARD_HIT_PAD = d.hazardHitPad;
    LASER_HIT_PAD = d.laserHitPad;
    SYNC_THRESHOLD = d.syncThreshold;
    PULSE_COST = d.pulseCost;
    PULSE_CD = d.pulseCd;
    PULSE_RADIUS = d.pulseRadius;
    PULSE_STUN = d.pulseStun;
    PULSE_SHIELD = d.pulseShield;
  }

  /* ================= 工具函数 ================= */
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);
  const dist = (x1, y1, x2, y2) => Math.hypot(x1 - x2, y1 - y2);

  function rgba(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  function rr(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function diamond(x, y, rx, ry) {
    ctx.beginPath();
    ctx.moveTo(x, y - ry);
    ctx.lineTo(x + rx, y);
    ctx.lineTo(x, y + ry);
    ctx.lineTo(x - rx, y);
    ctx.closePath();
  }

  function distToSegment(px, py, ax, ay, bx, by) {
    const dx = bx - ax;
    const dy = by - ay;
    const len2 = dx * dx + dy * dy;
    let t = len2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
    t = clamp(t, 0, 1);
    const cx = ax + dx * t;
    const cy = ay + dy * t;
    return Math.hypot(px - cx, py - cy);
  }

  function formatTime(sec) {
    const s = Math.max(0, Math.floor(sec));
    const m = Math.floor(s / 60);
    return String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }

  /* 星云与深空底图只画一次，之后每帧贴图 */
  const bgLayer = document.createElement('canvas');
  bgLayer.width = W;
  bgLayer.height = H;
  (function buildNebula() {
    const b = bgLayer.getContext('2d');
    const base = b.createRadialGradient(W * 0.5, H * 0.34, 50, W * 0.5, H * 0.54, 780);
    base.addColorStop(0, '#0c1f3d');
    base.addColorStop(0.46, '#071022');
    base.addColorStop(1, '#02040a');
    b.fillStyle = base;
    b.fillRect(0, 0, W, H);

    const blobs = [
      [W * 0.18, H * 0.24, 300, '#1d4cff', 0.16],
      [W * 0.82, H * 0.16, 280, '#6a2dff', 0.14],
      [W * 0.64, H * 0.84, 340, '#0aa6c8', 0.11],
      [W * 0.12, H * 0.82, 260, '#ff2d8a', 0.07],
      [W * 0.5, H * 0.5, 430, '#0b2a55', 0.18],
      [W * 0.38, H * 0.66, 220, '#2a6cff', 0.09]
    ];
    b.globalCompositeOperation = 'lighter';
    for (const [x, y, r, color, alpha] of blobs) {
      const g = b.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, rgba(color, alpha));
      g.addColorStop(0.55, rgba(color, alpha * 0.42));
      g.addColorStop(1, rgba(color, 0));
      b.fillStyle = g;
      b.beginPath();
      b.arc(x, y, r, 0, TAU);
      b.fill();
    }

    /* 极淡的深空轨道线 */
    b.globalCompositeOperation = 'source-over';
    b.strokeStyle = 'rgba(96,164,255,0.05)';
    b.lineWidth = 1;
    for (let i = 0; i < 5; i += 1) {
      b.beginPath();
      b.ellipse(W * 0.5, H * 0.54, 190 + i * 74, (190 + i * 74) * 0.48, -0.24, 0, TAU);
      b.stroke();
    }

    /* 星尘颗粒 */
    for (let i = 0; i < 260; i += 1) {
      const x = Math.random() * W;
      const y = Math.random() * H;
      const r = rand(0.3, 1.1);
      b.fillStyle = 'rgba(180,214,255,' + rand(0.05, 0.22).toFixed(3) + ')';
      b.beginPath();
      b.arc(x, y, r, 0, TAU);
      b.fill();
    }
  })();
