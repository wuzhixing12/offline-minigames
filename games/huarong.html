<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070d18">
<title>数字华容道 · 离线小游戏</title>
<style>
  :root{
    --text:#eaf2ff;
    --muted:#8ea3bd;
    --line:rgba(148,163,184,.16);
    --cyan:#38bdf8;
    --violet:#818cf8;
    --pink:#f472b6;
    --board:min(86vw, 500px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:22px 16px 26px;
    color:var(--text);
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
    background:
      radial-gradient(900px 620px at 8% -6%, rgba(56,189,248,.16), transparent 62%),
      radial-gradient(760px 560px at 102% 104%, rgba(236,72,153,.13), transparent 62%),
      radial-gradient(720px 520px at 50% 48%, rgba(99,102,241,.10), transparent 68%),
      #070d18;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  button{font:inherit;color:inherit;}

  .app{
    width:min(100%, 720px);
    display:flex;flex-direction:column;gap:16px;
  }

  .topbar{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:16px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:13px;min-width:0;}
  .logo{
    width:54px;height:54px;flex:0 0 auto;border-radius:16px;
    display:grid;place-items:center;
    font-size:20px;font-weight:900;letter-spacing:-.05em;color:#e9fdff;
    background:linear-gradient(150deg,#22d3ee,#6366f1 55%,#ec4899);
    box-shadow:0 12px 28px rgba(56,189,248,.26), inset 0 1px 0 rgba(255,255,255,.32);
    position:relative;overflow:hidden;
  }
  .logo::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.34) 48%,transparent 64%);
    transform:translateX(-120%);
    animation:sheen 4.6s ease-in-out infinite;
  }
  @keyframes sheen{0%,55%{transform:translateX(-120%);}78%,100%{transform:translateX(120%);}}
  h1{
    margin:0;font-size:clamp(22px,4.2vw,28px);font-weight:800;letter-spacing:.04em;
    background:linear-gradient(100deg,#f0f9ff,#a5f3fc 42%,#c7d2fe 72%,#f9a8d4);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brand p{margin:5px 0 0;font-size:12.5px;color:var(--muted);letter-spacing:.02em;}

  .stats{display:flex;gap:8px;flex-wrap:wrap;}
  .stat{
    min-width:76px;padding:9px 13px;border-radius:13px;
    background:rgba(255,255,255,.045);
    border:1px solid var(--line);
    backdrop-filter:blur(8px);
  }
  .stat span{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em;}
  .stat b{display:block;margin-top:3px;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;}

  .stage{
    display:flex;justify-content:center;
    padding:14px 0 2px;
  }
  .board-shell{
    width:var(--board);
    padding:clamp(9px,1.9vw,14px);
    border-radius:26px;
    position:relative;
    background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.022));
    border:1px solid rgba(255,255,255,.10);
    box-shadow:0 28px 70px rgba(0,0,0,.46), inset 0 1px 0 rgba(255,255,255,.10);
  }
  .board-shell::before{
    content:"";position:absolute;inset:-1px;border-radius:27px;pointer-events:none;
    background:linear-gradient(130deg,rgba(56,189,248,.34),transparent 34%,transparent 66%,rgba(236,72,153,.30));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;padding:1px;
  }
  .board{
    position:relative;width:100%;aspect-ratio:1/1;
    border-radius:17px;
    background:
      radial-gradient(circle at 30% 20%, rgba(56,189,248,.10), transparent 60%),
      linear-gradient(160deg,#0a1424,#070d19 62%,#091120);
    box-shadow:inset 0 0 0 1px rgba(148,163,184,.10), inset 0 18px 40px rgba(0,0,0,.32);
    overflow:hidden;
    touch-action:none;
    user-select:none;
  }

  .cell-slot{
    position:absolute;border-radius:12%;
    background:rgba(255,255,255,.03);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.045);
  }

  .tile{
    position:absolute;left:0;top:0;
    display:grid;place-items:center;
    border-radius:12%;
    cursor:pointer;
    font-weight:800;font-variant-numeric:tabular-nums;
    color:#f8fbff;
    background:
      linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,0) 46%),
      linear-gradient(150deg,var(--c1),var(--c2));
    box-shadow:
      0 10px 20px rgba(2,8,23,.42),
      inset 0 1px 0 rgba(255,255,255,.44),
      inset 0 -2px 0 rgba(0,0,0,.20);
    transition:transform .16s cubic-bezier(.2,.75,.25,1), box-shadow .18s ease, filter .18s ease;
    will-change:transform;
    text-shadow:0 1px 2px rgba(5,10,25,.28);
  }
  .tile::after{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(120% 90% at 20% 0%,rgba(255,255,255,.22),transparent 52%);
  }
  .tile:hover{filter:brightness(1.09);box-shadow:0 13px 26px rgba(2,8,23,.5), inset 0 1px 0 rgba(255,255,255,.5);}
  .tile:active{filter:brightness(1.16);}
  .tile.movable{cursor:pointer;}
  .tile.locked{cursor:default;}
  .tile.pop{animation:pop .24s ease;}
  @keyframes pop{0%{filter:brightness(1.5);}100%{filter:brightness(1);}}
  .tile.hint{
    animation:hintPulse .65s ease-in-out 2;
    box-shadow:0 0 0 3px rgba(250,204,21,.9), 0 0 26px rgba(250,204,21,.55), inset 0 1px 0 rgba(255,255,255,.5) !important;
  }
  @keyframes hintPulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.32);}}

  .board.won .tile{animation:winGlow 1.1s ease-in-out infinite alternate;}
  @keyframes winGlow{from{filter:brightness(1);}to{filter:brightness(1.22);}}

  .win{
    position:absolute;inset:0;z-index:8;
    display:none;align-items:center;justify-content:center;
    padding:18px;
    background:rgba(3,8,18,.72);
    backdrop-filter:blur(7px);
    border-radius:17px;
    overflow:hidden;
  }
  .win.on{display:flex;animation:fadeIn .28s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .win-card{
    position:relative;z-index:2;width:min(100%,330px);
    padding:26px 24px 22px;border-radius:22px;text-align:center;
    background:linear-gradient(180deg,rgba(15,26,46,.98),rgba(8,15,30,.98));
    border:1px solid rgba(125,211,252,.25);
    box-shadow:0 26px 70px rgba(0,0,0,.55), 0 0 44px rgba(56,189,248,.13);
    transform:translateY(8px);animation:rise .32s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes rise{to{transform:none;}}
  .win-kicker{font-size:12px;letter-spacing:.22em;color:#7dd3fc;font-weight:700;}
  .win-title{
    margin:10px 0 4px;font-size:32px;font-weight:900;letter-spacing:.08em;
    background:linear-gradient(100deg,#a5f3fc,#c7d2fe,#f9a8d4);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .win-sub{margin:0 0 16px;font-size:13px;color:var(--muted);}
  .win-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px;}
  .win-grid div{padding:10px 8px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);}
  .win-grid span{display:block;font-size:11px;color:var(--muted);}
  .win-grid b{display:block;margin-top:3px;font-size:18px;font-variant-numeric:tabular-nums;}

  .panel{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .seg{
    display:flex;gap:4px;padding:4px;border-radius:14px;
    background:rgba(255,255,255,.045);border:1px solid var(--line);
  }
  .seg button{
    border:0;background:transparent;color:var(--muted);
    padding:9px 15px;border-radius:10px;font-size:13px;font-weight:700;
    cursor:pointer;transition:all .18s ease;letter-spacing:.03em;
  }
  .seg button:hover{color:#dbeafe;background:rgba(255,255,255,.055);}
  .seg button.on{
    color:#04121f;
    background:linear-gradient(135deg,#67e8f9,#93c5fd);
    box-shadow:0 5px 16px rgba(56,189,248,.3);
  }
  .actions{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{
    border:1px solid rgba(148,163,184,.20);
    background:rgba(255,255,255,.045);
    color:#dbeafe;padding:10px 17px;border-radius:12px;
    font-size:13px;font-weight:700;cursor:pointer;letter-spacing:.03em;
    transition:all .18s ease;
  }
  .btn:hover{background:rgba(255,255,255,.085);border-color:rgba(148,163,184,.35);transform:translateY(-1px);}
  .btn.primary{
    color:#04121f;border:0;
    background:linear-gradient(135deg,#22d3ee,#818cf8 58%,#f472b6);
    box-shadow:0 10px 24px rgba(99,102,241,.30);
  }
  .btn.primary:hover{filter:brightness(1.06);box-shadow:0 13px 30px rgba(99,102,241,.4);}
  .btn:disabled{opacity:.36;cursor:not-allowed;transform:none;filter:none;}
  .btn:disabled:hover{background:rgba(255,255,255,.045);border-color:rgba(148,163,184,.20);}

  .hint{margin:0;text-align:center;font-size:12px;color:#748aa5;letter-spacing:.03em;min-height:16px;}
  .achline{font-size:11.5px;color:#7f96b4;letter-spacing:.08em;text-align:center;margin:0;}

  .confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
  .confetti i{
    position:absolute;top:-12px;width:7px;height:12px;border-radius:2px;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{transform:translate3d(var(--dx),var(--dy),0) rotate(var(--rot));opacity:0;}
  }

  @media (max-width:620px){
    body{align-items:flex-start;padding-top:18px;}
    .app{gap:13px;}
    .logo{width:46px;height:46px;border-radius:14px;font-size:17px;}
    .brand p{font-size:11.5px;}
    .stats{width:100%;}
    .stat{flex:1;min-width:0;padding:8px 10px;}
    .stat b{font-size:15.5px;}
    .panel{justify-content:center;}
    .actions{width:100%;justify-content:center;}
    .actions .btn{flex:1;}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">15</div>
      <div>
        <h1>数字华容道</h1>
        <p>滑动数字，把 1 到 <span id="goal">15</span> 依次排好</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span>步数</span><b id="moves">0</b></div>
      <div class="stat"><span>时间</span><b id="time">00:00</b></div>
      <div class="stat"><span>下限</span><b id="lower">—</b></div>
      <div class="stat"><span>最佳</span><b id="best">—</b></div>
    </div>
  </header>

  <div class="stage">
    <div class="board-shell">
      <div class="board" id="board" aria-label="数字华容道棋盘">
        <div class="win" id="win">
          <div class="win-card">
            <div class="win-kicker">PUZZLE SOLVED</div>
            <h2 class="win-title">复原完成</h2>
            <p class="win-sub" id="win-sub">漂亮，每一步都算数</p>
            <div class="win-grid">
              <div><span>步数</span><b id="win-moves">0</b></div>
              <div><span>用时</span><b id="win-time">00:00</b></div>
              <div><span>理论下限</span><b id="win-lower">0</b></div>
              <div><span>评级</span><b id="win-rank">S</b></div>
            </div>
            <button class="btn primary" id="win-again" style="width:100%">再来一局</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="seg" id="sizes" role="group" aria-label="棋盘尺寸">
      <button type="button" data-size="3">3 × 3</button>
      <button type="button" data-size="4" class="on">4 × 4</button>
      <button type="button" data-size="5">5 × 5</button>
      <button type="button" data-size="daily">每日</button>
    </div>
    <div class="actions">
      <button type="button" class="btn primary" id="shuffle">重新打乱</button>
      <button type="button" class="btn" id="restart">重开本局</button>
      <button type="button" class="btn" id="undo">撤销</button>
      <button type="button" class="btn" id="redo">重做</button>
      <button type="button" class="btn" id="hint-btn">提示</button>
    </div>
  </div>

  <p class="hint" id="hint-line">拖动或轻扫棋盘即可滑动方块，也可以点数字或用 ↑ ↓ ← → 键 · Ctrl+Z 撤销</p>
  <div class="achline" id="achline">成就 0 / 8</div>
</div>

<script>
(function () {
  'use strict';

  var boardEl = document.getElementById('board');
  var winEl = document.getElementById('win');
  var movesEl = document.getElementById('moves');
  var timeEl = document.getElementById('time');
  var bestEl = document.getElementById('best');
  var goalEl = document.getElementById('goal');
  var winMovesEl = document.getElementById('win-moves');
  var winTimeEl = document.getElementById('win-time');
  var winSubEl = document.getElementById('win-sub');
  var lowerEl = document.getElementById('lower');
  var winLowerEl = document.getElementById('win-lower');
  var winRankEl = document.getElementById('win-rank');
  var achlineEl = document.getElementById('achline');
  var hintLineEl = document.getElementById('hint-line');
  var undoBtn = document.getElementById('undo');
  var redoBtn = document.getElementById('redo');
  var hintBtn = document.getElementById('hint-btn');

  var N = 4;
  var total = N * N;
  var tiles = [];
  var els = {};
  var blank = total - 1;
  var moves = 0;
  var startedAt = 0;
  var elapsed = 0;
  var timerId = 0;
  var solved = true;
  var locked = false;
  var cellPx = 0;
  var gapPx = 0;
  var initial = null;
  var BEST_KEY = 'tx_huarong_best_v1';
  var dailyMode = false;
  var history = [];
  var redoStack = [];
  var lowerBound = 0;
  var hintUsed = false;
  var hintTimerId = 0;
  var ACH_KEY = 'tx_huarong_ach_v1';
  var achData = {};
  var ACH_LIST = [
    { id: 'first',    name: '初出茅庐', desc: '完成任意一局' },
    { id: 'three',    name: '小试身手', desc: '完成 3 × 3' },
    { id: 'four',     name: '标准难度', desc: '完成 4 × 4' },
    { id: 'five',     name: '硬核玩家', desc: '完成 5 × 5' },
    { id: 'daily',    name: '今日份',   desc: '完成每日挑战' },
    { id: 'hintless', name: '一步不差', desc: '不用提示通关 4 × 4 或更大' },
    { id: 'rankS',    name: '效率至上', desc: '拿到 S 评级' },
    { id: 'speed',    name: '光速复原', desc: '3 × 3 在 30 秒内完成' }
  ];

  function loadBest() {
    try {
      var v = JSON.parse(localStorage.getItem(BEST_KEY) || '{}');
      return (v && typeof v === 'object') ? v : {};
    } catch (e) { return {}; }
  }
  function saveBest(v) {
    try { localStorage.setItem(BEST_KEY, JSON.stringify(v)); } catch (e) {}
  }
  function pruneBest(b) {
    var keep = 'daily-' + dailySeed();
    for (var k in b) {
      if (k.indexOf('daily-') === 0 && k !== keep) delete b[k];
    }
    return b;
  }

  function dailySeed() {
    var d = new Date();
    return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function loadAch() {
    try {
      var v = JSON.parse(localStorage.getItem(ACH_KEY) || '{}');
      return (v && typeof v === 'object') ? v : {};
    } catch (e) { return {}; }
  }
  function saveAch() {
    try { localStorage.setItem(ACH_KEY, JSON.stringify(achData)); } catch (e) {}
  }
  function achCount() {
    var n = 0;
    for (var k in achData) if (achData[k]) n++;
    return n;
  }
  function renderAch() {
    if (!achlineEl) return;
    achlineEl.textContent = '成就 ' + achCount() + ' / ' + ACH_LIST.length +
      (achCount() === ACH_LIST.length ? ' · 全部解锁' : '');
  }
  function unlockAch(id) {
    if (achData[id]) return;
    achData[id] = 1;
    saveAch();
    renderAch();
    var a = null;
    for (var i = 0; i < ACH_LIST.length; i++) if (ACH_LIST[i].id === id) a = ACH_LIST[i];
    if (a) {
      var prev = winSubEl.textContent;
      winSubEl.textContent = '成就解锁 · ' + a.name;
      setTimeout(function () {
        if (winEl.classList.contains('on')) winSubEl.textContent = prev;
      }, 1500);
    }
  }

  function manhattan() {
    var sum = 0;
    for (var i = 0; i < total; i++) {
      var v = tiles[i];
      if (!v) continue;
      var gr = Math.floor((v - 1) / N), gc = (v - 1) % N;
      sum += Math.abs(rowOf(i) - gr) + Math.abs(colOf(i) - gc);
    }
    return sum;
  }
  function lowerAfter(idx) {
    var v = tiles[idx];
    if (!v) return manhattan();
    var gr = Math.floor((v - 1) / N), gc = (v - 1) % N;
    return manhattan()
      + Math.abs(rowOf(blank) - gr) + Math.abs(colOf(blank) - gc)
      - (Math.abs(rowOf(idx) - gr) + Math.abs(colOf(idx) - gc));
  }

  function rowOf(i) { return Math.floor(i / N); }
  function colOf(i) { return i % N; }

  function fmt(sec) {
    sec = Math.max(0, Math.floor(sec));
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  function measure() {
    var w = boardEl.clientWidth || 1;
    gapPx = Math.max(3, Math.round(w * 0.018));
    cellPx = (w - gapPx * (N + 1)) / N;
  }

  function clearSlots() {
    var slots = boardEl.querySelectorAll('.cell-slot');
    for (var i = 0; i < slots.length; i++) slots[i].parentNode.removeChild(slots[i]);
  }

  function layout(animate) {
    var w = boardEl.clientWidth;
    if (!w) return;
    measure();
    var font = Math.max(13, Math.round(cellPx * (N === 5 ? 0.36 : 0.40)));

    for (var v = 1; v < total; v++) {
      var el = els[v];
      var idx = tiles.indexOf(v);
      if (!el || idx < 0) continue;
      var x = gapPx + colOf(idx) * (cellPx + gapPx);
      var y = gapPx + rowOf(idx) * (cellPx + gapPx);
      if (!animate) el.style.transition = 'none';
      el.style.width = cellPx + 'px';
      el.style.height = cellPx + 'px';
      el.style.fontSize = font + 'px';
      el.style.borderRadius = Math.round(cellPx * 0.13) + 'px';
      el.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
      if (!animate) {
        void el.offsetWidth;
        el.style.transition = '';
      }
    }
  }

  function rebuildSlots() {
    clearSlots();
    measure();
    for (var r = 0; r < N; r++) {
      for (var c = 0; c < N; c++) {
        var s = document.createElement('div');
        s.className = 'cell-slot';
        s.style.width = cellPx + 'px';
        s.style.height = cellPx + 'px';
        s.style.left = (gapPx + c * (cellPx + gapPx)) + 'px';
        s.style.top = (gapPx + r * (cellPx + gapPx)) + 'px';
        boardEl.insertBefore(s, boardEl.firstChild);
      }
    }
  }

  function buildTiles() {
    for (var v = 1; v < total; v++) {
      var el = document.createElement('button');
      el.type = 'button';
      el.className = 'tile';
      el.textContent = String(v);
      el.setAttribute('aria-label', '数字 ' + v);
      var hue = 190 + (v / Math.max(1, total - 1)) * 145;
      el.style.setProperty('--c1', 'hsl(' + hue + ' 88% 58%)');
      el.style.setProperty('--c2', 'hsl(' + (hue + 16) + ' 82% 40%)');
      el.dataset.value = v;
      el.addEventListener('click', onTileClick);
      els[v] = el;
      boardEl.appendChild(el);
    }
  }

  function onTileClick(e) {
    e.preventDefault();
    if (dragMoved) { dragMoved = false; return; }
    if (locked || solved) return;
    var v = parseInt(this.dataset.value, 10);
    tryMove(v);
  }

  function isAdjacent(a, b) {
    var ar = rowOf(a), ac = colOf(a), br = rowOf(b), bc = colOf(b);
    return Math.abs(ar - br) + Math.abs(ac - bc) === 1;
  }

  function vibrate(ms) {
    if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} }
  }

  function doMove(value, record) {
    if (locked || solved) return false;
    var idx = tiles.indexOf(value);
    if (idx < 0 || !isAdjacent(idx, blank)) return false;

    if (!startedAt) startTimer();

    var el = els[value];
    // animate via CSS transition
    var tmp = tiles[idx];
    tiles[idx] = tiles[blank];
    tiles[blank] = tmp;
    blank = idx;

    var x = gapPx + colOf(idx) * (cellPx + gapPx);
    var y = gapPx + rowOf(idx) * (cellPx + gapPx);
    el.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
    el.classList.remove('pop');
    void el.offsetWidth;
    el.classList.add('pop');

    if (record) {
      history.push(value);
      redoStack = [];
      moves++;
      movesEl.textContent = String(moves);
      updateHistoryButtons();
    }
    vibrate(8);
    checkWin();
    return true;
  }

  function tryMove(value) {
    return doMove(value, true);
  }

  function updateHistoryButtons() {
    if (undoBtn) undoBtn.disabled = solved || !history.length;
    if (redoBtn) redoBtn.disabled = solved || !redoStack.length;
  }

  function undo() {
    if (locked || solved || !history.length) return;
    var v = history.pop();
    if (!doMove(v, false)) { history.push(v); return; }
    redoStack.push(v);
    moves = Math.max(0, moves - 1);
    movesEl.textContent = String(moves);
    updateHistoryButtons();
  }

  function redo() {
    if (locked || solved || !redoStack.length) return;
    var v = redoStack.pop();
    history.push(v);
    moves++;
    movesEl.textContent = String(moves);
    if (!doMove(v, false)) {
      history.pop();
      moves--;
      redoStack.push(v);
      movesEl.textContent = String(moves);
    }
    updateHistoryButtons();
  }

  function showHint() {
    if (locked || solved || winEl.classList.contains('on')) return;
    var opts = neighborsOf(blank);
    var bestVal = -1, bestD = Infinity;
    for (var i = 0; i < opts.length; i++) {
      var v = tiles[opts[i]];
      if (!v) continue;
      var d = lowerAfter(opts[i]);
      if (d < bestD) { bestD = d; bestVal = v; }
    }
    if (bestVal < 0) return;
    hintUsed = true;
    var el = els[bestVal];
    if (el) {
      el.classList.remove('hint');
      void el.offsetWidth;
      el.classList.add('hint');
      setTimeout(function () { el.classList.remove('hint'); }, 1500);
    }
    if (hintLineEl) {
      hintLineEl.textContent = '提示：把 ' + bestVal + ' 推向空位（' + (bestD < manhattan() ? '这一步会靠近目标' : '先让开位置，为下一步做准备') + '）';
      clearTimeout(hintTimerId);
      hintTimerId = setTimeout(function () {
        hintLineEl.textContent = '拖动或轻扫棋盘即可滑动方块，也可以点数字或用 ↑ ↓ ← → 键 · Ctrl+Z 撤销';
      }, 2400);
    }
    vibrate(12);
  }

  function checkWin() {
    for (var i = 0; i < total - 1; i++) {
      if (tiles[i] !== i + 1) return;
    }
    solved = true;
    stopTimer();
    boardEl.classList.add('won');
    locked = false;

    var ratio = lowerBound > 0 ? moves / lowerBound : 1;
    var rank = ratio <= 1.3 ? 'S' : ratio <= 1.8 ? 'A' : ratio <= 2.6 ? 'B' : 'C';
    winLowerEl.textContent = String(lowerBound);
    winRankEl.textContent = rank;

    var key = bestKey();
    var best = loadBest();
    var rec = best[key];
    var isBest = !rec || moves < rec.moves || (moves === rec.moves && elapsed < rec.time);
    if (isBest) {
      best[key] = { moves: moves, time: elapsed };
      saveBest(pruneBest(best));
    }
    renderBest();

    winMovesEl.textContent = String(moves);
    winTimeEl.textContent = fmt(elapsed);
    winSubEl.textContent = isBest ? '新纪录，这一步走得漂亮' : (dailyMode ? '今日挑战完成' : '漂亮，每一步都算数');

    unlockAch('first');
    if (dailyMode) unlockAch('daily');
    else if (N === 3) unlockAch('three');
    else if (N === 4) unlockAch('four');
    else if (N === 5) unlockAch('five');
    if (!hintUsed && N >= 4) unlockAch('hintless');
    if (rank === 'S') unlockAch('rankS');
    if (N === 3 && elapsed <= 30) unlockAch('speed');

    updateHistoryButtons();
    winEl.classList.add('on');
    confetti();
  }

  function confetti() {
    var box = document.createElement('div');
    box.className = 'confetti';
    var colors = ['#22d3ee', '#818cf8', '#f472b6', '#facc15', '#4ade80', '#fb7185'];
    for (var i = 0; i < 46; i++) {
      var p = document.createElement('i');
      p.style.left = (Math.random() * 100) + '%';
      p.style.background = colors[i % colors.length];
      p.style.opacity = String(0.55 + Math.random() * 0.45);
      p.style.animationDuration = (1.1 + Math.random() * 1.0) + 's';
      p.style.animationDelay = (Math.random() * 0.35) + 's';
      p.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
      p.style.setProperty('--dy', (300 + Math.random() * 260) + 'px');
      p.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
      box.appendChild(p);
    }
    winEl.appendChild(box);
    setTimeout(function () { if (box.parentNode) box.parentNode.removeChild(box); }, 2600);
  }

  function startTimer() {
    startedAt = Date.now();
    elapsed = 0;
    timeEl.textContent = '00:00';
    clearInterval(timerId);
    timerId = setInterval(function () {
      elapsed = (Date.now() - startedAt) / 1000;
      timeEl.textContent = fmt(elapsed);
    }, 250);
  }
  function stopTimer() {
    clearInterval(timerId);
    timerId = 0;
    if (startedAt) elapsed = (Date.now() - startedAt) / 1000;
  }

  function bestKey() {
    return dailyMode ? ('daily-' + dailySeed()) : String(N);
  }
  function renderBest() {
    var rec = loadBest()[bestKey()];
    bestEl.textContent = rec ? rec.moves + ' 步' : '—';
  }

  function solvedState() {
    var a = [];
    for (var i = 1; i < total; i++) a.push(i);
    a.push(0);
    return a;
  }

  function shuffle() {
    winEl.classList.remove('on');
    boardEl.classList.remove('won');
    solved = false;
    moves = 0;
    elapsed = 0;
    startedAt = 0;
    stopTimer();
    movesEl.textContent = '0';
    timeEl.textContent = '00:00';
    winEl.querySelectorAll('.confetti').forEach(function (n) { n.remove(); });

    history = [];
    redoStack = [];
    hintUsed = false;
    updateHistoryButtons();

    tiles = solvedState();
    blank = total - 1;

    var rng = dailyMode ? mulberry32(dailySeed()) : Math.random;
    var steps = N === 3 ? 90 : N === 4 ? 260 : 460;
    var last = -1;
    for (var s = 0; s < steps; s++) {
      var opts = neighborsOf(blank).filter(function (i) { return i !== last; });
      if (!opts.length) opts = neighborsOf(blank);
      var pick = opts[Math.floor(rng() * opts.length)];
      last = blank;
      tiles[blank] = tiles[pick];
      tiles[pick] = 0;
      blank = pick;
    }
    if (isSolved()) {
      var opt = neighborsOf(blank);
      var p = opt[Math.floor(rng() * opt.length)];
      tiles[blank] = tiles[p];
      tiles[p] = 0;
      blank = p;
    }

    initial = tiles.slice();
    lowerBound = manhattan();
    if (lowerEl) lowerEl.textContent = String(lowerBound);
    renderAll(false);
    renderBest();
  }

  function neighborsOf(idx) {
    var r = rowOf(idx), c = colOf(idx), out = [];
    if (r > 0) out.push(idx - N);
    if (r < N - 1) out.push(idx + N);
    if (c > 0) out.push(idx - 1);
    if (c < N - 1) out.push(idx + 1);
    return out;
  }

  function isSolved() {
    for (var i = 0; i < total - 1; i++) if (tiles[i] !== i + 1) return false;
    return true;
  }

  function renderAll(animate) {
    layout(animate);
  }

  function setSize(n) {
    var isDaily = n === 'daily';
    var newN = isDaily ? 4 : n;
    if (!isDaily && !dailyMode && newN === N) return;
    dailyMode = isDaily;
    N = newN;
    total = N * N;
    goalEl.textContent = String(total - 1);
    clearTiles();
    rebuildSlots();
    buildTiles();
    shuffle();
    var btns = document.querySelectorAll('#sizes button');
    for (var i = 0; i < btns.length; i++) {
      var v = btns[i].dataset.size;
      var on = isDaily ? v === 'daily' : (!dailyMode && parseInt(v, 10) === N);
      btns[i].classList.toggle('on', on);
    }
  }

  function clearTiles() {
    for (var v = 1; v < total; v++) {
      if (els[v] && els[v].parentNode) els[v].parentNode.removeChild(els[v]);
    }
    els = {};
    var leftovers = boardEl.querySelectorAll('.tile');
    for (var i = 0; i < leftovers.length; i++) leftovers[i].remove();
  }

  function restart() {
    if (!initial) { shuffle(); return; }
    winEl.classList.remove('on');
    boardEl.classList.remove('won');
    solved = false;
    tiles = initial.slice();
    blank = tiles.indexOf(0);
    moves = 0;
    elapsed = 0;
    startedAt = 0;
    stopTimer();
    movesEl.textContent = '0';
    timeEl.textContent = '00:00';
    winEl.querySelectorAll('.confetti').forEach(function (n) { n.remove(); });
    history = [];
    redoStack = [];
    hintUsed = false;
    lowerBound = manhattan();
    if (lowerEl) lowerEl.textContent = String(lowerBound);
    updateHistoryButtons();
    renderAll(true);
  }

  function moveByDir(dir) {
    if (locked || solved || winEl.classList.contains('on')) return false;
    var tr = rowOf(blank), tc = colOf(blank), from = -1;
    if (dir === 'up') from = tr < N - 1 ? blank + N : -1;
    else if (dir === 'down') from = tr > 0 ? blank - N : -1;
    else if (dir === 'left') from = tc < N - 1 ? blank + 1 : -1;
    else if (dir === 'right') from = tc > 0 ? blank - 1 : -1;
    if (from < 0) return false;
    tryMove(tiles[from]);
    return true;
  }

  window.addEventListener('keydown', function (e) {
    var k = e.key, dir = null;
    if ((e.ctrlKey || e.metaKey) && (k === 'z' || k === 'Z')) {
      e.preventDefault();
      if (e.shiftKey) redo(); else undo();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && (k === 'y' || k === 'Y')) {
      e.preventDefault();
      redo();
      return;
    }
    if (!e.ctrlKey && !e.metaKey && (k === 'h' || k === 'H')) {
      e.preventDefault();
      showHint();
      return;
    }
    if (k === 'ArrowUp' || k === 'w' || k === 'W') dir = 'up';
    else if (k === 'ArrowDown' || k === 's' || k === 'S') dir = 'down';
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A') dir = 'left';
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') dir = 'right';
    if (!dir) return;
    if (winEl.classList.contains('on')) return;
    e.preventDefault();
    moveByDir(dir);
  });

  /* 拖动 / 轻扫棋盘：朝空位方向滑，紧邻空位的方块就跟着走 */
  var dragStart = null;
  var dragMoved = false;

  boardEl.addEventListener('pointerdown', function (e) {
    if (locked || solved || (e.pointerType === 'mouse' && e.button !== 0)) return;
    dragStart = { x: e.clientX, y: e.clientY, id: e.pointerId };
    dragMoved = false;
  });

  window.addEventListener('pointermove', function (e) {
    if (!dragStart || e.pointerId !== dragStart.id) return;
    if (locked || solved) { dragStart = null; return; }
    var dx = e.clientX - dragStart.x;
    var dy = e.clientY - dragStart.y;
    var th = Math.max(16, cellPx * 0.34);
    if (Math.abs(dx) < th && Math.abs(dy) < th) return;
    var dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    dragStart = { x: e.clientX, y: e.clientY, id: e.pointerId };
    dragMoved = true;
    moveByDir(dir);
    if (e.cancelable) e.preventDefault();
  }, { passive: false });

  function endDrag() {
    dragStart = null;
    if (dragMoved) setTimeout(function () { dragMoved = false; }, 60);
  }
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  window.addEventListener('resize', function () {
    rebuildSlots();
    layout(false);
  });

  document.getElementById('shuffle').addEventListener('click', function () { shuffle(); this.blur(); });
  document.getElementById('restart').addEventListener('click', function () { restart(); this.blur(); });
  document.getElementById('win-again').addEventListener('click', function () { shuffle(); this.blur(); });
  document.getElementById('sizes').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    var v = b.dataset.size;
    setSize(v === 'daily' ? 'daily' : parseInt(v, 10));
    b.blur();
  });

  if (undoBtn) undoBtn.addEventListener('click', function () { undo(); this.blur(); });
  if (redoBtn) redoBtn.addEventListener('click', function () { redo(); this.blur(); });
  if (hintBtn) hintBtn.addEventListener('click', function () { showHint(); this.blur(); });

  // init
  achData = loadAch();
  renderAch();
  buildTiles();
  rebuildSlots();
  shuffle();
  renderBest();
  updateHistoryButtons();
})();
</script>
</body>
</html>
