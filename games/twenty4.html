<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070d18">
<title>24 点 · 离线小游戏</title>
<style>
  :root{
    --text:#eaf2ff;--muted:#8ea3bd;--line:rgba(148,163,184,.16);
    --amber:#fbbf24;--cyan:#38bdf8;--violet:#818cf8;--pink:#f472b6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:22px 16px 26px;color:var(--text);
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
    background:
      radial-gradient(900px 620px at 8% -6%, rgba(251,191,36,.13), transparent 62%),
      radial-gradient(760px 560px at 102% 104%, rgba(56,189,248,.13), transparent 62%),
      radial-gradient(720px 520px at 50% 48%, rgba(129,140,248,.09), transparent 68%),
      #070d18;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent;
  }
  button{font:inherit;color:inherit;}
  .app{width:min(100%,680px);display:flex;flex-direction:column;gap:16px;}

  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:13px;min-width:0;}
  .logo{
    width:54px;height:54px;flex:0 0 auto;border-radius:16px;display:grid;place-items:center;
    font-size:24px;background:linear-gradient(150deg,#fde68a,#f59e0b 52%,#ea580c);
    box-shadow:0 12px 28px rgba(245,158,11,.28), inset 0 1px 0 rgba(255,255,255,.5);
  }
  h1{
    margin:0;font-size:clamp(22px,4.2vw,28px);font-weight:800;letter-spacing:.04em;
    background:linear-gradient(100deg,#f0f9ff,#fde68a 50%,#f9a8d4);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brand p{margin:4px 0 0;font-size:12.5px;color:var(--muted);}
  .stats{display:flex;gap:8px;flex-wrap:wrap;}
  .stat{min-width:72px;padding:9px 12px;border-radius:13px;background:rgba(255,255,255,.045);border:1px solid var(--line);}
  .stat span{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.08em;}
  .stat b{display:block;margin-top:3px;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;}
  .stat.score b{color:#fde68a;}
  .stat.combo b{color:#7dd3fc;}

  .stage{
    position:relative;padding:16px 18px 18px;border-radius:24px;
    background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.09);
    box-shadow:0 24px 60px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.09);
  }
  .stage::before{
    content:"";position:absolute;inset:-1px;border-radius:25px;pointer-events:none;
    background:linear-gradient(130deg,rgba(251,191,36,.34),transparent 36%,transparent 64%,rgba(56,189,248,.28));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;padding:1px;
  }

  .hud{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:9px;}
  .chip{
    display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;cursor:pointer;
    background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.26);
    color:#fde68a;font-size:11.5px;font-weight:700;letter-spacing:.06em;
    transition:background .16s ease,border-color .16s ease,transform .16s ease;
  }
  .chip:hover{background:rgba(251,191,36,.17);transform:translateY(-1px);}
  .chip i{width:7px;height:7px;border-radius:50%;background:#fbbf24;box-shadow:0 0 10px #fbbf24;}
  .chip em{font-style:normal;color:#8ea3bd;font-size:10.5px;font-weight:600;}
  .clock{display:inline-flex;align-items:baseline;gap:7px;font-variant-numeric:tabular-nums;}
  .clock span{font-size:10.5px;letter-spacing:.1em;color:var(--muted);}
  .clock b{font-size:16px;font-weight:800;color:#e0f2fe;}
  .clock.low b{color:#fda4af;}
  .combo{display:flex;align-items:center;gap:8px;}
  .pips{display:flex;gap:4px;}
  .pips i{width:6px;height:6px;border-radius:50%;background:rgba(148,163,184,.25);transition:background .2s ease,box-shadow .2s ease;}
  .pips i.on{background:#fbbf24;box-shadow:0 0 8px rgba(251,191,36,.8);}
  .combo b{font-size:12.5px;color:#7dd3fc;font-variant-numeric:tabular-nums;}

  .timebar{display:none;height:4px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin:0 0 10px;}
  .timebar.on{display:block;}
  .timebar i{display:block;height:100%;width:100%;border-radius:inherit;background:linear-gradient(90deg,#22d3ee,#a78bfa,#fb7185);transition:width .16s linear;}

  .goal{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .goal .label{font-size:12px;color:var(--muted);}
  .goal .label b{color:#fde68a;font-size:15px;letter-spacing:.04em;}
  .goal .target{
    display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;
    background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.22);
    font-size:11.5px;color:#fde68a;font-weight:700;letter-spacing:.08em;
  }
  .goal .target i{font-style:normal;font-size:15px;}

  .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(7px,1.6vw,11px);}
  .numcard{
    position:relative;border:1px solid rgba(255,255,255,.13);border-radius:16px;cursor:pointer;
    min-height:clamp(104px,15vw,132px);padding:10px 8px 8px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    background:
      radial-gradient(circle at 32% 18%, rgba(255,255,255,.16), transparent 52%),
      linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.025));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 8px 18px rgba(0,0,0,.25);
    transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease,background .16s ease;
  }
  .numcard:hover{transform:translateY(-4px);border-color:rgba(251,191,36,.4);}
  .numcard.selected{
    transform:translateY(-6px);
    border-color:rgba(251,191,36,.72);
    background:
      radial-gradient(circle at 32% 18%, rgba(255,255,255,.2), transparent 52%),
      linear-gradient(160deg,rgba(251,191,36,.18),rgba(245,158,11,.05));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 14px 28px rgba(0,0,0,.32), 0 0 26px rgba(251,191,36,.16);
  }
  .numcard .value{
    font-size:clamp(34px,6.6vw,52px);font-weight:900;line-height:1;letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;color:#f8fbff;text-shadow:0 2px 10px rgba(0,0,0,.3);
  }
  .numcard.selected .value{color:#fef3c7;}
  .numcard .frac{display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1;}
  .numcard .frac b{font-size:clamp(20px,3.8vw,28px);font-weight:900;}
  .numcard .frac i{
    font-style:normal;font-size:clamp(17px,3.2vw,23px);font-weight:800;
    border-top:2px solid rgba(255,255,255,.72);padding-top:2px;min-width:1.4em;text-align:center;
  }
  .numcard .expr{
    font-size:10.5px;color:#8ea3bd;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-variant-numeric:tabular-nums;
  }
  .numcard.pop{animation:cardPop .28s cubic-bezier(.2,.8,.2,1);}
  @keyframes cardPop{0%{transform:scale(.86);opacity:.4;}100%{transform:none;opacity:1;}}
  .numcard.shake{animation:cardShake .3s ease;}
  @keyframes cardShake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-5px);}75%{transform:translateX(5px);}
  }
  .numcard.solved{
    border-color:rgba(163,230,53,.55);
    box-shadow:0 0 30px rgba(163,230,53,.16), inset 0 1px 0 rgba(255,255,255,.22);
  }

  .ops{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(7px,1.6vw,11px);margin-top:12px;}
  .op{
    border:1px solid rgba(255,255,255,.11);border-radius:14px;padding:11px 4px;cursor:pointer;
    background:rgba(255,255,255,.045);font-size:clamp(20px,3.4vw,25px);font-weight:800;line-height:1;
    color:#c7d2fe;transition:background .16s ease,border-color .16s ease,transform .16s ease,color .16s ease;
  }
  .op:hover{background:rgba(255,255,255,.09);border-color:rgba(56,189,248,.4);transform:translateY(-2px);}
  .op.selected{
    color:#062033;border-color:transparent;
    background:linear-gradient(135deg,#7dd3fc,#38bdf8);
    box-shadow:0 8px 20px rgba(56,189,248,.28);
  }

  .hintbox{
    display:none;margin-top:10px;padding:10px 12px;border-radius:12px;font-size:12.5px;line-height:1.6;
    color:#fde68a;background:rgba(251,191,36,.08);border:1px dashed rgba(251,191,36,.32);word-break:break-all;
  }
  .hintbox.on{display:block;animation:fadeIn .2s ease;}

  .toast{
    position:absolute;left:50%;top:-15px;transform:translate(-50%,-6px);z-index:6;
    padding:7px 14px;border-radius:999px;font-size:12px;color:#e0f2fe;white-space:nowrap;
    background:rgba(12,26,44,.96);border:1px solid rgba(56,189,248,.28);
    box-shadow:0 10px 26px rgba(0,0,0,.4);opacity:0;pointer-events:none;
    transition:opacity .18s ease,transform .18s ease;
  }
  .toast.on{opacity:1;transform:translate(-50%,0);}
  .toast.warn{border-color:rgba(251,113,133,.4);color:#ffe4e6;}

  .panel{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .actions{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{
    border:1px solid rgba(255,255,255,.11);border-radius:11px;padding:8px 13px;cursor:pointer;
    background:rgba(255,255,255,.055);color:#dbeafe;font-size:12.5px;font-weight:600;
    transition:background .16s ease,border-color .16s ease,transform .16s ease;
  }
  .btn:hover{background:rgba(255,255,255,.10);border-color:rgba(251,191,36,.35);transform:translateY(-1px);}
  .btn.primary{
    color:#251505;border-color:transparent;
    background:linear-gradient(135deg,#fde68a,#f59e0b);
    box-shadow:0 8px 20px rgba(245,158,11,.26);
  }
  .btn .cnt{color:#fbbf24;font-weight:800;margin-left:2px;}
  .foot{font-size:11.5px;color:#5f7286;letter-spacing:.03em;text-align:center;}

  .overlay{
    position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;padding:16px;
    background:rgba(3,8,18,.76);backdrop-filter:blur(7px);border-radius:24px;
  }
  .overlay.on{display:flex;animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .card{
    width:min(100%,340px);padding:24px 22px 20px;border-radius:22px;text-align:center;
    background:linear-gradient(180deg,rgba(26,24,18,.98),rgba(10,13,22,.98));
    border:1px solid rgba(251,191,36,.26);
    box-shadow:0 26px 70px rgba(0,0,0,.55), 0 0 44px rgba(251,191,36,.10);
  }
  .kicker{font-size:11.5px;letter-spacing:.22em;color:#fbbf24;font-weight:700;}
  .card h2{
    margin:10px 0 5px;font-size:31px;font-weight:900;letter-spacing:.08em;
    background:linear-gradient(100deg,#fef3c7,#fbbf24,#7dd3fc);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .card p{margin:0 0 14px;font-size:12.5px;line-height:1.65;color:var(--muted);}
  .formula{
    margin:0 0 12px;padding:11px 10px;border-radius:12px;font-size:14px;font-weight:700;color:#fef3c7;
    background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.2);word-break:break-all;
  }
  .gain{font-size:12.5px;font-weight:800;color:#bbf7d0;margin:-4px 0 12px;letter-spacing:.03em;}
  .res-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
  .res-grid div{padding:9px 8px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);}
  .res-grid span{display:block;font-size:10.5px;color:var(--muted);}
  .res-grid b{display:block;margin-top:2px;font-size:17px;font-variant-numeric:tabular-nums;}
  .card .btn.primary{width:100%;padding:11px 14px;font-size:13.5px;}
  .card .ghost{
    display:block;width:100%;margin-top:8px;padding:8px 12px;font-size:12px;color:#8ea3bd;
    background:none;border:0;cursor:pointer;
  }
  .card .ghost:hover{color:#e0f2fe;}

  .menu{
    position:fixed;inset:0;z-index:40;border-radius:0;padding:16px;
    background:rgba(3,8,18,.86);
  }
  .menu-card{
    width:min(100%,430px);max-height:calc(100vh - 32px);overflow:auto;padding:22px 20px 18px;border-radius:22px;text-align:left;
    background:linear-gradient(180deg,rgba(20,24,36,.99),rgba(8,12,22,.99));
    border:1px solid rgba(251,191,36,.22);
    box-shadow:0 26px 70px rgba(0,0,0,.55), 0 0 44px rgba(251,191,36,.08);
  }
  .menu-card .kicker{font-size:11px;}
  .menu-title{
    margin:8px 0 4px;font-size:27px;font-weight:900;letter-spacing:.1em;
    background:linear-gradient(100deg,#fef3c7,#fbbf24,#7dd3fc);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .menu-sub{margin:0 0 14px;font-size:12px;line-height:1.65;color:var(--muted);}
  .diff-list{display:flex;flex-direction:column;gap:9px;}
  .diff{
    display:block;width:100%;text-align:left;padding:12px 14px;border-radius:14px;cursor:pointer;
    background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.12);
    transition:background .16s ease,border-color .16s ease,transform .16s ease;
  }
  .diff:hover{background:rgba(255,255,255,.085);border-color:rgba(251,191,36,.4);transform:translateY(-1px);}
  .dname{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:14px;font-weight:800;color:#f8fbff;}
  .dname em{font-style:normal;font-size:11px;color:#fbbf24;font-weight:700;letter-spacing:.06em;}
  .ddesc{display:block;margin-top:3px;font-size:11.5px;line-height:1.55;color:#8ea3bd;}
  .dmeta{display:block;margin-top:5px;font-size:10.5px;color:#5f7286;letter-spacing:.04em;}
  .menu-stats{margin-top:13px;text-align:center;font-size:10.5px;color:#5f7286;line-height:1.7;letter-spacing:.04em;}

  @media (max-width:620px){
    body{padding:14px 12px 18px;}
    .app{gap:12px;}
    .logo{width:46px;height:46px;border-radius:14px;font-size:21px;}
    .stat{min-width:62px;padding:7px 9px;}
    .stat b{font-size:15px;}
    .brand p{font-size:11.5px;}
    .stage{padding:14px 12px 14px;}
    .numcard{min-height:96px;border-radius:14px;}
    .op{border-radius:12px;padding:9px 3px;}
    .panel{justify-content:center;}
    .actions{width:100%;}
    .actions .btn{flex:1;}
  }
  @media (max-height:700px) and (min-width:700px){
    .brand p{display:none;}
    .foot{display:none;}
    .numcard{min-height:104px;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo">🃏</div>
      <div>
        <h1>24 点</h1>
        <p>四个数字，加减乘除各用一遍，把结果凑成 24</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat score"><span>得分</span><b id="score">0</b></div>
      <div class="stat combo"><span>连击</span><b id="streak">0</b></div>
      <div class="stat"><span>最高分</span><b id="bestScore">—</b></div>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="hud">
      <button class="chip" id="diffChip" type="button"><i></i><span id="diffName">入门</span><em>切换难度</em></button>
      <div class="clock" id="clock"><span id="clockLabel">用时</span><b id="time">00:00</b></div>
      <div class="combo"><span class="pips" id="pips"><i></i><i></i><i></i><i></i><i></i></span><b id="comboText">×0</b></div>
    </div>
    <div class="timebar" id="timebar"><i id="timeFill"></i></div>
    <div class="goal">
      <div class="label">当前数字 <b id="count">4</b> 个 · 点两个数字和一个运算符</div>
      <div class="target"><i>24</i> 目标</div>
    </div>
    <div class="cards" id="cards"></div>
    <div class="ops" id="ops">
      <button class="op" type="button" data-op="+">+</button>
      <button class="op" type="button" data-op="-">−</button>
      <button class="op" type="button" data-op="*">×</button>
      <button class="op" type="button" data-op="/">÷</button>
    </div>
    <div class="hintbox" id="hintBox"></div>
    <div class="toast" id="toast"></div>

    <div class="overlay menu" id="menu">
      <div class="menu-card">
        <div class="kicker">选择难度</div>
        <h2 class="menu-title">24 点</h2>
        <p class="menu-sub">每一题都用穷举验证过有解。卡住可以点「提示」，看完整的参考解法。</p>
        <div class="diff-list">
          <button class="diff" type="button" data-diff="easy">
            <span class="dname">入门 <em>数字 1–10</em></span>
            <span class="ddesc">只出 1–10，多数题不止一种解法，适合先热身</span>
            <span class="dmeta">每题基础 100 分 · 不限时</span>
          </button>
          <button class="diff" type="button" data-diff="normal">
            <span class="dname">进阶 <em>数字 1–13</em></span>
            <span class="ddesc">加入 J / Q / K（11–13），解法更绕，需要多试两步</span>
            <span class="dmeta">每题基础 150 分 · 不限时</span>
          </button>
          <button class="diff" type="button" data-diff="hard">
            <span class="dname">挑战 <em>限时 60 秒</em></span>
            <span class="ddesc">只出「解法唯一」或「必须先除」的题，答对额外加时间分</span>
            <span class="dmeta">每题基础 220 分 · 倒计时结束本题作废</span>
          </button>
        </div>
        <div class="menu-stats" id="menuStats"></div>
        <button class="ghost" id="menuClose" type="button" style="display:none">继续当前这题</button>
      </div>
    </div>

    <div class="overlay" id="result"></div>
  </div>

  <div class="panel">
    <div class="actions">
      <button class="btn" id="undo">撤销</button>
      <button class="btn" id="hint">提示</button>
      <button class="btn" id="skip">换一题 <span class="cnt" id="skipCount">0</span></button>
    </div>
  </div>
  <p class="foot">键盘：R 换题 · Z 撤销 · H 提示 · 中间结果可以是分数 · 跳过次数记在本地</p>
</div>

<script>
(function () {
  'use strict';

  var STATS_KEY = 'tx24_stats_v2';

  var CONFIG = {
    easy:   { name: '入门', range: 10, base: 100, limit: 0,  desc: '数字 1–10' },
    normal: { name: '进阶', range: 13, base: 150, limit: 0,  desc: '数字 1–13' },
    hard:   { name: '挑战', range: 13, base: 220, limit: 60, desc: '限时 60 秒' }
  };

  var cardsEl = document.getElementById('cards');
  var opsEl = document.getElementById('ops');
  var stageEl = document.getElementById('stage');
  var timeEl = document.getElementById('time');
  var clockEl = document.getElementById('clock');
  var clockLabel = document.getElementById('clockLabel');
  var timebarEl = document.getElementById('timebar');
  var timeFillEl = document.getElementById('timeFill');
  var scoreEl = document.getElementById('score');
  var streakEl = document.getElementById('streak');
  var bestScoreEl = document.getElementById('bestScore');
  var pipsEl = document.getElementById('pips');
  var comboTextEl = document.getElementById('comboText');
  var countEl = document.getElementById('count');
  var diffChip = document.getElementById('diffChip');
  var diffNameEl = document.getElementById('diffName');
  var undoBtn = document.getElementById('undo');
  var hintBtn = document.getElementById('hint');
  var skipBtn = document.getElementById('skip');
  var skipCountEl = document.getElementById('skipCount');
  var toastEl = document.getElementById('toast');
  var hintBox = document.getElementById('hintBox');
  var menuEl = document.getElementById('menu');
  var menuStats = document.getElementById('menuStats');
  var menuClose = document.getElementById('menuClose');
  var resultEl = document.getElementById('result');

  var stats = { bestScore: 0, bestStreak: 0, solved: 0, skips: 0 };
  try {
    var raw = localStorage.getItem(STATS_KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') {
        stats.bestScore = Math.max(0, parseInt(parsed.bestScore, 10) || 0);
        stats.bestStreak = Math.max(0, parseInt(parsed.bestStreak, 10) || 0);
        stats.solved = Math.max(0, parseInt(parsed.solved, 10) || 0);
        stats.skips = Math.max(0, parseInt(parsed.skips, 10) || 0);
      }
    }
  } catch (e) { stats = { bestScore: 0, bestStreak: 0, solved: 0, skips: 0 }; }

  function saveStats() {
    try { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); } catch (e) {}
  }

  /* ==== PUZZLE-CORE-BEGIN ==== */
  var ALL_OPS = ['+', '-', '*', '/'];
  var NO_DIV_OPS = ['+', '-', '*'];

  function gcd(a, b) {
    a = Math.abs(a); b = Math.abs(b);
    while (b) { var t = a % b; a = b; b = t; }
    return a || 1;
  }

  function R(n, d) {
    d = d || 1;
    if (d < 0) { n = -n; d = -d; }
    var g = gcd(n, d);
    return { n: n / g, d: d / g };
  }

  function apply(a, b, o) {
    if (o === '+') return R(a.n * b.d + b.n * a.d, a.d * b.d);
    if (o === '-') return R(a.n * b.d - b.n * a.d, a.d * b.d);
    if (o === '*') return R(a.n * b.n, a.d * b.d);
    if (o === '/') return R(a.n * b.d, a.d * b.n);
    return a;
  }

  function is24(v) { return v.n === 24 * v.d; }

  function opSym(o) {
    return o === '*' ? '×' : (o === '/' ? '÷' : (o === '-' ? '−' : '+'));
  }

  function vstr(v) { return v.d === 1 ? String(v.n) : (v.n + '/' + v.d); }

  function solveItems(list, ops) {
    if (list.length === 1) return is24(list[0].v) ? list[0].expr : null;
    for (var i = 0; i < list.length; i++) {
      for (var j = i + 1; j < list.length; j++) {
        var rest = [];
        for (var k = 0; k < list.length; k++) {
          if (k !== i && k !== j) rest.push(list[k]);
        }
        var a = list[i], b = list[j];
        for (var t = 0; t < ops.length * 2; t++) {
          var o = ops[t < ops.length ? t : t - ops.length];
          var x = t < ops.length ? a : b;
          var y = t < ops.length ? b : a;
          if (o === '/' && y.v.n === 0) continue;
          var v = apply(x.v, y.v, o);
          var expr = '(' + x.expr + ' ' + opSym(o) + ' ' + y.expr + ')';
          rest.push({ v: v, expr: expr });
          var got = solveItems(rest, ops);
          rest.pop();
          if (got) return got;
        }
      }
    }
    return null;
  }

  function solveNums(nums, ops) {
    var list = [];
    for (var i = 0; i < nums.length; i++) {
      list.push({ v: R(nums[i], 1), expr: String(nums[i]) });
    }
    return solveItems(list, ops || ALL_OPS);
  }

  function nodeKey(a, b, o) {
    if (o === '+' || o === '*') {
      if (a > b) { var t = a; a = b; b = t; }
    }
    return '(' + a + o + b + ')';
  }

  function countSolutions(nums, limit) {
    limit = limit || 2;
    var seen = Object.create(null);
    var total = 0;
    function rec(list) {
      if (total >= limit) return;
      if (list.length === 1) {
        if (is24(list[0].v) && !seen[list[0].key]) {
          seen[list[0].key] = 1;
          total++;
        }
        return;
      }
      for (var i = 0; i < list.length; i++) {
        for (var j = i + 1; j < list.length; j++) {
          var rest = [];
          for (var k = 0; k < list.length; k++) {
            if (k !== i && k !== j) rest.push(list[k]);
          }
          var a = list[i], b = list[j];
          for (var oi = 0; oi < ALL_OPS.length; oi++) {
            var o = ALL_OPS[oi];
            for (var dir = 0; dir < 2; dir++) {
              if (dir === 0 && (o === '+' || o === '*')) continue;
              var x = dir ? b : a;
              var y = dir ? a : b;
              if (o === '/' && y.v.n === 0) continue;
              var v = apply(x.v, y.v, o);
              rest.push({ v: v, key: nodeKey(x.key, y.key, o) });
              rec(rest);
              rest.pop();
              if (total >= limit) return;
            }
          }
        }
      }
    }
    var init = [];
    for (var m = 0; m < nums.length; m++) {
      init.push({ v: R(nums[m], 1), key: String(nums[m]) });
    }
    rec(init);
    return total;
  }

  function makePuzzle(diffKey) {
    var range = diffKey === 'easy' ? 10 : 13;
    var wantsHard = diffKey === 'hard';
    var wantsEasy = diffKey === 'easy';
    var tries;

    for (tries = 0; tries < 900; tries++) {
      var nums = [];
      for (var i = 0; i < 4; i++) nums.push(1 + Math.floor(Math.random() * range));
      var sol = solveNums(nums, ALL_OPS);
      if (!sol) continue;
      if (wantsEasy && countSolutions(nums, 2) < 2) continue;
      if (wantsHard) {
        var noDiv = solveNums(nums, NO_DIV_OPS);
        var unique = countSolutions(nums, 2) === 1;
        if (!noDiv || unique) return { nums: nums, solution: sol };
        continue;
      }
      return { nums: nums, solution: sol };
    }

    // 兜底：只要求有解，保证不会出无解题
    for (tries = 0; tries < 1500; tries++) {
      var ns = [];
      for (var j = 0; j < 4; j++) ns.push(1 + Math.floor(Math.random() * range));
      var s2 = solveNums(ns, ALL_OPS);
      if (s2) return { nums: ns, solution: s2 };
    }
    return { nums: [4, 6, 2, 3], solution: solveNums([4, 6, 2, 3], ALL_OPS) };
  }
  /* ==== PUZZLE-CORE-END ==== */

  /* ---------------- state ---------------- */

  var diff = 'easy';
  var cfg = CONFIG[diff];
  var tokens = [];
  var history = [];
  var selected = -1;
  var op = null;
  var score = 0;
  var streak = 0;
  var elapsed = 0;
  var startAt = 0;
  var timer = null;
  var timing = false;
  var finished = false;
  var hintUsed = false;
  var startedRun = false;
  var menuOpen = true;
  var puzzleSolution = '';
  var toastTimer = 0;

  /* ---------------- helpers ---------------- */

  function fmt(ms) {
    var t = Math.max(0, Math.floor(ms / 1000));
    var m = Math.floor(t / 60), s = t % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  function showToast(msg, warn) {
    toastEl.textContent = msg;
    toastEl.classList.toggle('warn', !!warn);
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('on'); }, 1900);
  }

  function cleanExpr(s) {
    if (!s) return '';
    while (s.charAt(0) === '(' && s.charAt(s.length - 1) === ')') {
      var depth = 0, wrap = true;
      for (var i = 0; i < s.length; i++) {
        if (s.charAt(i) === '(') depth++;
        else if (s.charAt(i) === ')') depth--;
        if (depth === 0 && i < s.length - 1) { wrap = false; break; }
      }
      if (!wrap) break;
      s = s.slice(1, -1);
    }
    return s;
  }

  function updateHud() {
    scoreEl.textContent = String(score);
    streakEl.textContent = String(streak);
    bestScoreEl.textContent = stats.bestScore > 0 ? String(stats.bestScore) : '—';
    skipCountEl.textContent = String(stats.skips);
    comboTextEl.textContent = '×' + streak;
    var pips = pipsEl.children;
    for (var i = 0; i < pips.length; i++) {
      pips[i].classList.toggle('on', i < Math.min(streak, pips.length));
    }
    menuStats.textContent = '累计已解 ' + stats.solved + ' 题 · 最高连击 ' + stats.bestStreak +
      ' · 最高分 ' + (stats.bestScore > 0 ? stats.bestScore : '—') + ' · 换题 ' + stats.skips + ' 次';
  }

  /* ---------------- timer ---------------- */

  function tick() {
    elapsed = Date.now() - startAt;
    if (cfg.limit) {
      var left = cfg.limit * 1000 - elapsed;
      if (left < 0) left = 0;
      timeEl.textContent = fmt(left);
      timeFillEl.style.width = (left / (cfg.limit * 1000) * 100) + '%';
      clockEl.classList.toggle('low', left <= 10000);
      if (left <= 0) timeUp();
    } else {
      timeEl.textContent = fmt(elapsed);
    }
  }

  function startTimer() {
    if (timing || finished || menuOpen) return;
    timing = true;
    startAt = Date.now() - elapsed;
    if (timer) clearInterval(timer);
    timer = setInterval(tick, 100);
    tick();
  }

  function stopTimer() {
    timing = false;
    if (timer) { clearInterval(timer); timer = null; }
  }

  /* ---------------- rendering ---------------- */

  function render(animIndex) {
    cardsEl.innerHTML = '';
    for (var i = 0; i < tokens.length; i++) {
      var t = tokens[i];
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'numcard' + (i === selected ? ' selected' : '');
      b.dataset.i = String(i);
      var main;
      if (t.v.d === 1) {
        main = '<span class="value">' + t.v.n + '</span>';
      } else {
        main = '<span class="frac"><b>' + t.v.n + '</b><i>' + t.v.d + '</i></span>';
      }
      var showExpr = t.expr !== String(t.v.n);
      b.innerHTML = main + (showExpr ? '<span class="expr">' + t.expr + '</span>' : '');
      b.setAttribute('aria-label', '数字 ' + vstr(t.v));
      if (animIndex === i) b.classList.add('pop');
      b.addEventListener('click', function () { pick(parseInt(this.dataset.i, 10)); });
      cardsEl.appendChild(b);
    }
    countEl.textContent = tokens.length;
    undoBtn.disabled = history.length === 0;
    undoBtn.style.opacity = history.length ? '0.92' : '0.45';
  }

  function clearSelection() {
    selected = -1;
    op = null;
    var ops = opsEl.querySelectorAll('.op');
    for (var i = 0; i < ops.length; i++) ops[i].classList.remove('selected');
  }

  /* ---------------- interaction ---------------- */

  function pick(i) {
    if (finished || menuOpen) return;
    startTimer();
    if (selected < 0) {
      selected = i;
      render();
      return;
    }
    if (selected === i) {
      selected = -1;
      op = null;
      var ops = opsEl.querySelectorAll('.op');
      for (var k = 0; k < ops.length; k++) ops[k].classList.remove('selected');
      render();
      return;
    }
    if (!op) {
      selected = i;
      render();
      showToast('先选一个运算符，再点第二个数字');
      return;
    }
    combine(selected, i);
  }

  function chooseOp(o) {
    if (finished || menuOpen) return;
    startTimer();
    if (selected < 0) {
      showToast('先点一个数字，再选运算符');
      return;
    }
    op = o;
    var ops = opsEl.querySelectorAll('.op');
    for (var i = 0; i < ops.length; i++) {
      ops[i].classList.toggle('selected', ops[i].dataset.op === o);
    }
  }

  function combine(i, j) {
    if (i > j) { var tmp = i; i = j; j = tmp; }
    var a = tokens[i], b = tokens[j];
    if (op === '/' && b.v.n === 0) {
      showToast('不能除以 0', true);
      return;
    }
    history.push({
      tokens: tokens.map(function (t) { return { v: { n: t.v.n, d: t.v.d }, expr: t.expr }; }),
      elapsed: elapsed
    });

    var v = apply(a.v, b.v, op);
    var expr = '(' + a.expr + ' ' + opSym(op) + ' ' + b.expr + ')';
    var next = [];
    for (var k = 0; k < tokens.length; k++) {
      if (k !== i && k !== j) next.push(tokens[k]);
    }
    next.splice(i, 0, { v: v, expr: expr });
    tokens = next;
    clearSelection();
    render(i);

    if (tokens.length === 1) {
      if (is24(tokens[0].v)) {
        win();
      } else {
        wrong(tokens[0].v);
      }
      return;
    }

    var probe = tokens.map(function (t) { return { v: t.v, expr: t.expr }; });
    if (!solveItems(probe, ALL_OPS)) {
      showToast('这个方向已经凑不出 24，撤销试试', true);
      var cards = cardsEl.querySelectorAll('.numcard');
      for (var c = 0; c < cards.length; c++) {
        cards[c].classList.add('shake');
        (function (el) { setTimeout(function () { el.classList.remove('shake'); }, 340); })(cards[c]);
      }
    }
  }

  /* ---------------- outcomes ---------------- */

  function wrong(v) {
    streak = 0;
    updateHud();
    var el = cardsEl.children[0];
    if (el) {
      el.classList.add('shake');
      setTimeout(function () { el.classList.remove('shake'); }, 340);
    }
    showToast('结果是 ' + vstr(v) + '，不是 24 · 连击清零', true);
    setTimeout(function () {
      if (finished || tokens.length !== 1) return;
      if (!is24(tokens[0].v) && history.length) undo();
    }, 1000);
  }

  function win() {
    finished = true;
    stopTimer();
    stats.solved++;
    streak++;
    if (streak > stats.bestStreak) stats.bestStreak = streak;

    var gain = cfg.base + Math.min(200, (streak - 1) * 30);
    var bonus = 0;
    if (cfg.limit) {
      bonus = Math.floor(Math.max(0, cfg.limit * 1000 - elapsed) / 1000) * 2;
      gain += bonus;
    }
    score += gain;
    if (score > stats.bestScore) stats.bestScore = score;
    saveStats();
    updateHud();

    var expr = cleanExpr(tokens[0].expr);
    var card = cardsEl.querySelector('.numcard');
    if (card) card.classList.add('solved');
    addParticles();

    resultEl.innerHTML =
      '<div class="card">' +
        '<div class="kicker">正好 24</div>' +
        '<h2>解出来了</h2>' +
        '<div class="formula">' + expr + ' = 24</div>' +
        '<div class="gain">+ ' + gain + ' 分' + (bonus > 0 ? '（含时间分 ' + bonus + '）' : '') + '</div>' +
        '<div class="res-grid">' +
          '<div><span>连击</span><b>×' + streak + '</b></div>' +
          '<div><span>本局得分</span><b>' + score + '</b></div>' +
          '<div><span>用时</span><b>' + fmt(elapsed) + '</b></div>' +
          '<div><span>最高分</span><b>' + stats.bestScore + '</b></div>' +
        '</div>' +
        '<button class="btn primary" data-act="next" type="button">下一题</button>' +
      '</div>';
    resultEl.classList.add('on');
    resultEl.querySelector('[data-act="next"]').addEventListener('click', function () {
      newPuzzle(true);
    });
  }

  function timeUp() {
    if (finished) return;
    finished = true;
    stopTimer();
    streak = 0;
    updateHud();
    timeEl.textContent = '00:00';
    timeFillEl.style.width = '0%';

    var sol = cleanExpr(puzzleSolution);
    resultEl.innerHTML =
      '<div class="card">' +
        '<div class="kicker">TIME OUT</div>' +
        '<h2>时间到</h2>' +
        '<p>60 秒内没凑出 24，连击清零。参考解法：</p>' +
        (sol ? '<div class="formula">' + sol + ' = 24</div>' : '') +
        '<button class="btn primary" data-act="next" type="button">换一题</button>' +
        '<button class="ghost" data-act="menu" type="button">回到难度选择</button>' +
      '</div>';
    resultEl.classList.add('on');
    resultEl.querySelector('[data-act="next"]').addEventListener('click', function () {
      newPuzzle(true);
    });
    resultEl.querySelector('[data-act="menu"]').addEventListener('click', openMenu);
  }

  function addParticles() {
    for (var i = 0; i < 10; i++) {
      var dot = document.createElement('i');
      dot.style.cssText = 'position:absolute;width:6px;height:6px;border-radius:50%;' +
        'background:' + (i % 2 ? '#fbbf24' : '#7dd3fc') + ';left:50%;top:52%;pointer-events:none;' +
        'opacity:.9;z-index:4;';
      stageEl.appendChild(dot);
      (function (el, idx) {
        var a = Math.PI * 2 * (idx / 10);
        var dist = 55 + Math.random() * 55;
        el.style.transition = 'transform .7s cubic-bezier(.2,.8,.2,1), opacity .7s ease';
        requestAnimationFrame(function () {
          el.style.transform = 'translate(' + (Math.cos(a) * dist) + 'px,' + (Math.sin(a) * dist - 30) + 'px)';
          el.style.opacity = '0';
        });
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 800);
      })(dot, i);
    }
  }

  /* ---------------- flow ---------------- */

  function newPuzzle(keepRun) {
    stopTimer();
    if (!keepRun) {
      score = 0;
      streak = 0;
    }
    elapsed = 0;
    finished = false;
    hintUsed = false;
    resultEl.classList.remove('on');
    resultEl.innerHTML = '';
    hintBox.classList.remove('on');
    hintBox.textContent = '';

    var puzzle = makePuzzle(diff);
    puzzleSolution = puzzle.solution;
    tokens = puzzle.nums.map(function (n) { return { v: R(n, 1), expr: String(n) }; });
    history = [];
    clearSelection();
    render();

    clockLabel.textContent = cfg.limit ? '剩余' : '用时';
    timeEl.textContent = cfg.limit ? fmt(cfg.limit * 1000) : '00:00';
    clockEl.classList.toggle('low', false);
    timebarEl.classList.toggle('on', !!cfg.limit);
    timeFillEl.style.width = cfg.limit ? '100%' : '0%';
    updateHud();
  }

  function startRun(key) {
    diff = CONFIG[key] ? key : 'easy';
    cfg = CONFIG[diff];
    diffNameEl.textContent = cfg.name;
    startedRun = true;
    menuOpen = false;
    menuEl.classList.remove('on');
    score = 0;
    streak = 0;
    newPuzzle(false);
    showToast('难度：' + cfg.name + (cfg.limit ? ' · 限时 60 秒' : ''));
  }

  function openMenu() {
    menuOpen = true;
    stopTimer();
    menuEl.classList.add('on');
    menuClose.style.display = (startedRun && !finished) ? 'block' : 'none';
    updateHud();
  }

  function closeMenu() {
    menuOpen = false;
    menuEl.classList.remove('on');
  }

  function undo() {
    if (finished || menuOpen || !history.length) return;
    var h = history.pop();
    tokens = h.tokens;
    clearSelection();
    render();
  }

  function hint() {
    if (finished || menuOpen) return;
    startTimer();
    var got = solveItems(tokens.map(function (t) { return { v: t.v, expr: t.expr }; }), ALL_OPS);
    if (!got) {
      showToast('当前数字已经无解，撤销或换一题吧', true);
      hintBox.classList.remove('on');
      return;
    }
    elapsed += 8000;
    if (timing) startAt = Date.now() - elapsed;
    if (cfg.limit) {
      var left = cfg.limit * 1000 - elapsed;
      if (left <= 0) { timeUp(); return; }
    }
    hintUsed = true;
    var clean = cleanExpr(got);
    hintBox.textContent = '参考解法：' + clean + ' = 24（提示 · 用时 +8 秒）';
    hintBox.classList.add('on');
    showToast('已给出参考解法 · 用时 +8 秒');
  }

  function skip() {
    if (menuOpen) return;
    stats.skips++;
    saveStats();
    newPuzzle(true);
    updateHud();
    showToast('已换一题 · 累计跳过 ' + stats.skips + ' 次');
  }

  /* ---------------- events ---------------- */

  opsEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.op');
    if (btn) chooseOp(btn.dataset.op);
  });

  diffChip.addEventListener('click', openMenu);
  menuClose.addEventListener('click', function () { closeMenu(); startTimer(); });

  menuEl.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-diff]');
    if (btn) startRun(btn.dataset.diff);
  });

  undoBtn.addEventListener('click', undo);
  hintBtn.addEventListener('click', hint);
  skipBtn.addEventListener('click', skip);

  document.addEventListener('keydown', function (e) {
    if (menuOpen) return;
    var k = e.key.toLowerCase();
    if (k === 'r') skip();
    else if (k === 'z') undo();
    else if (k === 'h') hint();
    else if (k === '+') chooseOp('+');
    else if (k === '-') chooseOp('-');
    else if (k === '*') chooseOp('*');
    else if (k === '/') { e.preventDefault(); chooseOp('/'); }
  });

  // 初始：先在后台放一题，菜单盖在上面
  newPuzzle(false);
  diffNameEl.textContent = cfg.name;
  menuEl.classList.add('on');
  updateHud();
})();
</script>
</body>
</html>
