<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>迷你高尔夫</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#07130d;color:#eaf7ef;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  #cv{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .hud{position:fixed;left:16px;top:12px;display:flex;gap:18px;font-size:13px;color:#93b7a4;pointer-events:none;z-index:2;flex-wrap:wrap}
  .hud b{color:#8ef0b5;font-size:16px;margin-left:4px}
  .hint{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);font-size:12px;color:#6b8f7d;pointer-events:none;white-space:nowrap}
  .toast{position:fixed;left:50%;top:20%;transform:translate(-50%,-8px);padding:9px 20px;border-radius:12px;background:rgba(8,24,16,.92);border:1px solid rgba(142,240,181,.35);color:#c8ffdb;font-size:15px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:4}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,10,7,.88);z-index:3;text-align:center;padding:24px}
  .overlay.hide{display:none}
  .overlay h1{margin:0 0 8px;font-size:30px;letter-spacing:.08em;color:#c4ffd9}
  .overlay p{margin:0 0 20px;color:#8fb3a2;font-size:13px;line-height:1.8}
  .overlay button{border:1px solid rgba(142,240,181,.45);background:rgba(142,240,181,.12);color:#d6ffe8;padding:11px 30px;border-radius:999px;font-size:15px;cursor:pointer}
  .overlay button:active{transform:scale(.97)}
</style>
<style id="tx-aurora-skin">
/* tx-aurora-skin:pocketgolf */
:root{--tx-a1:#8ef0b5;--tx-a2:#4ade80;}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
::selection{background:rgba(142,240,181,0.38);color:#fff}
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:rgba(142,240,181,0.26);border-radius:99px;border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:rgba(142,240,181,0.46);background-clip:content-box}
body{background-color:#07130d!important;background-image:radial-gradient(1100px 640px at 6% -12%, rgba(142,240,181,0.16), transparent 62%), radial-gradient(900px 680px at 104% 112%, rgba(74,222,128,0.12), transparent 62%)!important}
button{transition:transform .14s ease,filter .16s ease,box-shadow .2s ease,border-color .16s ease,background-color .16s ease}
button:hover{filter:brightness(1.07)}
button:active{transform:translateY(1px) scale(.995)}
button:focus-visible{outline:2px solid rgba(142,240,181,0.72);outline-offset:2px}
.overlay,.modal,.dialog,.sheet,#levels,#loading{background-image:radial-gradient(900px 520px at 50% 0%,rgba(142,240,181,0.15),transparent 62%),radial-gradient(720px 520px at 50% 100%,rgba(74,222,128,0.08),transparent 60%)!important}
.overlay,.modal,.dialog,.sheet{backdrop-filter:blur(9px) saturate(1.1)}
.overlay h1,.modal h1,.screen h1,.overlay-card h1,.win-card h1,.result-card h1,.bcard .btitle,.loadcard .ltitle{text-shadow:0 2px 30px rgba(142,240,181,0.45)}
.overlay .screen,.overlay .panel,.overlay-card,.modal .panel,.win-card,.result-card,.bcard,.loadcard,.rules-dialog,.panel{box-shadow:0 38px 96px -34px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.07)!important}
.bcard,.loadcard{border-color:rgba(142,240,181,0.34)!important}
.overlay .panel,.overlay-card,.win-card,.result-card,.modal .panel{backdrop-filter:blur(10px) saturate(1.08);border-color:rgba(142,240,181,0.26)!important}
.overlay h1{letter-spacing:.1em}
.overlay p{color:#9fc9b3}
.overlay button{border:0!important;background:linear-gradient(135deg,#c9ffe2,#6cf0a8 55%,#38c98a)!important;color:#04150c!important;font-weight:700;padding:12px 34px!important;box-shadow:0 16px 44px -14px rgba(90,240,170,.65),inset 0 1px 0 rgba(255,255,255,.65)!important}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud">
  <span>球洞<b id="hole">1</b><span id="holeTotal">/18</span></span>
  <span>本洞杆数<b id="strokes">0</b></span>
  <span>标准杆<b id="par">2</b></span>
  <span>总杆<b id="total">0</b></span>
</div>
<div class="hint">按住并向后拖动瞄准，松手击球</div>
<div class="toast" id="toast"></div>
<div class="overlay" id="over">
  <h1 id="ovTitle">迷你高尔夫</h1>
  <p id="ovSub">从球的位置向后拖动瞄准，松手击球。<br>沙地减速、水域罚杆，紫色挡板会来回移动，共 18 洞。</p>
  <button id="start" type="button">开始游戏</button>
</div>
<script>
(function(){
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var holeEl = document.getElementById('hole');
  var holeTotalEl = document.getElementById('holeTotal');
  var strokesEl = document.getElementById('strokes');
  var parEl = document.getElementById('par');
  var totalEl = document.getElementById('total');
  var over = document.getElementById('over');
  var ovTitle = document.getElementById('ovTitle');
  var ovSub = document.getElementById('ovSub');
  var btn = document.getElementById('start');
  var toastEl = document.getElementById('toast');

  var W = 0, H = 0, dpr = 1, sc = 1, ox = 0, oy = 0;
  var WW = 800, WH = 600;

  var HOLES = [
    { name:'直道热身', ball:{x:120,y:300}, hole:{x:690,y:300}, walls:[], sand:[], water:[], par:2 },
    { name:'斜穿沙地', ball:{x:110,y:470}, hole:{x:700,y:140}, walls:[], sand:[{x:330,y:280,w:210,h:110}], water:[], par:2 },
    { name:'中路挡墙', ball:{x:110,y:300}, hole:{x:690,y:300}, walls:[{x:390,y:120,w:22,h:220}], sand:[], water:[], par:3 },
    { name:'双门',     ball:{x:110,y:300}, hole:{x:700,y:300}, walls:[{x:330,y:20,w:22,h:230},{x:330,y:350,w:22,h:230}], sand:[{x:390,y:250,w:120,h:100}], water:[], par:3 },
    { name:'湖心',     ball:{x:110,y:300}, hole:{x:700,y:300}, walls:[], sand:[], water:[{x:330,y:180,w:180,h:240}], par:3 },
    { name:'拐角',     ball:{x:110,y:520}, hole:{x:690,y:120}, walls:[{x:300,y:20,w:22,h:380}], sand:[{x:420,y:400,w:160,h:120}], water:[], par:3 },
    { name:'S 形走廊', ball:{x:110,y:300}, hole:{x:700,y:90},  walls:[{x:200,y:360,w:380,h:22},{x:320,y:200,w:380,h:22}], sand:[], water:[], par:4 },
    { name:'岛洞',     ball:{x:110,y:300}, hole:{x:660,y:300}, walls:[], sand:[], water:[{x:560,y:150,w:180,h:40},{x:560,y:410,w:180,h:40},{x:700,y:150,w:40,h:300}], par:4 },
    { name:'蛇形长廊', ball:{x:90,y:90},   hole:{x:710,y:520}, walls:[{x:200,y:20,w:22,h:300},{x:380,y:280,w:22,h:300},{x:560,y:20,w:22,h:300}], sand:[{x:600,y:360,w:130,h:100}], water:[], par:5 },
    { name:'双湖',     ball:{x:100,y:520}, hole:{x:700,y:80},  walls:[], sand:[], water:[{x:250,y:20,w:300,h:200},{x:450,y:330,w:280,h:160}], par:4 },
    { name:'交错立柱', ball:{x:100,y:300}, hole:{x:700,y:300}, walls:[{x:250,y:20,w:22,h:320},{x:400,y:260,w:22,h:320},{x:550,y:20,w:22,h:320}], sand:[{x:250,y:430,w:150,h:110}], water:[], par:4 },
    { name:'沙海窄道', ball:{x:100,y:300}, hole:{x:700,y:300}, walls:[{x:400,y:250,w:22,h:120}], sand:[{x:250,y:150,w:300,h:120},{x:250,y:360,w:300,h:120}], water:[], par:4 },
    { name:'移动闸门', ball:{x:100,y:300}, hole:{x:720,y:300}, walls:[], sand:[], water:[], par:4,
      movers:[{x:380,y:60,w:24,h:180,dy:300,speed:0.8}] },
    { name:'双闸',     ball:{x:100,y:520}, hole:{x:720,y:90},  walls:[], sand:[], water:[], par:4,
      movers:[{x:300,y:60,w:24,h:160,dy:320,speed:1.35,phase:0},{x:520,y:380,w:24,h:160,dy:-320,speed:1.35,phase:Math.PI}] },
    { name:'水道闸口', ball:{x:100,y:300}, hole:{x:710,y:300}, walls:[], sand:[], water:[{x:330,y:20,w:160,h:230},{x:330,y:400,w:160,h:180}], par:5,
      movers:[{x:360,y:255,w:22,h:140,dx:120,speed:1.1}] },
    { name:'迷宫',     ball:{x:90,y:80},   hole:{x:720,y:540}, walls:[{x:220,y:20,w:22,h:360},{x:400,y:220,w:22,h:360},{x:580,y:20,w:22,h:380}], sand:[{x:250,y:430,w:120,h:100}], water:[], par:5 },
    { name:'三重闸',   ball:{x:90,y:300},  hole:{x:720,y:300}, walls:[], sand:[], water:[], par:5,
      movers:[{x:260,y:40,w:22,h:200,dy:320,speed:1.5,phase:0},{x:430,y:40,w:22,h:200,dy:320,speed:1.5,phase:Math.PI},{x:600,y:40,w:22,h:200,dy:320,speed:1.5,phase:0.9}] },
    { name:'终极考验', ball:{x:80,y:80},   hole:{x:730,y:530}, walls:[{x:150,y:300,w:22,h:280}], sand:[{x:590,y:380,w:150,h:110}], water:[{x:300,y:200,w:200,h:180}], par:6,
      movers:[{x:520,y:60,w:22,h:220,dy:300,speed:1.7}] }
  ];

  var idx = 0;
  var ball = null;
  var strokes = 0;
  var total = 0;
  var state = 'menu';
  var dragging = false;
  var drag = { x: 0, y: 0 };
  var toastTimer = 0;
  var last = 0;

  var R = 9, HOLE_R = 20;
  var clock = 0;
  var fieldLayer = null;

  function moverRect(m){
    var k = (Math.sin(clock * (m.speed || 1) + (m.phase || 0)) + 1) / 2;
    return { x: m.x + (m.dx || 0) * k, y: m.y + (m.dy || 0) * k, w: m.w, h: m.h };
  }

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth || window.innerWidth;
    H = cv.clientHeight || window.innerHeight;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    sc = Math.min(W / WW, H / WH);
    ox = (W - WW * sc) / 2;
    oy = (H - WH * sc) / 2;
    fieldLayer = null;
  }
  window.addEventListener('resize', resize);
  resize();

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1100);
  }

  function loadHole(n, quiet){
    idx = n;
    var h = HOLES[idx];
    ball = { x: h.ball.x, y: h.ball.y, vx: 0, vy: 0 };
    strokes = 0;
    state = 'aim';
    dragging = false;
    fieldLayer = null;
    holeEl.textContent = idx + 1;
    holeTotalEl.textContent = '/' + HOLES.length;
    parEl.textContent = h.par;
    if (!quiet) toast('第 ' + (idx + 1) + ' 洞 · ' + h.name);
    strokesEl.textContent = 0;
    totalEl.textContent = total;
  }

  function toWorld(e){
    var r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left - ox) / sc, y: (e.clientY - r.top - oy) / sc };
  }

  cv.addEventListener('pointerdown', function(e){
    if (state !== 'aim') return;
    if (Math.hypot(ball.vx, ball.vy) > 1) return;
    dragging = true;
    drag = toWorld(e);
    cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', function(e){
    if (dragging) drag = toWorld(e);
  });
  cv.addEventListener('pointerup', function(){
    if (!dragging) return;
    dragging = false;
    if (state !== 'aim') return;
    var dx = ball.x - drag.x, dy = ball.y - drag.y;
    var d = Math.hypot(dx, dy);
    if (d < 12) return;
    var power = Math.min(900, d * 4.2);
    ball.vx = dx / d * power;
    ball.vy = dy / d * power;
    strokes++;
    total++;
    strokesEl.textContent = strokes;
    totalEl.textContent = total;
    state = 'move';
  });
  cv.addEventListener('pointercancel', function(){ dragging = false; });

  function inRect(x, y, r){
    return x > r.x && x < r.x + r.w && y > r.y && y < r.y + r.h;
  }

  function hitWall(w){
    var cx = Math.max(w.x, Math.min(ball.x, w.x + w.w));
    var cy = Math.max(w.y, Math.min(ball.y, w.y + w.h));
    var dx = ball.x - cx, dy = ball.y - cy;
    var d = Math.hypot(dx, dy);
    if (d >= R) return;
    if (d === 0){ dx = 0; dy = -1; d = 1; }
    var nx = dx / d, ny = dy / d;
    ball.x = cx + nx * R;
    ball.y = cy + ny * R;
    var dot = ball.vx * nx + ball.vy * ny;
    if (dot < 0){
      ball.vx -= 1.7 * dot * nx;
      ball.vy -= 1.7 * dot * ny;
    }
  }

  function update(dt){
    if (state !== 'move' || !ball) return;
    var h = HOLES[idx];
    var speed = Math.hypot(ball.vx, ball.vy);
    var steps = Math.min(8, Math.max(1, Math.ceil(speed * dt / 8)));
    var sdt = dt / steps;

    for (var step = 0; step < steps; step++){
      ball.x += ball.vx * sdt;
      ball.y += ball.vy * sdt;

      var friction = 1.5;
      for (var s = 0; s < h.sand.length; s++){
        if (inRect(ball.x, ball.y, h.sand[s])) friction += 2.4;
      }
      var damp = Math.exp(-friction * sdt);
      ball.vx *= damp;
      ball.vy *= damp;

      if (ball.x < R + 20){ ball.x = R + 20; ball.vx = Math.abs(ball.vx) * .8; }
      if (ball.x > WW - R - 20){ ball.x = WW - R - 20; ball.vx = -Math.abs(ball.vx) * .8; }
      if (ball.y < R + 20){ ball.y = R + 20; ball.vy = Math.abs(ball.vy) * .8; }
      if (ball.y > WH - R - 20){ ball.y = WH - R - 20; ball.vy = -Math.abs(ball.vy) * .8; }

      for (var w = 0; w < h.walls.length; w++) hitWall(h.walls[w]);

      var movers = h.movers || [];
      for (var mv = 0; mv < movers.length; mv++) hitWall(moverRect(movers[mv]));

      for (var wa = 0; wa < h.water.length; wa++){
        if (inRect(ball.x, ball.y, h.water[wa])){
          ball.x = h.ball.x;
          ball.y = h.ball.y;
          ball.vx = 0;
          ball.vy = 0;
          strokes++;
          total++;
          strokesEl.textContent = strokes;
          totalEl.textContent = total;
          toast('进水，罚一杆');
          state = 'aim';
          return;
        }
      }

      var sp = Math.hypot(ball.vx, ball.vy);
      if (sp < 11){
        ball.vx = 0;
        ball.vy = 0;
        state = 'aim';
        return;
      }

      if (Math.hypot(ball.x - h.hole.x, ball.y - h.hole.y) < HOLE_R && sp < 340){
        state = 'sunk';
        toast('进洞！用了 ' + strokes + ' 杆');
        setTimeout(function(){
          if (idx + 1 < HOLES.length){
            loadHole(idx + 1);
          } else {
            state = 'done';
            var parSum = 0;
            for (var i = 0; i < HOLES.length; i++) parSum += HOLES[i].par;
            ovTitle.textContent = '全部进洞';
            ovSub.innerHTML = '总杆数 ' + total + '（标准杆 ' + parSum + '）<br>' + (total <= parSum ? '低于标准杆，漂亮。' : '再打一轮追平标准杆。');
            btn.textContent = '再打一轮';
            over.classList.remove('hide');
          }
        }, 900);
        return;
      }
    }
  }

  function rr(x, y, w, h, r){
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function pr(i){ var v = Math.sin(i * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); }

  function buildField(){
    var lc = document.createElement('canvas');
    lc.width = Math.max(1, Math.round(W * dpr));
    lc.height = Math.max(1, Math.round(H * dpr));
    var realCtx = ctx;
    ctx = lc.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#06130c');
    bg.addColorStop(.55, '#081b12');
    bg.addColorStop(1, '#040d08');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    var glow = ctx.createRadialGradient(W * .5, H * .18, 0, W * .5, H * .18, Math.max(W, H) * .8);
    glow.addColorStop(0, 'rgba(80,220,150,.10)');
    glow.addColorStop(.55, 'rgba(40,120,90,.04)');
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(ox, oy);
    ctx.scale(sc, sc);

    var h = HOLES[idx];

    /* ---- 球道底板 ---- */
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.65)';
    ctx.shadowBlur = 46;
    ctx.shadowOffsetY = 18;
    rr(20, 20, WW - 40, WH - 40, 28);
    ctx.fillStyle = '#0d2b1c';
    ctx.fill();
    ctx.restore();

    rr(20, 20, WW - 40, WH - 40, 28);
    var fair = ctx.createRadialGradient(WW * .46, WH * .42, 20, WW * .5, WH * .5, WW * .72);
    fair.addColorStop(0, '#1a4d31');
    fair.addColorStop(.55, '#123a25');
    fair.addColorStop(1, '#0a2618');
    ctx.fillStyle = fair;
    ctx.fill();

    ctx.save();
    rr(20, 20, WW - 40, WH - 40, 28);
    ctx.clip();

    /* 修剪草纹 */
    for (var sy = 20; sy < WH - 20; sy += 54){
      ctx.fillStyle = (Math.floor((sy - 20) / 54) % 2) ? 'rgba(255,255,255,.022)' : 'rgba(2,18,10,.10)';
      ctx.fillRect(20, sy, WW - 40, 54);
    }
    /* 细草点 */
    for (var g = 0; g < 420; g++){
      var gx = 24 + pr(g * 3.1) * (WW - 48);
      var gy = 24 + pr(g * 7.7 + 9) * (WH - 48);
      ctx.fillStyle = 'rgba(150,240,190,' + (0.03 + pr(g) * 0.06) + ')';
      ctx.fillRect(gx, gy, 1.4, 1.4);
    }
    /* 中央推杆光带 */
    var lane = ctx.createLinearGradient(20, WH * .5, WW - 20, WH * .5);
    lane.addColorStop(0, 'rgba(120,255,180,0)');
    lane.addColorStop(.5, 'rgba(120,255,180,.035)');
    lane.addColorStop(1, 'rgba(120,255,180,0)');
    ctx.fillStyle = lane;
    ctx.fillRect(20, WH * .5 - 70, WW - 40, 140);

    /* ---- 沙地 ---- */
    for (var s = 0; s < h.sand.length; s++){
      var sd = h.sand[s];
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,.35)';
      ctx.shadowBlur = 14;
      ctx.shadowOffsetY = 4;
      rr(sd.x, sd.y, sd.w, sd.h, 18);
      ctx.fillStyle = '#c9a96a';
      ctx.fill();
      ctx.restore();

      var sg = ctx.createLinearGradient(sd.x, sd.y, sd.x + sd.w, sd.y + sd.h);
      sg.addColorStop(0, '#e2c489');
      sg.addColorStop(.55, '#c9a96a');
      sg.addColorStop(1, '#a9854b');
      rr(sd.x, sd.y, sd.w, sd.h, 18);
      ctx.fillStyle = sg;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,235,190,.35)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      for (var sp = 0; sp < 40; sp++){
        var sx = sd.x + 6 + pr(s * 31 + sp * 2.3) * (sd.w - 12);
        var sy2 = sd.y + 6 + pr(s * 17 + sp * 5.1) * (sd.h - 12);
        ctx.fillStyle = 'rgba(110,80,40,' + (0.10 + pr(sp) * 0.18) + ')';
        ctx.fillRect(sx, sy2, 1.6, 1.6);
      }
    }

    /* ---- 水域静态底 ---- */
    for (var wa = 0; wa < h.water.length; wa++){
      var wt = h.water[wa];
      ctx.save();
      ctx.shadowColor = 'rgba(30,140,220,.35)';
      ctx.shadowBlur = 18;
      rr(wt.x, wt.y, wt.w, wt.h, 16);
      ctx.fillStyle = '#0d4f78';
      ctx.fill();
      ctx.restore();

      var wg = ctx.createLinearGradient(wt.x, wt.y, wt.x + wt.w, wt.y + wt.h);
      wg.addColorStop(0, '#1a7fae');
      wg.addColorStop(.5, '#15628f');
      wg.addColorStop(1, '#0c4467');
      rr(wt.x, wt.y, wt.w, wt.h, 16);
      ctx.fillStyle = wg;
      ctx.fill();
      ctx.strokeStyle = 'rgba(150,235,255,.4)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.save();
      rr(wt.x, wt.y, wt.w, wt.h, 16);
      ctx.clip();
      var sheen = ctx.createLinearGradient(wt.x, wt.y, wt.x, wt.y + wt.h);
      sheen.addColorStop(0, 'rgba(255,255,255,.20)');
      sheen.addColorStop(.28, 'rgba(255,255,255,.02)');
      sheen.addColorStop(1, 'rgba(0,30,60,.18)');
      ctx.fillStyle = sheen;
      ctx.fillRect(wt.x, wt.y, wt.w, wt.h);
      ctx.restore();
    }

    /* ---- 静态挡墙 ---- */
    for (var w = 0; w < h.walls.length; w++){
      var wall = h.walls[w];
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,.5)';
      ctx.shadowBlur = 10;
      ctx.shadowOffsetX = 3;
      ctx.shadowOffsetY = 4;
      rr(wall.x, wall.y, wall.w, wall.h, 6);
      ctx.fillStyle = '#2e4a3c';
      ctx.fill();
      ctx.restore();

      var wl = ctx.createLinearGradient(wall.x, wall.y, wall.x + wall.w, wall.y + wall.h);
      wl.addColorStop(0, '#5d8873');
      wl.addColorStop(.5, '#416653');
      wl.addColorStop(1, '#2c4a3a');
      rr(wall.x, wall.y, wall.w, wall.h, 6);
      ctx.fillStyle = wl;
      ctx.fill();
      ctx.strokeStyle = 'rgba(200,240,215,.45)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.20)';
      ctx.fillRect(wall.x + 3, wall.y + 3, Math.max(2, wall.w - 6), 3);
    }

    /* ---- 球洞 ---- */
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.75)';
    ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.arc(h.hole.x, h.hole.y, HOLE_R + 3, 0, 6.2832);
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fill();
    ctx.restore();

    var holeG = ctx.createRadialGradient(h.hole.x, h.hole.y - 4, 2, h.hole.x, h.hole.y, HOLE_R);
    holeG.addColorStop(0, '#000000');
    holeG.addColorStop(.72, '#020d07');
    holeG.addColorStop(1, '#0a2416');
    ctx.beginPath(); ctx.arc(h.hole.x, h.hole.y, HOLE_R, 0, 6.2832);
    ctx.fillStyle = holeG; ctx.fill();
    ctx.strokeStyle = 'rgba(200,255,220,.55)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(h.hole.x, h.hole.y, HOLE_R, 0, 6.2832); ctx.stroke();
    ctx.strokeStyle = 'rgba(142,240,181,.20)';
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(h.hole.x, h.hole.y, HOLE_R + 5, 0, 6.2832); ctx.stroke();

    /* 旗杆 */
    var poleTop = h.hole.y - 50;
    var poleG = ctx.createLinearGradient(h.hole.x - 2, 0, h.hole.x + 2, 0);
    poleG.addColorStop(0, '#9db3a8');
    poleG.addColorStop(.5, '#ffffff');
    poleG.addColorStop(1, '#7f948a');
    ctx.strokeStyle = poleG;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(h.hole.x, h.hole.y); ctx.lineTo(h.hole.x, poleTop); ctx.stroke();

    /* 球道内暗角 */
    var vig = ctx.createRadialGradient(WW * .5, WH * .48, WW * .28, WW * .5, WH * .5, WW * .68);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,10,5,.34)');
    ctx.fillStyle = vig;
    ctx.fillRect(20, 20, WW - 40, WH - 40);
    ctx.restore();

    /* 球道描边 */
    rr(20, 20, WW - 40, WH - 40, 28);
    ctx.strokeStyle = 'rgba(142,240,181,.30)';
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.06)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.restore();
    ctx = realCtx;
    fieldLayer = lc;
  }

  function draw(){
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!fieldLayer) buildField();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(fieldLayer, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.save();
    ctx.translate(ox, oy);
    ctx.scale(sc, sc);

    var h = HOLES[idx];
    var t = clock;

    /* ---- 水域波纹 ---- */
    for (var wa = 0; wa < h.water.length; wa++){
      var wt = h.water[wa];
      ctx.save();
      rr(wt.x, wt.y, wt.w, wt.h, 16);
      ctx.clip();
      ctx.strokeStyle = 'rgba(190,245,255,.36)';
      ctx.lineWidth = 1.6;
      for (var wy = wt.y + 14; wy < wt.y + wt.h; wy += 24){
        var off = Math.sin(t * 1.4 + wy * .05) * 7;
        ctx.beginPath();
        ctx.moveTo(wt.x + 8 + off, wy);
        ctx.quadraticCurveTo(wt.x + wt.w / 2 + off, wy - 8, wt.x + wt.w - 8 + off, wy);
        ctx.stroke();
      }
      ctx.restore();
    }

    /* ---- 移动挡板 ---- */
    var movers = h.movers || [];
    for (var mv = 0; mv < movers.length; mv++){
      var mr = moverRect(movers[mv]);
      ctx.save();
      ctx.shadowColor = 'rgba(150,110,255,.7)';
      ctx.shadowBlur = 18;
      rr(mr.x, mr.y, mr.w, mr.h, 7);
      ctx.fillStyle = '#5c47c4';
      ctx.fill();
      ctx.restore();

      var mg = ctx.createLinearGradient(mr.x, mr.y, mr.x + mr.w, mr.y + mr.h);
      mg.addColorStop(0, '#a08cff');
      mg.addColorStop(.5, '#7458e8');
      mg.addColorStop(1, '#4b34a8');
      rr(mr.x, mr.y, mr.w, mr.h, 7);
      ctx.fillStyle = mg;
      ctx.fill();
      ctx.strokeStyle = 'rgba(226,218,255,.85)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.34)';
      ctx.fillRect(mr.x + 3, mr.y + 3, Math.max(2, mr.w - 6), 3);
      ctx.fillStyle = 'rgba(20,10,50,.35)';
      for (var mk = 0; mk < 3; mk++){
        ctx.fillRect(mr.x + mr.w / 2 - 3, mr.y + mr.h * (.32 + mk * .18), 6, 2);
      }
    }

    /* 旗帜 */
    var poleTop = h.hole.y - 50;
    var wave = Math.sin(t * 3.2) * 3;
    var flagG = ctx.createLinearGradient(h.hole.x, poleTop, h.hole.x + 32, poleTop + 14);
    flagG.addColorStop(0, '#ff8fa6');
    flagG.addColorStop(1, '#e8456b');
    ctx.beginPath();
    ctx.moveTo(h.hole.x, poleTop);
    ctx.quadraticCurveTo(h.hole.x + 16, poleTop - 4 + wave, h.hole.x + 32, poleTop + 4 + wave);
    ctx.quadraticCurveTo(h.hole.x + 16, poleTop + 12 + wave, h.hole.x, poleTop + 16);
    ctx.closePath();
    ctx.fillStyle = flagG;
    ctx.shadowColor = 'rgba(255,90,130,.45)';
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;

    /* 环境浮尘 */
    for (var p = 0; p < 26; p++){
      var px = 30 + pr(p * 2.7) * (WW - 60);
      var py = 30 + ((pr(p * 5.3) * (WH - 60)) + t * (6 + pr(p) * 10)) % (WH - 60);
      ctx.fillStyle = 'rgba(210,255,225,' + (0.10 + pr(p + 3) * 0.16) + ')';
      ctx.beginPath(); ctx.arc(px, py, 1.1 + pr(p) * 1.2, 0, 6.2832); ctx.fill();
    }

    /* ---- 瞄准线 ---- */
    if (dragging && ball){
      var dx = ball.x - drag.x, dy = ball.y - drag.y;
      var d = Math.hypot(dx, dy);
      if (d > 12){
        var maxD = Math.min(d, 210);
        var ex = ball.x - dx / d * maxD;
        var ey = ball.y - dy / d * maxD;
        var power = Math.min(1, d / 210);
        ctx.save();
        ctx.shadowColor = 'rgba(142,240,181,.55)';
        ctx.shadowBlur = 10;
        ctx.strokeStyle = 'rgba(142,240,181,.85)';
        ctx.lineWidth = 2.5;
        ctx.setLineDash([10, 9]);
        ctx.lineDashOffset = -t * 26;
        ctx.beginPath(); ctx.moveTo(ball.x, ball.y); ctx.lineTo(ex, ey); ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
        ctx.strokeStyle = 'rgba(142,240,181,.28)';
        ctx.lineWidth = 7;
        ctx.beginPath(); ctx.arc(ex, ey, 10, 0, 6.2832); ctx.stroke();
        ctx.fillStyle = 'rgba(142,240,181,' + (.22 + power * .32) + ')';
        ctx.beginPath(); ctx.arc(ex, ey, 5.5, 0, 6.2832); ctx.fill();
        ctx.strokeStyle = 'rgba(200,255,220,.55)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, 18, -1.5708, -1.5708 + 6.2832 * power);
        ctx.stroke();
      }
    }

    /* ---- 球 ---- */
    if (ball){
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,.55)';
      ctx.shadowBlur = 8;
      ctx.shadowOffsetY = 3;
      ctx.beginPath(); ctx.arc(ball.x, ball.y + 1.5, R, 0, 6.2832);
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fill();
      ctx.restore();

      var bg2 = ctx.createRadialGradient(ball.x - R * .35, ball.y - R * .38, R * .1, ball.x, ball.y, R * 1.06);
      bg2.addColorStop(0, '#ffffff');
      bg2.addColorStop(.55, '#effff6');
      bg2.addColorStop(1, '#b9d9c7');
      ctx.beginPath(); ctx.arc(ball.x, ball.y, R, 0, 6.2832);
      ctx.fillStyle = bg2; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.85)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.beginPath(); ctx.arc(ball.x - R * .32, ball.y - R * .4, R * .28, 0, 6.2832); ctx.fill();
      ctx.save();
      ctx.shadowColor = 'rgba(180,255,215,.6)';
      ctx.shadowBlur = 10;
      ctx.strokeStyle = 'rgba(180,255,215,.65)';
      ctx.beginPath(); ctx.arc(ball.x, ball.y, R + 3, 0, 6.2832); ctx.stroke();
      ctx.restore();
    }

    ctx.restore();
  }

  function frame(t){
    if (!last) last = t;
    var dt = Math.min(.033, (t - last) / 1000);
    last = t;
    clock += dt;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  btn.addEventListener('click', function(){
    total = 0;
    over.classList.add('hide');
    loadHole(0);
  });

  loadHole(0, true);
  state = 'menu';
  requestAnimationFrame(frame);
})();
</script>
</body>
