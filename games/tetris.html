<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>俄罗斯方块 · 离线版</title>
<style>
  :root {
    --bg: #060a13;
    --panel: #0d1626;
    --panel-2: #09111e;
    --line: rgba(148, 163, 184, 0.14);
    --text: #eaf2ff;
    --muted: #8ea0bd;
    --mint: #5eead4;
    --sky: #38bdf8;
    --violet: #a78bfa;
    --rose: #fb7185;
    --amber: #fbbf24;
    --board-width: clamp(216px, 45vh, 460px);
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    min-height: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    color: var(--text);
    background:
      radial-gradient(circle at 12% 8%, rgba(56, 189, 248, 0.13), transparent 33%),
      radial-gradient(circle at 88% 92%, rgba(167, 139, 250, 0.14), transparent 36%),
      radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.35), transparent 65%),
      var(--bg);
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      linear-gradient(rgba(148, 163, 184, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148, 163, 184, 0.035) 1px, transparent 1px);
    background-size: 46px 46px;
    -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 88%);
    mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 88%);
  }

  button {
    font-family: inherit;
  }

  button:focus-visible {
    outline: 2px solid rgba(94, 234, 212, 0.8);
    outline-offset: 2px;
  }

  .game {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: auto 292px;
    gap: 22px;
    align-items: start;
    width: max-content;
    max-width: 100%;
  }

  .play-area {
    width: var(--board-width);
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .board-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 0 4px;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: #7083a1;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(8, 14, 25, 0.72);
    color: #98a9c3;
    font-size: 10px;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 8px currentColor;
  }

  .status-playing {
    color: #7ef0c6;
    border-color: rgba(94, 234, 212, 0.24);
  }

  .status-playing .status-dot {
    animation: statusPulse 1.6s ease-in-out infinite;
  }

  .status-clearing {
    color: #7dd3fc;
    border-color: rgba(56, 189, 248, 0.28);
  }

  .status-paused {
    color: #f8d477;
    border-color: rgba(251, 191, 36, 0.26);
  }

  .status-over {
    color: #fda4af;
    border-color: rgba(251, 113, 133, 0.28);
  }

  @keyframes statusPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .board-frame {
    position: relative;
    padding: 7px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 22px;
    background:
      linear-gradient(155deg, rgba(94, 234, 212, 0.2), rgba(56, 189, 248, 0.06) 33%, rgba(167, 139, 250, 0.16));
    box-shadow:
      0 28px 80px rgba(0, 0, 0, 0.6),
      0 0 46px rgba(56, 189, 248, 0.06),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }

  .board-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 2;
    overflow: hidden;
    border-radius: 16px;
    background: #04070d;
    box-shadow:
      inset 0 0 42px rgba(0, 0, 0, 0.85),
      inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }

  #board {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: block;
    width: 100%;
    height: 100%;
  }

  .board-wrap::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.018) 0,
      rgba(255, 255, 255, 0.018) 1px,
      transparent 1px,
      transparent 3px
    );
    opacity: 0.65;
    mix-blend-mode: screen;
  }

  .overlay {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: grid;
    place-items: center;
    padding: 16px;
    background: rgba(3, 7, 14, 0.62);
    -webkit-backdrop-filter: blur(7px);
    backdrop-filter: blur(7px);
    opacity: 1;
    visibility: visible;
    transition: opacity 0.22s ease, visibility 0.22s ease;
  }

  .overlay.is-hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .overlay-card {
    width: 100%;
    padding: 22px 16px 17px;
    text-align: center;
    border: 1px solid rgba(148, 163, 184, 0.16);
    border-radius: 18px;
    background:
      linear-gradient(160deg, rgba(18, 30, 51, 0.96), rgba(7, 13, 24, 0.97));
    box-shadow:
      0 24px 60px rgba(0, 0, 0, 0.58),
      inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }

  .overlay:not(.is-hidden) .overlay-card {
    animation: overlayIn 0.24s ease both;
  }

  .overlay .overlay-card.is-static {
    animation: none;
  }

  @keyframes overlayIn {
    from {
      opacity: 0;
      transform: translateY(8px) scale(0.985);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .overlay-tag {
    margin-bottom: 8px;
    color: #72e7d4;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.18em;
  }

  .overlay.is-paused .overlay-tag {
    color: #f8d477;
  }

  .overlay.is-over .overlay-tag {
    color: #fda4af;
  }

  .overlay-card h2 {
    margin: 0;
    font-size: 25px;
    line-height: 1.2;
    letter-spacing: 0.04em;
  }

  .overlay-card p {
    margin: 9px 0 0;
    color: #91a3bf;
    font-size: 12px;
    line-height: 1.8;
  }

  .overlay-score {
    margin-top: 12px;
    padding: 8px 9px;
    border: 1px solid rgba(148, 163, 184, 0.12);
    border-radius: 9px;
    background: rgba(4, 9, 17, 0.6);
    color: #dce8fb;
    font-size: 12px;
    line-height: 1.6;
  }

  .overlay-score:empty {
    display: none;
  }

  .overlay-btn {
    width: 100%;
    margin-top: 15px;
    padding: 12px 12px;
    border: 0;
    border-radius: 12px;
    background: linear-gradient(135deg, #5eead4 0%, #38bdf8 100%);
    color: #04131d;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.08em;
    cursor: pointer;
    box-shadow: 0 12px 30px rgba(56, 189, 248, 0.18);
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }

  .overlay-btn:hover {
    filter: brightness(1.06);
    box-shadow: 0 14px 34px rgba(56, 189, 248, 0.25);
  }

  .overlay-btn:active {
    transform: translateY(1px);
  }

  .overlay-hint {
    margin-top: 11px !important;
    color: #637692 !important;
    font-size: 10px !important;
    letter-spacing: 0.06em;
  }

  .overlay.is-win .overlay-tag {
    color: #ffd76e;
  }

  .overlay-score {
    white-space: pre-line;
  }

  .overlay-modes {
    margin-top: 12px;
  }

  .overlay-modes[hidden] {
    display: none;
  }

  .overlay-btn-ghost {
    margin-top: 8px;
    border: 1px solid rgba(148, 163, 184, 0.26);
    background: rgba(13, 22, 38, 0.82);
    color: #a9bbd5;
    box-shadow: none;
  }

  .overlay-btn-ghost:hover {
    border-color: rgba(94, 234, 212, 0.32);
    color: #e6fffb;
  }

  .overlay-btn-ghost[hidden] {
    display: none;
  }

  .mode-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .mode-chip {
    min-width: 0;
    padding: 8px 6px;
    overflow: hidden;
    border: 1px solid rgba(148, 163, 184, 0.16);
    border-radius: 10px;
    background: linear-gradient(180deg, rgba(20, 32, 53, 0.94), rgba(10, 18, 31, 0.94));
    color: #a9bbd5;
    font-size: 11px;
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: 0.06em;
    white-space: nowrap;
    text-overflow: ellipsis;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease, transform 0.15s ease;
  }

  .mode-chip:hover:not(:disabled) {
    border-color: rgba(94, 234, 212, 0.3);
    color: #e6fffb;
    transform: translateY(-1px);
  }

  .mode-chip.is-active {
    border-color: rgba(94, 234, 212, 0.5);
    background: linear-gradient(160deg, rgba(94, 234, 212, 0.2), rgba(56, 189, 248, 0.08));
    color: #effffc;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.08),
      0 6px 16px rgba(56, 189, 248, 0.12);
  }

  .mode-chip:disabled {
    opacity: 0.42;
    cursor: default;
    transform: none;
  }

  .status-win {
    color: #ffe08a;
    border-color: rgba(251, 191, 36, 0.32);
  }

  .status-win .status-dot {
    background: currentColor;
    box-shadow: 0 0 8px currentColor;
  }

  .zen-toast {
    position: absolute;
    left: 50%;
    bottom: 12%;
    z-index: 4;
    padding: 7px 13px;
    border: 1px solid rgba(94, 234, 212, 0.3);
    border-radius: 999px;
    background: rgba(5, 13, 24, 0.86);
    color: #9df5e5;
    font-size: 11px;
    letter-spacing: 0.1em;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, 8px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  .zen-toast.is-show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  .side-panel {
    width: 292px;
    align-self: stretch;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 10px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 0 2px 4px;
  }

  .brand-logo {
    flex: 0 0 auto;
    width: 38px;
    height: 38px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 3px;
    transform: rotate(-6deg);
    filter: drop-shadow(0 5px 12px rgba(0, 0, 0, 0.4));
  }

  .brand-logo span {
    border-radius: 4px;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.4),
      inset 0 -2px 0 rgba(0, 0, 0, 0.16);
  }

  .brand-logo span:nth-child(1) { background: #22d3ee; }
  .brand-logo span:nth-child(2) { background: #facc15; }
  .brand-logo span:nth-child(3) { background: #c084fc; }
  .brand-logo span:nth-child(4) { background: #4ade80; }

  .brand h1 {
    margin: 0;
    font-size: 21px;
    line-height: 1.2;
    font-weight: 800;
    letter-spacing: 0.1em;
  }

  .brand p {
    margin: 3px 0 0;
    color: #7184a1;
    font-size: 10px;
    letter-spacing: 0.16em;
  }

  .stats {
    display: grid;
    grid-template-columns: 1.15fr 0.7fr 1.05fr 0.95fr;
    gap: 6px;
  }

  .stat {
    min-width: 0;
    padding: 8px 9px 9px;
    border: 1px solid var(--line);
    border-radius: 13px;
    background: linear-gradient(150deg, rgba(19, 31, 51, 0.92), rgba(9, 16, 29, 0.9));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.035);
  }

  .stat-label {
    display: block;
    margin-bottom: 2px;
    color: var(--muted);
    font-size: 9.5px;
    letter-spacing: 0.12em;
    white-space: nowrap;
  }

  .stat-value {
    display: block;
    overflow: hidden;
    color: #f3f8ff;
    font-size: 18px;
    font-weight: 800;
    line-height: 1.25;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  #scoreValue {
    font-size: 17px;
  }

  #levelValue {
    color: #c4b5fd;
  }

  #linesValue {
    color: #7dd3fc;
  }

  #timeValue {
    color: #86efac;
    font-size: 16px;
  }

  .is-bump {
    animation: valueBump 0.3s ease;
  }

  @keyframes valueBump {
    0% { transform: scale(1); }
    40% { transform: scale(1.14); color: #5eead4; }
    100% { transform: scale(1); }
  }

  .panel-card {
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: 15px;
    background: linear-gradient(160deg, rgba(17, 28, 47, 0.92), rgba(9, 17, 30, 0.9));
    box-shadow:
      0 16px 36px rgba(0, 0, 0, 0.18),
      inset 0 1px 0 rgba(255, 255, 255, 0.03);
  }

  .panel-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }

  .panel-head strong {
    color: #dce8fb;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
  }

  .panel-head span {
    color: #647590;
    font-size: 9px;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }

  .next-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 7px;
  }

  .next-slot {
    position: relative;
    height: 54px;
    overflow: hidden;
    border: 1px solid rgba(148, 163, 184, 0.11);
    border-radius: 10px;
    background: rgba(3, 8, 16, 0.5);
  }

  .next-slot:first-child {
    border-color: rgba(94, 234, 212, 0.23);
    background: linear-gradient(160deg, rgba(94, 234, 212, 0.055), rgba(3, 8, 16, 0.58));
  }

  .next-slot canvas,
  .hold-wrap canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .slot-no {
    position: absolute;
    top: 4px;
    left: 6px;
    color: #3e4f68;
    font-size: 8px;
    font-variant-numeric: tabular-nums;
  }

  .split-grid {
    display: grid;
    grid-template-columns: 1.12fr 0.88fr;
    gap: 8px;
  }

  .hold-wrap {
    position: relative;
    height: 58px;
    overflow: hidden;
    border: 1px solid rgba(148, 163, 184, 0.11);
    border-radius: 10px;
    background: rgba(3, 8, 16, 0.5);
  }

  .hold-empty {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #5b6c86;
    font-size: 10px;
    letter-spacing: 0.14em;
    transition: opacity 0.15s ease;
  }

  .hold-empty.is-hidden {
    opacity: 0;
  }

  .best-card {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .best-value {
    overflow: hidden;
    margin-top: 0;
    min-width: 0;
    color: var(--amber);
    font-size: 21px;
    font-weight: 800;
    line-height: 1.25;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .best-line {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0 6px;
    margin-top: auto;
    min-width: 0;
  }

  .best-mode {
    flex: 0 0 auto;
    color: #7dd3fc;
    font-size: 9px;
    letter-spacing: 0.06em;
    white-space: nowrap;
  }

  .best-caption {
    margin-top: 3px;
    color: #647590;
    font-size: 9px;
    letter-spacing: 0.08em;
  }

  .best-time {
    margin-top: 2px;
    color: #7f92ad;
    font-size: 9px;
    line-height: 1.5;
    white-space: normal;
    letter-spacing: 0.04em;
  }

  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .btn {
    padding: 10px 8px;
    border: 1px solid rgba(148, 163, 184, 0.16);
    border-radius: 11px;
    background: linear-gradient(180deg, rgba(23, 35, 58, 0.96), rgba(11, 19, 33, 0.96));
    color: #ced9ea;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    transition: border-color 0.15s ease, transform 0.15s ease, filter 0.15s ease;
  }

  .btn:hover:not(:disabled) {
    border-color: rgba(94, 234, 212, 0.3);
    filter: brightness(1.07);
  }

  .btn:active:not(:disabled) {
    transform: translateY(1px);
  }

  .btn:disabled {
    opacity: 0.38;
    cursor: default;
  }

  .btn-primary {
    border-color: transparent;
    background: linear-gradient(135deg, #5eead4 0%, #38bdf8 100%);
    color: #04131d;
    box-shadow: 0 10px 24px rgba(56, 189, 248, 0.15);
  }

  .help-card {
    padding-bottom: 10px;
  }

  .help-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px 10px;
  }

  .help-item {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    color: #94a7c3;
    font-size: 10.5px;
    line-height: 1.25;
    white-space: nowrap;
  }

  kbd {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 21px;
    height: 21px;
    padding: 0 5px;
    border: 1px solid rgba(148, 163, 184, 0.22);
    border-bottom-color: rgba(0, 0, 0, 0.6);
    border-radius: 5px;
    background: #111c2f;
    color: #dbe7fa;
    font-family: "Microsoft YaHei", system-ui, sans-serif;
    font-size: 9.5px;
    font-weight: 700;
    line-height: 1;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    white-space: nowrap;
  }

  kbd.wide {
    min-width: 38px;
  }

  .help-foot {
    margin: 8px 0 0;
    padding-top: 8px;
    border-top: 1px solid rgba(148, 163, 184, 0.08);
    color: #5e708b;
    font-size: 9.5px;
    letter-spacing: 0.04em;
  }

  .offline-note {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 1px 0 3px;
    color: #566780;
    font-size: 9.5px;
    letter-spacing: 0.06em;
  }

  .offline-note::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 8px rgba(74, 222, 128, 0.6);
  }

  .touch-controls {
    display: none;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 6px;
    transition: opacity 0.18s ease;
  }

  .touch-controls.is-muted {
    opacity: 0.42;
  }

  .touch-btn {
    height: 46px;
    padding: 0;
    border: 1px solid rgba(148, 163, 184, 0.16);
    border-radius: 11px;
    background: linear-gradient(180deg, #17233a, #0d1626);
    color: #dce8fb;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  .touch-btn.symbol {
    font-size: 18px;
  }

  .touch-btn:active {
    transform: translateY(1px);
    border-color: rgba(94, 234, 212, 0.35);
    background: linear-gradient(180deg, #1c2d49, #101c31);
  }

  @media (max-width: 780px) {
    body {
      align-items: flex-start;
      padding: 16px 14px 28px;
    }

    .game {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 14px;
    }

    .play-area {
      width: min(74vw, 310px);
    }

    .side-panel {
      width: min(100%, 360px);
    }

    .touch-controls {
      display: grid;
    }

    .brand {
      justify-content: center;
    }
  }

  @media (max-width: 780px) and (max-height: 660px) {
    body { padding-top: 8px; padding-bottom: 16px; }
    .play-area { width: min(65vw, 260px); }
    .touch-controls { gap: 4px; }
    .touch-btn { height: 42px; }
  }

  @media (max-height: 700px) and (min-width: 781px) {
    body {
      padding: 14px;
    }

    .side-panel {
      gap: 8px;
    }

    .brand p {
      display: none;
    }

    .panel-card {
      padding: 9px 11px;

  function emptyRow() {
    var row = [];
    for (var x = 0; x < COLS; x++) {
      row.push(null);
    }
    return row;
  }

  function createBoard() {
    var rows = [];
    for (var y = 0; y < ROWS; y++) {
      rows.push(emptyRow());
    }
    return rows;
  }

  function formatNumber(value) {
    try {
      return value.toLocaleString('zh-CN');
    } catch (error) {
      return String(value);
    }
  }

  function formatClock(ms) {
    var total = Math.max(0, Math.floor(ms / 1000));
    var minutes = Math.floor(total / 60);
    var seconds = total % 60;
    return minutes + ':' + (seconds < 10 ? '0' : '') + seconds;
  }

  function formatClockPrecise(ms) {
    var tenths = Math.max(0, Math.floor(ms / 100));
    var minutes = Math.floor(tenths / 600);
    var seconds = Math.floor((tenths % 600) / 10);
    var fraction = tenths % 10;
    return minutes + ':' + (seconds < 10 ? '0' : '') + seconds + '.' + fraction;
  }

  function emptyRecord() {
    return { score: 0, time: 0 };
  }

  function defaultRecords() {
    return {
      sprint: emptyRecord(),
      marathon: emptyRecord(),
      zen: emptyRecord(),
      timed: emptyRecord()
    };
  }

  function readLegacyBest() {
    try {
      var saved = window.localStorage.getItem(BEST_KEY);
      var value = parseInt(saved, 10);
      if (isFinite(value) && value > 0) {
        return value;
      }
    } catch (error) {
      return 0;
    }
    return 0;
  }

  function readRecords() {
    var data = defaultRecords();
    try {
      var raw = window.localStorage.getItem(RECORDS_KEY);
      var parsed = raw ? JSON.parse(raw) : null;
      if (parsed && typeof parsed === 'object') {
        for (var i = 0; i < MODE_ORDER.length; i++) {
          var id = MODE_ORDER[i];
          var item = parsed[id];
          if (!item || typeof item !== 'object') {
            continue;
          }
          var savedScore = parseInt(item.score, 10);
          var savedTime = parseInt(item.time, 10);
          if (isFinite(savedScore) && savedScore > 0) {
            data[id].score = savedScore;
          }
          if (isFinite(savedTime) && savedTime > 0) {
            data[id].time = savedTime;
          }
        }
      } else {
        data.marathon.score = readLegacyBest();
      }
    } catch (error) {
      data.marathon.score = readLegacyBest();
    }
    return data;
  }

  function saveRecords() {
    try {
      window.localStorage.setItem(RECORDS_KEY, JSON.stringify(records));
    } catch (error) {
      return;
    }
  }

  function currentRecord() {
    if (!records[mode]) {
      records[mode] = emptyRecord();
    }
    return records[mode];
  }

  function syncRecord() {
    var record = currentRecord();
    var changed = false;
    if (score > record.score) {
      record.score = score;
      changed = true;
    }
    if (mode === 'sprint' && lineCount >= SPRINT_GOAL) {
      if (record.time <= 0 || runTime < record.time) {
        record.time = Math.max(1, Math.round(runTime));
        changed = true;
      }
    }
    if (changed) {
      saveRecords();
    }
  }

  function refreshRecords() {
    var record = currentRecord();
    best = record.score;
    bestValue.textContent = formatNumber(record.score);
    bestModeTag.textContent = MODES[mode].name;
    bestCaption.textContent = '最高分 · 保存在本机';
    if (mode === 'sprint') {
      bestTime.textContent = record.time > 0

        : '最好用时 暂无 · 通关后记录';
    } else if (mode === 'timed') {
      bestTime.textContent = '限时 2 分钟 · 时间到结算';
    } else if (mode === 'zen') {
      bestTime.textContent = '不会结束 · 顶到上方自动清盘';
    } else {
      bestTime.textContent = '每消 10 行速度加快';

  }

  function readyScoreText() {
    var record = currentRecord();

      return '目标 ' + SPRINT_GOAL + ' 行 · 最好用时 ' +

    if (mode === 'timed') {
      return '限时 ' + Math.round(TIMED_LIMIT / 1000) + ' 秒 · 最高分 ' + formatNumber(record.score);
    }
    if (mode === 'zen') {
      return '不会结束 · 最高分 ' + formatNumber(record.score);
    }
    return '无限模式 · 最高分 ' + formatNumber(record.score);
  }

      target = target.parentNode;

  function shade(hex, amount) {
    var value = parseInt(hex.slice(1), 16);
    var red = (value >> 16) & 255;
    var green = (value >> 8) & 255;
    var blue = value & 255;
    var target = amount >= 0 ? 255 : 0;
    var ratio = Math.abs(amount);
    red = Math.round(red + (target - red) * ratio);
    green = Math.round(green + (target - green) * ratio);
    blue = Math.round(blue + (target - blue) * ratio);
    return 'rgb(' + red + ', ' + green + ', ' + blue + ')';
  }

  function withAlpha(hex, alpha) {
    var value = parseInt(hex.slice(1), 16);
    var red = (value >> 16) & 255;
    var green = (value >> 8) & 255;
    var blue = value & 255;
    return 'rgba(' + red + ', ' + green + ', ' + blue + ', ' + alpha + ')';
  }

  function roundedPath(g, x, y, width, height, radius) {
    var r = Math.min(radius, width / 2, height / 2);
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + width, y, x + width, y + height, r);
    g.arcTo(x + width, y + height, x, y + height, r);
    g.arcTo(x, y + height, x, y, r);
    g.arcTo(x, y, x + width, y, r);
    g.closePath();
  }

  function drawBlock(g, px, py, size, color, ghost) {
    var gap = Math.max(1, size * 0.055);
    var x = px + gap;
    var y = py + gap;
    var width = size - gap * 2;
    var height = size - gap * 2;
    var radius = Math.max(2, size * 0.17);

    if (ghost) {
      var ghostRadius = Math.max(2, size * 0.16);
      g.save();
      g.setLineDash([Math.max(2, size * 0.1), Math.max(2, size * 0.11)]);
      g.lineWidth = Math.max(1, size * 0.045);
      g.strokeStyle = withAlpha(color, 0.62);
      g.fillStyle = withAlpha(color, 0.09);
      roundedPath(g, x, y, width, height, ghostRadius);
      g.fill();
      g.stroke();
      g.restore();
      return;
    }

    var gradient = g.createLinearGradient(x, y, x + width, y + height);
    gradient.addColorStop(0, shade(color, 0.32));
    gradient.addColorStop(0.48, color);
    gradient.addColorStop(1, shade(color, -0.28));

    roundedPath(g, x, y, width, height, radius);
    g.fillStyle = gradient;
    g.fill();

    g.save();
    g.clip();
    var shine = g.createLinearGradient(0, y, 0, y + height * 0.58);
    shine.addColorStop(0, 'rgba(255, 255, 255, 0.34)');
    shine.addColorStop(0.55, 'rgba(255, 255, 255, 0.08)');
    shine.addColorStop(1, 'rgba(255, 255, 255, 0)');
    g.fillStyle = shine;
    g.fillRect(x, y, width, height * 0.58);

    var lower = g.createLinearGradient(0, y + height * 0.68, 0, y + height);
    lower.addColorStop(0, 'rgba(0, 0, 0, 0)');
    lower.addColorStop(1, 'rgba(0, 0, 0, 0.2)');
    g.fillStyle = lower;
    g.fillRect(x, y + height * 0.68, width, height * 0.32);
    g.restore();

    roundedPath(g, x, y, width, height, radius);
    g.strokeStyle = 'rgba(255, 255, 255, 0.16)';
    g.lineWidth = Math.max(1, size * 0.032);
    g.stroke();

    g.save();
    g.fillStyle = 'rgba(255, 255, 255, 0.32)';
    g.beginPath();
    g.ellipse(
      x + width * 0.32,
      y + height * 0.18,
      Math.max(1, width * 0.18),
      Math.max(0.8, height * 0.045),
      0,
      0,
      Math.PI * 2
    );
    g.fill();
    g.restore();
  }

  function drawPreview(canvasEl, type) {
    if (!canvasEl) {
      return;
    }
    var rect = canvasEl.getBoundingClientRect();
    var width = rect.width;
    var height = rect.height;
    if (width < 2 || height < 2) {
      return;
    }

    var ratio = Math.min(window.devicePixelRatio || 1, 2);
    var targetWidth = Math.max(1, Math.round(width * ratio));
    var targetHeight = Math.max(1, Math.round(height * ratio));
    if (canvasEl.width !== targetWidth || canvasEl.height !== targetHeight) {
      canvasEl.width = targetWidth;
      canvasEl.height = targetHeight;
    }

    var g = canvasEl.getContext('2d');
    g.setTransform(ratio, 0, 0, ratio, 0, 0);
    g.clearRect(0, 0, width, height);
    if (!type) {
      return;
    }

    var shape = SHAPES[type][0];
    var minX = 99;
    var maxX = -1;
    var minY = 99;
    var maxY = -1;
    for (var y = 0; y < shape.length; y++) {
      for (var x = 0; x < shape[y].length; x++) {
        if (shape[y].charAt(x) === 'X') {
          if (x < minX) { minX = x; }
          if (x > maxX) { maxX = x; }
          if (y < minY) { minY = y; }
          if (y > maxY) { maxY = y; }
        }
      }
    }
    if (maxX < 0 || maxY < 0) {
      return;
    }

    var cols = maxX - minX + 1;
    var rows = maxY - minY + 1;
    var block = Math.min((width - 8) / cols, (height - 8) / rows, 17);
    var offsetX = (width - cols * block) / 2 - minX * block;
    var offsetY = (height - rows * block) / 2 - minY * block;
    for (var sy = 0; sy < shape.length; sy++) {
      for (var sx = 0; sx < shape[sy].length; sx++) {
        if (shape[sy].charAt(sx) === 'X') {
          drawBlock(g, offsetX + sx * block, offsetY + sy * block, block, COLORS[type], false);
        }
      }
    }
  }

  function updatePreviews() {
    for (var i = 0; i < nextCanvases.length; i++) {
      drawPreview(nextCanvases[i], queue[i] || null);
    }
    drawPreview(holdCanvas, holdType);
    holdEmpty.classList.toggle('is-hidden', !!holdType);
  }

  function resizeBoard() {
    var rect = boardWrap.getBoundingClientRect();
    if (rect.width < 10 || rect.height < 10) {
      return;
    }
    pixelRatio = Math.min(window.devicePixelRatio || 1, 2.5);
    viewW = rect.width;
    viewH = rect.height;
    var targetWidth = Math.max(1, Math.round(viewW * pixelRatio));
    var targetHeight = Math.max(1, Math.round(viewH * pixelRatio));
    if (canvas.width !== targetWidth || canvas.height !== targetHeight) {
      canvas.width = targetWidth;
      canvas.height = targetHeight;
    }
    ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    cell = Math.min(viewW / COLS, viewH / ROWS);
    originX = (viewW - cell * COLS) / 2;
    originY = (viewH - cell * ROWS) / 2;
  }

  function ensureQueue() {
    while (queue.length < 6) {
      if (bag.length === 0) {
        bag = makeBag();
      }
      queue.push(bag.pop());
    }
  }

  function makeBag() {
    var pieces = ['I', 'O', 'T', 'S', 'Z', 'J', 'L'];
    for (var i = pieces.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var temp = pieces[i];
      pieces[i] = pieces[j];
      pieces[j] = temp;
    }
    return pieces;
  }

  function newPiece(type) {
    var shape = SHAPES[type][0];
    var width = shape[0].length;
    return {
      type: type,
      rot: 0,
      x: Math.floor((COLS - width) / 2),
      y: 0
    };
  }

  function getCells(piece) {
    var shape = SHAPES[piece.type][piece.rot];
    var cells = [];
    for (var y = 0; y < shape.length; y++) {
      for (var x = 0; x < shape[y].length; x++) {
        if (shape[y].charAt(x) === 'X') {
          cells.push({ x: piece.x + x, y: piece.y + y });
        }
      }
    }
    return cells;
  }

  function collides(piece, dx, dy, rot) {
    var offsetX = dx || 0;
    var offsetY = dy || 0;
    var rotation = typeof rot === 'number' ? rot : piece.rot;
    var shape = SHAPES[piece.type][rotation];
    for (var y = 0; y < shape.length; y++) {
      for (var x = 0; x < shape[y].length; x++) {
        if (shape[y].charAt(x) !== 'X') {
          continue;
        }
        var boardX = piece.x + offsetX + x;
        var boardY = piece.y + offsetY + y;
        if (boardX < 0 || boardX >= COLS || boardY >= ROWS) {
          return true;
        }
        if (boardY >= 0 && board[boardY][boardX]) {
          return true;
        }
      }
    }
    return false;
  }

  function isGrounded() {
    return !!current && collides(current, 0, 1, current.rot);
  }

  function spawnFromNext() {
    ensureQueue();
    var type = queue.shift();
    ensureQueue();
    current = newPiece(type);
    canHold = true;
    dropAccum = 0;
    lockTimer = 0;
    softAccum = 0;
    updatePreviews();
    if (collides(current, 0, 0, current.rot)) {
      current = null;
      if (mode === 'zen') {
        zenRecover();
        return;
      }
      triggerGameOver();
    }
  }

  function tryMove(dx, dy) {
    if (!current || phase !== 'playing') {
      return false;
    }
    if (collides(current, dx, dy, current.rot)) {
      return false;
    }
    current.x += dx;
    current.y += dy;
    lockTimer = 0;
    return true;
  }

  function tryRotate(direction) {
    if (!current || phase !== 'playing') {
      return;
    }
    if (current.type === 'O') {
      current.rot = (current.rot + direction + 4) % 4;
      return;
    }

    var from = current.rot;
    var to = (from + direction + 4) % 4;
    var table = current.type === 'I' ? KICKS_I : KICKS_JLSTZ;
    var tests = table[from + '>' + to] || [[0, 0]];
    for (var i = 0; i < tests.length; i++) {
      var dx = tests[i][0];
      var dy = tests[i][1];
      if (!collides(current, dx, dy, to)) {
        current.x += dx;
        current.y += dy;
        current.rot = to;
        lockTimer = 0;
        return;
      }
    }
  }

  function beginHorizontal(direction) {
    if (phase !== 'playing' || !current) {
      return;
    }
    if (direction < 0) {
      keys.left = true;
    } else {
      keys.right = true;
    }
    activeDir = direction;
    dasTimer = 0;
    arrTimer = 0;
    tryMove(direction, 0);
  }

  function releaseHorizontal(direction) {
    if (direction < 0) {
      keys.left = false;
    } else {
      keys.right = false;
    }
    if (activeDir !== direction) {
      return;
    }
    if (keys.left && !keys.right) {
      activeDir = -1;
      dasTimer = 0;
      arrTimer = 0;
    } else if (keys.right && !keys.left) {
      activeDir = 1;
      dasTimer = 0;
      arrTimer = 0;
    } else {
      activeDir = 0;
      dasTimer = 0;
      arrTimer = 0;
    }
  }

  function pressSoftDrop() {
    if (phase !== 'playing' || !current) {
      return;
    }
    keys.down = true;
    softAccum = 0;
    tryMove(0, 1);
  }

  function releaseSoftDrop() {
    keys.down = false;
    softAccum = 0;
  }

  function resetInput() {
    keys.left = false;
    keys.right = false;
    keys.down = false;
    activeDir = 0;
    dasTimer = 0;
    arrTimer = 0;
    softAccum = 0;
  }

  function hardDrop() {
    if (!current || phase !== 'playing') {
      return;
    }
    var distance = 0;
    while (distance < ROWS && !collides(current, 0, distance + 1, current.rot)) {
      distance++;
    }
    current.y += distance;
    lockTimer = 0;
    lockPiece();
  }

  function holdCurrent() {
    if (phase !== 'playing' || !current || !canHold) {
      return;
    }
    var outgoing = current.type;
    if (holdType === null) {
      holdType = outgoing;
      spawnFromNext();
      canHold = false;
    } else {
      var incoming = holdType;
      holdType = outgoing;
      current = newPiece(incoming);
      canHold = false;
      dropAccum = 0;
      lockTimer = 0;
      softAccum = 0;
      if (collides(current, 0, 0, current.rot)) {
        current = null;
        if (mode === 'zen') {
          zenRecover();
          return;
        }
        triggerGameOver();
      }
    }
    updatePreviews();
  }

  function lockPiece() {
    if (!current || phase !== 'playing') {
      return;
    }
    var cells = getCells(current);
    var type = current.type;
    var overflow = false;
    for (var i = 0; i < cells.length; i++) {
      var x = cells[i].x;
      var y = cells[i].y;
      if (y < 0) {
        overflow = true;
      } else {
        board[y][x] = type;
      }
    }
    current = null;

    if (overflow) {
      if (mode === 'zen') {
        zenRecover();
        return;
      }
      triggerGameOver();
      return;
    }

    var fullRows = [];
    for (var row = 0; row < ROWS; row++) {
      var full = true;
      for (var col = 0; col < COLS; col++) {
        if (!board[row][col]) {
          full = false;
          break;
        }
      }
      if (full) {
        fullRows.push(row);
      }
    }

    if (fullRows.length > 0) {
      clearRows = fullRows;
      clearTimer = 0;
      phase = 'clearing';
      updateStatus();
    } else {
      spawnFromNext();
      if (phase === 'playing') {
        updateStatus();
      }
    }
  }

  function finishClear() {
    var count = clearRows.length;
    if (count === 0) {
      phase = 'playing';
      spawnFromNext();
      updateStatus();
      return;
    }

    score += SCORE_TABLE[count] * level;
    lineCount += count;
    var nextLevel = mode === 'zen' ? 1 : Math.floor(lineCount / 10) + 1;
    if (nextLevel > level) {
      level = nextLevel;
      levelValue.classList.remove('is-bump');
      void levelValue.offsetWidth;
      levelValue.classList.add('is-bump');
    }

    syncRecord();
    refreshRecords();

    if (mode === 'sprint' && lineCount >= SPRINT_GOAL) {
      updateHud();
      updateTimeHud(true);
      endRun('win');
      return;
    }

    var removed = {};
    for (var i = 0; i < clearRows.length; i++) {
      removed[clearRows[i]] = true;
    }
    var rebuilt = [];
    for (var row = 0; row < ROWS; row++) {
      if (!removed[row]) {
        rebuilt.push(board[row]);
      }
    }
    while (rebuilt.length < ROWS) {
      rebuilt.unshift(emptyRow());
    }
    board = rebuilt;

    clearRows = [];
    clearTimer = 0;
    phase = 'playing';
    updateHud();
    spawnFromNext();
    updateStatus();
  }

  function triggerGameOver() {
    if (mode === 'zen') {
      zenRecover();
      return;
    }
    endRun('topout');
  }

  function updateDAS(dt) {
    if (phase !== 'playing' || activeDir === 0) {
      return;
    }
    dasTimer += dt;
    if (dasTimer >= DAS_MS) {
      arrTimer += dt;
      while (arrTimer >= ARR_MS) {
        arrTimer -= ARR_MS;
        if (!tryMove(activeDir, 0)) {
          break;
        }
      }
    }
  }

  function gravityInterval() {
    if (mode === 'zen') {
      return 820;
    }
    return Math.max(60, 800 * Math.pow(0.82, level - 1));
  }

  function updatePlaying(dt) {
    updateDAS(dt);

    if (keys.down && current) {
      softAccum += dt;
      while (softAccum >= SOFT_MS) {
        softAccum -= SOFT_MS;
        if (!tryMove(0, 1)) {
          softAccum = 0;
          break;
        }
      }
    } else {
      softAccum = 0;
    }

    if (!current) {
      return;
    }

    dropAccum += dt;
    var interval = gravityInterval();
    while (dropAccum >= interval) {
      dropAccum -= interval;
      if (!tryMove(0, 1)) {
        dropAccum = 0;
        break;
      }
    }

    if (!current) {
      return;
    }

    if (isGrounded()) {
      lockTimer += dt;
      if (lockTimer >= LOCK_MS) {
        lockPiece();
      }
    } else {
      lockTimer = 0;
    }
  }

  function update(dt) {
    if (phase === 'playing' || phase === 'clearing') {
      if (mode === 'timed') {
        timeLeft -= dt;
        if (timeLeft <= 0) {
          timeLeft = 0;
          updateTimeHud(true);
          endRun('timeup');
          return;
        }
        updateTimeHud(false);
      } else {
        runTime += dt;
        updateTimeHud(false);
      }
    }

    if (phase === 'playing') {
      updatePlaying(dt);
    } else if (phase === 'clearing') {
      clearTimer += dt;
      if (clearTimer >= CLEAR_MS) {
        finishClear();
      }
    }
  }

  function drawGrid() {
    ctx.save();
    ctx.strokeStyle = 'rgba(148, 163, 184, 0.06)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var col = 1; col < COLS; col++) {
      var x = originX + col * cell;
      ctx.moveTo(x, originY);
      ctx.lineTo(x, originY + ROWS * cell);
    }
    for (var row = 1; row < ROWS; row++) {
      var y = originY + row * cell;
      ctx.moveTo(originX, y);
      ctx.lineTo(originX + COLS * cell, y);
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawClearEffect() {
    var progress = Math.min(1, clearTimer / CLEAR_MS);
    var fade = Math.max(0, 1 - progress);
    var scale = Math.max(0.06, 1 - progress * 0.86);

    for (var i = 0; i < clearRows.length; i++) {
      var row = clearRows[i];
      var centerY = originY + (row + 0.5) * cell;
      for (var col = 0; col < COLS; col++) {
        var type = board[row][col];
        if (!type) {
          continue;
        }
        var centerX = originX + (col + 0.5) * cell;
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.scale(scale, Math.max(0.35, 1 - progress * 0.55));
        ctx.translate(-centerX, -centerY);
        drawBlock(ctx, originX + col * cell, originY + row * cell, cell, COLORS[type], false);
        ctx.restore();

        ctx.save();
        ctx.globalAlpha = 0.72 * fade;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(originX + col * cell, originY + row * cell, cell, cell);
        ctx.restore();
      }

      ctx.save();
      var band = ctx.createLinearGradient(originX, 0, originX + COLS * cell, 0);
      band.addColorStop(0, 'rgba(255, 255, 255, 0)');
      band.addColorStop(0.5, 'rgba(255, 255, 255, ' + (0.5 * fade) + ')');
      band.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = band;
      ctx.fillRect(originX, centerY - Math.max(1, cell * 0.03), COLS * cell, Math.max(1, cell * 0.06));
      ctx.restore();
    }

    var count = clearRows.length;
    var textAlpha = Math.min(1, clearTimer / 55) * Math.max(0, 1 - Math.max(0, progress - 0.58) / 0.42);
    if (textAlpha > 0.01) {
      ctx.save();
      ctx.globalAlpha = textAlpha;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '800 ' + Math.round(Math.max(14, cell * 0.82)) + 'px "Microsoft YaHei", "PingFang SC", sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = 'rgba(94, 234, 212, 0.9)';
      ctx.shadowBlur = 18;
      var label = CLEAR_NAMES[count] + '  +' + formatNumber(SCORE_TABLE[count] * level);
      ctx.fillText(label, viewW / 2, viewH * 0.47);
      ctx.restore();
    }
  }

  function render() {
    if (viewW < 2 || viewH < 2) {
      return;
    }
    ctx.clearRect(0, 0, viewW, viewH);

    var background = ctx.createLinearGradient(0, 0, 0, viewH);
    background.addColorStop(0, '#08111f');
    background.addColorStop(1, '#04070d');
    ctx.fillStyle = background;
    ctx.fillRect(0, 0, viewW, viewH);

    var glow = ctx.createRadialGradient(
      viewW * 0.5,
      -viewH * 0.08,
      0,
      viewW * 0.5,
      -viewH * 0.08,
      viewH * 0.58
    );
    glow.addColorStop(0, 'rgba(56, 189, 248, 0.12)');
    glow.addColorStop(0.55, 'rgba(56, 189, 248, 0.025)');
    glow.addColorStop(1, 'rgba(56, 189, 248, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, viewW, viewH);

    drawGrid();

    var clearing = {};
    for (var i = 0; i < clearRows.length; i++) {
      clearing[clearRows[i]] = true;
    }

    for (var row = 0; row < ROWS; row++) {
      for (var col = 0; col < COLS; col++) {
        var type = board[row][col];
        if (type && !clearing[row]) {
          drawBlock(
            ctx,
            originX + col * cell,
            originY + row * cell,
            cell,
            COLORS[type],
            false
          );
        }
      }
    }

    if (current && phase !== 'clearing') {
      var ghostDistance = 0;
      while (ghostDistance < ROWS && !collides(current, 0, ghostDistance + 1, current.rot)) {
        ghostDistance++;
      }
      var ghostCells = getCells({
        type: current.type,
        rot: current.rot,
        x: current.x,
        y: current.y + ghostDistance
      });
      for (var g = 0; g < ghostCells.length; g++) {
        drawBlock(
          ctx,
          originX + ghostCells[g].x * cell,
          originY + ghostCells[g].y * cell,
          cell,
          COLORS[current.type],
          true
        );
      }

      var liveCells = getCells(current);
      for (var c = 0; c < liveCells.length; c++) {
        if (liveCells[c].y >= 0) {
          drawBlock(
            ctx,
            originX + liveCells[c].x * cell,
            originY + liveCells[c].y * cell,
            cell,
            COLORS[current.type],
            false
          );
        }
      }
    }

    if (phase === 'clearing' && clearRows.length > 0) {
      drawClearEffect();
    }
  }

  function updateHud() {
    scoreValue.textContent = formatNumber(score);
    levelValue.textContent = formatNumber(level);
    linesValue.textContent = mode === 'sprint'
      ? Math.min(lineCount, SPRINT_GOAL) + '/' + SPRINT_GOAL
      : formatNumber(lineCount);
    bestValue.textContent = formatNumber(best);
    updateTimeHud(true);
  }

  function updateStatus() {
    var overLabel = endKind === 'win' ? '已通关' : (endKind === 'timeup' ? '时间到' : '已结束');
    var labels = {
      ready: '准备',
      playing: '进行中',
      paused: '已暂停',
      clearing: '消行中',
      over: overLabel
    };
    statusText.textContent = labels[phase] || '准备';
    statusPill.className = 'status-pill status-' + phase;
    if (phase === 'over' && endKind === 'win') {
      statusPill.className = 'status-pill status-win';
    }
    pauseBtn.disabled = !(phase === 'playing' || phase === 'paused');
    pauseBtn.textContent = phase === 'paused' ? '继续' : '暂停';
    if (touchPause) {
      touchPause.disabled = pauseBtn.disabled;
      touchPause.textContent = phase === 'paused' ? '继续' : '暂停';
    }
    touchControls.classList.toggle('is-muted', phase !== 'playing');
    refreshModeUI();
  }

  function showOverlay(view) {
    overlay.classList.remove('is-hidden');
    overlay.classList.toggle('is-paused', view === 'paused');
    overlay.classList.toggle('is-over', view === 'over' && endKind !== 'win');
    overlay.classList.toggle('is-win', view === 'over' && endKind === 'win');
    overlayModes.hidden = view === 'paused';
    overlayBtn2.hidden = view !== 'over';

    if (view === 'paused') {
      overlayTag.textContent = '游戏已暂停';
      overlayTitle.textContent = '暂停一下';
      overlayText.textContent = '方块已经停下，准备好再继续。';
      overlayScore.textContent = '';
      overlayBtn.textContent = '继续游戏';
      overlayHint.textContent = '点「继续游戏」或按 P / 回车继续';
    } else if (view === 'over') {
      if (endKind === 'win') {
        overlayTag.textContent = '通关';
        overlayTitle.textContent = SPRINT_GOAL + ' 行达成！';
        overlayText.textContent = '清满目标行数，这一局顺利通关。';
        overlayScore.textContent = '用时 ' + formatClockPrecise(runTime) +
          ' · 本局得分 ' + formatNumber(score) +
          '\n个人最好 ' + formatClockPrecise(currentRecord().time) +
          ' · ' + formatNumber(best) + ' 分';
        overlayBtn.textContent = '再来一次';
        overlayHint.textContent = '点按钮或按空格 / 回车再来一次';
      } else if (endKind === 'timeup') {
        overlayTag.textContent = '时间到';
        overlayTitle.textContent = '2 分钟结束';
        overlayText.textContent = '时间到，这一局到此为止。';
        overlayScore.textContent = '本局得分 ' + formatNumber(score) +
          ' · 消行 ' + formatNumber(lineCount) +
          '\n该模式最高分 ' + formatNumber(best);
        overlayBtn.textContent = '再来一次';
        overlayHint.textContent = '点按钮或按空格 / 回车再来一次';
      } else {
        overlayTag.textContent = '游戏结束';
        overlayTitle.textContent = '堆到顶了';
        overlayText.textContent = '调整一下策略，再来一局。';
        overlayScore.textContent = '本局得分 ' + formatNumber(score) +
          ' · 行数 ' + formatNumber(lineCount) +
          '\n该模式最高分 ' + formatNumber(best);
        overlayBtn.textContent = '再来一局';
        overlayHint.textContent = '点按钮或按空格 / 回车重新开始';
      }
    } else {
      overlayTag.textContent = '准备开始';
      overlayTitle.textContent = MODES[mode].name;
      overlayText.textContent = MODES[mode].ready;
      overlayScore.textContent = readyScoreText();
      overlayBtn.textContent = '开始游戏';
      overlayHint.textContent = '手机用下方按钮操作 · 电脑按空格 / 回车开始';
    }
  }

  function hideOverlay() {
    overlay.classList.add('is-hidden');
  }

  function startGame() {
    board = createBoard();
    current = null;
    holdType = null;
    canHold = true;
    score = 0;
    lineCount = 0;
    level = 1;
    runTime = 0;
    timeLeft = TIMED_LIMIT;
    lastClockText = '';
    endKind = null;
    dropAccum = 0;
    lockTimer = 0;
    clearRows = [];
    clearTimer = 0;
    resetInput();
    ensureQueue();
    syncRecord();
    refreshRecords();
    phase = 'playing';
    updateHud();
    hideOverlay();
    overlayCard.classList.remove('is-static');
    spawnFromNext();
    updateStatus();
  }

  function pauseGame() {
    if (phase !== 'playing') {
      return;
    }
    phase = 'paused';
    resetInput();
    updateStatus();
    showOverlay('paused');
  }

  function resumeGame() {
    if (phase !== 'paused') {
      return;
    }
    phase = 'playing';
    hideOverlay();
    updateStatus();
  }

  function togglePause() {
    if (phase === 'playing') {
      pauseGame();
    } else if (phase === 'paused') {
      resumeGame();
    }
  }

  function loop(timestamp) {
    if (!lastTime) {
      lastTime = timestamp;
    }
    var dt = timestamp - lastTime;
    if (dt > 80) {
      dt = 80;
    }
    if (dt < 0) {
      dt = 0;
    }
    lastTime = timestamp;
    update(dt);
    render();
    window.requestAnimationFrame(loop);
  }

  var resizePending = false;
  function requestResize() {
    if (resizePending) {
      return;
    }
    resizePending = true;
    window.requestAnimationFrame(function () {
      resizePending = false;
      resizeBoard();
      updatePreviews();
    });
  }

  document.addEventListener('keydown', function (event) {
    var code = event.code;
    var controlKeys = [
      'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown',
      'Space', 'Enter', 'NumpadEnter', 'KeyC', 'KeyP', 'KeyZ', 'KeyX'
    ];
    if (controlKeys.indexOf(code) !== -1) {
      event.preventDefault();
    }
    if (event.repeat) {
      return;
    }

    if (code === 'KeyP') {
      if (phase === 'playing' || phase === 'paused') {
        togglePause();
      }
      return;
    }

    if (phase === 'ready') {
      if (code === 'Space' || code === 'Enter' || code === 'NumpadEnter') {
        startGame();
      }
      return;
    }

    if (phase === 'over') {
      if (code === 'Space' || code === 'Enter' || code === 'NumpadEnter') {
        startGame();
      }
      return;
    }

    if (phase === 'paused') {
      if (code === 'Enter' || code === 'NumpadEnter' || code === 'Space') {
        resumeGame();
      }
      return;
    }

    if (phase !== 'playing') {
      return;
    }

    if (code === 'ArrowLeft') {
      beginHorizontal(-1);
    } else if (code === 'ArrowRight') {
      beginHorizontal(1);
    } else if (code === 'ArrowDown') {
      pressSoftDrop();
    } else if (code === 'ArrowUp' || code === 'KeyX') {
      tryRotate(1);
    } else if (code === 'KeyZ') {
      tryRotate(-1);
    } else if (code === 'Space') {
      hardDrop();
    } else if (code === 'KeyC' || code === 'ShiftLeft' || code === 'ShiftRight') {
      holdCurrent();
    }
  });

  document.addEventListener('keyup', function (event) {
    var code = event.code;
    if (code === 'ArrowLeft') {
      releaseHorizontal(-1);
    } else if (code === 'ArrowRight') {
      releaseHorizontal(1);
    } else if (code === 'ArrowDown') {
      releaseSoftDrop();
    }
  });

  window.addEventListener('blur', resetInput);

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && phase === 'playing') {
      pauseGame();
    }
  });

  overlayBtn.addEventListener('click', function () {
    if (phase === 'paused') {
      resumeGame();
    } else {
      startGame();
    }
  });

  overlayBtn2.addEventListener('click', function () {
    enterModeSelect();
  });

  modeGrid.addEventListener('click', handleModeClick);
  overlayModeGrid.addEventListener('click', handleModeClick);

  pauseBtn.addEventListener('click', function () {
    togglePause();
  });

  if (touchPause) {
    touchPause.addEventListener('click', function () {
      togglePause();
    });
  }

  restartBtn.addEventListener('click', function () {
    startGame();
  });

  var touchButtons = document.querySelectorAll('[data-touch]');
  for (var t = 0; t < touchButtons.length; t++) {
    touchButtons[t].addEventListener('pointerdown', function (event) {
      event.preventDefault();
      if (phase !== 'playing') {
        return;
      }
      var action = this.getAttribute('data-touch');
      if (action === 'left') {
        beginHorizontal(-1);
      } else if (action === 'right') {
        beginHorizontal(1);
      } else if (action === 'rotate') {
        tryRotate(1);
      } else if (action === 'soft') {
        pressSoftDrop();
      } else if (action === 'drop') {
        hardDrop();
      } else if (action === 'hold') {
        holdCurrent();
      }
    });
  }

  function releaseTouchInput() {
    keys.left = false;
    keys.right = false;
    keys.down = false;
    activeDir = 0;
    dasTimer = 0;
    arrTimer = 0;
    softAccum = 0;
  }

  window.addEventListener('pointerup', releaseTouchInput);
  window.addEventListener('pointercancel', releaseTouchInput);

  window.addEventListener('resize', requestResize);
  window.addEventListener('orientationchange', requestResize);

  buildModeChips(modeGrid);
  buildModeChips(overlayModeGrid);
  refreshModeUI();
  refreshRecords();
  ensureQueue();
  resizeBoard();
  updatePreviews();
  updateHud();
  updateStatus();
  showOverlay('ready');
  window.requestAnimationFrame(loop);
})();
</script>
</body>
</html>
