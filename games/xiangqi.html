<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>象棋工坊 · 三种下法</title>
<style>
  :root{
    --ink:#0b1017;
    --panel:#141c28;
    --panel-2:#101722;
    --line:rgba(226,167,90,.22);
    --line-soft:rgba(148,163,184,.12);
    --gold:#e2a75a;
    --gold-2:#f4d49a;
    --text:#e9eef7;
    --muted:#8fa2b8;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:
      radial-gradient(circle at 14% 8%, rgba(226,167,90,.11), transparent 34%),
      radial-gradient(circle at 88% 92%, rgba(84,126,180,.12), transparent 38%),
      linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px),
      var(--ink);
    background-size:auto,auto,48px 48px,48px 48px,auto;
    color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  button{font:inherit;color:inherit}
  [hidden]{display:none!important}
  #app{height:100%;display:flex;flex-direction:column}

  #menu{flex:1;overflow:auto;padding:clamp(18px,3.2vw,34px);scrollbar-width:thin}
  .hero{
    display:flex;align-items:center;gap:16px;max-width:1080px;margin:0 auto 22px;
    padding-bottom:18px;border-bottom:1px solid var(--line-soft);
  }
  .seal{
    width:60px;height:60px;border-radius:16px;flex-shrink:0;display:grid;place-items:center;
    background:radial-gradient(circle at 32% 26%,#fbe8c2,#e2a75a 58%,#9a6428);
    color:#2a1607;font-family:"KaiTi","STKaiti","Microsoft YaHei",serif;font-weight:800;font-size:32px;
    box-shadow:0 8px 26px rgba(226,167,90,.26), inset 0 0 0 1px rgba(255,255,255,.28);
  }
  .hero-main{flex:1;min-width:0}
  .hero h1{
    margin:0;font-family:"KaiTi","STKaiti","Microsoft YaHei",serif;
    font-size:clamp(24px,3.4vw,34px);letter-spacing:.08em;color:var(--gold-2);line-height:1.1;
  }
  .hero p{margin:4px 0 0;font-size:13px;line-height:1.6;color:var(--muted)}
  .ghost{
    flex-shrink:0;border:1px solid var(--line);background:rgba(226,167,90,.07);
    color:var(--gold-2);border-radius:999px;padding:8px 14px;font-size:12.5px;cursor:pointer;
    transition:background .16s,border-color .16s,transform .16s;
  }
  .ghost:hover{background:rgba(226,167,90,.14);border-color:rgba(226,167,90,.5);transform:translateY(-1px)}

  .modes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:1080px;margin:0 auto}
  .mode{
    position:relative;text-align:left;border:1px solid var(--line);border-radius:18px;
    background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012));
    padding:18px 18px 16px;cursor:pointer;overflow:hidden;
    transition:transform .18s,border-color .18s,background .18s,box-shadow .18s;
  }
  .mode::after{
    content:"";position:absolute;right:-34px;bottom:-42px;width:128px;height:128px;border-radius:50%;
    border:1px solid rgba(226,167,90,.12);pointer-events:none;
  }
  .mode:hover,.mode:focus-visible{
    transform:translateY(-3px);border-color:rgba(226,167,90,.55);
    background:linear-gradient(180deg,rgba(226,167,90,.10),rgba(255,255,255,.02));
    box-shadow:0 14px 32px rgba(0,0,0,.28);outline:none;
  }
  .mode.last{border-color:rgba(226,167,90,.46)}
  .mode.last::before{
    content:"上次";position:absolute;top:12px;right:12px;
    font-size:10px;letter-spacing:.08em;color:#2a1607;background:var(--gold);
    border-radius:999px;padding:2px 7px;font-weight:700;
  }
  .mode-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .mode-seal{
    width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;
    font-family:"KaiTi","STKaiti","Microsoft YaHei",serif;font-weight:800;font-size:22px;
    color:#2a1607;background:radial-gradient(circle at 32% 26%,#fbe8c2,#e2a75a 60%,#a06a2c);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);
  }
  .mode-badge{
    font-size:10.5px;letter-spacing:.05em;color:#d8b77e;border:1px solid rgba(226,167,90,.28);
    background:rgba(226,167,90,.09);border-radius:999px;padding:3px 8px;
  }
  .mode h2{
    margin:0 0 6px;font-family:"KaiTi","STKaiti","Microsoft YaHei",serif;
    font-size:21px;letter-spacing:.05em;color:#f6e3ba;
  }
  .mode p{margin:0;font-size:12.5px;line-height:1.7;color:#a9bbcf;min-height:64px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .tag{
    font-size:10.5px;color:#c9d6e6;border:1px solid rgba(148,163,184,.2);
    background:rgba(148,163,184,.08);border-radius:999px;padding:3px 8px;
  }
  .mode-foot{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft);
    font-size:11.5px;color:var(--muted);
  }
  .mode-foot b{color:var(--gold-2);font-weight:600}
  .go{color:var(--gold-2);font-size:12px;white-space:nowrap}

  .compare{
    max-width:1080px;margin:20px auto 0;border:1px solid var(--line-soft);border-radius:16px;
    background:rgba(255,255,255,.02);overflow:hidden;
  }
  .compare-head{display:flex;align-items:baseline;gap:10px;padding:14px 16px 10px}
  .compare-head h2{margin:0;font-size:14px;color:#e6d2a8;letter-spacing:.04em}
  .compare-head span{font-size:11.5px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{padding:10px 16px;text-align:left;border-top:1px solid var(--line-soft)}
  th{font-weight:600;color:#b9c8da;background:rgba(255,255,255,.02)}
  td{color:#9fb1c6}
  td:first-child{color:#e9eef7;font-weight:600}
  .tip{
    max-width:1080px;margin:14px auto 0;font-size:12px;line-height:1.8;color:var(--muted);
    padding:0 2px 8px;
  }
  .tip b{color:#d8b77e;font-weight:600}

  #play{flex:1;display:flex;flex-direction:column;min-height:0}
  #bar{
    height:42px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 10px;
    background:linear-gradient(180deg,#131c28,#0f1620);border-bottom:1px solid var(--line);
  }
  #back{
    border:1px solid rgba(226,167,90,.32);background:rgba(226,167,90,.08);color:var(--gold-2);
    border-radius:9px;padding:5px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap;
  }
  #back:hover{background:rgba(226,167,90,.16)}
  #modeName{font-size:13.5px;font-weight:600;color:#f2dfb9;letter-spacing:.04em}
  #bar .sp{flex:1}
  #bar .hint{font-size:11px;color:#7f93ab;white-space:nowrap}
  #stage{flex:1;width:100%;min-height:0;border:0;background:#0b1017;display:block}

  @media (max-width:820px){
    #menu{padding:16px 14px 22px}
    .hero{gap:12px;margin-bottom:16px;padding-bottom:14px}
    .seal{width:50px;height:50px;border-radius:14px;font-size:27px}
    .hero p{font-size:12px}
    .ghost{padding:7px 11px;font-size:11.5px}
    .modes{grid-template-columns:1fr;gap:11px}
    .mode{padding:15px}
    .mode p{min-height:0}
    .compare{margin-top:14px}
    .compare-head{padding:12px 13px 8px}
    th,td{padding:9px 13px;font-size:11.5px}
    .tip{font-size:11.5px}
    #bar .hint{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <section id="menu" aria-label="选择象棋玩法">
    <div class="hero">
      <div class="seal" aria-hidden="true">象</div>
      <div class="hero-main">
        <h1>象棋工坊</h1>
        <p>一盘棋，三种下法。标准对弈、揭棋、盲棋，共用一个入口。</p>
      </div>
      <button class="ghost" id="random" type="button">随机开局</button>
    </div>

    <div class="modes">
      <button class="mode" type="button" data-mode="std" aria-label="开始标准象棋">
        <div class="mode-top">
          <span class="mode-seal" aria-hidden="true">弈</span>
          <span class="mode-badge">经典 · 五档 AI</span>
        </div>
        <h2>标准象棋</h2>
        <p>完整中国象棋规则，执红先行。入门到大师五档电脑，支持悔棋、沙盘推演与残局选关。</p>
        <div class="tags"><span class="tag">完整棋规</span><span class="tag">五档 AI</span><span class="tag">沙盘推演</span></div>
        <div class="mode-foot"><span>5–20 分钟</span><span class="go">开始 →</span></div>
      </button>

      <button class="mode" type="button" data-mode="jieqi" aria-label="开始揭棋">
        <div class="mode-top">
          <span class="mode-seal" aria-hidden="true">揭</span>
          <span class="mode-badge">暗子 · 三档 AI</span>
        </div>
        <h2>揭棋</h2>
        <p>将帅明置，其余棋子盖住随机就位。暗子按所在位置原本棋路走第一步，落子翻明。</p>
        <div class="tags"><span class="tag">暗子随机</span><span class="tag">落子翻明</span><span class="tag">规则速查</span></div>
        <div class="mode-foot"><span>5–20 分钟</span><span class="go">开始 →</span></div>
      </button>

      <button class="mode" type="button" data-mode="blind" aria-label="开始盲棋">
        <div class="mode-top">
          <span class="mode-seal" aria-hidden="true">盲</span>
          <span class="mode-badge">暗棋 · 4×8</span>
        </div>
        <h2>盲棋</h2>
        <p>32 枚棋子全部盖住，首翻定色。每回合翻一枚暗子或走一枚明子，按等级吃子，炮隔子跳吃。</p>
        <div class="tags"><span class="tag">首翻定色</span><span class="tag">等级吃子</span><span class="tag">炮隔子跳</span></div>
        <div class="mode-foot"><span>3–12 分钟</span><span class="go">开始 →</span></div>
      </button>
    </div>

    <div class="compare">
      <div class="compare-head"><h2>三种下法怎么选</h2><span>想清楚再落座</span></div>
      <table>
        <thead><tr><th>玩法</th><th>你能看到什么</th><th>难度</th><th>一局时长</th></tr></thead>
        <tbody>
          <tr><td>标准象棋</td><td>全部棋子明置，拼棋力与算路</td><td>入门–大师</td><td>5–20 分钟</td></tr>
          <tr><td>揭棋</td><td>将帅明置，其余暗置，翻子有惊喜</td><td>中等–困难</td><td>5–20 分钟</td></tr>
          <tr><td>盲棋</td><td>32 子全暗，首翻定色，拼记忆与等级</td><td>适中</td><td>3–12 分钟</td></tr>
        </tbody>
      </table>
    </div>
    <p class="tip">想正经下一盘，选 <b>标准象棋</b>；想要信息差和翻子惊喜，选 <b>揭棋</b>；想短平快、靠记忆和等级吃子，选 <b>盲棋</b>。三种玩法都在本机运行，进度保存在浏览器。</p>
  </section>

  <section id="play" hidden aria-label="对局">
    <div id="bar">
      <button id="back" type="button" aria-label="返回玩法选择">← 玩法</button>
      <span id="modeName">标准象棋</span>
      <span class="sp"></span>
      <span class="hint">随时可以切回菜单换一种下法</span>
    </div>
    <iframe id="stage" title="象棋对局"></iframe>
  </section>
</div>

  var INFO = {
    std: { name: '标准象棋' },
    jieqi: { name: '揭棋' },
    blind: { name: '盲棋' }
  };
  var cache = {};
  var menu = document.getElementById('menu');
  var play = document.getElementById('play');
  var stage = document.getElementById('stage');
  var modeName = document.getElementById('modeName');
  var back = document.getElementById('back');
  var random = document.getElementById('random');

  function decode(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  function htmlOf(key) {
    if (!cache[key]) cache[key] = decode(B64[key]);
    return cache[key];
  }

  function start(key) {
    if (!INFO[key]) return;
    modeName.textContent = INFO[key].name;
    menu.hidden = true;
    play.hidden = false;
    stage.onload = function () {
      try { stage.contentWindow.focus(); } catch (e) {}
    };
    stage.srcdoc = htmlOf(key);
    try { localStorage.setItem('xq3_last', key); } catch (e) {}
    document.title = INFO[key].name + ' · 象棋工坊';
  }

  function backToMenu() {
    play.hidden = true;
    menu.hidden = false;
    stage.removeAttribute('srcdoc');
    document.title = '象棋工坊 · 三种下法';
    try { menu.scrollTop = 0; } catch (e) {}
    var first = menu.querySelector('.mode');
    if (first) first.focus();
  }

  var buttons = document.querySelectorAll('.mode');
  for (var i = 0; i < buttons.length; i++) {
    (function (b) {
      b.addEventListener('click', function () { start(b.getAttribute('data-mode')); });
    })(buttons[i]);
  }
  back.addEventListener('click', backToMenu);
  random.addEventListener('click', function () {
    var keys = ['std', 'jieqi', 'blind'];
    var last = '';
    try { last = localStorage.getItem('xq3_last') || ''; } catch (e) {}
    var pool = keys.filter(function (k) { return k !== last; });
    var pick = pool[Math.floor(Math.random() * pool.length)] || keys[0];
    start(pick);
  });

  try {
    var last = localStorage.getItem('xq3_last');
    if (last && INFO[last]) {
      var el = document.querySelector('.mode[data-mode="' + last + '"]');
      if (el) el.classList.add('last');
    }
  } catch (e) {}

  /* 把内层棋局的成绩消息转给合集，保证成绩册能记录 */
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || typeof d !== 'object' || d.type !== 'tx-score') return;
    if (e.source !== stage.contentWindow) return;
    try { parent.postMessage(d, '*'); } catch (err) {}
  });
</script>
