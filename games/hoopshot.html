<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="街篮火线是一款本地运行的投篮挑战小游戏，包含经典 60 秒、十球挑战、生存模式、狂风模式、大师模式五种玩法，拖动瞄准，松手投篮。">
<title>街篮火线 · 五模式投篮挑战</title>
<style>
  :root{
    --bg:#05080f;
    --panel:#0c1424;
    --panel-2:#111e33;
    --line:#1d2c49;
    --text:#e6efff;
    --muted:#8ea3c4;
    --muted-2:#6f84a6;
    --cyan:#4ad6ff;
    --amber:#ffd166;
    --pink:#ff6b9d;
    --court:#0a1626;
    --court-2:#06101c;
    --court-line:#1b3350;
    --board:#1a3a58;
    --board-edge:#2f6390;
    --rim:#ff7250;
    --net:#bcd7f5;
    --ball:#f08234;
    --ball-hi:#ffb066;
    --ball-dark:#a84a14;
    --ball-line:#3a1c0b;
    --shadow:0 24px 60px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{
    margin:0;
    padding:clamp(16px,2.4vw,30px) clamp(12px,2.4vw,28px) 40px;
    background:
      radial-gradient(920px 560px at 12% -10%, rgba(255,209,102,.10), transparent 62%),
      radial-gradient(860px 520px at 92% 2%, rgba(74,214,255,.11), transparent 64%),
      var(--bg);
    color:var(--text);
    font-family:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  button{font-family:inherit}
  [hidden]{display:none !important}

  .shell{width:min(100%,1080px);margin:0 auto}

  .topbar{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }
  .brand{display:flex;align-items:center;gap:12px;flex:1;min-width:220px}
  .brand-mark{
    width:36px;height:36px;
    border-radius:50%;
    background:
      radial-gradient(circle at 34% 30%, var(--ball-hi), var(--ball) 58%, var(--ball-dark) 100%);
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 6px 18px rgba(240,130,52,.28);
    flex:none;
  }
  .brand-text{display:flex;flex-direction:column;gap:2px}
  .brand-text h1{
    margin:0;
    font-size:clamp(19px,2.4vw,25px);
    letter-spacing:.08em;
    font-weight:650;
  }
  .brand-text span{
    font-size:10.5px;
    letter-spacing:.26em;
    text-transform:uppercase;
    color:var(--muted-2);
  }
  .sound-btn{
    appearance:none;
    border:1px solid var(--line);
    border-radius:999px;
    background:rgba(13,21,38,.72);
    color:var(--muted);
    padding:7px 14px;
    font-size:12px;
    letter-spacing:.06em;
    cursor:pointer;
    transition:color .16s ease,border-color .16s ease;
  }
  .sound-btn:hover{color:var(--text);border-color:rgba(255,209,102,.45)}
  .sound-btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .topbar-right{display:flex;align-items:center;gap:10px;flex:none}
  .mode-pill{
    border:1px solid rgba(255,209,102,.35);
    border-radius:999px;
    background:rgba(255,209,102,.08);
    color:var(--amber);
    padding:7px 13px;
    font-size:11.5px;
    letter-spacing:.08em;
    white-space:nowrap;
  }

  .game{
    background:linear-gradient(168deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);
    border-radius:20px;
    padding:clamp(12px,2vw,18px);
    box-shadow:var(--shadow);
  }

  .hud{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:12px;
  }
  .stat{
    min-width:80px;
    padding:7px 12px;
    border:1px solid var(--line);
    border-radius:10px;
    background:rgba(6,11,21,.55);
  }
  .stat span{
    display:block;
    font-size:10px;
    letter-spacing:.15em;
    text-transform:uppercase;
    color:var(--muted-2);
  }
  .stat strong{
    display:block;
    margin-top:2px;
    font-size:17px;
    font-variant-numeric:tabular-nums;
    letter-spacing:.02em;
  }
  .stat.time strong{color:var(--amber)}
  .stat.lives strong{color:var(--pink);letter-spacing:.12em}
  .stat.wind strong{color:var(--cyan)}
  .spacer{flex:1}
  .btn{
    appearance:none;
    border:1px solid var(--line);
    border-radius:10px;
    background:rgba(16,27,46,.88);
    color:#c8d8f2;
    padding:9px 15px;
    font-size:13px;
    font-weight:600;
    letter-spacing:.03em;
    cursor:pointer;
    transition:background .16s ease,border-color .16s ease,transform .16s ease;
  }
  .btn:hover{background:#17263f;border-color:rgba(74,214,255,.4)}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .btn.primary{
    border-color:transparent;
    background:linear-gradient(100deg,var(--amber),var(--ball-hi));
    color:#2a1605;
  }
  .btn.primary:hover{filter:brightness(1.05)}

  .court-wrap{
    position:relative;
    width:100%;
    aspect-ratio:16 / 9;
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    background:var(--court-2);
    isolation:isolate;
  }
  #court{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
    cursor:crosshair;
    outline:none;
  }
  #court:focus-visible{outline:2px solid var(--amber);outline-offset:-4px;border-radius:16px}

  .overlay{
    position:absolute;
    inset:0;
    z-index:10;
    display:none;
    place-items:center;
    padding:clamp(14px,3vw,28px);
    background:rgba(3,7,14,.80);
    text-align:center;
    overflow:auto;
  }
  .overlay.open{display:grid}
  .overlay-card{
    width:min(420px,100%);
    padding:clamp(20px,3vw,30px);
    border:1px solid var(--line);
    border-radius:18px;
    background:linear-gradient(165deg,var(--panel-2),var(--panel));
    box-shadow:0 20px 50px rgba(0,0,0,.5);
  }
  .eyebrow{
    margin:0 0 8px;
    font-size:10.5px;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--amber);
  }
  .overlay-card h2{
    margin:0 0 8px;
    font-size:clamp(24px,4vw,32px);
    letter-spacing:.06em;
  }
  .lead{
    margin:0 0 14px;
    font-size:13.5px;
    line-height:1.75;
    color:var(--muted);
  }
  .rules{
    margin:0 0 18px;
    padding:0;
    list-style:none;
    text-align:left;
    display:grid;
    gap:7px;
    font-size:12.5px;
    color:var(--muted);
    line-height:1.6;
  }
  .rules li{position:relative;padding-left:16px}
  .rules li::before{
    content:"";
    position:absolute;
    left:2px;
    top:.55em;
    width:5px;height:5px;
    border-radius:50%;
    background:var(--amber);
  }
  .overlay-card.wide{width:min(560px,100%)}
  .mode-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    margin:16px 0 12px;
    text-align:left;
  }
  .mode-card{
    appearance:none;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:3px;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:12px;
    background:rgba(6,11,21,.45);
    color:var(--text);
    cursor:pointer;
    transition:border-color .16s ease,background .16s ease,transform .16s ease;
  }
  .mode-card:hover{background:rgba(16,27,46,.8);border-color:rgba(74,214,255,.35)}
  .mode-card:active{transform:translateY(1px)}
  .mode-card:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .mode-card.selected{
    border-color:rgba(255,209,102,.75);
    background:rgba(255,209,102,.09);
    box-shadow:0 0 0 1px rgba(255,209,102,.18) inset;
  }
  .mode-name{font-size:13px;font-weight:650;letter-spacing:.03em}
  .mode-card.selected .mode-name{color:var(--amber)}
  .mode-desc{font-size:10.5px;line-height:1.45;color:var(--muted)}
  .mode-best{
    margin-top:2px;
    font-size:10px;
    letter-spacing:.06em;
    color:var(--muted-2);
    font-variant-numeric:tabular-nums;
  }
  .end-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  @media (min-width:560px){
    .mode-grid{grid-template-columns:repeat(3,1fr)}
  }
  @media (max-width:559px){
    .overlay-card.wide{padding:16px 14px}
    .overlay-card .lead{font-size:12px;margin-bottom:8px}
    .mode-grid{gap:6px;margin:10px 0 8px}
    .mode-card{padding:8px 10px;gap:1px}
    .mode-desc{display:none}
    .mode-name{font-size:12.5px}
    .mode-best{font-size:9.5px}
    .rules{font-size:11.5px;gap:5px;margin-bottom:12px}
  }
  .result-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin:16px 0 20px;
  }
  .result-grid div{
    padding:10px 8px;
    border:1px solid var(--line);
    border-radius:10px;
    background:rgba(6,11,21,.5);
  }
  .result-grid span{
    display:block;
    font-size:10px;
    letter-spacing:.12em;
    color:var(--muted-2);
    margin-bottom:3px;
  }
  .result-grid strong{
    font-size:16px;
    font-variant-numeric:tabular-nums;
  }
  .final-score{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:8px;
    margin:4px 0 6px;
  }
  .final-score b{
    font-size:clamp(40px,7vw,56px);
    line-height:1;
    letter-spacing:.02em;
    color:var(--amber);
    font-variant-numeric:tabular-nums;
  }
  .final-score em{
    font-style:normal;
    font-size:14px;
    color:var(--muted);
  }
  .final-line{
    margin:0;
    font-size:13px;
    color:var(--muted);
  }

  .hint{
    margin:12px 0 0;
    padding:11px 15px;
    border:1px dashed var(--line);
    border-radius:12px;
    color:var(--muted);
    font-size:12px;
    line-height:1.7;
  }
  .hint b{color:#c8d8f2;font-weight:600}

  footer{
    margin:18px auto 0;
    color:var(--muted-2);
    font-size:11.5px;
    letter-spacing:.04em;
    text-align:center;
  }

  @media (max-width:680px){
    .court-wrap{aspect-ratio:1 / 1}
    .stat{min-width:68px;padding:6px 10px}
    .stat strong{font-size:15px}
    .brand-text span{display:none}
    .result-grid strong{font-size:14px}
  }
  @media (max-width:440px){
    body{padding:10px 8px 28px}
    .game{padding:10px}
    .brand{min-width:150px;gap:10px}
    .brand-mark{width:30px;height:30px}
    .hud{gap:6px}
    .stat{min-width:62px;padding:5px 8px}
    .stat span{font-size:9px;letter-spacing:.1em}
    .stat strong{font-size:14px}
    .hud .btn{padding:8px 12px;font-size:12px}
    .hint{padding:9px 12px;font-size:11.5px}
    .overlay-card{padding:18px 16px}
    .overlay-card .lead{font-size:12.5px}
    .rules{font-size:12px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.001ms !important;animation-duration:.001ms !important}
  }
</style>
<style id="tx-aurora-skin">
/* tx-aurora-skin:hoopshot */
:root{--tx-a1:#ff9f43;--tx-a2:#ffd166;}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
::selection{background:rgba(255,159,67,0.38);color:#fff}
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:rgba(255,159,67,0.26);border-radius:99px;border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:rgba(255,159,67,0.46);background-clip:content-box}
body{background-color:#08111f!important;background-image:radial-gradient(1100px 640px at 6% -12%, rgba(255,159,67,0.16), transparent 62%), radial-gradient(900px 680px at 104% 112%, rgba(255,209,102,0.12), transparent 62%)!important}
button{transition:transform .14s ease,filter .16s ease,box-shadow .2s ease,border-color .16s ease,background-color .16s ease}
button:hover{filter:brightness(1.07)}
button:active{transform:translateY(1px) scale(.995)}
button:focus-visible{outline:2px solid rgba(255,159,67,0.72);outline-offset:2px}
.overlay,.modal,.dialog,.sheet,#levels,#loading{background-image:radial-gradient(900px 520px at 50% 0%,rgba(255,159,67,0.15),transparent 62%),radial-gradient(720px 520px at 50% 100%,rgba(255,209,102,0.08),transparent 60%)!important}
.overlay,.modal,.dialog,.sheet{backdrop-filter:blur(9px) saturate(1.1)}
.overlay h1,.modal h1,.screen h1,.overlay-card h1,.win-card h1,.result-card h1,.bcard .btitle,.loadcard .ltitle{text-shadow:0 2px 30px rgba(255,159,67,0.45)}
.overlay .screen,.overlay .panel,.overlay-card,.modal .panel,.win-card,.result-card,.bcard,.loadcard,.rules-dialog,.panel{box-shadow:0 38px 96px -34px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.07)!important}
.bcard,.loadcard{border-color:rgba(255,159,67,0.34)!important}
.overlay .panel,.overlay-card,.win-card,.result-card,.modal .panel{backdrop-filter:blur(10px) saturate(1.08);border-color:rgba(255,159,67,0.26)!important}
</style>
</head>
<body>

<div class="shell" data-component="app-shell">
  <header class="topbar" data-component="topbar">
    <div class="brand" data-component="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div class="brand-text">
        <h1>街篮火线</h1>
        <span>Hoop Shot</span>
      </div>
    </div>
    <div class="topbar-right" data-component="topbar-actions">
      <span class="mode-pill" id="modePill" data-component="mode-pill">经典 60 秒</span>
      <button class="sound-btn" id="soundBtn" type="button" aria-pressed="true" data-component="sound-toggle">音效：开</button>
    </div>
  </header>

  <main class="game" data-component="game-stage">
    <section class="hud" data-component="score-hud" aria-label="比赛数据">
      <div class="stat"><span>得分</span><strong id="score">0</strong></div>
      <div class="stat"><span>连中</span><strong id="streak">0</strong></div>
      <div class="stat time"><span id="timeLabel">时间</span><strong id="time">60.0</strong></div>
      <div class="stat lives" id="livesStat" hidden><span>生命</span><strong id="lives">♥♥♥</strong></div>
      <div class="stat wind" id="windStat" hidden><span>风</span><strong id="windVal">无风</strong></div>
      <div class="stat"><span>最佳</span><strong id="best">0</strong></div>
      <div class="spacer"></div>
      <button class="btn" id="restartBtn" type="button" data-component="restart-button">重新开始</button>
    </section>

    <div class="court-wrap" data-component="court-stage">
      <canvas id="court" tabindex="0" role="application" aria-label="投篮场地：在球附近按住并拖动瞄准，松手投篮" data-component="court-canvas"></canvas>

      <div class="overlay open" id="startOverlay" data-component="start-overlay">
        <div class="overlay-card wide">
          <p class="eyebrow">选择模式</p>
          <h2>街篮火线</h2>
          <p class="lead">拖动瞄准，松手投篮。五个模式各有各的压力，先挑一个再开始。</p>
          <div class="mode-grid" id="modeGrid" role="radiogroup" aria-label="游戏模式"></div>
          <ul class="rules" id="modeRules"></ul>
          <button class="btn primary" id="startBtn" type="button" data-component="start-button">开始 · 经典 60 秒</button>
        </div>
      </div>

      <div class="overlay" id="endOverlay" data-component="result-overlay">
        <div class="overlay-card">
          <p class="eyebrow" id="endEyebrow">比赛结束</p>
          <div class="final-score"><b id="finalScore">0</b><em>分</em></div>
          <p class="final-line" id="finalLine">命中 0 / 0 次出手</p>
          <div class="result-grid">
            <div><span>命中率</span><strong id="finalAcc">0%</strong></div>
            <div><span>最长连中</span><strong id="finalStreak">0</strong></div>
            <div><span>历史最佳</span><strong id="finalBest">0</strong></div>
          </div>
          <div class="end-actions">
            <button class="btn primary" id="againBtn" type="button" data-component="again-button">再来一局</button>
            <button class="btn" id="changeModeBtn" type="button">换个模式</button>
          </div>
        </div>
      </div>
    </div>

    <p class="hint" data-component="control-hint">
      <b>拖动瞄准</b>，松手投篮 · 键盘 <b>↑↓</b> 调角度、<b>←→</b> 调力度、<b>空格</b> 出手 · 五个模式的规则见开局面板，最高分分模式保存
    </p>
  </main>

  <footer data-component="footer">纯本地运行，无需联网 · 最高分保存在本机浏览器</footer>
</div>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('court');
  var ctx = canvas.getContext('2d');

  var scoreEl = document.getElementById('score');
  var streakEl = document.getElementById('streak');
  var timeEl = document.getElementById('time');
  var timeLabel = document.getElementById('timeLabel');
  var livesEl = document.getElementById('lives');
  var livesStat = document.getElementById('livesStat');
  var windEl = document.getElementById('windVal');
  var windStat = document.getElementById('windStat');
  var bestEl = document.getElementById('best');
  var modePill = document.getElementById('modePill');
  var modeGrid = document.getElementById('modeGrid');
  var modeRules = document.getElementById('modeRules');
  var endEyebrow = document.getElementById('endEyebrow');
  var changeModeBtn = document.getElementById('changeModeBtn');
  var startOverlay = document.getElementById('startOverlay');
  var endOverlay = document.getElementById('endOverlay');
  var startBtn = document.getElementById('startBtn');
  var againBtn = document.getElementById('againBtn');
  var restartBtn = document.getElementById('restartBtn');
  var soundBtn = document.getElementById('soundBtn');
  var finalScore = document.getElementById('finalScore');
  var finalLine = document.getElementById('finalLine');
  var finalAcc = document.getElementById('finalAcc');
  var finalStreak = document.getElementById('finalStreak');
  var finalBest = document.getElementById('finalBest');

  var STORE_BEST = 'hoopshot.best';
  var STORE_SOUND = 'hoopshot.sound';
  var STORE_MODE = 'hoopshot.mode';
  var GAME_SECONDS = 60;
  var GRAVITY = 1600;
  var WIND_ACCEL = 240;

  var MODES = {
    classic: {
      name: '经典 60 秒', desc: '60 秒内尽量多进',
      rules: ['60 秒倒计时，进球 +2 秒', '空心球额外 +1 分', '连中 3 球以上每球再 +1 分'],
      seconds: 60, shots: 0, lives: 0, wind: false, movingRim: false,
      rimScale: 1, swishBonus: 1, streakBonus: 1, extend: 2,
      bestKey: 'hoopshot.best'
    },
    ten: {
      name: '十球挑战', desc: '10 次出手拼总分',
      rules: ['固定 10 次出手，没有倒计时', '空心 +1 分，连中 3 球以上 +1 分', '第 10 球结算后结束'],
      seconds: 0, shots: 10, lives: 0, wind: false, movingRim: false,
      rimScale: 1, swishBonus: 1, streakBonus: 1, extend: 0,
      bestKey: 'hoopshot.best.ten'
    },
    survival: {
      name: '生存模式', desc: '3 条命，投失扣命',
      rules: ['60 秒限时，允许 3 次投失', '每次投失扣 1 条命，命用完立即结束', '进球 +2 秒，空心 +1 分'],
      seconds: 60, shots: 0, lives: 3, wind: false, movingRim: false,
      rimScale: 1, swishBonus: 1, streakBonus: 1, extend: 2,
      bestKey: 'hoopshot.best.survival'
    },
    wind: {
      name: '狂风模式', desc: '每球都有随机横风',
      rules: ['每球重置一次随机横风', '瞄准线不计算风向，需要自己修正', '进球 +2 秒，空心 +1 分'],
      seconds: 60, shots: 0, lives: 0, wind: true, movingRim: false,
      rimScale: 1, swishBonus: 1, streakBonus: 1, extend: 2,
      bestKey: 'hoopshot.best.wind'
    },
    master: {
      name: '大师模式', desc: '移动小筐 + 45 秒',
      rules: ['篮筐从第一球起上下移动且更小', '45 秒限时，进球 +1 秒', '空心 +2 分，连中 3 球以上 +1 分'],
      seconds: 45, shots: 0, lives: 0, wind: false, movingRim: true,
      rimScale: 0.85, swishBonus: 2, streakBonus: 1, extend: 1,
      bestKey: 'hoopshot.best.master'
    }
  };
  var MODE_ORDER = ['classic', 'ten', 'survival', 'wind', 'master'];

  function loadMode() {
    try {
      var m = localStorage.getItem(STORE_MODE);
      return MODES[m] ? m : 'classic';
    } catch (e) { return 'classic'; }
  }
  function saveMode(id) {
    try { localStorage.setItem(STORE_MODE, id); } catch (e) { /* 忽略 */ }
  }

  var modeId = 'classic';
  var mode = MODES[modeId];
  var selectedMode = 'classic';

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function loadNum(key) {
    try {
      var v = parseFloat(localStorage.getItem(key));
      return isFinite(v) && v > 0 ? v : 0;
    } catch (e) { return 0; }
  }
  function saveNum(key, value) {
    try { localStorage.setItem(key, String(value)); } catch (e) { /* 隐私模式下忽略 */ }
  }
  function loadBool(key, fallback) {
    try {
      var v = localStorage.getItem(key);
      return v === null ? fallback : v === '1';
    } catch (e) { return fallback; }
  }
  function saveBool(key, value) {
    try { localStorage.setItem(key, value ? '1' : '0'); } catch (e) { /* 忽略 */ }
  }

  var pal = null;
  function readPalette() {
    var cs = getComputedStyle(document.documentElement);
    function v(name) { return cs.getPropertyValue(name).trim(); }
    return {
      court: v('--court'),
      court2: v('--court-2'),
      line: v('--court-line'),
      board: v('--board'),
      boardEdge: v('--board-edge'),
      rim: v('--rim'),
      net: v('--net'),
      ball: v('--ball'),
      ballHi: v('--ball-hi'),
      ballDark: v('--ball-dark'),
      ballLine: v('--ball-line'),
      amber: v('--amber'),
      cyan: v('--cyan'),
      pink: v('--pink'),
      text: v('--text')
    };
  }

  var W = 0, H = 0, DPR = 1;
  var geo = {};
  function computeGeometry() {
    var floorY = H * 0.88;
    var rimHalf = clamp(W * 0.040, 22, 40) * (mode.rimScale || 1);
    var ballR = clamp(W * 0.021, 10, 18);
    geo = {
      floorY: floorY,
      hoopX: W * 0.80,
      baseRimY: H * 0.40,
      rimHalf: rimHalf,
      rimR: clamp(W * 0.006, 3.2, 5.2),
      ballR: ballR,
      startX: W * 0.16,
      startY: floorY - ballR,
      bbX: W * 0.80 + rimHalf + 14,
      boardW: clamp(W * 0.012, 8, 13),
      boardTop: H * 0.40 - rimHalf * 2.5,
      boardH: rimHalf * 3.4
    };
  }

  var ball = {
    x: 0, y: 0, vx: 0, vy: 0, rot: 0,
    flying: false, scored: false, touchedRim: false, touchedBoard: false,
    flight: 0, resetT: 0
  };
  var trail = [];
  var particles = [];
  var popups = [];
  var netSway = 0;
  var elapsed = 0;

  var phase = 'idle';
  var score = 0;
  var makes = 0;
  var shots = 0;
  var streak = 0;
  var bestStreak = 0;
  var timeLeft = GAME_SECONDS;
  var lives = 0;
  var shotsLeft = 0;
  var wind = 0;
  var shotLimitReached = false;
  var best = loadNum(MODES[modeId].bestKey);
  var soundOn = loadBool(STORE_SOUND, true);

  var aimAngle = 0.82;
  var aimPower = 0.64;
  var aiming = false;

  var hudTime = '';

  function currentRimY() {
    if (!mode.movingRim && makes < 5) return geo.baseRimY;
    var amp, speed;
    if (mode.movingRim) {
      amp = Math.min(18 + makes * 2.2, 38);
      speed = 2.1;
    } else {
      amp = Math.min(8 + (makes - 5) * 3, 30);
      speed = 1.7;
    }
    return geo.baseRimY + Math.sin(elapsed * speed) * amp;
  }

  function resize() {
    var rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * DPR);
    canvas.height = Math.round(rect.height * DPR);
    W = rect.width;
    H = rect.height;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    computeGeometry();
    if (!ball.flying) {
      ball.x = geo.startX;
      ball.y = geo.startY;
    }
  }

  function pickWind() {
    var w = Math.random() * 2 - 1;
    if (Math.abs(w) < 0.28) w = (w < 0 ? -1 : 1) * (0.28 + Math.random() * 0.22);
    return clamp(w, -1, 1);
  }

  function spawnBall() {
    if (phase === 'playing' && shotLimitReached) { endGame(); return; }
    ball.x = geo.startX;
    ball.y = geo.startY;
    ball.vx = 0;
    ball.vy = 0;
    ball.rot = 0;
    ball.flying = false;
    ball.scored = false;
    ball.touchedRim = false;
    ball.touchedBoard = false;
    ball.flight = 0;
    ball.resetT = 0;
    trail.length = 0;
    if (mode.wind) {
      wind = pickWind();
      updateHud();
    }
  }

  function shotVelocity(angle, power) {
    var speed = 480 + power * (1440 - 480);
    return { x: Math.cos(angle) * speed, y: -Math.sin(angle) * speed };
  }

  function canShoot() {
    return phase === 'playing' && !ball.flying && ball.resetT <= 0;
  }

  function launch() {
    if (!canShoot()) return;
    var v = shotVelocity(aimAngle, aimPower);
    ball.vx = v.x;
    ball.vy = v.y;
    ball.flying = true;
    ball.scored = false;
    ball.touchedRim = false;
    ball.touchedBoard = false;
    ball.flight = 0;
    ball.resetT = 0;
    aiming = false;
    trail.length = 0;
    shots += 1;
    if (mode.shots > 0) {
      shotsLeft = Math.max(0, shotsLeft - 1);
      updateTimeHud();
    }
    playSound('shoot');
  }

  /* ---------- 输入 ---------- */

  function pointerPos(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function updateAimFromPointer(p) {
    var dx = p.x - ball.x;
    var dy = p.y - ball.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 8) return;
    aimAngle = clamp(Math.atan2(-dy, dx), 0.14, 1.44);
    aimPower = clamp((dist - 30) / (W * 0.34), 0.12, 1);
  }

  canvas.addEventListener('pointerdown', function (e) {
    if (!canShoot()) return;
    canvas.focus();
    ensureAudio();
    var p = pointerPos(e);
    aiming = true;
    updateAimFromPointer(p);
    if (canvas.setPointerCapture) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    }
    e.preventDefault();
  });

  canvas.addEventListener('pointermove', function (e) {
    if (!aiming || !canShoot()) return;
    updateAimFromPointer(pointerPos(e));
    e.preventDefault();
  });

  function endPointer(e) {
    if (!aiming) return;
    aiming = false;
    if (canShoot()) launch();
    if (e && e.preventDefault) e.preventDefault();
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', function () { aiming = false; });

  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  window.addEventListener('keydown', function (e) {
    var tag = e.target && e.target.tagName;
    if (tag === 'BUTTON' && (e.code === 'Space' || e.code === 'Enter')) return;

    if (e.code === 'Space') {
      if (phase === 'idle' || phase === 'over') {
        e.preventDefault();
        startGame();
      } else if (canShoot()) {
        e.preventDefault();
        ensureAudio();
        launch();
      }
      return;
    }

    if (phase !== 'playing' || ball.flying) return;
    if (e.code === 'ArrowUp' || e.code === 'ArrowDown' || e.code === 'ArrowLeft' || e.code === 'ArrowRight') {
      e.preventDefault();
      if (e.code === 'ArrowUp') aimAngle = clamp(aimAngle + 0.035, 0.14, 1.44);
      if (e.code === 'ArrowDown') aimAngle = clamp(aimAngle - 0.035, 0.14, 1.44);
      if (e.code === 'ArrowLeft') aimPower = clamp(aimPower - 0.030, 0.08, 1);
      if (e.code === 'ArrowRight') aimPower = clamp(aimPower + 0.030, 0.08, 1);
    }
  });

  /* ---------- 音效 ---------- */

  var audioCtx = null;
  var lastBounceAt = 0;

  function ensureAudio() {
    if (audioCtx) {
      if (audioCtx.state === 'suspended' && audioCtx.resume) audioCtx.resume();
      return;
    }
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    } catch (e) { audioCtx = null; }
  }

  function tone(from, to, dur, type, gain) {
    if (!soundOn || !audioCtx) return;
    try {
      var t0 = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(from, t0);
      osc.frequency.exponentialRampToValueAtTime(Math.max(30, to), t0 + dur);
      g.gain.setValueAtTime(gain || 0.08, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    } catch (e) { /* 忽略 */ }
  }

  function playSound(name) {
    if (!soundOn) return;
    ensureAudio();
    if (!audioCtx) return;
    if (name === 'shoot') tone(300, 150, 0.12, 'triangle', 0.05);
    else if (name === 'rim') tone(190, 120, 0.09, 'square', 0.045);
    else if (name === 'board') tone(150, 95, 0.1, 'square', 0.05);
    else if (name === 'bounce') {
      var now = performance.now();
      if (now - lastBounceAt < 70) return;
      lastBounceAt = now;
      tone(120, 70, 0.09, 'sine', 0.045);
    } else if (name === 'score') {
      tone(560, 760, 0.16, 'triangle', 0.075);
      setTimeout(function () { tone(760, 980, 0.14, 'triangle', 0.06); }, 90);
    } else if (name === 'swish') {
      tone(900, 1500, 0.18, 'sine', 0.05);
    } else if (name === 'over') {
      tone(420, 260, 0.4, 'triangle', 0.08);
      setTimeout(function () { tone(320, 180, 0.5, 'triangle', 0.07); }, 240);
    }
  }

  /* ---------- 比赛流程 ---------- */

  function heartStr(n) {
    var s = '', i;
    for (i = 0; i < mode.lives; i++) s += i < n ? '♥' : '♡';
    return s;
  }
  function windStr() {
    if (!mode.wind) return '无风';
    if (Math.abs(wind) < 0.05) return '无风';
    return (wind > 0 ? '→ ' : '← ') + Math.abs(wind).toFixed(1);
  }

  function updateHud() {
    scoreEl.textContent = String(score);
    streakEl.textContent = String(streak);
    bestEl.textContent = String(Math.max(best, score));
    livesEl.textContent = heartStr(lives);
    windEl.textContent = windStr();
  }

  function updateTimeHud() {
    if (mode.shots > 0) {
      var s = String(Math.max(0, shotsLeft));
      if (s !== hudTime) {
        hudTime = s;
        timeEl.textContent = s;
      }
      return;
    }
    var t = Math.max(0, timeLeft).toFixed(1);
    if (t !== hudTime) {
      hudTime = t;
      timeEl.textContent = t;
    }
  }

  function applyModeUi() {
    modePill.textContent = mode.name;
    timeLabel.textContent = mode.shots > 0 ? '剩余球' : '时间';
    livesStat.hidden = !mode.lives;
    windStat.hidden = !mode.wind;
    endEyebrow.textContent = '比赛结束 · ' + mode.name;
    hudTime = '';
    computeGeometry();
    if (!ball.flying) {
      ball.x = geo.startX;
      ball.y = geo.startY;
    }
  }

  function renderModeCards() {
    modeGrid.innerHTML = '';
    MODE_ORDER.forEach(function (id) {
      var m = MODES[id];
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'mode-card' + (id === selectedMode ? ' selected' : '');
      btn.setAttribute('role', 'radio');
      btn.setAttribute('aria-checked', id === selectedMode ? 'true' : 'false');
      btn.setAttribute('data-mode', id);

      var name = document.createElement('span');
      name.className = 'mode-name';
      name.textContent = m.name;
      var desc = document.createElement('span');
      desc.className = 'mode-desc';
      desc.textContent = m.desc;
      var bestTag = document.createElement('span');
      bestTag.className = 'mode-best';
      bestTag.textContent = '最佳 ' + loadNum(m.bestKey);

      btn.appendChild(name);
      btn.appendChild(desc);
      btn.appendChild(bestTag);
      btn.addEventListener('click', function () { selectMode(id); });
      modeGrid.appendChild(btn);
    });
  }

  function selectMode(id) {
    if (!MODES[id]) return;
    selectedMode = id;
    modeId = id;
    mode = MODES[id];
    saveMode(id);
    var cards = modeGrid.querySelectorAll('.mode-card');
    for (var i = 0; i < cards.length; i++) {
      var on = cards[i].getAttribute('data-mode') === id;
      cards[i].classList.toggle('selected', on);
      cards[i].setAttribute('aria-checked', on ? 'true' : 'false');
    }
    modeRules.innerHTML = '';
    for (var j = 0; j < mode.rules.length; j++) {
      var li = document.createElement('li');
      li.textContent = mode.rules[j];
      modeRules.appendChild(li);
    }
    startBtn.textContent = '开始 · ' + mode.name;
    best = loadNum(mode.bestKey);
    if (phase !== 'playing') {
      score = 0;
      makes = 0;
      shots = 0;
      streak = 0;
      bestStreak = 0;
      lives = mode.lives || 0;
      shotsLeft = mode.shots || 0;
      timeLeft = mode.seconds || 0;
      wind = mode.wind ? pickWind() : 0;
      applyModeUi();
      updateHud();
      updateTimeHud();
    }
  }

  function startGame(id) {
    if (id && MODES[id]) {
      modeId = id;
      mode = MODES[id];
    }
    selectedMode = modeId;
    saveMode(modeId);
    best = loadNum(mode.bestKey);
    phase = 'playing';
    score = 0;
    makes = 0;
    shots = 0;
    streak = 0;
    bestStreak = 0;
    lives = mode.lives || 0;
    shotsLeft = mode.shots || 0;
    shotLimitReached = false;
    wind = 0;
    timeLeft = mode.seconds || 0;
    hudTime = '';
    particles.length = 0;
    popups.length = 0;
    netSway = 0;
    aimAngle = 0.82;
    aimPower = 0.64;
    aiming = false;
    startOverlay.classList.remove('open');
    endOverlay.classList.remove('open');
    applyModeUi();
    spawnBall();
    updateHud();
    updateTimeHud();
    ensureAudio();
    canvas.focus();
  }

  function endGame() {
    if (phase !== 'playing') return;
    phase = 'over';
    aiming = false;
    timeLeft = 0;
    updateTimeHud();
    playSound('over');
    if (score > best) {
      best = score;
      saveNum(mode.bestKey, best);
    }
    finalScore.textContent = String(score);
    finalLine.textContent = '命中 ' + makes + ' / ' + shots + ' 次出手';
    finalAcc.textContent = shots ? Math.round((makes / shots) * 100) + '%' : '0%';
    finalStreak.textContent = String(bestStreak);
    finalBest.textContent = String(best);
    endEyebrow.textContent = '比赛结束 · ' + mode.name;
    updateHud();
    renderModeCards();
    endOverlay.classList.add('open');
    againBtn.focus();
  }

  function addScore(points, swish, comboBonus) {
    score += points;
    makes += 1;
    streak += 1;
    if (streak > bestStreak) bestStreak = streak;
    if (mode.extend > 0 && mode.seconds > 0) {
      timeLeft = Math.min(99, timeLeft + mode.extend);
    }
    if (mode.shots > 0 && shotsLeft <= 0) shotLimitReached = true;
    if (score > best) {
      best = score;
      saveNum(mode.bestKey, best);
    }

    var rimY = currentRimY();
    popups.push({
      x: geo.hoopX,
      y: rimY - geo.rimHalf * 0.6,
      life: 1.15,
      max: 1.15,
      text: '+' + points,
      sub: swish ? (comboBonus ? '空心 · 连中' : '空心球') : (comboBonus ? '连中加成' : ''),
      color: swish ? pal.amber : pal.text
    });

    netSway = 1;
    burst(geo.hoopX, rimY + geo.rimHalf * 0.5);
    playSound(swish ? 'swish' : 'score');
    updateHud();
  }

  function registerMiss() {
    streak = 0;
    if (mode.lives > 0) {
      lives = Math.max(0, lives - 1);
      if (lives <= 0) shotLimitReached = true;
    }
    if (mode.shots > 0 && shotsLeft <= 0) shotLimitReached = true;
    updateHud();
  }

  function missReset() {
    registerMiss();
    spawnBall();
  }

  function burst(x, y) {
    var colors = [pal.amber, pal.cyan, pal.pink, pal.ballHi];
    for (var i = 0; i < 14; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = 60 + Math.random() * 180;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 50,
        life: 0.55 + Math.random() * 0.35,
        max: 0.9,
        size: 1.6 + Math.random() * 2.4,
        color: colors[i % colors.length]
      });
    }
  }

  /* ---------- 物理 ---------- */

  function collideRim(cx, cy) {
    var minD = geo.rimR + geo.ballR;
    var dx = ball.x - cx;
    var dy = ball.y - cy;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d >= minD || d < 0.0001) return;
    var nx = dx / d;
    var ny = dy / d;
    ball.x = cx + nx * minD;
    ball.y = cy + ny * minD;
    var vn = ball.vx * nx + ball.vy * ny;
    if (vn < 0) {
      ball.vx -= 1.55 * vn * nx;
      ball.vy -= 1.55 * vn * ny;
      ball.vx *= 0.94;
      ball.vy *= 0.94;
    }
    if (!ball.touchedRim) playSound('rim');
    ball.touchedRim = true;
  }

  function physicsStep(h) {
    var prevY = ball.y;
    var rimY = currentRimY();

    ball.vy += GRAVITY * h;
    if (mode.wind) ball.vx += wind * WIND_ACCEL * h;
    ball.x += ball.vx * h;
    ball.y += ball.vy * h;
    ball.rot += (ball.vx / Math.max(6, geo.ballR)) * h;

    // 进球判定：球心自上而下穿过篮筐平面
    if (!ball.scored && ball.vy > 0 && prevY < rimY && ball.y >= rimY &&
        Math.abs(ball.x - geo.hoopX) < geo.rimHalf * 0.45) {
      ball.scored = true;
      var swish = !ball.touchedRim && !ball.touchedBoard;
      var combo = streak + 1 >= 3;
      var pts = 2 + (swish ? mode.swishBonus : 0) + (combo ? mode.streakBonus : 0);
      addScore(pts, swish, combo);
    }

    // 篮筐两端
    collideRim(geo.hoopX - geo.rimHalf, rimY);
    collideRim(geo.hoopX + geo.rimHalf, rimY);

    // 篮板（左侧面）
    if (ball.x + geo.ballR > geo.bbX && ball.x < geo.bbX &&
        ball.y > geo.boardTop && ball.y < geo.boardTop + geo.boardH &&
        ball.vx > 0 && !ball.scored) {
      ball.x = geo.bbX - geo.ballR;
      ball.vx = -Math.abs(ball.vx) * 0.55;
      ball.vy *= 0.92;
      ball.touchedBoard = true;
      playSound('board');
    }

    // 地板
    if (ball.y + geo.ballR > geo.floorY) {
      ball.y = geo.floorY - geo.ballR;
      if (ball.vy > 0) {
        ball.vy = -ball.vy * 0.5;
        ball.vx *= 0.86;
        playSound('bounce');
      }
    }

    // 左右墙与天花板
    if (ball.x - geo.ballR < 0) {
      ball.x = geo.ballR;
      ball.vx = Math.abs(ball.vx) * 0.6;
    }
    if (ball.x + geo.ballR > W) {
      ball.x = W - geo.ballR;
      ball.vx = -Math.abs(ball.vx) * 0.6;
    }
    if (ball.y - geo.ballR < 0) {
      ball.y = geo.ballR;
      ball.vy = Math.abs(ball.vy) * 0.5;
    }
  }

  function updateBall(dt) {
    var steps = 4;
    var h = dt / steps;
    for (var i = 0; i < steps; i++) physicsStep(h);

    ball.flight += dt;
    if (ball.trailT === undefined) ball.trailT = 0;
    ball.trailT += dt;
    if (ball.trailT > 0.024 && !ball.scored) {
      ball.trailT = 0;
      trail.push({ x: ball.x, y: ball.y });
      if (trail.length > 16) trail.shift();
    }

    if (ball.scored) {
      ball.resetT += dt;
      if (ball.resetT > 0.9) spawnBall();
      return;
    }

    var speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
    var resting = ball.y + geo.ballR >= geo.floorY - 1 && speed < 45 && ball.flight > 0.8;
    var gone = ball.y > H + 90 || ball.flight > 6;
    if (resting || gone) {
      ball.resetT += dt;
      if (ball.resetT > 0.5) missReset();
    }
  }

  function updateEffects(dt) {
    elapsed += dt;
    if (netSway > 0) netSway = Math.max(0, netSway - dt * 2.2);

    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= dt;
      p.vy += 500 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    for (var j = popups.length - 1; j >= 0; j--) {
      var q = popups[j];
      q.life -= dt;
      q.y -= 26 * dt;
      if (q.life <= 0) popups.splice(j, 1);
    }
  }

  /* ---------- 绘制 ---------- */

  function drawCourt() {
    ctx.clearRect(0, 0, W, H);

    var bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, pal.court);
    bg.addColorStop(1, pal.court2);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    var glow = ctx.createRadialGradient(W * 0.78, H * 0.26, 0, W * 0.78, H * 0.26, W * 0.52);
    glow.addColorStop(0, 'rgba(255,209,102,0.10)');
    glow.addColorStop(1, 'rgba(255,209,102,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    var glow2 = ctx.createRadialGradient(W * 0.14, H * 0.1, 0, W * 0.14, H * 0.1, W * 0.45);
    glow2.addColorStop(0, 'rgba(74,214,255,0.08)');
    glow2.addColorStop(1, 'rgba(74,214,255,0)');
    ctx.fillStyle = glow2;
    ctx.fillRect(0, 0, W, H);

    // 地板
    ctx.fillStyle = 'rgba(3,8,15,0.62)';
    ctx.fillRect(0, geo.floorY, W, H - geo.floorY);
    ctx.strokeStyle = pal.line;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, geo.floorY);
    ctx.lineTo(W, geo.floorY);
    ctx.stroke();

    // 场地线：禁区与罚球圈
    ctx.strokeStyle = pal.line;
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 1.4;
    var keyW = geo.rimHalf * 5.6;
    var keyH = geo.rimHalf * 3.4;
    ctx.strokeRect(geo.hoopX - keyW, geo.floorY - keyH, keyW, keyH);
    ctx.beginPath();
    ctx.arc(geo.hoopX - keyW, geo.floorY - keyH / 2, geo.rimHalf * 1.35, -Math.PI / 2, Math.PI / 2);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // 底线
    ctx.strokeStyle = pal.line;
    ctx.globalAlpha = 0.6;
    ctx.beginPath();
    ctx.moveTo(W - 2, geo.floorY - geo.rimHalf * 6.5);
    ctx.lineTo(W - 2, geo.floorY);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function drawHoop() {
    var rimY = currentRimY();
    var bx = geo.bbX;
    var boardBottom = geo.boardTop + geo.boardH;

    // 支撑臂
    ctx.strokeStyle = pal.boardEdge;
    ctx.globalAlpha = 0.7;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(bx + geo.boardW, geo.boardTop + geo.boardH * 0.52);
    ctx.lineTo(W, geo.boardTop + geo.boardH * 0.52);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // 篮板
    ctx.fillStyle = pal.board;
    ctx.strokeStyle = pal.boardEdge;
    ctx.lineWidth = 2;
    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(bx, geo.boardTop, geo.boardW, geo.boardH, 3);
    } else {
      ctx.rect(bx, geo.boardTop, geo.boardW, geo.boardH);
    }
    ctx.fill();
    ctx.stroke();

    // 篮板内框
    ctx.strokeStyle = pal.boardEdge;
    ctx.globalAlpha = 0.75;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(bx + 2, rimY - geo.rimHalf * 1.1, geo.boardW - 4, geo.rimHalf * 1.7);
    ctx.globalAlpha = 1;

    // 篮筐
    ctx.strokeStyle = pal.rim;
    ctx.lineWidth = Math.max(3, geo.rimHalf * 0.14);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(geo.hoopX - geo.rimHalf, rimY);
    ctx.lineTo(geo.hoopX + geo.rimHalf, rimY);
    ctx.stroke();

    ctx.fillStyle = pal.rim;
    ctx.beginPath();
    ctx.arc(geo.hoopX - geo.rimHalf, rimY, geo.rimR, 0, Math.PI * 2);
    ctx.arc(geo.hoopX + geo.rimHalf, rimY, geo.rimR, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineCap = 'butt';
  }

  function drawNet() {
    var rimY = currentRimY();
    var topY = rimY + geo.rimHalf * 0.1;
    var depth = geo.rimHalf * 1.7;
    var sway = netSway * geo.rimHalf * 0.28;

    ctx.strokeStyle = pal.net;
    ctx.globalAlpha = 0.5;
    ctx.lineWidth = 1.2;

    var strands = 7;
    for (var i = 0; i < strands; i++) {
      var t = i / (strands - 1);
      var topX = geo.hoopX - geo.rimHalf * 0.92 + geo.rimHalf * 1.84 * t;
      var bottomX = geo.hoopX - geo.rimHalf * 0.42 + geo.rimHalf * 0.84 * t + sway * Math.sin(t * Math.PI);
      ctx.beginPath();
      ctx.moveTo(topX, topY);
      ctx.quadraticCurveTo(
        geo.hoopX + (topX - geo.hoopX) * 0.55,
        topY + depth * 0.55,
        bottomX,
        topY + depth
      );
      ctx.stroke();
    }

    var rings = 2;
    for (var r = 1; r <= rings; r++) {
      var k = r / (rings + 1);
      var y = topY + depth * k;
      var halfW = geo.rimHalf * (0.92 - 0.5 * k);
      var off = sway * k * 0.7;
      ctx.beginPath();
      ctx.moveTo(geo.hoopX - halfW + off, y);
      ctx.quadraticCurveTo(geo.hoopX + off, y + depth * 0.10, geo.hoopX + halfW + off, y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawBall() {
    var r = geo.ballR;

    // 地面阴影
    var height = clamp((geo.floorY - ball.y) / (H * 0.6), 0, 1);
    ctx.fillStyle = 'rgba(0,0,0,0.34)';
    ctx.beginPath();
    ctx.ellipse(ball.x, geo.floorY + 2, r * (0.95 - height * 0.35), r * 0.32 * (0.9 - height * 0.3), 0, 0, Math.PI * 2);
    ctx.fill();

    // 拖尾
    for (var i = 0; i < trail.length; i++) {
      var a = (i / trail.length) * 0.18;
      ctx.fillStyle = 'rgba(240,130,52,' + a.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(trail[i].x, trail[i].y, r * (0.35 + 0.4 * (i / trail.length)), 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.save();
    ctx.translate(ball.x, ball.y);
    ctx.rotate(ball.rot);

    var grad = ctx.createRadialGradient(-r * 0.34, -r * 0.38, r * 0.12, 0, 0, r);
    grad.addColorStop(0, pal.ballHi);
    grad.addColorStop(0.62, pal.ball);
    grad.addColorStop(1, pal.ballDark);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = pal.ballLine;
    ctx.globalAlpha = 0.72;
    ctx.lineWidth = Math.max(1, r * 0.09);
    ctx.beginPath();
    ctx.moveTo(-r, 0);
    ctx.lineTo(r, 0);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, -r);
    ctx.lineTo(0, r);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(-r * 0.72, 0, r * 1.02, -0.72, 0.72);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(r * 0.72, 0, r * 1.02, Math.PI - 0.72, Math.PI + 0.72);
    ctx.stroke();
    ctx.globalAlpha = 1;

    ctx.beginPath();
    ctx.arc(-r * 0.32, -r * 0.36, r * 0.16, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.32)';
    ctx.fill();

    ctx.restore();
  }

  function drawAim() {
    if (phase !== 'playing' || ball.flying || ball.resetT > 0) return;

    var v = shotVelocity(aimAngle, aimPower);
    var x = ball.x;
    var y = ball.y;
    var vx = v.x;
    var vy = v.y;
    var step = 1 / 60;

    ctx.fillStyle = pal.amber;
    for (var i = 0; i < 62; i++) {
      vy += GRAVITY * step;
      x += vx * step;
      y += vy * step;
      if (y > geo.floorY || x > W + 20) break;
      if (i % 2 !== 0) continue;
      var alpha = 0.85 * (1 - i / 68);
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(x, y, Math.max(1.8, geo.ballR * 0.16), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawEffects() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (var j = 0; j < popups.length; j++) {
      var q = popups[j];
      var a = clamp(q.life / q.max, 0, 1);
      ctx.globalAlpha = a;
      ctx.fillStyle = q.color;
      ctx.textAlign = 'center';
      ctx.font = '700 22px "Segoe UI","Microsoft YaHei",system-ui,sans-serif';
      ctx.fillText(q.text, q.x, q.y);
      if (q.sub) {
        ctx.font = '600 11px "Segoe UI","Microsoft YaHei",system-ui,sans-serif';
        ctx.fillStyle = pal.amber;
        ctx.globalAlpha = a * 0.85;
        ctx.fillText(q.sub, q.x, q.y + 16);
      }
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  function drawWind() {
    if (!mode.wind || phase !== 'playing') return;
    var label = (wind >= 0 ? '→ ' : '← ') + Math.abs(wind).toFixed(1);
    var cx = W * 0.5, cy = 26;
    ctx.save();
    ctx.font = '600 12px "Segoe UI","Microsoft YaHei",system-ui,sans-serif';
    ctx.textAlign = 'center';
    var tw = ctx.measureText(label).width;
    var w = tw + 26, h = 24;
    ctx.fillStyle = 'rgba(6,11,21,.7)';
    ctx.strokeStyle = 'rgba(74,214,255,.4)';
    ctx.lineWidth = 1;
    if (ctx.roundRect) {
      ctx.beginPath();
      ctx.roundRect(cx - w / 2, cy - h / 2, w, h, 12);
    } else {
      ctx.beginPath();
      ctx.rect(cx - w / 2, cy - h / 2, w, h);
    }
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = pal.cyan;
    ctx.fillText(label, cx, cy + 4);
    var barW = 30 * Math.abs(wind);
    ctx.globalAlpha = 0.3;
    ctx.fillRect(cx - 30, cy + h / 2 + 4, 60, 2);
    ctx.globalAlpha = 0.95;
    if (wind >= 0) ctx.fillRect(cx, cy + h / 2 + 3, barW, 4);
    else ctx.fillRect(cx - barW, cy + h / 2 + 3, barW, 4);
    ctx.restore();
  }

  function draw() {
    drawCourt();
    drawHoop();
    drawAim();
    drawBall();
    drawNet();
    drawEffects();
    drawWind();
  }

  /* ---------- 主循环 ---------- */

  var last = performance.now();
  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.033);
    last = now;

    if (phase === 'playing') {
      if (mode.seconds > 0) {
        timeLeft = Math.max(0, timeLeft - dt);
        updateTimeHud();
        if (timeLeft <= 0) {
          endGame();
        } else if (ball.flying) {
          updateBall(dt);
        }
      } else if (ball.flying) {
        updateBall(dt);
      }
    }

    updateEffects(dt);
    draw();
    requestAnimationFrame(frame);
  }

  /* ---------- 绑定 ---------- */

  startBtn.addEventListener('click', function () { startGame(selectedMode); });
  againBtn.addEventListener('click', function () { startGame(modeId); });
  restartBtn.addEventListener('click', function () {
    startGame(modeId);
  });
  changeModeBtn.addEventListener('click', function () {
    endOverlay.classList.remove('open');
    renderModeCards();
    selectMode(modeId);
    startOverlay.classList.add('open');
    startBtn.focus();
  });

  soundBtn.addEventListener('click', function () {
    soundOn = !soundOn;
    saveBool(STORE_SOUND, soundOn);
    soundBtn.textContent = soundOn ? '音效：开' : '音效：关';
    soundBtn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    if (soundOn) {
      ensureAudio();
      playSound('shoot');
    }
  });

  window.addEventListener('resize', resize);

  function init() {
    pal = readPalette();
    resize();
    modeId = loadMode();
    mode = MODES[modeId];
    selectedMode = modeId;
    best = loadNum(mode.bestKey);
    renderModeCards();
    selectMode(modeId);
    spawnBall();
    updateHud();
    updateTimeHud();
    soundBtn.textContent = soundOn ? '音效：开' : '音效：关';
    soundBtn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    requestAnimationFrame(frame);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
