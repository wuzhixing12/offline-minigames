<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>弹弓弹道</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a1020;color:#eaf2ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  #cv{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .hud{position:fixed;left:16px;top:12px;display:flex;gap:18px;font-size:13px;color:#9ab0ca;pointer-events:none;z-index:2;flex-wrap:wrap}
  .hud b{color:#ffd166;font-size:16px;margin-left:4px}
  .hint{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);font-size:12px;color:#7088a6;pointer-events:none;white-space:nowrap}
  .toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-10px);padding:10px 22px;border-radius:12px;background:rgba(10,24,40,.92);border:1px solid rgba(94,234,212,.35);color:#bff8ec;font-size:16px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:4}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,8,16,.86);z-index:3;text-align:center;padding:24px}
  .overlay.hide{display:none}
  .overlay h1{margin:0 0 8px;font-size:30px;letter-spacing:.08em;color:#ffe3a3}
  .overlay p{margin:0 0 20px;color:#93a8c2;font-size:13px;line-height:1.8}
  .overlay button{border:1px solid rgba(255,209,102,.5);background:rgba(255,209,102,.12);color:#ffe9b8;padding:11px 30px;border-radius:999px;font-size:15px;cursor:pointer}
  .overlay button:active{transform:scale(.97)}
  .overlay button.ghost{border-color:rgba(148,163,184,.28);background:rgba(148,163,184,.08);color:#b8c8dd;margin-top:8px}
  .modes{display:flex;gap:6px;padding:4px;border-radius:12px;border:1px solid rgba(255,209,102,.2);background:rgba(255,255,255,.03);margin:0 0 12px}
  .modes button{border:0;background:transparent;color:#8fa6c2;padding:7px 13px;border-radius:9px;font-size:12.5px;cursor:pointer;transition:.16s}
  .modes button:hover{color:#dcecff}
  .modes button.on{background:rgba(255,209,102,.14);color:#ffe9b8;box-shadow:inset 0 0 0 1px rgba(255,209,102,.34)}
  .achline{font-size:11.5px;color:#7f96b4;letter-spacing:.08em;margin:0 0 12px}
  .levels{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:min(430px,92vw);margin:4px 0 14px}
  .lvbtn{border:1px solid rgba(255,209,102,.24)!important;background:rgba(255,209,102,.06)!important;color:#dfe9f7!important;
    border-radius:10px!important;padding:7px 2px 6px!important;font-size:13px!important;line-height:1.2!important;cursor:pointer}
  .lvbtn b{display:block;font-size:14px;color:#ffe9b8}
  .lvbtn .st{display:block;font-size:9px;letter-spacing:1px;color:#fbbf24;margin-top:2px;min-height:10px}
  .lvbtn.locked{opacity:.32;cursor:not-allowed}
  .lvbtn.cleared{border-color:rgba(94,234,212,.44)!important;background:rgba(94,234,212,.08)!important}
  .lvbtn.current{box-shadow:0 0 0 2px rgba(255,209,102,.5) inset}
  .legend{font-size:11px;color:#7f96b4;line-height:1.9;margin:0 0 14px}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud">
  <span id="chapterWrap">章节<b id="chapter">训练场</b></span>
  <span>关卡<b id="level">1</b>/30</span>
  <span>剩余弹丸<b id="shots">5</b></span>
  <span>本发口径<b id="ballR">9</b></span>
  <span>分数<b id="score">0</b></span>
  <span>连击<b id="combo">×1</b></span>
  <span>评级<b id="stars">—</b></span>
  <span>风<b id="wind">0</b></span>
</div>
<div class="hint">按住并向后拖动拉弓，松手发射</div>
<div class="toast" id="toast"></div>
<div class="overlay" id="over">
  <h1 id="ovTitle">弹弓风暴</h1>
  <p id="ovSub">30 关三章弹道挑战：普通靶一击即碎，钢环靶要打两次，<br>浮游靶会移动，绿色奖励靶补弹丸，金色靶加分，炸弹靶会连锁引爆。<br>每 10 关是首领战，坚持到最后一关。</p>
  <div class="legend">
    <i style="background:#ffcf6b"></i>普通 +100　
    <i style="background:#b8c7da"></i>装甲 ×2　
    <i style="background:#5eead4"></i>浮游　
    <i style="background:#4ade80"></i>奖励 +1 弹丸　
    <i style="background:#fbbf24"></i>黄金 +400　
    <i style="background:#fb7185"></i>炸弹 连锁
  </div>
  <div class="modes" id="modes">
    <button data-mode="campaign" class="on" type="button">战役 · 30 关</button>
    <button data-mode="daily" type="button">每日挑战</button>
    <button data-mode="endless" type="button">无尽模式</button>
  </div>
  <div class="levels" id="levels"></div>
  <div class="achline" id="achline">成就 0 / 8</div>
  <button id="start" type="button">开始挑战</button>
  <button id="menu" class="ghost" type="button" style="display:none">返回选关</button>
</div>
<script>
(function(){
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var levelEl = document.getElementById('level');
  var shotsEl = document.getElementById('shots');
  var ballREl = document.getElementById('ballR');
  var scoreEl = document.getElementById('score');
  var windEl = document.getElementById('wind');
  var starsEl = document.getElementById('stars');
  var chapterEl = document.getElementById('chapter');
  var comboEl = document.getElementById('combo');
  var achlineEl = document.getElementById('achline');
  var modesBox = document.getElementById('modes');
  var over = document.getElementById('over');
  var ovTitle = document.getElementById('ovTitle');
  var ovSub = document.getElementById('ovSub');
  var btn = document.getElementById('start');
  var menuBtn = document.getElementById('menu');
  var levelsBox = document.getElementById('levels');
  var toastEl = document.getElementById('toast');

  var W = 0, H = 0, dpr = 1;
  var level = 1, shots = 5, score = 0, wind = 0, gust = 0;
  var TOTAL_LEVELS = 30;
  var targets = [], blocks = [];
  var ball = null;
  var dragging = false;
  var drag = { x: 0, y: 0 };
  var anchor = { x: 170, y: 0 };
  var state = 'menu';
  var overAction = 'continue';
  var last = 0;
  var toastTimer = 0;
  var MODE = 'campaign';
  var chapter = '训练场';
  var comboNow = 0;
  var shake = 0;
  var floats = [];
  var rng = Math.random;

  var CHAPTERS = [
    { from:1,  to:10, name:'第一章 · 训练场' },
    { from:11, to:20, name:'第二章 · 风口' },
    { from:21, to:30, name:'第三章 · 钢铁厂' }
  ];
  var LEVEL_NAMES = [
    '第一发','两根木桩','高低差','会动的靶','风口初探','双弹连击','铁皮来了','补给线','三连靶','首领 · 铁颚',
    '侧风','窄窗','吊桥','浮游群','装甲阵','黄金时刻','炸弹引线','风眼','最后一发','首领 · 风暴眼',
    '钢梁','深井','连锁反应','双首领','无风带','铁幕','精准时刻','绝境','终局之前','首领 · 铸炉'
  ];

  var progress = { stars:{}, best:{}, unlocked:1, ach:{}, daily:{}, endless:0 };
  try {
    var saved = JSON.parse(localStorage.getItem('tx_sling_progress_v1') || 'null');
    if (saved && typeof saved === 'object'){
      progress.stars = saved.stars || {};
      progress.best = saved.best || {};
      progress.unlocked = Math.max(1, Math.min(TOTAL_LEVELS, saved.unlocked || 1));
      progress.ach = saved.ach || {};
      progress.daily = saved.daily || {};
      progress.endless = saved.endless || 0;
    }
  } catch(e){}
  function saveProgress(){
    try { localStorage.setItem('tx_sling_progress_v1', JSON.stringify(progress)); } catch(e){}
  }
  function starStr(n){ return n >= 3 ? '★★★' : n === 2 ? '★★☆' : n === 1 ? '★☆☆' : '☆☆☆'; }
  function totalStars(){ var s = 0; for (var k in progress.stars) s += progress.stars[k] || 0; return s; }

  var ACHS = [
    { id:'first',  name:'第一颗石子', desc:'通过任意一关' },
    { id:'three',  name:'三颗星',     desc:'任意关卡拿到三星' },
    { id:'combo3', name:'三连',       desc:'单发命中 3 个目标' },
    { id:'bomb',   name:'拆弹专家',   desc:'用炸弹靶引爆 2 个目标' },
    { id:'boss',   name:'屠龙者',     desc:'击败任意首领' },
    { id:'daily',  name:'今日份',     desc:'完成一次每日挑战' },
    { id:'endless',name:'没有尽头',   desc:'无尽模式坚持到第 10 波' },
    { id:'all',    name:'三十关全通', desc:'通关全部 30 关' }
  ];
  function unlockAch(id){
    if (progress.ach[id]) return;
    progress.ach[id] = 1;
    saveProgress();
    var a = null;
    for (var i = 0; i < ACHS.length; i++) if (ACHS[i].id === id) a = ACHS[i];
    if (a) toast('成就 · ' + a.name);
    renderAch();
  }
  function achCount(){ var n = 0; for (var k in progress.ach) if (progress.ach[k]) n++; return n; }
  function renderAch(){
    if (achlineEl) achlineEl.textContent = '成就 ' + achCount() + ' / ' + ACHS.length +
      (achCount() === ACHS.length ? ' · 全部解锁' : '');
  }
  function renderLevels(){
    if (!levelsBox) return;
    levelsBox.innerHTML = '';
    for (var i = 1; i <= TOTAL_LEVELS; i++){
      (function(n){
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'lvbtn' + (n > progress.unlocked ? ' locked' : '') +
          ((progress.stars[n] || 0) > 0 ? ' cleared' : '') +
          (n === progress.unlocked ? ' current' : '');
        b.innerHTML = '<b>' + n + '</b><span class="st">' + starStr(progress.stars[n] || 0) + '</span>';
        b.title = LEVEL_NAMES[n - 1] || ('第 ' + n + ' 关');
        b.disabled = n > progress.unlocked;
        b.addEventListener('click', function(){ if (n <= progress.unlocked) beginLevel(n); });
        levelsBox.appendChild(b);
      })(i);
    }
  }

  var BALL_MIN = 7, BALL_MAX = 13;
  var nextR = 9, nextHue = 190;
  var trail = [], parts = [];
  var GRAV = 900, MAXV = 1250, SCALE = 1, FULL_PULL = 170;

  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function rand(a, b){ return a + rng() * (b - a); }
  function dailySeed(){
    var d = new Date();
    return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
  }
  function currentWind(){ return wind + (gust ? Math.sin(performance.now() / 900) * gust : 0); }

  function chapterOf(n){
    for (var i = 0; i < CHAPTERS.length; i++){
      if (n >= CHAPTERS[i].from && n <= CHAPTERS[i].to) return CHAPTERS[i].name;
    }
    return '无尽 · 第 ' + n + ' 波';
  }

  function beginLevel(n, mode){
    if (mode) MODE = mode;
    level = Math.max(1, n || 1);
    if (MODE === 'endless' && level > TOTAL_LEVELS){
      // 无尽模式继续使用程序化关卡
    } else {
      level = Math.min(TOTAL_LEVELS, level);
    }
    if (MODE === 'campaign') rng = mulberry32(0x51ed + level * 7919);
    else if (MODE === 'daily') rng = mulberry32(dailySeed() * 31 + 17);
    else rng = Math.random;
    chapter = chapterOf(level);
    if (MODE !== 'endless') score = 0;
    ball = null;
    parts = [];
    floats = [];
    dragging = false;
    overAction = 'continue';
    over.classList.add('hide');
    menuBtn.style.display = 'none';
    setupLevel();
  }

  function rollShot(){
    nextR = Math.round(Math.max(BALL_MIN, Math.min(BALL_MAX, rand(BALL_MIN, BALL_MAX))) * 10) / 10;
    nextHue = rand(150, 330);
  }

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth || window.innerWidth;
    H = cv.clientHeight || window.innerHeight;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    SCALE = Math.min(3, Math.max(.7, Math.max(W / 1280, H / 720)));
    GRAV = 900 * SCALE;
    MAXV = 1350 * SCALE;
    anchor.x = Math.round(Math.min(210, Math.max(120, W * 0.24)));
    anchor.y = H - 110;
    FULL_PULL = Math.max(70, Math.min(anchor.x - 24, 170 * SCALE));
  }
  window.addEventListener('resize', resize);
  resize();

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1200);
  }

  function setupLevel(){
    var bossLevel = level % 10 === 0;
    var cap = MODE === 'endless' ? 14 : 10;
    var n = Math.min(cap, 4 + Math.floor((level - 1) / 2.4));
    if (bossLevel) n = Math.max(3, Math.min(6, 4 + Math.floor(level / 12)));
    if (MODE === 'endless' && level > 1){
      shots = Math.min(12, shots + 3);
    } else {
      shots = n + 4 + (level >= 15 ? 1 : 0) + (bossLevel ? 2 : 0);
    }
    var windMax = 40 + Math.min(120, level * 4);
    wind = rand(-windMax, windMax) * SCALE;
    gust = level >= 10 ? rand(18, 58) * SCALE : 0;
    targets = [];
    blocks = [];
    anchor.x = Math.round(Math.min(210, Math.max(120, W * 0.24)));
    anchor.y = H - 110;
    ball = null;
    trail = [];
    dragging = false;
    comboNow = 0;
    rollShot();

    var bn = 1 + Math.floor(level / 5);
    for (var j = 0; j < bn; j++){
      blocks.push({
        x: rand(W * 0.44, Math.max(W * 0.46, W * 0.78)),
        y: rand(H * 0.32, Math.max(H * 0.34, H * 0.68)),
        w: rand(64, 110),
        h: 16
      });
    }

    if (bossLevel){
      targets.push({
        x: W * 0.74, y: H * 0.42, r: Math.max(28, 30 * SCALE),
        spin: 0, type: 'boss', hp: 6 + Math.floor(level / 10) * 2,
        maxHp: 6 + Math.floor(level / 10) * 2,
        bx: W * 0.74, by: H * 0.42,
        phase: 0, amp: Math.min(70, W * 0.08), spd: 0.5, flash: 0, cool: 0
      });
    }

    for (var i = 0; i < n; i++){
      var type = 'normal';
      if (level >= 4 && i === 0) type = 'bonus';
      else if (level >= 7 && i % 6 === 2) type = 'gold';
      else if (level >= 12 && i % 5 === 3) type = 'bomb';
      else if (level >= 6 && i % 3 === 1) type = 'moving';
      else if (level >= 10 && i % 4 === 2) type = 'armored';
      var tr = type === 'bonus' ? 12 :
        type === 'gold' ? 13 :
        type === 'bomb' ? 15 :
        type === 'armored' ? 17 : rand(14, 20);
      var tx = 0, ty = 0;
      for (var tryN = 0; tryN < 80; tryN++){
        tx = rand(W * 0.44, Math.max(W * 0.5, W - 70));
        ty = rand(100, Math.max(130, H - 190));
        var ok = tx > anchor.x + 80;
        for (var q = 0; q < targets.length && ok; q++){
          if (Math.hypot(targets[q].x - tx, targets[q].y - ty) < targets[q].r + tr + 24) ok = false;
        }
        for (var m = 0; m < blocks.length && ok; m++){
          var bb = blocks[m];
          var nx = Math.max(bb.x, Math.min(tx, bb.x + bb.w));
          var ny = Math.max(bb.y, Math.min(ty, bb.y + bb.h));
          if (Math.hypot(tx - nx, ty - ny) < tr + 12) ok = false;
        }
        if (ok) break;
      }
      targets.push({
        x: tx, y: ty, r: tr, spin: rand(0, 6.28), type: type,
        hp: type === 'armored' ? 2 : 1, bx: tx, by: ty,
        phase: rand(0, 6.28),
        amp: (type === 'moving' || type === 'gold') ? rand(18, 42) : 0,
        spd: rand(0.55, 1.25), flash: 0, cool: 0
      });
    }

    state = 'aim';
    updateHud();
  }

  function updateTargets(dt){
    for (var i = 0; i < targets.length; i++){
      var t = targets[i];
      if (t.cool > 0) t.cool = Math.max(0, t.cool - dt);
      if (t.flash > 0) t.flash = Math.max(0, t.flash - dt * 2.4);
      if (t.type === 'moving' || t.type === 'gold' || t.type === 'boss'){
        t.phase += dt * t.spd;
        t.x = t.bx + Math.cos(t.phase) * t.amp;
        t.y = t.by + Math.sin(t.phase * (t.type === 'boss' ? 0.8 : 1.35)) * t.amp * (t.type === 'boss' ? 0.4 : 0.55);
      }
    }
  }

  function updateHud(){
    if (chapterEl) chapterEl.textContent = MODE === 'daily' ? '每日挑战' : chapter;
    levelEl.textContent = MODE === 'campaign' ? level : (MODE === 'daily' ? '每日' : level);
    shotsEl.textContent = shots;
    scoreEl.textContent = score;
    if (comboEl) comboEl.textContent = '×' + Math.max(1, comboNow);
    starsEl.textContent = MODE === 'campaign' ? starStr(progress.stars[level] || 0) : '—';
    ballREl.textContent = (state === 'fly' && ball ? ball.r.toFixed(1) : nextR.toFixed(1));
    var w = currentWind();
    windEl.textContent = (w > 0 ? '→ ' : '← ') + Math.abs(Math.round(w)) + (gust ? ' 阵风' : '');
  }

  function pos(e){
    var r = cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  cv.addEventListener('pointerdown', function(e){
    if (state !== 'aim' || shots <= 0) return;
    dragging = true;
    drag = pos(e);
    cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', function(e){
    if (!dragging) return;
    drag = pos(e);
  });
  cv.addEventListener('pointerup', function(){
    if (!dragging) return;
    dragging = false;
    var dx = anchor.x - drag.x, dy = anchor.y - drag.y;
    var pull = Math.hypot(dx, dy);
    if (pull < 18) return;
    var power = Math.min(1, pull / FULL_PULL) * MAXV;
    var vx = dx / pull * power, vy = dy / pull * power;
    ball = { x: anchor.x, y: anchor.y, vx: vx, vy: vy, r: nextR, hue: nextHue, combo: 0 };
    trail = [];
    shots--;
    state = 'fly';
    updateHud();
  });
  cv.addEventListener('pointercancel', function(){ dragging = false; });

  function circleHitsRect(x, y, r, b){
    var cx = Math.max(b.x, Math.min(x, b.x + b.w));
    var cy = Math.max(b.y, Math.min(y, b.y + b.h));
    return Math.hypot(x - cx, y - cy) < r;
  }

  function launchPreview(){
    var pts = [];
    var pdx = anchor.x - drag.x, pdy = anchor.y - drag.y;
    var pull = Math.hypot(pdx, pdy);
    if (pull < 1) return pts;
    var power = Math.min(1, pull / FULL_PULL) * MAXV;
    var vx = pdx / pull * power, vy = pdy / pull * power;
    var w = currentWind();
    var x = anchor.x, y = anchor.y;
    for (var i = 0; i < 90; i++){
      vx += w * .016;
      vy += GRAV * .016;
      x += vx * .016;
      y += vy * .016;
      if (i % 5 === 0) pts.push({ x: x, y: y });
      if (y > H - 34 || x > W + 40) break;
    }
    return pts;
  }

  function completeLevel(){
    if (state === 'wait' || state === 'over') return;
    ball = null;
    state = 'wait';
    var st = shots >= 3 ? 3 : (shots >= 1 ? 2 : 1);
    var bonus = shots * 50;
    score += bonus;
    updateHud();
    toast('过关 ' + starStr(st) + ' +' + bonus);
    unlockAch('first');
    if (st === 3) unlockAch('three');

    if (MODE === 'endless'){
      progress.endless = Math.max(progress.endless || 0, level);
      if (level >= 10) unlockAch('endless');
      saveProgress();
      setTimeout(function(){
        if (state === 'over' || MODE !== 'endless') return;
        level++;
        setupLevel();
      }, 680);
      return;
    }

    if (MODE === 'daily'){
      var dkey = String(dailySeed());
      var rec = progress.daily[dkey] || { best: 0, stars: 0 };
      progress.daily[dkey] = {
        best: Math.max(rec.best || 0, score),
        stars: Math.max(rec.stars || 0, st)
      };
      saveProgress();
      unlockAch('daily');
      setTimeout(function(){
        state = 'over';
        ovTitle.textContent = '每日挑战完成';
        ovSub.innerHTML = '今日得分 <b>' + score + '</b> ' + starStr(st) +
          '<br>今日最佳 ' + progress.daily[dkey].best + '，明天解锁新的组合。';
        btn.textContent = '再来一次';
        menuBtn.style.display = 'inline-block';
        overAction = 'daily';
        over.classList.remove('hide');
      }, 800);
      return;
    }

    progress.stars[level] = Math.max(progress.stars[level] || 0, st);
    progress.best[level] = Math.max(progress.best[level] || 0, score);
    progress.unlocked = Math.max(progress.unlocked, Math.min(TOTAL_LEVELS, level + 1));
    saveProgress();
    renderLevels();

    if (level >= TOTAL_LEVELS){
      unlockAch('all');
      setTimeout(function(){
        state = 'over';
        ovTitle.textContent = '三十关全通';
        ovSub.innerHTML = '总星级 ' + totalStars() + ' / ' + (TOTAL_LEVELS * 3) +
          '<br>最后一关得分 ' + score + '，再来一轮刷新记录。';
        btn.textContent = '重新挑战';
        menuBtn.style.display = 'inline-block';
        overAction = 'restart';
        over.classList.remove('hide');
      }, 800);
    } else {
      setTimeout(function(){
        level++;
        score = 0;
        setupLevel();
      }, 900);
    }
  }

  function die(){
    ball = null;
    if (targets.length === 0){ completeLevel(); return; }
    if (shots <= 0){
      state = 'over';
      if (MODE === 'endless'){
        ovTitle.textContent = '无尽落幕';
        ovSub.innerHTML = '坚持到第 <b>' + level + '</b> 波，得分 <b>' + score + '</b>' +
          '<br>最高纪录 ' + (progress.endless || 0) + ' 波，再来一轮。';
        overAction = 'endless';
        btn.textContent = '重新开始';
      } else if (MODE === 'daily'){
        ovTitle.textContent = '每日挑战未完成';
        ovSub.innerHTML = '还剩 ' + targets.length + ' 个目标，今日记录还没刷新。<br>调整一下角度再来一次。';
        overAction = 'daily';
        btn.textContent = '重试每日';
      } else {
        ovTitle.textContent = '弹丸用完了';
        ovSub.innerHTML = '第 ' + level + ' 关得分 ' + score + '<br>还剩 ' + targets.length + ' 个目标，再试一次。';
        overAction = 'retry';
        btn.textContent = '重试本关';
      }
      menuBtn.style.display = 'inline-block';
      over.classList.remove('hide');
      return;
    }
    state = 'aim';
    trail = [];
    comboNow = 0;
    rollShot();
    updateHud();
  }

  function burst(x, y, hue){
    for (var i = 0; i < 14; i++){
      var a = rand(0, 6.2832), sp = rand(60, 260);
      parts.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 40,
        life: rand(.35, .7),
        max: .7,
        hue: hue
      });
    }
  }

  function updateParts(dt){
    for (var i = parts.length - 1; i >= 0; i--){
      var p = parts[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 420 * dt;
      p.vx *= .99;
      p.life -= dt;
      if (p.life <= 0) parts.splice(i, 1);
    }
  }

  function addFloat(x, y, text, hue){
    floats.push({ x: x, y: y, text: text, hue: hue || 45, life: .95, max: .95 });
  }

  function updateFloats(dt){
    for (var i = floats.length - 1; i >= 0; i--){
      var f = floats[i];
      f.y -= 48 * dt;
      f.life -= dt;
      if (f.life <= 0) floats.splice(i, 1);
    }
  }

  function update(dt){
    if (state !== 'fly' || !ball) return;

    var speed = Math.hypot(ball.vx, ball.vy);
    var steps = Math.min(12, Math.max(1, Math.ceil(speed * dt / 9)));
    var h = dt / steps;

    for (var s = 0; s < steps; s++){
      ball.vx += currentWind() * h;
      ball.vy += GRAV * h;
      ball.x += ball.vx * h;
      ball.y += ball.vy * h;

      for (var i = targets.length - 1; i >= 0; i--){
        var t = targets[i];
        if (t.cool > 0) continue;
        if (Math.hypot(t.x - ball.x, t.y - ball.y) >= t.r + ball.r) continue;

        if (t.type === 'armored' && t.hp > 1){
          t.hp--;
          t.cool = 0.18;
          t.flash = 1;
          score += 50;
          burst(t.x, t.y, 200);
          addFloat(t.x, t.y, '+50', 200);
          toast('装甲命中 -1');
          updateHud();
          continue;
        }

        if (t.type === 'boss'){
          t.hp--;
          t.cool = 0.22;
          t.flash = 1;
          score += 80;
          burst(t.x, t.y, 268);
          shake = Math.max(shake, .4);
          if (t.hp <= 0){
            score += 1200;
            addFloat(t.x, t.y, '+1200', 48);
            burst(t.x, t.y, 300);
            targets.splice(i, 1);
            unlockAch('boss');
            toast('首领击破 +1200');
            shake = Math.max(shake, .95);
            updateHud();
            if (targets.length === 0){ completeLevel(); return; }
          } else {
            addFloat(t.x, t.y, '-1', 268);
            toast('首领 HP ' + t.hp + ' / ' + t.maxHp);
            updateHud();
          }
          break;
        }

        if (t.type === 'bomb'){
          targets.splice(i, 1);
          var chain = 0;
          var radius = 130 * SCALE;
          for (var b2 = targets.length - 1; b2 >= 0; b2--){
            if (Math.hypot(targets[b2].x - t.x, targets[b2].y - t.y) < radius){
              score += 120;
              burst(targets[b2].x, targets[b2].y, 20);
              addFloat(targets[b2].x, targets[b2].y, '+120', 20);
              targets.splice(b2, 1);
              chain++;
            }
          }
          score += 150;
          if (chain >= 2) unlockAch('bomb');
          shake = Math.max(shake, .55);
          burst(t.x, t.y, 18);
          addFloat(t.x, t.y, '+' + (150 + chain * 120), 20);
          toast(chain > 0 ? '炸弹连锁 ×' + chain : '炸弹引爆');
          updateHud();
          if (targets.length === 0){ completeLevel(); return; }
          break;
        }

        var combo = (ball.combo || 0) + 1;
        ball.combo = combo;
        comboNow = Math.max(comboNow, combo);
        if (combo >= 3) unlockAch('combo3');
        var base = t.type === 'bonus' ? 250 : t.type === 'gold' ? 400 : (t.type === 'armored' ? 200 : 100);
        var gain = base * combo;
        score += gain;
        addFloat(t.x, t.y, '+' + gain, t.type === 'gold' ? 45 : (t.type === 'bonus' ? 140 : 172));
        if (t.type === 'bonus'){ shots++; toast('奖励靶 +1 弹丸'); }
        else if (t.type === 'gold'){ toast('黄金靶 +' + gain); shake = Math.max(shake, .3); }
        else if (combo > 1){ toast('连击 x' + combo); }
        burst(t.x, t.y, t.type === 'bonus' ? 140 : (t.type === 'gold' ? 45 : (t.type === 'moving' ? 172 : ball.hue)));
        targets.splice(i, 1);
        updateHud();
        if (targets.length === 0){ completeLevel(); return; }
        break;
      }

      for (var j = 0; j < blocks.length; j++){
        if (circleHitsRect(ball.x, ball.y, ball.r, blocks[j])){
          burst(ball.x, ball.y, 30);
          die();
          return;
        }
      }

      if (ball.y > H - 34 || ball.x > W + 60 || ball.x < -60 || ball.y > H + 60){
        die();
        return;
      }
    }

    trail.push({ x: ball.x, y: ball.y, r: ball.r });
    if (trail.length > 16) trail.shift();
  }

  function draw(){
    var sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#08101f');
    sky.addColorStop(.7, '#0d1b30');
    sky.addColorStop(1, '#12263d');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    if (shake > 0.01){
      ctx.translate((Math.random() * 2 - 1) * shake * 13, (Math.random() * 2 - 1) * shake * 13);
    }

    ctx.strokeStyle = 'rgba(120,180,255,.08)';
    ctx.lineWidth = 1;
    for (var x = 0; x < W; x += 60){
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }

    ctx.fillStyle = '#0b1a2a';
    ctx.fillRect(0, H - 34, W, 34);
    ctx.strokeStyle = 'rgba(94,234,212,.3)';
    ctx.beginPath(); ctx.moveTo(0, H - 34); ctx.lineTo(W, H - 34); ctx.stroke();

    ctx.strokeStyle = '#c08a4a';
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(anchor.x, anchor.y + 8); ctx.lineTo(anchor.x, H - 34); ctx.stroke();
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(anchor.x - 1, anchor.y + 10); ctx.lineTo(anchor.x - 22, anchor.y - 24); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(anchor.x + 1, anchor.y + 10); ctx.lineTo(anchor.x + 22, anchor.y - 24); ctx.stroke();

    for (var j = 0; j < blocks.length; j++){
      var b = blocks[j];
      ctx.fillStyle = 'rgba(120,140,170,.55)';
      ctx.strokeStyle = 'rgba(190,210,235,.35)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.rect(b.x, b.y, b.w, b.h);
      ctx.fill();
      ctx.stroke();
    }

    for (var i = 0; i < targets.length; i++){
      var t = targets[i];
      var col = t.type === 'armored' ? '#b8c7da' :
        t.type === 'moving' ? '#5eead4' :
        t.type === 'bonus' ? '#4ade80' :
        t.type === 'gold' ? '#fbbf24' :
        t.type === 'bomb' ? '#fb7185' :
        t.type === 'boss' ? '#f472b6' : '#ffcf6b';
      var pulse = 1 + Math.sin(performance.now() / 260 + t.spin) * .08;
      if (t.type === 'moving' || t.type === 'gold'){
        ctx.strokeStyle = t.type === 'gold' ? 'rgba(251,191,36,.22)' : 'rgba(94,234,212,.22)';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 5]);
        ctx.beginPath(); ctx.ellipse(t.bx, t.by, t.amp, t.amp * .55, 0, 0, 6.2832); ctx.stroke();
        ctx.setLineDash([]);
      }
      if (t.type === 'boss'){
        ctx.strokeStyle = 'rgba(244,114,182,.2)';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 8]);
        ctx.beginPath(); ctx.arc(t.bx, t.by, t.r + 22, 0, 6.2832); ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.shadowColor = col;
      ctx.shadowBlur = t.type === 'boss' ? 28 : 18;
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(t.x, t.y, t.r * pulse, 0, 6.2832); ctx.fill();
      ctx.shadowBlur = 0;

      if (t.type === 'armored'){
        ctx.strokeStyle = 'rgba(20,32,50,.9)';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(t.x, t.y, t.r * .62, 0, 6.2832); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,.55)';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(t.x, t.y, t.r * .78, 0, 6.2832); ctx.stroke();
        for (var hp = 0; hp < t.hp; hp++){
          ctx.fillStyle = '#ffe9b8';
          ctx.beginPath(); ctx.arc(t.x - 4 + hp * 8, t.y + t.r + 8, 2.2, 0, 6.2832); ctx.fill();
        }
      } else if (t.type === 'boss'){
        ctx.strokeStyle = 'rgba(20,10,24,.82)';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(t.x, t.y, t.r * .74, 0, 6.2832); ctx.stroke();
        ctx.fillStyle = 'rgba(20,10,24,.8)';
        ctx.beginPath(); ctx.arc(t.x - t.r * .26, t.y - t.r * .1, t.r * .13, 0, 6.2832); ctx.fill();
        ctx.beginPath(); ctx.arc(t.x + t.r * .26, t.y - t.r * .1, t.r * .13, 0, 6.2832); ctx.fill();
        ctx.strokeStyle = 'rgba(20,10,24,.72)';
        ctx.lineWidth = 2.4;
        ctx.beginPath(); ctx.arc(t.x, t.y + t.r * .06, t.r * .34, 0.16 * Math.PI, 0.84 * Math.PI); ctx.stroke();
        for (var bh = 0; bh < t.maxHp; bh++){
          ctx.fillStyle = bh < t.hp ? '#ffe9b8' : 'rgba(255,255,255,.18)';
          var bw2 = 5, gap2 = bw2 + 3;
          ctx.fillRect(t.x - (t.maxHp * gap2) / 2 + bh * gap2, t.y + t.r + 9, bw2, 3);
        }
      } else if (t.type === 'gold'){
        ctx.strokeStyle = 'rgba(120,70,4,.7)';
        ctx.lineWidth = 2.4;
        ctx.beginPath(); ctx.arc(t.x, t.y, t.r * .6, 0, 6.2832); ctx.stroke();
        ctx.fillStyle = 'rgba(255,251,220,.9)';
        ctx.beginPath();
        ctx.moveTo(t.x, t.y - t.r * .34);
        ctx.lineTo(t.x + t.r * .12, t.y - t.r * .08);
        ctx.lineTo(t.x + t.r * .36, t.y - t.r * .06);
        ctx.lineTo(t.x + t.r * .17, t.y + t.r * .12);
        ctx.lineTo(t.x + t.r * .24, t.y + t.r * .38);
        ctx.lineTo(t.x, t.y + t.r * .2);
        ctx.lineTo(t.x - t.r * .24, t.y + t.r * .38);
        ctx.lineTo(t.x - t.r * .17, t.y + t.r * .12);
        ctx.lineTo(t.x - t.r * .36, t.y - t.r * .06);
        ctx.lineTo(t.x - t.r * .12, t.y - t.r * .08);
        ctx.closePath(); ctx.fill();
      } else if (t.type === 'bomb'){
        ctx.strokeStyle = 'rgba(28,8,12,.85)';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(t.x, t.y, t.r * .5, 0, 6.2832); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(t.x - t.r * .26, t.y - t.r * .26); ctx.lineTo(t.x + t.r * .26, t.y + t.r * .26);
        ctx.moveTo(t.x + t.r * .26, t.y - t.r * .26); ctx.lineTo(t.x - t.r * .26, t.y + t.r * .26);
        ctx.stroke();
        var sparkA = performance.now() / 90;
        ctx.fillStyle = '#ffe9b8';
        ctx.beginPath();
        ctx.arc(t.x + Math.cos(sparkA) * t.r * .72, t.y + Math.sin(sparkA) * t.r * .72, 2.2, 0, 6.2832);
        ctx.fill();
      } else if (t.type === 'bonus'){
        ctx.strokeStyle = 'rgba(5,20,12,.75)';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(t.x - 4, t.y); ctx.lineTo(t.x + 4, t.y);
        ctx.moveTo(t.x, t.y - 4); ctx.lineTo(t.x, t.y + 4);
        ctx.stroke();
      } else {
        ctx.fillStyle = 'rgba(26,18,6,.8)';
        ctx.beginPath(); ctx.arc(t.x, t.y, t.r * .45, 0, 6.2832); ctx.fill();
      }
      if (t.flash > 0){
        ctx.strokeStyle = 'rgba(255,255,255,' + t.flash + ')';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(t.x, t.y, t.r + 6 * (1 - t.flash), 0, 6.2832); ctx.stroke();
      }
    }

    if (dragging){
      var pts = launchPreview();
      var gap = Math.min(1, Math.hypot(anchor.x - drag.x, anchor.y - drag.y) / FULL_PULL);
      var hue = 190 - gap * 160;
      ctx.fillStyle = 'hsla(' + hue + ',95%,72%,.6)';
      for (var p = 0; p < pts.length; p++){
        ctx.beginPath();
        ctx.arc(pts[p].x, pts[p].y, 1.6 + gap * 1.6, 0, 6.2832);
        ctx.fill();
      }
      ctx.strokeStyle = 'rgba(200,235,255,.55)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(anchor.x - 22, anchor.y - 24);
      ctx.lineTo(drag.x, drag.y);
      ctx.moveTo(anchor.x + 22, anchor.y - 24);
      ctx.lineTo(drag.x, drag.y);
      ctx.stroke();
      ctx.strokeStyle = 'hsla(' + hue + ',95%,68%,.9)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(anchor.x, anchor.y);
      ctx.lineTo(drag.x, drag.y);
      ctx.stroke();
    }

    for (var q = 0; q < parts.length; q++){
      var pt = parts[q];
      var al = Math.max(0, pt.life / pt.max);
      ctx.fillStyle = 'hsla(' + pt.hue + ',90%,70%,' + al + ')';
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 1.5 + al * 2.4, 0, 6.2832);
      ctx.fill();
    }

    for (var tr = 0; tr < trail.length; tr++){
      var tf = (tr + 1) / trail.length;
      ctx.fillStyle = 'hsla(190,95%,75%,' + (tf * .22) + ')';
      ctx.beginPath();
      ctx.arc(trail[tr].x, trail[tr].y, trail[tr].r * tf * .9, 0, 6.2832);
      ctx.fill();
    }

    function drawShot(x, y, r, hue){
      var g = ctx.createRadialGradient(x - r * .35, y - r * .35, r * .15, x, y, r);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(.4, 'hsl(' + hue + ',95%,72%)');
      g.addColorStop(1, 'hsl(' + hue + ',85%,40%)');
      ctx.shadowColor = 'hsla(' + hue + ',95%,65%,.9)';
      ctx.shadowBlur = r * 1.6;
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'hsla(' + hue + ',100%,85%,.85)';
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(x, y, r - 1.6, 0, 6.2832); ctx.stroke();
    }

    if (ball){
      drawShot(ball.x, ball.y, ball.r, ball.hue);
    } else if (state === 'aim'){
      drawShot(anchor.x, anchor.y, nextR, nextHue);
    }

    for (var fi = 0; fi < floats.length; fi++){
      var fl = floats[fi];
      var fa = Math.max(0, fl.life / fl.max);
      ctx.fillStyle = 'hsla(' + fl.hue + ',95%,74%,' + fa + ')';
      ctx.font = '700 ' + Math.round(14 + (1 - fa) * 7) + 'px system-ui,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(fl.text, fl.x, fl.y);
      ctx.textAlign = 'left';
    }

    ctx.restore();

    var bossT = null;
    for (var bi = 0; bi < targets.length; bi++){
      if (targets[bi].type === 'boss') bossT = targets[bi];
    }
    if (bossT){
      var barW = Math.min(360, W * 0.6), barH = 10;
      var barX = (W - barW) / 2, barY = H - 62;
      ctx.fillStyle = 'rgba(8,16,28,.8)';
      ctx.fillRect(barX - 2, barY - 2, barW + 4, barH + 4);
      ctx.fillStyle = 'rgba(255,255,255,.1)';
      ctx.fillRect(barX, barY, barW, barH);
      ctx.fillStyle = '#fb7185';
      ctx.fillRect(barX, barY, barW * Math.max(0, bossT.hp / bossT.maxHp), barH);
      ctx.fillStyle = '#ffe9b8';
      ctx.font = '600 12px system-ui,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('首领  ' + bossT.hp + ' / ' + bossT.maxHp, W / 2, barY - 7);
      ctx.textAlign = 'left';
    }
  }

  function frame(t){
    if (!last) last = t;
    var dt = Math.min(.033, (t - last) / 1000);
    last = t;
    updateTargets(dt);
    update(dt);
    updateParts(dt);
    updateFloats(dt);
    if (shake > 0) shake = Math.max(0, shake - dt * 2.6);
    if (state === 'aim' || state === 'fly') updateHud();
    draw();
    requestAnimationFrame(frame);
  }

  function menuCopy(m){
    if (m === 'daily'){
      var rec = progress.daily[String(dailySeed())];
      return '每日固定随机种子，所有人今天打的是同一组靶子。<br>一次挑战，看看今天的手感。<br>今日最佳：<b>' + (rec ? rec.best : 0) + '</b> 分。';
    }
    if (m === 'endless'){
      return '无尽模式一波接一波，每清空一波补给 3 颗弹丸（上限 12 颗）。<br>靶子会越来越密，首领每 10 波出现一次。<br>最高纪录：<b>' + (progress.endless || 0) + '</b> 波。';
    }
    return '30 关三章弹道挑战：普通靶一击即碎，钢环靶要打两次，浮游靶会移动，<br>绿色奖励靶补弹丸，金色靶加分，炸弹靶连锁引爆，每 10 关是首领战。<br>已收集 <b>' + totalStars() + '</b> / ' + (TOTAL_LEVELS * 3) + ' 颗星。';
  }

  function setMode(m){
    MODE = m;
    var btns = modesBox.querySelectorAll('button[data-mode]');
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('on', btns[i].dataset.mode === m);
    if (levelsBox) levelsBox.style.display = m === 'campaign' ? '' : 'none';
    ovSub.innerHTML = menuCopy(m);
    btn.textContent = m === 'campaign' ? '开始挑战' : (m === 'daily' ? '开始每日挑战' : '开始无尽模式');
    renderLevels();
  }

  modesBox.addEventListener('click', function(e){
    var b = e.target && e.target.closest ? e.target.closest('button[data-mode]') : null;
    if (!b) return;
    setMode(b.dataset.mode);
  });

  btn.addEventListener('click', function(){
    if (overAction === 'endless') beginLevel(1, 'endless');
    else if (overAction === 'daily') beginLevel(1, 'daily');
    else if (overAction === 'retry') beginLevel(level, MODE);
    else if (overAction === 'restart') beginLevel(1, 'campaign');
    else if (MODE === 'daily') beginLevel(1, 'daily');
    else if (MODE === 'endless') beginLevel(1, 'endless');
    else beginLevel(progress.unlocked, 'campaign');
  });
  menuBtn.addEventListener('click', function(){
    state = 'menu';
    ball = null;
    overAction = 'continue';
    ovTitle.textContent = '弹弓风暴';
    menuBtn.style.display = 'none';
    over.classList.remove('hide');
    setMode(MODE);
  });
  renderLevels();
  renderAch();
  setMode('campaign');
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
