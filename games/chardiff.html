<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070d18">
<title>汉字找茬 · 离线小游戏</title>
<style>
  :root{
    --text:#eaf2ff;--muted:#8ea3bd;--line:rgba(148,163,184,.16);
    --cyan:#38bdf8;--mint:#5eead4;--amber:#fbbf24;--rose:#fb7185;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:22px 16px 26px;color:var(--text);
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
    background:
      radial-gradient(900px 620px at 8% -6%, rgba(94,234,212,.11), transparent 62%),
      radial-gradient(760px 560px at 102% 104%, rgba(56,189,248,.13), transparent 62%),
      radial-gradient(720px 520px at 50% 48%, rgba(251,191,36,.07), transparent 68%),
      #070d18;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent;
  }
  button{font:inherit;color:inherit;}
  .app{width:min(100%,720px);display:flex;flex-direction:column;gap:15px;}

  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:13px;min-width:0;}
  .logo{
    width:54px;height:54px;flex:0 0 auto;border-radius:16px;display:grid;place-items:center;
    font-size:25px;font-weight:900;color:#04211d;
    background:linear-gradient(150deg,#6ee7b7,#0d9488 58%,#0f172a);
    box-shadow:0 12px 28px rgba(20,184,166,.24), inset 0 1px 0 rgba(255,255,255,.36);
  }
  h1{
    margin:0;font-size:clamp(22px,4.2vw,28px);font-weight:800;letter-spacing:.04em;
    background:linear-gradient(100deg,#f0f9ff,#a7f3d0 46%,#bae6fd);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brand p{margin:4px 0 0;font-size:12.5px;color:var(--muted);}
  .stats{display:flex;gap:8px;flex-wrap:wrap;}
  .stat{min-width:64px;padding:8px 11px;border-radius:13px;background:rgba(255,255,255,.045);border:1px solid var(--line);}
  .stat span{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.08em;}
  .stat b{display:block;margin-top:2px;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;}
  .stat b.hot{color:var(--amber);}

  .timebar{height:5px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;}
  .timebar i{display:block;height:100%;width:100%;border-radius:inherit;background:linear-gradient(90deg,#5eead4,#38bdf8 58%,#fbbf24);transition:width .12s linear,background .3s ease;}
  .timebar.low i{background:linear-gradient(90deg,#fb7185,#f97316);}

  .stage{display:flex;justify-content:center;padding:1px 0 2px;}
  .board-shell{
    width:min(84vw,470px);padding:clamp(8px,1.7vw,12px);border-radius:26px;position:relative;
    background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.022));
    border:1px solid rgba(255,255,255,.10);
    box-shadow:0 28px 70px rgba(0,0,0,.46), inset 0 1px 0 rgba(255,255,255,.10);
  }
  .board-shell::before{
    content:"";position:absolute;inset:-1px;border-radius:27px;pointer-events:none;
    background:linear-gradient(130deg,rgba(94,234,212,.34),transparent 34%,transparent 66%,rgba(56,189,248,.30));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;padding:1px;
  }
  .board{
    --fs:30px;position:relative;width:100%;aspect-ratio:1/1;border-radius:17px;overflow:hidden;
    display:grid;grid-template-columns:repeat(var(--n,5),1fr);grid-template-rows:repeat(var(--n,5),1fr);
    gap:clamp(2px,.55vw,5px);padding:clamp(5px,1.1vw,8px);
    background:
      radial-gradient(circle at 30% 16%, rgba(94,234,212,.07), transparent 58%),
      linear-gradient(160deg,#0b1a25,#071019 62%,#08131f);
    box-shadow:inset 0 0 0 1px rgba(148,163,184,.10), inset 0 18px 40px rgba(0,0,0,.32);
    touch-action:manipulation;user-select:none;
  }
  .cell{
    border:0;padding:0;border-radius:8px;cursor:pointer;position:relative;
    display:grid;place-items:center;font-size:var(--fs);line-height:1;font-weight:600;
    color:#dff3ff;background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
    box-shadow:inset 0 0 0 1px rgba(148,163,184,.075);
    transition:background .14s ease,transform .14s ease,box-shadow .14s ease,color .45s ease;
  }
  .cell:hover{background:rgba(94,234,212,.09);}
  .cell:active{transform:scale(.95);}
  .cell.found{
    background:linear-gradient(160deg,rgba(94,234,212,.55),rgba(56,189,248,.30));
    color:#04121f;box-shadow:0 0 20px rgba(94,234,212,.55),inset 0 0 0 1px rgba(255,255,255,.4);
  }
  .cell.wrong{animation:wrong .3s ease;background:rgba(251,113,133,.20);}
  @keyframes wrong{0%,100%{transform:translateX(0);}25%{transform:translateX(-3px);}75%{transform:translateX(3px);}}

  .panel{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .status{font-size:12.5px;color:var(--muted);min-height:22px;display:flex;align-items:center;gap:7px;}
  .status i{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 9px rgba(94,234,212,.7);}
  .actions{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{
    border:1px solid rgba(255,255,255,.11);border-radius:11px;padding:8px 13px;cursor:pointer;
    background:rgba(255,255,255,.055);color:#dbeafe;font-size:12.5px;font-weight:600;
    transition:background .16s ease,border-color .16s ease,transform .16s ease;
  }
  .btn:hover{background:rgba(255,255,255,.10);border-color:rgba(94,234,212,.4);transform:translateY(-1px);}
  .btn.primary{
    color:#04211d;border-color:transparent;
    background:linear-gradient(135deg,#6ee7b7,#38bdf8);
    box-shadow:0 8px 20px rgba(52,211,153,.24);
  }
  .foot{font-size:11.5px;color:#5f7286;letter-spacing:.03em;text-align:center;}

  .overlay{
    position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:18px;
    background:rgba(3,8,18,.76);backdrop-filter:blur(7px);border-radius:0;
  }
  .overlay.on{display:flex;animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .card{
    width:min(100%,330px);padding:24px 22px 20px;border-radius:22px;text-align:center;
    background:linear-gradient(180deg,rgba(12,33,32,.98),rgba(8,13,24,.98));
    border:1px solid rgba(94,234,212,.24);
    box-shadow:0 26px 70px rgba(0,0,0,.55), 0 0 44px rgba(94,234,212,.10);
  }
  .kicker{font-size:11.5px;letter-spacing:.22em;color:#6ee7b7;font-weight:700;}
  .card h2{
    margin:10px 0 6px;font-size:30px;font-weight:900;letter-spacing:.08em;
    background:linear-gradient(100deg,#ecfdf5,#6ee7b7,#bae6fd);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .card p{margin:0 0 16px;font-size:12.5px;line-height:1.7;color:var(--muted);}
  .res-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
  .res-grid div{padding:9px 8px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);}
  .res-grid span{display:block;font-size:10.5px;color:var(--muted);}
  .res-grid b{display:block;margin-top:2px;font-size:17px;font-variant-numeric:tabular-nums;}
  .card .btn.primary{width:100%;padding:11px 14px;font-size:13.5px;}
  .card .btn.ghost{width:100%;margin-top:8px;}

  .mode-note{color:#6ee7b7;font-weight:700;}
  .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:0 0 9px;}
  .mode{
    border:1px solid rgba(148,163,184,.18);border-radius:13px;padding:8px 10px;cursor:pointer;
    background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
    color:var(--text);text-align:left;transition:background .16s ease,border-color .16s ease,transform .16s ease;
  }
  .mode:hover{background:rgba(94,234,212,.10);border-color:rgba(94,234,212,.42);transform:translateY(-1px);}
  .mode strong{display:block;font-size:13px;font-weight:800;letter-spacing:.03em;color:#ecfeff;}
  .mode .m-tag{display:inline-block;margin-top:1px;font-size:10px;color:#6ee7b7;font-weight:700;letter-spacing:.06em;}
  .mode em{display:block;margin-top:3px;font-size:10.2px;line-height:1.4;color:var(--muted);font-style:normal;min-height:26px;}
  .mode i{display:block;margin-top:3px;font-size:10px;color:var(--amber);font-style:normal;}
  .menu-foot{font-size:11.5px;color:var(--muted);margin-bottom:1px;}
  .menu-foot b{color:#dff3ff;}
  .card{max-height:calc(100% - 6px);overflow:auto;scrollbar-width:thin;width:min(100%,398px);}
  .board.faded .cell:not(.found){color:rgba(223,243,255,.055);}
  .board.faded .cell.hint{color:#04121f;}
  .cell.warp{animation:warp .4s ease;}
  @keyframes warp{0%,100%{transform:scale(1);}45%{transform:scale(1.12);background:rgba(56,189,248,.28);box-shadow:0 0 22px rgba(56,189,248,.65);}}
  .cell.hint{animation:hint .52s ease;background:rgba(251,191,36,.28);box-shadow:0 0 24px rgba(251,191,36,.8);}
  @keyframes hint{0%,100%{transform:scale(1);}50%{transform:scale(1.14);}}
  #seen{font-size:15px;letter-spacing:.04em;}

  @media (max-width:620px){
    body{padding:14px 12px 18px;}
    .app{gap:12px;}
    .logo{width:46px;height:46px;border-radius:14px;font-size:21px;}
    .stat{min-width:56px;padding:7px 9px;}
    .stat b{font-size:15px;}
    .brand p{font-size:11.5px;}
    .board-shell{padding:7px;border-radius:20px;}
    .board{border-radius:14px;padding:5px;}
    .cell{border-radius:6px;}
    .overlay{position:fixed;inset:0;z-index:80;border-radius:0;padding:16px;}
    .card{padding:20px 18px 16px;}
    .card h2{font-size:27px;}
  }
  @media (max-height:730px) and (min-width:700px){
    .board-shell{width:min(70vh,470px);}
    .brand p{display:none;}
    .foot{display:none;}
  }
</style>
</head>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo">字</div>
      <div>
        <h1>汉字找茬</h1>
        <p><span class="mode-note" id="modeNote">经典模式</span> · 满屏相同的字里，藏着一个不一样的</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span>得分</span><b id="score">0</b></div>
      <div class="stat"><span id="timeLabel">时间</span><b id="time">60.0</b></div>
      <div class="stat"><span>连击</span><b id="combo" class="hot">0</b></div>
      <div class="stat"><span id="seenLabel">进度</span><b id="seen" class="hot">0 / 338</b></div>
      <div class="stat"><span>最佳</span><b id="best">—</b></div>
    </div>
  </div>

  <div class="timebar" id="timebar"><i id="timefill"></i></div>

  <div class="stage">
    <div class="board-shell">
      <div class="board" id="board" aria-label="汉字找茬棋盘">
        <div class="overlay on" id="overlay"><div class="card" id="ovCard"></div></div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="status" id="status"><i></i><span>点错扣 3 秒，连击越高分越多</span></div>
    <div class="actions">
      <button class="btn" id="hint">提示</button>
      <button class="btn" id="skip">跳过</button>
      <button class="btn" id="pause">暂停</button>
      <button class="btn" id="restart">重开</button>
    </div>
  </div>
  <p class="foot">六种模式 · 空格暂停 · H 提示 · 支持鼠标和触屏</p>

    warp: {
      name: '瞬移', tag: '会跑的字', desc: '异类字每 2.6 秒换一个位置',
      hint: '异类字会换位置，看准了再点',
      time: 60000, wrong: 3000, bonus: 500, baseN: 5, maxN: 6, growEvery: 3,
      oddCount: 1, scoreBase: 12, scoreCombo: 2, warpInterval: 2600, hintCost: 4000,
      bestKey: 'tx_chardiff_best_warp_v1'
    }
  };
  var MODE_ORDER = ['classic', 'rush', 'survival', 'phantom', 'twin', 'warp'];

  var SEEN_KEY = 'tx_chardiff_seen_v1';
  var seenSet = {};
  var seenCount = 0;
  function loadSeen() {
    try {
      var raw = localStorage.getItem(SEEN_KEY);
      if (!raw) return;
      var arr = JSON.parse(raw);
      if (!arr || !arr.length) return;
      for (var i = 0; i < arr.length; i++) {
        var k = arr[i];
        if (typeof k === 'number' && k >= 0 && k < PAIRS.length && !seenSet[k]) {
          seenSet[k] = 1;
          seenCount++;
        }
      }
    } catch (e) {}
  }
  function saveSeen() {
    try {
      var arr = [];
      for (var k in seenSet) {
        if (seenSet.hasOwnProperty(k)) arr.push(Number(k));
      }
      localStorage.setItem(SEEN_KEY, JSON.stringify(arr));
    } catch (e) {}
  }
  function markSeen(i) {
    if (typeof i !== 'number' || seenSet[i]) return;
    seenSet[i] = 1;
    seenCount++;
    saveSeen();
  }

  var board = document.getElementById('board');
  var scoreEl = document.getElementById('score');
  var timeEl = document.getElementById('time');
  var timeLabel = document.getElementById('timeLabel');
  var comboEl = document.getElementById('combo');
  var bestEl = document.getElementById('best');
  var seenEl = document.getElementById('seen');
  var seenLabel = document.getElementById('seenLabel');
  var modeNote = document.getElementById('modeNote');
  var timeFill = document.getElementById('timefill');
  var timebar = document.getElementById('timebar');
  var overlay = document.getElementById('overlay');
  var ovCard = document.getElementById('ovCard');
  var statusEl = document.getElementById('status');
  var hintBtn = document.getElementById('hint');
  var pauseBtn = document.getElementById('pause');
  var restartBtn = document.getElementById('restart');
  var skipBtn = document.getElementById('skip');

  var score = 0, combo = 0, maxCombo = 0, found = 0;
  var bestByMode = {};
  var mode = 'classic';
  var modeCfg = MODE_DEFS.classic;
  var totalMs = 60000, left = 60000, boardLeft = 0;
  var lives = 3, boardNo = 0, skips = 0;
  var lastTs = 0, timerId = 0;
  var running = false, paused = false, over = false, locked = false;
  var oddIndices = [], baseChar = '', oddChar = '';
  var curPid = -1, lastPid = -1;
  var fadeTimer = 0, warpTimer = 0;

  function loadBests() {
    for (var i = 0; i < MODE_ORDER.length; i++) {
      var key = MODE_ORDER[i];
      var cfg = MODE_DEFS[key];
      var val = 0;
      try { val = parseInt(localStorage.getItem(cfg.bestKey) || '0', 10) || 0; } catch (e) {}
      if (key === 'classic' && !val) {
        try { val = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; } catch (e) {}
      }
      bestByMode[key] = val;
    }
  }

  function saveBest(key, value) {
    bestByMode[key] = value;
    try { localStorage.setItem(MODE_DEFS[key].bestKey, String(value)); } catch (e) {}
  }

  function fmt(ms) {
    var s = Math.max(0, ms / 1000);
    return s.toFixed(1);
  }

  function setStatus(text) {
    statusEl.querySelector('span').textContent = text;
  }

  function hearts() {
    var s = '';
    for (var i = 0; i < lives; i++) { s += '♥ '; }
    return s.replace(/\s+$/, '') || '—';
  }

  function updateModeChrome() {
    modeNote.textContent = modeCfg.name + '模式';
    timeLabel.textContent = mode === 'survival' ? '本盘' : '时间';
    seenLabel.textContent = mode === 'survival' ? '生命' : '进度';
  }

  function updateHud() {
    scoreEl.textContent = String(score);
    comboEl.textContent = String(combo);
    bestEl.textContent = (bestByMode[mode] || 0) > 0 ? String(bestByMode[mode]) : '—';
    var remain, span;
    if (mode === 'survival') {
      remain = boardLeft;
      span = totalMs;
      seenEl.textContent = lives > 0 ? hearts() : '—';
    } else {
      remain = left;
      span = totalMs;
      seenEl.textContent = seenCount + ' / ' + PAIRS.length;
    }
    timeEl.textContent = fmt(remain);
    var pct = span > 0 ? Math.max(0, Math.min(100, remain / span * 100)) : 0;
    timeFill.style.width = pct + '%';
    timebar.classList.toggle('low', remain <= span * 0.25);
  }

  function layoutFont() {
    if (!board) return;
    var n = board.dataset.n ? parseInt(board.dataset.n, 10) : 5;
    var w = board.clientWidth || 320;
    var gap = Math.max(2, w * 0.008);
    var cell = (w - gap * (n - 1)) / n;
    board.style.setProperty('--fs', Math.max(13, Math.floor(cell * 0.56)) + 'px');
  }

  function pickPair() {
    var all = [], unseen = [], i;
    for (i = 0; i < PAIRS.length; i++) {
      all.push(i);
      if (!seenSet[i] && i !== lastPid) unseen.push(i);
    }
    var pool = unseen;
    if (!pool.length) {
      for (i = 0; i < all.length; i++) {
        if (all[i] !== lastPid) pool.push(all[i]);
      }
    }
    if (!pool.length) pool = all;
    var pid = pool[Math.floor(Math.random() * pool.length)];
    lastPid = pid;
    return pid;
  }

  function newBoard() {
    if (!board) return;
    var cfg = modeCfg;
    var n = Math.min(cfg.maxN, cfg.baseN + Math.floor(found / cfg.growEvery));
    boardNo += 1;
    curPid = pickPair();
    var pair = PAIRS[curPid];
    if (Math.random() < 0.5) { baseChar = pair[0]; oddChar = pair[1]; }
    else { baseChar = pair[1]; oddChar = pair[0]; }

    var count = n * n;
    var oddCount = Math.min(cfg.oddCount || 1, count - 1);
    oddIndices = [];
    while (oddIndices.length < oddCount) {
      var idx = Math.floor(Math.random() * count);
      if (oddIndices.indexOf(idx) < 0) oddIndices.push(idx);
    }
    locked = false;
    board.classList.remove('faded');
    board.dataset.n = String(n);
    board.style.setProperty('--n', String(n));

    var html = '';
    for (var i = 0; i < count; i++) {
      var ch = oddIndices.indexOf(i) >= 0 ? oddChar : baseChar;
      html += '<button type="button" class="cell" data-i="' + i + '">' + ch + '</button>';
    }
    var ov = overlay;
    board.innerHTML = html;
    overlay = ov;
    board.appendChild(overlay);

    var cells = board.querySelectorAll('.cell');
    for (var k = 0; k < cells.length; k++) {
      cells[k].addEventListener('click', onCellClick);
    }
    layoutFont();

    if (mode === 'phantom') { fadeTimer = cfg.fadeDelay; }
    if (mode === 'warp') { warpTimer = cfg.warpInterval; }
    if (mode === 'survival') {
      totalMs = Math.max(cfg.boardMsMin, cfg.boardMs - Math.floor((boardNo - 1) / 2) * 350);
      boardLeft = totalMs;
    } else {
      totalMs = cfg.time;
    }

    updateHud();
    setStatus('第 ' + boardNo + ' 关 · ' + n + ' × ' + n + (oddCount > 1 ? ' · 找齐 ' + oddCount + ' 个' : ''));
  }

  function onCellClick(e) {
    e.preventDefault();
    if (!running || paused || over || locked) return;
    if (this.classList.contains('found')) return;
    var cfg = modeCfg;
    var i = parseInt(this.dataset.i, 10);
    var hitAt = oddIndices.indexOf(i);

    if (hitAt >= 0) {
      var gain = cfg.scoreBase + combo * cfg.scoreCombo;
      this.classList.add('found');
      oddIndices.splice(hitAt, 1);
      score += gain;
      combo += 1;
      if (combo > maxCombo) maxCombo = combo;
      found += 1;
      markSeen(curPid);
      if (mode === 'survival') {
        boardLeft = Math.min(totalMs, boardLeft + (cfg.bonus || 0));
      } else {
        left = Math.min(totalMs, left + (cfg.bonus || 0));
      }
      updateHud();
      var bonusText = cfg.bonus ? ' · +' + (cfg.bonus / 1000).toFixed(1) + 's' : '';
      if (oddIndices.length === 0) {
        locked = true;
        setStatus('找到了 · +' + gain + bonusText);
        setTimeout(function () { if (!over) newBoard(); }, 230);
      } else {
        setStatus('找到了 · +' + gain + bonusText + ' · 还剩 ' + oddIndices.length + ' 个');
      }
    } else {
      var cell = this;
      combo = 0;
      cell.classList.remove('wrong');
      void cell.offsetWidth;
      cell.classList.add('wrong');
      setTimeout(function () { cell.classList.remove('wrong'); }, 320);
      if (mode === 'survival') {
        loseLife('wrong');
        return;
      }
      left = Math.max(0, left - cfg.wrong);
      updateHud();
      setStatus('看仔细一点 · -' + (cfg.wrong / 1000) + ' 秒');
      if (left <= 0) finish();
    }
  }

  function useHint() {
    if (!running || paused || over || locked || !oddIndices.length) return;
    var cfg = modeCfg;
    var cost = cfg.hintCost || 5000;
    if (mode === 'survival') {
      if (boardLeft <= cost) { setStatus('时间不够使用提示了'); return; }
      boardLeft -= cost;
    } else {
      if (left <= cost) { setStatus('时间不够使用提示了'); return; }
      left -= cost;
    }
    var idx = oddIndices[0];
    var cell = board.querySelector('.cell[data-i="' + idx + '"]');
    if (cell) {
      cell.classList.remove('hint');
      void cell.offsetWidth;
      cell.classList.add('hint');
      setTimeout(function () { cell.classList.remove('hint'); }, 540);
    }
    updateHud();
    setStatus('提示 · -' + (cost / 1000).toFixed(1) + ' 秒');
  }

  function skip() {
    if (!running || paused || over || locked) return;
    skips += 1;
    if (mode === 'survival') { loseLife('skip'); return; }
    locked = true;
    setStatus('已跳过 · 不扣分也不加分');
    setTimeout(function () { if (!over) newBoard(); }, 120);
  }

  function loseLife(reason) {
    if (over) return;
    lives -= 1;
    combo = 0;
    locked = true;
    if (lives <= 0) {
      lives = 0;
      updateHud();
      finish();
      return;
    }
    updateHud();
    if (reason === 'timeout') { setStatus('本盘超时 · 剩余 ' + lives + ' 条命'); }
    else if (reason === 'skip') { setStatus('跳过本盘 · 剩余 ' + lives + ' 条命'); }
    else { setStatus('点错了 · 剩余 ' + lives + ' 条命'); }
    setTimeout(function () { if (!over) newBoard(); }, 420);
  }

  function warpOdd() {
    if (!running || paused || over || locked || oddIndices.length !== 1) return;
    var n = parseInt(board.dataset.n, 10) || 5;
    var total = n * n;
    var from = oddIndices[0];
    var to = from;
    while (to === from) { to = Math.floor(Math.random() * total); }
    var cells = board.querySelectorAll('.cell');
    var a = cells[from], b = cells[to];
    if (!a || !b) return;
    a.textContent = baseChar;
    b.textContent = oddChar;
    oddIndices[0] = to;
    a.classList.remove('warp', 'hint');
    b.classList.remove('warp', 'hint');
    void b.offsetWidth;
    b.classList.add('warp');
    setTimeout(function () { b.classList.remove('warp'); }, 420);
    setStatus('异类字换位置了');
  }

  function updateModeTimers(dt) {
    if (mode === 'phantom' && fadeTimer > 0) {
      fadeTimer -= dt;
      if (fadeTimer <= 0) {
        fadeTimer = 0;
        board.classList.add('faded');
        setStatus('字形已淡出 · 凭记忆找');
      }
    }
    if (mode === 'warp' && warpTimer > 0) {
      warpTimer -= dt;
      if (warpTimer <= 0) {
        warpTimer = modeCfg.warpInterval;
        warpOdd();
      }
    }
  }

  function tick() {
    var now = Date.now();
    if (!lastTs) lastTs = now;
    var dt = now - lastTs;
    lastTs = now;
    if (dt < 0) { dt = 0; }
    if (dt > 250) { dt = 250; }
    if (running && !paused && !over && !locked) {
      if (mode === 'survival') {
        boardLeft -= dt;
        if (boardLeft <= 0) {
          boardLeft = 0;
          updateHud();
          loseLife('timeout');
        } else {
          updateHud();
        }
      } else {
        left -= dt;
        if (left <= 0) {
          left = 0;
          updateHud();
          finish();
        } else {
          updateHud();
        }
      }
      if (!locked) { updateModeTimers(dt); }
    }
  }

  function start(modeKey) {
    if (modeKey && MODE_DEFS[modeKey]) { mode = modeKey; }
    modeCfg = MODE_DEFS[mode];
    score = 0; combo = 0; maxCombo = 0; found = 0;
    boardNo = 0; skips = 0;
    lives = modeCfg.lives || 3;
    over = false; paused = false; running = true; locked = false;
    lastTs = 0; fadeTimer = 0; warpTimer = 0;
    if (modeCfg.time) {
      totalMs = modeCfg.time;
      left = totalMs;
      boardLeft = 0;
    } else {
      totalMs = modeCfg.boardMs;
      left = 0;
      boardLeft = totalMs;
    }
    overlay.classList.remove('on');
    pauseBtn.textContent = '暂停';
    updateModeChrome();
    updateHud();
    newBoard();
    if (!timerId) { timerId = setInterval(tick, 100); }
  }

  function finish() {
    if (over) return;
    over = true; running = false; paused = false; locked = true;
    var prevBest = bestByMode[mode] || 0;
    if (score > prevBest) { saveBest(mode, score); }
    bestEl.textContent = (bestByMode[mode] || 0) > 0 ? String(bestByMode[mode]) : '—';
    setStatus('本局结束');

    var extraStat = mode === 'survival'
      ? '<div><span>存活关卡</span><b>' + boardNo + '</b></div>'
      : '<div><span>跳过次数</span><b>' + skips + '</b></div>';

    ovCard.innerHTML =
      '<div class="kicker">' + modeCfg.name + '模式结束</div>' +
      '<h2>' + (mode === 'survival' ? '生命耗尽' : '时间到') + '</h2>' +
      '<p>' + modeCfg.desc + '</p>' +
      '<div class="res-grid">' +
        '<div><span>本局得分</span><b>' + score + '</b></div>' +
        '<div><span>找到字数</span><b>' + found + '</b></div>' +
        '<div><span>最高连击</span><b>' + maxCombo + '</b></div>' +
        '<div><span>累计进度</span><b>' + seenCount + ' / ' + PAIRS.length + '</b></div>' +
        extraStat +
        '<div><span>本模式最佳</span><b>' + ((bestByMode[mode] || 0) > 0 ? bestByMode[mode] : '—') + '</b></div>' +
      '</div>' +
      '<button type="button" class="btn primary" id="again">再来一局</button>' +
      '<button type="button" class="btn ghost" id="menuBtn">换个模式</button>';
    overlay.classList.add('on');
    ovCard.querySelector('#again').addEventListener('click', function () { start(mode); });
    ovCard.querySelector('#menuBtn').addEventListener('click', showStart);
  }

  function showStart() {
    over = false; running = false; paused = false; locked = false;
    pauseBtn.textContent = '暂停';
    board.classList.remove('faded');
    score = 0; combo = 0; found = 0; boardNo = 0; lives = 0; skips = 0;
    if (modeCfg.time) { totalMs = modeCfg.time; left = totalMs; boardLeft = 0; }
    else { totalMs = modeCfg.boardMs; left = 0; boardLeft = totalMs; }
    overlay.classList.add('on');

    var html = '<div class="kicker">选择模式</div>' +
      '<h2>汉字找茬</h2>' +
      '<p>六种找法，同一套形近字题库。选一个模式开始。</p>' +
      '<div class="mode-grid">';
    for (var i = 0; i < MODE_ORDER.length; i++) {
      var key = MODE_ORDER[i];
      var cfg = MODE_DEFS[key];
      var best = bestByMode[key] || 0;
      html += '<button type="button" class="mode" data-mode="' + key + '">' +
        '<strong>' + cfg.name + '</strong>' +
        '<span class="m-tag">' + cfg.tag + '</span>' +
        '<em>' + cfg.desc + '</em>' +
        '<i>最佳 ' + (best > 0 ? best : '—') + '</i>' +
      '</button>';
    }
    html += '</div>' +
      '<div class="menu-foot">已找出 <b>' + seenCount + ' / ' + PAIRS.length + '</b> 组形近字 · 提示会消耗时间</div>';
    ovCard.innerHTML = html;

    var btns = ovCard.querySelectorAll('.mode');
    for (var k = 0; k < btns.length; k++) {
      btns[k].addEventListener('click', function () { start(this.dataset.mode); });
    }
    updateModeChrome();
    updateHud();
    modeNote.textContent = '选择模式';
    timeLabel.textContent = '时间';
    seenLabel.textContent = '进度';
    timeEl.textContent = '—';
    seenEl.textContent = seenCount + ' / ' + PAIRS.length;
    timeFill.style.width = '100%';
    timebar.classList.remove('low');
  }

  function togglePause() {
    if (!running || over) return;
    paused = !paused;
    pauseBtn.textContent = paused ? '继续' : '暂停';
    if (paused) {
      ovCard.innerHTML =
        '<div class="kicker">PAUSED</div>' +
        '<h2>已暂停</h2>' +
        '<p>' + modeCfg.name + '模式 · 计时已经停住。</p>' +
        '<button type="button" class="btn primary" id="resume">继续游戏</button>' +
        '<button type="button" class="btn ghost" id="quit">重新开始</button>' +
        '<button type="button" class="btn ghost" id="menuBtn">返回模式选择</button>';
      overlay.classList.add('on');
      ovCard.querySelector('#resume').addEventListener('click', togglePause);
      ovCard.querySelector('#quit').addEventListener('click', function () { start(mode); });
      ovCard.querySelector('#menuBtn').addEventListener('click', showStart);
    } else {
      overlay.classList.remove('on');
    }
  }

  board.addEventListener('click', function (e) {
    if (e.target === overlay) e.stopPropagation();
  });
  hintBtn.addEventListener('click', function () { useHint(); this.blur(); });
  pauseBtn.addEventListener('click', function () { togglePause(); this.blur(); });
  restartBtn.addEventListener('click', function () { start(mode); this.blur(); });
  skipBtn.addEventListener('click', function () { skip(); this.blur(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === ' ') { e.preventDefault(); togglePause(); }
    if (e.key.toLowerCase() === 'r') start(mode);
    if (e.key.toLowerCase() === 'h') useHint();
    if (e.key === 'Escape' && running) showStart();
  });
  window.addEventListener('resize', layoutFont);

  loadBests();
  board.innerHTML = '';
  board.appendChild(overlay);
  showStart();
  timerId = setInterval(tick, 100);
})();
</script>
</body>
</html>
