<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070d18">
<title>看图猜成语 · 离线小游戏</title>
<style>
  :root{
    --text:#eaf2ff;--muted:#8ea3bd;--line:rgba(148,163,184,.16);
    --cyan:#38bdf8;--violet:#818cf8;--pink:#f472b6;--mint:#5eead4;--amber:#fbbf24;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:22px 16px 26px;color:var(--text);
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
    background:
      radial-gradient(900px 620px at 8% -6%, rgba(129,140,248,.14), transparent 62%),
      radial-gradient(760px 560px at 102% 104%, rgba(244,114,182,.12), transparent 62%),
      radial-gradient(720px 520px at 50% 48%, rgba(56,189,248,.08), transparent 68%),
      #070d18;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent;
  }
  button{font:inherit;color:inherit;}
  .app{width:min(100%,680px);display:flex;flex-direction:column;gap:15px;}

  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:13px;min-width:0;}
  .logo{
    width:54px;height:54px;flex:0 0 auto;border-radius:16px;display:grid;place-items:center;
    font-size:26px;font-weight:900;color:#1e1035;
    background:linear-gradient(150deg,#c4b5fd,#818cf8 56%,#db2777);
    box-shadow:0 12px 28px rgba(129,140,248,.26), inset 0 1px 0 rgba(255,255,255,.42);
  }
  h1{
    margin:0;font-size:clamp(22px,4.2vw,28px);font-weight:800;letter-spacing:.06em;
    background:linear-gradient(100deg,#f5f3ff,#c4b5fd 46%,#f9a8d4);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brand p{margin:4px 0 0;font-size:12.5px;color:var(--muted);}
  .stats{display:flex;gap:8px;flex-wrap:wrap;}
  .stat{min-width:62px;padding:8px 11px;border-radius:13px;background:rgba(255,255,255,.045);border:1px solid var(--line);}
  .stat span{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.08em;}
  .stat b{display:block;margin-top:2px;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;}
  .stat b.hot{color:var(--amber);}
  .stat b.bank{color:var(--mint);font-size:15px;}

  .stage{display:flex;justify-content:center;padding:1px 0 2px;}
  .quiz-shell{
    width:min(100%,600px);padding:clamp(8px,1.7vw,13px);border-radius:26px;position:relative;
    background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.022));
    border:1px solid rgba(255,255,255,.10);
    box-shadow:0 28px 70px rgba(0,0,0,.46), inset 0 1px 0 rgba(255,255,255,.10);
  }
  .quiz-shell::before{
    content:"";position:absolute;inset:-1px;border-radius:27px;pointer-events:none;
    background:linear-gradient(130deg,rgba(129,140,248,.36),transparent 34%,transparent 66%,rgba(244,114,182,.30));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;padding:1px;
  }
  .quiz{
    position:relative;width:100%;border-radius:17px;overflow:hidden;padding:clamp(14px,2.4vw,20px);
    background:
      radial-gradient(circle at 28% 12%, rgba(129,140,248,.10), transparent 58%),
      linear-gradient(160deg,#0d1226,#080c18 60%,#0b1020);
    box-shadow:inset 0 0 0 1px rgba(148,163,184,.10), inset 0 18px 40px rgba(0,0,0,.30);
    touch-action:manipulation;user-select:none;
  }
  .qtop{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .qno{font-size:11.5px;color:#aab9d4;letter-spacing:.10em;font-weight:700;white-space:nowrap;}
  .qbar{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;}
  .qbar i{display:block;height:100%;width:100%;border-radius:inherit;background:linear-gradient(90deg,#818cf8,#38bdf8,#f472b6);transition:width .1s linear;}
  .qsec{font-size:11.5px;color:#aab9d4;font-variant-numeric:tabular-nums;min-width:28px;text-align:right;}

  .pic{
    min-height:clamp(120px,24vh,190px);border-radius:16px;display:flex;align-items:center;justify-content:center;
    gap:clamp(6px,2vw,18px);flex-wrap:wrap;padding:14px;
    background:
      radial-gradient(circle at 50% 30%, rgba(255,255,255,.06), transparent 62%),
      linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
    border:1px solid rgba(255,255,255,.075);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
    margin-bottom:14px;
  }
  .pic span{
    font-size:clamp(34px,8.4vw,64px);line-height:1;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35));
    animation:picIn .38s cubic-bezier(.2,.8,.2,1) backwards;
  }
  .pic span:nth-child(2){animation-delay:.05s;}
  .pic span:nth-child(3){animation-delay:.10s;}
  .pic span:nth-child(4){animation-delay:.15s;}
  .pic span:nth-child(5){animation-delay:.20s;}
  @keyframes picIn{from{opacity:0;transform:translateY(8px) scale(.9);}to{opacity:1;transform:none;}}

  .hintbar{
    display:none;gap:8px;align-items:flex-start;margin:-4px 0 12px;padding:10px 12px;border-radius:12px;
    font-size:12.5px;line-height:1.65;color:#ffeab6;
    background:linear-gradient(160deg,rgba(251,191,36,.16),rgba(251,191,36,.04));
    border:1px solid rgba(251,191,36,.32);
  }
  .hintbar.on{display:flex;animation:fadeIn .22s ease;}
  .hintbar b{flex:0 0 auto;color:var(--amber);letter-spacing:.08em;font-size:11.5px;padding-top:1px;}

  .options{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .opt{
    position:relative;border:1px solid rgba(255,255,255,.10);border-radius:13px;padding:12px 10px 12px 30px;
    background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.020));
    color:#e8eeff;font-size:clamp(13px,1.9vw,15px);font-weight:700;letter-spacing:.05em;text-align:left;
    cursor:pointer;transition:background .16s ease,border-color .16s ease,transform .16s ease;
  }
  .opt:hover{background:rgba(129,140,248,.12);border-color:rgba(129,140,248,.42);}
  .opt .k{
    position:absolute;left:9px;top:50%;transform:translateY(-50%);
    width:16px;height:16px;border-radius:5px;display:grid;place-items:center;
    font-size:9.5px;font-weight:800;color:#aab9d4;background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.10);
  }
  .opt.correct{
    background:linear-gradient(160deg,rgba(94,234,212,.24),rgba(52,211,153,.08));
    border-color:rgba(94,234,212,.60);color:#d9fff7;
  }
  .opt.wrong{
    background:linear-gradient(160deg,rgba(251,113,133,.22),rgba(190,18,60,.08));
    border-color:rgba(251,113,133,.58);color:#ffe3e8;
  }
  .opt.dim{opacity:.55;}
  .opt:disabled{cursor:default;}

  .fillwrap{display:none;}
  .fillwrap.on{display:block;animation:fadeIn .2s ease;}
  .slots{display:flex;justify-content:center;gap:clamp(7px,1.8vw,12px);margin:2px 0 12px;}
  .slot{
    width:clamp(46px,9.4vw,58px);height:clamp(52px,10.4vw,64px);border-radius:13px;text-align:center;
    font-family:inherit;font-size:clamp(22px,4.4vw,30px);font-weight:800;color:#f4f7ff;
    background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.025));
    border:1px solid rgba(255,255,255,.14);outline:none;caret-color:var(--pink);
    transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;
    user-select:text;
  }
  .slot:focus{border-color:rgba(244,114,182,.72);background:rgba(244,114,182,.10);box-shadow:0 0 0 3px rgba(244,114,182,.15);}
  .slot.ok{border-color:rgba(94,234,212,.72);color:#d9fff7;background:linear-gradient(160deg,rgba(94,234,212,.24),rgba(52,211,153,.08));}
  .slot.bad{border-color:rgba(251,113,133,.62);color:#ffe3e8;background:linear-gradient(160deg,rgba(251,113,133,.20),rgba(190,18,60,.07));}
  .slot:disabled{cursor:default;}
  .slots.shake{animation:slotShake .32s ease;}
  @keyframes slotShake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-5px);}
    55%{transform:translateX(5px);}
    80%{transform:translateX(-3px);}
  }
  .fillbar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
  .fillbar .btn.primary{width:auto;padding:9px 18px;font-size:13px;}
  .fillmsg{font-size:12.5px;font-weight:700;color:#ffd6ea;min-height:18px;}
  .fillmsg.warn{color:#fda4af;}
  .fillmsg.hit{color:#6ee7b7;}
  .guess-log{display:flex;flex-direction:column;gap:3px;width:100%;max-width:340px;margin:8px auto 0;padding:0 2px;min-height:0;max-height:58px;overflow:hidden;}
  .guess-log div{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:#7d90a8;letter-spacing:.06em;}
  .guess-log b{color:#c4b5fd;font-variant-numeric:tabular-nums;font-weight:700;}

  .pop{
    position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.9);z-index:6;
    padding:8px 16px;border-radius:999px;font-size:14px;font-weight:800;pointer-events:none;
    color:#052018;background:linear-gradient(135deg,#6ee7b7,#38bdf8);
    box-shadow:0 10px 28px rgba(56,189,248,.35);opacity:0;
  }
  .pop.on{animation:popShow .9s ease forwards;}
  @keyframes popShow{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.8);}
    18%{opacity:1;transform:translate(-50%,-50%) scale(1.05);}
    72%{opacity:1;transform:translate(-50%,-70%) scale(1);}
    100%{opacity:0;transform:translate(-50%,-95%) scale(.95);}
  }

  .panel{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .status{font-size:12.5px;color:var(--muted);min-height:22px;display:flex;align-items:center;gap:7px;}
  .status i{width:8px;height:8px;border-radius:50%;background:var(--violet);box-shadow:0 0 9px rgba(129,140,248,.7);}
  .actions{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{
    border:1px solid rgba(255,255,255,.11);border-radius:11px;padding:8px 13px;cursor:pointer;
    background:rgba(255,255,255,.055);color:#dbeafe;font-size:12.5px;font-weight:600;
    transition:background .16s ease,border-color .16s ease,transform .16s ease;
  }
  .btn:hover{background:rgba(255,255,255,.10);border-color:rgba(129,140,248,.45);transform:translateY(-1px);}
  .btn:disabled{opacity:.45;cursor:default;transform:none;background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.08);}
  .btn.primary{
    color:#1e1035;border-color:transparent;
    background:linear-gradient(135deg,#c4b5fd,#818cf8 55%,#f472b6);
    box-shadow:0 8px 20px rgba(129,140,248,.26);
  }
  .foot{font-size:11.5px;color:#5f7286;letter-spacing:.03em;text-align:center;}

  .overlay{
    position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:20px;
    background:rgba(3,8,18,.82);backdrop-filter:blur(8px);border-radius:0;
    overflow-y:auto;overscroll-behavior:contain;
  }
  .overlay .card{margin:auto;}
  .overlay.on{display:flex;animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .card{
    width:min(100%,340px);padding:24px 22px 20px;border-radius:22px;text-align:center;
    background:linear-gradient(180deg,rgba(22,20,44,.98),rgba(9,10,22,.98));
    border:1px solid rgba(129,140,248,.28);
    box-shadow:0 26px 70px rgba(0,0,0,.55), 0 0 44px rgba(129,140,248,.10);
  }
  .kicker{font-size:11.5px;letter-spacing:.22em;color:#c4b5fd;font-weight:700;}
  .card h2{
    margin:10px 0 6px;font-size:30px;font-weight:900;letter-spacing:.10em;
    background:linear-gradient(100deg,#f5f3ff,#c4b5fd,#f9a8d4);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .card p{margin:0 0 16px;font-size:12.5px;line-height:1.7;color:var(--muted);}
  .res-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
  .res-grid div{padding:9px 8px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);}
  .res-grid span{display:block;font-size:10.5px;color:var(--muted);}
  .res-grid b{display:block;margin-top:2px;font-size:17px;font-variant-numeric:tabular-nums;}
  .lv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:0 0 12px;}
  .lv-card{
    padding:9px 4px 8px;border-radius:12px;cursor:pointer;text-align:center;
    border:1px solid var(--line);background:rgba(255,255,255,.045);
    transition:border-color .16s ease,background .16s ease,transform .16s ease;
  }
  .lv-card:hover{transform:translateY(-1px);border-color:rgba(129,140,248,.46);}
  .lv-card b{display:block;font-size:13.5px;font-weight:800;letter-spacing:.10em;}
  .lv-card span{display:block;margin-top:2px;font-size:9.5px;color:var(--muted);}
  .lv-card i{display:block;margin-top:2px;font-size:9.5px;font-style:normal;color:#7d90a8;font-variant-numeric:tabular-nums;}
  .lv-card.on{
    border-color:rgba(244,114,182,.62);
    background:linear-gradient(160deg,rgba(244,114,182,.20),rgba(129,140,248,.10));
    box-shadow:0 0 0 1px rgba(244,114,182,.18),0 12px 26px -16px rgba(244,114,182,.8);
  }
  .lv-card.on b{color:#ffd6ea;}
  .lv-card.on i{color:#f9a8d4;}
  .sp-card{
    width:100%;display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:10px 12px;
    border-radius:13px;cursor:pointer;text-align:left;
    border:1px solid rgba(94,234,212,.26);
    background:linear-gradient(120deg,rgba(94,234,212,.12),rgba(56,189,248,.055));
    transition:border-color .16s ease,background .16s ease,transform .16s ease,box-shadow .16s ease;
  }
  .sp-card:hover{transform:translateY(-1px);border-color:rgba(94,234,212,.5);}
  .sp-card.on{
    border-color:rgba(94,234,212,.72);
    background:linear-gradient(120deg,rgba(94,234,212,.22),rgba(56,189,248,.10));
    box-shadow:0 0 0 1px rgba(94,234,212,.20),0 12px 26px -16px rgba(94,234,212,.85);
  }
  .sp-k{
    flex:0 0 auto;padding:4px 7px;border-radius:7px;font-size:10px;font-weight:800;letter-spacing:.14em;
    color:#052018;background:linear-gradient(135deg,#6ee7b7,#38bdf8);
  }
  .sp-t{flex:1;min-width:0;}
  .sp-t b{display:block;font-size:13.5px;letter-spacing:.08em;}
  .sp-t i{display:block;margin-top:2px;font-size:10px;font-style:normal;color:var(--muted);}
  .sp-n{flex:0 0 auto;font-size:10.5px;color:#7d90a8;font-variant-numeric:tabular-nums;}
  .sp-card.on .sp-n{color:#6ee7b7;}
  .card .btn.primary{width:100%;padding:11px 14px;font-size:13.5px;}

  @media (max-width:620px){
    body{padding:14px 12px 18px;}
    .app{gap:12px;}
    .logo{width:46px;height:46px;border-radius:14px;font-size:22px;}
    .stat{min-width:54px;padding:7px 9px;}
    .stat b{font-size:15px;}
    .stat b.bank{font-size:13px;}
    .brand p{font-size:11.5px;}
    .quiz-shell{padding:7px;border-radius:20px;}
    .quiz{border-radius:14px;padding:12px;}
    .pic{border-radius:13px;}
    .opt{padding:11px 8px 11px 25px;border-radius:11px;}
    .overlay{position:fixed;inset:0;z-index:80;border-radius:0;padding:16px;}
    .card{padding:20px 18px 16px;}
    .card h2{font-size:27px;}
  }
  @media (max-height:730px) and (min-width:700px){
    .quiz-shell{width:min(100%,560px);}
    .pic{min-height:120px;}
    .brand p{display:none;}
    .foot{display:none;}
  }
</style>
<style id="tx-aurora-skin">
/* tx-aurora-skin:idiom */
:root{--tx-a1:#f472b6;--tx-a2:#818cf8;}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
::selection{background:rgba(244,114,182,0.38);color:#fff}
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:rgba(244,114,182,0.26);border-radius:99px;border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:rgba(244,114,182,0.46);background-clip:content-box}
body{background-color:#070d18!important;background-image:radial-gradient(1100px 640px at 6% -12%, rgba(244,114,182,0.16), transparent 62%), radial-gradient(900px 680px at 104% 112%, rgba(129,140,248,0.12), transparent 62%)!important}
button{transition:transform .14s ease,filter .16s ease,box-shadow .2s ease,border-color .16s ease,background-color .16s ease}
button:hover{filter:brightness(1.07)}
button:active{transform:translateY(1px) scale(.995)}
button:focus-visible{outline:2px solid rgba(244,114,182,0.72);outline-offset:2px}
.overlay,.modal,.dialog,.sheet,#levels,#loading{background-image:radial-gradient(900px 520px at 50% 0%,rgba(244,114,182,0.15),transparent 62%),radial-gradient(720px 520px at 50% 100%,rgba(129,140,248,0.08),transparent 60%)!important}
.overlay,.modal,.dialog,.sheet{backdrop-filter:blur(9px) saturate(1.1)}
.overlay h1,.modal h1,.screen h1,.overlay-card h1,.win-card h1,.result-card h1,.bcard .btitle,.loadcard .ltitle{text-shadow:0 2px 30px rgba(244,114,182,0.45)}
.overlay .screen,.overlay .panel,.overlay-card,.modal .panel,.win-card,.result-card,.bcard,.loadcard,.rules-dialog,.panel{box-shadow:0 38px 96px -34px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.07)!important}
.bcard,.loadcard{border-color:rgba(244,114,182,0.34)!important}
.overlay .panel,.overlay-card,.win-card,.result-card,.modal .panel{backdrop-filter:blur(10px) saturate(1.08);border-color:rgba(244,114,182,0.26)!important}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo">猜</div>
      <div>
        <h1>看图猜成语</h1>
        <p>根据图中的提示，选出对应的四字成语</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span>得分</span><b id="score">0</b></div>
      <div class="stat"><span>连对</span><b id="combo" class="hot">0</b></div>
      <div class="stat"><span>本局</span><b id="progress">0 / 10</b></div>
      <div class="stat"><span>学会</span><b id="bank" class="bank">0 / 0</b></div>
      <div class="stat"><span>最佳</span><b id="best">—</b></div>
    </div>
  </div>

  <div class="stage">
    <div class="quiz-shell">
      <div class="quiz" id="quiz">
        <div class="qtop">
          <span class="qno" id="qno">入门 · 第 1 题</span>
          <div class="qbar"><i id="qfill"></i></div>
          <span class="qsec" id="qsec">18s</span>
        </div>
        <div class="pic" id="pic"></div>
        <div class="hintbar" id="hintbar"></div>
        <div class="options" id="options"></div>
        <div class="fillwrap" id="fillwrap">
          <div class="slots" id="slots">
            <input class="slot" type="text" maxlength="1" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="第 1 个字">
            <input class="slot" type="text" maxlength="1" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="第 2 个字">
            <input class="slot" type="text" maxlength="1" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="第 3 个字">
            <input class="slot" type="text" maxlength="1" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="第 4 个字">
          </div>
          <div class="fillbar">
            <button type="button" class="btn primary" id="submitFill">提交答案</button>
            <span class="fillmsg" id="fillMsg"></span>
          </div>
          <div class="guess-log" id="guessLog"></div>
        </div>
        <div class="pop" id="pop"></div>
        <div class="overlay on" id="overlay"><div class="card" id="ovCard"></div></div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="status" id="status"><i></i><span>三档难度 · 入门 18 秒 / 进阶 14 秒 / 挑战 11 秒</span></div>
    <div class="actions">
      <button class="btn" id="hintBtn">提示 · -20</button>
      <button class="btn" id="restart">重新开始</button>
    </div>
  </div>
  <p class="foot" id="foot">题库加载中…</p>
</div>

<script>
(function () {

  function loadSeen() {
    var raw = '';
    try { raw = localStorage.getItem(SEEN_KEY) || ''; } catch (e) { return {}; }
    if (!raw) return {};
    var obj = null;
    try { obj = JSON.parse(raw); } catch (e2) { obj = null; }
    if (!obj || typeof obj !== 'object') return {};
    return obj;
  }

  function saveSeen() {
    try { localStorage.setItem(SEEN_KEY, JSON.stringify(seenMap)); } catch (e) {}
  }

  seenMap = loadSeen();

  function loadBestMap() {
    var raw = '';
    try { raw = localStorage.getItem(BEST_KEY) || ''; } catch (e) { return {}; }
    if (!raw) return {};
    var obj = null;
    try { obj = JSON.parse(raw); } catch (e2) { obj = null; }
    return (obj && typeof obj === 'object') ? obj : {};
  }

  function bestFor(lv) {
    var map = loadBestMap();
    if (map[lv] != null) return parseInt(map[lv], 10) || 0;
    if (lv === 1) {
      try { return parseInt(localStorage.getItem(OLD_BEST_KEY) || '0', 10) || 0; } catch (e) {}
    }
    return 0;
  }

  function saveBest(lv, val) {
    var map = loadBestMap();
    if (val <= (parseInt(map[lv], 10) || 0)) return;
    map[lv] = val;
    try { localStorage.setItem(BEST_KEY, JSON.stringify(map)); } catch (e) {}
  }

  function poolFor(lv) {
    var pool = [], i;
    for (i = 0; i < DATA.length; i++) {
      if ((DATA[i].lv || 1) === lv) pool.push(DATA[i]);
    }
    return pool;
  }

  function solvedCount(lv) {
    var n = 0, i;
    for (i = 0; i < DATA.length; i++) {
      if ((DATA[i].lv || 1) === lv && seenMap[DATA[i].a] === 1) n++;
    }
    return n;
  }

  function solvedAll() {
    var n = 0, i;
    for (i = 0; i < DATA.length; i++) {
      if (seenMap[DATA[i].a] === 1) n++;
    }
    return n;
  }

  function bestKey() { return special ? 'special' : level; }
  function modeName() { return special ? '特殊关卡' : LEVELS[level].name; }
  function currentPool() { return special ? DATA : poolFor(level); }

  best = bestFor(bestKey());

  function roundTotal() {
    return queue.length > 0 ? queue.length : TOTAL_Q;
  }

  function refreshBank() {
    var total = currentPool().length;
    var done = special ? solvedAll() : solvedCount(level);
    bankEl.textContent = done + ' / ' + total;
    footEl.textContent = '题库 ' + DATA.length + ' 条 · ' + modeName() + ' 已学会 ' +
      done + ' / ' + total + ' · ' +
      (special ? '四个空格逐字猜，回车提交，H 用提示' : '键盘 1–4 选答，H 用提示');
  }

  function markSeen(answer, ok) {
    if (ok) seenMap[answer] = 1;
    else if (seenMap[answer] !== 1) seenMap[answer] = 0;
    saveSeen();
    refreshBank();
  }

  bestEl.textContent = best > 0 ? best : '—';
  scoreEl.textContent = '0';
  progressEl.textContent = '0 / ' + TOTAL_Q;
  comboEl.textContent = '0';
  refreshBank();

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function setStatus(t) { statusEl.querySelector('span').textContent = t; }

  function buildQueue() {
    var all = currentPool();
    var fresh = [], review = [], i;
    for (i = 0; i < all.length; i++) {
      if (seenMap[all[i].a] === 1) review.push(all[i]);
      else fresh.push(all[i]);
    }
    shuffle(fresh);
    shuffle(review);
    var pool = fresh.concat(review);
    queue = pool.slice(0, Math.min(TOTAL_Q, pool.length));
  }

  function optionList(answer) {
    var pool = poolFor(level);
    var opts = [answer];
    var guard = 0;
    while (opts.length < 4 && guard++ < 400) {
      var cand = pool[Math.floor(Math.random() * pool.length)].a;
      if (opts.indexOf(cand) < 0) opts.push(cand);
    }
    return shuffle(opts);
  }

  function hintText(q) {
    if (q.hint && typeof q.hint === 'string') return q.hint;
    return '首字是「' + q.a.charAt(0) + '」，共四个字，把画面里每个图形各想成一个字。';
  }

    tries = 0;
    guessLog = [];
    fillMsgEl.textContent = '';
    fillMsgEl.className = 'fillmsg';
    guessLogEl.innerHTML = '';
    submitFillBtn.disabled = false;
    slotsWrap.classList.remove('shake');
    for (var i = 0; i < slotEls.length; i++) {
      slotEls[i].value = '';
      slotEls[i].className = 'slot';
      slotEls[i].disabled = false;
    }
  }

  function focusFirstSlot() {
    if (window.matchMedia && window.matchMedia('(pointer: fine)').matches) {
      try { slotEls[0].focus({ preventScroll: true }); } catch (e) { try { slotEls[0].focus(); } catch (e2) {} }
    }
  }

  function renderGuessLog() {
    guessLogEl.innerHTML = '';
    for (var i = Math.max(0, guessLog.length - 4); i < guessLog.length; i++) {
      var row = document.createElement('div');
      var g = document.createElement('span');
      var n = document.createElement('b');
      g.textContent = guessLog[i].g;
      n.textContent = guessLog[i].h + ' 个对';
      row.appendChild(g);
      row.appendChild(n);
      guessLogEl.appendChild(row);
    }
  }

  function resetHint() {
    hintShown = false;
    hintBar.classList.remove('on');
    hintBar.innerHTML = '';
    hintBtn.disabled = false;
    hintBtn.textContent = '提示 · -' + hintCost;
  }

  function showHint() {
    if (!playing || locked || hintShown) return;
    var q = queue[qi];
    if (!q) return;
    hintShown = true;
    hintsUsed++;
    score = Math.max(0, score - hintCost);
    scoreEl.textContent = String(score);
    hintBar.innerHTML = '<b>提示</b><span></span>';
    hintBar.querySelector('span').textContent = hintText(q);
    hintBar.classList.add('on');
    hintBtn.disabled = true;
    hintBtn.textContent = '已用提示 · -' + hintCost;
    setStatus('用了提示 · 扣 ' + hintCost + ' 分');
  }

  function showQuestion() {
    if (qi >= queue.length) { finish(); return; }
    var q = queue[qi];
    locked = false;
    resetHint();
    picEl.innerHTML = '';
    var tokens = q.pic.trim().split(/\s+/);
    tokens.forEach(function (t) {
      var s = document.createElement('span');
      s.textContent = t;
      picEl.appendChild(s);
    });
    optionsEl.innerHTML = '';
    if (special) {
      optionsEl.style.display = 'none';
      fillWrap.classList.add('on');
      resetFillBoard();
      focusFirstSlot();
    } else {
      optionsEl.style.display = '';
      fillWrap.classList.remove('on');
      var opts = optionList(q.a);
      opts.forEach(function (text, i) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'opt';
        b.dataset.a = text;
        b.innerHTML = '<span class="k">' + (i + 1) + '</span>' + text;
        b.addEventListener('click', function () { answer(this, text); });
        optionsEl.appendChild(b);
      });
    }
    qnoEl.textContent = modeName() + ' · 第 ' + (qi + 1) + ' 题';
    progressEl.textContent = (qi + 1) + ' / ' + roundTotal();
    qsecEl.textContent = limit + 's';
    qfill.style.width = '100%';
    qStart = Date.now();
    clearInterval(timerId);
    timerId = setInterval(tick, 100);
    setStatus(special ? '按图猜出四个字 · 填满后回车提交' : modeName() + ' · 选一个最贴切的成语');
  }

  function tick() {
    if (locked || !playing) return;
    var left = limit - (Date.now() - qStart) / 1000;
    if (left <= 0) {
      qfill.style.width = '0%';
      qsecEl.textContent = '0s';
      if (special) specialTimeout();
      else answer(null, null, true);
      return;
    }
    qfill.style.width = Math.max(0, left / limit * 100) + '%';
    qsecEl.textContent = Math.ceil(left) + 's';
  }

  function answer(btn, text, timeout) {
    if (locked) return;
    locked = true;
    clearInterval(timerId);
    hintBtn.disabled = true;
    var q = queue[qi];
    var opts = optionsEl.querySelectorAll('.opt');
    for (var i = 0; i < opts.length; i++) {
      if (opts[i].dataset.a === q.a) opts[i].classList.add('correct');
      else if (opts[i] !== btn) opts[i].classList.add('dim');
    }
    if (timeout) {
      combo = 0;
      comboEl.textContent = '0';
      markSeen(q.a, false);
      setStatus('时间到 · 正确答案是「' + q.a + '」');
      showPop('时间到', false);
    } else if (text === q.a) {
      var left = Math.max(0, limit - (Date.now() - qStart) / 1000);
      var gain = 100 + Math.round(left) * 5 + combo * 15;
      score += gain;
      combo++;
      correctCount++;
      scoreEl.textContent = String(score);
      comboEl.textContent = String(combo);
      markSeen(q.a, true);
      setStatus('答对了 · +' + gain);
      showPop('+' + gain, true);
    } else {
      combo = 0;
      comboEl.textContent = '0';
      btn.classList.add('wrong');
      markSeen(q.a, false);
      setStatus('答错了 · 正确答案是「' + q.a + '」');
      showPop('答错了', false);
    }
    qi++;
    progressEl.textContent = qi + ' / ' + roundTotal();
    clearTimeout(advanceTimer);
    advanceTimer = setTimeout(next, 1150);
  }

  function submitFill() {
    if (!special || locked || !playing) return;
    if (document.activeElement && document.activeElement.isComposing) return;
    var q = queue[qi];
    if (!q) return;
    var guess = '', i;
    for (i = 0; i < slotEls.length; i++) guess += (slotEls[i].value || '').trim();
    if (Array.from(guess).length !== 4) {
      fillMsgEl.textContent = '请先把四个字填满';
      fillMsgEl.className = 'fillmsg warn';
      return;
    }
    var hit = 0;
    for (i = 0; i < 4; i++) if (guess.charAt(i) === q.a.charAt(i)) hit++;
    tries++;
    guessLog.push({ g: guess, h: hit });
    renderGuessLog();
    if (hit === 4) {
      specialCorrect(q);
      return;
    }
    score = Math.max(0, score - 5);
    scoreEl.textContent = String(score);
    fillMsgEl.textContent = hit === 0 ? '四个字都没对上' : '其中 ' + hit + ' 个字是对的';
    fillMsgEl.className = 'fillmsg warn';
    slotsWrap.classList.remove('shake');
    void slotsWrap.offsetWidth;
    slotsWrap.classList.add('shake');
    for (i = 0; i < slotEls.length; i++) slotEls[i].value = '';
    if (window.matchMedia && window.matchMedia('(pointer: fine)').matches) slotEls[0].focus();
  }

  function specialCorrect(q) {
    locked = true;
    clearInterval(timerId);
    hintBtn.disabled = true;
    submitFillBtn.disabled = true;
    for (var i = 0; i < slotEls.length; i++) {
      slotEls[i].value = q.a.charAt(i);
      slotEls[i].className = 'slot ok';
      slotEls[i].disabled = true;
    }
    fillMsgEl.textContent = '四个字全对！';
    fillMsgEl.className = 'fillmsg hit';
    var left = Math.max(0, limit - (Date.now() - qStart) / 1000);
    var gain = Math.max(40, 100 + Math.round(left) * 5 + combo * 15 - 5 * Math.max(0, tries - 1));
    score += gain;
    combo++;
    correctCount++;
    scoreEl.textContent = String(score);
    comboEl.textContent = String(combo);
    markSeen(q.a, true);
    setStatus('答对了 · +' + gain);
    showPop('+' + gain, true);
    qi++;
    progressEl.textContent = qi + ' / ' + roundTotal();
    clearTimeout(advanceTimer);
    advanceTimer = setTimeout(next, 1600);
  }

  function specialTimeout() {
    if (locked) return;
    locked = true;
    clearInterval(timerId);
    hintBtn.disabled = true;
    submitFillBtn.disabled = true;
    var q = queue[qi];
    if (!q) return;
    for (var i = 0; i < slotEls.length; i++) {
      slotEls[i].value = q.a.charAt(i);
      slotEls[i].className = 'slot bad';
      slotEls[i].disabled = true;
    }
    fillMsgEl.textContent = '时间到，正确答案已显示';
    fillMsgEl.className = 'fillmsg warn';
    combo = 0;
    comboEl.textContent = '0';
    markSeen(q.a, false);
    setStatus('时间到 · 正确答案是「' + q.a + '」');
    showPop('时间到', false);
    qi++;
    progressEl.textContent = qi + ' / ' + roundTotal();
    clearTimeout(advanceTimer);
    advanceTimer = setTimeout(next, 1600);
  }

  function next() {
    if (!playing) return;
    if (qi >= queue.length) finish();
    else showQuestion();
  }

  function showPop(text, good) {
    popEl.textContent = text;
    popEl.style.background = good
      ? 'linear-gradient(135deg,#6ee7b7,#38bdf8)'
      : 'linear-gradient(135deg,#fda4af,#fb7185)';
    popEl.style.color = good ? '#052018' : '#2a0710';
    popEl.classList.remove('on');
    void popEl.offsetWidth;
    popEl.classList.add('on');
  }

  function finish() {
    playing = false;
    clearInterval(timerId);
    clearTimeout(advanceTimer);
    locked = true;
    hintBtn.disabled = true;
    var total = roundTotal();
    var isBest = score > bestFor(bestKey());
    if (isBest) saveBest(bestKey(), score);
    best = bestFor(bestKey());
    bestEl.textContent = best > 0 ? best : '—';
    setStatus(modeName() + ' 本局结束');
    var title = correctCount >= 8 ? '成语高手' : correctCount >= 5 ? '再接再厉' : '再来一局';
    var bankDone = special ? solvedAll() : solvedCount(level);
    var bankTotal = currentPool().length;
    ovCard.innerHTML =
      '<div class="kicker">' + modeName() + ' · ROUND OVER</div>' +
      '<h2>' + title + '</h2>' +
      '<p>答对 ' + correctCount + ' / ' + total + ' 题，' +
        (isBest ? '刷新了本档最佳。' : '继续熟悉这些成语吧。') +
        '本档已学会 ' + bankDone + ' / ' + bankTotal + ' 条。</p>' +
      '<div class="res-grid">' +
        '<div><span>本局得分</span><b>' + score + '</b></div>' +
        '<div><span>答对题数</span><b>' + correctCount + ' / ' + total + '</b></div>' +
        '<div><span>用了提示</span><b>' + hintsUsed + ' 次</b></div>' +
        '<div><span>本档最佳</span><b>' + (best > 0 ? best : '—') + '</b></div>' +
      '</div>' +
      '<button type="button" class="btn primary" id="again">再来一局</button>';
    overlay.classList.add('on');
    ovCard.querySelector('#again').addEventListener('click', start);
  }

  function applyMode() {
    limit = special ? 45 : LEVELS[level].time;
    hintCost = special ? 30 : LEVELS[level].cost;
    best = bestFor(bestKey());
    bestEl.textContent = best > 0 ? best : '—';
    hintBtn.textContent = '提示 · -' + hintCost;
    refreshBank();
  }

  function showStart() {
    hintBtn.disabled = true;
    overlay.classList.add('on');
    overlay.scrollTop = 0;
    var lvHtml = '', i, id, L, n, b;
    for (i = 0; i < 3; i++) {
      id = i + 1;
      L = LEVELS[id];
      n = poolFor(id).length;
      b = bestFor(id);
      lvHtml += '<button type="button" class="lv-card' + (!special && id === level ? ' on' : '') + '" data-lv="' + id + '">' +
        '<b>' + L.name + '</b>' +
        '<span>' + L.sub + '</span>' +
        '<i>' + n + ' 题' + (b > 0 ? ' · ' + b + ' 分' : '') + '</i>' +
        '</button>';
    }
    var spBest = bestFor('special');
    ovCard.innerHTML =
      '<div class="kicker">题库 ' + DATA.length + ' 条 · 三档难度 + 特殊关卡</div>' +
      '<h2>看图猜成语</h2>' +
      '<p>' + (special
        ? '特殊关卡不给选项：看图把四个字填进空格，提交后会告诉你对了几个字。'
        : '选好难度再开始。从四个选项里挑出对应的成语，答得越快、连对越多，分数越高。') + '</p>' +
      '<div class="lv-grid">' + lvHtml + '</div>' +
      '<button type="button" class="sp-card' + (special ? ' on' : '') + '" id="spCard">' +
        '<span class="sp-k">特殊</span>' +
        '<span class="sp-t"><b>特殊关卡</b><i>不给选项 · 四个空格 · 逐字猜</i></span>' +
        '<span class="sp-n">' + DATA.length + ' 题' + (spBest > 0 ? ' · ' + spBest + ' 分' : '') + '</span>' +
      '</button>' +
      '<div class="res-grid">' +
        '<div><span>本档题数</span><b>' + currentPool().length + ' 题</b></div>' +
        '<div><span>本档最佳</span><b>' + (bestFor(bestKey()) > 0 ? bestFor(bestKey()) : '—') + '</b></div>' +
        '<div><span>每题时间</span><b>' + limit + ' 秒</b></div>' +
        '<div><span>提示扣分</span><b>-' + hintCost + '</b></div>' +
      '</div>' +
      '<button type="button" class="btn primary" id="startBtn">开始挑战</button>';
    var cards = ovCard.querySelectorAll('.lv-card');
    for (i = 0; i < cards.length; i++) {
      cards[i].addEventListener('click', function () {
        special = false;
        level = parseInt(this.dataset.lv, 10) || 1;
        applyMode();
        showStart();
      });
    }
    ovCard.querySelector('#spCard').addEventListener('click', function () {
      special = true;
      applyMode();
      showStart();
    });
    ovCard.querySelector('#startBtn').addEventListener('click', start);
  }

  function start() {
    clearInterval(timerId);
    clearTimeout(advanceTimer);
    applyMode();
    buildQueue();
    qi = 0; score = 0; combo = 0; correctCount = 0; hintsUsed = 0;
    scoreEl.textContent = '0';
    comboEl.textContent = '0';
    progressEl.textContent = '0 / ' + roundTotal();
    overlay.classList.remove('on');
    overlay.scrollTop = 0;
    playing = true;
    locked = false;
    setStatus('每题 ' + limit + ' 秒，答得越快分越高');
    showQuestion();
  }

  document.getElementById('restart').addEventListener('click', function () { start(); this.blur(); });
  hintBtn.addEventListener('click', function () { showHint(); this.blur(); });

  for (var si = 0; si < slotEls.length; si++) {
    (function (idx) {
      var el = slotEls[idx];
      el.addEventListener('input', function () {
        var cs = Array.from(el.value || '');
        if (cs.length > 1) el.value = cs[cs.length - 1];
        if (el.value && idx < slotEls.length - 1) slotEls[idx + 1].focus();
        if (fillMsgEl.className.indexOf('warn') >= 0) {
          fillMsgEl.textContent = '';
          fillMsgEl.className = 'fillmsg';
        }
      });
      el.addEventListener('keydown', function (e) {
        if (e.isComposing) return;
        if (e.key === 'Backspace' && !el.value && idx > 0) {
          e.preventDefault();
          slotEls[idx - 1].value = '';
          slotEls[idx - 1].focus();
        } else if (e.key === 'Enter') {
          e.preventDefault();
          submitFill();
        }
      });
      el.addEventListener('paste', function (e) {
        var txt = (e.clipboardData || window.clipboardData).getData('text') || '';
        var chars = Array.from(txt.replace(/\s+/g, '')).slice(0, 4);
        if (!chars.length) return;
        e.preventDefault();
        for (var ci = 0; ci < chars.length; ci++) {
          if (slotEls[ci]) slotEls[ci].value = chars[ci];
        }
        slotEls[Math.min(chars.length, slotEls.length - 1)].focus();
      });
    })(si);
  }
  submitFillBtn.addEventListener('click', function () { submitFill(); this.blur(); });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      if (overlay.classList.contains('on') && !playing) {
        e.preventDefault();
        var b = ovCard.querySelector('#startBtn, #again');
        if (b) b.click();
      }
      return;
    }
    if (!playing || locked) return;
    var k = e.key;
    var inSlot = e.target && e.target.classList && e.target.classList.contains('slot');
    if (special) {
      if (k === 'Enter' && !inSlot) { e.preventDefault(); submitFill(); }
      else if ((k === 'h' || k === 'H') && !inSlot) { e.preventDefault(); showHint(); }
      return;
    }
    if (k === 'h' || k === 'H') {
      e.preventDefault();
      showHint();
      return;
    }
    var n = parseInt(k, 10);
    if (n >= 1 && n <= 4) {
      e.preventDefault();
      var b2 = optionsEl.querySelectorAll('.opt')[n - 1];
      if (b2) b2.click();
    }
  });

  showStart();
})();
</script>
</body>
</html>
