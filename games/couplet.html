<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>对联配对 · 离线小游戏</title>
<style>
  :root{
    --text:#eaf2ff;--muted:#8ea3bd;--line:rgba(148,163,184,.16);
    --gold:#fbbf24;--rose:#fb7185;--mint:#5eead4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:22px 16px 26px;color:var(--text);
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
    background:
      radial-gradient(900px 620px at 8% -6%, rgba(251,191,36,.10), transparent 62%),
      radial-gradient(760px 560px at 102% 104%, rgba(251,113,133,.12), transparent 62%),
      radial-gradient(720px 520px at 50% 48%, rgba(148,163,184,.08), transparent 68%),
      #070d18;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent;
  }
  button{font:inherit;color:inherit;}
  .app{width:min(100%,760px);display:flex;flex-direction:column;gap:15px;}

  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:13px;min-width:0;}
  .logo{
    width:54px;height:54px;flex:0 0 auto;border-radius:16px;display:grid;place-items:center;
    font-size:26px;font-weight:900;color:#2a1206;
    background:linear-gradient(150deg,#fde68a,#f59e0b 56%,#9a3412);
    box-shadow:0 12px 28px rgba(245,158,11,.26), inset 0 1px 0 rgba(255,255,255,.42);
  }
  h1{
    margin:0;font-size:clamp(22px,4.2vw,28px);font-weight:800;letter-spacing:.06em;
    background:linear-gradient(100deg,#fffbeb,#fcd34d 46%,#fda4af);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brand p{margin:4px 0 0;font-size:12.5px;color:var(--muted);}
  .stats{display:flex;gap:8px;flex-wrap:wrap;}
  .stat{min-width:64px;padding:8px 11px;border-radius:13px;background:rgba(255,255,255,.045);border:1px solid var(--line);}
  .stat span{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.08em;}
  .stat b{display:block;margin-top:2px;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;}
  .stat b.gold{color:var(--gold);}

  .stage{display:flex;justify-content:center;padding:1px 0 2px;}
  .board-shell{
    width:min(100%,650px);padding:clamp(8px,1.7vw,13px);border-radius:26px;position:relative;
    background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.022));
    border:1px solid rgba(255,255,255,.10);
    box-shadow:0 28px 70px rgba(0,0,0,.46), inset 0 1px 0 rgba(255,255,255,.10);
  }
  .board-shell::before{
    content:"";position:absolute;inset:-1px;border-radius:27px;pointer-events:none;
    background:linear-gradient(130deg,rgba(251,191,36,.34),transparent 34%,transparent 66%,rgba(251,113,133,.28));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;padding:1px;
  }
  .board{
    position:relative;width:100%;border-radius:17px;overflow:hidden;padding:clamp(10px,2vw,16px);
    background:
      radial-gradient(circle at 18% 10%, rgba(251,191,36,.07), transparent 58%),
      linear-gradient(160deg,#1b130c,#0d0b0a 58%,#12100c);
    box-shadow:inset 0 0 0 1px rgba(148,163,184,.10), inset 0 18px 40px rgba(0,0,0,.30);
    touch-action:manipulation;user-select:none;
  }
  .heads{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:9px;}
  .heads div{display:flex;align-items:center;justify-content:center;gap:7px;font-size:11.5px;letter-spacing:.18em;color:#b9a88e;font-weight:700;}
  .heads div::before,.heads div::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,rgba(251,191,36,.28));}
  .heads div:last-child::before{background:linear-gradient(90deg,rgba(251,113,133,.28),transparent);}
  .heads div:last-child::after{background:linear-gradient(90deg,transparent,rgba(251,113,133,.28));}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .col{display:flex;flex-direction:column;gap:8px;}
  .line{
    width:100%;min-height:clamp(46px,7.2vh,58px);padding:8px 10px;border-radius:12px;cursor:pointer;
    border:1px solid rgba(255,255,255,.09);
    background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.020));
    color:#f2e9dc;font-size:clamp(13px,1.65vw,15.5px);line-height:1.5;letter-spacing:.10em;
    display:flex;align-items:center;justify-content:center;text-align:center;
    transition:background .16s ease,border-color .16s ease,transform .16s ease,color .16s ease;
  }
  .line:hover{background:rgba(251,191,36,.09);border-color:rgba(251,191,36,.30);}
  .line.sel{
    background:linear-gradient(160deg,rgba(251,191,36,.28),rgba(251,113,133,.14));
    border-color:rgba(251,191,36,.65);color:#fff7e6;transform:translateY(-1px);
    box-shadow:0 8px 20px rgba(251,191,36,.12), inset 0 0 0 1px rgba(251,191,36,.12);
  }
  .line.matched{
    background:linear-gradient(160deg,rgba(94,234,212,.17),rgba(52,211,153,.07));
    border-color:rgba(94,234,212,.42);color:#c9fff4;cursor:default;
    box-shadow:inset 0 0 0 1px rgba(94,234,212,.10);
  }
  .line.matched::after{content:"✓";margin-left:7px;font-size:11px;color:#5eead4;letter-spacing:0;}
  .line.wrong{animation:wrong .3s ease;border-color:rgba(251,113,133,.6);background:rgba(251,113,133,.15);}
  @keyframes wrong{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
  .line.hint{animation:hintPulse 1.1s ease-in-out 2;}
  @keyframes hintPulse{0%,100%{box-shadow:none;}50%{box-shadow:0 0 0 2px rgba(251,191,36,.45),0 0 18px rgba(251,191,36,.20);}}

  .panel{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .status{font-size:12.5px;color:var(--muted);min-height:22px;display:flex;align-items:center;gap:7px;}
  .status i{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 9px rgba(251,191,36,.65);}
  .actions{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{
    border:1px solid rgba(255,255,255,.11);border-radius:11px;padding:8px 13px;cursor:pointer;
    background:rgba(255,255,255,.055);color:#dbeafe;font-size:12.5px;font-weight:600;
    transition:background .16s ease,border-color .16s ease,transform .16s ease;
  }
  .btn:hover{background:rgba(255,255,255,.10);border-color:rgba(251,191,36,.4);transform:translateY(-1px);}
  .btn.primary{
    color:#2a1206;border-color:transparent;
    background:linear-gradient(135deg,#fde68a,#f59e0b);
    box-shadow:0 8px 20px rgba(245,158,11,.24);
  }
  .foot{font-size:11.5px;color:#5f7286;letter-spacing:.03em;text-align:center;}

  .overlay{
    position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;padding:18px;
    background:rgba(3,8,18,.78);backdrop-filter:blur(7px);border-radius:17px;
  }
  .overlay.on{display:flex;animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .card{
    width:min(100%,340px);padding:24px 22px 20px;border-radius:22px;text-align:center;
    background:linear-gradient(180deg,rgba(35,24,12,.98),rgba(10,12,20,.98));
    border:1px solid rgba(251,191,36,.26);
    box-shadow:0 26px 70px rgba(0,0,0,.55), 0 0 44px rgba(251,191,36,.10);
  }
  .kicker{font-size:11.5px;letter-spacing:.22em;color:#fcd34d;font-weight:700;}
  .card h2{
    margin:10px 0 6px;font-size:30px;font-weight:900;letter-spacing:.10em;
    background:linear-gradient(100deg,#fffbeb,#fcd34d,#fda4af);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .card p{margin:0 0 16px;font-size:12.5px;line-height:1.7;color:var(--muted);}
  .res-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
  .res-grid div{padding:9px 8px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);}
  .res-grid span{display:block;font-size:10.5px;color:var(--muted);}
  .res-grid b{display:block;margin-top:2px;font-size:17px;font-variant-numeric:tabular-nums;}
  .card .btn.primary{width:100%;padding:11px 14px;font-size:13.5px;}
  .card .btn.ghost{width:100%;margin-top:8px;}

  @media (max-width:620px){
    body{padding:14px 12px 18px;}
    .app{gap:12px;}
    .logo{width:46px;height:46px;border-radius:14px;font-size:22px;}
    .stat{min-width:56px;padding:7px 9px;}
    .stat b{font-size:15px;}
    .brand p{font-size:11.5px;}
    .board-shell{padding:7px;border-radius:20px;}
    .board{border-radius:14px;padding:9px;}
    .line{min-height:47px;padding:7px 6px;font-size:13px;letter-spacing:.06em;}
    .heads{gap:8px;}
    .heads div{font-size:10.5px;}
    .cols{gap:7px;}
    .col{gap:7px;}
    .overlay{position:fixed;inset:0;z-index:80;border-radius:0;padding:16px;}
    .card{padding:20px 18px 16px;}
    .card h2{font-size:27px;}
  }
  @media (max-height:740px) and (min-width:700px){
    .board-shell{width:min(100%,760px);}
    .line{min-height:44px;font-size:14px;}
    .brand p{display:none;}
    .foot{display:none;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo">联</div>
      <div>
        <h1>对联配对</h1>
        <p>左边上联，右边下联，把成对的句子连起来</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span>完成</span><b id="done" class="gold">0 / 5</b></div>
      <div class="stat"><span>进度</span><b id="seen" class="gold">0 / 313</b></div>
      <div class="stat"><span>时间</span><b id="time">00:00</b></div>
      <div class="stat"><span>失误</span><b id="miss">0</b></div>
      <div class="stat"><span>最佳</span><b id="best">—</b></div>
    </div>
  </div>

  <div class="stage">
    <div class="board-shell">
      <div class="board" id="board">
        <div class="heads"><div>上 联</div><div>下 联</div></div>
        <div class="cols">
          <div class="col" id="leftCol"></div>
          <div class="col" id="rightCol"></div>
        </div>
        <div class="overlay on" id="overlay"><div class="card" id="ovCard"></div></div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="status" id="status"><i></i><span>先点一句上联，再点对应的下联</span></div>
    <div class="actions">
      <button class="btn" id="hint">提示</button>
      <button class="btn" id="skip">跳过</button>
      <button class="btn" id="newgame">换一组</button>
    </div>
  </div>
  <p class="foot">配对成功 +100 · 配错 -20 · 提示 -30 · 完成越快时间奖励越高</p>
</div>

  var PER_ROUND = 5;

  var SEEN_KEY = 'tx_couplet_seen_v1';
  var seenSet = {};
  var seenCount = 0;
  function loadSeen() {
    try {
      var raw = localStorage.getItem(SEEN_KEY);
      if (!raw) return;
      var arr = JSON.parse(raw);
      if (!arr || !arr.length) return;
      for (var i = 0; i < arr.length; i++) {
        var k = arr[i];
        if (typeof k === 'number' && k >= 0 && k < PAIRS.length && !seenSet[k]) {
          seenSet[k] = 1;
          seenCount++;
        }
      }
    } catch (e) {}
  }
  function saveSeen() {
    try {
      var arr = [];
      for (var k in seenSet) {
        if (seenSet.hasOwnProperty(k)) arr.push(Number(k));
      }
      localStorage.setItem(SEEN_KEY, JSON.stringify(arr));
    } catch (e) {}
  }
  function markSeen(i) {
    if (typeof i !== 'number' || seenSet[i]) return;
    seenSet[i] = 1;
    seenCount++;
    saveSeen();
  }

  var leftCol = document.getElementById('leftCol');
  var rightCol = document.getElementById('rightCol');
  var doneEl = document.getElementById('done');
  var timeEl = document.getElementById('time');
  var missEl = document.getElementById('miss');
  var bestEl = document.getElementById('best');
  var seenEl = document.getElementById('seen');
  var statusEl = document.getElementById('status');
  var overlay = document.getElementById('overlay');
  var ovCard = document.getElementById('ovCard');

  var current = [];
  var currentIdx = [];
  var selLeft = null, selRight = null;
  var matched = 0, misses = 0, hints = 0, skips = 0, score = 0;
  var startedAt = 0, elapsed = 0, timerId = 0, running = false, resolving = false;
  var finishTimer = 0, resolveTimer = 0;
  var best = 0;

  try { best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; } catch (e) { best = 0; }
  bestEl.textContent = best > 0 ? best : '—';
  loadSeen();

  function fmt(sec) {
    sec = Math.max(0, Math.floor(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function setStatus(t) { statusEl.querySelector('span').textContent = t; }
  function updateHud() {
    doneEl.textContent = matched + ' / ' + PER_ROUND;
    seenEl.textContent = seenCount + ' / ' + PAIRS.length;
    timeEl.textContent = fmt(elapsed);
    missEl.textContent = String(misses);
    bestEl.textContent = best > 0 ? best : '—';
  }

  function startTimer() {
    if (running) return;
    running = true;
    startedAt = Date.now();
    timerId = setInterval(function () {
      elapsed = (Date.now() - startedAt) / 1000;
      timeEl.textContent = fmt(elapsed);
    }, 250);
  }
  function stopTimer() {
    clearInterval(timerId);
    timerId = 0;
    if (running) elapsed = (Date.now() - startedAt) / 1000;
    running = false;
  }

  function pickPairs() {
    var all = [], unseen = [], i;
    for (i = 0; i < PAIRS.length; i++) {
      all.push(i);
      if (!seenSet[i]) unseen.push(i);
    }
    shuffle(unseen);
    var pick = unseen.slice(0, PER_ROUND);
    if (pick.length < PER_ROUND) {
      var rest = [];
      for (i = 0; i < all.length; i++) {
        if (pick.indexOf(all[i]) < 0) rest.push(all[i]);
      }
      shuffle(rest);
      pick = pick.concat(rest.slice(0, PER_ROUND - pick.length));
    }
    shuffle(pick);
    return pick;
  }

  function newRound() {
    clearInterval(timerId); timerId = 0;
    clearTimeout(finishTimer); finishTimer = 0;
    clearTimeout(resolveTimer); resolveTimer = 0;
    running = false; resolving = false;
    selLeft = null; selRight = null;
    matched = 0; misses = 0; hints = 0; skips = 0; score = 0;
    elapsed = 0; startedAt = 0;
    overlay.classList.remove('on');
    currentIdx = pickPairs();
    current = currentIdx.map(function (i) { return PAIRS[i]; });
    var lefts = current.map(function (p, i) { return { text: p[0], pid: i }; });
    var rights = current.map(function (p, i) { return { text: p[1], pid: i }; });
    shuffle(lefts); shuffle(rights);
    leftCol.innerHTML = '';
    rightCol.innerHTML = '';
    lefts.forEach(function (it) { leftCol.appendChild(makeLine(it, 'left')); });
    rights.forEach(function (it) { rightCol.appendChild(makeLine(it, 'right')); });
    updateHud();
    setStatus('先点一句上联，再点对应的下联');
  }

  function makeLine(it, side) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'line';
    b.dataset.pid = String(it.pid);
    b.dataset.side = side;
    b.textContent = it.text;
    b.addEventListener('click', onLineClick);
    return b;
  }

  function onLineClick(e) {
    e.preventDefault();
    if (resolving) return;
    var el = this;
    if (el.classList.contains('matched')) return;
    if (!running) startTimer();
    var side = el.dataset.side;
    if (side === 'left') {
      if (selLeft === el) { el.classList.remove('sel'); selLeft = null; return; }
      if (selLeft) selLeft.classList.remove('sel');
      selLeft = el; el.classList.add('sel');
    } else {
      if (selRight === el) { el.classList.remove('sel'); selRight = null; return; }
      if (selRight) selRight.classList.remove('sel');
      selRight = el; el.classList.add('sel');
    }
    if (selLeft && selRight) checkPair();
  }

  function checkPair() {
    var a = selLeft, b = selRight;
    var ok = a.dataset.pid === b.dataset.pid;
    if (ok) {
      a.classList.remove('sel'); b.classList.remove('sel');
      a.classList.add('matched'); b.classList.add('matched');
      a.disabled = true; b.disabled = true;
      matched++;
      score += 100;
      markSeen(currentIdx[Number(a.dataset.pid)]);
      selLeft = null; selRight = null;
      updateHud();
      setStatus('对上了 · +100');
      if (matched >= PER_ROUND) finishTimer = setTimeout(finish, 420);
    } else {
      resolving = true;
      a.classList.add('wrong'); b.classList.add('wrong');
      misses++;
      score = Math.max(0, score - 20);
      updateHud();
      setStatus('这两句不是一对 · -20');
      resolveTimer = setTimeout(function () {
        a.classList.remove('wrong', 'sel');
        b.classList.remove('wrong', 'sel');
        selLeft = null; selRight = null; resolving = false;
      }, 340);
    }
  }

  function hint() {
    if (!running || matched >= PER_ROUND) return;
    var lefts = [].filter.call(leftCol.querySelectorAll('.line'), function (x) { return !x.classList.contains('matched'); });
    if (!lefts.length) return;
    var a = lefts[Math.floor(Math.random() * lefts.length)];
    var pid = a.dataset.pid;
    var b = rightCol.querySelector('.line[data-pid="' + pid + '"]');
    a.classList.add('hint');
    if (b) b.classList.add('hint');
    score = Math.max(0, score - 30);
    hints++;
    updateHud();
    setStatus('提示已用 · -30');
    setTimeout(function () {
      a.classList.remove('hint');
      if (b) b.classList.remove('hint');
    }, 2400);
  }

  function skip() {
    if (!running || matched >= PER_ROUND) return;
    if (overlay.classList.contains('on')) return;
    stopTimer();
    clearTimeout(finishTimer); finishTimer = 0;
    clearTimeout(resolveTimer); resolveTimer = 0;
    resolving = false;
    if (selLeft) selLeft.classList.remove('sel');
    if (selRight) selRight.classList.remove('sel');
    selLeft = null; selRight = null;
    skips++;
    var t = elapsed;
    updateHud();
    setStatus('已跳过本组 · 不计分');
    ovCard.innerHTML =
      '<div class="kicker">SKIPPED</div>' +
      '<h2>跳过</h2>' +
      '<p>这一组不计分，进度还留着。下次会优先出没做过的题。</p>' +
      '<div class="res-grid">' +
        '<div><span>用时</span><b>' + fmt(t) + '</b></div>' +
        '<div><span>本组已配对</span><b>' + matched + ' / ' + PER_ROUND + '</b></div>' +
        '<div><span>累计进度</span><b>' + seenCount + ' / ' + PAIRS.length + '</b></div>' +
        '<div><span>累计跳过</span><b>' + skips + '</b></div>' +
      '</div>' +
      '<button type="button" class="btn primary" id="again">再来一组</button>';
    overlay.classList.add('on');
    ovCard.querySelector('#again').addEventListener('click', function () { newRound(); startTimer(); });
  }

  function finish() {
    stopTimer();
    var bonus = Math.max(0, Math.round((90 - elapsed) * 2));
    var total = score + bonus;
    var isBest = total > best;
    if (isBest) {
      best = total;
      try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
    }
    updateHud();
    setStatus('全部配对完成');
    ovCard.innerHTML =
      '<div class="kicker">ALL MATCHED</div>' +
      '<h2>对上了</h2>' +
      '<p>五副对联全部归位，' + (elapsed < 30 ? '手很快。' : '稳扎稳打。') + '</p>' +
      '<div class="res-grid">' +
        '<div><span>用时</span><b>' + fmt(elapsed) + '</b></div>' +
        '<div><span>失误</span><b>' + misses + '</b></div>' +
        '<div><span>基础分</span><b>' + score + '</b></div>' +
        '<div><span>时间奖励</span><b>+' + bonus + '</b></div>' +
        '<div><span>本局总分</span><b>' + total + '</b></div>' +
        '<div><span>累计进度</span><b>' + seenCount + ' / ' + PAIRS.length + '</b></div>' +
        '<div><span>跳过组数</span><b>' + skips + '</b></div>' +
        '<div><span>历史最佳</span><b>' + best + '</b></div>' +
      '</div>' +
      '<button type="button" class="btn primary" id="again">再来一组</button>';
    overlay.classList.add('on');
    ovCard.querySelector('#again').addEventListener('click', newRound);
  }

  function showStart() {
    overlay.classList.add('on');
    ovCard.innerHTML =
      '<div class="kicker">五副对联</div>' +
      '<h2>对联配对</h2>' +
      '<p>左边是上联，右边是下联。点一句上联，再点它对应的下联，全部配对完成。</p>' +
      '<div class="res-grid">' +
        '<div><span>历史最佳</span><b>' + (best > 0 ? best : '—') + '</b></div>' +
        '<div><span>每组</span><b>5 副</b></div>' +
        '<div><span>题库</span><b>' + PAIRS.length + ' 副</b></div>' +
        '<div><span>已配对</span><b>' + seenCount + ' / ' + PAIRS.length + '</b></div>' +
      '</div>' +
      '<button type="button" class="btn primary" id="startBtn">开始配对</button>';
    ovCard.querySelector('#startBtn').addEventListener('click', function () {
      newRound();
      startTimer();
    });
  }

  document.getElementById('hint').addEventListener('click', function () { hint(); this.blur(); });
  document.getElementById('skip').addEventListener('click', function () { skip(); this.blur(); });
  document.getElementById('newgame').addEventListener('click', function () {
    newRound();
    startTimer();
    this.blur();
  });

  newRound();
  showStart();
})();
</script>
</body>
</html>
