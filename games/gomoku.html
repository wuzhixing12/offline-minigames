<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>五子棋</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    color:#e6eefb;
    background:
      radial-gradient(900px 520px at 12% -10%,rgba(56,189,248,.16),transparent 65%),
      radial-gradient(720px 460px at 100% 0%,rgba(251,191,36,.10),transparent 60%),
      linear-gradient(180deg,#0a1120,#070b14 60%,#05080f);
    display:flex;justify-content:center;padding:54px 14px 22px;
    -webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;
  }
  .app{width:min(780px,100%);display:flex;flex-direction:column;gap:14px;align-items:center;}
  .top{width:100%;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1;}
  .logo{
    width:46px;height:46px;flex:0 0 auto;border-radius:14px;display:grid;place-items:center;font-size:22px;
    background:linear-gradient(150deg,rgba(56,189,248,.24),rgba(167,139,250,.12));
    border:1px solid rgba(56,189,248,.35);box-shadow:0 0 24px -8px rgba(56,189,248,.7);
  }
  h1{margin:0;font-size:20px;letter-spacing:.06em;}
  .brand p{margin:3px 0 0;font-size:11.5px;color:#8fa2bc;}
  .status{
    display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;
    background:rgba(15,23,40,.82);border:1px solid rgba(255,255,255,.1);
    font-size:12.5px;white-space:nowrap;
  }
  .status.over{border-color:rgba(251,191,36,.45);color:#ffe6a6;}
  .dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto;box-shadow:inset 0 1px 1px rgba(255,255,255,.35);}
  .dot.black{background:radial-gradient(circle at 35% 30%,#6b7280,#0b1220 70%);}
  .dot.white{background:radial-gradient(circle at 35% 30%,#fff,#c3ccd8 75%);}
  .dot.draw{background:linear-gradient(90deg,#0b1220 50%,#fff 50%);}
  .controls{width:100%;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .seg{
    display:inline-flex;padding:3px;border-radius:12px;
    background:rgba(15,23,40,.82);border:1px solid rgba(255,255,255,.09);
  }
  .seg button{
    border:0;background:transparent;color:#9fb0c8;font-size:12px;
    padding:7px 12px;border-radius:9px;cursor:pointer;white-space:nowrap;
    font-family:inherit;
  }
  .seg button.on{
    color:#eaf9ff;background:linear-gradient(120deg,rgba(56,189,248,.24),rgba(167,139,250,.18));
    box-shadow:inset 0 0 0 1px rgba(56,189,248,.3);
  }
  #sideSeg button.on[data-side="1"]{
    color:#f8fafc;background:linear-gradient(130deg,rgba(71,85,105,.62),rgba(15,23,42,.55));
    box-shadow:inset 0 0 0 1px rgba(203,213,225,.34),0 2px 10px rgba(0,0,0,.22);
  }
  #sideSeg button.on[data-side="2"]{
    color:#1e293b;background:linear-gradient(130deg,#ffffff,#dbe3ec);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.8),0 2px 10px rgba(0,0,0,.14);
  }
  #sideSeg::before{
    content:"";align-self:center;width:9px;height:9px;border-radius:50%;margin:0 1px 0 6px;
    background:radial-gradient(circle at 34% 30%,#64748b,#0b1220 72%);
    box-shadow:0 0 0 1px rgba(255,255,255,.16);
  }
  #sideSeg[data-pick="2"]::before{
    background:radial-gradient(circle at 34% 30%,#ffffff,#c3ccd8 76%);
  }
  select{
    appearance:none;-webkit-appearance:none;
    background-color:rgba(15,23,40,.82);color:#bfe7ff;
    border:1px solid rgba(255,255,255,.1);border-radius:11px;
    padding:8px 26px 8px 11px;font-size:12px;cursor:pointer;font-family:inherit;
    background-image:
      linear-gradient(45deg,transparent 50%,#7f93ad 50%),
      linear-gradient(135deg,#7f93ad 50%,transparent 50%);
    background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;
  }
  .btn{
    border:1px solid rgba(56,189,248,.24);background:rgba(56,189,248,.07);
    color:#bfe7ff;border-radius:11px;padding:8px 14px;font-size:12px;
    cursor:pointer;font-family:inherit;transition:background .15s ease,border-color .15s ease;
  }
  .btn:hover{background:rgba(56,189,248,.15);border-color:rgba(56,189,248,.45);}
  #restart{margin-left:auto;}
  .board-wrap{
    position:relative;
    width:min(100%,max(260px,calc(100vh - 250px)),620px);
    aspect-ratio:1/1;border-radius:18px;overflow:hidden;
    border:1px solid rgba(255,255,255,.14);
    background:rgba(9,14,23,.55);
    box-shadow:0 30px 70px -28px rgba(0,0,0,.95),0 0 70px -22px rgba(222,172,92,.45),inset 0 0 0 1px rgba(255,230,180,.06);
  }
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:pointer;}
  .result{
    position:absolute;inset:0;display:grid;place-items:center;padding:20px;
    background:rgba(5,9,16,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .result[hidden]{display:none;}
  .result-card{
    width:min(300px,100%);text-align:center;padding:24px 22px;border-radius:18px;
    background:linear-gradient(160deg,rgba(23,33,52,.98),rgba(10,15,26,.98));
    border:1px solid rgba(251,191,36,.4);box-shadow:0 30px 60px -20px rgba(0,0,0,.9);
  }
  .r-ico{font-size:34px;display:block;margin-bottom:6px;}
  .result-card b{font-size:19px;letter-spacing:.05em;color:#ffe6a6;}
  .result-card p{margin:6px 0 16px;font-size:12px;color:#a9b6cc;}
  .result-card button{
    width:100%;padding:10px;border-radius:11px;border:0;cursor:pointer;
    font-size:13px;font-weight:700;color:#241703;font-family:inherit;
    background:linear-gradient(135deg,#fbbf24,#f59e0b);
  }
  .hint{width:100%;margin:0;text-align:center;font-size:11.5px;color:#7f93ad;line-height:1.6;}
  @media (max-width:640px){
    body{padding:50px 10px 16px;}
    .top{gap:10px;}
    h1{font-size:18px;}
    .brand p{display:none;}
    .logo{width:40px;height:40px;font-size:19px;}
    .status{padding:7px 11px;font-size:11.5px;margin-left:auto;}
    .controls{gap:6px;}
    .seg button{padding:6px 10px;font-size:11.5px;}
    .btn{padding:7px 11px;font-size:11.5px;}
    .board-wrap{width:min(100%,max(240px,calc(100vh - 230px)),620px);}
  }
</style>

<style id="tx-space">
/* tx-space: short landscape play-space boost */
@media (max-height:560px) and (orientation:landscape){
  html,body{height:100%;overflow:hidden}
  body{padding:6px 8px;display:flex}
  .app{width:100%;height:100%;display:grid;grid-template-columns:minmax(0,1fr) 268px;
    grid-template-rows:auto 1fr auto;
    grid-template-areas:"board top" "board controls" "board hint";
    gap:6px 12px;align-items:stretch}
  .top{grid-area:top;flex-wrap:wrap;gap:6px;align-content:flex-start}
  .logo{width:34px;height:34px;font-size:17px;border-radius:10px}
  h1{font-size:16px}
  .brand p{display:none}
  .status{padding:5px 9px;font-size:11px;margin-left:0}
  .controls{grid-area:controls;flex-direction:column;align-items:flex-start;gap:5px;justify-content:flex-start}
  .seg button{padding:5px 8px;font-size:11px}
  select{padding:5px 22px 5px 8px;font-size:11px}
  .btn{padding:5px 9px;font-size:11px}
  #restart{margin-left:0}
  .board-wrap{grid-area:board;width:auto;height:100%;max-height:100%;aspect-ratio:1/1;
    justify-self:center;align-self:center;border-radius:14px}
  .hint{grid-area:hint;font-size:10px;line-height:1.45;text-align:left}
  .result-card{padding:16px 14px;width:min(240px,100%)}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">⚫</span>
      <div>
        <h1>五子棋</h1>
        <p>19 路大棋盘 · 五档 AI · 可执黑/执白</p>
      </div>
    </div>
    <div class="status" id="status">
      <i class="dot black" id="dot" aria-hidden="true"></i>
      <span id="statusText">黑方落子</span>
    </div>
  </header>

  <div class="controls">
    <div class="seg" id="modeSeg" role="group" aria-label="对局模式">
      <button type="button" data-mode="ai" class="on">人机对战</button>
      <button type="button" data-mode="pvp">双人同屏</button>
    </div>
    <div class="seg" id="sizeSeg" role="group" aria-label="棋盘大小">
      <button type="button" data-size="19" class="on">19×19</button>
      <button type="button" data-size="15">15×15</button>
    </div>
    <select id="level" aria-label="AI 难度" title="AI 难度">
      <option value="entry">入门</option>
      <option value="easy">简单</option>
      <option value="normal" selected>普通</option>
      <option value="hard">困难</option>
      <option value="master">大师</option>
    </select>
    <div class="seg side" id="sideSeg" role="group" aria-label="你的执子">
      <button type="button" data-side="1" class="on" title="你执黑，先行">执黑</button>
      <button type="button" data-side="2" title="你执白，后行">执白</button>
    </div>
    <button type="button" class="btn" id="undo">悔棋</button>
    <button type="button" class="btn" id="restart">重开</button>
  </div>

  <div class="board-wrap" id="boardWrap">
    <canvas id="board" aria-label="五子棋棋盘"></canvas>
    <div class="result" id="result" hidden>
      <div class="result-card">
        <span class="r-ico" aria-hidden="true">🏆</span>
        <b id="resultTitle">黑方获胜</b>
        <p id="resultDesc">五子连珠</p>
        <button type="button" id="again">再来一局</button>
      </div>
    </div>
  </div>

  <p class="hint" id="hint">你执黑先行。点击或触摸棋盘落子，AI 会主动封堵你的活三。</p>
</div>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  var wrap = document.getElementById('boardWrap');
  var statusEl = document.getElementById('status');
  var dotEl = document.getElementById('dot');
  var statusTextEl = document.getElementById('statusText');
  var hintEl = document.getElementById('hint');
  var resultEl = document.getElementById('result');
  var resultTitle = document.getElementById('resultTitle');
  var resultDesc = document.getElementById('resultDesc');
  var levelEl = document.getElementById('level');
  var modeSeg = document.getElementById('modeSeg');
  var sizeSeg = document.getElementById('sizeSeg');
  var sideSeg = document.getElementById('sideSeg');
  var undoBtn = document.getElementById('undo');
  var restartBtn = document.getElementById('restart');
  var againBtn = document.getElementById('again');

  var BLACK = 1, WHITE = 2;
  var N = 19;
  var mode = 'ai';
  var level = 'normal';
  var playerColor = BLACK;
  var aiColor = WHITE;
  var board = [];
  var moves = [];
  var turn = BLACK;
  var over = false;
  var thinking = false;
  var winner = 0;
  var winLine = null;
  var hover = null;
  var token = 0;
  var cssSize = 0, pad = 0, cell = 0, dpr = 1;

  var DIRS = [[1, 0], [0, 1], [1, 1], [1, -1]];
  var COLS = 'ABCDEFGHJKLMNOPQRST';
  var W = { 1: 2, 2: 24, 3: 320, 4: 9000, 5: 100000000 };
  var LEVEL_TIPS = {
    entry:  '入门 AI 会偶尔走神，适合第一次玩。',
    easy:   '简单 AI 会漏看一些活三，适合练手。',
    normal: '普通 AI 会主动封堵你的活三。',
    hard:   '困难 AI 会计算你的反击，别急着进攻。',
    master: '大师 AI 会算连续威胁，尽量制造双向进攻。'
  };

  function inb(x, y) { return x >= 0 && x < N && y >= 0 && y < N; }

  function makeBoard() {
    board = [];
    for (var y = 0; y < N; y++) {
      var row = [];
      for (var x = 0; x < N; x++) row.push(0);
      board.push(row);
    }
  }

  function resetGame() {
    token++;
    mode = modeSeg.querySelector('.on').getAttribute('data-mode') || 'ai';
    N = parseInt(sizeSeg.querySelector('.on').getAttribute('data-size'), 10) || 19;
    level = levelEl.value;
    playerColor = parseInt(sideSeg.querySelector('.on').getAttribute('data-side'), 10) || BLACK;
    aiColor = 3 - playerColor;
    sideSeg.setAttribute('data-pick', playerColor === BLACK ? '1' : '2');
    makeBoard();
    moves = [];
    turn = BLACK;
    over = false;
    thinking = false;
    winner = 0;
    winLine = null;
    hover = null;
    resultEl.hidden = true;
    levelEl.style.display = mode === 'ai' ? '' : 'none';
    sideSeg.style.display = mode === 'ai' ? '' : 'none';
    updateHint();
    setStatus();
    resize();
    if (mode === 'ai' && turn === aiColor) scheduleAI();
  }

  function updateHint() {
    if (mode === 'ai') {
      var sideTip = playerColor === BLACK ? '你执黑先行。' : '你执白后行，AI 执黑先行。';
      hintEl.textContent = sideTip + '点击或触摸棋盘落子，' + (LEVEL_TIPS[level] || LEVEL_TIPS.normal);
    } else {
      hintEl.textContent = '玩家 VS 玩家：玩家 1 执黑先行，玩家 2 执白，轮流点击棋盘落子。';
    }
  }

  function winnerLabel(w) {
    if (!w) return '和棋';
    if (mode === 'ai') return w === playerColor ? '你赢了！' : 'AI 获胜';
    return w === BLACK ? '玩家 1 获胜' : '玩家 2 获胜';
  }

  function setStatus() {
    statusEl.classList.toggle('over', !!over);
    if (over) {
      dotEl.className = 'dot ' + (winner === BLACK ? 'black' : winner === WHITE ? 'white' : 'draw');
      statusTextEl.textContent = winnerLabel(winner);
      return;
    }
    dotEl.className = 'dot ' + (turn === BLACK ? 'black' : 'white');
    if (thinking) statusTextEl.textContent = 'AI 思考中…';
    else if (mode === 'ai') statusTextEl.textContent = turn === playerColor
      ? '轮到你（' + (playerColor === BLACK ? '黑方' : '白方') + '）'
      : 'AI 落子';
    else statusTextEl.textContent = turn === BLACK ? '玩家 1 · 黑方' : '玩家 2 · 白方';
  }

  function resize() {
    var rect = canvas.getBoundingClientRect();
    cssSize = Math.max(200, rect.width || wrap.clientWidth);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(cssSize * dpr);
    canvas.height = Math.round(cssSize * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    pad = cssSize * (N >= 19 ? 0.088 : 0.095);
    cell = (cssSize - pad * 2) / (N - 1);
    draw();
  }

  function px(i) { return pad + i * cell; }

  function drawCoords() {
    var fs = Math.max(8, cell * 0.28);
    var off = cell * 0.38;
    ctx.save();
    ctx.font = '600 ' + fs + 'px "Segoe UI","Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(58,34,10,.45)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var i = 0; i < N; i++) {
      ctx.fillText(COLS.charAt(i), px(i), px(0) - off);
      ctx.fillText(String(i + 1), px(0) - off, px(i));
    }
    ctx.restore();
  }

  function roundPath(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawStone(x, y, c) {
    var cx = px(x), cy = px(y), r = cell * 0.445;
    var black = c === BLACK;

    var contact = ctx.createRadialGradient(cx, cy + r * 0.16, r * 0.5, cx, cy + r * 0.2, r * 1.4);
    contact.addColorStop(0, 'rgba(40,22,5,.2)');
    contact.addColorStop(0.7, 'rgba(40,22,5,.08)');
    contact.addColorStop(1, 'rgba(40,22,5,0)');
    ctx.fillStyle = contact;
    ctx.beginPath();
    ctx.arc(cx, cy + r * 0.1, r * 1.38, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.shadowColor = black ? 'rgba(0,0,0,.55)' : 'rgba(32,20,4,.42)';
    ctx.shadowBlur = cell * 0.22;
    ctx.shadowOffsetY = cell * 0.075;
    var gr = ctx.createRadialGradient(cx - r * 0.38, cy - r * 0.44, r * 0.1, cx, cy, r * 1.12);
    if (black) {
      gr.addColorStop(0, '#77828f');
      gr.addColorStop(0.34, '#333d4c');
      gr.addColorStop(0.72, '#161d28');
      gr.addColorStop(1, '#05080d');
    } else {
      gr.addColorStop(0, '#ffffff');
      gr.addColorStop(0.55, '#f6f8fb');
      gr.addColorStop(0.86, '#dde5ee');
      gr.addColorStop(1, '#aeb9c7');
    }
    ctx.fillStyle = gr;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.clip();
    var gloss = ctx.createRadialGradient(
      cx - r * 0.34, cy - r * 0.42, 0,
      cx - r * 0.34, cy - r * 0.42, r * 0.92
    );
    gloss.addColorStop(0, black ? 'rgba(210,224,242,.55)' : 'rgba(255,255,255,.98)');
    gloss.addColorStop(0.45, black ? 'rgba(140,160,185,.16)' : 'rgba(255,255,255,.30)');
    gloss.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gloss;
    ctx.fillRect(cx - r, cy - r, r * 2, r * 2);

    var shade = ctx.createLinearGradient(0, cy + r * 0.1, 0, cy + r);
    shade.addColorStop(0, 'rgba(0,0,0,0)');
    shade.addColorStop(1, black ? 'rgba(0,0,0,.38)' : 'rgba(64,78,96,.26)');
    ctx.fillStyle = shade;
    ctx.fillRect(cx - r, cy, r * 2, r);
    ctx.restore();

    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = black ? 'rgba(0,0,0,.7)' : 'rgba(110,124,142,.6)';
    ctx.lineWidth = Math.max(1, cell * 0.022);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.83, Math.PI * 1.06, Math.PI * 1.66);
    ctx.strokeStyle = black ? 'rgba(214,230,250,.18)' : 'rgba(255,255,255,.72)';
    ctx.lineWidth = Math.max(1, cell * 0.028);
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  function draw() {
    if (!cssSize) return;
    ctx.clearRect(0, 0, cssSize, cssSize);

    // 深色桌面
    var bg = ctx.createRadialGradient(cssSize * 0.5, cssSize * 0.4, 0, cssSize * 0.5, cssSize * 0.5, cssSize * 0.8);
    bg.addColorStop(0, '#22303f');
    bg.addColorStop(0.55, '#141d28');
    bg.addColorStop(1, '#070c12');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, cssSize, cssSize);

    var mx = pad * 0.42;
    var fx = mx, fy = mx, fw = cssSize - mx * 2, fh = cssSize - mx * 2;
    var fr = cell * 0.62;

    // 外框
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.65)';
    ctx.shadowBlur = cssSize * 0.035;
    ctx.shadowOffsetY = cssSize * 0.016;
    roundPath(fx, fy, fw, fh, fr);
    var frame = ctx.createLinearGradient(fx, fy, fx + fw, fy + fh);
    frame.addColorStop(0, '#94622f');
    frame.addColorStop(0.5, '#71461e');
    frame.addColorStop(1, '#4d2d10');
    ctx.fillStyle = frame;
    ctx.fill();
    ctx.restore();

    ctx.save();
    roundPath(fx + 1.2, fy + 1.2, fw - 2.4, fh - 2.4, fr);
    ctx.strokeStyle = 'rgba(255,236,204,.3)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.restore();

    // 木盘
    var inset = cell * 0.42;
    var bx = fx + inset, by = fy + inset, bw = fw - inset * 2, bh = fh - inset * 2;
    var br = fr * 0.56;

    ctx.save();
    roundPath(bx, by, bw, bh, br);
    var wood = ctx.createLinearGradient(bx, by, bx + bw, by + bh);
    wood.addColorStop(0, '#f6dcaa');
    wood.addColorStop(0.32, '#ecc78c');
    wood.addColorStop(0.68, '#dfb471');
    wood.addColorStop(1, '#cd9c56');
    ctx.fillStyle = wood;
    ctx.fill();
    ctx.clip();

    var g, gx, gy;
    for (g = 0; g < 32; g++) {
      gy = by + bh * ((g + 0.5) / 32);
      ctx.beginPath();
      ctx.moveTo(bx, gy);
      for (gx = 0; gx <= bw; gx += cell * 0.35) {
        ctx.lineTo(bx + gx, gy + Math.sin(g * 1.9 + (gx / bw) * 7.2) * cell * 0.045);
      }
      ctx.strokeStyle = g % 3 === 0 ? 'rgba(138,92,38,.10)' : 'rgba(255,247,225,.075)';
      ctx.lineWidth = Math.max(1, cell * 0.022);
      ctx.stroke();
    }

    var knots = [[0.2, 0.26, 0.15], [0.76, 0.6, 0.19], [0.46, 0.82, 0.1]];
    for (g = 0; g < knots.length; g++) {
      var kx = bx + bw * knots[g][0];
      var ky = by + bh * knots[g][1];
      var kr = Math.min(bw, bh) * knots[g][2];
      var kg = ctx.createRadialGradient(kx, ky, kr * 0.08, kx, ky, kr);
      kg.addColorStop(0, 'rgba(118,74,26,.13)');
      kg.addColorStop(0.55, 'rgba(118,74,26,.05)');
      kg.addColorStop(1, 'rgba(118,74,26,0)');
      ctx.fillStyle = kg;
      ctx.beginPath();
      ctx.ellipse(kx, ky, kr * 1.35, kr * 0.78, -0.35, 0, Math.PI * 2);
      ctx.fill();
    }

    var vig = ctx.createRadialGradient(bx + bw * 0.5, by + bh * 0.46, bw * 0.16, bx + bw * 0.5, by + bh * 0.5, bw * 0.8);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(64,34,6,.17)');
    ctx.fillStyle = vig;
    ctx.fillRect(bx, by, bw, bh);
    ctx.restore();

    // 盘面高光边
    ctx.save();
    roundPath(bx - 1, by - 1, bw + 2, bh + 2, br);
    ctx.strokeStyle = 'rgba(58,31,6,.36)';
    ctx.lineWidth = Math.max(1, cell * 0.035);
    ctx.stroke();
    roundPath(bx, by, bw, bh, br);
    ctx.strokeStyle = 'rgba(255,250,232,.42)';
    ctx.lineWidth = Math.max(1, cell * 0.024);
    ctx.stroke();
    roundPath(fx, fy, fw, fh, fr);
    ctx.strokeStyle = 'rgba(255,228,186,.2)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();

    // 网格：浅色衬线 + 深色墨线
    var gp = function () {
      ctx.beginPath();
      for (var ii = 0; ii < N; ii++) {
        var p = px(ii);
        ctx.moveTo(px(0), p);
        ctx.lineTo(px(N - 1), p);
        ctx.moveTo(p, px(0));
        ctx.lineTo(p, px(N - 1));
      }
    };
    gp();
    ctx.save();
    ctx.translate(0.9, 0.9);
    ctx.strokeStyle = 'rgba(255,248,228,.32)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.restore();
    gp();
    ctx.strokeStyle = 'rgba(72,44,17,.74)';
    ctx.lineWidth = Math.max(1, cell * 0.028);
    ctx.stroke();

    // 外框墨线
    ctx.strokeStyle = 'rgba(56,33,11,.9)';
    ctx.lineWidth = Math.max(2, cell * 0.085);
    ctx.strokeRect(px(0), px(0), px(N - 1) - px(0), px(N - 1) - px(0));

    // 星位
    var stars = N === 19
      ? [[3, 3], [3, 9], [3, 15], [9, 3], [9, 9], [9, 15], [15, 3], [15, 9], [15, 15]]
      : [[3, 3], [3, 11], [7, 7], [11, 3], [11, 11]];
    var sr = Math.max(2.2, cell * 0.072);
    for (var s = 0; s < stars.length; s++) {
      var sx = px(stars[s][0]), sy = px(stars[s][1]);
      ctx.beginPath();
      ctx.arc(sx, sy, sr * 1.9, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,248,228,.28)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(sx, sy, sr, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(56,33,11,.88)';
      ctx.fill();
    }

    drawCoords();

    if (!over && !thinking && hover && !board[hover.y][hover.x]) {
      var canPlay = mode !== 'ai' || turn === playerColor;
      if (canPlay) {
        ctx.save();
        ctx.strokeStyle = 'rgba(56,33,11,.14)';
        ctx.lineWidth = 1;
        ctx.setLineDash([cell * 0.1, cell * 0.16]);
        ctx.beginPath();
        ctx.moveTo(px(0), px(hover.y));
        ctx.lineTo(px(N - 1), px(hover.y));
        ctx.moveTo(px(hover.x), px(0));
        ctx.lineTo(px(hover.x), px(N - 1));
        ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.globalAlpha = 0.34;
        drawStone(hover.x, hover.y, turn);
        ctx.restore();
        ctx.save();
        ctx.beginPath();
        ctx.arc(px(hover.x), px(hover.y), cell * 0.5, 0, Math.PI * 2);
        ctx.strokeStyle = turn === BLACK ? 'rgba(40,52,68,.55)' : 'rgba(255,255,255,.78)';
        ctx.lineWidth = Math.max(1, cell * 0.04);
        ctx.setLineDash([cell * 0.16, cell * 0.14]);
        ctx.stroke();
        ctx.restore();
      }
    }

    for (var yy = 0; yy < N; yy++) {
      for (var xx = 0; xx < N; xx++) {
        if (board[yy][xx]) drawStone(xx, yy, board[yy][xx]);
      }
    }

    if (winLine) {
      var wdx = winLine.x2 === winLine.x1 ? 0 : (winLine.x2 > winLine.x1 ? 1 : -1);
      var wdy = winLine.y2 === winLine.y1 ? 0 : (winLine.y2 > winLine.y1 ? 1 : -1);
      var wx = winLine.x1, wy = winLine.y1, guard = 0;
      while (guard++ < 60) {
        ctx.beginPath();
        ctx.arc(px(wx), px(wy), cell * 0.47, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,214,128,.9)';
        ctx.lineWidth = Math.max(1.5, cell * 0.05);
        ctx.stroke();
        if (wx === winLine.x2 && wy === winLine.y2) break;
        wx += wdx; wy += wdy;
      }
      ctx.save();
      ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(255,226,170,.55)';
      ctx.lineWidth = Math.max(6, cell * 0.24);
      ctx.beginPath();
      ctx.moveTo(px(winLine.x1), px(winLine.y1));
      ctx.lineTo(px(winLine.x2), px(winLine.y2));
      ctx.stroke();
      ctx.strokeStyle = 'rgba(239,68,68,.95)';
      ctx.lineWidth = Math.max(3, cell * 0.1);
      ctx.shadowColor = 'rgba(239,68,68,.8)';
      ctx.shadowBlur = cell * 0.5;
      ctx.beginPath();
      ctx.moveTo(px(winLine.x1), px(winLine.y1));
      ctx.lineTo(px(winLine.x2), px(winLine.y2));
      ctx.stroke();
      ctx.restore();
    }

    if (moves.length && !winLine) {
      var lm = moves[moves.length - 1];
      var lx = px(lm.x), ly = px(lm.y);
      var halo = ctx.createRadialGradient(lx, ly, cell * 0.1, lx, ly, cell * 0.56);
      halo.addColorStop(0, 'rgba(255,206,128,.34)');
      halo.addColorStop(0.55, 'rgba(255,186,90,.12)');
      halo.addColorStop(1, 'rgba(255,186,90,0)');
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(lx, ly, cell * 0.56, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(lx, ly, Math.max(3, cell * 0.11), 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,.92)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(lx, ly, Math.max(2, cell * 0.072), 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(232,62,54,.98)';
      ctx.fill();
    }
  }

  function pointFromEvent(e) {
    var rect = canvas.getBoundingClientRect();
    var mx = e.clientX - rect.left;
    var my = e.clientY - rect.top;
    if (!cell) return null;
    var x = Math.round((mx - pad) / cell);
    var y = Math.round((my - pad) / cell);
    if (!inb(x, y)) return null;
    var dx = mx - px(x), dy = my - px(y);
    if (dx * dx + dy * dy > (cell * 0.55) * (cell * 0.55)) return null;
    return { x: x, y: y };
  }

  function checkWin(x, y, c) {
    for (var d = 0; d < DIRS.length; d++) {
      var dx = DIRS[d][0], dy = DIRS[d][1];
      var x1 = x, y1 = y, x2 = x, y2 = y;
      while (inb(x1 - dx, y1 - dy) && board[y1 - dy][x1 - dx] === c) { x1 -= dx; y1 -= dy; }
      while (inb(x2 + dx, y2 + dy) && board[y2 + dy][x2 + dx] === c) { x2 += dx; y2 += dy; }
      var len = Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1)) + 1;
      if (len >= 5) return { x1: x1, y1: y1, x2: x2, y2: y2 };
    }
    return null;
  }

  function playMove(x, y, byAI) {
    if (over || !inb(x, y) || board[y][x]) return false;
    if (!byAI) {
      if (thinking) return false;
      if (mode === 'ai' && turn !== playerColor) return false;
    }
    board[y][x] = turn;
    moves.push({ x: x, y: y, c: turn });
    hover = null;
    var w = checkWin(x, y, turn);
    draw();
    if (w) { endGame(turn, w); return true; }
    if (moves.length >= N * N) { endGame(0, null); return true; }
    turn = 3 - turn;
    setStatus();
    draw();
    if (mode === 'ai' && turn === aiColor) scheduleAI();
    return true;
  }

  function endGame(w, line) {
    over = true;
    thinking = false;
    token++;
    winner = w;
    winLine = line;
    setStatus();
    resultTitle.textContent = winnerLabel(w);
    resultDesc.textContent = w ? '五子连珠，漂亮的一局' : '棋盘已满，势均力敌';
    resultEl.hidden = false;
    draw();
  }

  function scheduleAI() {
    if (over || mode !== 'ai' || turn !== aiColor) return;
    thinking = true;
    setStatus();
    draw();
    var my = ++token;
    setTimeout(function () {
      if (my !== token || over) return;
      var mv = chooseAIMove();
      thinking = false;
      if (!mv) { endGame(0, null); return; }
      playMove(mv.x, mv.y, true);
    }, 260);
  }

  function candidates() {
    var out = [], seen = {};
    if (!moves.length) return [{ x: (N - 1) >> 1, y: (N - 1) >> 1 }];
    for (var i = 0; i < moves.length; i++) {
      var m = moves[i];
      for (var dy = -2; dy <= 2; dy++) {
        for (var dx = -2; dx <= 2; dx++) {
          if (!dx && !dy) continue;
          var x = m.x + dx, y = m.y + dy;
          if (!inb(x, y) || board[y][x]) continue;
          var k = y * N + x;
          if (seen[k]) continue;
          seen[k] = 1;
          out.push({ x: x, y: y });
        }
      }
    }
    return out;
  }

  function scoreAt(x, y, c) {
    var total = 0, multi = 0;
    for (var d = 0; d < DIRS.length; d++) {
      var dx = DIRS[d][0], dy = DIRS[d][1], dirScore = 0;
      for (var off = -4; off <= 0; off++) {
        var own = 0, bad = false;
        for (var k = 0; k < 5; k++) {
          var nx = x + (off + k) * dx, ny = y + (off + k) * dy;
          if (!inb(nx, ny)) { bad = true; break; }
          if (nx === x && ny === y) { own++; continue; }
          var v = board[ny][nx];
          if (v === c) own++;
          else if (v) { bad = true; break; }
        }
        if (!bad && own > 0) dirScore += W[own] || 0;
      }
      if (dirScore >= W[3]) multi++;
      total += dirScore;
    }
    if (multi >= 2) total += 900;
    return total;
  }

  function bestAttack(c) {
    var cands = candidates();
    var best = 0;
    for (var i = 0; i < cands.length; i++) {
      var m = cands[i];
      board[m.y][m.x] = c;
      var win = checkWin(m.x, m.y, c);
      var s = scoreAt(m.x, m.y, c);
      board[m.y][m.x] = 0;
      if (win) return 1000000000;
      if (s > best) best = s;
    }
    return best;
  }

  function countWinningMoves(c) {
    var n = 0;
    for (var y = 0; y < N; y++) {
      for (var x = 0; x < N; x++) {
        if (board[y][x]) continue;
        board[y][x] = c;
        if (checkWin(x, y, c)) n++;
        board[y][x] = 0;
      }
    }
    return n;
  }

  function chooseAIMove() {
    var cands = candidates();
    if (!cands.length) return null;
    var i, c;
    var me = aiColor, foe = playerColor;

    for (i = 0; i < cands.length; i++) {
      c = cands[i];
      board[c.y][c.x] = me;
      var win = checkWin(c.x, c.y, me);
      board[c.y][c.x] = 0;
      if (win) return c;
    }

    var blocks = [];
    for (i = 0; i < cands.length; i++) {
      c = cands[i];
      board[c.y][c.x] = foe;
      var lose = checkWin(c.x, c.y, foe);
      board[c.y][c.x] = 0;
      if (lose) blocks.push(c);
    }
    if (blocks.length && (level !== 'entry' || Math.random() < 0.35)) {
      var bx = 0, by = 0, bd = 1e9, mid0 = (N - 1) / 2;
      for (i = 0; i < blocks.length; i++) {
        var dd = Math.abs(blocks[i].x - mid0) + Math.abs(blocks[i].y - mid0);
        if (dd < bd) { bd = dd; bx = blocks[i].x; by = blocks[i].y; }
      }
      return { x: bx, y: by };
    }

    var scored = [], mid = (N - 1) / 2;
    for (i = 0; i < cands.length; i++) {
      c = cands[i];
      var atk = scoreAt(c.x, c.y, me);
      var def = scoreAt(c.x, c.y, foe);
      var s = atk + def * 0.92;
      s += (N - Math.abs(c.x - mid) - Math.abs(c.y - mid)) * 1.5;
      scored.push({ x: c.x, y: c.y, s: s });
    }
    scored.sort(function (a, b) { return b.s - a.s; });

    if (level === 'master') {
      var topM = scored.slice(0, 12);
      for (i = 0; i < topM.length; i++) {
        var mm = topM[i];
        board[mm.y][mm.x] = me;
        var oppBest = bestAttack(foe);
        var myWin = countWinningMoves(me);
        var oppWin = countWinningMoves(foe);
        board[mm.y][mm.x] = 0;
        mm.s = mm.s - oppBest * 0.98;
        mm.s += myWin >= 2 ? 60000 : myWin * 2500;
        mm.s -= oppWin >= 2 ? 90000 : oppWin * 800;
      }
      topM.sort(function (a, b) { return b.s - a.s; });
      return { x: topM[0].x, y: topM[0].y };
    }

    if (level === 'hard') {
      var top = scored.slice(0, 8);
      for (i = 0; i < top.length; i++) {
        var mv = top[i];
        board[mv.y][mv.x] = me;
        var opp = bestAttack(foe);
        board[mv.y][mv.x] = 0;
        mv.s = mv.s - opp * 0.72;
      }
      top.sort(function (a, b) { return b.s - a.s; });
      return { x: top[0].x, y: top[0].y };
    }

    if (level === 'entry') {
      if (Math.random() < 0.7) {
        var re = scored[(Math.random() * Math.min(scored.length, 20)) | 0];
        return { x: re.x, y: re.y };
      }
      var pe = scored[(Math.random() * Math.min(scored.length, 4)) | 0];
      return { x: pe.x, y: pe.y };
    }

    if (level === 'easy') {
      if (Math.random() < 0.45) {
        var r = scored[(Math.random() * Math.min(scored.length, 6)) | 0];
        return { x: r.x, y: r.y };
      }
      return { x: scored[0].x, y: scored[0].y };
    }

    var rnd = Math.random();
    var pick = rnd < 0.72 ? 0 : (rnd < 0.92 ? 1 : 2);
    if (pick >= scored.length) pick = 0;
    return { x: scored[pick].x, y: scored[pick].y };
  }

  function undo() {
    token++;
    thinking = false;
    if (over) {
      over = false;
      winner = 0;
      winLine = null;
      resultEl.hidden = true;
    }
    if (!moves.length) { setStatus(); draw(); return; }
    if (mode === 'ai') {
      while (moves.length) {
        var m1 = moves.pop();
        board[m1.y][m1.x] = 0;
        if ((moves.length % 2 === 0 ? BLACK : WHITE) === playerColor) break;
      }
    } else {
      var m2 = moves.pop();
      board[m2.y][m2.x] = 0;
    }
    turn = moves.length % 2 === 0 ? BLACK : WHITE;
    hover = null;
    setStatus();
    draw();
    if (mode === 'ai' && turn === aiColor) scheduleAI();
  }

  modeSeg.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button[data-mode]') : null;
    if (!b || b.classList.contains('on')) return;
    var btns = modeSeg.querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) btns[i].classList.remove('on');
    b.classList.add('on');
    resetGame();
  });

  sizeSeg.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button[data-size]') : null;
    if (!b || b.classList.contains('on')) return;
    var btns = sizeSeg.querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) btns[i].classList.remove('on');
    b.classList.add('on');
    resetGame();
  });

  levelEl.addEventListener('change', function () { level = levelEl.value; updateHint(); });
  sideSeg.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button[data-side]') : null;
    if (!b || b.classList.contains('on')) return;
    var btns = sideSeg.querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) btns[i].classList.remove('on');
    b.classList.add('on');
    resetGame();
  });
  undoBtn.addEventListener('click', undo);
  restartBtn.addEventListener('click', resetGame);
  againBtn.addEventListener('click', function () { resultEl.hidden = true; resetGame(); });

  canvas.addEventListener('pointermove', function (e) {
    if (e.pointerType === 'touch') return;
    hover = pointFromEvent(e);
    draw();
  });
  canvas.addEventListener('pointerleave', function () { hover = null; draw(); });
  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    if (over || thinking) return;
    var p = pointFromEvent(e);
    if (!p) return;
    playMove(p.x, p.y, false);
  });

  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(function () { resize(); }).observe(wrap);

  window.__gomokuDebug = {
    state: function () {
      return {
        N: N, mode: mode, level: level, turn: turn, over: over, thinking: thinking,
        playerColor: playerColor, aiColor: aiColor,
        moves: moves.length,
        last: moves.length ? moves[moves.length - 1] : null
      };
    },
    setLevel: function (v) {
      if (!LEVEL_TIPS[v]) return false;
      level = v; levelEl.value = v; updateHint();
      return true;
    },
    setSide: function (c) {
      var want = c === WHITE ? 2 : 1;
      var btns = sideSeg.querySelectorAll('button');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.toggle('on', btns[i].getAttribute('data-side') === String(want));
      }
      resetGame();
      return this.state();
    },
    reset: function () { resetGame(); return this.state(); },
    load: function (stones, side) {
      token++;
      over = false; thinking = false; winner = 0; winLine = null; hover = null;
      resultEl.hidden = true;
      makeBoard();
      moves = [];
      (stones || []).forEach(function (s) {
        if (!inb(s[0], s[1])) return;
        var c = s[2] || BLACK;
        board[s[1]][s[0]] = c;
        moves.push({ x: s[0], y: s[1], c: c });
      });
      turn = side || BLACK;
      setStatus();
      draw();
      return this.state();
    },
    ai: function () {
      var t0 = (window.performance || Date).now();
      var mv = chooseAIMove();
      return {
        x: mv ? mv.x : null,
        y: mv ? mv.y : null,
        ms: Math.round((window.performance || Date).now() - t0)
      };
    },
    play: function (x, y) { return playMove(x, y, false); }
  };

  resetGame();
})();
</script>
</body>
</html>
