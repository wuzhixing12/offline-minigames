<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>星团吞噬</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#060b16;color:#eaf2ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  #cv{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .hud{position:fixed;left:16px;top:12px;right:16px;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:#94a9c4;pointer-events:none;z-index:2}
  .hud b{color:#7ee0ff;font-size:16px;font-weight:600;margin-left:4px}
  .hud .best b{color:#ffd479}
  .hint{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);font-size:12px;color:#6b82a0;pointer-events:none;white-space:nowrap}
  @media (max-width:560px){
    .hint{white-space:normal;width:calc(100% - 36px);text-align:center;line-height:1.5;font-size:11px;bottom:8px}
  }
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,8,16,.84);z-index:3;text-align:center;padding:24px}
  .overlay.hide{display:none}
  .overlay h1{margin:0 0 8px;font-size:30px;letter-spacing:.08em;color:#c9f2ff}
  .overlay p{margin:0 0 20px;color:#8ea3bd;font-size:13px;line-height:1.8}
  .overlay button{border:1px solid rgba(126,224,255,.45);background:rgba(126,224,255,.12);color:#c8f3ff;padding:11px 30px;border-radius:999px;font-size:15px;cursor:pointer}
  .overlay button:active{transform:scale(.97)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud">
  <span>分数<b id="score">0</b></span>
  <span>体积<b id="mass">12</b></span>
  <span>排名<b id="rank">-</b></span>
  <span class="best">最高<b id="best">0</b></span>
</div>
<div class="hint">移动鼠标 / 手指：吃小星团，躲大猎手和红刺球；带名字的电脑玩家会抢食、互相吞噬</div>
<div class="overlay" id="over">
  <h1 id="ovTitle">星团吞噬</h1>
  <p id="ovSub">吃掉小星团来长大，躲开比你大的猎手。<br>红色刺球会扎掉比它大的任何星球——你和猎手越大越要绕开；比刺球小时可以贴着它躲。<br>带名字的电脑玩家会抢食、互相吞噬，也会追捕更小的目标；开局 5 秒安全期。</p>
  <button id="start" type="button">开始游戏</button>
  <div class="keys" style="margin-top:16px;font-size:11.5px;line-height:1.9;color:#5f7693">鼠标 / 手指移动 · 接触即吞噬 · 大地图自动跟随</div>
</div>
<script>
(function(){
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var scoreEl = document.getElementById('score');
  var massEl = document.getElementById('mass');
  var rankEl = document.getElementById('rank');
  var bestEl = document.getElementById('best');
  var over = document.getElementById('over');
  var ovTitle = document.getElementById('ovTitle');
  var ovSub = document.getElementById('ovSub');
  var btn = document.getElementById('start');

  var W = 0, H = 0, dpr = 1;
  var worldW = 0, worldH = 0;
  var cam = { x: 0, y: 0 };
  var player = null;
  var blobs = [];
  var food = [];
  var spikes = [];
  var parts = [];
  var floaters = [];
  var target = { x: 0, y: 0 };
  var running = false;
  var last = 0;
  var t0 = 0;
  var danger = 0;
  var calm = 0;
  var aiSpikeHits = 0;
  var shake = 0;
  var flash = 0;
  var MAX_R = 110, EAT_RATIO = 1.06;
  var BLOB_TARGET = 32, FOOD_TARGET = 240, SPIKE_TARGET = 18;
  var BOT_COUNT = 6;
  var BOT_NAMES = ['游猎者', '星盗', '深空客', '掠食者', '潮汐客', '陨星'];
  var BEST_KEY = 'tx_ballarena_best_v1';
  var best = 0;
  try { best = parseInt(localStorage.getItem(BEST_KEY), 10) || 0; } catch (e) { best = 0; }
  bestEl.textContent = best;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth || window.innerWidth;
    H = cv.clientHeight || window.innerHeight;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function rand(a, b){ return a + Math.random() * (b - a); }

  function spawnFood(){
    return { x: rand(10, worldW - 10), y: rand(10, worldH - 10), r: rand(1.1, 2.2), tw: rand(0, 6.2832) };
  }

  function makeSpike(){
    var roll = Math.random(), r;
    if (roll < 0.45) r = rand(8, 15);
    else if (roll < 0.78) r = rand(15, 27);
    else r = rand(27, 42);
    var pr = player ? player.r : 12;
    var bx = worldW / 2, by = worldH / 2, far = -1;
    for (var tries = 0; tries < 20; tries++){
      var tx = worldW > r * 2 ? rand(r + 12, worldW - r - 12) : worldW / 2;
      var ty = worldH > r * 2 ? rand(r + 12, worldH - r - 12) : worldH / 2;
      var ok = true;
      if (player && Math.hypot(tx - player.x, ty - player.y) < pr + r + 150) ok = false;
      for (var j = 0; j < spikes.length && ok; j++){
        if (Math.hypot(tx - spikes[j].x, ty - spikes[j].y) < spikes[j].r + r + 36) ok = false;
      }
      var td = player ? Math.hypot(tx - player.x, ty - player.y) : 1e9;
      if (td > far){ far = td; bx = tx; by = ty; }
      if (ok) break;
    }
    return { x: bx, y: by, r: r, rot: rand(0, 6.2832), spin: rand(-0.45, 0.45) };
  }

  function makeBlob(big, botName){
    var pr = player ? player.r : 12;
    var r, lo, hi, roll = Math.random();
    if (big){
      lo = Math.max(24, pr * 0.85);
      hi = Math.max(lo + 6, pr * 1.45);
      r = Math.min(118, rand(lo, hi));
    } else if (botName){
      r = rand(14, 24);
    } else if (roll < 0.34){
      r = rand(5, 10);
    } else if (roll < 0.78){
      lo = 10;
      hi = Math.max(18, pr * 0.7);
      r = rand(lo, hi);
    } else {
      lo = Math.max(18, pr * 0.75);
      hi = Math.max(lo + 6, pr * 1.15);
      r = Math.min(118, rand(lo, hi));
    }
    var spd = rand(16, 48);
    var dir = rand(0, 6.2832);
    var b = {
      r: r,
      hue: rand(160, 330),
      vx: Math.cos(dir) * spd,
      vy: Math.sin(dir) * spd,
      spd: spd,
      iframes: 0,
      bot: !!botName,
      name: botName || '',
      wander: 0,
      wx: Math.cos(dir),
      wy: Math.sin(dir)
    };
    var minD = Math.min(r + pr + 110, Math.max(140, Math.min(worldW, worldH) * 0.34));
    if (botName) minD = Math.max(minD, 380);
    var bx = 0, by = 0, far = -1;
    for (var tries = 0; tries < 16; tries++){
      var tx = worldW > r * 2 ? rand(r, worldW - r) : worldW / 2;
      var ty = worldH > r * 2 ? rand(r, worldH - r) : worldH / 2;
      var td = player ? Math.hypot(tx - player.x, ty - player.y) : 1e9;
      if (td > far){ far = td; bx = tx; by = ty; }
      if (td >= minD) break;
    }
    b.x = bx;
    b.y = by;
    return b;
  }

  function reset(){
    worldW = Math.max(W * 2.4, 1900);
    worldH = Math.max(H * 2.4, 1500);
    var vr = (worldW * worldH) / Math.max(1, W * H);
    FOOD_TARGET = Math.min(520, Math.max(150, Math.round(110 * vr)));
    BLOB_TARGET = Math.min(46, Math.max(20, Math.round(18 * Math.sqrt(vr))));
    SPIKE_TARGET = Math.min(30, Math.max(14, Math.round(13 * Math.sqrt(vr))));

    player = { x: worldW / 2, y: worldH / 2, r: 12, score: 0, pulse: 0, iframes: 0, hurt: 0 };
    target.x = player.x;
    target.y = player.y;
    cam.x = Math.max(0, Math.min(worldW - W, player.x - W / 2));
    cam.y = Math.max(0, Math.min(worldH - H, player.y - H / 2));

    blobs = [];
    for (var i = 0; i < BLOB_TARGET; i++) blobs.push(makeBlob(i < 4, i < BOT_COUNT ? BOT_NAMES[i] : ''));
    food = [];
    for (var j = 0; j < FOOD_TARGET; j++) food.push(spawnFood());
    spikes = [];
    for (var k = 0; k < SPIKE_TARGET; k++) spikes.push(makeSpike());
    aiSpikeHits = 0;
    parts = [];
    floaters = [];
    danger = 0;
    calm = 5;
    shake = 0;
    flash = 0;
    running = true;
    over.classList.add('hide');
    updateHud();
  }

  function updateHud(){
    if (!player) return;
    scoreEl.textContent = player.score;
    massEl.textContent = Math.round(player.r);
    var bigger = 0;
    for (var i = 0; i < blobs.length; i++) if (blobs[i].r > player.r * EAT_RATIO) bigger++;
    rankEl.textContent = (bigger + 1) + '/' + (blobs.length + 1);
    bestEl.textContent = best;
  }

  function saveBest(){
    if (player && player.score > best){
      best = player.score;
      bestEl.textContent = best;
      try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
    }
  }

  function burst(x, y, hue, n, power){
    for (var i = 0; i < n; i++){
      var a = rand(0, 6.2832), sp = rand(power * 0.25, power);
      parts.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: rand(0.3, 0.75), max: 0.75,
        r: rand(1.4, 4.2),
        hue: hue + rand(-18, 18)
      });
    }
    if (parts.length > 260) parts.splice(0, parts.length - 260);
  }

  function updateParts(dt){
    for (var i = parts.length - 1; i >= 0; i--){
      var p = parts[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      var damp = 1 - Math.min(0.9, dt * 2.8);
      p.vx *= damp;
      p.vy *= damp;
      p.life -= dt;
      if (p.life <= 0) parts.splice(i, 1);
    }
    for (var j = floaters.length - 1; j >= 0; j--){
      var f = floaters[j];
      f.y -= 30 * dt;
      f.life -= dt * 1.4;
      if (f.life <= 0) floaters.splice(j, 1);
    }
    if (shake > 0) shake = Math.max(0, shake - dt * 2.2);
  }

  function gameOver(){
    running = false;
    shake = 1;
    burst(player.x, player.y, 185, 42, 190);
    saveBest();
    ovTitle.textContent = '你输了 · 被吞噬';
    ovSub.innerHTML = '本局分数 ' + player.score + ' · 最高 ' + best + '<br>吃掉更小的星团可以继续长大';
    btn.textContent = '再来一局';
    over.classList.remove('hide');
  }

  function movePoint(x, y){ target.x = x + cam.x; target.y = y + cam.y; }

  cv.addEventListener('pointermove', function(e){
    var r = cv.getBoundingClientRect();
    movePoint(e.clientX - r.left, e.clientY - r.top);
  });
  cv.addEventListener('pointerdown', function(e){
    var r = cv.getBoundingClientRect();
    movePoint(e.clientX - r.left, e.clientY - r.top);
  });
  cv.addEventListener('touchmove', function(e){
    e.preventDefault();
    if (!e.touches.length) return;
    var r = cv.getBoundingClientRect();
    movePoint(e.touches[0].clientX - r.left, e.touches[0].clientY - r.top);
  }, { passive: false });

  function update(dt){
    if (!player) return;

    var dx = target.x - player.x, dy = target.y - player.y;
    var d = Math.hypot(dx, dy);
    if (d > 2){
      var speed = 258 - Math.min(150, Math.max(0, (player.r - 12) * 1.9));
      var step = Math.min(speed * dt, d);
      player.x += dx / d * step;
      player.y += dy / d * step;
    }
    player.x = Math.max(player.r, Math.min(worldW - player.r, player.x));
    player.y = Math.max(player.r, Math.min(worldH - player.r, player.y));
    if (player.pulse > 0) player.pulse = Math.max(0, player.pulse - dt * 3.2);
    if (player.iframes > 0) player.iframes = Math.max(0, player.iframes - dt);
    if (player.hurt > 0) player.hurt = Math.max(0, player.hurt - dt * 1.6);

    var cx = Math.max(0, Math.min(worldW - W, player.x - W / 2));
    var cy = Math.max(0, Math.min(worldH - H, player.y - H / 2));
    var ck = Math.min(1, dt * 7);
    cam.x += (cx - cam.x) * ck;
    cam.y += (cy - cam.y) * ck;

    for (var i = food.length - 1; i >= 0; i--){
      var f = food[i];
      if (Math.hypot(f.x - player.x, f.y - player.y) < player.r + (f.r || 1.6) + 3){
        player.r = Math.min(MAX_R, player.r + 0.16);
        player.score += 1;
        if (Math.random() < 0.3) burst(f.x, f.y, 195, 2, 34);
        food[i] = spawnFood();
      }
    }

    danger = 0;
    if (calm > 0) calm = Math.max(0, calm - dt);
    for (var k = 0; k < blobs.length; k++){
      var b = blobs[k];
      if (b.iframes > 0) b.iframes = Math.max(0, b.iframes - dt);
      var bdx = player.x - b.x, bdy = player.y - b.y;
      var bd = Math.hypot(bdx, bdy) || 1;
      var hunter = b.r > player.r * EAT_RATIO;
      var prey = b.r * EAT_RATIO < player.r;
      var dvx = b.vx, dvy = b.vy;

      if (b.bot){
        /* 电脑玩家：先躲威胁，再追猎物，再避刺，最后找食物 */
        var threatD = 1e9, threatX = 0, threatY = 0;
        var preyD = 1e9, preyX = 0, preyY = 0;
        var avoidD = 1e9, avoidX = 0, avoidY = 0;
        if (calm <= 0 && hunter && bd < 360){ threatD = bd; threatX = player.x; threatY = player.y; }
        else if (calm <= 0 && prey && bd < 420){ preyD = bd; preyX = player.x; preyY = player.y; }
        for (var m = 0; m < blobs.length; m++){
          if (m === k) continue;
          var ob = blobs[m];
          var od = Math.hypot(ob.x - b.x, ob.y - b.y);
          if (ob.r > b.r * EAT_RATIO){
            if (od < 360 && od < threatD){ threatD = od; threatX = ob.x; threatY = ob.y; }
          } else if (ob.r * EAT_RATIO < b.r){
            if (od < 420 && od < preyD){ preyD = od; preyX = ob.x; preyY = ob.y; }
          }
        }
        if (b.r > 14){
          for (var si = 0; si < spikes.length; si++){
            var sp0 = spikes[si];
            if (b.r <= sp0.r * 1.06) continue;
            var sd0 = Math.hypot(sp0.x - b.x, sp0.y - b.y);
            if (sd0 < 170 && sd0 < avoidD){ avoidD = sd0; avoidX = sp0.x; avoidY = sp0.y; }
          }
        }
        var foodD = 1e9, foodX = 0, foodY = 0;
        for (var fi = 0; fi < food.length; fi++){
          var ff = food[fi];
          var fdx = ff.x - b.x, fdy = ff.y - b.y;
          var fd2 = fdx * fdx + fdy * fdy;
          if (fd2 < 160000 && fd2 < foodD * foodD){ foodD = Math.sqrt(fd2); foodX = ff.x; foodY = ff.y; }
        }
        var baseSpd = Math.max(56, 176 - Math.min(112, Math.max(0, b.r - 10) * 1.3));
        threatD = Math.max(1, threatD);
        preyD = Math.max(1, preyD);
        avoidD = Math.max(1, avoidD);
        foodD = Math.max(1, foodD);
        if (threatD < 320){
          dvx = (b.x - threatX) / threatD * baseSpd * 1.35;
          dvy = (b.y - threatY) / threatD * baseSpd * 1.35;
        } else if (preyD < 400){
          dvx = (preyX - b.x) / preyD * baseSpd * 1.15;
          dvy = (preyY - b.y) / preyD * baseSpd * 1.15;
        } else if (avoidD < 170){
          dvx = (b.x - avoidX) / avoidD * baseSpd * 1.2;
          dvy = (b.y - avoidY) / avoidD * baseSpd * 1.2;
        } else if (foodD < 400){
          dvx = (foodX - b.x) / foodD * baseSpd * 0.85;
          dvy = (foodY - b.y) / foodD * baseSpd * 0.85;
        } else {
          b.wander -= dt;
          if (b.wander <= 0){
            b.wander = rand(1.4, 3.4);
            var wa = rand(0, 6.2832);
            b.wx = Math.cos(wa); b.wy = Math.sin(wa);
          }
          dvx = b.wx * baseSpd * 0.5;
          dvy = b.wy * baseSpd * 0.5;
        }
      } else if (bd < 280 && (hunter || prey)){
        var pull = hunter ? 1 : -1;
        var urgency = 1 - bd / 280;
        var sp = b.spd * (0.9 + urgency * 1.8);
        dvx = bdx / bd * sp * pull;
        dvy = bdy / bd * sp * pull;
      }

      var blend = Math.min(1, dt * 2.4);
      b.vx += (dvx - b.vx) * blend;
      b.vy += (dvy - b.vy) * blend;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      if (b.x < b.r || b.x > worldW - b.r){ b.vx *= -1; b.x = Math.max(b.r, Math.min(worldW - b.r, b.x)); }
      if (b.y < b.r || b.y > worldH - b.r){ b.vy *= -1; b.y = Math.max(b.r, Math.min(worldH - b.r, b.y)); }

      // 电脑玩家顺手吃掉碰到的食物
      if (b.bot){
        for (var fj = food.length - 1; fj >= 0; fj--){
          var f2 = food[fj];
          if (Math.hypot(f2.x - b.x, f2.y - b.y) < b.r + (f2.r || 1.6) + 2){
            b.r = Math.min(MAX_R, Math.sqrt(b.r * b.r + 1.1));
            food[fj] = spawnFood();
          }
        }
      }

      bdx = player.x - b.x;
      bdy = player.y - b.y;
      bd = Math.hypot(bdx, bdy);

      if (player.r > b.r * EAT_RATIO && bd < player.r - b.r * 0.45){
        var gain = b.r * b.r * 0.5;
        player.r = Math.min(MAX_R, Math.sqrt(player.r * player.r + gain));
        var bonus = b.bot ? 2.1 : 1.6;
        player.score += Math.round(b.r * bonus);
        player.pulse = 1;
        burst(b.x, b.y, b.hue, Math.min(24, 6 + Math.round(b.r / 2)), 70 + b.r * 2.2);
        floaters.push({ x: b.x, y: b.y, txt: (b.bot ? '吞噬 ' + b.name + ' +' : '+') + Math.round(b.r * bonus), life: 1, hue: b.hue });
        blobs[k] = makeBlob(false, b.bot ? b.name : '');
      } else if (calm <= 0 && b.r > player.r * EAT_RATIO && bd < b.r - player.r * 0.45){
        gameOver();
        return;
      }

      if (calm <= 0 && hunter && bd < 340){
        var dn = 1 - bd / 340;
        if (dn > danger) danger = dn;
      }
    }

    // 大球吃小球：电脑玩家与野生球都参与，被吃的球在远处重生
    for (var a = 0; a < blobs.length; a++){
      var A = blobs[a];
      if (!A) continue;
      for (var c = a + 1; c < blobs.length; c++){
        var B = blobs[c];
        if (!B) continue;
        var dd = Math.hypot(A.x - B.x, A.y - B.y);
        var eater = null, eaten = null, eatenIdx = -1;
        if (A.r > B.r * EAT_RATIO && dd < A.r - B.r * 0.45){ eater = A; eaten = B; eatenIdx = c; }
        else if (B.r > A.r * EAT_RATIO && dd < B.r - A.r * 0.45){ eater = B; eaten = A; eatenIdx = a; }
        if (!eater) continue;
        eater.r = Math.min(MAX_R, Math.sqrt(eater.r * eater.r + eaten.r * eaten.r * 0.5));
        burst(eaten.x, eaten.y, eaten.hue, Math.min(18, 5 + Math.round(eaten.r / 2)), 60 + eaten.r * 1.8);
        blobs[eatenIdx] = makeBlob(false, eaten.bot ? eaten.name : '');
        if (eatenIdx === a){ A = blobs[a]; c = blobs.length; }
      }
    }

    for (var s = 0; s < spikes.length; s++){
      var sp2 = spikes[s];
      sp2.rot += sp2.spin * dt;
      var spikeGone = false;

      if (player.iframes <= 0){
        var sd = Math.hypot(sp2.x - player.x, sp2.y - player.y);
        if (player.r > sp2.r * 1.06 && sd < player.r + sp2.r * 0.85){
          var penalty = Math.round(sp2.r * 1.4);
          player.r = Math.max(11, Math.sqrt(player.r * player.r * 0.8));
          player.score = Math.max(0, player.score - penalty);
          player.iframes = 0.8;
          player.hurt = 1;
          shake = Math.max(shake, 0.85);
          flash = 0.7;
          burst(sp2.x, sp2.y, 5, 26, 170);
          floaters.push({ x: player.x, y: player.y - player.r, txt: '被刺 -' + penalty, life: 1, hue: 2 });
          spikes[s] = makeSpike();
          spikeGone = true;
        }
      }

      if (!spikeGone){
        for (var bi2 = 0; bi2 < blobs.length; bi2++){
          var bb = blobs[bi2];
          if ((bb.iframes || 0) > 0) continue;
          if (bb.r <= sp2.r * 1.06) continue;
          var asd = Math.hypot(sp2.x - bb.x, sp2.y - bb.y);
          if (asd < bb.r + sp2.r * 0.85){
            bb.r = Math.max(5, Math.sqrt(bb.r * bb.r * 0.8));
            bb.iframes = 0.6;
            aiSpikeHits++;
            burst(sp2.x, sp2.y, 5, 16, 120);
            floaters.push({ x: bb.x, y: bb.y - bb.r - 4, txt: '被刺', life: 0.9, hue: 2 });
            spikes[s] = makeSpike();
            break;
          }
        }
      }
    }

    updateParts(dt);
    if (flash > 0) flash = Math.max(0, flash - dt * 2.4);
    updateHud();
  }

  function drawSpike(s){
    var n = s.r > 26 ? 14 : s.r > 16 ? 11 : 9;
    var hot = player && player.r > s.r * 1.06;
    ctx.save();
    ctx.globalAlpha = hot ? 1 : 0.72;
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);
    var i, a, rr;
    ctx.beginPath();
    for (i = 0; i < n * 2; i++){
      a = i / (n * 2) * 6.2832;
      rr = (i % 2 ? 0.66 : 1.16) * s.r;
      if (i === 0) ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
      else ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath();
    var grad = ctx.createRadialGradient(-s.r * .25, -s.r * .25, s.r * .1, 0, 0, s.r * 1.15);
    grad.addColorStop(0, '#ffc0a8');
    grad.addColorStop(.5, '#ff5f70');
    grad.addColorStop(1, '#7c1830');
    ctx.fillStyle = grad;
    ctx.shadowColor = hot ? 'rgba(255,70,90,.85)' : 'rgba(255,70,90,.35)';
    ctx.shadowBlur = s.r * (hot ? .85 : .4);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,225,220,.5)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }

  function draw(){
    ctx.fillStyle = '#060b16';
    ctx.fillRect(0, 0, W, H);

    var shx = 0, shy = 0;
    if (shake > 0){
      var sm = shake * 7;
      shx = rand(-sm, sm);
      shy = rand(-sm, sm);
    }

    var left = cam.x, top = cam.y, right = cam.x + W, bottom = cam.y + H;

    ctx.save();
    ctx.translate(-left + shx, -top + shy);

    ctx.strokeStyle = 'rgba(94,234,212,.05)';
    ctx.lineWidth = 1;
    var grid = 56;
    var gx0 = Math.floor(left / grid) * grid;
    for (var gx = gx0; gx <= right + grid; gx += grid){
      ctx.beginPath(); ctx.moveTo(gx, top - 10); ctx.lineTo(gx, bottom + 10); ctx.stroke();
    }
    var gy0 = Math.floor(top / grid) * grid;
    for (var gy = gy0; gy <= bottom + grid; gy += grid){
      ctx.beginPath(); ctx.moveTo(left - 10, gy); ctx.lineTo(right + 10, gy); ctx.stroke();
    }

    ctx.strokeStyle = 'rgba(94,234,212,.22)';
    ctx.lineWidth = 3;
    ctx.strokeRect(0, 0, worldW, worldH);
    ctx.strokeStyle = 'rgba(94,234,212,.06)';
    ctx.lineWidth = 14;
    ctx.strokeRect(-7, -7, worldW + 14, worldH + 14);

    var tw = t0 * 0.0022;
    for (var i = 0; i < food.length; i++){
      var f = food[i];
      if (f.x < left - 16 || f.x > right + 16 || f.y < top - 16 || f.y > bottom + 16) continue;
      var fa = 0.2 + 0.22 * (0.5 + 0.5 * Math.sin(tw + f.tw));
      ctx.fillStyle = 'rgba(160,220,255,' + fa.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r || 1.6, 0, 6.2832);
      ctx.fill();
    }

    for (var s = 0; s < spikes.length; s++){
      var sp = spikes[s];
      if (sp.x + sp.r * 1.2 < left - 10 || sp.x - sp.r * 1.2 > right + 10 ||
          sp.y + sp.r * 1.2 < top - 10 || sp.y - sp.r * 1.2 > bottom + 10) continue;
      drawSpike(sp);
    }

    ctx.shadowBlur = 0;
    for (var k = 0; k < blobs.length; k++){
      var b = blobs[k];
      if (b.x + b.r < left - 12 || b.x - b.r > right + 12 ||
          b.y + b.r < top - 12 || b.y - b.r > bottom + 12) continue;
      var grad = ctx.createRadialGradient(b.x - b.r * .3, b.y - b.r * .3, b.r * .15, b.x, b.y, b.r);
      grad.addColorStop(0, 'hsl(' + b.hue + ',90%,72%)');
      grad.addColorStop(1, 'hsl(' + b.hue + ',85%,38%)');
      ctx.shadowColor = 'hsla(' + b.hue + ',90%,60%,.55)';
      ctx.shadowBlur = b.r * .9;
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, 6.2832);
      ctx.fill();
      ctx.shadowBlur = 0;
      if (b.bot){
        ctx.save();
        ctx.strokeStyle = 'hsla(' + b.hue + ',95%,82%,.6)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r + 4, 0, 6.2832);
        ctx.stroke();
        ctx.restore();
        ctx.font = '600 10.5px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(228,244,255,.78)';
        ctx.fillText(b.name, b.x, b.y - b.r - 8);
        ctx.textAlign = 'start';
      }
      if (player && b.r > player.r * EAT_RATIO){
        ctx.save();
        ctx.strokeStyle = 'rgba(255,105,115,.5)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([7, 7]);
        ctx.lineDashOffset = -t0 * 0.03;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r + 5, 0, 6.2832);
        ctx.stroke();
        ctx.restore();
      }
    }

    for (var p = 0; p < parts.length; p++){
      var pt = parts[p];
      ctx.globalAlpha = Math.max(0, pt.life / pt.max);
      ctx.fillStyle = 'hsl(' + pt.hue + ',95%,68%)';
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.r, 0, 6.2832);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (player){
      var pr = player.r * (1 + player.pulse * 0.10);
      var pg = ctx.createRadialGradient(player.x - pr * .35, player.y - pr * .35, pr * .12, player.x, player.y, pr);
      pg.addColorStop(0, '#d9fbff');
      pg.addColorStop(.45, player.hurt > 0 ? '#ffb3a8' : '#5eead4');
      pg.addColorStop(1, player.hurt > 0 ? '#c2413f' : '#0ea5b7');
      ctx.shadowColor = player.hurt > 0 ? 'rgba(255,90,90,.85)' : 'rgba(94,234,212,.8)';
      ctx.shadowBlur = pr * 1.1;
      ctx.fillStyle = pg;
      ctx.beginPath();
      ctx.arc(player.x, player.y, pr, 0, 6.2832);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = player.hurt > 0 ? 'rgba(255,220,210,.9)' : 'rgba(220,255,255,.7)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(player.x, player.y, pr - 2.5, 0, 6.2832);
      ctx.stroke();
      if (player.iframes > 0){
        ctx.strokeStyle = 'rgba(255,120,120,.55)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(player.x, player.y, pr + 6 + Math.sin(t0 * 0.02) * 2, 0, 6.2832);
        ctx.stroke();
      }
    }

    ctx.textAlign = 'center';
    for (var q = 0; q < floaters.length; q++){
      var fl = floaters[q];
      ctx.globalAlpha = Math.max(0, fl.life);
      ctx.fillStyle = 'hsl(' + fl.hue + ',95%,72%)';
      ctx.font = '600 14px system-ui, sans-serif';
      ctx.fillText(fl.txt, fl.x, fl.y);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'start';

    ctx.restore();

    if (danger > 0){
      var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.72);
      vg.addColorStop(0, 'rgba(255,60,60,0)');
      vg.addColorStop(1, 'rgba(255,50,60,' + (danger * 0.2).toFixed(3) + ')');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
    }

    if (flash > 0){
      ctx.fillStyle = 'rgba(255,60,70,' + (flash * 0.16).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  window.__ballDebug = {
    info: function () {
      return {
        running: running,
        playerR: player ? player.r : 0,
        blobs: blobs.map(function (b) { return b.r; }),
        bots: blobs.filter(function (b) { return b.bot; }).map(function (b) {
          return { name: b.name, r: b.r, x: b.x, y: b.y };
        }),
        botCount: blobs.filter(function (b) { return b.bot; }).length,
        spikes: spikes.length,
        aiSpikeHits: aiSpikeHits
      };
    },
    step: function (dt) { update(dt || 0.016); return this.info(); },
    forceSpikeOnBlob: function (index) {
      var b = blobs[index || 0];
      if (!b) return null;
      var sp = { x: b.x, y: b.y, r: Math.max(8, b.r * 0.45), rot: 0, spin: 0 };
      spikes.push(sp);
      return { blobR: b.r, spikeR: sp.r, spikes: spikes.length };
    }
  };

  function frame(t){
    if (!t0) t0 = t;
    if (!last) last = t;
    var dt = Math.min(.05, (t - last) / 1000);
    last = t;
    if (running){
      update(dt);
      draw();
    } else if (player){
      updateParts(dt);
      if (flash > 0) flash = Math.max(0, flash - dt * 2.4);
      draw();
    }
    requestAnimationFrame(frame);
  }

  btn.addEventListener('click', reset);
  requestAnimationFrame(frame);
})();
</script>
</body>
