<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>雨夜疑云 · 物理破案</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06090e;color:#e8eef5;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;user-select:none;}
  #app{height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 0,rgba(60,110,140,.16),transparent 55%),#06090e;}
  .top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 14px;border-bottom:1px solid rgba(120,170,200,.14);background:rgba(6,10,16,.9);}
  .brand{display:flex;align-items:baseline;gap:9px;min-width:0;}
  .brand b{font-size:14px;letter-spacing:.14em;color:#e9f2f8;white-space:nowrap;}
  .brand span{font-size:10px;letter-spacing:.18em;color:#6d8fa5;white-space:nowrap;}
  .tools{display:flex;gap:7px;}
  .tools button{border:1px solid rgba(120,170,200,.24);background:rgba(255,255,255,.03);color:#b9cddb;border-radius:999px;padding:7px 11px;font:600 11.5px/1 inherit;cursor:pointer;white-space:nowrap;}
  .tools button:hover{border-color:rgba(121,214,208,.6);color:#d9f2ef;}

  #main{flex:1 1 auto;overflow-y:auto;padding:10px 12px max(14px,env(safe-area-inset-bottom));}
  .wrap{width:min(100%,760px);margin:0 auto;display:flex;flex-direction:column;gap:9px;}
  .casebar{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:2px 2px 0;}
  .casebar .l{min-width:0;}
  .casebar .k{font-size:9.5px;letter-spacing:.22em;color:#6d8fa5;}
  .casebar h2{margin:3px 0 0;font-size:clamp(17px,4.6vw,21px);letter-spacing:.06em;color:#f2f7fb;font-weight:700;}
  .casebar .place{font-size:11px;color:#8ba3b5;margin-top:2px;}
  .side{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px;}
  .prog{font:700 12px/1 ui-monospace,Consolas,monospace;color:#79d6d0;letter-spacing:.12em;border:1px solid rgba(121,214,208,.28);border-radius:999px;padding:6px 10px;background:rgba(121,214,208,.06);white-space:nowrap;}
  .score{font:700 10.5px/1 ui-monospace,Consolas,monospace;color:#e7c98f;letter-spacing:.1em;border:1px solid rgba(224,184,106,.25);border-radius:999px;padding:4px 8px;background:rgba(224,184,106,.06);white-space:nowrap;}

  .chapterStrip{display:flex;gap:6px;}
  .chSeg{flex:1;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px 9px;border-radius:8px;border:1px solid rgba(120,170,200,.16);background:rgba(255,255,255,.02);font-size:10px;color:#7f97a9;letter-spacing:.05em;min-width:0;}
  .chSeg b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chSeg span{font:700 9.5px/1 ui-monospace,monospace;color:#6d8fa5;}
  .chSeg.active{border-color:rgba(121,214,208,.42);background:rgba(121,214,208,.07);color:#cdeceb;}
  .chSeg.active span{color:#79d6d0;}
  .chSeg.done{border-color:rgba(224,184,106,.3);color:#d8c6a3;}
  .chSeg.done span{color:#e7c98f;}

  .board{position:relative;border-radius:14px;overflow:hidden;border:1px solid rgba(120,170,200,.18);box-shadow:0 18px 50px rgba(0,0,0,.5);background:#0a1018;}
  canvas{display:block;width:100%;height:auto;}
  .stamp{position:absolute;right:10px;top:10px;padding:4px 8px;border:1px solid rgba(224,184,106,.45);border-radius:4px;color:#e7c98f;font:700 9.5px/1 inherit;letter-spacing:.2em;transform:rotate(2deg);background:rgba(6,10,16,.5);pointer-events:none;}

  .evidence{display:flex;gap:9px;padding:9px 11px;border:1px solid rgba(224,184,106,.18);border-radius:10px;background:rgba(224,184,106,.05);font-size:12px;line-height:1.7;color:#cfc3a9;}
  .evidence b{flex:0 0 auto;color:#e7c98f;font-weight:700;font-size:10.5px;letter-spacing:.12em;padding-top:1px;}
  .evidence span{min-width:0;}

  .control{padding:8px 11px 7px;border:1px solid rgba(120,170,200,.16);border-radius:10px;background:rgba(255,255,255,.022);}
  .ctitle{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px;}
  .ctitle span{font-size:11px;color:#8ba3b5;letter-spacing:.08em;}
  .ctitle b{font:700 15px/1 ui-monospace,Consolas,monospace;color:#79d6d0;letter-spacing:.04em;}
  input[type=range]{width:100%;height:26px;margin:0;background:transparent;accent-color:#79d6d0;cursor:pointer;}
  input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:999px;background:linear-gradient(90deg,rgba(121,214,208,.55),rgba(121,214,208,.14));}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-8px;border-radius:50%;background:#d9f7f4;border:3px solid #2c6f6a;box-shadow:0 0 14px rgba(121,214,208,.5);}
  input[type=range]::-moz-range-track{height:5px;border-radius:999px;background:rgba(121,214,208,.3);}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#d9f7f4;border:3px solid #2c6f6a;}

  .actions{display:flex;flex-wrap:wrap;gap:7px;}
  .actions button{flex:1 1 0;min-width:86px;border:0;border-radius:10px;padding:11px 10px;font:700 13px/1 inherit;cursor:pointer;color:#04201e;background:linear-gradient(100deg,#8fe6e0,#68c4be);box-shadow:0 8px 20px rgba(104,196,190,.18);}
  .actions button.ghost{flex:0 1 auto;min-width:70px;padding:11px 13px;color:#b9cddb;background:rgba(255,255,255,.03);border:1px solid rgba(120,170,200,.22);box-shadow:none;}
  .actions button:hover{filter:brightness(1.06);}
  .actions button:disabled{opacity:.45;cursor:default;}

  .msg{min-height:42px;display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:9px;background:rgba(9,14,21,.8);border:1px solid rgba(120,170,200,.12);font-size:12px;line-height:1.6;color:#aebfcc;}
  .msg::before{content:"";flex:0 0 auto;width:3px;height:20px;border-radius:2px;background:linear-gradient(180deg,#79d6d0,#2c6f6a);}
  .msg b{color:#e8d3a4;font-weight:600;}
  .msg.flash{animation:flash .5s ease;}
  @keyframes flash{0%{background:rgba(121,214,208,.16)}100%{background:rgba(9,14,21,.8)}}

  .overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(3,6,10,.85);backdrop-filter:blur(4px);}
  .overlay.hide{display:none;}
  #dlg{z-index:60;}
  .panel{width:min(94vw,440px);max-height:88vh;overflow:auto;padding:20px 18px;border-radius:18px;border:1px solid rgba(120,170,200,.26);background:linear-gradient(165deg,#0e1720,#070c12);box-shadow:0 30px 90px rgba(0,0,0,.75);}
  .panel .kicker{font-size:9.5px;letter-spacing:.24em;color:#6d8fa5;margin-bottom:5px;}
  .panel h2{margin:0 0 6px;font-size:18px;letter-spacing:.06em;color:#f0f6fa;}
  .panel p{margin:7px 0;font-size:12.5px;line-height:1.8;color:#bccbd7;}
  .panel .hl{color:#e7c98f;}
  .panel .ok{color:#8fe6e0;}
  .panel .bad{color:#e08573;}
  .acts{display:flex;flex-direction:column;gap:8px;margin-top:15px;}
  .acts button{border:0;border-radius:10px;padding:12px 14px;font:700 13.5px/1.2 inherit;cursor:pointer;color:#04201e;background:linear-gradient(100deg,#8fe6e0,#68c4be);text-align:left;}
  .acts button.ghost{color:#bacbd7;background:rgba(255,255,255,.035);border:1px solid rgba(120,170,200,.24);}
  .acts button:disabled{opacity:.4;cursor:default;}
  .acts button:hover{filter:brightness(1.06);}

  .titlePanel{text-align:center;padding:26px 20px 22px;}
  .titlePanel h1{margin:10px 0 8px;font-size:clamp(30px,8vw,44px);letter-spacing:.12em;background:linear-gradient(100deg,#f2f8fb,#9fc6d8 55%,#e7c98f);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .titlePanel .sub{margin:0 auto 16px;max-width:350px;font-size:12.5px;line-height:1.9;color:#93a7b6;}
  .titlePanel .meta{margin-top:14px;font-size:9.5px;letter-spacing:.16em;color:#647c8d;line-height:1.8;}
  .titlePanel .best{margin-top:6px;font-size:10.5px;color:#8ba3b5;letter-spacing:.04em;}

  .diffRow{display:flex;gap:8px;justify-content:center;margin:2px 0 4px;}
  .chip{border:1px solid rgba(120,170,200,.28);background:rgba(255,255,255,.03);color:#a9c0cf;border-radius:999px;padding:8px 14px;font:600 11.5px/1 inherit;cursor:pointer;}
  .chip.active{border-color:rgba(121,214,208,.65);background:rgba(121,214,208,.12);color:#d9f2ef;}
  .chip:disabled{opacity:.45;cursor:default;}
  .diffNote{font-size:10px;color:#6d8fa5;line-height:1.6;margin-top:4px;}

  .suspect{padding:11px 12px;border-radius:10px;border:1px solid rgba(120,170,200,.18);background:rgba(255,255,255,.02);margin:7px 0;text-align:left;}
  .suspect b{display:block;font-size:12.5px;color:#eaf2f8;margin-bottom:3px;}
  .suspect span{font-size:11px;line-height:1.7;color:#8ba3b5;}
  .clueRow{display:flex;gap:8px;padding:8px 0;border-bottom:1px dashed rgba(120,170,200,.14);font-size:12px;line-height:1.7;color:#b9c9d5;}
  .clueRow:last-child{border-bottom:0;}
  .clueRow i{flex:0 0 auto;font-style:normal;font:700 10px/1 ui-monospace,monospace;color:#e7c98f;padding-top:3px;}

  .quote{padding:9px 11px;border-left:3px solid rgba(224,184,106,.7);background:rgba(224,184,106,.06);border-radius:0 8px 8px 0;color:#e8d3a4;font-size:12px;line-height:1.8;margin:8px 0;}
  .evCard{display:flex;gap:8px;padding:7px 9px;border:1px solid rgba(120,170,200,.14);border-radius:8px;background:rgba(255,255,255,.02);margin:5px 0;font-size:11px;line-height:1.6;color:#9fb4c4;}
  .evCard b{flex:0 0 18px;color:#e7c98f;font:700 11px/1.6 ui-monospace,monospace;}
  .evCard span{min-width:0;}

  .arcTop{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px;}
  .arcStat{flex:1 1 120px;padding:8px 10px;border:1px solid rgba(120,170,200,.16);border-radius:9px;background:rgba(255,255,255,.025);}
  .arcStat b{display:block;font:700 15px/1.3 ui-monospace,monospace;color:#e7c98f;}
  .arcStat span{font-size:9.5px;letter-spacing:.12em;color:#6d8fa5;}
  .arcH{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.16em;color:#6d8fa5;margin:14px 0 6px;}
  .arcGrid{display:flex;flex-direction:column;gap:5px;}
  .arcCase{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;border:1px solid rgba(120,170,200,.14);background:rgba(255,255,255,.02);color:#9fb4c4;border-radius:8px;padding:7px 9px;font:600 11.5px/1.3 inherit;cursor:pointer;}
  .arcCase b{font-weight:600;color:#c9d8e2;}
  .arcCase .stars{font-size:11px;color:#e7c98f;letter-spacing:.08em;white-space:nowrap;}
  .arcCase:disabled{opacity:.42;cursor:default;}
  .arcCase:not(:disabled):hover{border-color:rgba(121,214,208,.45);}
  .achRow{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed rgba(120,170,200,.1);font-size:11px;line-height:1.5;color:#6f8799;}
  .achRow:last-child{border-bottom:0;}
  .achRow b{flex:0 0 88px;color:#8299aa;font-size:10.5px;font-weight:600;}
  .achRow.on{color:#cfe3ea;}
  .achRow.on b{color:#e7c98f;}

  .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,10px);z-index:90;padding:9px 14px;border-radius:999px;border:1px solid rgba(224,184,106,.4);background:rgba(12,18,26,.96);color:#e7c98f;font-size:11.5px;letter-spacing:.06em;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;}
  .toast.on{opacity:1;transform:translate(-50%,0);}

  @media (max-width:420px){
    .brand span{display:none}
    .tools button{padding:6px 9px}
    .casebar h2{font-size:17px}
    .actions button{min-width:72px;font-size:12.5px}
    .chSeg{padding:5px 6px;font-size:9.5px}
  }
  @media (max-height:620px){
    .msg{min-height:36px}
    .panel{padding:16px 14px}
    .titlePanel{padding:18px 14px}
    .chapterStrip{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><b>雨夜疑云</b><span>PHYSICS DETECTIVE</span></div>
    <div class="tools">
      <button id="clueBtn" type="button">线索 0/15</button>
      <button id="menuBtn" type="button">菜单</button>
    </div>
  </header>

  <main id="main">
    <div class="wrap">
      <div class="casebar">
        <div class="l">
          <div class="k" id="caseKicker">CASE 01 · 运动学</div>
          <h2 id="caseName">坠落的距离</h2>
          <div class="place" id="casePlace">旧公寓 · 五楼书房</div>
        </div>
        <div class="side">
          <div class="prog" id="prog">01 / 15</div>
          <div class="score" id="scoreEl">0000</div>
        </div>
      </div>

      <div class="chapterStrip" id="chapterStrip"></div>

      <div class="board">
        <canvas id="cv" width="720" height="420"></canvas>
        <div class="stamp" id="stamp">现场重建</div>
      </div>

      <div class="evidence"><b>现场记录</b><span id="evidence"></span></div>

      <div class="control">
        <div class="ctitle"><span id="ctrlLabel">变量</span><b id="ctrlVal">0</b></div>
        <input id="slider" type="range" min="0" max="100" step="0.1" value="0">
      </div>

      <div class="actions">
        <button id="runBtn" type="button">运行模拟</button>
        <button id="checkBtn" type="button">比对证据</button>
        <button id="formulaBtn" type="button" class="ghost">公式</button>
        <button id="hintBtn" type="button" class="ghost">辅助</button>
      </div>

      <div class="msg" id="msg"><b>方法：</b>先读现场记录，再拖动变量，让模拟结果和物证对上。</div>
    </div>
  </main>
</div>

<div class="overlay hide" id="dlg">
  <div class="panel">
    <div class="kicker" id="dlgKicker">档案</div>
    <h2 id="dlgTitle">标题</h2>
    <div id="dlgBody"></div>
    <div class="acts" id="dlgActs"></div>
  </div>
</div>

<div class="overlay hide" id="titleBox">
  <div class="panel titlePanel">
    <div class="kicker">PHYSICS DETECTIVE · 15 CASES</div>
    <h1>雨夜疑云</h1>
    <p class="sub">三章十五处现场。雨停之前，把每一道公式都变成证据。</p>
    <div class="diffRow" id="diffRow"></div>
    <div class="acts" id="titleActs"></div>
    <div class="best" id="titleBest"></div>
    <div class="meta">15 个随机化案件 · 3 个章节 · 2 种难度 · 自动存档</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  var SAVE_KEY = 'rain_case_v2';
  var STATS_KEY = 'rain_stats_v1';
  var G = 9.8;

  /* ---------------- 工具 ---------------- */
  function rand(a, b, step) {
    step = step || 0.1;
    var n = Math.floor((b - a) / step + 1e-9);
    return a + Math.floor(Math.random() * (n + 1)) * step;
  }
  function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function shuffled(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pad(n, w) {
    var s = '' + n;
    while (s.length < w) s = '0' + s;
    return s;
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function starsText(n) {
    n = clamp(n || 0, 0, 3);
    return '★★★'.slice(0, n) + '☆☆☆'.slice(0, 3 - n);
  }
  function isPermN(o, n) {
    if (!Array.isArray(o) || o.length !== n) return false;
    var seen = {};
    for (var i = 0; i < n; i++) {
      var v = o[i];
      if (typeof v !== 'number' || v < 0 || v >= n || seen[v]) return false;
      seen[v] = 1;
    }
    return true;
  }
  function makeOrder(n) {
    var a = [];
    for (var i = 0; i < n; i++) a.push(i);
    return shuffled(a);
  }
  function mirrorSolution(targetX) {
    var S = { x: 650, y: 258 }, M = { x: 160, y: 204 };
    var dx = M.x - S.x, dy = M.y - S.y, il = Math.sqrt(dx * dx + dy * dy);
    dx /= il; dy /= il;
    var best = 16, bestErr = 1e9;
    for (var a = -10; a <= 50; a += 0.1) {
      var th = a * Math.PI / 180;
      var nx = Math.cos(th), ny = -Math.sin(th);
      var dn = dx * nx + dy * ny;
      var rx = dx - 2 * dn * nx, ry = dy - 2 * dn * ny;
      if (ry > -0.05) continue;
      var k = (48 - M.y) / ry;
      var xx = M.x + rx * k;
      var err = Math.abs(xx - targetX);
      if (err < bestErr) { bestErr = err; best = a; }
    }
    return { angle: best, err: bestErr };
  }

  /* ---------------- 案件 ---------------- */
  var CASES = [
    {
      id: 'c1', ch: 0, kicker: 'CASE 01 · 运动学', name: '坠落的距离', place: '旧公寓 · 五楼书房',
      ctrl: '坠落高度', unit: 'm', min: 6, max: 30, step: 0.1,
      formula: '水平抛出：x = v₀ × √(2h ÷ g)，取 g = 9.8 m/s²。',
      gen: function () {
        var floor = randInt(4, 7);
        var h = floor * 3 + 0.2;
        var v0 = rand(3.6, 4.6, 0.1);
        var x = v0 * Math.sqrt(2 * h / G);
        return {
          floor: floor, h: h, v0: v0, x: x, target: x, tol: 0.12,
          start: 20,
          evidence: '窗台碎片横向飞出，初速约 ' + v0.toFixed(1) + ' m/s；尸体落点距墙 ' + x.toFixed(2) + ' m。',
          q: '死者从哪一层坠落？',
          options: [(floor - 2) + ' 楼', floor + ' 楼', (floor + 1) + ' 楼'], answer: 1,
          explain: 't = ' + x.toFixed(2) + ' ÷ ' + v0.toFixed(1) + ' ≈ ' + (x / v0).toFixed(2) + ' s，h = ½ × 9.8 × t² ≈ ' + h.toFixed(1) + ' m。按每层 3 m，约为第 ' + floor + ' 层。',
          clue: '坠落高度对应 ' + floor + ' 楼。那是死者的书房，门锁完好，只有研究助理有备用钥匙。'
        };
      },
      metric: function (v, r) { return r.v0 * Math.sqrt(2 * v / G); },
      fmt: function (m) { return '落点 ' + m.toFixed(2) + ' m'; },
      valText: function (v) { return v.toFixed(1) + ' m'; },
      draw: 'd1'
    },
    {
      id: 'c2', ch: 0, kicker: 'CASE 02 · 摩擦', name: '二十三米的刹车痕', place: '滨河路 · 雨夜',
      ctrl: '碰撞前车速', unit: 'km/h', min: 30, max: 90, step: 0.2,
      formula: '刹车距离：L = v² ÷ (2μg)，v 以 m/s 计，μ = 0.6。',
      gen: function () {
        var v = randInt(54, 68);
        var L = Math.pow(v / 3.6, 2) / (2 * 0.6 * G);
        var over = v - 50;
        return {
          v: v, L: L, over: over, target: L, tol: 0.6,
          start: 40,
          evidence: '雨天路面摩擦系数约 0.6；监控测得刹车痕长 ' + L.toFixed(1) + ' m。',
          q: '这辆车是否超速？（该路段限速 50）',
          options: ['没有超速', '超速约 ' + over + ' km/h', '超速约 ' + (over + 14) + ' km/h'], answer: 1,
          explain: 'v = √(2 × 0.6 × 9.8 × ' + L.toFixed(1) + ') ≈ ' + (Math.sqrt(2 * 0.6 * G * L)).toFixed(1) + ' m/s ≈ ' + v + ' km/h。该路段限速 50。',
          clue: '黑色轿车在限速 50 的路段跑出约 ' + v + '。它的行车记录仪缺失了 17 分钟。'
        };
      },
      metric: function (v) { var s = v / 3.6; return s * s / (2 * 0.6 * G); },
      fmt: function (m) { return '滑痕 ' + m.toFixed(1) + ' m'; },
      valText: function (v) { return v.toFixed(1) + ' km/h'; },
      draw: 'd2'

    c15: { q: '这根撬棍能省多少力，主要取决于什么？', options: ['两段力臂的比例', '撬棍的颜色', '施力的速度'], answer: 0 }
  };

  function genRun(i) {
    var r = CASES[i].gen();
    if (Q2[CASES[i].id]) r.q2 = Q2[CASES[i].id];
    return r;
  }

  var CH = [
    { name: '第一章 · 雨夜', short: '一章 · 雨夜', range: [0, 4] },
    { name: '第二章 · 旧案', short: '二章 · 旧案', range: [5, 9] },
    { name: '第三章 · 终局', short: '三章 · 终局', range: [10, 14] }
  ];

  var IDX = {};
  for (var ci = 0; ci < CASES.length; ci++) IDX[CASES[ci].id] = ci;

  var FINAL = [
    {
      q: '那晚我一直在实验室，从没靠近过旧公寓。',
      correct: 'c3',
      pool: ['c3', 'c7', 'c9', 'c15'],
      ok: '镜架上的新划痕和指纹把你留在了走廊。你说的“没靠近”，不成立。',
      no: '这条证据和公寓现场没有直接关系，换一条。'
    },
    {
      q: '那辆车当晚一直停在车库，没出过城。',
      correct: 'c2',
      pool: ['c2', 'c6', 'c10', 'c12'],
      ok: '滨河路的刹车痕和缺失的十七分钟，说明车不仅出城，还超了速。',
      no: '这和车当晚在哪没有直接关系，换一条。'
    },
    {
      q: '河对岸的仓库只是放旧书，那晚我没去过。',
      correct: 'c5',
      pool: ['c5', 'c8', 'c11', 'c13'],
      ok: '枪声来自河对岸，枪响后仓库的灯熄灭。你在那里。',
      no: '仓库的灯和枪声，比这条线索更能说明问题。'
    }
  ];

  var ACH = [
    { id: 'first', name: '第一现场', desc: '完成第一个案件' },
    { id: 'ch1', name: '雨夜归案', desc: '完成第一章' },
    { id: 'ch2', name: '旧案重启', desc: '完成第二章' },
    { id: 'ch3', name: '十五案齐', desc: '归档全部十五个现场' },
    { id: 'perfectCase', name: '分毫不差', desc: '单个案件拿到三星' },
    { id: 'allStar', name: '完整案卷', desc: '全部案件三星' },
    { id: 'noHint', name: '只凭双手', desc: '全程不用辅助推算结案' },
    { id: 'perfectEnding', name: '雨停之后', desc: '终局对质三次全中' },
    { id: 'hardClear', name: '严苛侦探', desc: '在严苛模式下结案' },
    { id: 'practice', name: '重演现场', desc: '在档案室重演任意案件' }
  ];
  var ACH_BY_ID = {};
  for (var ai = 0; ai < ACH.length; ai++) ACH_BY_ID[ACH[ai].id] = ACH[ai];

  /* ---------------- 存档 ---------------- */
  var ST = null;
  var P = null;
  var P_RETURN = 0;
  var STATS = null;

  function defaultStats() {
    return {
      best: {
        standard: { score: 0, rank: '—', stars: 0 },
        hard: { score: 0, rank: '—', stars: 0 }
      },
      endings: {}, ach: {}, caseStars: {}, plays: 0
    };
  }
  function loadStats() {
    try {
      var d = JSON.parse(localStorage.getItem(STATS_KEY) || 'null');
      if (!d || typeof d !== 'object') return defaultStats();
      var base = defaultStats();
      if (d.best && d.best.standard) base.best.standard = d.best.standard;
      if (d.best && d.best.hard) base.best.hard = d.best.hard;
      base.endings = d.endings || {};
      base.ach = d.ach || {};
      base.caseStars = d.caseStars || {};
      base.plays = d.plays || 0;
      return base;
    } catch (e) { return defaultStats(); }
  }
  function saveStats() { try { localStorage.setItem(STATS_KEY, JSON.stringify(STATS)); } catch (e) {} }

  function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(ST)); } catch (e) {} }
  var saveT = 0;
  function saveSoon() { clearTimeout(saveT); saveT = setTimeout(save, 180); }

  function newRun(diff, countPlay) {
    ST = {
      idx: 0,
      diff: diff === 'hard' ? 'hard' : 'standard',
      cs: [],
      done: false,
      final: { round: 0, correct: 0, wrong: 0, firstTry: 0, done: false, ending: null, order: null, wrongPicks: [], fb: '' },
      t0: Date.now(),
      elapsed: 0
    };
    for (var i = 0; i < CASES.length; i++) {
      var run = genRun(i);
      ST.cs.push({
        run: run, solved: false, stars: 0, compares: 0, qWrong: 0,
        hint: false, qOrder: null, q2Order: null, q1pass: false, v: run.start
      });
    }
    if (countPlay) { STATS.plays = (STATS.plays || 0) + 1; saveStats(); }
    save();
  }

  function loadSave() {
    try {
      var d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
      if (!d || !Array.isArray(d.cs) || d.cs.length !== CASES.length) return false;
      ST = {
        idx: clamp(typeof d.idx === 'number' ? d.idx : 0, 0, CASES.length - 1),
        diff: d.diff === 'hard' ? 'hard' : 'standard',
        cs: [],
        done: !!d.done,
        final: d.final && typeof d.final.round === 'number' ? d.final : { round: 0, correct: 0, wrong: 0, firstTry: 0, done: false, ending: null, order: null, wrongPicks: [], fb: '' },
        t0: d.t0 || Date.now(),
        elapsed: d.elapsed || 0
      };
      for (var i = 0; i < CASES.length; i++) {
        var s = d.cs[i] || {};
        var run = s.run;
        if (!run || typeof run.target !== 'number' || typeof run.evidence !== 'string') run = genRun(i);
        else if (!run.q2 && Q2[CASES[i].id]) run.q2 = Q2[CASES[i].id];
        ST.cs.push({
          run: run,
          solved: !!s.solved,
          stars: clamp(s.stars || 0, 0, 3),
          compares: s.compares || 0,
          qWrong: s.qWrong || 0,
          hint: !!s.hint,
          qOrder: Array.isArray(s.qOrder) ? s.qOrder : null,
          q2Order: Array.isArray(s.q2Order) ? s.q2Order : null,
          q1pass: !!s.q1pass,
          v: typeof s.v === 'number' ? s.v : run.start
        });
      }
      if (!ST.final.wrongPicks) ST.final.wrongPicks = [];
      while (ST.idx < CASES.length - 1 && ST.cs[ST.idx].solved) ST.idx++;
      return true;
    } catch (e) { return false; }
  }

  function curState() { return P ? P : ST.cs[ST.idx]; }
  function curRun() { return P ? P.run : ST.cs[ST.idx].run; }
  function solvedCount() {
    var n = 0;
    for (var i = 0; i < ST.cs.length; i++) if (ST.cs[i].solved) n++;
    return n;
  }
  function allSolved() { return solvedCount() === CASES.length; }
  function totalStars() {
    var n = 0;
    for (var i = 0; i < ST.cs.length; i++) n += ST.cs[i].stars || 0;
    return n;
  }
  function caseScore(cs) {
    if (!cs || !cs.solved) return 0;
    return 40 + (cs.stars || 0) * 40 + (cs.qWrong === 0 ? 20 : 0) - (cs.hint ? 20 : 0);
  }
  function finalScore() {
    if (!ST.final || !ST.final.done) return 0;
    return (ST.final.firstTry || 0) * 40 + (ST.final.firstTry === 3 ? 40 : 0);
  }
  function totalScore() {
    var n = 0;
    for (var i = 0; i < ST.cs.length; i++) n += caseScore(ST.cs[i]);
    return n + finalScore();
  }
  function rankOf(score) {
    if (score >= 2500) return 'SS';
    if (score >= 2200) return 'S';
    if (score >= 1800) return 'A';
    if (score >= 1400) return 'B';
    return 'C';
  }
  function hasProgress() {
    if (!ST) return false;
    if (ST.final && (ST.final.round > 0 || ST.final.done)) return true;
    for (var i = 0; i < ST.cs.length; i++) if (ST.cs[i].solved) return true;
    return false;
  }
  function resumeIdx() {
    for (var i = 0; i < CASES.length; i++) if (!ST.cs[i].solved) return i;
    return CASES.length - 1;
  }
  function chapterCount(ch) {
    var r = CH[ch].range, n = 0;
    for (var i = r[0]; i <= r[1]; i++) if (ST.cs[i].solved) n++;
    return n;
  }
  function chapterDone(ch) { return chapterCount(ch) === 5; }

  /* ---------------- DOM ---------------- */
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var slider = document.getElementById('slider');
  var ctrlLabel = document.getElementById('ctrlLabel');
  var ctrlVal = document.getElementById('ctrlVal');
  var evidenceEl = document.getElementById('evidence');
  var msgEl = document.getElementById('msg');
  var dlg = document.getElementById('dlg');
  var dlgTitle = document.getElementById('dlgTitle');
  var dlgBody = document.getElementById('dlgBody');
  var dlgActs = document.getElementById('dlgActs');
  var dlgKicker = document.getElementById('dlgKicker');
  var titleBox = document.getElementById('titleBox');
  var toastEl = document.getElementById('toast');
  var toastT = 0;

  function toast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('on');
    clearTimeout(toastT);
    toastT = setTimeout(function () { toastEl.classList.remove('on'); }, 2300);
  }
  function unlock(id) {
    if (STATS.ach[id]) return;
    STATS.ach[id] = 1;
    saveStats();
    var a = ACH_BY_ID[id];
    if (a) toast('成就解锁 · ' + a.name);
  }

  /* ---------------- 界面 ---------------- */
  function say(html) {
    msgEl.innerHTML = html;
    msgEl.classList.remove('flash');
    void msgEl.offsetWidth;
    msgEl.classList.add('flash');
  }

  function renderChapterStrip() {
    var html = '';
    for (var i = 0; i < CH.length; i++) {
      var n = chapterCount(i);
      var active = !P && ST.idx >= CH[i].range[0] && ST.idx <= CH[i].range[1];
      var done = n === 5;
      html += '<div class="chSeg' + (active ? ' active' : '') + (done ? ' done' : '') + '">' +
        '<b>' + CH[i].short + '</b><span>' + n + '/5</span></div>';
    }
    document.getElementById('chapterStrip').innerHTML = html;
  }

  function updateHeader() {
    var c = CASES[ST.idx];
    document.getElementById('caseKicker').textContent = P ? 'REPLAY · 现场重演' : c.kicker;
    document.getElementById('caseName').textContent = c.name;
    document.getElementById('casePlace').textContent = c.place;
    document.getElementById('prog').textContent = P ? '练习' : pad(ST.idx + 1, 2) + ' / 15';
    document.getElementById('scoreEl').textContent = P ? '—' : pad(totalScore(), 4);
    document.getElementById('clueBtn').textContent = '线索 ' + solvedCount() + '/15';
    document.getElementById('stamp').textContent = P ? '练习现场' : '现场重建';
    renderChapterStrip();
  }

  function renderCase(n) {
    if (typeof n !== 'number' || n < 0 || n >= CASES.length) n = 0;
    ST.idx = n;
    var c = CASES[n], cs = curState(), run = curRun();
    updateHeader();
    slider.min = c.min;
    slider.max = c.max;
    slider.step = c.step;
    var val = typeof cs.v === 'number' ? clamp(cs.v, c.min, c.max) : run.start;
    slider.value = val;
    ctrlLabel.textContent = c.ctrl + '（' + c.unit + '）';
    ctrlVal.textContent = c.valText(val);
    evidenceEl.textContent = run.evidence;
    if (P) {
      say('<b>练习模式。</b>本局成绩不计入主线，但会更新档案里的最佳评价。拖动变量，让模拟结果对上物证。');
    } else {
      say('<b>' + c.name + '。</b>' + run.evidence + ' 拖动变量，让模拟结果对上物证。');
    }
    drawCase(val, 1);
    save();
  }

  slider.addEventListener('input', function () {
    var v = parseFloat(slider.value);
    var cs = curState();
    cs.v = v;
    ctrlVal.textContent = CASES[ST.idx].valText(v);
    drawCase(v, 1);
    saveSoon();
  });

  function runSim() {
    var start = performance.now();
    var my = ++animId;
    function step(now) {
      if (my !== animId) return;
      var t = Math.min(1, (now - start) / 1300);
      drawCase(parseFloat(slider.value), ease(t));
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  var animId = 0;
  function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  document.getElementById('runBtn').addEventListener('click', runSim);

  function tolerance(run) { return run.tol * ((ST.diff === 'hard' && !P) ? 0.62 : 1); }

  function compare() {
    var c = CASES[ST.idx], cs = curState(), run = curRun();
    var v = parseFloat(slider.value);
    var m = c.metric(v, run);
    var diff = Math.abs(m - run.target);
    if (!cs.solved) { cs.compares++; saveSoon(); }
    if (diff <= tolerance(run)) {
      if (cs.solved) {
        showSolved(c, true);
      } else {
        tone(760, 0.1, 'triangle', 0.05);
        showDeduction(c, cs, run);
      }
    } else {
      say('还差一点。当前是 <b>' + c.fmt(m) + '</b>，现场记录是 <b>' + c.fmt(run.target) + '</b>。继续调，别急。');
      tone(180, 0.09, 'sine', 0.03);
    }
    updateHeader();
  }
  document.getElementById('checkBtn').addEventListener('click', compare);

  function useHint() {
    var c = CASES[ST.idx], cs = curState(), run = curRun();
    if (cs.solved) { say('这起案件已经归档。'); return; }
    var lo = c.min, hi = c.max, bestV = lo, bestErr = Infinity;
    for (var i = 0; i <= 2000; i++) {
      var v = lo + (hi - lo) * i / 2000;
      var err = Math.abs(c.metric(v, run) - run.target);
      if (err < bestErr) { bestErr = err; bestV = v; }
    }
    cs.hint = true;
    slider.value = bestV;
    slider.dispatchEvent(new Event('input', { bubbles: true }));
    say('<b>辅助推算：</b>滑块已推到最接近物证的位置。本案件最高只能拿两星（严苛模式一星），结算分 -20。');
    tone(520, 0.08, 'sine', 0.04);
    save();
    updateHeader();
  }
  document.getElementById('hintBtn').addEventListener('click', useHint);

  /* ---------------- 弹窗 ---------------- */
  function dialog(title, body, actions, kicker, after) {
    dlgKicker.textContent = kicker || '档案';
    dlgTitle.textContent = title;
    dlgBody.innerHTML = body || '';
    dlgActs.innerHTML = '';
    (actions && actions.length ? actions : [{ label: '继续' }]).forEach(function (a) {
      var b = document.createElement('button');
      b.type = 'button';
      if (a.ghost) b.className = 'ghost';
      b.textContent = a.label;
      if (a.disabled) b.disabled = true;
      b.addEventListener('click', function () {
        if (a.disabled) return;
        if (a.keep) { if (a.fn) a.fn(); return; }
        closeDialog();
        if (a.fn) a.fn();
      });
      dlgActs.appendChild(b);
    });
    dlg.classList.remove('hide');
    if (after) after();
  }
  function closeDialog() { dlg.classList.add('hide'); }

  /* ---------------- 推断题 ---------------- */
  function showDeduction(c, cs, run) {
    if (cs.q1pass && run.q2) { showQ2(c, cs, run); return; }
    var body = '<p>模拟与物证吻合。</p><p class="hl">' + run.explain + '</p><p><b>物证：</b>' + run.clue + '</p>' +
      '<p style="margin-top:12px"><b>推断：</b>' + run.q + '</p>' +
      '<p style="font-size:11px;color:#8ba3b5;margin-top:2px">选项顺序每轮不同，按证据判断。</p>' +
      '<div id="askFb" style="min-height:16px;font-size:11.5px;color:#e08573;margin-top:4px"></div>';
    if (!isPermN(cs.qOrder, run.options.length)) cs.qOrder = makeOrder(run.options.length);
    var acts = cs.qOrder.map(function (oi, i) {
      return {
        label: String.fromCharCode(65 + i) + ' · ' + run.options[oi],
        keep: true,
        fn: function () {
          if (oi !== run.answer) {
            cs.qWrong++;
            save();
            var fb = document.getElementById('askFb');
            if (fb) fb.textContent = '不对。再看一眼上面的数据。';
            tone(160, 0.1, 'sine', 0.03);
            return;
          }
          closeDialog();
          tone(760, 0.1, 'triangle', 0.05);
          if (run.q2) {
            cs.q1pass = true;
            save();
            showQ2(c, cs, run);
          } else {
            finalizeCase();
          }
        }
      };
    });
    acts.push({ label: '再比对一次', ghost: true, fn: function () { closeDialog(); compare(); } });
    dialog('推断 · ' + c.name, body, acts, 'DEDUCTION');
  }

  function showQ2(c, cs, run) {
    var q2 = run.q2;
    if (!isPermN(cs.q2Order, q2.options.length)) cs.q2Order = makeOrder(q2.options.length);
    var body = '<p class="ok">第一问通过。</p><p>' + run.explain + '</p>' +
      '<p style="margin-top:12px"><b>追问：</b>' + q2.q + '</p>' +
      '<div id="askFb" style="min-height:16px;font-size:11.5px;color:#e08573;margin-top:4px"></div>';
    var acts = cs.q2Order.map(function (oi, i) {
      return {
        label: String.fromCharCode(65 + i) + ' · ' + q2.options[oi],
        keep: true,
        fn: function () {
          if (oi !== q2.answer) {
            cs.qWrong++;
            save();
            var fb = document.getElementById('askFb');
            if (fb) fb.textContent = '还不对。把两条线索放在一起看。';
            tone(160, 0.1, 'sine', 0.03);
            return;
          }
          closeDialog();
          tone(820, 0.12, 'triangle', 0.05);
          finalizeCase();
        }
      };
    });
    acts.push({ label: '再比对一次', ghost: true, fn: function () { closeDialog(); compare(); } });
    dialog('追问 · ' + c.name, body, acts, 'DEDUCTION');
  }

  function calcStars(cs) {
    var s = 3;
    if ((cs.compares || 0) > 1 || (cs.qWrong || 0) > 0) s = 2;
    if ((cs.compares || 0) > 3 || (cs.qWrong || 0) > 1) s = 1;
    if (cs.hint) s = Math.min(s, ST.diff === 'hard' ? 1 : 2);
    return clamp(s, 1, 3);
  }

  function finalizeCase() {
    var c = CASES[ST.idx], cs = curState();
    cs.solved = true;
    cs.stars = calcStars(cs);
    if (P) { practiceDone(c, cs); return; }
    save();
    updateHeader();
    if (c.id === 'c1') unlock('first');
    if (cs.stars === 3) unlock('perfectCase');
    if (allSolved() && totalStars() === CASES.length * 3) unlock('allStar');
    var r = CASES[ST.idx].ch;
    if (ST.idx === CH[0].range[1]) { chapterEnd(0); return; }
    if (ST.idx === CH[1].range[1]) { chapterEnd(1); return; }
    if (ST.idx === CASES.length - 1) { allClear(); return; }
    caseCleared(c, cs);
  }

  function caseCleared(c, cs) {
    var body = '<p class="ok">现场归档 · ' + starsText(cs.stars) + '</p>' +
      '<p>' + cs.run.clue + '</p>' +
      '<p style="font-size:11.5px;color:#8ba3b5">本案得分 ' + caseScore(cs) + '，累计侦查分 ' + totalScore() + '。</p>';
    var ni = resumeIdx();
    dialog('归档 · ' + c.name, body, [
      { label: '前往第 ' + (ni + 1) + ' 案', fn: function () { renderCase(ni); } },
      { label: '查看线索本', ghost: true, fn: clueBook }
    ], 'CASE CLEAR');
  }

  function chapterEnd(ch) {
    var body = '', title = '', acts = [];
    if (ch === 0) {
      title = '第一章完成 · 雨夜';
      body = '<p>五个现场拼在一起：五楼书房、滨河路、走廊、十字路口、河岸。它们指向同一辆黑色轿车。</p>' +
        '<p class="hl">但车牌是空的，车主栏只写着一个职位：研究助理。</p>' +
        '<p>你翻到旧案卷的最后一页，发现五年前也有一场雨，也有一个人从五楼坠下。那起案子，结得太快了。</p>';
      acts.push({ label: '进入第二章 · 旧案', fn: function () { renderCase(CH[1].range[0]); } });
      unlock('ch1');
    } else if (ch === 1) {
      title = '第二章完成 · 旧案';
      body = '<p>水塔、落地钟、卷帘门、水池、钢轨、配电间。五处旧案里的物理量，全部被人为改过。</p>' +
        '<p class="hl">改动它们的人很懂实验，也很清楚怎样让证据看起来“正常”。</p>' +
        '<p>你把研究助理的名字写在白板中央。还差最后五个现场，就能把整条证据链接上。</p>';
      acts.push({ label: '进入第三章 · 终局', fn: function () { renderCase(CH[2].range[0]); } });
      unlock('ch2');
    }
    acts.push({ label: '查看线索本', ghost: true, fn: clueBook });
    dialog(title, body, acts, 'CHAPTER CLEAR');
  }

  function allClear() {
    unlock('ch3');
    if (allSolved() && totalStars() === CASES.length * 3) unlock('allStar');
    dialog('十五案齐了',
      '<p>十五处现场，十五组被人动过的数值。现在只剩最后一件事：让他自己把话说漏。</p>' +
      '<p class="hl">终局对质：用三条最硬的物证，逐条推翻他的说法。</p>',
      [
        { label: '进入终局对质', fn: startFinale },
        { label: '再看看线索', ghost: true, fn: clueBook }
      ], 'ALL CLEAR');
  }

  function showSolved(c, again) {
    if (!again) return;
    var body = '<p>模拟与物证吻合。</p><p class="hl">' + curState().run.explain + '</p><p><b>物证：</b>' + curState().run.clue + '</p>';
    dialog('已归档 · ' + c.name, body, nextActions(), 'CASE CLEAR');
  }

  function nextActions() {
    var i = resumeIdx();
    if (allSolved()) return [{ label: '进入终局对质', fn: startFinale }];
    if (i === CASES.length - 1 && ST.cs[i].solved) return [{ label: '进入终局对质', fn: startFinale }];
    return [{ label: '继续调查 · 第 ' + (i + 1) + ' 案', fn: function () { renderCase(i); } }];
  }

  /* ---------------- 终局 ---------------- */
  function startFinale() {
    if (!allSolved()) { say('还有现场没有归档。'); return; }
    if (ST.final.done && ST.final.ending !== 'weak') { showReport(); return; }
    var body = '<p>询问室里只有一盏灯。沈默坐在对面，手指一直敲着桌面。</p>' +
      '<p>他会给出三句说法。每一句，你只能摆出一条物证。</p>' +
      '<p class="hl">选错不会立刻失败，但会让他抓住空隙。三次都对，才算完整结案。</p>';
    if (ST.final.done && ST.final.ending === 'weak') {
      body += '<p class="bad">上一次对质，证据链断在最后一环。你可以重新来一次。</p>';
    }
    dialog('终局对质', body, [
      {
        label: ST.final.done ? '重新对质' : '开始对质', fn: function () {
          if (ST.final.done) {
            ST.final = { round: 0, correct: 0, wrong: 0, firstTry: 0, done: false, ending: null, order: null, wrongPicks: [], fb: '' };
            ST.done = false;
            save();
          }
          finalRound();
        }
      },
      { label: '再看看线索', ghost: true, fn: clueBook }
    ], 'FINAL');
  }

  function finalRound() {
    var f = ST.final;
    if (f.done) { showReport(); return; }
    if (f.round >= FINAL.length) { finishGame(); return; }
    var st = FINAL[f.round];
    if (!isPermN(f.order, 4)) f.order = makeOrder(4);
    if (!Array.isArray(f.wrongPicks)) f.wrongPicks = [];
    var cards = '';
    for (var i = 0; i < 4; i++) {
      var id = st.pool[f.order[i]];
      var idx = IDX[id];
      cards += '<div class="evCard"><b>' + String.fromCharCode(65 + i) + '</b><span><b style="color:#c9d8e2">' +
        CASES[idx].name + '</b>：' + ST.cs[idx].run.clue + '</span></div>';
    }
    var body = '<p style="font-size:10px;letter-spacing:.18em;color:#6d8fa5">对质 ' + (f.round + 1) + ' / 3</p>' +
      '<div class="quote">沈默：“' + st.q + '”</div>' +
      '<p>选一条最能推翻这句话的物证：</p>' + cards +
      (f.fb ? '<p class="bad">' + f.fb + '</p>' : '') +
      '<div id="finFb" style="min-height:14px;font-size:11.5px;color:#e08573"></div>';
    var acts = [];
    for (var j = 0; j < 4; j++) {
      (function (pos) {
        var id2 = st.pool[f.order[pos]];
        var idx2 = IDX[id2];
        var disabled = f.wrongPicks.indexOf(pos) >= 0;
        acts.push({
          label: String.fromCharCode(65 + pos) + ' · ' + CASES[idx2].name,
          disabled: disabled,
          keep: true,
          fn: function () {
            if (id2 === st.correct) {
              if (f.wrongPicks.length === 0) f.firstTry++;
              f.correct++;
              f.fb = '';
              save();
              dialog('对质 · 命中', '<p class="ok">' + st.ok + '</p><p style="font-size:11.5px;color:#8ba3b5">他把手从桌面上收了回去。</p>', [
                {
                  label: f.round >= FINAL.length - 1 ? '听完最后一句' : '继续对质', fn: function () {
                    f.round++;
                    f.order = null;
                    f.wrongPicks = [];
                    f.fb = '';
                    save();
                    finalRound();
                  }
                }
              ], 'PRESSED');
            } else {
              f.wrongPicks.push(pos);
              f.wrong++;
              f.fb = st.no;
              save();
              finalRound();
              tone(150, 0.12, 'sine', 0.03);
            }
          }
        });
      })(j);
    }
    acts.push({ label: '暂停，回去看线索', ghost: true, fn: function () { save(); clueBook(); } });
    dialog('对质 · 第 ' + (f.round + 1) + ' 轮', body, acts, 'FINAL');
  }

  function finishGame() {
    var f = ST.final;
    if (f.done) { showReport(); return; }
    var first = f.firstTry || 0;
    var ending = first >= 3 ? 'perfect' : (first === 2 ? 'normal' : 'weak');
    f.done = true;
    f.ending = ending;
    ST.done = ending !== 'weak';
    if (ending !== 'weak') ST.elapsed = Math.max(1, Math.round((Date.now() - ST.t0) / 60000));
    save();
    var score = totalScore();
    var rank = rankOf(score);
    if (ending !== 'weak') {
      var key = ST.diff;
      var rec = STATS.best[key];
      if (score > rec.score) {
        rec.score = score; rec.rank = rank; rec.stars = totalStars(); rec.date = Date.now();
      }
      STATS.endings[ending] = 1;
      if (ending === 'perfect') unlock('perfectEnding');
      if (ST.diff === 'hard') unlock('hardClear');
      var noHint = true;
      for (var i = 0; i < ST.cs.length; i++) if (ST.cs[i].hint) { noHint = false; break; }
      if (noHint) unlock('noHint');
      saveStats();
    }
    updateHeader();
    showEnding(ending, score, rank);
  }

    var title = '', body = '', acts = [];
    if (ending === 'perfect') {
      title = '结案 · 雨停之后';
      body = '<p>沈默在第三次对质后沉默了很久。他把口袋里的仓库钥匙放在桌上。</p>' +

      acts.push({ label: '查看档案室', fn: showArchive });
    } else if (ending === 'normal') {
      title = '结案 · 雨没停';

        '<p>评价 <b class="hl">' + rank + '</b> · 侦查分 <b class="hl">' + score + '</b> · 用时 ' + (ST.elapsed || 0) + ' 分钟 · 三星 ' + totalStars() + '/45</p>' +
        '<p style="font-size:11.5px;color:#8ba3b5">三句对质全部一次选中，可以解锁隐藏结案。</p>';

    } else {

        '<p class="hl">“下次，把三条都带来。”</p>' +

  /* ---------------- 音效 ---------------- */
  var actx = null;
  function tone(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.value = vol || 0.04;
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }

  /* ---------------- 绘制 ---------------- */
  function bg(top, bottom) {
    var gr = ctx.createLinearGradient(0, 0, 0, 420);
    gr.addColorStop(0, top);

      for (var i = 0; i < order.length; i++) {

      renderCase(CASES.length - 1);
    },
    get dialogOpen() { return !dlg.classList.contains('hide'); }
  };
})();
</script>
</body>
