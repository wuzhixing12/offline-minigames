<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<title>服务器求生 · ON-CALL</title>
<style>
  :root{
    --bg:#05080f;--panel:#0a1220;--text:#e9f2ff;--muted:#8ea4c2;--line:rgba(148,163,184,.16);
    --cyan:#38e8ff;--green:#5ce6a8;--amber:#ffd166;--rose:#ff6b85;--violet:#a78bfa;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{margin:0;overflow:hidden;color:var(--text);background:var(--bg);
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;user-select:none;touch-action:none;
    display:flex;justify-content:center;}
  #wrap{width:100%;max-width:1000px;height:100%;display:flex;flex-direction:column;padding:9px 12px 7px;position:relative;}
  header{display:flex;align-items:center;gap:8px;flex:0 0 auto;z-index:4;flex-wrap:nowrap;}
  .brand{font-weight:800;font-size:16px;letter-spacing:.05em;white-space:nowrap;}
  .brand b{color:var(--rose);}
  .brand small{display:block;font-size:9px;color:var(--muted);letter-spacing:.2em;font-weight:500;}
  .hud{margin-left:auto;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;flex-wrap:nowrap;}
  .trust{display:flex;gap:3px;align-items:center;}
  .trust i{width:12px;height:12px;background:var(--rose);
    clip-path:polygon(50% 100%,0 38%,0 16%,16% 0,36% 0,50% 15%,64% 0,84% 0,100% 16%,100% 38%);}
  .trust i.off{background:rgba(255,255,255,.12);}
  .meter{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);}
  .meter .bar{width:64px;height:6px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;}
  .meter .bar i{display:block;height:100%;width:100%;border-radius:99px;transition:width .2s linear;}
  #powerFill{background:linear-gradient(90deg,#38e8ff,#5ce6a8);}
  #loadFill{background:linear-gradient(90deg,#5ce6a8,#ffd166,#ff6b85);}
  #clock{font-size:13px;font-weight:700;color:var(--text);}
  #soundBtn{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);
    width:30px;height:30px;border-radius:9px;font-size:13px;cursor:pointer;flex:0 0 auto;}
  #soundBtn.on{color:var(--cyan);border-color:rgba(56,232,255,.35);}
  #stage{position:relative;flex:1 1 auto;min-height:0;margin-top:7px;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;border-radius:14px;background:#060b14;
    box-shadow:0 0 0 1px rgba(56,232,255,.12),0 24px 60px -26px #000;cursor:pointer;}
  #controls{flex:0 0 auto;display:flex;gap:8px;padding:8px 2px 0;}
  .act{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 8px;border-radius:11px;
    border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);font-family:inherit;
    font-size:13px;font-weight:700;cursor:pointer;position:relative;overflow:hidden;transition:.15s;}
  .act small{font-size:10px;font-weight:500;color:var(--muted);}
  .act .k{position:absolute;right:7px;top:4px;font-size:9px;color:#5f7391;font-weight:500;}
  .act:hover{border-color:rgba(56,232,255,.4);background:rgba(56,232,255,.07);}
  .act:disabled{opacity:.4;cursor:not-allowed;}
  .act.cool{border-color:rgba(92,230,168,.22);}
  .act .cd{position:absolute;left:0;bottom:0;height:2px;background:var(--cyan);width:0;}
  #hint{flex:0 0 auto;text-align:center;font-size:10.5px;color:#5f7391;padding:5px 0 1px;}
  .overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:6;
    background:rgba(3,6,12,.8);backdrop-filter:blur(6px);border-radius:14px;padding:14px;}
  .overlay.show{display:flex;}
  .panel{width:min(380px,94%);text-align:center;background:linear-gradient(180deg,rgba(17,26,46,.98),rgba(6,10,18,.99));
    border:1px solid rgba(255,107,133,.24);border-radius:16px;padding:20px 18px;box-shadow:0 26px 70px rgba(0,0,0,.62);}
  .panel .kicker{font-size:10px;letter-spacing:.3em;color:var(--rose);}
  .panel .big{font-size:25px;font-weight:800;margin:5px 0 6px;}
  .panel p{margin:5px 0;font-size:12.5px;color:var(--muted);line-height:1.75;}
  .panel .keys{font-size:11.5px;color:#94a3b8;background:rgba(255,255,255,.035);border:1px solid var(--line);
    border-radius:10px;padding:9px 10px;margin:11px 0 13px;line-height:1.9;text-align:left;}
  .panel .keys b{color:var(--text);}
  .panel .scoreline{font-size:12.5px;color:var(--muted);margin:10px 0 13px;line-height:1.8;}
  .panel .scoreline b{color:var(--cyan);font-size:18px;}
  button.primary{width:100%;border:0;border-radius:11px;padding:11px 14px;font-size:14px;font-weight:700;
    color:#25040b;background:linear-gradient(180deg,#ff9db0,#ff5570);cursor:pointer;font-family:inherit;
    box-shadow:0 10px 26px -10px rgba(255,85,112,.75);}
  button.primary:active{transform:translateY(1px);}
  .toast{position:absolute;left:50%;top:52px;transform:translateX(-50%) translateY(-6px);z-index:8;
    background:rgba(10,16,28,.94);border:1px solid rgba(255,107,133,.3);color:var(--text);
    font-size:12px;padding:7px 14px;border-radius:99px;opacity:0;pointer-events:none;transition:.22s;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  @media (max-width:700px){
    .brand small{display:none}.brand{font-size:14px}
    .meter span{display:none}
    .meter .bar{width:44px}
    #clock{font-size:12px}
    .trust i{width:9px;height:12px}
    #hint{display:none}
  }
  @media (max-height:590px){#hint{display:none}}
</style>

<style id="tx-space">
/* tx-space: short landscape play-space boost */
@media (max-height:560px) and (orientation:landscape){
  #wrap{max-width:none;height:100%;display:grid;grid-template-columns:minmax(0,1fr) 244px;
    grid-template-rows:auto 1fr;grid-template-areas:"stage header" "stage controls";
    padding:5px 8px;gap:6px 10px}
  header{grid-area:header;flex-wrap:wrap;gap:5px;align-content:flex-start}
  .brand{width:100%;font-size:13px}
  .brand small{display:none}
  .hud{margin-left:0;width:100%;flex-wrap:wrap;gap:5px}
  .meter .bar{width:52px}
  .trust i{width:10px;height:13px}
  #soundBtn{width:26px;height:26px}
  #stage{grid-area:stage;margin-top:0;height:100%;min-height:0}
  #controls{grid-area:controls;flex-direction:column;gap:6px;padding:0}
  .act{padding:9px 6px;font-size:12px}
  #hint{display:none}
  #stage .overlay{padding:8px}
  .panel{padding:14px 16px 12px}
  .panel .kicker{font-size:9px}
  .panel .big{font-size:21px;margin:2px 0 4px}
  .panel p{font-size:11.5px;line-height:1.55;margin:4px 0}
  .panel .keys{padding:7px 9px;margin:7px 0 9px;font-size:10.5px;line-height:1.65}
  button.primary{padding:9px 12px;font-size:13px}
}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div class="brand"><b>服务器求生</b><small>ON-CALL · NIGHT SHIFT</small></div>
    <div class="hud">
      <div class="trust" id="trust" title="SLA 信任"></div>
      <div class="meter"><span>电力</span><div class="bar"><i id="powerFill"></i></div></div>
      <div class="meter"><span>负载</span><div class="bar"><i id="loadFill"></i></div></div>
      <div class="meter"><span>分数</span><b id="score" style="font-size:12px;color:var(--text)">0</b></div>
      <div id="clock">00:00</div>
      <button id="soundBtn" class="on" type="button" aria-label="音效开关">♪</button>
    </div>
  </header>
  <div id="stage">
    <canvas id="game"></canvas>
    <div class="overlay show" id="screenStart">
      <div class="panel">
        <div class="kicker">INCIDENT RESPONSE · 180s</div>
        <div class="big">服务器求生</div>
        <p>六台机柜正在发热，告警随时会亮。<br>撑过 180 秒，别让 SLA 崩掉。</p>
        <div class="keys">
          <b>点击机柜 / 按 1–6</b>：处理告警或手动降温<br>
          <b>E 扩容</b>：花电力降低全局负载<br>
          <b>Q 全机冷却</b>：所有机柜降温<br>
          告警超时、机柜过热都会扣信任；扣完 3 点就下班失败
        </div>
        <button class="primary" id="startBtn" type="button">开始值班</button>
      </div>
    </div>
    <div class="overlay" id="screenPause">
      <div class="panel">
        <div class="big">值班暂停</div>
        <p>告警也暂停了，喝口水。</p>
        <button class="primary" id="resumeBtn" type="button">继续</button>
      </div>
    </div>
    <div class="overlay" id="screenOver">
      <div class="panel">
        <div class="big" id="overTitle">SLA 崩溃</div>
        <div class="scoreline">坚持 <b id="finalTime">0 秒</b><br><span id="finalNote"></span></div>
        <button class="primary" id="againBtn" type="button">重新值班</button>
      </div>
    </div>
    <div class="toast" id="toast"></div>
  </div>
  <div id="controls">
    <button class="act" id="expandBtn" type="button"><span class="k">E</span>扩容 <small>−20 负载 · 20 电</small><i class="cd" id="expandCd"></i></button>
    <button class="act cool" id="coolBtn" type="button"><span class="k">Q</span>全机冷却 <small>−25℃ · 25 电</small><i class="cd" id="coolCd"></i></button>
  </div>
  <div id="hint">点击机柜处理告警　·　空闲机柜点一下可手动降温　·　E 扩容　·　Q 全机冷却　·　P 暂停</div>
</div>
<script>
(function () {
  'use strict';
  var cvs = document.getElementById('game');
  var ctx = cvs.getContext('2d');
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage');
  var W = 900, H = 600, DPR = 1;
  var state = 'start';
  var GOAL = 180;
  var time = 0, score = 0, trust = 3, power = 100, load = 26;
  var issueTimer = 4, spawnT = 3.5;
  var expandCd = 0, coolCd = 0;
  var servers = [], ripples = [], floats = [], sparks = [];
  var hover = -1, time0 = 0, tGlobal = 0;
  var cards = [];
  var soundOn = loadNum('server.sound', 1) === 1;
  var toastTimer = 0;

  var ISSUES = {
    heat:  { name: '散热告警', icon: '🌡', color: '#ff9f45', dur: 7.5 },
    disk:  { name: '磁盘故障', icon: '💽', color: '#ffd166', dur: 8.5 },
    net:   { name: '网络抖动', icon: '📡', color: '#a78bfa', dur: 7 },
    ddos:  { name: '流量攻击', icon: '🛡', color: '#ff6b85', dur: 6.5 },
    volt:  { name: '电源告警', icon: '⚡', color: '#38e8ff', dur: 7 }
  };
  var ISSUE_KEYS = ['heat', 'disk', 'net', 'ddos', 'volt'];

  function loadNum(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : parseFloat(v); } catch (e) { return d; } }
  function saveNum(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }

  /* ---------- audio ---------- */
  var ac = null;
  function audio() {
    if (!soundOn) return null;
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
    if (ac && ac.state === 'suspended') { try { ac.resume(); } catch (e) {} }
    return ac;
  }
  function tone(f, dur, type, vol, slide) {
    var a = audio(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f, a.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), a.currentTime + dur);
    g.gain.setValueAtTime(vol == null ? 0.035 : vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + dur + 0.01);
  }
  function sfxAlarm() { tone(880, 0.07, 'square', 0.026); setTimeout(function(){ tone(660, 0.09, 'square', 0.024); }, 90); }
  function sfxFix() { tone(520, 0.06, 'sine', 0.045, 780); setTimeout(function(){ tone(780,0.08,'sine',0.04,1040); },60); }
  function sfxCrash() { tone(120, 0.4, 'sawtooth', 0.07, 45); setTimeout(function(){ tone(80,0.35,'square',0.05,35); },120); }
  function sfxCool() { tone(700, 0.18, 'sine', 0.04, 240); }
  function sfxBad() { tone(160, 0.16, 'square', 0.045, 100); }

  /* ---------- setup ---------- */
  function makeServers() {
    servers = [];
    for (var i = 0; i < 6; i++) {
      servers.push({
        id: i, name: 'NODE-' + ('0' + (i + 1)).slice(-2),
        temp: 42 + Math.random() * 10, load: 25 + Math.random() * 15,
        seed: Math.random() * 10, issue: null, issueT: 0, issueMax: 1,
        down: 0, flash: 0, fixGlow: 0
      });
    }
  }
  function startGame() {
    time = 0; score = 0; trust = 3; power = 100; load = 26;
    issueTimer = 5; spawnT = 3.2; expandCd = 0; coolCd = 0;
    ripples = []; floats = []; sparks = [];
    makeServers(); layoutCards();
    state = 'playing';
    hideAll(); syncHud();
    showToast('值班开始，盯住六台机柜');
    tone(440, 0.1, 'sine', 0.04, 660);
  }
  function layoutCards() {
    var cols = W < 560 ? 2 : 3;
    var rows = Math.ceil(6 / cols);
    var pad = 12, gap = 12;
    var cw = (W - pad * 2 - gap * (cols - 1)) / cols;
    var ch = (H - pad * 2 - gap * (rows - 1)) / rows;
    cards = [];
    for (var i = 0; i < 6; i++) {
      var r = Math.floor(i / cols), c = i % cols;
      cards.push({ x: pad + c * (cw + gap), y: pad + r * (ch + gap), w: cw, h: ch });
    }
  }
  function resize() {
    var r = stage.getBoundingClientRect();
    W = Math.max(320, Math.floor(r.width - 2));
    H = Math.max(200, Math.floor(r.height - 2));
    cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
    DPR = Math.min(2.5, window.devicePixelRatio || 1);
    cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layoutCards();
  }

  function show(id) { hideAll(); $(id).classList.add('show'); }
  function hideAll() { ['screenStart','screenPause','screenOver'].forEach(function(i){ $(i).classList.remove('show'); }); }
  function togglePause() {
    if (state === 'playing') { state = 'paused'; show('screenPause'); }
    else if (state === 'paused') { state = 'playing'; hideAll(); }
  }
  var toastTimer2 = 0;
  function showToast(msg) {
    var el = $('toast'); el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer2);
    toastTimer2 = setTimeout(function(){ el.classList.remove('show'); }, 2200);
  }

  /* ---------- game logic ---------- */
  function spawnIssue() {
    var candidates = [];
    for (var i = 0; i < servers.length; i++) {
      var s = servers[i];
      if (!s.issue && s.down <= 0) candidates.push(i);
    }
    if (!candidates.length) return;
    var active = 0;
    for (i = 0; i < servers.length; i++) if (servers[i].issue) active++;
    if (active >= 3) return;
    var idx = candidates[(Math.random() * candidates.length) | 0];
    var key = ISSUE_KEYS[(Math.random() * ISSUE_KEYS.length) | 0];
    var def = ISSUES[key];
    var s = servers[idx];
    s.issue = key;
    s.issueMax = def.dur;
    s.issueT = def.dur;
    s.flash = 1;
    sfxAlarm();
    addFloat(def.icon + ' ' + def.name, cardCenter(idx).x, cardCenter(idx).y - 20, def.color);
  }
  function cardCenter(i) {
    var c = cards[i] || { x: 0, y: 0, w: 100, h: 100 };
    return { x: c.x + c.w / 2, y: c.y + c.h / 2 };
  }

  function failIssue(s) {
    var def = ISSUES[s.issue];
    s.issue = null;
    s.issueT = 0;
    s.down = 4.5;
    s.temp = Math.min(100, s.temp + 12);
    trust--;
    score = Math.max(0, score - 30);
    sfxCrash();
    addFloat('SLA -1', cardCenter(s.id).x, cardCenter(s.id).y - 16, '#ff6b85');
    showToast(s.name + ' 的' + def.name + '处理超时');
    burst(cardCenter(s.id).x, cardCenter(s.id).y, '#ff6b85', 20, 170, 0.8);
    if (trust <= 0) endGame(false);
  }
  function overheat(s) {
    s.down = 4;
    s.temp = 74;
    trust--;
    score = Math.max(0, score - 40);
    sfxCrash();
    addFloat('过热宕机', cardCenter(s.id).x, cardCenter(s.id).y - 16, '#ff9f45');
    showToast(s.name + ' 过热宕机了');
    burst(cardCenter(s.id).x, cardCenter(s.id).y, '#ff9f45', 26, 200, 0.9);
    if (trust <= 0) endGame(false);
  }
  function burst(x, y, color, n, spd, life) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * 6.2832, v = (0.3 + Math.random()) * spd;
      sparks.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30,
        life: life * (0.5 + Math.random()), max: life, color: color, r: 1 + Math.random() * 2 });
    }
  }
  function addFloat(text, x, y, color) {
    floats.push({ text: text, x: x, y: y, color: color, t: 0 });
  }

  function poke(i) {
    if (state !== 'playing') return;
    var s = servers[i];
    if (!s) return;
    var c = cardCenter(i);
    ripples.push({ x: c.x, y: c.y, t: 0, color: s.issue ? '#ffd166' : '#38e8ff' });
    if (s.down > 0) {
      if (power >= 10) {
        power -= 10; s.down = 0; s.temp = Math.min(65, s.temp);
        s.flash = 0.6; score += 40;
        sfxFix(); addFloat('重启完成 +40', c.x, c.y - 12, '#5ce6a8');
        burst(c.x, c.y, '#5ce6a8', 12, 120, 0.6);
      } else { sfxBad(); showToast('电力不足，无法重启'); }
      return;
    }
    if (s.issue) {
      var def = ISSUES[s.issue];
      if (power < 5) { sfxBad(); showToast('电力不足，无法处理告警'); return; }
      power -= 5;
      s.issue = null; s.issueT = 0; s.fixGlow = 0.7;
      score += 100;
      sfxFix();
      addFloat('已修复 +100', c.x, c.y - 12, '#5ce6a8');
      burst(c.x, c.y, def.color, 14, 140, 0.6);
      return;
    }
    // 空闲：手动降温
    if (power < 2.5) { sfxBad(); return; }
    power -= 2.5;
    s.temp = Math.max(22, s.temp - 13);
    s.fixGlow = 0.4;
    score += 5;
    sfxCool();
    addFloat('−13℃', c.x, c.y - 12, '#38e8ff');
    burst(c.x, c.y, '#38e8ff', 8, 80, 0.5);
  }

  function expand() {
    if (state !== 'playing' || expandCd > 0 || power < 20) { if (state === 'playing') sfxBad(); return; }
    power -= 20; expandCd = 3;
    load = Math.max(0, load - 20);
    load = Math.max(0, load);
    showToast('扩容完成，负载下降');
    tone(300, 0.16, 'sine', 0.045, 600);
    for (var i = 0; i < 6; i++) burst(cardCenter(i).x, cardCenter(i).y, '#5ce6a8', 5, 90, 0.5);
  }
  function coolAll() {
    if (state !== 'playing' || coolCd > 0 || power < 25) { if (state === 'playing') sfxBad(); return; }
    power -= 25; coolCd = 6;
    for (var i = 0; i < servers.length; i++) {
      servers[i].temp = Math.max(20, servers[i].temp - 25);
      servers[i].fixGlow = 0.45;
      burst(cardCenter(i).x, cardCenter(i).y, '#38e8ff', 8, 100, 0.5);
    }
    sfxCool(); showToast('全机冷却 −25℃');
  }

  function endGame(won) {
    state = won ? 'won' : 'over';
    if (won) score += trust * 150 + Math.floor(power);
    $('overTitle').textContent = won ? '交班成功' : 'SLA 崩溃';
    $('finalTime').textContent = Math.floor(time) + ' 秒';
    $('finalNote').textContent = won
      ? '剩余信任 ' + trust + ' · 最终得分 ' + score
      : '信任耗尽 · 最终得分 ' + score;
    show('screenOver');
    syncHud();
    if (won) {
      tone(660, 0.16, 'sine', 0.05, 880);
      setTimeout(function(){ tone(880, 0.2, 'sine', 0.05, 1100); }, 150);
      setTimeout(function(){ tone(1100, 0.28, 'sine', 0.04, 1320); }, 320);
    } else sfxCrash();
  }

  function update(dt) {
    tGlobal += dt;
    if (expandCd > 0) expandCd = Math.max(0, expandCd - dt);
    if (coolCd > 0) coolCd = Math.max(0, coolCd - dt);
    for (var i = ripples.length - 1; i >= 0; i--) ripples[i].t += dt, ripples[i].t > 0.6 && ripples.splice(i, 1);
    for (i = floats.length - 1; i >= 0; i--) { floats[i].t += dt; if (floats[i].t > 1.4) floats.splice(i, 1); }
    for (i = sparks.length - 1; i >= 0; i--) {
      var sp = sparks[i];
      sp.x += sp.vx * dt; sp.y += sp.vy * dt; sp.vy += 80 * dt;
      sp.vx *= 0.97; sp.vy *= 0.97; sp.life -= dt;
      if (sp.life <= 0) sparks.splice(i, 1);
    }
    if (state !== 'playing') return;

    time += dt;
    power = Math.min(100, power + 5 * dt);
    load = Math.min(100, load + dt * (0.50 + time * 0.0035));

    // 告警生成
    if (time > 3) {
      spawnT -= dt;
      if (spawnT <= 0) {
        spawnT = Math.max(1.8, 4.6 - time * 0.018);
        spawnIssue();
      }
    }

    var downCount = 0;
    for (i = 0; i < servers.length; i++) {
      var s = servers[i];
      if (s.flash > 0) s.flash = Math.max(0, s.flash - dt * 1.8);
      if (s.fixGlow > 0) s.fixGlow = Math.max(0, s.fixGlow - dt * 1.6);
      if (s.down > 0) {
        s.down -= dt; downCount++;
        s.temp += (46 - s.temp) * Math.min(1, dt * 0.8);
        s.load = Math.max(0, s.load - dt * 20);
        continue;
      }
      // 故障倒计时
      if (s.issue) {
        s.issueT -= dt;
        if (s.issueT <= 0) { failIssue(s); continue; }
        if (s.issue === 'volt') power = Math.max(0, power - 2.6 * dt);
        if (s.issue === 'ddos') load = Math.min(100, load + 0.7 * dt);
      }
      // 个体负载
      var targetLoad = Math.max(0, Math.min(100, load + (s.seed - 5) * 3.4));
      s.load += (targetLoad - s.load) * Math.min(1, dt * 1.2);
      // 温度
      var heat = (s.load - 34) * 0.085;
      var fan = 1.35;
      var extra = s.issue === 'heat' ? 2.2 : 0;
      s.temp += (heat + extra - fan) * dt;
      s.temp = Math.max(18, Math.min(112, s.temp));
      if (s.temp >= 100) overheat(s);
    }
    if (downCount >= 3) load = Math.min(100, load + dt * 0.18);

    if (time >= GOAL) endGame(true);
    syncHud();
  }

  /* ---------- HUD ---------- */
  function syncHud() {
    $('powerFill').style.width = Math.max(0, Math.min(100, power)) + '%';
    $('loadFill').style.width = Math.max(0, Math.min(100, load)) + '%';
    $('score').textContent = Math.floor(score);
    var mm = Math.floor(time / 60), ss = Math.floor(time % 60);
    $('clock').textContent = (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss;
    var tr = $('trust'); tr.innerHTML = '';
    for (var i = 0; i < 3; i++) {
      var el = document.createElement('i');
      if (i >= trust) el.className = 'off';
      tr.appendChild(el);
    }
    $('expandBtn').disabled = !(state === 'playing' && expandCd <= 0 && power >= 20);
    $('coolBtn').disabled = !(state === 'playing' && coolCd <= 0 && power >= 25);
    $('expandCd').style.width = (expandCd > 0 ? (expandCd / 3 * 100) : 0) + '%';
    $('coolCd').style.width = (coolCd > 0 ? (coolCd / 6 * 100) : 0) + '%';
  }

  /* ---------- drawing ---------- */
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function drawBackground() {
    var g = ctx.createRadialGradient(W * 0.5, H * 0.1, 20, W * 0.5, H * 0.1, W * 0.9);
    g.addColorStop(0, '#0a1626'); g.addColorStop(1, '#04080f');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // 机房网格
    ctx.strokeStyle = 'rgba(56,232,255,.045)';
    ctx.lineWidth = 1;
    for (var x = 0; x < W; x += 34) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (var y = 0; y < H; y += 34) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    // 扫描线
    ctx.fillStyle = 'rgba(56,232,255,.018)';
    for (y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1);
  }
  function drawServer(i) {
    var s = servers[i], c = cards[i];
    if (!c) return;
    var x = c.x, y = c.y, w = c.w, h = c.h;
    var isHover = hover === i;
    var issueColor = s.issue ? ISSUES[s.issue].color : null;
    var border = s.down > 0 ? '#ff4757' : (s.issue ? issueColor : (s.temp > 78 ? '#ff9f45' : 'rgba(56,232,255,.28)'));
    // 卡片底
    var g = ctx.createLinearGradient(x, y, x, y + h);
    g.addColorStop(0, isHover ? 'rgba(24,42,66,.96)' : 'rgba(14,25,42,.95)');
    g.addColorStop(1, 'rgba(8,14,26,.98)');
    ctx.save();
    if (s.flash > 0 || isHover) {
      ctx.shadowColor = s.down > 0 ? 'rgba(255,71,87,.5)' : (issueColor ? hexAlpha(issueColor, .45) : 'rgba(56,232,255,.4)');
      ctx.shadowBlur = 18 + (s.flash > 0 ? 14 : 0);
    }
    ctx.fillStyle = g;
    roundRect(x, y, w, h, 14); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = border;
    ctx.lineWidth = s.issue || s.down > 0 ? 2 : 1.2;
    roundRect(x + .5, y + .5, w - 1, h - 1, 14); ctx.stroke();
    ctx.restore();
    if (s.fixGlow > 0) {
      ctx.save();
      ctx.globalAlpha = s.fixGlow;
      ctx.strokeStyle = '#5ce6a8'; ctx.lineWidth = 3;
      roundRect(x + 1, y + 1, w - 2, h - 2, 14); ctx.stroke();
      ctx.restore();
    }

    // header
    ctx.fillStyle = '#cfe6ff';
    ctx.font = 'bold 11px "Consolas",monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(s.name, x + 14, y + 21);
    // 状态灯
    var dotColor = s.down > 0 ? '#ff4757' : (s.issue ? issueColor : '#5ce6a8');
    var blink = s.issue ? (Math.sin(tGlobal * 8) > 0 ? 1 : 0.35) : 1;
    ctx.save(); ctx.globalAlpha = blink;
    ctx.shadowColor = dotColor; ctx.shadowBlur = 8;
    ctx.fillStyle = dotColor;
    ctx.beginPath(); ctx.arc(x + w - 18, y + 17, 4, 0, 6.2832); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#5f7a99'; ctx.font = '9px "Consolas",monospace'; ctx.textAlign = 'right';
    ctx.fillText(Math.round(s.load) + '%', x + w - 28, y + 21);

    // 机架
    var rackX = x + 14, rackY = y + 32;
    var rackW = w - 66, rackH = h - 76;
    if (rackW < 20 || rackH < 20) { rackW = w * 0.55; rackH = h * 0.45; }
    ctx.fillStyle = 'rgba(3,7,13,.75)';
    roundRect(rackX, rackY, rackW, rackH, 6); ctx.fill();
    var slots = 4, gap = 3;
    var slotH = (rackH - gap * (slots + 1)) / slots;
    for (var k = 0; k < slots; k++) {
      var sy = rackY + gap + k * (slotH + gap);
      ctx.fillStyle = s.down > 0 ? 'rgba(70,20,30,.55)' : 'rgba(20,36,58,.9)';
      roundRect(rackX + 4, sy, rackW - 8, slotH, 3); ctx.fill();
      // 散热孔
      ctx.strokeStyle = 'rgba(120,170,220,.13)';
      ctx.lineWidth = 1;
      for (var v = 0; v < 4; v++) {
        var lx = rackX + 12 + v * 5;
        ctx.beginPath(); ctx.moveTo(lx, sy + slotH * 0.3); ctx.lineTo(lx, sy + slotH * 0.7); ctx.stroke();
      }
      // LED
      var on = Math.sin(tGlobal * (2 + k) + s.seed * 3 + k) > (s.down > 0 ? 0.4 : -0.7);
      ctx.fillStyle = s.down > 0 ? 'rgba(255,71,87,.25)' : (on ? (k % 2 ? '#38e8ff' : '#5ce6a8') : 'rgba(56,232,255,.15)');
      ctx.beginPath(); ctx.arc(rackX + rackW - 10, sy + slotH / 2, 1.8, 0, 6.2832); ctx.fill();
    }
    // 温度柱
    var tbX = x + w - 44, tbY = y + 34, tbW = 8, tbH = h - 84;
    ctx.fillStyle = 'rgba(255,255,255,.06)';
    roundRect(tbX, tbY, tbW, tbH, 4); ctx.fill();
    var tr = Math.max(0, Math.min(1, (s.temp - 18) / 92));
    var tCol = s.temp > 85 ? '#ff4757' : (s.temp > 70 ? '#ff9f45' : (s.temp > 55 ? '#ffd166' : '#38e8ff'));
    if (tr > 0) {
      var grad = ctx.createLinearGradient(0, tbY + tbH, 0, tbY);
      grad.addColorStop(0, '#38e8ff'); grad.addColorStop(0.55, '#ffd166'); grad.addColorStop(1, '#ff4757');
      ctx.fillStyle = grad;
      roundRect(tbX, tbY + tbH * (1 - tr), tbW, tbH * tr, 4); ctx.fill();
    }
    ctx.fillStyle = tCol; ctx.font = 'bold 9px "Consolas",monospace'; ctx.textAlign = 'center';
    ctx.fillText(Math.round(s.temp) + '°', tbX + tbW / 2, tbY + tbH + 13);

    // 底部状态
    ctx.textAlign = 'left';
    if (s.down > 0) {
      ctx.fillStyle = '#ff4757';
      ctx.font = 'bold 11px "Microsoft YaHei",sans-serif';
      ctx.fillText('OFFLINE · ' + s.down.toFixed(1) + 's', x + 14, y + h - 14);
    } else if (s.issue) {
      var def = ISSUES[s.issue];
      ctx.fillStyle = def.color;
      ctx.font = 'bold 11px "Microsoft YaHei",sans-serif';
      var iconW = 16;
      ctx.fillText(def.icon, x + 14, y + h - 14);
      ctx.fillStyle = '#e9f2ff';
      ctx.fillText(def.name, x + 14 + iconW, y + h - 14);
      // 倒计时条
      var bw = w - 28, bx = x + 14, by = y + h - 9;
      ctx.fillStyle = 'rgba(255,255,255,.08)'; roundRect(bx, by, bw, 3, 2); ctx.fill();
      ctx.fillStyle = def.color;
      roundRect(bx, by, bw * Math.max(0, s.issueT / s.issueMax), 3, 2); ctx.fill();
    } else {
      ctx.fillStyle = '#5ce6a8';
      ctx.font = '10px "Microsoft YaHei",sans-serif';
      ctx.fillText('运行正常', x + 14, y + h - 14);
      // 温度提示
      if (s.temp > 78) {
        ctx.fillStyle = '#ff9f45';
        ctx.fillText('注意温度', x + 72, y + h - 14);
      }
    }

    // 点击涟漪
    for (var r = 0; r < ripples.length; r++) {
      var rp = ripples[r];
      var d = Math.hypot(rp.x - (x + w / 2), rp.y - (y + h / 2));
      if (d < Math.max(w, h) * 0.8) {
        ctx.save();
        ctx.globalAlpha = 1 - rp.t / 0.6;
        ctx.strokeStyle = rp.color; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(rp.x, rp.y, 6 + rp.t * 90, 0, 6.2832); ctx.stroke();
        ctx.restore();
      }
    }
    // 宕机覆盖
    if (s.down > 0) {
      ctx.save();
      ctx.fillStyle = 'rgba(255,40,70,.07)';
      roundRect(x + 2, y + 2, w - 4, h - 4, 12); ctx.fill();
      ctx.strokeStyle = 'rgba(255,71,87,.5)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x + 16, y + h - 30); ctx.lineTo(x + w - 16, y + 36); ctx.stroke();
      ctx.restore();
    }
  }
  function hexAlpha(hex, a) {
    var h = hex.replace('#', '');
    var r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    for (var i = 0; i < servers.length; i++) drawServer(i);
    // 浮动文字
    for (i = 0; i < floats.length; i++) {
      var f = floats[i];
      ctx.globalAlpha = Math.max(0, 1 - f.t / 1.4);
      ctx.fillStyle = f.color;
      ctx.font = 'bold 12px "Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(f.text, f.x, f.y - f.t * 30);
    }
    ctx.globalAlpha = 1;
    // 火花
    for (i = 0; i < sparks.length; i++) {
      var sp = sparks[i];
      ctx.globalAlpha = Math.max(0, sp.life / sp.max);
      ctx.fillStyle = sp.color;
      ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.r, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // 全局红色警戒
    var danger = 0;
    for (i = 0; i < servers.length; i++) if (servers[i].temp > 85) danger++;
    if (danger > 0 && state === 'playing') {
      var pulse = 0.04 + Math.sin(tGlobal * 4) * 0.02;
      ctx.fillStyle = 'rgba(255,71,87,' + pulse * danger + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  /* ---------- loop ---------- */
  var last = 0;
  function loop(now) {
    if (!last) last = now;
    var dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  /* ---------- input ---------- */
  function cardAt(mx, my) {
    for (var i = 0; i < cards.length; i++) {
      var c = cards[i];
      if (mx >= c.x && mx <= c.x + c.w && my >= c.y && my <= c.y + c.h) return i;
    }
    return -1;
  }
  cvs.addEventListener('pointermove', function (e) {
    var r = cvs.getBoundingClientRect();
    hover = cardAt(e.clientX - r.left, e.clientY - r.top);
    cvs.style.cursor = hover >= 0 ? 'pointer' : 'default';
  });
  cvs.addEventListener('pointerleave', function () { hover = -1; });
  cvs.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    var r = cvs.getBoundingClientRect();
    var i = cardAt(e.clientX - r.left, e.clientY - r.top);
    if (i >= 0) poke(i);
    audio();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key >= '1' && e.key <= '6') { e.preventDefault(); poke(parseInt(e.key, 10) - 1); return; }
    if (e.key === 'e' || e.key === 'E') { e.preventDefault(); expand(); return; }
    if (e.key === 'q' || e.key === 'Q') { e.preventDefault(); coolAll(); return; }
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { e.preventDefault(); togglePause(); return; }
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      if (state === 'start' || state === 'over' || state === 'won') startGame();
      else if (state === 'paused') togglePause();
    }
  }, { passive: false });

  $('startBtn').addEventListener('click', startGame);
  $('againBtn').addEventListener('click', startGame);
  $('resumeBtn').addEventListener('click', function () { if (state === 'paused') togglePause(); });
  $('expandBtn').addEventListener('click', expand);
  $('coolBtn').addEventListener('click', coolAll);
  $('soundBtn').addEventListener('click', function () {
    soundOn = !soundOn; saveNum('server.sound', soundOn ? 1 : 0);
    this.classList.toggle('on', soundOn); this.textContent = soundOn ? '♪' : '×';
    if (soundOn) tone(700, 0.06, 'square', 0.03);
  });
  $('soundBtn').classList.toggle('on', soundOn);
  $('soundBtn').textContent = soundOn ? '♪' : '×';

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && state === 'playing') togglePause();
  });
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });

  makeServers(); resize(); syncHud(); draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
