<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<title>六边消消 · HexFall</title>
<style>
  :root {
    --bg: #05080f;
    --panel: #0d1526;
    --panel-2: #111c31;
    --line: #1d2c49;
    --text: #e6efff;
    --muted: #8ea3c4;
    --cyan: #4ad6ff;
    --amber: #ffd166;
    --pink: #ff6b9d;
    --violet: #7a5cff;
    --mint: #5ce6a8;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  #game {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: pointer;
  }

  .hud {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 5;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 16px 20px calc(16px + env(safe-area-inset-top, 0px));
    pointer-events: none;
  }
  .stat {
    min-width: 78px;
    padding: 7px 13px 8px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: rgba(13, 21, 38, 0.72);
    backdrop-filter: blur(10px);
  }
  .stat span {
    display: block;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
  }
  .stat b {
    display: block;
    margin-top: 2px;
    font-size: 20px;
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.5px;
  }
  .stat.level b { color: var(--amber); }
  .hud-actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
    pointer-events: auto;
  }
  .icon {
    height: 40px;
    padding: 0 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: rgba(13, 21, 38, 0.72);
    color: var(--muted);
    font: inherit;
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: color .15s ease, border-color .15s ease, background .15s ease;
  }
  .icon:hover { color: var(--text); border-color: #2c4a7a; background: rgba(17, 28, 49, 0.9); }

  .tip {
    position: fixed;
    left: 50%;
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    z-index: 4;
    transform: translateX(-50%);
    margin: 0;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(9, 14, 25, 0.72);
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 1px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity .45s ease;
    pointer-events: none;
  }
  .tip.show { opacity: 1; }

  .mobile-controls {
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    z-index: 6;
    display: none;
    justify-content: space-between;
    padding: 0 18px;
    pointer-events: none;
  }
  .mobile-controls button {
    width: 92px;
    height: 58px;
    border-radius: 18px;
    border: 1px solid #29456f;
    background: linear-gradient(180deg, rgba(24, 40, 68, 0.92), rgba(11, 18, 32, 0.92));
    color: var(--cyan);
    font: inherit;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    pointer-events: auto;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.07);
    touch-action: manipulation;
  }
  .mobile-controls button:active {
    transform: translateY(1px);
    background: linear-gradient(180deg, rgba(37, 62, 104, 0.95), rgba(15, 25, 44, 0.95));
  }

  .overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: none;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(720px 480px at 50% 30%, rgba(20, 64, 104, 0.35), transparent 68%),
      rgba(3, 6, 12, 0.78);
    backdrop-filter: blur(7px);
  }
  .overlay.show { display: grid; }
  .screen {
    width: min(440px, 100%);
    padding: 34px 30px 30px;
    border: 1px solid var(--line);
    border-radius: 24px;
    background: linear-gradient(180deg, rgba(17, 28, 49, 0.97), rgba(8, 13, 24, 0.99));
    box-shadow: 0 40px 90px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    text-align: center;
    animation: rise .28s ease both;
  }
  .screen.hidden { display: none; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(12px) scale(0.985); }
    to { opacity: 1; transform: none; }
  }
  .kicker {
    margin: 0 0 8px;
    font-size: 11px;
    letter-spacing: 6px;
    color: var(--cyan);
  }
  .screen h1 {
    margin: 0 0 12px;
    font-size: 34px;
    line-height: 1.15;
    letter-spacing: 1px;
  }
  .screen h1.small { font-size: 26px; }
  .lead {
    margin: 0 0 20px;
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.85;
  }
  .keys {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin: 0 0 24px;
    padding: 0;
    list-style: none;
    color: var(--muted);
    font-size: 12px;
  }
  .keys li { display: flex; align-items: center; gap: 6px; }
  kbd {
    display: inline-grid;
    place-items: center;
    min-width: 26px;
    height: 26px;
    padding: 0 6px;
    border: 1px solid #2c4466;
    border-bottom-width: 2px;
    border-radius: 7px;
    background: #121e33;
    color: var(--text);
    font: inherit;
    font-size: 12px;
  }
  .btn {
    width: 100%;
    height: 50px;
    border: 0;
    border-radius: 14px;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 2px;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .2s ease, filter .2s ease;
  }
  .btn.primary {
    background: linear-gradient(135deg, #4ad6ff, #7a5cff);
    color: #04101d;
    box-shadow: 0 14px 34px rgba(74, 214, 255, 0.22);
  }
  .btn.primary:hover { filter: brightness(1.06); box-shadow: 0 16px 40px rgba(74, 214, 255, 0.3); }
  .btn.primary:active { transform: translateY(1px) scale(0.995); }
  .btn.ghost {
    margin-top: 10px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
  }
  .result {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin: 0 0 20px;
    padding: 14px 18px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: rgba(8, 13, 24, 0.6);
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 1px;
  }
  .result b {
    color: var(--text);
    font-size: 30px;
    font-variant-numeric: tabular-nums;
  }
  .result.small { margin-bottom: 24px; padding: 10px 18px; }
  .result.small b { font-size: 20px; color: var(--amber); }

  @media (max-width: 720px), (pointer: coarse) {
    .mobile-controls { display: flex; }
    .tip { bottom: calc(88px + env(safe-area-inset-bottom, 0px)); font-size: 11px; }
    .hud { padding: 12px 12px calc(12px + env(safe-area-inset-top, 0px)); gap: 7px; }
    .stat { min-width: 64px; padding: 6px 10px 7px; }
    .stat b { font-size: 17px; }
    .icon { height: 36px; padding: 0 10px; font-size: 11px; }
    .screen { padding: 28px 22px 24px; }
    .screen h1 { font-size: 28px; }
  }
  @media (max-width: 400px) {
    .stat:nth-child(3) { display: none; }
  }
</style>

<body>
<canvas id="game" aria-label="六边消消游戏区域"></canvas>

<header class="hud">
  <div class="stat"><span>得分</span><b id="score">0</b></div>
  <div class="stat"><span>最高</span><b id="best">0</b></div>
  <div class="stat level"><span>等级</span><b id="level">1</b></div>
  <div class="hud-actions">
    <button class="icon" id="soundBtn" type="button" aria-pressed="true">音效 开</button>
    <button class="icon" id="pauseBtn" type="button">暂停</button>
  </div>
</header>

<p class="tip" id="tip">← → 转动六边形，把同色连成 3 个以上</p>

<div class="mobile-controls">
  <button id="rotL" type="button" aria-label="向左转动">◀</button>
  <button id="rotR" type="button" aria-label="向右转动">▶</button>
</div>

<div class="overlay show" id="overlay">
  <section class="screen" id="screenStart">
    <p class="kicker">HEXFALL</p>
    <h1>六边消消</h1>
    <p class="lead">彩块从六个方向压向中心。<br>转动六边形，让同色方块相邻，<br>三个以上连成一片就会消除。</p>
    <ul class="keys">
      <li><kbd>←</kbd><kbd>→</kbd> 转动</li>
      <li><kbd>P</kbd> 暂停</li>
      <li><kbd>空格</kbd> 开始</li>
    </ul>
    <button class="btn primary" id="startBtn" type="button">开始游戏</button>
  </section>

  <section class="screen hidden" id="screenOver">
    <p class="kicker">GAME OVER</p>
    <h1 class="small">六边形被塞满了</h1>
    <div class="result"><span>本局得分</span><b id="finalScore">0</b></div>
    <div class="result small"><span>最高分</span><b id="finalBest">0</b></div>
    <button class="btn primary" id="againBtn" type="button">再来一局</button>
  </section>

  <section class="screen hidden" id="screenPause">
    <p class="kicker">PAUSED</p>
    <h1 class="small">已暂停</h1>
    <p class="lead">按 P 或点击下方按钮继续。</p>
    <button class="btn primary" id="resumeBtn" type="button">继续游戏</button>
  </section>
</div>

<script>
(function () {
  'use strict';

  var cvs = document.getElementById('game');
  var ctx = cvs.getContext('2d', { alpha: false });
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var levelEl = document.getElementById('level');
  var overlay = document.getElementById('overlay');
  var tipEl = document.getElementById('tip');
  var soundBtn = document.getElementById('soundBtn');
  var pauseBtn = document.getElementById('pauseBtn');
  var screens = {
    start: document.getElementById('screenStart'),
    over: document.getElementById('screenOver'),
    pause: document.getElementById('screenPause')
  };

  var TAU = Math.PI * 2;
  var SIDE_H = Math.PI / 3;
  var COS30 = Math.cos(Math.PI / 6);

  var palette = [
    { base: '#4ad6ff', light: '#c8f5ff', dark: '#0d6d8c' },
    { base: '#ffd166', light: '#fff2c9', dark: '#8a6512' },
    { base: '#ff6b9d', light: '#ffc9dc', dark: '#8c2547' },
    { base: '#7a5cff', light: '#cfc4ff', dark: '#3a2a99' },
    { base: '#5ce6a8', light: '#c8ffe6', dark: '#157a4f' }
  ];

  var W = 0, H = 0, cx = 0, cy = 0;
  var R = 0, A = 0, bh = 0, capacity = 5;
  var outerDist = 0, spawnDist = 0;

  var lanes = [[], [], [], [], [], []];
  var falling = null;
  var state = 'ready';
  var score = 0, level = 1, combo = 0, comboTimer = 0, colorCount = 4;
  var best = 0;
  var spawnTimer = 0.55;
  var rotCooldown = 0;
  var rot = 0;
  var rotTarget = 0;
  var particles = [];
  var floaters = [];
  var stars = [];
  var shake = { t: 0, dur: 1, mag: 0 };
  var flash = 0;
  var rotPulse = 0;
  var lastTime = 0;

  var soundOn = true;
  var actx = null;

  try {
    best = parseInt(localStorage.getItem('hexfall.best') || '0', 10) || 0;
    soundOn = localStorage.getItem('hexfall.sound') !== '0';
  } catch (e) { best = 0; }

  /* ---------- geometry ---------- */

  function targetDist(index) {
    return A + bh * (index + 0.5);
  }

  function ringOf(dist) {
    return (dist - A) / bh - 0.5;
  }

  function initStars() {
    stars.length = 0;
    var n = Math.round((W * H) / 15000);
    n = Math.max(48, Math.min(160, n));
    for (var i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        z: 0.25 + Math.random() * 0.75,
        r: 0.6 + Math.random() * 1.5
      });
    }
  }

  function resize() {
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth;
    H = window.innerHeight;
    cvs.width = Math.round(W * dpr);
    cvs.height = Math.round(H * dpr);
    cvs.style.width = W + 'px';
    cvs.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var s = Math.min(W, H);
    R = Math.max(54, Math.min(s * 0.18, 166));
    A = R * COS30;
    bh = R * 0.245;
    cx = W / 2;
    cy = H / 2 + Math.min(30, H * 0.035);

    var maxRadius = Math.min(W * 0.48, H * 0.46);
    capacity = Math.floor(((maxRadius * COS30) - A) / bh);
    capacity = Math.max(4, Math.min(7, capacity));
    outerDist = A + capacity * bh;
    spawnDist = outerDist + bh * 1.25;

    if (falling) falling.dist = spawnDist;
    for (var i = 0; i < 6; i++) {
      for (var j = 0; j < lanes[i].length; j++) {
        lanes[i][j].vdist = targetDist(j);
      }
    }
    initStars();
    buildBgLayer();
  }

  /* ---------- game logic ---------- */

  function rotSteps() {
    return Math.round(rot);
  }

  function landingLane(worldLane) {
    return ((worldLane - rotSteps()) % 6 + 6) % 6;
  }

  function spawnBlock() {
    if (state !== 'playing') return;
    var bestW = 0, bestLen = Infinity;
    for (var w = 0; w < 6; w++) {
      var len = lanes[landingLane(w)].length;
      if (len < bestLen) { bestLen = len; bestW = w; }
    }
    if (bestLen >= capacity) { gameOver(); return; }
    falling = {
      worldLane: bestW,
      color: (Math.random() * colorCount) | 0,
      dist: spawnDist
    };
  }

  function land() {
    if (!falling) return;
    var laneIndex = landingLane(falling.worldLane);
    var lane = lanes[laneIndex];
    if (lane.length >= capacity) { gameOver(); return; }
    lane.push({
      color: falling.color,
      lane: laneIndex,
      vdist: falling.dist
    });
    falling = null;
    playTone(180, 0.09, 'sine', 0.045, 0);
    addShake(1.6, 0.1);
    resolveAll();
    spawnTimer = Math.max(0.16, 0.44 - level * 0.03);
  }

  function rotate(dir) {
    if (state !== 'playing' || rotCooldown > 0) return;
    rotCooldown = 0.07;
    rotTarget += dir;
    rotPulse = 1;
    playTone(300, 0.05, 'triangle', 0.032, 0);
  }

  function findComponents() {
    var visited = {};
    var result = [];
    for (var i = 0; i < 6; i++) {
      for (var j = 0; j < lanes[i].length; j++) {
        var key = i + ',' + j;
        if (visited[key]) continue;
        var color = lanes[i][j].color;
        var comp = [];
        var stack = [[i, j]];
        visited[key] = true;
        while (stack.length) {
          var node = stack.pop();
          var ci = node[0], cj = node[1];
          comp.push({ i: ci, j: cj });
          var neighbors = [
            [ci, cj - 1],
            [ci, cj + 1],
            [(ci + 1) % 6, cj],
            [(ci + 5) % 6, cj]
          ];
          for (var n = 0; n < neighbors.length; n++) {
            var ni = neighbors[n][0];
            var nj = neighbors[n][1];
            if (nj < 0 || nj >= lanes[ni].length) continue;
            var nk = ni + ',' + nj;
            if (visited[nk]) continue;
            if (lanes[ni][nj].color !== color) continue;
            visited[nk] = true;
            stack.push([ni, nj]);
          }
        }
        if (comp.length >= 3) result.push(comp);
      }
    }
    return result;
  }

  function resolveAll() {
    var total = 0;
    var chains = 0;

    for (var guard = 0; guard < 12; guard++) {
      var comps = findComponents();
      if (!comps.length) break;
      chains++;

      var remove = [[], [], [], [], [], []];
      for (var c = 0; c < comps.length; c++) {
        for (var n = 0; n < comps[c].length; n++) {
          var node = comps[c][n];
          remove[node.i].push(node.j);
        }
      }

      for (var i = 0; i < 6; i++) {
        if (!remove[i].length) continue;
        remove[i].sort(function (a, b) { return b - a; });
        for (var r = 0; r < remove[i].length; r++) {
          var j = remove[i][r];
          if (j < lanes[i].length) {
            burst(i, j, lanes[i][j]);
            lanes[i].splice(j, 1);
            total++;
          }
        }
      }
    }

    if (total > 0) {
      combo = comboTimer > 0 ? Math.min(9, combo + 1) : 1;
      comboTimer = 2.3;
      var mult = 1 + (combo - 1) * 0.5 + (chains - 1) * 0.3;
      var gain = Math.round(total * 10 * mult);
      score += gain;

      var nextLevel = 1 + Math.floor(score / 380);
      if (nextLevel !== level) {
        level = nextLevel;
        colorCount = level >= 5 ? 5 : 4;
      }
      if (score > best) { best = score; saveBest(); }

      floaters.push({
        text: '+' + gain, x: cx, y: cy - R - 34,
        life: 1.1, max: 1.1, color: '#e6efff'
      });
      if (combo > 1) {
        floaters.push({
          text: '连击 x' + combo, x: cx, y: cy - R - 66,
          life: 1.25, max: 1.25, color: '#ffd166'
        });
      }

      flash = Math.min(0.5, 0.16 + total * 0.02);
      addShake(3 + Math.min(7, total), 0.22);
      playClear(total);
      updateHud();
    }
  }

  function burst(i, j, block) {
    var ang = -Math.PI / 2 + i * SIDE_H;
    var d = targetDist(j);
    var x = cx + Math.cos(ang) * d;
    var y = cy + Math.sin(ang) * d;
    var col = palette[block.color] || palette[0];

    for (var k = 0; k < 9; k++) {
      if (particles.length > 340) break;
      var a = Math.random() * TAU;
      var sp = 30 + Math.random() * 170;
      var life = 0.45 + Math.random() * 0.5;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: life, max: life,
        r: 1.5 + Math.random() * 3.2,
        color: Math.random() < 0.3 ? col.light : col.base
      });
    }
  }

  function animateBlocks(dt) {
    var ease = Math.min(1, dt * 14);
    for (var i = 0; i < 6; i++) {
      var lane = lanes[i];
      for (var j = 0; j < lane.length; j++) {
        var b = lane[j];
        var td = targetDist(j);
        b.vdist += (td - b.vdist) * ease;
        if (Math.abs(td - b.vdist) < 0.15) b.vdist = td;
      }
    }
  }

  function startGame() {
    ensureAudio();
    lanes = [[], [], [], [], [], []];
    falling = null;
    particles.length = 0;
    floaters.length = 0;
    score = 0;
    level = 1;
    combo = 0;
    comboTimer = 0;
    colorCount = 4;
    spawnTimer = 0.55;
    rotCooldown = 0;
    rot = 0;
    rotTarget = 0;
    flash = 0;
    shake.t = 0;
    shake.mag = 0;
    state = 'playing';
    hideOverlay();
    updateHud();
    tipEl.classList.add('show');
    window.setTimeout(function () { tipEl.classList.remove('show'); }, 4200);
  }

  function gameOver() {
    if (state === 'over') return;
    state = 'over';
    falling = null;
    if (score > best) { best = score; saveBest(); }
    document.getElementById('finalScore').textContent = String(score);
    document.getElementById('finalBest').textContent = String(best);
    updateHud();
    addShake(11, 0.4);
    playOver();
    showScreen('over');
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      showScreen('pause');
    } else if (state === 'paused') {
      state = 'playing';
      lastTime = performance.now();
      hideOverlay();
    }
  }

  function updateHud() {
    scoreEl.textContent = String(score);
    bestEl.textContent = String(Math.max(best, score));
    levelEl.textContent = String(level);
  }

  function saveBest() {
    try { localStorage.setItem('hexfall.best', String(best)); } catch (e) {}
  }

  /* ---------- update ---------- */

  function update(dt) {
    var s;
    for (s = 0; s < stars.length; s++) {
      var st = stars[s];
      st.y += (6 + st.z * 18) * dt;
      st.x -= (3 + st.z * 8) * dt;
      if (st.y > H + 6) { st.y = -6; st.x = Math.random() * W; }
      if (st.x < -6) st.x = W + 6;
    }

    if (rotCooldown > 0) rotCooldown = Math.max(0, rotCooldown - dt);

    var rotDiff = rotTarget - rot;
    if (Math.abs(rotDiff) < 0.002) {
      rot = rotTarget;
    } else {
      rot += rotDiff * Math.min(1, dt * 18);
    }
    if (Math.abs(rot - rotTarget) < 0.002 && Math.abs(rot) > 24) {
      var rotShift = Math.round(rot / 6) * 6;
      rot -= rotShift;
      rotTarget -= rotShift;
    }

    if (shake.t > 0) {
      shake.t = Math.max(0, shake.t - dt);
      if (shake.t === 0) shake.mag = 0;
    }
    if (flash > 0) flash = Math.max(0, flash - dt * 2.2);
    if (rotPulse > 0) rotPulse = Math.max(0, rotPulse - dt * 3.5);

    if (state !== 'playing') return;

    if (comboTimer > 0) {
      comboTimer -= dt;
      if (comboTimer <= 0) combo = 0;
    }

    if (falling) {
      falling.dist -= bh * (7.4 + level * 0.6) * dt;
      var td = targetDist(lanes[landingLane(falling.worldLane)].length);
      if (falling.dist <= td) {
        falling.dist = td;
        land();
      }
    } else {
      spawnTimer -= dt;
      if (spawnTimer <= 0) spawnBlock();
    }

    animateBlocks(dt);

    var p, f;
    for (p = particles.length - 1; p >= 0; p--) {
      var pt = particles[p];
      pt.life -= dt;
      if (pt.life <= 0) { particles.splice(p, 1); continue; }
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vx *= (1 - 1.6 * dt);
      pt.vy *= (1 - 1.6 * dt);
      pt.vy += 90 * dt;
    }
    for (f = floaters.length - 1; f >= 0; f--) {
      var fl = floaters[f];
      fl.life -= dt;
      fl.y -= 26 * dt;
      if (fl.life <= 0) floaters.splice(f, 1);
    }
  }

  /* ---------- render ---------- */

  function polyPath(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
  }

  function insetPoly(pts, scale) {
    var mx = 0, my = 0, i;
    for (i = 0; i < pts.length; i++) { mx += pts[i][0]; my += pts[i][1]; }
    mx /= pts.length;
    my /= pts.length;
    var out = [];
    for (i = 0; i < pts.length; i++) {
      out.push([mx + (pts[i][0] - mx) * scale, my + (pts[i][1] - my) * scale]);
    }
    return out;
  }

  function blockQuad(sideF, ringF) {
    var ang = -Math.PI / 2 + sideF * SIDE_H;
    var d0 = A + ringF * bh;
    var d1 = d0 + bh;
    var r0 = d0 / COS30;
    var r1 = d1 / COS30;
    var a0 = ang - Math.PI / 6;
    var a1 = ang + Math.PI / 6;
    return [
      [cx + Math.cos(a0) * r0, cy + Math.sin(a0) * r0],
      [cx + Math.cos(a1) * r0, cy + Math.sin(a1) * r0],
      [cx + Math.cos(a1) * r1, cy + Math.sin(a1) * r1],
      [cx + Math.cos(a0) * r1, cy + Math.sin(a0) * r1]
    ];
  }

  function hexPath(apothem) {
    var radius = apothem / COS30;
    ctx.beginPath();
    for (var i = 0; i < 6; i++) {
      var ang = -Math.PI / 6 + i * SIDE_H;
      var x = cx + Math.cos(ang) * radius;
      var y = cy + Math.sin(ang) * radius;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  var bgLayer = null;
  var auroraSprite = null;

  function buildBgLayer() {
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(W * dpr));
    c.height = Math.max(1, Math.round(H * dpr));
    var g = c.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);

    g.fillStyle = '#05080f';
    g.fillRect(0, 0, W, H);

    var rg = g.createRadialGradient(cx, cy, R * 0.1, cx, cy, Math.max(W, H) * 0.72);
    rg.addColorStop(0, 'rgba(30, 92, 136, 0.32)');
    rg.addColorStop(0.45, 'rgba(20, 34, 70, 0.16)');
    rg.addColorStop(1, 'rgba(5, 8, 15, 0)');
    g.fillStyle = rg;
    g.fillRect(0, 0, W, H);

    var vg = g.createRadialGradient(W * 0.86, H * 0.1, 0, W * 0.86, H * 0.1, Math.max(W, H) * 0.52);
    vg.addColorStop(0, 'rgba(122, 92, 255, 0.14)');
    vg.addColorStop(1, 'rgba(5, 8, 15, 0)');
    g.fillStyle = vg;
    g.fillRect(0, 0, W, H);

    var vig = g.createRadialGradient(W * 0.5, H * 0.47, Math.min(W, H) * 0.26, W * 0.5, H * 0.5, Math.max(W, H) * 0.78);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,2,8,0.55)');
    g.fillStyle = vig;
    g.fillRect(0, 0, W, H);

    bgLayer = c;
    if (!auroraSprite) {
      var s = document.createElement('canvas');
      s.width = s.height = 512;
      var sg = s.getContext('2d');
      var ag = sg.createRadialGradient(256, 256, 0, 256, 256, 256);
      ag.addColorStop(0, 'rgba(74, 214, 255, 0.22)');
      ag.addColorStop(0.45, 'rgba(60, 130, 220, 0.09)');
      ag.addColorStop(1, 'rgba(5, 8, 15, 0)');
      sg.fillStyle = ag;
      sg.fillRect(0, 0, 512, 512);
      auroraSprite = s;
    }
  }

  function drawBg() {
    if (!bgLayer) buildBgLayer();
    if (bgLayer) ctx.drawImage(bgLayer, 0, 0, W, H);
    else { ctx.fillStyle = '#05080f'; ctx.fillRect(0, 0, W, H); }

    var tm = performance.now() / 1000;
    if (auroraSprite) {
      var ax = W * 0.5 + Math.cos(tm * 0.16) * W * 0.22;
      var ay = H * 0.5 + Math.sin(tm * 0.12) * H * 0.16;
      var rr = Math.max(W, H) * 0.62;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.55;
      ctx.drawImage(auroraSprite, ax - rr, ay - rr, rr * 2, rr * 2);
      ctx.restore();
    }
  }

  function drawStars() {
    ctx.fillStyle = '#c6e8ff';
    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      ctx.globalAlpha = 0.16 + st.z * 0.5;
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawRings() {
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(74, 214, 255, 0.06)';
    for (var r = 1; r <= capacity; r++) {
      hexPath(A + r * bh);
      ctx.stroke();
    }

    ctx.setLineDash([3, 7]);
    ctx.strokeStyle = 'rgba(122, 92, 255, 0.12)';
    for (var i = 0; i < 6; i++) {
      var ang = -Math.PI / 2 + (i + rot) * SIDE_H;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(ang) * A, cy + Math.sin(ang) * A);
      ctx.lineTo(cx + Math.cos(ang) * (outerDist + bh * 0.4), cy + Math.sin(ang) * (outerDist + bh * 0.4));
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  function drawCore() {
    ctx.save();
    hexPath(A);
    var g = ctx.createLinearGradient(cx, cy - R, cx, cy + R);
    g.addColorStop(0, '#13233d');
    g.addColorStop(1, '#070d18');
    ctx.fillStyle = g;
    ctx.shadowColor = 'rgba(74, 214, 255, 0.55)';
    ctx.shadowBlur = 26 + rotPulse * 16;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(74, 214, 255, ' + (0.45 + rotPulse * 0.35) + ')';
    ctx.stroke();

    hexPath(A * 0.62);
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(122, 92, 255, 0.28)';
    ctx.stroke();

    var pulse = 0.55 + Math.sin(performance.now() * 0.0025) * 0.12 + rotPulse * 0.2;
    var cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, A * 0.55);
    cg.addColorStop(0, 'rgba(74, 214, 255, ' + (0.22 * pulse) + ')');
    cg.addColorStop(1, 'rgba(74, 214, 255, 0)');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.arc(cx, cy, A * 0.6, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function drawDanger() {
    var now = performance.now();
    for (var i = 0; i < 6; i++) {
      if (lanes[i].length < capacity - 1) continue;
      var ang = -Math.PI / 2 + (i + rot) * SIDE_H;
      var d = outerDist + bh * 0.18;
      var r = d / COS30;
      var a0 = ang - Math.PI / 6;
      var a1 = ang + Math.PI / 6;
      var alpha = 0.16 + 0.14 * Math.sin(now * 0.009);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a0) * r, cy + Math.sin(a0) * r);
      ctx.lineTo(cx + Math.cos(a1) * r, cy + Math.sin(a1) * r);
      ctx.lineTo(cx + Math.cos(a1) * (r + bh), cy + Math.sin(a1) * (r + bh));
      ctx.lineTo(cx + Math.cos(a0) * (r + bh), cy + Math.sin(a0) * (r + bh));
      ctx.closePath();
      ctx.fillStyle = 'rgba(255, 82, 112, ' + alpha + ')';
      ctx.fill();
    }
  }

  function drawBlock(sideF, ringF, colorIdx) {
    var quad = insetPoly(blockQuad(sideF, ringF), 0.962);
    var col = palette[colorIdx] || palette[0];

    var ang = -Math.PI / 2 + sideF * SIDE_H;
    var x0 = cx + Math.cos(ang) * (A + ringF * bh);
    var y0 = cy + Math.sin(ang) * (A + ringF * bh);
    var x1 = cx + Math.cos(ang) * (A + (ringF + 1) * bh);
    var y1 = cy + Math.sin(ang) * (A + (ringF + 1) * bh);

    var g = ctx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, col.dark);
    g.addColorStop(0.42, col.base);
    g.addColorStop(1, col.light);

    polyPath(quad);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.lineWidth = 1.1;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.24)';
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(quad[0][0], quad[0][1]);
    ctx.lineTo(quad[1][0], quad[1][1]);
    ctx.lineWidth = 1.4;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
    ctx.stroke();
  }

  function drawFalling(f) {
    var ringF = ringOf(f.dist);
    ringF = Math.max(0, Math.min(capacity - 1, ringF));
    var quad = insetPoly(blockQuad(f.worldLane, ringF), 0.962);
    var col = palette[f.color] || palette[0];
    var g = ctx.createLinearGradient(quad[0][0], quad[0][1], quad[3][0], quad[3][1]);
    g.addColorStop(0, col.light);
    g.addColorStop(0.5, col.base);
    g.addColorStop(1, col.dark);

    polyPath(quad);
    ctx.save();
    ctx.shadowColor = col.base;
    ctx.shadowBlur = 18;
    ctx.fillStyle = g;
    ctx.fill();
    ctx.restore();

    ctx.lineWidth = 1.4;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.stroke();
  }

  function drawGhost(f) {
    var laneIndex = landingLane(f.worldLane);
    var idx = lanes[laneIndex].length;
    if (idx >= capacity) return;
    var quad = insetPoly(blockQuad(laneIndex + rot, idx), 0.962);
    ctx.save();
    ctx.setLineDash([5, 5]);
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = 'rgba(230, 239, 255, 0.22)';
    polyPath(quad);
    ctx.stroke();
    ctx.restore();
  }

  function drawParticles() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var a = Math.max(0, p.life / p.max);
      ctx.globalAlpha = a * 0.9;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (0.6 + a * 0.6), 0, TAU);
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawFloaters() {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var i = 0; i < floaters.length; i++) {
      var f = floaters[i];
      var a = Math.max(0, f.life / f.max);
      ctx.globalAlpha = Math.min(1, a * 1.6);
      ctx.fillStyle = f.color;
      ctx.font = '700 22px "Segoe UI", "Microsoft YaHei", sans-serif';
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function render() {
    drawBg();

    ctx.save();
    if (shake.t > 0) {
      var m = shake.t / (shake.dur || 1);
      ctx.translate(
        (Math.random() - 0.5) * shake.mag * m * 2,
        (Math.random() - 0.5) * shake.mag * m * 2
      );
    }

    drawStars();
    drawRings();
    drawCore();
    drawDanger();
    if (falling) drawGhost(falling);

    for (var i = 0; i < 6; i++) {
      var lane = lanes[i];
      for (var j = 0; j < lane.length; j++) {
        var b = lane[j];
        drawBlock(i + rot, ringOf(b.vdist), b.color);
      }
    }

    if (falling) drawFalling(falling);
    drawParticles();
    drawFloaters();

    ctx.restore();

    if (flash > 0) {
      ctx.fillStyle = 'rgba(190, 242, 255, ' + (flash * 0.45) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  /* ---------- audio ---------- */

  function ensureAudio() {
    if (!actx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) {
        try { actx = new AC(); } catch (e) { actx = null; }
      }
    }
    if (actx && actx.state === 'suspended') {
      actx.resume();
    }
  }

  function playTone(freq, dur, type, vol, delay) {
    if (!soundOn || !actx) return;
    var t = actx.currentTime + (delay || 0);
    var o = actx.createOscillator();
    var g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.05, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(actx.destination);
    o.start(t);
    o.stop(t + dur + 0.03);
  }

  function playClear(total) {
    if (!soundOn || !actx) return;
    var notes = [523.25, 659.25, 783.99, 1046.5];
    var count = Math.min(4, 1 + (total >> 1));
    for (var i = 0; i < count; i++) {
      playTone(notes[i], 0.16, 'triangle', 0.055, i * 0.055);
    }
  }

  function playOver() {
    if (!soundOn || !actx) return;
    var notes = [440, 349.23, 261.63, 174.61];
    for (var i = 0; i < notes.length; i++) {
      playTone(notes[i], 0.28, 'sawtooth', 0.04, i * 0.12);
    }
  }

  /* ---------- ui ---------- */

  function showScreen(name) {
    overlay.classList.add('show');
    for (var key in screens) {
      if (Object.prototype.hasOwnProperty.call(screens, key)) {
        screens[key].classList.toggle('hidden', key !== name);
      }
    }
  }

  function hideOverlay() {
    overlay.classList.remove('show');
  }

  function updateSoundBtn() {
    soundBtn.textContent = soundOn ? '音效 开' : '音效 关';
    soundBtn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
  }

  function addShake(mag, dur) {
    shake.mag = Math.max(shake.mag, mag);
    shake.t = Math.max(shake.t, dur);
    shake.dur = Math.max(shake.dur, dur);
  }

  /* ---------- events ---------- */

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('againBtn').addEventListener('click', startGame);
  document.getElementById('resumeBtn').addEventListener('click', togglePause);
  pauseBtn.addEventListener('click', function () {
    if (state === 'playing' || state === 'paused') togglePause();
  });
  soundBtn.addEventListener('click', function () {
    soundOn = !soundOn;
    try { localStorage.setItem('hexfall.sound', soundOn ? '1' : '0'); } catch (e) {}
    updateSoundBtn();
    ensureAudio();
    if (soundOn) playTone(520, 0.08, 'triangle', 0.05, 0);
  });

  document.getElementById('rotL').addEventListener('click', function () {
    ensureAudio();
    rotate(-1);
  });
  document.getElementById('rotR').addEventListener('click', function () {
    ensureAudio();
    rotate(1);
  });

  window.addEventListener('keydown', function (e) {
    var key = e.key;
    if (key === 'ArrowLeft' || key === 'ArrowRight' || key === 'ArrowUp' || key === 'ArrowDown' || key === ' ') {
      e.preventDefault();
    }
    if (key === 'ArrowLeft' || key === 'a' || key === 'A') {
      ensureAudio();
      rotate(-1);
    } else if (key === 'ArrowRight' || key === 'd' || key === 'D') {
      ensureAudio();
      rotate(1);
    } else if (key === 'p' || key === 'P' || key === 'Escape') {
      if (state === 'playing' || state === 'paused') togglePause();
    } else if (key === ' ' || key === 'Enter') {
      if (state === 'ready' || state === 'over') startGame();
    }
  });

  cvs.addEventListener('pointerdown', function (e) {
    if (state !== 'playing') return;
    ensureAudio();
    if (e.clientX < W / 2) rotate(-1); else rotate(1);
  });

  window.addEventListener('resize', resize);

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && state === 'playing') togglePause();
  });

  /* ---------- main loop ---------- */

  function loop(now) {
    if (!lastTime) lastTime = now;
    var dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  resize();
  updateHud();
  updateSoundBtn();
  showScreen('start');
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
