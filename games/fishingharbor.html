<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>潮汐垂钓</title>
<style>
  *{box-sizing:border-box}
  [hidden],.hide{display:none!important}
  html,body{margin:0;height:100%;overflow:hidden;background:#05101c;color:#e8f4ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;color-scheme:dark}
  body{display:flex;flex-direction:column;--accent:#7ee0ff;--accent2:#fbbf24}
  .top{display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:12px;color:#8fa9c6;background:#071523;border-bottom:1px solid rgba(126,224,255,.1);overflow-x:auto;white-space:nowrap}
  .top .stat{display:flex;align-items:baseline;gap:3px;flex:none}
  .top b{color:var(--accent);font-size:14px;margin-left:2px}
  .tide{display:flex;align-items:center;gap:5px;flex:none;margin-left:auto;padding:3px 9px;border-radius:999px;border:1px solid rgba(126,224,255,.22);background:rgba(126,224,255,.07);color:#c9ecff}
  .tide b{font-size:12px;color:#e6f8ff}
  .tide em{font-style:normal;font-size:11px;color:#7d9bb8}
  .sound{flex:none;width:28px;height:26px;padding:0;border-radius:8px;font-size:12px;line-height:1}
  .scene{position:relative;flex:1;min-height:190px;overflow:hidden;cursor:pointer;touch-action:manipulation;background:linear-gradient(180deg,#0a2440 0%,#0d3a5e 38%,#0b567f 62%,#063a5c 100%)}
  .scene:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 2px,transparent 2px 9px)}
  .sky-glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 55% at 50% 0%,rgba(126,224,255,.10),transparent 68%)}
  .sun{display:none;position:absolute;left:70%;top:8%;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,150,.55),rgba(255,214,150,0) 68%);filter:blur(2px);animation:sunpulse 7s ease-in-out infinite alternate}
  @keyframes sunpulse{from{transform:scale(.96);opacity:.82}to{transform:scale(1.06);opacity:1}}
  .aurora,.stars,.coral,.ice,.vent{position:absolute;inset:0;pointer-events:none;display:none}
  .aurora{top:0;height:48%;background:
    radial-gradient(ellipse 52% 30% at 30% 22%,rgba(94,234,212,.28),transparent 68%),
    radial-gradient(ellipse 46% 26% at 70% 12%,rgba(192,132,252,.22),transparent 66%),
    linear-gradient(100deg,transparent 10%,rgba(126,224,255,.12) 32%,transparent 52%,rgba(192,132,252,.12) 74%,transparent 90%);
    filter:blur(6px);animation:auroraMove 9s ease-in-out infinite alternate}
  @keyframes auroraMove{from{transform:translateX(-3%) scaleY(.96);opacity:.7}to{transform:translateX(3%) scaleY(1.06);opacity:1}}
  .stars{background-image:
    radial-gradient(1.6px 1.6px at 8% 14%,rgba(255,255,255,.85),transparent 60%),
    radial-gradient(1.3px 1.3px at 18% 8%,rgba(210,240,255,.75),transparent 60%),
    radial-gradient(1.2px 1.2px at 27% 22%,rgba(255,255,255,.65),transparent 60%),
    radial-gradient(1.5px 1.5px at 36% 11%,rgba(200,235,255,.7),transparent 60%),
    radial-gradient(1.2px 1.2px at 46% 19%,rgba(255,255,255,.6),transparent 60%),
    radial-gradient(1.6px 1.6px at 57% 7%,rgba(220,245,255,.8),transparent 60%),
    radial-gradient(1.3px 1.3px at 66% 16%,rgba(255,255,255,.6),transparent 60%),
    radial-gradient(1.2px 1.2px at 78% 9%,rgba(210,240,255,.7),transparent 60%),
    radial-gradient(1.5px 1.5px at 88% 21%,rgba(255,255,255,.65),transparent 60%),
    radial-gradient(1.2px 1.2px at 94% 6%,rgba(220,245,255,.7),transparent 60%);
    animation:twinkle 5.5s ease-in-out infinite alternate}
  @keyframes twinkle{from{opacity:.35}to{opacity:.9}}
  .coral{bottom:0;top:auto;height:30%;background:
    radial-gradient(ellipse 8% 70% at 12% 100%,rgba(248,113,113,.35),transparent 70%),
    radial-gradient(ellipse 6% 52% at 22% 100%,rgba(251,191,36,.28),transparent 70%),
    radial-gradient(ellipse 10% 62% at 34% 100%,rgba(192,132,252,.26),transparent 72%),
    radial-gradient(ellipse 7% 48% at 52% 100%,rgba(94,234,212,.3),transparent 70%),
    radial-gradient(ellipse 9% 66% at 68% 100%,rgba(248,113,113,.28),transparent 72%),
    radial-gradient(ellipse 6% 44% at 82% 100%,rgba(251,191,36,.24),transparent 70%),
    radial-gradient(ellipse 10% 58% at 94% 100%,rgba(192,132,252,.24),transparent 72%);
    filter:blur(1px);opacity:.8}
  .ice{bottom:0;top:auto;height:18%;background:linear-gradient(180deg,rgba(190,240,255,.16),rgba(190,240,255,.03));clip-path:polygon(0 100%,0 46%,7% 70%,14% 38%,22% 66%,31% 30%,39% 62%,49% 26%,58% 60%,67% 34%,75% 64%,84% 40%,92% 68%,100% 44%,100% 100%)}
  .vent{top:auto;bottom:0;height:55%;background:
    radial-gradient(ellipse 18% 46% at 22% 100%,rgba(192,132,252,.18),transparent 70%),
    radial-gradient(ellipse 14% 38% at 74% 100%,rgba(56,189,248,.16),transparent 70%),
    radial-gradient(ellipse 8% 22% at 48% 100%,rgba(251,191,36,.1),transparent 72%);
    filter:blur(4px)}
  .boat{display:none;position:absolute;left:13%;top:36%;width:62px;height:16px;pointer-events:none;opacity:.6;background:linear-gradient(180deg,#1d5069,#082033);border-radius:0 0 55% 55% / 0 0 100% 100%;box-shadow:0 8px 14px rgba(0,0,0,.35),inset 0 1px 0 rgba(180,235,255,.22);animation:boatfloat 7s ease-in-out infinite;z-index:2}
  .boat:before{content:"";position:absolute;left:29px;bottom:100%;width:2px;height:44px;background:linear-gradient(180deg,rgba(200,240,255,.6),rgba(200,240,255,.06))}
  .boat:after{content:"";position:absolute;left:31px;bottom:100%;width:0;height:0;border-left:22px solid rgba(180,228,255,.34);border-top:14px solid transparent;border-bottom:14px solid transparent;transform:translateY(-30px)}
  @keyframes boatfloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-4px) rotate(1deg)}}
  .waves{position:absolute;left:-10%;right:-10%;bottom:-8%;height:54%;pointer-events:none;z-index:2;
    background:
      radial-gradient(ellipse 80% 58% at 50% 100%,rgba(126,224,255,.18),transparent 68%),
      repeating-linear-gradient(0deg,rgba(150,230,255,.055) 0 2px,transparent 2px 22px);
    -webkit-mask-image:linear-gradient(to top,#000 10%,rgba(0,0,0,.4) 52%,transparent 92%);
    mask-image:linear-gradient(to top,#000 10%,rgba(0,0,0,.4) 52%,transparent 92%);
    transform-origin:50% 100%;animation:tide 9s ease-in-out infinite alternate}
  @keyframes tide{from{transform:translateX(-1.6%) scaleY(.95)}to{transform:translateX(1.6%) scaleY(1.06)}}
  .bubbles{position:absolute;inset:0;pointer-events:none;z-index:2;opacity:.45;background:
    radial-gradient(3px 3px at 24% 78%,rgba(200,245,255,.5),transparent 70%),
    radial-gradient(2px 2px at 38% 86%,rgba(200,245,255,.4),transparent 70%),
    radial-gradient(3px 3px at 58% 74%,rgba(200,245,255,.45),transparent 70%),
    radial-gradient(2px 2px at 72% 88%,rgba(200,245,255,.35),transparent 70%),
    radial-gradient(2px 2px at 84% 80%,rgba(200,245,255,.4),transparent 70%);
    animation:bubbleUp 6s linear infinite}
  @keyframes bubbleUp{from{transform:translateY(12px);opacity:.25}to{transform:translateY(-18px);opacity:.6}}
  .scene.school{box-shadow:inset 0 0 90px rgba(251,191,36,.14)}
  .scene.school .bubbles{animation-duration:1.6s;opacity:.85}
  .line{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;opacity:0;transition:opacity .2s}
  .line.on{opacity:1}
  .line path{fill:none;stroke:rgba(205,240,255,.55);stroke-width:.22}
  .rodtip{position:absolute;left:14%;top:36%;width:5px;height:5px;margin:-2px 0 0 -2px;border-radius:50%;z-index:5;pointer-events:none;background:#e6fbff;box-shadow:0 0 10px rgba(126,224,255,.95),0 0 22px rgba(126,224,255,.45)}
  .rodtip:before{content:"";position:absolute;right:3px;top:2px;width:30px;height:1px;background:linear-gradient(90deg,rgba(200,240,255,0),rgba(200,240,255,.45));transform:rotate(38deg);transform-origin:right center}
  .rodtip:after{content:"";position:absolute;left:1px;top:4px;width:1px;height:32px;background:linear-gradient(180deg,rgba(200,240,255,.5),rgba(200,240,255,.04));transform:rotate(-14deg);transform-origin:top center}
  .bobber{position:absolute;left:30%;bottom:28%;width:15px;height:15px;border-radius:50%;z-index:5;
    background:radial-gradient(circle at 35% 30%,#fff,#fb7185 55%,#7f1d1d);
    box-shadow:0 0 14px rgba(251,113,133,.8);transition:left .35s ease;animation:bob 2.4s ease-in-out infinite}
  .bobber.bite{animation:bite .22s ease-in-out infinite;box-shadow:0 0 22px rgba(251,191,36,.95)}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes bite{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(6px) scale(1.18)}}
  .deco-fish{position:absolute;left:0;width:34px;height:12px;border-radius:50%;z-index:2;pointer-events:none;background:rgba(170,225,255,.09);filter:blur(.6px);animation:drift 22s linear infinite}
  .deco-fish:after{content:"";position:absolute;left:-8px;top:2px;width:0;height:0;border-right:9px solid rgba(170,225,255,.09);border-top:4px solid transparent;border-bottom:4px solid transparent}
  .deco-fish.f1{top:57%;animation-duration:26s;animation-delay:-5s}
  .deco-fish.f2{top:46%;width:24px;height:9px;animation-duration:34s;animation-delay:-18s;opacity:.7}
  .deco-fish.f3{top:69%;width:42px;height:14px;animation-duration:30s;animation-delay:-24s;opacity:.55}
  @keyframes drift{from{transform:translateX(-16vw)}to{transform:translateX(116vw)}}
  .fish-shadow{position:absolute;left:34%;bottom:19%;width:70px;height:18px;border-radius:50%;z-index:3;pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%,rgba(3,20,34,.55),rgba(3,20,34,0) 72%);filter:blur(2px);
    animation:swim 3.4s ease-in-out infinite}
  @keyframes swim{0%,100%{transform:translateX(-14px) scaleX(1)}50%{transform:translateX(18px) scaleX(1.08)}}
  .fish-shadow.bite{animation:biteShadow .4s ease-in-out infinite}
  @keyframes biteShadow{0%,100%{transform:translateX(-6px) scale(1)}50%{transform:translateX(8px) scale(1.18)}}
  .spot-badge{position:absolute;left:14px;top:12px;z-index:6;display:flex;flex-direction:column;gap:1px;padding:6px 12px;border-radius:10px;background:rgba(4,14,25,.52);border:1px solid rgba(126,224,255,.16);backdrop-filter:blur(4px);pointer-events:none}
  .spot-badge b{font-size:14px;letter-spacing:.06em;color:#eaf9ff}
  .spot-badge span{font-size:10.5px;color:#8fb4cf;max-width:min(62vw,320px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .event{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:7;padding:5px 13px;border-radius:999px;font-size:12px;color:#ffe6b0;background:rgba(120,72,10,.62);border:1px solid rgba(251,191,36,.45);box-shadow:0 0 22px rgba(251,191,36,.22);white-space:nowrap;pointer-events:none;animation:eventPulse 1.4s ease-in-out infinite alternate}
  @keyframes eventPulse{from{transform:translateX(-50%) scale(.98)}to{transform:translateX(-50%) scale(1.03)}}
  .msg{position:absolute;left:50%;top:21%;transform:translateX(-50%);z-index:6;font-size:13px;color:#bfe6ff;
    background:rgba(5,16,28,.58);border:1px solid rgba(126,224,255,.18);padding:6px 14px;border-radius:999px;white-space:nowrap;pointer-events:none;max-width:92%;overflow:hidden;text-overflow:ellipsis}
  .catch-pop{position:absolute;left:50%;top:30%;transform:translateX(-50%);z-index:9;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:10px 22px;border-radius:14px;background:rgba(6,22,38,.88);border:1px solid rgba(126,224,255,.32);box-shadow:0 18px 50px rgba(0,0,0,.45);pointer-events:none;animation:popIn .3s ease}
  .catch-pop b{font-size:17px;color:#eafaff;letter-spacing:.04em}
  .catch-pop span{font-size:11.5px;color:#9fc2da}
  .catch-pop em{font-style:normal;font-size:15px;color:#fbbf24;font-weight:700}
  .catch-pop.rare{border-color:rgba(192,132,252,.55);box-shadow:0 0 40px rgba(192,132,252,.25),0 18px 50px rgba(0,0,0,.45)}
  .catch-pop.legend{border-color:rgba(251,191,36,.6);box-shadow:0 0 46px rgba(251,191,36,.3),0 18px 50px rgba(0,0,0,.45)}
  @keyframes popIn{from{opacity:0;transform:translate(-50%,10px) scale(.92)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
  .note{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:10;padding:5px 14px;border-radius:999px;font-size:11.5px;color:#ffe6b0;background:rgba(8,24,40,.9);border:1px solid rgba(251,191,36,.32);white-space:nowrap;pointer-events:none;animation:noteIn .25s ease}
  @keyframes noteIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
  .panel{background:#08192a;border-top:1px solid rgba(126,224,255,.12);padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px;z-index:12}
  .meter,.prog,.linehp{display:none;height:12px;border-radius:8px;background:rgba(126,224,255,.09);overflow:hidden;position:relative}
  .meter.on{display:block}
  .meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#fbbf24,#fb7185);transition:width .05s linear}
  .bars{display:none;gap:6px;flex-direction:column}
  .bars.on{display:flex}
  .prog,.linehp{display:block}
  .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#4ade80);transition:width .08s linear}
  .linehp{height:7px}
  .linehp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#4ade80,#fbbf24);transition:width .08s linear}
  .linehp i.low{background:linear-gradient(90deg,#fb7185,#ef4444)}
  .tension{display:none;position:relative;height:18px;border-radius:9px;background:rgba(126,224,255,.09);overflow:hidden}
  .tension.on{display:block}
  .zone{position:absolute;top:0;bottom:0;background:rgba(94,234,212,.3);border:1px solid rgba(94,234,212,.75);border-radius:9px}
  .marker{position:absolute;top:-3px;bottom:-3px;width:4px;background:#fff;border-radius:2px;box-shadow:0 0 10px #fff}
  .row{display:flex;gap:8px}
  .row button{flex:1;padding:10px 8px;border-radius:12px;border:1px solid rgba(126,224,255,.32);background:rgba(126,224,255,.1);color:#d5f2ff;font-size:14px;cursor:pointer;font-family:inherit}
  .row button:active{transform:scale(.98)}
  .row button:disabled{opacity:.45;cursor:default}
  #castBtn,#hookBtn{flex:1.35;font-weight:600;border-color:rgba(126,224,255,.45);background:linear-gradient(180deg,rgba(126,224,255,.22),rgba(126,224,255,.08))}
  .mini{flex:.62!important;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 4px!important;position:relative}
  .mini span{font-size:11px;color:#8fb4cf}
  .mini b{font-size:11px;color:#d5f2ff;font-weight:600}
  .dot{position:absolute;right:7px;top:6px;width:6px;height:6px;border-radius:50%;background:#fbbf24;box-shadow:0 0 6px #fbbf24}
  .log{font-size:11px;color:#7d97b5;min-height:15px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(2,8,15,.72);backdrop-filter:blur(4px)}
  .sheet-card{width:min(700px,96vw);max-height:88vh;display:flex;flex-direction:column;border-radius:16px;border:1px solid rgba(126,224,255,.22);background:linear-gradient(180deg,#0a1f33,#061320);box-shadow:0 30px 80px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.06);overflow:hidden}
  .sheet-head{display:flex;align-items:flex-start;gap:10px;padding:12px 14px 8px;border-bottom:1px solid rgba(126,224,255,.1)}
  .sheet-head h2{margin:0;font-size:16px;letter-spacing:.08em;color:#eafaff}
  .sheet-head p{margin:2px 0 0;font-size:10.5px;color:#7d9bb8}
  .sheet-head button{margin-left:auto;flex:none;padding:6px 12px;border-radius:9px;font-size:11px}
  .tabs{display:flex;gap:5px;padding:8px 12px;overflow-x:auto;border-bottom:1px solid rgba(126,224,255,.08);flex:none}
  .tabs button{flex:none;padding:5px 11px;border-radius:8px;font-size:11.5px;border:1px solid transparent;background:rgba(126,224,255,.05);color:#8fb4cf}
  .tabs button.on{border-color:rgba(126,224,255,.35);background:rgba(126,224,255,.16);color:#eafaff}
  .tab-body{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 16px;scrollbar-width:thin;scrollbar-color:rgba(126,224,255,.34) rgba(8,25,42,.55)}
  .tab-body::-webkit-scrollbar{width:6px}
  .tab-body::-webkit-scrollbar-thumb{background:rgba(126,224,255,.24);border-radius:99px}
  .up-grid{display:flex;flex-direction:column;gap:8px}
  .up-card{padding:10px 12px;border-radius:11px;border:1px solid rgba(126,224,255,.14);background:rgba(126,224,255,.045)}
  .up-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .up-head b{font-size:13.5px;color:#eafaff}
  .up-head span{font-size:11px;color:#7ee0ff}
  .up-card p{margin:3px 0;font-size:11px;color:#8fb4cf;line-height:1.5}
  .up-card p.next{color:#cfeaff}
  .up-card button{margin-top:5px;width:100%;padding:7px;border-radius:8px;font-size:12px;border-color:rgba(251,191,36,.33);background:rgba(251,191,36,.1);color:#ffe6b0}
  .up-card button:disabled{border-color:rgba(126,224,255,.14);background:rgba(126,224,255,.05);color:#607d96}
  .stat-line{margin-top:10px;padding:9px 11px;border-radius:10px;border:1px dashed rgba(126,224,255,.16);font-size:11px;color:#8fb4cf;line-height:1.7}
  .stat-line b{color:#d5f2ff}
  .spot-card{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;margin-bottom:7px;border-radius:11px;border:1px solid rgba(126,224,255,.14);background:rgba(126,224,255,.045);color:#d5f2ff;cursor:pointer}
  .spot-card.on{border-color:var(--accent);background:rgba(126,224,255,.13);box-shadow:0 0 0 1px rgba(126,224,255,.12) inset}
  .spot-card:disabled{opacity:.5;cursor:default}
  .spot-card .s-ico{font-size:20px;flex:none}
  .spot-card .s-main{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
  .spot-card .s-main b{font-size:13px}
  .spot-card .s-main span{font-size:10.5px;color:#8fb4cf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .spot-card .s-tag{flex:none;font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid rgba(126,224,255,.24);color:#9fd8f2}
  .spot-card .s-tag.cur{color:#ffe6b0;border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.1)}
  .bait-card{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;margin-bottom:7px;border-radius:11px;border:1px solid rgba(126,224,255,.14);background:rgba(126,224,255,.045);color:#d5f2ff;cursor:pointer}
  .bait-card.on{border-color:#fbbf24;background:rgba(251,191,36,.09)}
  .bait-card:disabled{opacity:.48;cursor:default}
  .bait-card .b-ico{font-size:19px;flex:none}
  .bait-card .b-main{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
  .bait-card .b-main b{font-size:13px}
  .bait-card .b-main span{font-size:10.5px;color:#8fb4cf}
  .bait-card .s-tag{flex:none;font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid rgba(251,191,36,.3);color:#ffe6b0}
  .dex-top{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;font-size:11.5px;color:#9fc2da}
  .dex-top .bar{height:8px;border-radius:99px;background:rgba(126,224,255,.1);overflow:hidden}
  .dex-top .bar i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#4ade80)}
  .dex-group{margin-bottom:12px}
  .dex-group h3{display:flex;align-items:center;justify-content:space-between;margin:0 0 5px;font-size:12px;color:#cfeaff;font-weight:600}
  .dex-group h3 span{font-size:10.5px;color:#7d9bb8;font-weight:400}
  .fish-row{display:flex;align-items:center;gap:7px;padding:4px 2px;border-bottom:1px solid rgba(126,224,255,.06);font-size:11.5px}
  .fish-row:last-child{border-bottom:0}
  .fish-dot{width:7px;height:7px;border-radius:50%;flex:none;box-shadow:0 0 7px currentColor}
  .fish-row b{font-size:11.5px;color:#e2f4ff;font-weight:500;min-width:4.6em}
  .fish-row em{font-style:normal;color:#7d9bb8;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fish-row .fv{color:#fbbf24;font-size:10.5px;flex:none}
  .fish-row.unknown b{color:#55718a}

  function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
  function dexCount(){
    var n = 0;
    for (var k in S.dex) if (S.dex.hasOwnProperty(k) && FISH[k]) n++;
    return n;
  }
  function spotById(id){
    for (var i = 0; i < SPOTS.length; i++) if (SPOTS[i].id === id) return SPOTS[i];
    return SPOTS[0];
  }
  function baitById(id){
    for (var i = 0; i < BAITS.length; i++) if (BAITS[i].id === id) return BAITS[i];
    return BAITS[0];
  }
  function fishById(id){ return FISH[id] || null; }
  function lineMaxNow(){ return 1 + (S.line - 1) * 0.22; }
  function reelSpeedNow(){ return 0.70 + (S.reel - 1) * 0.045; }
  function zoneBaseNow(){ return 0.30 + (S.rod - 1) * 0.010 + (S.reel - 1) * 0.004; }
  function spotDexCount(sp){
    var n = 0;
    for (var i = 0; i < sp.fishes.length; i++) if (S.dex[sp.fishes[i].id]) n++;
    return n;
  }
  function unlockedBaitCount(){
    var n = 0;
    for (var i = 0; i < BAITS.length; i++) if (dexCount() >= BAITS[i].req) n++;
    return n;
  }
  function esc(t){
    return String(t).replace(/[&<>"]/g, function(c){
      return { '&':'&', '<':'<', '>':'>', '"':'"' }[c];
    });
  }

  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
  }
  function load(){
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch(e){}
    if (raw){
      try { mergeState(JSON.parse(raw)); return; } catch(e){}
    }
    try {
      var old = JSON.parse(localStorage.getItem(OLD_KEY) || 'null');
      if (old) migrateOld(old);
    } catch(e){}
  }
  function mergeState(d){
    if (!d || typeof d !== 'object') return;
    if (typeof d.coin === 'number') S.coin = Math.max(0, Math.floor(d.coin));
    if (typeof d.rod === 'number') S.rod = clamp(Math.floor(d.rod), 1, MAX_ROD);
    if (typeof d.line === 'number') S.line = clamp(Math.floor(d.line), 1, MAX_LINE);
    if (typeof d.reel === 'number') S.reel = clamp(Math.floor(d.reel), 1, MAX_REEL);
    if (typeof d.bait === 'string' && baitById(d.bait).id === d.bait) S.bait = d.bait;
    if (typeof d.spot === 'string' && spotById(d.spot).id === d.spot) S.spot = d.spot;
    if (d.dex && typeof d.dex === 'object'){
      for (var id in d.dex){
        if (!d.dex.hasOwnProperty(id) || !FISH[id]) continue;
        var r = d.dex[id];
        var n = (r && typeof r.n === 'number') ? Math.max(1, Math.floor(r.n)) : 1;
        var best = (r && typeof r.best === 'number') ? r.best : (FISH[id].len[0] + FISH[id].len[1]) / 2;
        S.dex[id] = { n: n, best: best };
      }
    }
    if (d.ach && typeof d.ach === 'object') S.ach = d.ach;
    if (d.bonus && typeof d.bonus === 'object') S.bonus = d.bonus;
    if (Array.isArray(d.quests)) S.quests = d.quests;
    if (typeof d.qid === 'number') S.qid = d.qid;
    if (d.stats && typeof d.stats === 'object'){
      S.stats.cast = Math.max(0, Math.floor(d.stats.cast || 0));
      S.stats.catch = Math.max(0, Math.floor(d.stats.catch || 0));
      S.stats.perfect = Math.max(0, Math.floor(d.stats.perfect || 0));
      S.stats.legend = Math.max(0, Math.floor(d.stats.legend || 0));
      S.stats.coins = Math.max(0, Math.floor(d.stats.coins || 0));
      S.stats.best = Math.max(0, Number(d.stats.best) || 0);
    }
    if (typeof d.sound === 'boolean') S.sound = d.sound;
    if (S.rod < spotById(S.spot).req) S.spot = 'dock';
    if (dexCount() < baitById(S.bait).req) S.bait = 'worm';
  }
  function migrateOld(old){
    if (typeof old.coin === 'number') S.coin = Math.max(0, Math.floor(old.coin));
    if (typeof old.rod === 'number') S.rod = clamp(Math.floor(old.rod), 1, MAX_ROD);
    var total = 0;
    if (old.dex && typeof old.dex === 'object'){
      for (var name in old.dex){
        if (!old.dex.hasOwnProperty(name)) continue;
        var id = LEGACY[name] || null;
        if (!id || !FISH[id]) continue;
        var f = FISH[id];
        S.dex[id] = { n: 1, best: (f.len[0] + f.len[1]) / 2 };
        total++;
      }
    }
    S.stats.catch = total;
    S.stats.cast = total;
  }

  function makeQuest(){
    if (!Array.isArray(S.quests)) S.quests = [];
    var used = {};
    S.quests.forEach(function(q){ if (q) used[q.type] = 1; });
    var pool = ['count', 'coins', 'rarity', 'size', 'spot'].filter(function(t){ return !used[t]; });
    if (!pool.length) pool = ['count', 'coins', 'rarity', 'size', 'spot'];
    var type = pool[Math.floor(Math.random() * pool.length)];
    var rod = S.rod;
    var q = { id:'q' + (++S.qid) + '_' + Date.now().toString(36), type:type, cur:0, done:false, claimed:false };
    if (type === 'count'){
      q.need = 5 + rod * 2;
      q.reward = 70 + rod * 34;
    } else if (type === 'coins'){
      q.need = 180 + rod * 90;
      q.reward = 90 + rod * 38;
    } else if (type === 'rarity'){
      q.r = rod < 3 ? 1 : (rod < 7 ? 2 : 3);
      q.need = 1;
      q.reward = 120 + rod * 48;
    } else if (type === 'size'){
      var spots = SPOTS.filter(function(s){ return S.rod >= s.req; });
      var sp = spots[Math.floor(Math.random() * spots.length)] || SPOTS[0];
      var f = sp.fishes[Math.min(3, sp.fishes.length - 1)];
      q.size = Math.round((f.len[0] + (f.len[1] - f.len[0]) * 0.70) * 10) / 10;
      q.need = 1;
      q.reward = 110 + rod * 44;
    } else {
      var usp = SPOTS.filter(function(s){ return S.rod >= s.req; });
      var s2 = usp[Math.floor(Math.random() * usp.length)] || SPOTS[0];
      q.spot = s2.id;
      q.need = 3 + Math.floor(rod / 3);
      q.reward = 80 + rod * 36;
    }
    return q;
  }
  function ensureQuests(){
    if (!Array.isArray(S.quests)) S.quests = [];
    S.quests = S.quests.filter(function(q){ return q && q.id && !q.claimed; }).slice(0, 3);
    while (S.quests.length < 3) S.quests.push(makeQuest());
  }
  function questText(q){
    if (q.type === 'count') return '钓上 ' + q.need + ' 条鱼';
    if (q.type === 'coins') return '累计赚取 ' + q.need + ' 金币';
    if (q.type === 'rarity') return '钓到 ' + q.need + ' 条' + RARITY[q.r].n + '鱼';
    if (q.type === 'size') return '钓到一条 ≥ ' + q.size + ' cm 的鱼';
    if (q.type === 'spot') return '在' + spotById(q.spot).name + '钓上 ' + q.need + ' 条鱼';
    return '完成委托';
  }
  function questTitle(q){
    if (q.type === 'count') return '渔获委托';
    if (q.type === 'coins') return '鱼市订单';
    if (q.type === 'rarity') return RARITY[q.r].n + '鱼委托';
    if (q.type === 'size') return '巨物委托';
    return '海域委托';
  }
  function questCatch(f, size, reward){
    S.quests.forEach(function(q){
      if (!q || q.done) return;
      var inc = 0;
      if (q.type === 'count') inc = 1;
      else if (q.type === 'coins') inc = reward;
      else if (q.type === 'rarity' && f.r >= q.r) inc = 1;
      else if (q.type === 'size' && size >= q.size) inc = 1;
      else if (q.type === 'spot' && f.spot === q.spot) inc = 1;
      if (inc > 0){
        q.cur = Math.min(q.need, q.cur + inc);
        if (q.cur >= q.need) q.done = true;
      }
    });
  }

  function checkAch(){
    var got = [];
    ACHS.forEach(function(a){
      if (S.ach[a.id]) return;
      if (a.test(S)){
        S.ach[a.id] = 1;
        S.coin += a.reward;
        S.stats.coins += a.reward;
        got.push(a);
      }
    });
    if (got.length){
      save();
      sync();
      showNote('成就 · ' + got[got.length - 1].name + ' +' + got[got.length - 1].reward + ' 金币');
      sfx('quest');
    }
    return got;
  }

  var AC = null;
  function initAudio(){
    if (AC) return;
    try {
      var C = window.AudioContext || window.webkitAudioContext;
      if (C) AC = new C();
    } catch(e){ AC = null; }
  }
  function beep(freq, dur, delay, type, vol){
    if (!S.sound || !AC) return;
    try {
      if (AC.state === 'suspended') AC.resume();
      var t0 = AC.currentTime + (delay || 0);
      var o = AC.createOscillator();
      var g = AC.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(vol == null ? 0.045 : vol, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g);
      g.connect(AC.destination);
      o.start(t0);
      o.stop(t0 + dur + 0.03);
    } catch(e){}
  }
  function sfx(kind){
    if (!S.sound) return;
    if (!AC) initAudio();
    if (!AC) return;
    if (kind === 'cast'){
      beep(520, .12, 0, 'triangle', .04);
      beep(330, .16, .08, 'triangle', .035);
    } else if (kind === 'bite'){
      beep(880, .09, 0, 'square', .035);
      beep(1180, .12, .1, 'square', .035);
    } else if (kind === 'catch'){
      beep(523, .13, 0, 'sine', .05);
      beep(659, .14, .1, 'sine', .05);
      beep(784, .2, .2, 'sine', .05);
    } else if (kind === 'fail'){
      beep(220, .18, 0, 'sawtooth', .03);
      beep(150, .26, .1, 'sawtooth', .03);
    } else if (kind === 'upgrade'){
      beep(660, .12, 0, 'triangle', .045);
      beep(880, .18, .1, 'triangle', .045);
    } else if (kind === 'quest'){
      beep(784, .12, 0, 'sine', .045);
      beep(988, .12, .09, 'sine', .045);
      beep(1175, .2, .18, 'sine', .045);
    } else if (kind === 'event'){
      beep(392, .14, 0, 'square', .03);
      beep(523, .14, .12, 'square', .03);
      beep(784, .2, .24, 'square', .03);
    }
  }

  function tideInfo(){
    var now = Date.now();
    var idx = Math.floor(now / TIDE_MS) % TIDES.length;
    return { idx: idx, left: TIDE_MS - (now % TIDE_MS) };
  }
  function tickTide(){
    var ti = tideInfo();
    var t = TIDES[ti.idx];
    tideName.textContent = t.name;
    tideIco.textContent = t.ico;
    tideT.textContent = Math.ceil(ti.left / 1000) + 's';
    if (ti.idx !== tideIdx){
      var was = tideIdx;
      tideIdx = ti.idx;
      document.body.dataset.tide = t.id;
      if (was >= 0 && started) showNote('潮汐转为' + t.name + ' · ' + (t.id === 'full' ? '稀有鱼更活跃' : (t.id === 'rise' ? '咬钩更快' : (t.id === 'fall' ? '巨物更多' : '鱼情平稳'))));
      if (was >= 0 && state === 'wait') scheduleBite();
    }
  }
  function updateLine(left){

  function tickEvent(){

      ev.next = now + 110000 + Math.random() * 60000;

  function waitMul(){
    var t = TIDES[tideIdx < 0 ? tideInfo().idx : tideIdx];
    var b = baitById(S.bait);
    return t.wait * b.wait * (ev.on ? 0.35 : 1);
  }
  function scheduleBite(){
    clearTimeout(waitTimer);
    waitTimer = setTimeout(beginBite, (800 + Math.random() * 1900) * waitMul());

  function beginBite(){
    if (state !== 'wait') return;
    state = 'bite';
    bobber.classList.add('bite');

    biteTimer = setTimeout(function(){

        logEl.textContent = '咬钩只有 1.5 秒，看到浮漂下沉就立刻收线';

    }, 1500);
    sfx('bite');
  }
  function pickFish(){
    var sp = spotById(S.spot);
    var t = TIDES[tideIdx < 0 ? tideInfo().idx : tideIdx];
    var b = baitById(S.bait);
    var weights = [];
    var total = 0;
    sp.fishes.forEach(function(f){
      var w = [100, 24, 6, 1.2][f.r];
      w *= Math.pow(b.rare, f.r);
      w *= Math.pow(t.rare, f.r);
      if (ev.on) w *= Math.pow(1.7, f.r);
      weights.push(w);
      total += w;
    });
    var roll = Math.random() * total;
    var acc = 0;
    for (var i = 0; i < sp.fishes.length; i++){
      acc += weights[i];
      if (roll <= acc) return sp.fishes[i];
    }
    return sp.fishes[sp.fishes.length - 1];
  }
  function startFight(){
    if (state !== 'bite') return;
    clearTimeout(biteTimer);
    started = true;
    state = 'fight';
    fish = pickFish();
    var t = TIDES[tideIdx < 0 ? tideInfo().idx : tideIdx];
    var ratio = Math.pow(Math.random(), 1 / t.size);
    fishSize = fish.len[0] + (fish.len[1] - fish.len[0]) * ratio;
    progress = 0.35;
    marker = 0.5;
    reeling = false;
    zoneW = clamp(zoneBaseNow() + (baitById(S.bait).zone || 0) - fish.s * 0.09, 0.15, 0.50);
    zonePhase = Math.random() * 6.28;
    lineMax = lineMaxNow();
    lineHp = lineMax;
    fightT = 0;
    zoneTime = 0;
    surgeT = 2.0 + Math.random() * 1.6;

  function resetUI(){
    castBtn.hidden = false;
    castBtn.textContent = '抛竿';

    fishShadow.classList.add('hide');
    fishShadow.classList.remove('bite');

  function awardCatch(f, size, perfect){
    var ratio = clamp((size - f.len[0]) / Math.max(0.1, f.len[1] - f.len[0]), 0, 1);
    var mul = 0.85 + ratio * 0.40;
    if (perfect) mul *= 1.25;
    var reward = Math.max(1, Math.round(f.v * mul));
    var rec = S.dex[f.id];
    var isNew = !rec;
    var prevBest = rec ? rec.best : 0;
    S.dex[f.id] = { n: rec ? rec.n + 1 : 1, best: Math.max(prevBest, size) };
    S.coin += reward;
    S.stats.catch++;
    S.stats.coins += reward;
    if (perfect) S.stats.perfect++;
    if (f.r >= 3) S.stats.legend++;
    if (size > S.stats.best) S.stats.best = size;
    questCatch(f, size, reward);
    var bonus = null;
    var sp = spotById(f.spot);
    if (spotDexCount(sp) >= sp.fishes.length && !S.bonus[sp.id]){
      S.bonus[sp.id] = 1;
      S.coin += SPOT_BONUS[sp.id];
      S.stats.coins += SPOT_BONUS[sp.id];
      bonus = { name: sp.name, reward: SPOT_BONUS[sp.id] };
    }
    checkAch();
    save();
    sync();
    return { reward:reward, isNew:isNew, prevBest:prevBest, perfect:perfect, ratio:ratio, bonus:bonus };
  }
  function showCatch(f, size, res){
    catchName.textContent = (res.isNew ? '新图鉴 · ' : '') + f.name;
    var tags = RARITY[f.r].n + ' · ' + size.toFixed(1) + ' cm';
    if (res.perfect) tags += ' · 完美收线';
    if (res.ratio >= 0.88) tags += ' · 巨物';
    catchInfo.textContent = tags;
    catchCoin.textContent = '+' + res.reward + ' 金币';
    catchPop.className = 'catch-pop ' + (f.r >= 3 ? 'legend' : (f.r >= 2 ? 'rare' : ''));
    clearTimeout(popTimer);
    popTimer = setTimeout(function(){ catchPop.classList.add('hide'); }, 1900);
    if (res.bonus) showNote(res.bonus.name + '图鉴完成 +' + res.bonus.reward + ' 金币');
    logEl.textContent = (res.isNew ? '新图鉴：' : '') + f.name + ' · ' + size.toFixed(1) + ' cm · +' + res.reward + ' 金币';
  }
  function endFight(win, reason){
    if (state !== 'fight') return;
    state = 'idle';
    var f = fish;
    var size = fishSize;
    var perfect = fightT > 0.5 && zoneTime / fightT >= 0.72;
    var res = null;
    if (win){
      res = awardCatch(f, size, perfect);
      setMsg((res.isNew ? '新图鉴！' : '') + '钓到 ' + f.name + '！');
      sfx('catch');
    } else {
      setMsg(reason === 'line' ? '线被拉断了，鱼跑了' : '线松了，鱼跑掉了');
      logEl.textContent = reason === 'line' ? '指针离开绿区会磨损鱼线，升级鱼线能多扛几次' : '收线时白色指针要保持在绿色区间内';
      sfx('fail');
    }
    fish = null;
    resetUI();
    if (res) showCatch(f, size, res);
    if (!win && f) logEl.textContent += '（' + f.name + ' ' + size.toFixed(1) + ' cm）';
  }
  function castClick(){

  function updateFight(dt, now){
    var t = TIDES[tideIdx < 0 ? tideInfo().idx : tideIdx];
    var speed = 0.85 + fish.s * 0.75 + (surgeLeft > 0 ? 1.25 : 0);
    zonePhase += dt * speed;
    zoneC = 0.5 + 0.30 * Math.sin(zonePhase);
    var zl = Math.max(0, zoneC - zoneW / 2);
    var zr = Math.min(1, zoneC + zoneW / 2);
    if (zr - zl < 0.08) zr = Math.min(1, zl + 0.08);

    surgeT -= dt;
    if (surgeT <= 0){
      surgeT = 2.0 + Math.random() * 1.7;
      surgeLeft = 0.85;
      surgeShown = false;
    }
    if (surgeLeft > 0){
      surgeLeft -= dt;
      if (!surgeShown && state === 'fight'){
        surgeShown = true;
        setMsg('猛拉！' + fish.name + '在挣扎，稳住');
      }
    }

    if (reeling) marker += reelSpeedNow() * dt;
    else marker -= (0.58 + fish.s * 0.10) * dt;
    if (surgeLeft > 0) marker -= (reeling ? 0.18 : 0.42) * dt;
    marker = clamp(marker, 0, 1);

    var inside = marker >= zl && marker <= zr;
    if (inside){
      progress += (0.30 + (S.line - 1) * 0.012 - fish.s * 0.08) * dt;
      lineHp = Math.min(lineMax, lineHp + 0.035 * dt);
      zoneTime += dt;
    } else {
      progress -= (0.16 + fish.s * 0.09) * dt;
      lineHp -= (0.10 + fish.s * 0.085) * dt;
    }
    fightT += dt;
    progress = clamp(progress, 0, 1);
    lineHp = Math.max(0, lineHp);

    zoneEl.style.left = (zl * 100) + '%';
    zoneEl.style.width = ((zr - zl) * 100) + '%';
    markerEl.style.left = 'calc(' + (marker * 100) + '% - 2px)';
    progBar.style.width = (progress * 100) + '%';
    lineHpBar.style.width = ((lineHp / lineMax) * 100) + '%';
    lineHpBar.classList.toggle('low', lineHp / lineMax < 0.30);

    if (progress >= 1) endFight(true, 'catch');
    else if (lineHp <= 0) endFight(false, 'line');
    else if (progress <= 0) endFight(false, 'slip');
  }

  function loop(t){
    if (!last) last = t;
    var dt = Math.min(0.05, (t - last) / 1000);
    last = t;
    if (state === 'power'){
      powerVal += dir * 1.25 * dt;
      if (powerVal > 1){ powerVal = 1; dir = -1; }
      if (powerVal < 0){ powerVal = 0; dir = 1; }
      powerFill.style.width = (powerVal * 100) + '%';
      updateLine(24 + powerVal * 52);
      bobber.style.left = (24 + powerVal * 52) + '%';
    } else if (state === 'fight' && fish){
      updateFight(dt, t);
    }
    requestAnimationFrame(loop);
  }

  function addCoins(n){
    n = Math.max(0, Math.floor(n || 0));
    S.coin += n;
    S.stats.coins += n;
    sync();
  }
  function buyUpgrade(kind){
    var lv, max, cost, label;
    if (kind === 'rod'){ lv = S.rod; max = MAX_ROD; cost = ROD_COST[lv]; label = '鱼竿'; }
    else if (kind === 'line'){ lv = S.line; max = MAX_LINE; cost = LINE_COST[lv]; label = '鱼线'; }
    else if (kind === 'reel'){ lv = S.reel; max = MAX_REEL; cost = REEL_COST[lv]; label = '卷线器'; }
    else return { ok:false, reason:'bad' };
    if (lv >= max) return { ok:false, reason:'max' };
    if (S.coin < cost) return { ok:false, reason:'poor', need: cost - S.coin };
    S.coin -= cost;
    if (kind === 'rod') S.rod++;
    else if (kind === 'line') S.line++;
    else S.reel++;
    var newLv = kind === 'rod' ? S.rod : (kind === 'line' ? S.line : S.reel);
    var unlockedSpot = null;
    if (kind === 'rod'){
      for (var si = 0; si < SPOTS.length; si++){
        if (SPOTS[si].req === S.rod) unlockedSpot = SPOTS[si];
      }
    }
    checkAch();
    save();
    sync();
    renderBook('upgrade');
    sfx('upgrade');
    showNote(unlockedSpot ? ('新海域解锁 · ' + unlockedSpot.name) : (label + '升级到 Lv.' + newLv));
    return { ok:true, kind:kind, level:newLv, cost:cost, unlockedSpot: unlockedSpot ? unlockedSpot.id : null };
  }
  function selectSpot(id){
    var sp = spotById(id);
    if (!sp || sp.id !== id) return { ok:false, reason:'bad' };
    if (S.rod < sp.req) return { ok:false, reason:'locked', req:sp.req };
    if (state !== 'idle'){ showNote('收线结束再换海域'); return { ok:false, reason:'busy' }; }
    S.spot = id;
    save();
    applySpot();
    renderBook('spots');
    setMsg('来到 ' + sp.name);
    sfx('click');
    return { ok:true, spot:id };
  }
  function selectBait(id){
    var b = baitById(id);
    if (!b || b.id !== id) return { ok:false, reason:'bad' };
    if (dexCount() < b.req) return { ok:false, reason:'locked', req:b.req };
    if (state !== 'idle'){ showNote('收线结束再换鱼饵'); return { ok:false, reason:'busy' }; }
    S.bait = id;

  function claimQuest(id){
    for (var i = 0; i < S.quests.length; i++){
      var q = S.quests[i];
      if (q && q.id === id){
        if (!q.done || q.claimed) return { ok:false, reason:'not-done' };
        q.claimed = true;
        var reward = q.reward;
        S.coin += reward;
        S.stats.coins += reward;
        S.quests.splice(i, 1);
        S.quests.push(makeQuest());
        save();
        sync();
        renderBook('quests');
        sfx('quest');
        showNote('委托完成 +' + reward + ' 金币');
        return { ok:true, reward:reward };
      }
    }
    return { ok:false, reason:'missing' };
  }

    var html = '<div class="fish-detail">' +

    setRod: function(n){ S.rod = clamp(Math.floor(n), 1, MAX_ROD); save(); sync(); return S.rod; },
    setLine: function(n){ S.line = clamp(Math.floor(n), 1, MAX_LINE); save(); sync(); return S.line; },
    setReel: function(n){ S.reel = clamp(Math.floor(n), 1, MAX_REEL); save(); sync(); return S.reel; },
    openBook: openBook,
    closeBook: closeBook,
    renderBook: renderBook,
    showFishDetail: showFishDetail,
    buildFishDetail: buildFishDetail,
    fishTextCount: Object.keys(FISH_TEXT).length,
    claimQuest: claimQuest,
    catchNow: function(idOrName, size){
      var f = FISH[idOrName] || null;
      if (!f){
        for (var i = 0; i < ALL_FISH.length; i++){ if (ALL_FISH[i].name === idOrName){ f = ALL_FISH[i]; break; } }
      }
      if (!f) return { ok:false, reason:'unknown' };
      var sz = typeof size === 'number' ? size : (f.len[0] + f.len[1]) / 2;
      var res = awardCatch(f, sz, true);
      showCatch(f, sz, res);
      return { ok:true, id:f.id, name:f.name, reward:res.reward, isNew:res.isNew, coin:S.coin, dex:dexCount() };
    },
    dexAll: function(){
      SPOTS.forEach(function(sp){
        sp.fishes.forEach(function(f){
          if (!S.dex[f.id]) S.dex[f.id] = { n:1, best:(f.len[0] + f.len[1]) / 2 };
        });
      });
      checkAch(); save(); sync(); return dexCount();
    },
    unlockAll: function(){
      S.rod = MAX_ROD; S.line = MAX_LINE; S.reel = MAX_REEL;
      checkAch(); save(); sync(); return { rod:S.rod, line:S.line, reel:S.reel };
    },
    reset: function(){
      S = defaultState();
      ensureQuests();
      applySpot();
      sync();
      save();
      return true;
    },
    forceBite: function(){
      if (state !== 'wait') return false;
      clearTimeout(waitTimer);
      beginBite();
      return true;
    },
    startFight: function(){
      if (state !== 'bite') return false;
      startFight();
      return true;
    },
    finish: function(win){ endFight(!!win, win ? 'catch' : 'slip'); return state; },
    setReeling: function(v){ if (state === 'fight') reeling = !!v; return reeling; },
    tick: function(){ tickTide(); tickEvent(); },
    tideInfo: tideInfo,
    constants: { spots:SPOTS, baits:BAITS, tides:TIDES, ach:ACHS, rodCost:ROD_COST, lineCost:LINE_COST, reelCost:REEL_COST, spotBonus:SPOT_BONUS }
  };
})();
</script>
