  /* ============================================================
     开局 / 流程
  ============================================================ */
  function startRun(isDaily){
    if (!isDaily){
      S.daily = 0;
      rand01 = Math.random;
      S.ascension = Math.max(0, Math.min(10, meta.ascension || 0));
    }
    var c = CLASSES[S.pickedClass] || CLASSES.iron;
    S.cls = S.pickedClass;
    S.hp = c.hp; S.maxHp = c.hp;
    if (S.ascension >= 8){ S.maxHp = Math.max(30, S.maxHp - 10); S.hp = S.maxHp; }
    S.gold = S.mode === 'deep' ? 50 : 0;
    S.floor = 1; S.endless = false;
    S.deck = c.deck.map(function(id){ return makeCard(id,false); });
    if (S.ascension >= 3) S.deck.push(makeCard('doubt', false));
    if (S.ascension >= 10) S.deck.push(makeCard(pick(['bound','voidcurse','decay']), false));
    S.relics = [c.relic];
    S.draw = []; S.hand = []; S.discard = []; S.exhaust = [];
    S.potions = []; S.bonusPotion = 0;
    S.shuffleCount = 0; S.totalExhaust = 0;
    S.reviveUsed = false;
    S.bossOffset = rnd(8);
    S.runFlags = { noDamage:false, maxGold:S.gold, seenThisRun:{} };
    if (S.cls === 'alchemist') addPotion(randomPotionId());
    S.energy = 3; S.maxEnergy = 3; S.block = 0;
    S.playerStatus = emptyStatus();
    S.enemy = null; S.turn = 1; S.playerTurn = false; S.busy = false; S.ending = false;
    S.battles = 0; S.eliteKills = 0; S.bossKills = 0;
    S.startedAt = Date.now(); S.logline = '';
    S.rewardCards = []; S.shop = null; S.pendingRelic = null;
    S.powers = {}; S.turnFlags = {}; S.combatFlags = {};
    S.winCounted = false;
    S.battleId++;
    S.deck.forEach(function(inst){ markSeen('cards', inst.id); });
    markSeen('relics', c.relic);
    S.potions.forEach(function(p){ markSeen('potions', p.id); });
    meta.runs++; saveMeta();
    buildRoute();
    hideViewer(); hideModal();
    $('start').classList.remove('on');
    document.body.dataset.screen = 'path';
    S.screen = 'path';
    sfx('turn');
    renderAll();
    if (S.daily) toast('每日挑战 · ' + (S.daily % 100) + ' 日', 'good');
    showRoutePreview(true);
  }

  function emptyStatus(){
    return { str:0, dex:0, vuln:0, weak:0, poison:0, burn:0, thorns:0, regen:0, frost:0 };
  }
  function hasRelic(id){
    return S.relics.indexOf(id) >= 0;
  }
  function addRelic(id){
    if (hasRelic(id)) return false;
    var r = RELICS[id]; if (!r) return false;
    S.relics.push(id);
    markSeen('relics', id);
    if (r.maxHp){ S.maxHp += r.maxHp; S.hp = Math.min(S.maxHp, S.hp + r.maxHp); }
    if (r.startGold) S.gold += r.startGold;
    return true;
  }
  function relicObjs(){
    return S.relics.map(function(id){ return RELICS[id]; }).filter(Boolean);
  }

  /* ---------------- 药水 ---------------- */
  function potionSlots(){
    var n = POTION_SLOTS_BASE + (S.bonusPotion || 0);
    relicObjs().forEach(function(r){ if (r.potionSlot) n += r.potionSlot; });
    if (S.ascension >= 5) n -= 1;
    return Math.max(1, n);
  }
  function makePotion(id){ return { id:id, uid:'p' + (++UID) }; }
  function addPotion(id){
    if (S.potions.length >= potionSlots()) return false;
    if (!POTIONS[id]) return false;
    S.potions.push(makePotion(id));
    markSeen('potions', id);
    return true;
  }
  function randomPotionId(){
    return pick(Object.keys(POTIONS));
  }
  function usePotion(idx){
    if (S.screen !== 'battle'){ toast('药水只能在战斗中使用', 'bad'); return; }
    if (!S.playerTurn || S.busy || S.ending) return;
    var p = S.potions[idx];
    if (!p) return;
    var pd = POTIONS[p.id];
    if (!pd) return;
    S.potions.splice(idx, 1);
    sfx('buff');
    var vp = FX.center($('classIcon'));
    FX.burst(vp.x, vp.y, 'violet', 16, {speed:170, up:40, size:9});
    FX.ring(vp.x, vp.y, 'violet', {r0:14, vr:240, max:.46, w:2});
    log('你使用了 ' + pd.name);
    resolveEffects(pd.effects || [], { source:'potion' });
    if (S.powers.alembic){
      gainPlayerBlock(S.powers.alembic * 3);
      drawCards(S.powers.alembic);
      popOn($('classIcon'), '⚗️ 药水共鸣', 'block');
    }
    checkCombatEnd();
    renderAll();
  }
  function grantPotion(id, silent){
    var ok = addPotion(id);
    if (!ok && !silent) toast('药水槽已满', 'bad');
    return ok;
  }

  /* ============================================================
     敌人生成
  ============================================================ */
  function scaleEnemy(id, floor, forcedKind){
    var t = ENEMIES[id];
    var asc = S.ascension || 0;
    var hpScale = 1 + 0.055 * (floor - 1);
    var dmgScale = 1 + 0.035 * (floor - 1);
    if (asc >= 1) hpScale += .08;
    if (asc >= 2) dmgScale += .08;
    if (asc >= 4 && (forcedKind === 'elite' || forcedKind === 'boss')) hpScale += .12;
    if (asc >= 5 && forcedKind === 'boss') hpScale += .2;
    if (asc >= 6){ hpScale += .06; dmgScale += .06; }
    if (asc >= 9){ hpScale += .08; if (forcedKind === 'boss') hpScale += .25; }
    if (asc >= 10) dmgScale += .10;
    var hp = Math.round((t.hp[0] + rnd(t.hp[1] - t.hp[0] + 1)) * hpScale);
    var moves = t.moves.map(function(m){
      return {
        label: m.label,
        effects: m.effects.map(function(e){
          var c = Object.assign({}, e);
          if (c.k === 'atk') c.n = Math.max(1, Math.round(c.n * dmgScale));
          return c;
        })
      };
    });
    return {
      id:id, name:t.name, icon:t.icon, kind:forcedKind || t.kind,
      hp:hp, maxHp:hp, block:0, status:emptyStatus(),
      moves:moves, mi:0, intent:moves[0], turn:0
    };
  }

  function chooseNormalEnemy(floor){
    var ids = ['rat','puppet','mushroom','emberling','assassin','gargoyle','scavenger','hexer','slime','sentinel','crab','wisp','spider','cultist','louse','claygolem','wraith','brute',
      'frostwolf','crystalmoth','bandit','tundrab','raven','iceelemental','soulwraith','apprentice','acolyte','starspawn','deephunter','voidcrawler','frostguard','lavahound'];
    if (floor <= 2) ids = ['rat','puppet','emberling','mushroom','louse','crystalmoth','raven'];
    else if (floor <= 4) ids = ['rat','puppet','mushroom','emberling','assassin','scavenger','spider','wisp','crab','cultist','frostwolf','bandit','soulwraith','apprentice'];
    else if (floor >= 9) ids = ['gargoyle','hexer','sentinel','claygolem','wraith','brute','tundrab','iceelemental','acolyte','starspawn','deephunter','voidcrawler','frostguard','lavahound','soulwraith'];
    var id = pick(ids);
    return scaleEnemy(id, floor, 'normal');
  }
  function chooseElite(floor){
    return scaleEnemy(pick(['forgeguard','cerberus','runic','inquisitor','hydra','clockwork','frostknight','soulgolem','ashenbishop','astralhunter']), floor, 'elite');
  }
  function chooseBoss(floor){
    var n = Math.floor((floor - 1) / 8);
    var order = ['core','deepforge','titanforge','madAlchemist','voidforge','frostqueen','ashenlord','starcolossus'];
    return scaleEnemy(order[(n + (S.bossOffset || 0)) % order.length], floor, 'boss');
  }

  /* ============================================================
     战斗开始 / 回合
  ============================================================ */
  function startBattle(kind){
    S.battleId++;
    var bid = S.battleId;
    S.kind = kind;
    S.enemy = kind === 'elite' ? chooseElite(S.floor) : kind === 'boss' ? chooseBoss(S.floor) : chooseNormalEnemy(S.floor);
    S.draw = shuffle(S.deck.slice());
    S.hand = []; S.discard = []; S.exhaust = [];
    S.energy = 3; S.maxEnergy = 3;
    S.block = 0; S.playerStatus = emptyStatus();
    S.turn = 0; S.playerTurn = false; S.busy = false; S.ending = false;
    S.powers = {}; S.turnFlags = {}; S.combatFlags = { mirrorUsed:false, exhaustCount:0, soulEngineCount:0, exhaustDrawCount:0, battleDamage:0, noFrostDecay:false, ironflowDone:false };
    S.startDraw = 0; S.startEnergy = 0;
    markSeen('enemies', S.enemy.id);
    relicObjs().forEach(function(r){
      if (r.startBlock) S.block += r.startBlock;
      if (r.startStr) S.playerStatus.str += r.startStr;
      if (r.startDex) S.playerStatus.dex += r.startDex;
      if (r.startThorns) S.playerStatus.thorns += r.startThorns;
      if (r.startRegen) S.playerStatus.regen += r.startRegen;
      if (r.startDraw) S.startDraw += r.startDraw;
      if (r.startBurn) S.enemy.status.burn += r.startBurn;
      if (r.startPoison) S.enemy.status.poison += r.startPoison;
      if (r.startFrost) S.enemy.status.frost += r.startFrost;
      if (r.energyBonus) S.maxEnergy += r.energyBonus;
      if (r.startHeal) healPlayer(r.startHeal);
      if (r.startPotion) addPotion(randomPotionId());
      if (r.startPotionId) addPotion(r.startPotionId);
      if (r.startEnergy) S.startEnergy += r.startEnergy;
      if (r.bloodpact) S.combatFlags.bloodpact = true;
      if (r.frostRetain) S.combatFlags.noFrostDecay = true;
    });
    var innate = [], plain = [];
    S.draw.forEach(function(inst){ if ((CARDS[inst.id] || {}).innate) innate.push(inst); else plain.push(inst); });
    S.draw = plain.concat(innate);
    if (S.block) popOn($('enemySide'), '🛡 +'+S.block, 'block');
    S.enemy.intent = S.enemy.moves[0];
    hideModal();
    S.screen = 'battle';
    log('战斗开始 · ' + S.enemy.name);
    snapGhost('playerHpGhost', S.maxHp ? (S.hp / S.maxHp * 100) : 0);
    snapGhost('enemyHpGhost', 100);
    renderAll();
    setTimeout(function(){ if (S.battleId === bid) startPlayerTurn(); }, 320);
  }

  function startPlayerTurn(){
    if (S.ending) return;
    var keepBlock = S.turn === 0 ? S.block : 0;
    S.turn++;
    S.playerTurn = true;
    S.busy = false;
    S.block = keepBlock;
    S.energy = S.maxEnergy + (S.turn === 1 ? (S.startEnergy || 0) : 0);
    S.turnFlags = { whet:true, zeroUsed:false, gainedBlock:false, attacksPlayed:0, skillsPlayed:0, shurikenDone:false, kunaiDone:false, letterDone:false, ironflowDone:false, toxinDraw:0 };
    var drawN = 5;
    if (S.turn === 1) drawN += S.startDraw;
    var rl = relicObjs();
    for (var i=0;i<rl.length;i++){
      if (rl[i].bloodpact){ S.hp -= 2; drawN += 1; popOn($('classIcon'), '-2', 'poison'); }
      if (rl[i].turnDraw) drawN += rl[i].turnDraw;
    }
    if (S.hp <= 0){ renderAll(); loseRun(); return; }
    drawCards(drawN);
    if (S.turn === 1){
      log('第 1 回合 · 抽 ' + drawN + ' 张牌');
    } else {
      log('第 ' + S.turn + ' 回合');
    }
    sfx('turn');
    renderAll();
    if (S.turn === 1) showBanner('战斗开始', S.enemy ? S.enemy.name : '');
    else showBanner('第 ' + S.turn + ' 回合', '你的回合');
    // 回合开始的能量回涌
    var orb = $('energyOrb');
    if (orb){
      var oc = FX.center(orb);
      FX.ring(oc.x, oc.y, 'gold', { r0: 8, vr: 170, max: .46, w: 2 });
      FX.burst(oc.x, oc.y, 'ember', 8, { speed: 80, g: -50, size: 6, ring: false });
    }
    var turnBtn = $('endTurn');
    if (turnBtn){
      turnBtn.classList.remove('ready'); void turnBtn.offsetWidth; turnBtn.classList.add('ready');
      setTimeout(function(){ turnBtn.classList.remove('ready'); }, 900);
    }
  }

  function drawCards(n){
    for (var i=0;i<n;i++){
      if (S.hand.length >= 10) break;
      if (!S.draw.length){
        if (!S.discard.length) break;
        S.draw = shuffle(S.discard);
        S.discard = [];
        S.shuffleCount = (S.shuffleCount || 0) + 1;
        if (hasRelic('sundial') && S.shuffleCount % 3 === 0){
          S.energy += 1;
          popOn($('energyOrb'), '🕰 +1', 'block');
          log('日晷转动：获得 1 点能量');
        }
      }
      S.hand.push(S.draw.pop());
    }
  }

  function canPlay(inst){
    var d = cardDef(inst);
    return !d.unplayable && S.energy >= d.cost;
  }

  function playCard(uid){
    if (S.screen !== 'battle' || !S.playerTurn || S.busy || S.ending) return;
    var idx = -1;
    for (var i=0;i<S.hand.length;i++) if (S.hand[i].uid === uid){ idx = i; break; }
    if (idx < 0) return;
    var inst = S.hand[idx];
    var d = cardDef(inst);
    var bid = S.battleId;
    if (d.unplayable){ toast('这张牌无法打出', 'bad'); sfx('bad'); return; }
    if (S.energy < d.cost){ toast('能量不足', 'bad'); sfx('bad'); return; }
    var el = document.querySelector('.hand .card[data-uid="'+uid+'"]');
    if (el) flyCard(el, d.type);
    S.energy -= d.cost;
    S.hand.splice(idx,1);
    S.busy = true;
    S.turnFlags.lastPlayedAttack = d.type === 'attack';
    S.turnFlags.attackBonus = 0;
    if (d.type === 'attack' && hasRelic('whetstone') && S.turnFlags.whet){
      S.turnFlags.attackBonus = 3;
      S.turnFlags.whet = false;
    }

    log('你打出 ' + d.name + (d.upgraded ? '+' : ''));
    sfx('card');
    resolveEffects(d.effects || [], {source:'player', card:d});
    S.turnFlags.attackBonus = 0;

    if (d.type === 'attack' && S.enemy && S.enemy.hp > 0){
      S.turnFlags.attacksPlayed = (S.turnFlags.attacksPlayed || 0) + 1;
      if (S.powers.ironflow && !S.turnFlags.ironflowDone){
        S.turnFlags.ironflowDone = true;
        gainPlayerBlock(S.powers.ironflow);
        drawCards(1);
        popOn($('classIcon'), '🌊 洪流', 'block');
      }
      if (S.powers.venomous) applyPoison(S.enemy, S.powers.venomous);
      if (S.turnFlags.attacksPlayed === 3){
        if (hasRelic('shuriken') && !S.turnFlags.shurikenDone){
          S.turnFlags.shurikenDone = true;
          addStatus(S.playerStatus, 'str', 1);
          popOn($('classIcon'), '✴️ +1 力量', 'block');
        }
        if (hasRelic('kunai') && !S.turnFlags.kunaiDone){
          S.turnFlags.kunaiDone = true;
          addStatus(S.playerStatus, 'dex', 1);
          popOn($('classIcon'), '🔪 +1 敏捷', 'block');
        }
      }
    }
    if (d.type === 'skill'){
      S.turnFlags.skillsPlayed = (S.turnFlags.skillsPlayed || 0) + 1;
      if (S.turnFlags.skillsPlayed === 3 && hasRelic('letterOpener') && !S.turnFlags.letterDone){
        S.turnFlags.letterDone = true;
        dealEnemyDamage(5, 1, {source:'relic'}, true);
        popOn($('enemySide'), '✉️ 5', '');
      }
    }

    if (d.power && d.power.key){
      S.powers[d.power.key] = (S.powers[d.power.key] || 0) + d.power.n;
    }
    if (d.power || d.exhaust){
      S.exhaust.push(inst);
      if (d.exhaust) onExhaust();
    } else S.discard.push(inst);

    renderAll();
    setTimeout(function(){
      if (S.battleId !== bid) return;
      S.busy = false;
      checkCombatEnd();
      renderAll();
    }, 230);
  }

  function resolveEffects(effects, ctx){
    for (var i=0;i<effects.length;i++){
      if (S.ending) return;
      var e = effects[i];
      switch(e.k){
        case 'dmg': dealEnemyDamage(e.n, e.hits || 1, ctx); break;
        case 'blk': gainPlayerBlock(e.n); break;
        case 'drw': drawCards(e.n || 1); break;
        case 'nrg': S.energy += (e.n || 1); break;
        case 'heal': healPlayer(e.n || 0); break;
        case 'lose': damagePlayerRaw(e.n || 0); break;
        case 'st':
          if (e.who === 'e'){
            if (e.s === 'poison') applyPoison(S.enemy, e.n);
            else addStatus(S.enemy.status, e.s, e.n);
          } else addStatus(S.playerStatus, e.s, e.n);
          break;
        case 'sp': specialEffect(e, ctx); break;
        case 'addCard':
          for (var ac=0; ac<(e.n || 1); ac++) S.discard.push(makeCard(e.id, false));
          popOn($('classIcon'), '🃏 +'+(e.n || 1), 'poison');
          break;
      }
      if (S.hp <= 0 || (S.enemy && S.enemy.hp <= 0)) { checkCombatEnd(); return; }
    }
  }

  function specialEffect(e, ctx){
    switch(e.s){
      case 'bodySlam':
        dealEnemyDamage(S.block, 1, ctx, true);
        break;
      case 'entrench':
        S.block *= 2;
        popOn($('classIcon'), '🛡 翻倍', 'block');
        break;
      case 'emberburst': {
        var b = S.enemy.status.burn || 0;
        if (b > 0) dealEnemyDamage(b * (e.n || 2), 1, ctx, true);
        else toast('敌人身上没有灼烧', 'bad');
        break;
      }
      case 'immolate':
        S.enemy.status.burn *= (e.n || 2);
        if (S.enemy.status.burn > 0) popOn($('enemySide'), '🔥 '+S.enemy.status.burn, 'burn');
        break;
      case 'poisonBonus':
        if (S.enemy.status.poison > 0) dealEnemyDamage(e.n || 0, 1, ctx, true);
        break;
      case 'venomBurst': {
        var pz = (S.enemy && S.enemy.status.poison) || 0;
        if (pz > 0) dealEnemyDamage(pz * (e.n || 2), 1, ctx, true);
        else toast('敌人身上没有中毒', 'bad');
        break;
      }
      case 'execute': {
        var th = e.p || .5;
        if (S.enemy && S.enemy.hp > 0 && S.enemy.hp / S.enemy.maxHp < th) dealEnemyDamage(e.n || 0, 1, ctx, true);
        break;
      }
      case 'cleanse':
        S.playerStatus.vuln = 0; S.playerStatus.weak = 0;
        popOn($('classIcon'), '净化', 'heal');
        break;
      case 'counter':
        dealEnemyDamage(e.n || 0, 1, ctx, true);
        if (S.turnFlags.gainedBlock) dealEnemyDamage(e.n2 || 0, 1, ctx, true);
        break;
      case 'lastStand':
        gainPlayerBlock(S.hp / S.maxHp < .5 ? (e.n || 0) : (e.n2 || 0));
        break;
      case 'wildfire':
        addStatus(S.enemy.status, 'burn', S.hand.length + (e.n || 0));
        popOn($('enemySide'), '🔥 +' + (S.hand.length + (e.n || 0)), 'burn');
        break;
      case 'catalyze':
        if (S.enemy.status.poison > 0){
          S.enemy.status.poison *= (e.n || 2);
          popOn($('enemySide'), '☠ ' + S.enemy.status.poison, 'poison');
        } else toast('敌人身上没有中毒', 'bad');
        break;
      case 'volatile':
        if (S.enemy.status.poison > 0) applyPoison(S.enemy, e.n || 0);
        break;
      case 'brew': {
        var want = e.n || 1, got = 0;
        for (var bi=0;bi<want;bi++){ if (addPotion(randomPotionId())) got++; }
        if (got && S.screen === 'battle') popOn($('potionBar'), '🧪 +'+got, 'heal');
        if (got < want) drawCards(want - got);
        break;
      }
      case 'transmute': {
        if (S.hand.length){
          var ti = rnd(S.hand.length);
          var gone = S.hand.splice(ti,1)[0];
          S.exhaust.push(gone);
          onExhaust();
          popOn($('classIcon'), '♻ ' + cardDef(gone).name, 'block');
        }
        S.energy += (e.n || 2);
        drawCards(e.n2 || 2);
        break;
      }
      case 'ironOath':
        gainPlayerBlock(e.n || 0);
        if ((S.turnFlags.attacksPlayed || 0) > 0) gainPlayerBlock(e.n2 || 0);
        break;
      case 'comboStrike': {
        var combo = (e.n || 0) + (S.turnFlags.attacksPlayed || 0) * (e.n2 || 0);
        dealEnemyDamage(combo, 1, ctx, true);
        break;
      }
      case 'halfSlam':
        dealEnemyDamage(Math.floor(S.block * (e.n ? 1 : .5)), 1, ctx, true);
        break;
      case 'ashGuard': {
        var ab = e.n || 0;
        var burnN = (S.enemy && S.enemy.status.burn) || 0;
        ab += Math.floor(burnN / (e.n2 || 3)) * 2;
        gainPlayerBlock(ab);
        break;
      }
      case 'inflame': {
        var burnNow = (S.enemy && S.enemy.status.burn) || 0;
        dealEnemyDamage(burnNow >= (e.n2 || 6) ? (e.n || 0) * 2 : (e.n || 0), 1, ctx, true);
        break;
      }
      case 'consumeBurn': {
        var cb = (S.enemy && S.enemy.status.burn) || 0;
        if (cb > 0){
          S.enemy.status.burn = 0;
          popOn($('enemySide'), '🔥 归零', 'burn');
          dealEnemyDamage(cb * (e.n || 3), 1, ctx, true);
        } else toast('敌人身上没有灼烧', 'bad');
        break;
      }
      case 'pierce':
        dealEnemyDamage(e.n || 0, 1, ctx, true);
        if (S.enemy && S.enemy.status.vuln > 0) dealEnemyDamage(e.n2 || 0, 1, ctx, true);
        break;
      case 'hunt':
        dealEnemyDamage(e.n || 0, 1, ctx, true);
        if (S.enemy && S.enemy.status.poison >= (e.n2 || 5)) dealEnemyDamage(e.n || 0, 1, ctx, true);
        break;
      case 'flaskGuard': {
        var empty = Math.max(0, potionSlots() - S.potions.length);
        gainPlayerBlock((e.n || 0) + empty * (e.n2 || 2));
        break;
      }
      case 'venomVolley': {
        var pv = (S.enemy && S.enemy.status.poison) || 0;
        if (pv > 0){
          for (var vi=0; vi<(e.n || 2); vi++){
            if (!S.enemy || S.enemy.hp <= 0) break;
            dealEnemyDamage(pv, 1, ctx, true);
          }
        } else toast('敌人身上没有中毒', 'bad');
        break;
      }
      case 'solvent':
        if (S.enemy){
          S.enemy.block = 0;
          addStatus(S.enemy.status, 'weak', e.n || 3);
          popOn($('enemySide'), '🧴 溶解', 'block');
        }
        break;
      case 'toxicBomb': {
        var tp = (S.enemy && S.enemy.status.poison) || 0;
        dealEnemyDamage((e.n || 0) + tp, 1, ctx, true);
        break;
      }
      case 'recall': {
        var want = e.n || 1, moved = 0;
        while (moved < want && S.exhaust.length && S.hand.length < 10){
          var ri = rnd(S.exhaust.length);
          S.hand.push(S.exhaust.splice(ri, 1)[0]);
          moved++;
        }
        if (moved) popOn($('classIcon'), '🕯 +'+moved, 'heal');
        else toast('消耗堆里没有牌', 'bad');
        break;
      }
      case 'cleanseAll':
        S.playerStatus.vuln = 0; S.playerStatus.weak = 0;
        S.playerStatus.poison = 0; S.playerStatus.burn = 0;
        popOn($('classIcon'), '净化', 'heal');
        break;
      case 'cleanseWeak':
        S.playerStatus.weak = 0;
        popOn($('classIcon'), '净化', 'heal');
        break;
      case 'exhaustBlock':
        gainPlayerBlock(S.exhaust.length * (e.n || 1));
        break;
      case 'exhaustBurst':
        if (S.exhaust.length) dealEnemyDamage(S.exhaust.length * (e.n || 1), 1, ctx, true);
        else toast('消耗堆里没有牌', 'bad');
        break;
      case 'soulFeast':
        dealEnemyDamage(e.n || 0, 1, ctx, true);
        if (S.exhaust.length) healPlayer(Math.min(10, S.exhaust.length));
        break;
      case 'requiem': {
        var hitsN = 1 + Math.floor(S.exhaust.length / 3);
        dealEnemyDamage(e.n || 0, hitsN, ctx, true);
        break;
      }
      case 'elegy':
        dealEnemyDamage(e.n || 0, 1, ctx, true);
        if (S.exhaust.length >= (e.n2 || 6)) dealEnemyDamage(e.n || 0, 1, ctx, true);
        break;
      case 'shatter':
        dealEnemyDamage(e.n || 0, 1, ctx, true);
        if (S.enemy && S.enemy.status.frost > 0) dealEnemyDamage(e.n2 || 0, 1, ctx, true);
        break;
      case 'frostBurst': {
        var fz = (S.enemy && S.enemy.status.frost) || 0;
        if (fz > 0) dealEnemyDamage(fz * (e.n || 3), 1, ctx, true);
        else toast('敌人身上没有冰霜', 'bad');
        break;
      }
      case 'absolute':
        if (S.enemy){
          dealEnemyDamage(e.n || 0, 2, ctx, true);
          S.enemy.status.frost *= 2;
          if (S.enemy.status.frost > 0) popOn($('enemySide'), '❄ '+S.enemy.status.frost, 'block');
        }
        break;
      case 'glacier': {
        var gz = (S.enemy && S.enemy.status.frost) || 0;
        dealEnemyDamage((e.n || 0) + gz * 2, 1, ctx, true);
        break;
      }
      case 'lastwinter': {
        var lz = (S.enemy && S.enemy.status.frost) || 0;
        dealEnemyDamage((e.n || 0) + lz * 3, 1, ctx, true);
        break;
      }
    }
  }

  function addStatus(st, key, n){
    if (!key) return;
    st[key] = (st[key] || 0) + (n || 0);
  }
  function applyPoison(enemy, n){
    if (!enemy || !enemy.status) return;
    var extra = S.powers.catalyze || 0;
    addStatus(enemy.status, 'poison', (n || 0) + extra);
    if (extra) popOn($('enemySide'), '☠ +' + ((n || 0) + extra), 'poison');
    if (S.powers.toxinflow && (S.turnFlags.toxinDraw || 0) < S.powers.toxinflow){
      S.turnFlags.toxinDraw = (S.turnFlags.toxinDraw || 0) + 1;
      drawCards(1);
    }
    if (enemy === S.enemy){
      var pt = FX.center(document.querySelector('.enemy-visual'));
      FX.burst(pt.x, pt.y, 'mint', 7, {speed:70, g:-90, size:7, ring:false});
    }
  }
  function onExhaust(){
    S.combatFlags.exhaustCount = (S.combatFlags.exhaustCount || 0) + 1;
    S.totalExhaust = (S.totalExhaust || 0) + 1;
    var eb = S.powers.soulforge || 0;
    relicObjs().forEach(function(r){ if (r.exhaustBlock) eb += r.exhaustBlock; });
    if (eb) gainPlayerBlock(eb);
    var ed = 0;
    relicObjs().forEach(function(r){ if (r.exhaustDraw) ed = r.exhaustDraw; });
    if (ed && S.combatFlags.exhaustCount % ed === 0){
      drawCards(1);
      popOn($('classIcon'), '🪢 抽 1', 'block');
    }
    var se = 0;
    relicObjs().forEach(function(r){ if (r.soulEngine) se = r.soulEngine; });
    if (se && S.combatFlags.exhaustCount % se === 0){
      S.energy += 1;
      popOn($('energyOrb'), '⚙ +1', 'block');
      log('灵魂引擎：获得 1 点能量');
    }
  }

  function gainPlayerBlock(n){
    var amount = Math.max(0, (n || 0) + (S.playerStatus.dex || 0));
    if (!amount) return;
    S.block += amount;
    S.turnFlags.gainedBlock = true;
    popOn($('classIcon'), '🛡 +'+amount, 'block');
    var bp = FX.center($('classIcon'));
    FX.ring(bp.x, bp.y, 'cyan', {r0:16, vr:190, max:.34, w:1.6});
    FX.burst(bp.x, bp.y, 'cyan', 5, {speed:80, g:0, size:5, ring:false});
    sfx('block');
  }

  function dealEnemyDamage(base, hits, ctx, ignoreBonus){
    if (!S.enemy || S.enemy.hp <= 0) return;
    var dmgBase = base + ((ctx && ctx.source === 'potion') ? 0 : (S.playerStatus.str || 0));
    if (S.playerStatus.weak > 0) dmgBase = Math.floor(dmgBase * .75);
    var bonus = (!ignoreBonus && ctx && ctx.source === 'player' && S.turnFlags.attackBonus) ? S.turnFlags.attackBonus : 0;
    var total = 0, blockedTotal = 0;
    for (var h=0; h<hits; h++){
      if (!S.enemy || S.enemy.hp <= 0) break;
      var dmg = dmgBase + (h === 0 ? bonus : 0);
      if (S.enemy.status.vuln > 0) dmg = Math.floor(dmg * 1.5);
      if (hasRelic('executioner') && S.enemy.hp / S.enemy.maxHp < .3) dmg = Math.floor(dmg * 1.5);
      if (hasRelic('executioner2') && S.enemy.hp / S.enemy.maxHp < .5) dmg = Math.floor(dmg * 1.25);
      if (S.enemy.status.frost > 0){
        if (S.powers.frostbite) dmg += S.powers.frostbite;
        var fbr = 0;
        relicObjs().forEach(function(r){ if (r.frostBite) fbr += r.frostBite; });
        dmg += fbr;
      }
      dmg = Math.max(0, dmg);
      var blocked = Math.min(S.enemy.block, dmg);
      S.enemy.block -= blocked;
      blockedTotal += blocked;
      var hpLoss = dmg - blocked;
      S.enemy.hp -= hpLoss;
      total += hpLoss;
      if (hpLoss > 0) popOn($('enemySide'), '-'+hpLoss, hpLoss >= 15 ? 'crit' : '');
      else popOn($('enemySide'), '🛡 '+blocked, 'block');
      if (S.enemy.hp < 0) S.enemy.hp = 0;
    }
    var blockedAll = blockedTotal > 0 && total === 0;
    if (bonus) S.turnFlags.attackBonus = 0;
    if (S.enemy && S.enemy.status.thorns > 0 && total > 0){
      damagePlayerRaw(S.enemy.status.thorns);
      popOn($('classIcon'), '🌵 '+S.enemy.status.thorns, 'poison');
    }
    var side = $('enemySide');
    side.classList.remove('shake'); void side.offsetWidth; side.classList.add('shake');
    var ev = document.querySelector('.enemy-visual');
    var ep = FX.center(ev);
    if (total > 0){
      var heavy = total >= 15;
      FX.burst(ep.x, ep.y, 'ember', heavy ? 26 : Math.min(18, 8 + total), {speed: heavy ? 310 : 200, size: heavy ? 12 : 8, up: 30});
      FX.burst(ep.x, ep.y, 'fire', heavy ? 12 : 6, {speed: heavy ? 210 : 130, size: heavy ? 9 : 6, up: 20, ring: false});
      FX.slash(ep.x, ep.y, 'white', {n: heavy ? 3 : 2, len: heavy ? 130 : 82, rot: -.9 + Math.random()*1.8});
      FX.ring(ep.x, ep.y, heavy ? 'gold' : 'ember', {r0: heavy ? 14 : 10, vr: heavy ? 300 : 210, max: .42, w: heavy ? 2.6 : 1.8});
      if (heavy) FX.flash('red');
      var art = $('enemyArt');
      if (art){
        art.classList.add('hit');
        setTimeout(function(){ art.classList.remove('hit'); }, 120);
      }
      if (ev && heavy){
        ev.classList.remove('punch'); void ev.offsetWidth; ev.classList.add('punch');
        setTimeout(function(){ ev.classList.remove('punch'); }, 300);
      }
      FX.shake(heavy);
      sfx('hit');
    } else if (blockedAll) {
      FX.burst(ep.x, ep.y, 'cyan', 8, {speed:140, size:7});
    }
    log('造成 ' + total + ' 点伤害' + (S.enemy.block ? '（剩余格挡 '+S.enemy.block+'）' : ''));
  }

  function enemyAttack(base, hits, moveLabel){
    if (!S.enemy) return;
    var dmgBase = base + (S.enemy.status.str || 0);
    if (S.enemy.status.weak > 0) dmgBase = Math.floor(dmgBase * .75);
    if ((S.enemy.status.frost || 0) > 0) dmgBase = Math.max(1, dmgBase - S.enemy.status.frost);
    var total = 0;
    for (var h=0; h<hits; h++){
      var dmg = dmgBase;
      if (S.playerStatus.vuln > 0) dmg = Math.floor(dmg * 1.5);
      if (hasRelic('mirror') && !S.combatFlags.mirrorUsed){
        dmg = Math.ceil(dmg / 2);
        S.combatFlags.mirrorUsed = true;
        popOn($('classIcon'), '🪞 减半', 'block');
      }
      dmg = Math.max(1, dmg);
      var blocked = Math.min(S.block, dmg);
      S.block -= blocked;
      var hpLoss = dmg - blocked;
      S.hp -= hpLoss;
      total += hpLoss;
      S.combatFlags.battleDamage = (S.combatFlags.battleDamage || 0) + hpLoss;
      if (hpLoss > 0) hurtPlayer(hpLoss);
      else popOn($('classIcon'), '🛡 '+blocked, 'block');
      if (S.hp < 0) S.hp = 0;
    }
    if (total > 0){
      var pp = FX.center($('classIcon'));
      FX.burst(pp.x, pp.y, 'blood', Math.min(26, 9 + total), {speed:250, size: total>=10?10:8});
      FX.burst(pp.x, pp.y, 'ember', total>=10?8:4, {speed:150, size:7, ring:false});
      FX.slash(pp.x, pp.y, 'white', {n:2, len:72, rot:-.6});
      FX.ring(pp.x, pp.y, 'blood', {r0:12, vr: total>=10?320:220, max:.46, w: total>=10?2.8:1.8});
      if (total >= 14 || S.hp / S.maxHp < .3) FX.flash('red');
      sfx('hit');
    }
    if (S.playerStatus.thorns > 0 && S.enemy){
      var th = S.playerStatus.thorns;
      S.enemy.hp -= th;
      if (S.enemy.hp < 0) S.enemy.hp = 0;
      popOn($('enemySide'), '🌵 '+th, 'poison');
      log('荆棘反伤 ' + th);
    }
    log(S.enemy.name + ' 使用「' + (moveLabel||'攻击') + '」，造成 ' + total + ' 点伤害');
  }

  function damagePlayerRaw(n){
    if (!n) return;
    S.hp -= n;
    if (S.combatFlags) S.combatFlags.battleDamage = (S.combatFlags.battleDamage || 0) + n;
    if (S.hp < 0) S.hp = 0;
    popOn($('classIcon'), '-'+n, 'poison');
    hurtPlayer(n, true);
    if (S.hp <= 0) checkCombatEnd();
  }

  function healPlayer(n){
    if (!n) return;
    var before = S.hp;
    S.hp = Math.min(S.maxHp, S.hp + n);
    if (S.hp > before){
      popOn($('classIcon'), '+'+ (S.hp-before), 'heal');
      var hp = FX.center($('classIcon'));
      FX.burst(hp.x, hp.y, 'mint', 8, {speed:80, g:-120, size:7, ring:false});
      FX.ring(hp.x, hp.y, 'mint', {r0:12, vr:150, max:.4, w:1.6});
      sfx('heal');
    }
  }

  function hurtPlayer(n, quiet){
    var el = $('classIcon');
    el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse');
    if (!quiet){
      document.body.classList.remove('hurt'); void document.body.offsetWidth; document.body.classList.add('hurt');
      if (n >= 10) FX.shake(true);
      else FX.shake(false);
    }
  }

  /* ============================================================
     敌人回合 / 状态结算
  ============================================================ */
  function endTurn(){
    if (S.screen !== 'battle' || !S.playerTurn || S.busy || S.ending) return;
    S.playerTurn = false;
    S.busy = true;
    // 能力
    if (S.powers.melt) { S.enemy.status.burn += S.powers.melt; popOn($('enemySide'), '🔥 +'+S.powers.melt, 'burn'); }
    if (S.powers.ash) gainPlayerBlock(S.powers.ash);
    if (S.powers.temper) { addStatus(S.playerStatus, 'str', S.powers.temper); popOn($('classIcon'), '💪 +'+S.powers.temper, 'block'); }
    if (S.powers.regenaura) healPlayer(S.powers.regenaura);
    if (S.powers.venom && S.enemy) applyPoison(S.enemy, S.powers.venom);
    if (S.powers.fumes && S.enemy) applyPoison(S.enemy, S.powers.fumes);
    if (S.powers.spikes) { addStatus(S.playerStatus, 'thorns', S.powers.spikes); popOn($('classIcon'), '🌵 +'+S.powers.spikes, 'block'); }
    if (S.powers.fireform && S.enemy){
      addStatus(S.playerStatus, 'str', S.powers.fireform);
      S.enemy.status.burn += S.powers.fireform;
      popOn($('enemySide'), '🔥 +'+S.powers.fireform, 'burn');
    }
    if (S.powers.juggernaut) gainPlayerBlock((S.playerStatus.str || 0) * S.powers.juggernaut);
    if (S.powers.soulward) gainPlayerBlock(S.powers.soulward);
    if (S.powers.molten && S.enemy){
      gainPlayerBlock(S.powers.molten);
      S.enemy.status.burn += 1;
      popOn($('enemySide'), '🔥 +1', 'burn');
    }
    if (S.powers.winter && S.enemy){
      S.enemy.status.frost += S.powers.winter;
      popOn($('enemySide'), '❄ +'+S.powers.winter, 'block');
    }
    if (S.powers.eternalwinter && S.enemy){
      S.enemy.status.frost += S.powers.eternalwinter;
      S.combatFlags.noFrostDecay = true;
      popOn($('enemySide'), '❄ +'+S.powers.eternalwinter, 'block');
    }
    if (S.powers.undying && S.exhaust.length >= 5){
      addStatus(S.playerStatus, 'str', S.powers.undying);
      popOn($('classIcon'), '👑 +'+S.powers.undying+' 力量', 'block');
    }
    if (S.powers.mastermix && S.enemy && (S.powers.mastermix >= 2 || S.turn % 2 === 0)){
      if (addPotion(randomPotionId())) popOn($('potionBar'), '🧪 +1', 'heal');
    }
    tickStatuses('player');
    // 手牌上的回合结束效果（诅咒），放在状态结算之后，避免当回合就被衰减
    S.hand.forEach(function(handInst){
      var hd = cardDef(handInst);
      if (hd.endTurn) resolveEffects(hd.endTurn, {source:'curse'});
    });
    renderAll();
    if (S.ending) return;
    if (S.hp <= 0){ loseRun(); return; }
    // 弃手牌：保留 / 虚无 / 普通弃置
    var retainAll = hasRelic('runicPyramid');
    var kept = [], discarded = 0;
    for (var i=0;i<S.hand.length;i++){
      var inst = S.hand[i];
      var cd = cardDef(inst);
      if (cd.retain || retainAll) kept.push(inst);
      else if (cd.ethereal) S.exhaust.push(inst);
      else { S.discard.push(inst); discarded++; }
    }
    S.hand = kept;
    if (hasRelic('toughBandages') && discarded) gainPlayerBlock(Math.min(5, discarded));
    log('回合结束');
    renderAll();
    var bid = S.battleId;
    setTimeout(function(){ if (S.battleId === bid) enemyTurn(); }, 420);
  }

  function statusFX(who, col){
    var el = who === 'player' ? $('classIcon') : document.querySelector('.enemy-visual');
    var pt = FX.center(el);
    FX.burst(pt.x, pt.y, col, 6, {speed:70, g:-80, size:7, ring:false});
  }
  function tickStatuses(who){
    var st = who === 'player' ? S.playerStatus : (S.enemy ? S.enemy.status : null);
    if (!st) return;
    if (st.poison > 0){
      var p = st.poison;
      if (who === 'player'){ S.hp -= p; hurtPlayer(p, true); popOn($('classIcon'), '☠ '+p, 'poison'); }
      else { S.enemy.hp -= p; popOn($('enemySide'), '☠ '+p, 'poison'); }
      statusFX(who, 'mint');
      st.poison -= 1;
    }
    if (S.hp <= 0 && who === 'player'){ S.hp = 0; return; }
    if (st.burn > 0){
      var b = st.burn;
      if (who === 'player'){ S.hp -= b; hurtPlayer(b, true); popOn($('classIcon'), '🔥 '+b, 'burn'); }
      else { S.enemy.hp -= b; popOn($('enemySide'), '🔥 '+b, 'burn'); }
      statusFX(who, 'fire');
    }
    if (who === 'player' && S.hp <= 0){ S.hp = 0; return; }
    if (who === 'enemy' && S.enemy && S.enemy.hp <= 0){ S.enemy.hp = 0; }
    if (st.regen > 0){
      if (who === 'player') healPlayer(st.regen);
      else if (S.enemy){ S.enemy.hp = Math.min(S.enemy.maxHp, S.enemy.hp + st.regen); popOn($('enemySide'), '+'+st.regen, 'heal'); }
      st.regen -= 1;
    }
    if (st.vuln > 0) st.vuln -= 1;
    if (st.weak > 0) st.weak -= 1;
    if (who === 'enemy' && st.frost > 0 && !S.combatFlags.noFrostDecay){
      st.frost -= 1;
      statusFX('enemy', 'cyan');
    }
  }

  function enemyTurn(){
    if (S.ending || !S.enemy) return;
    var bid = S.battleId;
    S.busy = true;
    S.enemy.block = 0;
    var mv = S.enemy.intent || S.enemy.moves[0];
    log(S.enemy.name + ' 准备「' + mv.label + '」');
    showBanner('敌方回合', mv.label || '', 'enemy');
    renderAll();
    // 敌方攻击预警：从敌人到玩家的一道光束 + 落点警戒环
    var incoming = (mv.effects || []).some(function(e){ return e.k === 'atk'; });
    if (incoming){
      var ep = FX.center(document.querySelector('.enemy-visual'));
      var pp = FX.center($('classIcon'));
      FX.beam(ep.x, ep.y, pp.x, pp.y, 'blood', { max: .48, w: 12, n: 9 });
      FX.ring(pp.x, pp.y, 'blood', { r0: 24, vr: 62, max: .48, w: 2.2 });
    }
    setTimeout(function(){
      if (S.battleId !== bid || S.ending) return;
      executeEnemyMove(mv);
      if (S.hp <= 0){ renderAll(); loseRun(); return; }
      if (S.enemy.hp <= 0){ renderAll(); enemyDeathFX(); winBattle(); return; }
      tickStatuses('enemy');
      renderAll();
      if (S.enemy.hp <= 0){ enemyDeathFX(); setTimeout(function(){ if (S.battleId === bid) winBattle(); }, 260); return; }
      S.enemy.mi = (S.enemy.mi + 1) % S.enemy.moves.length;
      S.enemy.intent = S.enemy.moves[S.enemy.mi];
      S.enemy.turn++;
      S.busy = false;
      setTimeout(function(){ if (S.battleId === bid) startPlayerTurn(); }, 300);
    }, 480);
  }

  function executeEnemyMove(mv){
    (mv.effects || []).forEach(function(e){
      if (S.ending || !S.enemy) return;
      switch(e.k){
        case 'atk': enemyAttack(e.n, e.hits || 1, mv.label); break;
        case 'blk': S.enemy.block += e.n; popOn($('enemySide'), '🛡 +'+e.n, 'block'); break;
        case 'buff': addStatus(S.enemy.status, e.s, e.n); popOn($('enemySide'), (STATUS[e.s]||{}).icon+' +'+e.n, 'heal'); break;
        case 'debuff': addStatus(S.playerStatus, e.s, e.n); popOn($('classIcon'), (STATUS[e.s]||{}).icon+' +'+e.n, 'poison'); break;
        case 'heal':
          S.enemy.hp = Math.min(S.enemy.maxHp, S.enemy.hp + e.n);
          popOn($('enemySide'), '+'+e.n, 'heal');
          break;
        case 'addCard': {
          var cc = CARDS[e.id] || {name:'未知'};
          for (var ci=0;ci<(e.n||1);ci++) S.discard.push(makeCard(e.id,false));
          popOn($('classIcon'), '🃏 +'+(e.n||1), 'poison');
          log(S.enemy.name + ' 将 ' + (e.n||1) + ' 张「' + cc.name + '」塞进你的弃牌堆');
          break;
        }
      }
    });
  }

  /* ============================================================
     战斗结束
  ============================================================ */
  function enemyDeathFX(){
    var ev = document.querySelector('.enemy-visual');
    var pt = FX.center(ev);
    FX.burst(pt.x, pt.y, 'gold', 30, {speed:360, size:13});
    FX.burst(pt.x, pt.y, 'ember', 20, {speed:250, size:10});
    FX.burst(pt.x, pt.y, 'white', 12, {speed:180, size:8, ring:false});
    FX.slash(pt.x, pt.y, 'white', {n:3, len:150});
    FX.ring(pt.x, pt.y, 'gold', {r0:10, vr:520, max:.6, w:3});
    FX.ring(pt.x, pt.y, 'fire', {r0:26, vr:340, max:.5, w:2});
    for (var mi=0; mi<9; mi++) FX.mote(pt.x + (Math.random()-.5)*80, pt.y + (Math.random()-.5)*60, mi % 2 ? 'gold' : 'ember', { spread: 22, size: 8 });
    if (ev){
      ev.classList.add('dying');
      setTimeout(function(){ ev.classList.remove('dying'); }, 620);
    }
    FX.shake(true);
    FX.flash('gold');
  }
  function checkCombatEnd(){
    if (S.ending) return;
    if (S.hp <= 0){ loseRun(); return; }
    if (S.enemy && S.enemy.hp <= 0){
      S.ending = true;
      enemyDeathFX();
      var bid = S.battleId;
      setTimeout(function(){ if (S.battleId === bid) winBattle(); }, 420);
    }
  }

  function winBattle(){
    if (!S.enemy) return;
    S.ending = true;
    S.playerTurn = false;
    S.battles++;
    var kind = S.enemy.kind;
    if (kind === 'elite') S.eliteKills++;
    if (kind === 'boss') S.bossKills++;
    var baseGold = kind === 'boss' ? 95 : kind === 'elite' ? 55 : 18;
    var gold = baseGold + Math.floor(S.floor * 2.2) + rnd(8);
    var rl = relicObjs();
    rl.forEach(function(r){
      if (r.battleGold) gold += r.battleGold;
      if (r.goldMult) gold = Math.round(gold * r.goldMult);
    });
    if (S.ascension >= 7) gold = Math.round(gold * .85);
    S.gold += gold;
    if (S.runFlags) S.runFlags.maxGold = Math.max(S.runFlags.maxGold || 0, S.gold);
    if (kind === 'elite') rl.forEach(function(r){ if (r.eliteHeal) healPlayer(r.eliteHeal); });
    rl.forEach(function(r){ if (r.postHeal) healPlayer(r.postHeal); });
    if (S.combatFlags && S.combatFlags.battleDamage === 0 && meta.ach && !meta.ach.untouched){
      meta.ach.untouched = 1; saveMeta();
      setTimeout(function(){ toast('成就解锁：毫发无伤', 'good'); }, 400);
    }
    sfx('coin');
    var ekind = kind;
    S.enemy = null;
    S.draw = []; S.hand = []; S.discard = []; S.exhaust = [];
    S.busy = false;
    S.screen = 'reward';
    renderAll();
    if (ekind === 'boss'){
      meta.bossKills = (meta.bossKills || 0) + 1; saveMeta();
      if (!S.endless && S.floor >= finalFloor()){
        var bid = S.battleId;
        setTimeout(function(){ if (S.battleId === bid) showVictory(); }, 500);
        return;
      }
      // 无尽模式 boss：给遗物 + 奖励后继续
    }
    var relicGain = null;
    if (ekind === 'elite' || ekind === 'boss'){
      var pool = Object.keys(RELICS).filter(function(id){
        return !hasRelic(id) && RELICS[id].rarity !== 'starter';
      });
      if (pool.length){
        relicGain = pick(pool);
        addRelic(relicGain);
      }
    }
    var potionGain = null;
    var pChance = (ekind === 'elite' || ekind === 'boss') ? 1 : (.24 + (S.cls === 'alchemist' ? .12 : 0));
    if (rand01() < pChance){
      var pid = randomPotionId();
      if (addPotion(pid)) potionGain = pid;
    }
    showReward(gold, relicGain, potionGain);
  }

  function showReward(gold, relicGain, potionGain){
    S.rewardCards = rollCardRewards(3, S.floor, 0.18 + Math.min(.22, S.floor*.025));
    var html = '<div class="shead"><div><div class="stitle">战利品</div><div class="ssub">挑选一张牌，把它锻进你的牌组。</div></div><div class="sicon">🪙</div></div>' +
      '<div class="rewardline">获得 <b>'+gold+'</b> 金币 · 当前 '+S.gold+'</div>';
    if (relicGain){
      var rr = RELICS[relicGain];
      html += '<div class="relicline"><span class="rico">'+rr.icon+'</span><div><b>'+rr.name+'</b><small>'+rr.desc+'</small></div></div>';
    }
    if (potionGain){
      var pp = POTIONS[potionGain];
      html += '<div class="relicline potionline"><span class="rico">'+pp.icon+'</span><div><b>'+pp.name+'</b><small>'+pp.desc+'</small></div></div>';
    }
    html += '<div class="rewardcards">';
    S.rewardCards.forEach(function(inst){ html += cardHTML(inst, ' pickcard'); });
    html += '</div><div class="skiprow"><button class="btn" data-act="skipReward">跳过，不要牌</button></div>';
    showModal(html, {closable:false, cls:'rewardmodal'});
    $('sheet').querySelectorAll('.pickcard').forEach(function(el){
      el.addEventListener('click', function(){
        var uid = el.getAttribute('data-uid');
        var inst = null;
        for (var i=0;i<S.rewardCards.length;i++) if (S.rewardCards[i].uid === uid) inst = S.rewardCards[i];
        if (!inst) return;
        S.deck.push(inst);
        sfx('coin');
        log('获得卡牌 ' + cardDef(inst).name);
        afterReward();
      });
    });
    var skip = $('sheet').querySelector('[data-act="skipReward"]');
    if (skip) skip.addEventListener('click', afterReward);
  }

  function afterReward(){
    hideModal();
    S.rewardCards = [];
    S.floor++;
    if (S.floor > (S.endless ? 999 : finalFloor())){ showVictory(); return; }
    showPath();
  }

  function rollCardRewards(n, floor, upChance){
    var pool = Object.keys(CARDS).filter(function(id){
      var c = CARDS[id];
      return c.rarity !== 'starter' && c.rarity !== 'status' && c.rarity !== 'curse' && (c.cls === S.cls || c.cls === 'neutral');
    });
    var picks = [];
    var guard = 0;
    while (picks.length < n && guard++ < 200){
      var id = pick(pool);
      var c = CARDS[id];
      var rw = c.rarity === 'rare' ? 1.1 + floor*.08 : c.rarity === 'uncommon' ? 3 : 6;
      if (rand01() * 10 > rw) continue;
      var dup = picks.some(function(p){ return p.id === id; });
      if (dup) continue;
      picks.push(makeCard(id, rand01() < (upChance || 0)));
      markSeen('cards', id);
    }
    while (picks.length < n){
      var id2 = pick(pool);
      if (!picks.some(function(p){ return p.id === id2; })){
        picks.push(makeCard(id2, false));
        markSeen('cards', id2);
      }
    }
    return picks;
  }

  function loseRun(){
    if (S.screen === 'end') return;
    if (!S.reviveUsed && hasRelic('phoenixFeather') && S.enemy && S.enemy.hp > 0){
      S.reviveUsed = true;
      var pi = S.relics.indexOf('phoenixFeather');
      if (pi >= 0) S.relics.splice(pi, 1);
      S.ending = false;
      S.hp = Math.max(1, Math.round(S.maxHp * .35));
      S.block = 0; S.busy = false; S.playerTurn = true;
      sfx('buff');
      toast('不死鸟之羽：你从灰烬中重生', 'good');
      log('不死鸟之羽触发，恢复到 ' + S.hp + ' 点生命');
      renderAll();
      return;
    }
    S.ending = true;
    S.playerTurn = false;
    S.screen = 'end';
    S.battleId++;
    sfx('lose');
    FX.flash('red');
    FX.shake(true);
    meta.bestFloor = Math.max(meta.bestFloor, S.floor);
    if (S.floor >= meta.bestFloor) meta.bestClass = CLASSES[S.cls].name;
    var score = runScore();
    if (S.runFlags && S.runFlags.maxGold >= 500) meta.ach.rich = 1;
    if (S.mode === 'endless' && S.floor >= 12) meta.ach.endless12 = 1;
    if (S.daily){
      if (!meta.daily || meta.daily.date !== S.daily) meta.daily = { date:S.daily, best:score };
      else meta.daily.best = Math.max(meta.daily.best || 0, score);
      meta.ach.daily = 1;
    }
    saveMeta();
    checkAchievements();
    pushHistory(false);
    var modeName = (MODES[S.mode] || MODES.standard).name;
    var html = '<div class="endcard"><div class="bigmark">🕯️</div>' +
      '<h2>炉火熄灭</h2><div class="esub">' + modeName + ' · 你在第 '+S.floor+' 层倒下'+(S.ascension?'（苦度 '+S.ascension+'）':'')+'，但锻出的牌会留下。</div>' +
      endStats(score) +
      '<div class="btnrow center"><button class="btn primary" data-act="again">再来一局</button>' +
      '<button class="btn" data-act="title">返回标题</button></div></div>';
    showModal(html, {closable:false, cls:'endmodal'});
    bindEndButtons();
  }

  function runScore(){
    return S.floor*100 + S.battles*25 + S.gold + S.deck.length*6 + S.bossKills*200 + S.ascension*150;
  }
  function endStats(score){
    return '<div class="endstats">' +
      '<div><span>抵达</span><b>'+S.floor+' 层</b></div>' +
      '<div><span>战斗</span><b>'+S.battles+'</b></div>' +
      '<div><span>牌组</span><b>'+S.deck.length+'</b></div>' +
      '<div><span>评分</span><b>'+score+'</b></div>' +
    '</div>';
  }

  function showVictory(){
    if (S.screen === 'end') return;
    S.ending = true;
    S.playerTurn = false;
    S.screen = 'end';
    S.battleId++;
    sfx('win');
    if (!S.winCounted){ meta.wins++; S.winCounted = true; }
    meta.bestFloor = Math.max(meta.bestFloor, S.floor);
    meta.bestClass = CLASSES[S.cls].name;
    if (S.mode === 'standard') meta.ach.winstandard = 1;
    if (S.mode === 'deep') meta.ach.windeep = 1;
    if (S.ascension >= 5) meta.ach.asc5 = 1;
    if (S.runFlags && S.runFlags.maxGold >= 500) meta.ach.rich = 1;
    if (S.daily) meta.ach.daily = 1;
    var score = runScore();
    if (S.daily){
      if (!meta.daily || meta.daily.date !== S.daily) meta.daily = { date:S.daily, best:score };
      else meta.daily.best = Math.max(meta.daily.best || 0, score);
    }
    saveMeta();
    checkAchievements();
    pushHistory(true);
    var modeName = (MODES[S.mode] || MODES.standard).name;
    var html = '<div class="endcard"><div class="bigmark">🔥</div>' +
      '<h2>炉火不熄</h2><div class="esub">' + modeName + ' 通关：你击败了第 ' + S.floor + ' 层的守关者' +
      (S.ascension?'，苦度 '+S.ascension+' 的火焰也被你驯服':'')+'。还能继续深入吗？</div>' +
      endStats(score) +
      '<div class="btnrow center">' +
        '<button class="btn primary" data-act="endless">继续深入</button>' +
        '<button class="btn" data-act="again">再来一局</button>' +
        '<button class="btn" data-act="title">返回标题</button>' +
      '</div></div>';
    showModal(html, {closable:false, cls:'endmodal'});
    bindEndButtons();
    var endlessBtn = $('sheet').querySelector('[data-act="endless"]');
    if (endlessBtn) endlessBtn.addEventListener('click', function(){
      S.endless = true;
      S.ending = false;
      S.floor++;
      hideModal();
      showPath();
    });
  }

  function bindEndButtons(){
    var again = $('sheet').querySelector('[data-act="again"]');
    if (again) again.addEventListener('click', function(){ hideModal(); startRun(); });
    var title = $('sheet').querySelector('[data-act="title"]');
    if (title) title.addEventListener('click', function(){ hideModal(); toTitle(); });
  }

  function toTitle(){
    S.battleId++;
    S.screen = 'title';
    S.enemy = null;
    S.ending = false;
    S.daily = 0;
    rand01 = Math.random;
    S.ascension = Math.max(0, Math.min(10, meta.ascension || 0));
    document.body.dataset.screen = 'title';
    $('start').classList.add('on');
    hideViewer();
    hideModal();
    renderStart();
    renderAll();
  }

  /* ============================================================
     路径 / 非战斗节点
  ============================================================ */
  function isBossFloor(f){ return f % 8 === 0; }

  var NODE_INFO = {
    battle:{icon:'⚔️', title:'普通战斗', tag:'BATTLE', color:'rgba(255,138,61,.4)', desc:'与一只敌人交手。稳定获得金币与一张新牌。'},
    elite:{icon:'💀', title:'精英战斗', tag:'ELITE', color:'rgba(244,63,94,.45)', desc:'更危险的敌人，但胜利后额外获得一件遗物。', risk:'危险'},
    camp:{icon:'🔥', title:'营火', tag:'REST', color:'rgba(251,146,60,.4)', desc:'恢复 30% 最大生命，或升级一张牌。'},
    forge:{icon:'🔨', title:'锻造台', tag:'FORGE', color:'rgba(148,163,184,.4)', desc:'升级一张牌，或移除一张不需要的牌。'},
    shop:{icon:'🪙', title:'流浪商人', tag:'SHOP', color:'rgba(251,191,36,.4)', desc:'用金币购买卡牌与遗物，也可以花钱移除一张牌。'},
    treasure:{icon:'📦', title:'余烬宝箱', tag:'TREASURE', color:'rgba(94,234,212,.4)', desc:'打开宝箱，获得金币与一件随机遗物。'},
    event:{icon:'❓', title:'未知祭坛', tag:'EVENT', color:'rgba(192,132,252,.4)', desc:'一次选择，可能带来卡牌、金币或治疗。'},
    boss:{icon:'❤️‍🔥', title:'守关者', tag:'BOSS', color:'rgba(251,191,36,.5)', desc:'击败这一幕的守关者。'}
  };
  var ROUTE_SHORT = { battle:'战斗', elite:'精英', camp:'营火', forge:'锻造', shop:'商店', treasure:'宝箱', event:'祭坛', boss:'守关' };

  function routeCap(){ return S.endless ? 999 : finalFloor(); }
  function rollFloorPlan(f){
    if (isBossFloor(f)) return { boss:true, opts:['boss'] };
    if (f === 1) return { opts:['battle'] };
    var opts = ['battle'];
    var pool = ['camp','forge','shop','treasure','event'];
    if (f >= (S.ascension >= 7 ? 2 : 3)) pool.push('elite');
    shuffle(pool);
    for (var i=0;i<pool.length && opts.length<3;i++) opts.push(pool[i]);
    shuffle(opts);
    return { opts:opts };
  }
  function extendRoute(target){
    if (!S.route) S.route = [null];
    var cap = routeCap();
    var t = Math.min(target, cap);
    while (S.route.length - 1 < t){
      var f = S.route.length;
      S.route[f] = rollFloorPlan(f);
    }
  }
  function floorPlan(f){
    extendRoute(Math.min(routeCap(), f + (S.endless ? 24 : 0)));
    if (!S.route[f]) S.route[f] = rollFloorPlan(f);
    return S.route[f];
  }
  function buildRoute(){
    S.route = [null];
    extendRoute(S.mode === 'endless' ? 24 : finalFloor());
    return S.route;
  }

  function showPath(){
    S.screen = 'path';
    S.busy = false;
    renderAll();
    var plan = floorPlan(S.floor) || { opts:['battle'] };
    var mapBtn = '<button class="iconbtn mapbtn" data-act="route" title="查看完整路线">🗺️</button>';
    if (plan.boss){
      showModal(
        '<div class="shead"><div><div class="stitle">炉心之门</div><div class="ssub">第 '+S.floor+' 层 · 第 '+actOf(S.floor)+' 幕 · 生命 '+S.hp+' / '+S.maxHp+' · 守关者就在前方。</div></div><div class="sicon">🚪</div>'+mapBtn+'</div>' +
        '<div class="pathgrid"><button class="nodecard boss" data-node="boss" style="--nc:rgba(251,191,36,.5)">' +
          '<div class="nico">❤️‍🔥</div><h4>挑战守关者</h4><div class="ntag">BOSS</div>' +
          '<p>击败这一幕的守关者。胜利后可以选择结束征程，或继续深入无尽模式。</p>' +
          '<span class="nrisk">危险</span>' +
        '</button></div>', {closable:false}
      );
      bindNodeButtons(); bindMapButton();
      return;
    }
    var opts = plan.opts.slice();
    var html = '<div class="shead"><div><div class="stitle">选择前路</div><div class="ssub">'+(MODES[S.mode]||MODES.standard).short+' · 第 '+S.floor+' 层 · 第 '+actOf(S.floor)+' 幕 · 生命 <b style="color:#ffb4c0">'+S.hp+'/'+S.maxHp+'</b> · 每次选择都在塑造牌组。</div></div><div class="sicon">🧭</div>'+mapBtn+'</div><div class="pathgrid">';
    opts.forEach(function(k){
      var n = NODE_INFO[k] || NODE_INFO.battle;
      html += '<button class="nodecard" data-node="'+k+'" style="--nc:'+n.color+'">' +
        '<div class="nico">'+n.icon+'</div><h4>'+n.title+'</h4><div class="ntag">'+n.tag+'</div>' +
        '<p>'+n.desc+'</p>' + (n.risk ? '<span class="nrisk">'+n.risk+'</span>' : '') +
      '</button>';
    });
    html += '</div>';
    showModal(html, {closable:false});
    bindNodeButtons(); bindMapButton();
  }

  function bindNodeButtons(){
    $('sheet').querySelectorAll('[data-node]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var k = btn.getAttribute('data-node');
        sfx('click');
        if (k === 'battle'){ hideModal(); startBattle('normal'); }
        else if (k === 'elite'){ hideModal(); startBattle('elite'); }
        else if (k === 'boss'){ hideModal(); startBattle('boss'); }
        else if (k === 'camp'){ showCamp(); }
        else if (k === 'forge'){ showForge(); }
        else if (k === 'shop'){ showShop(); }
        else if (k === 'treasure'){ showTreasure(); }
        else if (k === 'event'){ showEvent(); }
      });
    });
  }

  function bindMapButton(){
    var btn = $('sheet').querySelector('[data-act="route"]');
    if (btn) btn.addEventListener('click', function(){ sfx('click'); showRoutePreview(false); });
  }

  function routeWindow(){
    var cap = routeCap();
    var cur = Math.max(1, S.floor || 1);
    if (S.mode === 'endless' || S.endless){
      var from = Math.floor((cur - 1) / 8) * 8 + 1;
      return { from:from, to:Math.min(cap, from + 23), cur:cur, endless:true };
    }
    return { from:1, to:cap, cur:cur, endless:false };
  }

  function routePreviewHTML(){
    var w = routeWindow();
    var mode = MODES[S.mode] || MODES.standard;
    var bosses = [];
    if (!w.endless){ for (var b=8;b<=w.to;b+=8) bosses.push('第 '+b+' 层'); }
    var sub = w.endless
      ? mode.name + ' · 第 ' + w.from + '–' + w.to + ' 层预览 · 每 8 层一位守关者 · 生命 <b style="color:#ffb4c0">'+S.hp+'/'+S.maxHp+'</b>'
      : mode.name + ' · 共 ' + w.to + ' 层 · ' + (bosses.length ? bosses.join(' / ') + ' 守关 · ' : '') + '生命 <b style="color:#ffb4c0">'+S.hp+'/'+S.maxHp+'</b>';
    var html = '<div class="shead"><div><div class="stitle">路线总览</div><div class="ssub">'+sub+'</div></div><div class="sicon">🗺️</div></div>' +
      '<div class="routenote">开局时路线已经确定：下面是每一层可以选择的节点，当前层会高亮。守关层固定为 Boss，途中不会改变。</div>' +
      '<div class="routemap">';
    for (var actStart=Math.floor((w.from-1)/8)*8+1; actStart<=w.to; actStart+=8){
      var actEnd = Math.min(w.to, actStart+7);
      html += '<section class="actblock"><div class="acthead"><b>第 '+actOf(actStart)+' 幕</b><span>FLOOR '+actStart+'–'+actEnd+'</span>'+(isBossFloor(actEnd) ? '<i>❤️‍🔥 守关者</i>' : '')+'</div><div class="floorlist">';
      for (var f=actStart; f<=actEnd; f++){
        var plan = floorPlan(f);
        var cls = 'flrow' + (f < w.cur ? ' past' : (f === w.cur ? ' cur' : '')) + (plan.boss ? ' bossrow' : '');
        html += '<div class="'+cls+'"><div class="fnum"><b>'+f+'</b><span>层</span></div><div class="fchips">';
        plan.opts.forEach(function(k){
          var n = NODE_INFO[k] || NODE_INFO.battle;
          html += '<span class="fchip '+k+'">'+n.icon+' '+ROUTE_SHORT[k]+'</span>';
        });
        html += '</div>';
        if (f === w.cur) html += '<span class="fstate">'+(f === 1 && !S.battles ? '起点' : '当前')+'</span>';
        else if (f < w.cur) html += '<span class="fstate dim">已过</span>';
        else if (plan.boss) html += '<span class="fstate boss">守关</span>';
        html += '</div>';
      }
      html += '</div></section>';
    }
    html += '</div>';
    if (w.endless) html += '<div class="routenote center">无尽熔炉没有终点，进入新的幕时会继续延伸路线。</div>';
    return html;
  }

  function showDeckPicker(mode, after, cancel){
    S.screen = 'modal';
    var html = '<div class="shead"><div><div class="stitle">'+(mode === 'upgrade' ? '选择要升级的牌' : '选择要移除的牌')+'</div><div class="ssub">' +
      (mode === 'upgrade' ? '升级后本局永久生效。' : '被移除的牌将从本局牌组中消失。') + '</div></div><div class="sicon">'+(mode === 'upgrade' ? '✨' : '🗑️')+'</div>' +
      '<button class="iconbtn xbtn" data-act="cancel">✕</button></div>';
    html += '<div class="deckgrid pickable">';
    var count = 0;
    S.deck.forEach(function(inst){
      if (mode === 'upgrade' && (inst.up || !CARDS[inst.id].up)) return;
      count++;
      html += cardHTML(inst, ' pickdeck');
    });
    html += '</div>';
    if (!count) html += '<div class="small" style="margin-top:14px">没有符合条件的牌。</div>';
    showModal(html, {closable:false});
    $('sheet').querySelector('[data-act="cancel"]').addEventListener('click', function(){ sfx('click'); if (cancel) cancel(); else hideModal(); });
    $('sheet').querySelectorAll('.pickdeck').forEach(function(el){
      el.addEventListener('click', function(){
        var uid = el.getAttribute('data-uid');
        var idx = -1;
        for (var i=0;i<S.deck.length;i++) if (S.deck[i].uid === uid){ idx = i; break; }
        if (idx < 0) return;
        if (mode === 'upgrade'){
          if (S.deck[idx].up) return;
          S.deck[idx].up = true;
          sfx('buff'); toast('已升级 ' + cardDef(S.deck[idx]).name, 'good');
        } else {
          var nm = cardDef(S.deck[idx]).name;
          S.deck.splice(idx,1);
          sfx('forfeit'); toast('已移除 ' + nm, 'good');
        }
        hideModal();
        setTimeout(after, 120);
      });
    });
  }

  function showShop(){
    S.screen = 'modal';
    var discount = (hasRelic('merchant') ? .8 : 1) * (hasRelic('bargainTag') ? .85 : 1);
    if (!S.shop){
      S.shop = { cards:[], relic:null, potions:[], removeSold:false };
      var rew = rollCardRewards(3, S.floor, .25);
      rew.forEach(function(inst){
        markSeen('cards', inst.id);
        var c = CARDS[inst.id];
        var base = c.rarity === 'rare' ? 95 : c.rarity === 'uncommon' ? 68 : 46;
        S.shop.cards.push({ inst:inst, price:Math.round((base + S.floor*2) * discount), sold:false });
      });
      for (var pi=0; pi<2; pi++){
        var pid = randomPotionId();
        markSeen('potions', pid);
        var pr = POTIONS[pid];
        var pb = pr.rarity === 'rare' ? 88 : pr.rarity === 'uncommon' ? 58 : 38;
        S.shop.potions.push({ id:pid, price:Math.round(pb * discount), sold:false });
      }
      var rp = Object.keys(RELICS).filter(function(id){ return !hasRelic(id) && RELICS[id].rarity !== 'starter'; });
      if (rp.length){
        var rid = pick(rp);
        markSeen('relics', rid);
        var rr = RELICS[rid];
        var rb = rr.rarity === 'rare' ? 125 : rr.rarity === 'uncommon' ? 90 : 70;
        S.shop.relic = { id:rid, price:Math.round((rb + S.floor*3) * discount), sold:false };
      }
      S.shop.removePrice = Math.round(65 * discount);
    }
    renderShop();
  }

  function renderShop(){
    var sh = S.shop;
    var html = '<div class="shead"><div><div class="stitle">流浪商人</div><div class="ssub">“火会熄灭，牌会留下。看看今天有什么？”</div></div><div class="sicon">🪙</div></div>' +
      '<div class="shopgold">🪙 金币 <b>'+S.gold+'</b> <span style="color:var(--muted)">·</span> ❤️ 生命 <b style="color:#ffb4c0">'+S.hp+' / '+S.maxHp+'</b>'+(hasRelic('merchant')?' · 商人徽记已打折':'')+'</div><div class="shopgrid">';
    sh.cards.forEach(function(it, idx){
      if (it.sold){ html += '<div class="shopitem sold"><div class="small">已售出</div></div>'; return; }
      html += '<div class="shopitem">'+cardHTML(it.inst, ' shopcard')+
        '<div class="buyrow"><span class="price">🪙 '+it.price+'</span><button class="btn" data-buy="'+idx+'"'+(S.gold < it.price ? ' disabled' : '')+'>购买</button></div></div>';
    });
    if (sh.relic){
      if (sh.relic.sold) html += '<div class="shopitem relicshop sold"><div class="small">遗物已售出</div></div>';
      else {
        var rr = RELICS[sh.relic.id];
        html += '<div class="shopitem relicshop"><div class="rico">'+rr.icon+'</div><div class="rinfo"><b>'+rr.name+'</b><p>'+rr.desc+'</p></div>' +
          '<div class="buyrow"><span class="price">🪙 '+sh.relic.price+'</span><button class="btn" data-buyrelic="1"'+(S.gold < sh.relic.price ? ' disabled' : '')+'>购买</button></div></div>';
      }
    }
    if (sh.potions && sh.potions.length){
      sh.potions.forEach(function(it, idx){
        if (it.sold){ html += '<div class="shopitem potionshop sold"><div class="small">药水已售出</div></div>'; return; }
        var pp = POTIONS[it.id];
        html += '<div class="shopitem potionshop"><div class="potionbig">'+pp.icon+'</div><div class="rinfo"><b>'+pp.name+'</b><p>'+pp.desc+'</p></div>' +
          '<div class="buyrow"><span class="price">🪙 '+it.price+'</span><button class="btn" data-buypotion="'+idx+'"'+(S.gold < it.price ? ' disabled' : '')+'>购买</button></div></div>';
      });
    }
    html += '<div class="shopitem relicshop"><div class="rico">🗑️</div><div class="rinfo"><b>移除一张牌</b><p>从牌组中永久移除一张牌。</p></div>' +
      '<div class="buyrow"><span class="price">🪙 '+sh.removePrice+'</span><button class="btn" data-remove="1"'+(sh.removeSold || S.gold < sh.removePrice ? ' disabled' : '')+'>购买</button></div></div>';
    html += '</div><div class="btnrow center"><button class="btn primary" data-act="leaveShop">离开商店</button></div>';
    showModal(html, {closable:false});
    $('sheet').querySelectorAll('[data-buy]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var idx = +btn.getAttribute('data-buy');
        var it = sh.cards[idx];
        if (!it || it.sold) return;
        if (S.gold < it.price){ toast('金币不够', 'bad'); return; }
        S.gold -= it.price; it.sold = true; S.deck.push(it.inst); sfx('coin');
        toast('购买了 ' + cardDef(it.inst).name, 'good'); renderShop();
      });
    });
    var br = $('sheet').querySelector('[data-buyrelic]');
    if (br) br.addEventListener('click', function(){
      var it = sh.relic; if (!it || it.sold) return;
      if (S.gold < it.price){ toast('金币不够', 'bad'); return; }
      S.gold -= it.price; it.sold = true; addRelic(it.id); sfx('coin');
      toast('获得遗物 ' + RELICS[it.id].name, 'good'); renderShop();
    });
    $('sheet').querySelectorAll('[data-buypotion]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var idx = +btn.getAttribute('data-buypotion');
        var it = sh.potions[idx];
        if (!it || it.sold) return;
        if (S.gold < it.price){ toast('金币不够', 'bad'); return; }
        if (!addPotion(it.id)){ toast('药水槽已满', 'bad'); return; }
        S.gold -= it.price; it.sold = true; sfx('coin');
        toast('购买了 ' + POTIONS[it.id].name, 'good'); renderShop();
      });
    });
    var rm = $('sheet').querySelector('[data-remove]');
    if (rm) rm.addEventListener('click', function(){
      if (sh.removeSold) return;
      if (S.gold < sh.removePrice){ toast('金币不够', 'bad'); return; }
      showDeckPicker('remove', function(){
        S.gold -= sh.removePrice; sh.removeSold = true; sfx('coin');
        S.shop = sh; showShop();
      }, function(){ S.shop = sh; showShop(); });
    });
    $('sheet').querySelector('[data-act="leaveShop"]').addEventListener('click', function(){ S.shop = null; finishNode(); });
  }

  function statusHTML(st){
    if (!st) return '';
    var keys = ['str','dex','vuln','weak','poison','burn','thorns','regen','frost'];
    var h = '';
    keys.forEach(function(k){
      var v = st[k] || 0;
      if (!v) return;
      var d = STATUS[k];
      h += '<span class="status '+k+'" title="'+esc(d.name+'：'+d.desc.replace('X',v))+'">'+d.icon+' <b>'+v+'</b></span>';
    });
    return h;
  }

  function renderEnemy(){
    var e = S.enemy;
    var side = $('enemySide');
    if (!e){
      side.style.visibility = 'hidden';
      return;
    }
    side.style.visibility = 'visible';
    side.classList.toggle('elite', e.kind === 'elite');
    side.classList.toggle('boss', e.kind === 'boss');
    side.classList.toggle('enraged', e.kind !== 'normal' && e.maxHp > 0 && e.hp / e.maxHp <= (e.kind === 'boss' ? .35 : .28));
    $('enemyArt').textContent = e.icon;
    $('enemyName').textContent = e.name;
    var kt = $('kindTag');
    kt.classList.toggle('hidden', e.kind === 'normal');
    kt.classList.toggle('boss', e.kind === 'boss');
    kt.textContent = e.kind === 'boss' ? 'BOSS' : '精英';
    var epct = (e.maxHp ? (e.hp / e.maxHp * 100) : 0) + '%';
    $('enemyHpFill').style.width = epct;
    if ($('enemyHpGhost')) $('enemyHpGhost').style.width = epct;
    $('enemyHpText').textContent = e.hp + ' / ' + e.maxHp;
    $('enemyStatus').innerHTML = statusHTML(e.status);
    $('intent').innerHTML = intentHTML(e);
    var ik = 'intent';
    var ef = (e.intent && e.intent.effects) || [];
    for (var i=0;i<ef.length;i++){
      if (ef[i].k === 'atk'){ ik += ' atk'; break; }
      if (ef[i].k === 'buff' || ef[i].k === 'blk' || ef[i].k === 'debuff' || ef[i].k === 'addCard'){
        ik += ef[i].k === 'buff' ? ' buff' : (ef[i].k === 'blk' ? ' def' : ' debuff');
        break;
      }
    }
    $('intent').className = ik;
  }

  function intentHTML(e){
    if (!e || !e.intent) return '正在观察……';
    var h = '<span class="muted">'+esc(e.intent.label)+'</span>';
    (e.intent.effects || []).forEach(function(ef){
      if (ef.k === 'atk'){
        var dmg = ef.n + (e.status.str || 0);
        if (e.status.weak > 0) dmg = Math.floor(dmg * .75);
        if ((e.status.frost || 0) > 0) dmg = Math.max(1, dmg - e.status.frost);
        if (S.playerStatus && S.playerStatus.vuln > 0) dmg = Math.floor(dmg * 1.5);
        h += '<span class="dmg">⚔ '+dmg+(ef.hits>1?' ×'+ef.hits:'')+'</span>';
      } else if (ef.k === 'blk'){
        h += '<span class="blk">🛡 '+ef.n+'</span>';
      } else if (ef.k === 'buff'){
        h += '<span class="buff">'+(STATUS[ef.s]||{}).icon+' +'+ef.n+'</span>';
      } else if (ef.k === 'debuff'){
        h += '<span class="debuff">'+(STATUS[ef.s]||{}).icon+' '+ef.n+'</span>';
      } else if (ef.k === 'heal'){
        h += '<span class="heal">💚 +'+ef.n+'</span>';
      } else if (ef.k === 'addCard'){
        h += '<span class="debuff">🃏 +'+ef.n+'</span>';
      }
    });
    return h;
  }

  var lastHandSig = '', lastHandCount = 0;
  function renderHand(){
    var hand = $('hand');
    if (S.screen === 'title' || !S.hand.length){ hand.innerHTML = ''; lastHandSig = ''; lastHandCount = 0; return; }
    var sig = S.hand.map(function(i){ return i.uid; }).join(',');
    var fresh = sig !== lastHandSig && S.hand.length >= lastHandCount;
    lastHandSig = sig;
    lastHandCount = S.hand.length;
    var html = '';
    S.hand.forEach(function(inst, i){
      var d = cardDef(inst);
      var dis = (d.unplayable || S.energy < d.cost || !S.playerTurn || S.busy);
      var cls = dis ? ' disabled' : ' playable';
      if (fresh) cls += ' deal';
      html += cardHTML(inst, cls, i);
    });
    hand.innerHTML = html;

  function flyCard(el, kind){
    var r = el.getBoundingClientRect();
    var clone = el.cloneNode(true);
    var target = kind === 'attack' ? document.querySelector('.enemy-visual') : $('classIcon');
    var tr = target ? target.getBoundingClientRect() : null;
    clone.classList.add('flying');
    clone.style.left = r.left + 'px';
    clone.style.top = r.top + 'px';
    clone.style.width = r.width + 'px';
    clone.style.height = r.height + 'px';
    clone.style.transition = 'transform .3s cubic-bezier(.3,.7,.3,1),opacity .3s ease';
    var col = kind === 'attack' ? 'ember' : (kind === 'power' ? 'violet' : 'cyan');
    var glow = kind === 'attack' ? 'rgba(255,170,96,.7)' : (kind === 'power' ? 'rgba(196,150,255,.68)' : 'rgba(110,232,255,.68)');
    clone.style.filter = 'drop-shadow(0 0 18px '+glow+')';
    document.body.appendChild(clone);

    // 从牌面到目标的拖尾，以及抵达时的落点冲击
    var cx = r.left + r.width/2, cy = r.top + r.height/2;
    var tx = tr ? (tr.left + tr.width/2) : cx;
    var ty = tr ? (tr.top + tr.height/2) : (cy - 120);
    if (FX) FX.trail(cx, cy, tx, ty, col, { w: kind === 'attack' ? 4.2 : 3.2, max: .3, seg: .42 });
    setTimeout(function(){
      if (!FX) return;
      FX.burst(tx, ty, col, kind === 'attack' ? 9 : 6, { speed: 135, size: 7, r0: 6, vr: 190, rmax: .34 });
    }, 300);

    requestAnimationFrame(function(){
      var dx = tr ? (tr.left + tr.width/2) - (r.left + r.width/2) : 0;
      var dy = tr ? (tr.top + tr.height/2) - (r.top + r.height/2) : -120;
      clone.style.transform = 'translate('+dx+'px,'+dy+'px) scale(.4) rotate('+(dx>0?14:-14)+'deg)';
      clone.style.opacity = '0';
    });
    setTimeout(function(){ if (clone.parentNode) clone.parentNode.removeChild(clone); }, 340);
  }

  function showCodex(tab){
    tab = tab || 'cards';
    var seen = function(kind, id){ return !!(meta.seen[kind] && meta.seen[kind][id]); };
    var totalCards = Object.keys(CARDS).length, totalRelics = Object.keys(RELICS).length;
    var totalPotions = Object.keys(POTIONS).length, totalEnemies = Object.keys(ENEMIES).length;
    var gotAch = ACHIEVEMENTS.filter(function(a){ return !!meta.ach[a.id]; }).length;
    var tabs = [['cards','卡牌'],['relics','遗物'],['potions','药水'],['enemies','敌人'],['ach','成就'],['history','战绩']];
    var html = '<div class="shead"><div><div class="stitle">图鉴</div><div class="ssub">见过的卡牌、遗物、药水与敌人会在这里点亮。' +
      (S.cls ? '当前牌组 '+S.deck.length+' 张。' : '') + '</div></div><div class="sicon">📖</div>' +
      '<button class="iconbtn xbtn" data-act="close">✕</button></div><div class="codextabs">';
    tabs.forEach(function(t){
      html += '<button class="codextab'+(t[0]===tab?' sel':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>';
    });
    html += '</div><div class="codexsum">' +
      '<span>卡牌 <b>'+seenCount('cards')+' / '+totalCards+'</b></span>' +
      '<span>遗物 <b>'+seenCount('relics')+' / '+totalRelics+'</b></span>' +
      '<span>药水 <b>'+seenCount('potions')+' / '+totalPotions+'</b></span>' +
      '<span>敌人 <b>'+seenCount('enemies')+' / '+totalEnemies+'</b></span>' +
      '<span>成就 <b>'+gotAch+' / '+ACHIEVEMENTS.length+'</b></span>' +
    '</div>';
    if (tab === 'cards'){
      var groups = [
        {key:'iron',name:'铁卫'},{key:'pyre',name:'焰术'},{key:'ranger',name:'游侠'},{key:'alchemist',name:'炼金'},
        {key:'soul',name:'铸魂'},{key:'frost',name:'霜誓'},
        {key:'neutral',name:'中立'},{key:'status',name:'状态与诅咒'}
      ];
      groups.forEach(function(g){
        var ids = Object.keys(CARDS).filter(function(id){
          var c = CARDS[id];
          if (g.key === 'status') return c.rarity === 'status' || c.rarity === 'curse';
          return c.cls === g.key && c.rarity !== 'status' && c.rarity !== 'curse';
        });
        if (!ids.length) return;
        var got = ids.filter(function(id){ return seen('cards', id); }).length;
        html += '<div class="codexhead"><b>'+g.name+'</b><span>'+got+' / '+ids.length+' 张</span></div><div class="deckgrid codexgrid">';
        var lockedN = 0;
        ids.forEach(function(id){ if (seen('cards', id)) html += cardHTML(makeCard(id,false)); else lockedN++; });
        var tease = Math.min(lockedN, 3);
        for (var li=0; li<tease; li++){
          html += '<div class="card locked" style="--rc:#5a4a3a"><div class="cost">?</div>' +
            '<div class="cname">???</div><div class="cart">🔒</div><div class="ctype">未发现</div>' +
            '<div class="ctext">在征程中见到它，图鉴才会点亮。</div><div class="gem"></div></div>';
        }
        if (lockedN > tease) html += '<div class="codexlocked">还有 '+(lockedN-tease)+' 张「'+g.name+'」卡牌未发现</div>';
        html += '</div>';
      });

      html += '<div class="relicgrid">';

          '<p>'+r.desc+'</p></div></div>';

        html += '<div class="relicrow locked"><div class="rico">🔒</div><div><b>???</b><p>尚未在征程中发现的遗物。</p></div></div>';
      }

      html += '</div>';

      html += '<div class="potioncodex">';

        });

          html += '<div class="relicrow locked"><div class="rico">🔒</div><div><b>???</b><p>尚未遭遇的敌人。</p></div></div>';

          '<span>'+a.name+'<small>'+a.desc+'</small></span></div>';
      });

        meta.history.forEach(function(h){

            '<span class="hw'+(h.win?' win':'')+'">'+(h.win?'通关':(h.floor||0)+' 层')+'</span>' +
            '<span class="hs">'+(h.score||0)+'</span>' +
          '</div>';
        });
      }
      html += '</div>';
    }
    html += '<div class="btnrow center"><button class="btn" data-act="close">关闭</button></div>';
    showViewer(html, {closable:true});
    $('viewerSheet').querySelectorAll('[data-act="close"]').forEach(function(b){ b.addEventListener('click', hideViewer); });
    $('viewerSheet').querySelectorAll('[data-tab]').forEach(function(b){
      b.addEventListener('click', function(){ showCodex(b.getAttribute('data-tab')); });

      var c = document.createElement('canvas');
      c.width = c.height = 64;
      var g = c.getContext('2d');
      var gr = g.createRadialGradient(32,32,0,32,32,32);
      gr.addColorStop(0,'hsla('+h+','+s+'%,'+l+'%,1)');
      gr.addColorStop(.3,'hsla('+h+','+s+'%,'+l+'%,.52)');
      gr.addColorStop(.7,'hsla('+h+','+s+'%,'+l+'%,.11)');
      gr.addColorStop(1,'hsla('+h+','+s+'%,'+l+'%,0)');
      g.fillStyle = gr; g.fillRect(0,0,64,64);
      return c;
    }
    var emberGlow = sprite(26,100,62), sparkGlow = sprite(44,100,72), smokeGlow = sprite(24,42,30);
    function newMote(anywhere){
      return {
        x: Math.random()*W, y: anywhere ? Math.random()*H : H+16,
        vx: (Math.random()-.5)*10, vy: -(10+Math.random()*26),
        size: 3+Math.random()*9, sway: Math.random()*6.283,
        swaySpd: .6+Math.random()*1.2, life: Math.random()*10,
        a: .16+Math.random()*.44
      };
    }
    function newPlume(anywhere){
      return {
        x: Math.random()*W, y: anywhere ? Math.random()*H : H+160,
        vx: (Math.random()-.5)*8, vy: -(5+Math.random()*9),
        size: 118+Math.random()*150, a: .016+Math.random()*.024,
        life: Math.random()*8
      };
    }
    function newStreak(){
      var fromLeft = Math.random() < .5;
      return {
        x: fromLeft ? -40 : W+40, y: H*(.28+Math.random()*.5),
        vx: (fromLeft?1:-1)*(170+Math.random()*170), vy: -(40+Math.random()*70),
        life: 0, max: .65+Math.random()*.5, size: 5+Math.random()*6
      };
    }
    function resize(){
      W = window.innerWidth; H = window.innerHeight;
      cv.width = Math.floor(W*DPR); cv.height = Math.floor(H*DPR);
      cv.style.width = W+'px'; cv.style.height = H+'px';
      ctx.setTransform(DPR,0,0,DPR,0,0);
      motes = [];
      var n = Math.min(44, Math.max(16, Math.floor(W/32)));
      for (var i=0;i<n;i++) motes.push(newMote(true));
      plumes = [];
      var pn = W < 700 ? 3 : 5;
      for (var j=0;j<pn;j++) plumes.push(newPlume(true));
      streaks = [];
    }
    function draw(ts){
      if (ts - lastPaint < 32){ requestAnimationFrame(draw); return; }
      lastPaint = ts;
      var dt = last ? Math.min(.05,(ts-last)/1000) : .016;
      last = ts;
      ctx.clearRect(0,0,W,H);
      ctx.globalCompositeOperation = 'source-over';
      var i, p;
      for (i=0;i<plumes.length;i++){
        p = plumes[i];
        p.x += p.vx*dt; p.y += p.vy*dt; p.life += dt;
        if (p.y < -p.size){ plumes[i] = newPlume(false); continue; }
        ctx.globalAlpha = p.a * (.7 + Math.sin(p.life*.5)*.3);
        ctx.drawImage(smokeGlow, p.x-p.size/2, p.y-p.size/2, p.size, p.size);
      }
      ctx.globalCompositeOperation = 'lighter';
      for (i=0;i<motes.length;i++){
        p = motes[i];
        p.life += dt;
        p.x += (p.vx + Math.sin(p.life*p.swaySpd + p.sway)*12)*dt;
        p.y += p.vy*dt;
        if (p.y < -30 || p.x < -40 || p.x > W+40){ motes[i] = newMote(false); continue; }
        var flick = .68 + Math.sin(p.life*2.1 + p.sway)*.32;
        ctx.globalAlpha = p.a*flick;
        var s = p.size*(.85+flick*.3);
        ctx.drawImage(emberGlow, p.x-s/2, p.y-s/2, s, s);
      }
      streakNext -= dt;
      if (streakNext <= 0 && streaks.length < 2){
        streaks.push(newStreak());
        streakNext = 5.2 + Math.random()*6.4;
      }
      for (i=streaks.length-1;i>=0;i--){
        p = streaks[i];
        p.life += dt;
        p.x += p.vx*dt; p.y += p.vy*dt;
        var k = p.life / p.max;
        if (k >= 1){ streaks.splice(i,1); continue; }
        ctx.save();
        ctx.translate(p.x,p.y);
        ctx.rotate(Math.atan2(p.vy,p.vx));
        ctx.globalAlpha = (1-k)*.75;
        var sw = p.size*7;
        ctx.drawImage(sparkGlow, -sw/2, -p.size/2, sw, p.size);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      requestAnimationFrame(draw);
    }
    resize();
    window.addEventListener('resize', resize);
    if (reduced){
      ctx.globalCompositeOperation = 'source-over';
      plumes.forEach(function(p){ ctx.globalAlpha = p.a*.8; ctx.drawImage(smokeGlow, p.x-p.size/2, p.y-p.size/2, p.size, p.size); });
      ctx.globalCompositeOperation = 'lighter';
      motes.forEach(function(p){ ctx.globalAlpha = p.a; ctx.drawImage(emberGlow, p.x-p.size/2, p.y-p.size/2, p.size, p.size); });
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    } else {
      requestAnimationFrame(draw);
    }
  })();

  /* ============================================================
     事件绑定
  ============================================================ */
  $('startBtn').addEventListener('click', function(){ startRun(); });
  $('dailyBtn').addEventListener('click', function(){ startDaily(); });
  $('helpBtn').addEventListener('click', function(){ showHelp(); });
  $('codexBtn').addEventListener('click', function(){ showCodex('cards'); });
  $('startSoundBtn').addEventListener('click', toggleSound);
  $('soundBtn').addEventListener('click', toggleSound);
  $('menuBtn').addEventListener('click', showMenu);
  $('deckBtn').addEventListener('click', showDeckView);
  $('relicBtn').addEventListener('click', showRelicView);
  $('endTurn').addEventListener('click', endTurn);
  $('drawPile').addEventListener('click', function(){
    if (!S.draw.length && !S.discard.length) return;
    toast('抽牌堆 ' + S.draw.length + ' 张 · 弃牌堆 ' + S.discard.length + ' 张');
  });
  $('discardPile').addEventListener('click', function(){
    if (!S.discard.length) return;
    toast('弃牌堆 ' + S.discard.length + ' 张');
  });
  $('modal').addEventListener('click', function(e){
    if (e.target === $('modal') && $('modal').dataset.closable === '1') hideModal();
  });
  $('viewer').addEventListener('click', function(e){
    if (e.target === $('viewer') && $('viewer').dataset.closable === '1') hideViewer();
  });
  window.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){
      if ($('viewer').classList.contains('on') && $('viewer').dataset.closable === '1') hideViewer();
      else if ($('modal').classList.contains('on') && $('modal').dataset.closable === '1') hideModal();
      else if (S.screen === 'battle' && !$('modal').classList.contains('on') && !$('viewer').classList.contains('on')) showMenu();
    }
    if (S.screen === 'battle' && S.playerTurn && !S.busy && !$('modal').classList.contains('on') && !$('viewer').classList.contains('on')){
      if (e.key === 'e' || e.key === 'E' || e.key === ' '){ e.preventDefault(); endTurn(); }
      if (/^[1-9]$/.test(e.key)){
        var i = +e.key - 1;
        if (S.hand[i]) playCard(S.hand[i].uid);
      }
    }
  });

  /* ============================================================
     初始化
  ============================================================ */
  document.body.dataset.screen = 'title';
  renderStart();
  renderAll();
  $('start').classList.add('on');
  $('soundBtn').textContent = soundOn ? '♪' : '×';
})();
</script>
</body>
