<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>牌炉：余烬牌典 · 无尽构筑</title>
<style>
  :root{
    --bg:#080604;
    --bg2:#0f0b07;
    --panel:rgba(24,18,12,.86);
    --panel2:rgba(32,24,16,.78);
    --line:rgba(245,220,180,.13);
    --line2:rgba(245,220,180,.26);
    --ink:#f6ead7;
    --muted:#b7a48b;
    --faint:#7f6c56;
    --ember:#ff8a3d;
    --ember2:#ffb066;
    --gold:#fbbf24;
    --blood:#f43f5e;
    --cyan:#5eead4;
    --iron:#fb923c;
    --pyre:#f43f5e;
    --ranger:#34d399;
    --alchemist:#a78bfa;
    --neutral:#94a3b8;
    --ok:#4ade80;
    --bad:#fb7185;
    --mono:"Cascadia Code","SFMono-Regular",Consolas,monospace;
    --serif:"Noto Serif SC","Songti SC","STSong",serif;
    --sans:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:
      radial-gradient(ellipse at 50% 120%, rgba(255,122,46,.16), transparent 55%),
      radial-gradient(ellipse at 12% 8%, rgba(120,70,30,.13), transparent 40%),
      radial-gradient(ellipse at 88% 10%, rgba(90,50,20,.12), transparent 38%),
      linear-gradient(180deg,#0b0805,#060403 65%);
    color:var(--ink);font-family:var(--sans);overflow:hidden;
    -webkit-font-smoothing:antialiased;user-select:none;
  }
  button{font-family:inherit;color:inherit;cursor:pointer}
  button:disabled{cursor:not-allowed}
  #embers{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.9}
  #app{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column;min-height:0}

  /* ---------- 顶栏 ---------- */
  .topbar{
    flex:0 0 auto;display:flex;align-items:center;gap:18px;padding:9px 22px;
    border-bottom:1px solid var(--line);background:rgba(10,7,4,.86);
    position:relative;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand svg{width:31px;height:31px;flex:0 0 auto;color:var(--ember);filter:drop-shadow(0 0 12px rgba(255,138,61,.55))}
  .brand b{display:block;font-family:var(--serif);font-size:18px;letter-spacing:.22em;line-height:1.05}
  .brand span{display:block;font-family:var(--mono);font-size:8px;letter-spacing:.34em;color:var(--faint);margin-top:3px}
  .runbar{display:flex;align-items:center;gap:9px;margin-left:auto;flex-wrap:wrap}
  .pill{
    display:inline-flex;align-items:center;gap:7px;height:33px;padding:0 12px;border-radius:999px;
    border:1px solid var(--line);background:rgba(255,255,255,.035);
    font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;
  }
  .pill b{color:var(--ink);font-size:12px}
  .pill.gold b{color:var(--gold)}
  .pill.hp{min-width:150px;position:relative;overflow:hidden}
  .pill.hp i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,rgba(244,63,94,.34),rgba(244,63,94,.12));z-index:0}
  .pill.hp em{position:relative;z-index:1;font-style:normal;font-family:var(--mono);font-size:11px;color:#ffd7de}
  .iconbtn{
    width:33px;height:33px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.035);
    color:var(--muted);font-size:14px;display:grid;place-items:center;transition:.15s;
  }
  .iconbtn:hover{border-color:var(--line2);color:var(--ink);background:rgba(255,255,255,.07)}

  /* ---------- 战场 ---------- */
  #battle{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
  .arena{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:6px 20px 0}
  .forge-ring{
    position:absolute;left:50%;top:46%;width:min(52vmin,520px);aspect-ratio:1;transform:translate(-50%,-50%);
    border-radius:50%;pointer-events:none;
    background:
      radial-gradient(circle at 50% 50%, rgba(255,138,61,.10), rgba(255,90,30,.03) 46%, transparent 68%);
    box-shadow:inset 0 0 70px rgba(255,120,40,.06);
  }
  .forge-ring::before,.forge-ring::after{
    content:"";position:absolute;inset:8%;border-radius:50%;
    border:1px solid rgba(255,150,80,.12);border-top-color:rgba(255,180,110,.34);
    animation:spin 22s linear infinite;
  }
  .forge-ring::after{inset:19%;border-top-color:rgba(255,150,80,.16);animation-duration:34s;animation-direction:reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  .enemy-side{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:2;min-width:0}
  .intent{
    min-height:34px;display:flex;align-items:center;gap:8px;padding:5px 13px;border-radius:999px;
    background:rgba(30,20,13,.88);border:1px solid rgba(255,138,61,.25);
    font-family:var(--mono);font-size:11.5px;color:#ffd9bd;box-shadow:0 8px 30px -18px #000;
  }
  .intent .dmg{color:#ff9aa7;font-weight:700}
  .intent .blk{color:#8fd8ff}
  .intent .buff{color:#ffd479}
  .intent .debuff{color:#c4a3ff}
  .intent .heal{color:#86efac}
  .enemy-visual{
    position:relative;width:clamp(92px,16vmin,142px);aspect-ratio:1;border-radius:50%;
    display:grid;place-items:center;font-size:clamp(46px,8.5vmin,76px);
    background:radial-gradient(circle at 50% 42%, #2a1c11, #120d08 70%);
    border:1px solid rgba(255,160,90,.18);
    box-shadow:0 0 0 8px rgba(255,140,60,.03),0 26px 70px -36px rgba(255,120,40,.45),inset 0 0 40px rgba(255,140,60,.06);
  }
  .enemy-visual::after{
    content:"";position:absolute;inset:-9px;border-radius:50%;
    border:1px dashed rgba(255,160,90,.16);animation:spin 40s linear infinite;
  }
  .enemy-name{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-size:18px;letter-spacing:.08em}
  .kindtag{
    font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;padding:2px 7px;border-radius:5px;
    color:#ffb4c0;border:1px solid rgba(244,63,94,.35);background:rgba(244,63,94,.10)
  }
  .kindtag.boss{color:#ffd166;border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.10)}
  .bar{
    position:relative;height:9px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;
    border:1px solid rgba(255,255,255,.05);
  }
  .bar i{display:block;height:100%;border-radius:99px;transition:width .28s ease}
  .bar.hp i{background:linear-gradient(90deg,#b91c1c,#f43f5e 60%,#fb7185)}
  .enemy-hp{width:min(270px,52vw);margin-top:1px}
  .enemy-hptext{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .enemy-hprow{display:flex;align-items:center;gap:9px}
  .statusrow{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;min-height:20px}
  .status{
    display:inline-flex;align-items:center;gap:4px;height:21px;padding:0 7px;border-radius:6px;
    font-family:var(--mono);font-size:10px;color:#e4d3bd;background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.07);cursor:help;
  }
  .status b{font-weight:700;color:#fff}
  .status.str{color:#ffd08a}.status.dex{color:#9be7ff}.status.vuln{color:#ffb4c0}
  .status.weak{color:#c7b3ff}.status.poison{color:#9be7a8}.status.burn{color:#ffb27a}
  .status.thorns{color:#d6f59a}.status.regen{color:#8ef0b2}.status.power{color:#ffd479}

  .player-side{
    position:absolute;left:24px;bottom:4px;z-index:3;display:flex;flex-direction:column;gap:6px;
    padding:10px 13px;border-radius:15px;border:1px solid var(--line);background:rgba(16,11,7,.9);
    min-width:210px;max-width:30vw;
  }
  .player-head{display:flex;align-items:center;gap:9px}
  .pavatar{
    width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;
    background:radial-gradient(circle at 40% 35%,#3a2716,#171009);border:1px solid rgba(255,160,90,.2);
  }
  .player-head b{display:block;font-size:13px;letter-spacing:.08em}
  .player-head span{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:1px}
  .player-hp{width:100%}
  .player-side .statusrow{justify-content:flex-start}
  .blockbadge{
    display:none;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:7px;width:max-content;
    font-family:var(--mono);font-size:11px;color:#a9e6ff;
    border:1px solid rgba(94,200,255,.28);background:rgba(56,160,220,.10);
  }
  .blockbadge.on{display:inline-flex}

  /* ---------- 手牌区 ---------- */
  .handbar{
    flex:0 0 auto;display:flex;align-items:flex-end;gap:14px;padding:0 22px calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);background:linear-gradient(180deg,rgba(10,7,4,.1),rgba(10,7,4,.72));
    position:relative;z-index:10;
  }
  .lefttools{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding-bottom:12px;min-width:118px}
  .energy{
    width:57px;height:57px;border-radius:50%;display:grid;place-items:center;position:relative;
    background:radial-gradient(circle at 36% 30%,#4a2a0f,#1a1007 68%);
    border:1px solid rgba(255,170,80,.4);
    box-shadow:0 0 0 5px rgba(255,140,50,.05),0 0 30px -10px rgba(255,140,50,.5);
    transition:.2s;
  }
  .energy b{font-family:var(--mono);font-size:21px;color:#ffd9a8;line-height:1}
  .energy span{font-family:var(--mono);font-size:9px;color:var(--faint)}
  .energy.empty{filter:grayscale(.5);box-shadow:none;border-color:rgba(255,255,255,.1)}
  .piles{display:flex;gap:6px}
  .pile{
    border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:7px;
    padding:5px 8px;font-family:var(--mono);font-size:9.5px;color:var(--faint);display:flex;gap:5px;align-items:center;
  }
  .pile b{color:var(--muted)}
  .pile:hover{border-color:var(--line2)}
  .potions{display:flex;gap:5px;flex-wrap:wrap;max-width:156px}
  .potion{
    width:32px;height:32px;border-radius:9px;border:1px solid rgba(167,139,250,.36);
    background:radial-gradient(circle at 36% 28%,rgba(167,139,250,.28),rgba(30,20,50,.5));
    display:grid;place-items:center;font-size:17px;padding:0;transition:.15s;
  }
  .potion .pico{line-height:1;filter:drop-shadow(0 0 6px rgba(167,139,250,.5))}
  .potion:hover{transform:translateY(-2px);border-color:rgba(196,181,253,.7);box-shadow:0 6px 18px -10px rgba(167,139,250,.8)}
  .potion.empty{opacity:.32;border-style:dashed;background:rgba(255,255,255,.03);color:var(--faint);font-size:13px;cursor:default}
  .potion.empty:hover{transform:none;box-shadow:none;border-color:var(--line)}
  .hand{
    flex:1;min-width:0;display:flex;justify-content:center;align-items:flex-end;
    padding:24px 6px 8px;overflow-x:auto;overflow-y:visible;scrollbar-width:thin;
  }
  .hand::-webkit-scrollbar{height:5px}
  .hand::-webkit-scrollbar-thumb{background:rgba(255,180,110,.18);border-radius:99px}
  .righttools{display:flex;align-items:flex-end;gap:10px;padding-bottom:12px;margin-left:auto}
  .turnno{font-family:var(--mono);font-size:10px;color:var(--faint);text-align:right;line-height:1.6}
  .turnno b{color:var(--muted)}
  .endturn{
    height:46px;padding:0 20px;border-radius:12px;border:1px solid rgba(255,170,80,.45);
    background:linear-gradient(180deg,rgba(255,150,60,.22),rgba(160,70,15,.18));
    color:#ffd9ae;font-size:14px;letter-spacing:.12em;white-space:nowrap;
    box-shadow:0 12px 30px -18px rgba(255,140,50,.7);transition:.15s;
  }
  .endturn:hover{background:linear-gradient(180deg,rgba(255,160,70,.32),rgba(180,80,20,.24));transform:translateY(-1px)}
  .endturn:disabled{opacity:.35;transform:none}

  /* ---------- 卡牌 ---------- */
  .card{
    --rc:rgba(148,163,184,.5);
    position:relative;flex:0 0 auto;width:132px;height:184px;border-radius:12px;padding:24px 10px 9px;
    display:flex;flex-direction:column;cursor:pointer;
    background:
      radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.055),transparent 55%),
      linear-gradient(165deg,#241b12,#130e09 58%,#0c0805);
    border:1px solid var(--rc);
    box-shadow:0 16px 32px -20px #000,inset 0 0 0 1px rgba(255,255,255,.018);
    transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease,opacity .16s;
  }
  .card:hover{transform:translateY(-18px) scale(1.035);z-index:8;box-shadow:0 28px 55px -24px #000,0 0 30px -18px var(--rc)}
  .card .cost{
    position:absolute;left:-6px;top:-6px;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;
    font-family:var(--mono);font-size:13px;font-weight:700;color:#ffe2b8;
    background:radial-gradient(circle at 36% 30%,#50300f,#1c1107 72%);
    border:1px solid rgba(255,180,100,.5);box-shadow:0 4px 10px -4px #000;
  }
  .card .cname{font-family:var(--serif);font-size:14px;letter-spacing:.06em;text-align:center;line-height:1.25;min-height:32px;display:flex;align-items:center;justify-content:center}
  .card.ups .cname{color:#ffe0a6}
  .card .cart{position:relative;text-align:center;font-size:27px;line-height:1;margin:4px 0 8px;filter:drop-shadow(0 0 12px rgba(255,150,80,.2))}
  .card .ctype{font-family:var(--mono);font-size:8px;letter-spacing:.15em;color:var(--faint);text-align:center;text-transform:uppercase;margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid rgba(255,255,255,.055)}
  .card .ctext{font-size:11px;line-height:1.52;color:#d9c8b2;text-align:left;flex:1;overflow:hidden;position:relative}
  .card .gem{position:absolute;right:8px;bottom:7px;width:6px;height:6px;border-radius:50%;background:var(--rc);box-shadow:0 0 8px var(--rc)}
  .card.disabled{opacity:.42;filter:grayscale(.55)}
  .card.disabled:hover{transform:none}
  .card.unplayable{border-color:rgba(148,163,184,.3);background:linear-gradient(165deg,#1a1714,#0e0c0a 58%,#080706)}
  .card.unplayable .cost{color:#b9ad9d;opacity:.6;font-size:11px}
  .card.unplayable .ctext{color:#9d9182}
  .card.curse{border-color:rgba(244,63,94,.42);box-shadow:0 16px 32px -20px #000,inset 0 0 24px rgba(244,63,94,.06)}
  .card.curse .cname{color:#ffb4c0}
  .card .upmark{position:absolute;right:7px;top:7px;font-family:var(--mono);font-size:9px;color:var(--gold)}
  .hand .card + .card{margin-left:-24px}
  .hand .card:hover ~ .card{transform:none}
  .card.flying{position:fixed;z-index:200;pointer-events:none;transition:transform .28s ease,opacity .28s ease}
  .card-mini{width:112px;min-height:157px;height:auto}

  /* ---------- 覆盖层 ---------- */
  .overlay{
    position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
    padding:24px;background:radial-gradient(ellipse at 50% 40%,rgba(16,10,6,.88),rgba(4,3,2,.94));overflow:auto;
  }
  .overlay.on{display:flex}
  #modal{z-index:130}
  #viewer{z-index:160}
  .sheet{
    width:min(980px,100%);max-height:92dvh;overflow:auto;position:relative;
    background:linear-gradient(170deg,rgba(28,21,14,.97),rgba(14,10,7,.98));
    border:1px solid rgba(255,190,120,.2);border-radius:22px;
    box-shadow:0 40px 100px -40px #000,inset 0 0 0 1px rgba(255,255,255,.02);
    padding:30px 32px;
  }
  .sheet::-webkit-scrollbar{width:6px}
  .sheet::-webkit-scrollbar-thumb{background:rgba(255,180,110,.2);border-radius:99px}
  .shead{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px}
  .shead .stitle{font-family:var(--serif);font-size:26px;letter-spacing:.14em;line-height:1.2}
  .shead .ssub{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.6}
  .shead .sicon{font-size:30px;line-height:1;filter:drop-shadow(0 0 16px rgba(255,150,70,.3))}
  .xbtn{margin-left:auto;flex:0 0 auto}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 20px;
    border-radius:11px;border:1px solid var(--line2);background:rgba(255,255,255,.045);
    font-size:13px;letter-spacing:.08em;transition:.15s;
  }
  .btn:hover{background:rgba(255,255,255,.08);border-color:rgba(255,190,120,.4);transform:translateY(-1px)}
  .btn.primary{
    border-color:rgba(255,170,80,.5);color:#ffe0b4;
    background:linear-gradient(180deg,rgba(255,155,70,.25),rgba(160,70,15,.2));
    box-shadow:0 14px 32px -20px rgba(255,140,50,.8);
  }
  .btn.primary:hover{background:linear-gradient(180deg,rgba(255,165,80,.36),rgba(180,80,20,.28))}
  .btn.danger{border-color:rgba(244,63,94,.4);color:#ffc1cb;background:rgba(244,63,94,.08)}
  .btn:disabled{opacity:.35;transform:none}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .btnrow.center{justify-content:center}

  /* 开始界面 */
  #start{z-index:120;background:
    radial-gradient(ellipse at 50% 115%,rgba(255,120,40,.2),transparent 52%),
    radial-gradient(ellipse at 50% 20%,rgba(255,170,90,.05),transparent 40%),
    rgba(5,4,3,.9)}
  #start .sheet{width:min(1060px,100%);background:transparent;border:0;box-shadow:none;padding:10px 8px 30px}
  .hero-title{text-align:center;margin-bottom:26px}
  .hero-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.42em;color:var(--ember2);text-transform:uppercase}
  .hero-title h1{
    margin:12px 0 6px;font-family:var(--serif);font-size:clamp(48px,9vw,84px);letter-spacing:.2em;
    color:#ffe7c6;text-shadow:0 0 40px rgba(255,140,60,.28),0 0 100px rgba(255,100,30,.16);font-weight:700;
  }
  .hero-title h1 span{color:var(--ember)}
  .hero-sub{display:flex;align-items:center;justify-content:center;gap:14px;margin:-2px 0 12px;font-family:var(--serif);font-size:13px;letter-spacing:.46em;text-indent:.46em;color:var(--ember2)}
  .hero-sub::before,.hero-sub::after{content:'';width:38px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,150,80,.45))}
  .hero-sub::after{transform:scaleX(-1)}
  .hero-title p{margin:0;color:var(--muted);font-size:14px;letter-spacing:.1em}
  .classgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0 14px}
  .classcard{
    position:relative;text-align:left;border-radius:18px;padding:20px 19px 18px;border:1px solid var(--line);
    background:linear-gradient(165deg,rgba(34,25,17,.9),rgba(15,11,8,.94));
    transition:.18s;overflow:hidden;
  }
  .classcard::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:var(--cc);opacity:.6}
  .classcard:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 24px 50px -30px #000}
  .classcard.sel{border-color:var(--cc);box-shadow:inset 0 0 0 1px var(--cc),0 20px 50px -30px var(--cc);background:linear-gradient(165deg,rgba(40,29,19,.95),rgba(16,12,8,.98))}
  .classcard .cc-ico{font-size:36px;line-height:1;margin-bottom:12px;filter:drop-shadow(0 0 18px var(--cc))}
  .classcard h3{margin:0 0 4px;font-family:var(--serif);font-size:22px;letter-spacing:.14em}
  .classcard .cc-en{font-family:var(--mono);font-size:8.5px;letter-spacing:.24em;color:var(--faint);text-transform:uppercase}
  .classcard p{margin:11px 0 12px;font-size:12px;line-height:1.65;color:var(--muted);min-height:58px}
  .cc-stats{display:flex;gap:8px;flex-wrap:wrap}
  .cc-tag{font-family:var(--mono);font-size:9px;padding:3px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted);background:rgba(255,255,255,.03)}
  .cc-tag b{color:var(--cc)}
  .startfoot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
  .startmeta{display:flex;gap:16px;font-family:var(--mono);font-size:10px;color:var(--faint);flex-wrap:wrap;justify-content:center;margin-top:18px}
  .startmeta b{color:var(--muted)}
  .ascwrap{
    margin:0 0 18px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;
    background:rgba(255,255,255,.025);
  }
  .asclabel{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--faint);text-transform:uppercase;margin-bottom:8px}
  .ascrow{display:flex;gap:7px;flex-wrap:wrap}
  .ascbtn{
    display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 11px;border-radius:9px;
    border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);font-size:11px;
  }
  .ascbtn b{font-family:var(--mono);font-size:12px;color:var(--ink)}
  .ascbtn:hover{border-color:var(--line2);color:var(--ink)}
  .ascbtn.sel{border-color:rgba(244,63,94,.55);color:#ffd8df;background:rgba(244,63,94,.12);box-shadow:inset 0 0 0 1px rgba(244,63,94,.18)}
  .ascbtn.sel b{color:#ffb4c0}
  .ascdesc{margin-top:8px;font-size:11px;color:var(--muted);line-height:1.5}

  /* 模式 / 战绩 */
  .modewrap{
    margin:0 0 14px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;
    background:rgba(255,255,255,.025);
  }
  .moderow{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .modebtn{
    display:flex;align-items:center;gap:9px;text-align:left;padding:9px 11px;border-radius:10px;
    border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);transition:.16s;
  }
  .modebtn .mi{font-size:18px;line-height:1}
  .modebtn .mt{display:block;font-family:var(--serif);font-size:13px;letter-spacing:.08em;color:var(--ink)}
  .modebtn .mf{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase;margin-top:2px}
  .modebtn:hover{border-color:var(--line2);color:var(--ink)}
  .modebtn.sel{border-color:rgba(251,146,60,.55);background:rgba(251,146,60,.12);box-shadow:inset 0 0 0 1px rgba(251,146,60,.16)}
  .modebtn.sel .mi{filter:drop-shadow(0 0 12px rgba(251,146,60,.7))}
  .modebtn.sel .mt{color:#ffe0b8}
  .modedesc{margin-top:8px;font-size:11px;color:var(--muted);line-height:1.5}
  .startrecords{
    display:grid;grid-template-columns:1.15fr 1fr;gap:12px;margin-top:18px;
  }
  .reccard{border:1px solid var(--line);border-radius:13px;padding:12px 14px;background:rgba(255,255,255,.022);text-align:left}
  .rechead{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--faint);text-transform:uppercase;margin-bottom:8px}
  .rechead b{color:var(--muted);letter-spacing:.08em}
  .achlist{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .achitem{display:flex;align-items:flex-start;gap:7px;font-size:10.5px;color:var(--faint);line-height:1.35;padding:4px 6px;border-radius:7px;border:1px solid transparent}
  .achitem .ai{font-size:12px;line-height:1.2;filter:grayscale(1);opacity:.5}
  .achitem.got{color:#ffe2b8;background:rgba(251,191,36,.07);border-color:rgba(251,191,36,.18)}
  .achitem.got .ai{filter:none;opacity:1}
  .achitem small{display:block;color:var(--faint);font-size:9px;margin-top:1px}
  .achitem.got small{color:#caa877}
  .hlist{display:flex;flex-direction:column;gap:5px;max-height:112px;overflow:auto}
  .hrow{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--muted);padding:4px 0;border-bottom:1px dashed rgba(255,255,255,.05)}
  .hrow:last-child{border-bottom:0}
  .hrow .hc{font-family:var(--serif);font-size:11px;color:var(--ink);letter-spacing:.06em;flex:0 0 34px}
  .hrow .hm{font-family:var(--mono);font-size:8.5px;color:var(--faint);letter-spacing:.06em}
  .hrow .hs{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--muted)}
  .hrow.win .hs{color:#fbbf24}
  .hrow .hd{font-family:var(--mono);font-size:8px;color:var(--faint)}
  .hempty{font-size:10.5px;color:var(--faint);padding:6px 2px}
  .dailytag{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:#ffe0a8;padding:3px 8px;border-radius:6px;border:1px solid rgba(251,191,36,.26);background:rgba(251,191,36,.08)}
  .pill.act{color:#bfe9ff;border-color:rgba(56,189,248,.3)}
  .pill.act b{color:#e6f8ff}

  /* 奖励 / 路径 / 商店 */
  .rewardline{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:11px;background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.2);font-family:var(--mono);font-size:12px;color:#ffd98a;margin-bottom:20px}
  .rewardcards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;justify-items:center}
  .rewardcards .card{width:100%;max-width:160px;height:212px}
  .rewardcards .card .ctext{font-size:11.5px}
  .skiprow{display:flex;justify-content:center;margin-top:18px}
  .relicline{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:12px;border:1px solid rgba(94,234,212,.2);background:rgba(94,234,212,.055);margin-bottom:16px;font-size:12.5px;color:#c8fff5}
  .relicline .rico{font-size:22px}
  .relicline small{display:block;color:var(--muted);font-size:11px;margin-top:3px;line-height:1.5}

  .pathgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .nodecard{
    position:relative;text-align:left;padding:20px 18px;border-radius:16px;border:1px solid var(--line);
    background:linear-gradient(165deg,rgba(32,24,16,.92),rgba(14,10,7,.96));transition:.18s;min-height:170px;
  }
  .nodecard:hover{transform:translateY(-3px);border-color:var(--nc,var(--line2));box-shadow:0 22px 50px -30px #000}
  .nodecard .nico{font-size:30px;line-height:1;margin-bottom:12px}
  .nodecard h4{margin:0;font-family:var(--serif);font-size:18px;letter-spacing:.1em}
  .nodecard .ntag{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;color:var(--faint);text-transform:uppercase;margin-top:3px}
  .nodecard p{font-size:11.5px;line-height:1.65;color:var(--muted);margin:11px 0 0}
  .nodecard .nrisk{position:absolute;right:14px;top:14px;font-family:var(--mono);font-size:8.5px;padding:3px 7px;border-radius:5px;color:#ffb4c0;border:1px solid rgba(244,63,94,.3);background:rgba(244,63,94,.08)}
  .nodecard.boss{border-color:rgba(251,191,36,.36)}
  .nodecard.boss .nrisk{color:#ffd166;border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.08)}
  .mapbtn{margin-left:auto;flex:0 0 auto;font-size:15px}
  .routenote{font-size:11.5px;line-height:1.7;color:var(--muted);border:1px solid var(--line);background:rgba(255,255,255,.022);border-radius:10px;padding:9px 12px;margin-bottom:14px}
  .routenote.center{text-align:center;margin:14px 0 0}
  .routemap{max-height:min(54vh,520px);overflow:auto;padding:2px 4px 2px 0;display:flex;flex-direction:column;gap:12px}
  .routemap::-webkit-scrollbar{width:6px}
  .routemap::-webkit-scrollbar-thumb{background:rgba(255,180,110,.2);border-radius:99px}
  .actblock{border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.016);padding:10px 12px}
  .acthead{display:flex;align-items:baseline;gap:10px;margin-bottom:7px;font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--faint)}
  .acthead b{font-family:var(--serif);font-size:14px;letter-spacing:.16em;color:var(--ink);font-weight:600}
  .acthead i{font-style:normal;margin-left:auto;color:#ffd166;letter-spacing:.08em}
  .floorlist{display:flex;flex-direction:column;gap:2px}
  .flrow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;border:1px solid transparent;min-height:31px}
  .flrow.cur{background:rgba(255,138,61,.10);border-color:rgba(255,138,61,.3)}
  .flrow.past{opacity:.42}
  .flrow.bossrow{background:rgba(251,191,36,.055);border-color:rgba(251,191,36,.22)}
  .fnum{flex:0 0 34px;display:flex;align-items:baseline;gap:2px;font-family:var(--mono);color:var(--muted)}
  .fnum b{font-size:13px;color:var(--ink)}
  .fnum span{font-size:8px;color:var(--faint)}
  .fchips{display:flex;flex-wrap:wrap;gap:5px;flex:1;min-width:0}
  .fchip{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;line-height:1.2;padding:3px 7px;border-radius:6px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);white-space:nowrap}
  .fchip.battle{color:#ffc9a8;border-color:rgba(255,138,61,.26);background:rgba(255,138,61,.07)}
  .fchip.elite{color:#ffb4c0;border-color:rgba(244,63,94,.3);background:rgba(244,63,94,.08)}
  .fchip.boss{color:#ffd98a;border-color:rgba(251,191,36,.32);background:rgba(251,191,36,.08)}
  .fchip.camp{color:#ffd0a3;border-color:rgba(251,146,60,.26);background:rgba(251,146,60,.06)}
  .fchip.forge{color:#d7dee8;border-color:rgba(148,163,184,.26);background:rgba(148,163,184,.06)}
  .fchip.shop{color:#ffe3a0;border-color:rgba(251,191,36,.26);background:rgba(251,191,36,.06)}
  .fchip.treasure{color:#b9fff2;border-color:rgba(94,234,212,.26);background:rgba(94,234,212,.06)}
  .fchip.event{color:#e2ccff;border-color:rgba(192,132,252,.28);background:rgba(192,132,252,.07)}
  .fstate{flex:0 0 auto;font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;color:var(--ember2)}
  .fstate.dim{color:var(--faint)}
  .fstate.boss{color:#ffd166}

  /* 商店 */
  .shopgold{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:14px;color:var(--gold);margin-bottom:18px}
  .shopgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .shopitem{
    border:1px solid var(--line);border-radius:14px;padding:14px;background:rgba(255,255,255,.028);
    display:flex;flex-direction:column;gap:9px;align-items:center;text-align:center;
  }
  .shopitem.sold{opacity:.35}
  .shopitem .card{width:120px;height:186px;cursor:default}
  .shopitem .card:hover{transform:none;box-shadow:0 16px 32px -20px #000}
  .shopitem .buyrow{display:flex;align-items:center;gap:8px;margin-top:auto}
  .price{font-family:var(--mono);font-size:12px;color:var(--gold)}
  .relicshop{grid-column:span 3;flex-direction:row;text-align:left;gap:14px}
  .relicshop .rico{font-size:32px}
  .relicshop .rinfo{flex:1;min-width:0}
  .relicshop .rinfo b{font-family:var(--serif);font-size:16px;letter-spacing:.08em}
  .relicshop .rinfo p{margin:4px 0 0;font-size:11.5px;color:var(--muted);line-height:1.55}

  /* 卡组 */
  .deckgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:12px;justify-items:center}
  .deckgrid .card{width:100%;max-width:150px;height:200px}
  .deckgrid .card:hover{transform:translateY(-6px) scale(1.02)}
  .pickable .card{cursor:pointer}
  .pickable .card:hover{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 20px 40px -24px #000}
  .relicgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .relicrow{display:flex;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025)}
  .relicrow .rico{font-size:24px;line-height:1.2}
  .relicrow b{font-size:13px;letter-spacing:.06em}
  .relicrow p{margin:3px 0 0;font-size:11px;line-height:1.55;color:var(--muted)}
  .relicline.potionline{border-color:rgba(167,139,250,.25);background:rgba(167,139,250,.06);color:#e8ddff}
  .potionshop{grid-column:span 3;flex-direction:row;text-align:left;gap:14px}
  .potionshop .rinfo{flex:1;min-width:0}
  .potionshop .rinfo b{font-family:var(--serif);font-size:16px;letter-spacing:.08em}
  .potionshop .rinfo p{margin:4px 0 0;font-size:11.5px;color:var(--muted);line-height:1.55}
  .potionbig{font-size:30px;line-height:1;filter:drop-shadow(0 0 10px rgba(167,139,250,.5))}
  .codextabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
  .codextab{
    height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--line);
    background:rgba(255,255,255,.03);color:var(--muted);font-size:12px;letter-spacing:.08em;
  }
  .codextab:hover{border-color:var(--line2);color:var(--ink)}
  .codextab.sel{border-color:rgba(255,170,80,.5);color:#ffe0b4;background:rgba(255,155,70,.14)}
  .codexhead{display:flex;align-items:baseline;gap:9px;margin:20px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line)}
  .codexhead b{font-family:var(--serif);font-size:17px;letter-spacing:.12em}
  .codexhead span{font-family:var(--mono);font-size:10px;color:var(--faint)}
  .codexgrid .card{height:188px}
  .potioncodex{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .potionrow{display:flex;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025)}
  .potionrow b{font-size:13px;letter-spacing:.06em}
  .potionrow p{margin:3px 0 0;font-size:11px;line-height:1.55;color:var(--muted)}
  .card.locked{filter:grayscale(1);opacity:.4;border-style:dashed;cursor:default}
  .card.locked:hover{transform:none;box-shadow:none}
  .relicrow.locked,.potionrow.locked{opacity:.45;border-style:dashed}
  .relicrow.locked .rico,.potionrow.locked .potionbig{filter:grayscale(1);opacity:.6}
  .codexsum{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;color:var(--faint);margin:-6px 0 16px}
  .codexsum b{color:var(--muted)}
  .codexlocked{grid-column:1/-1;font-size:10.5px;color:var(--faint);border:1px dashed var(--line);border-radius:10px;padding:11px 12px;text-align:center;line-height:1.5}
  .achcodex{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .achcodex .achitem{padding:9px 11px;font-size:11.5px}
  .achcodex .achitem .ai{font-size:16px}
  .histtable{display:flex;flex-direction:column;gap:6px}
  .histrow{display:grid;grid-template-columns:64px 1fr 64px 64px;gap:8px;align-items:center;font-size:11px;color:var(--muted);padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.022)}
  .histrow .hc{font-family:var(--serif);font-size:12px;color:var(--ink);letter-spacing:.06em}
  .histrow .hm{font-family:var(--mono);font-size:9px;letter-spacing:.05em;color:var(--faint)}
  .histrow .hs{font-family:var(--mono);font-size:11px;color:#ffe1b8;text-align:right}
  .histrow .hw{font-family:var(--mono);font-size:9px;color:var(--faint)}
  .histrow .hw.win{color:#fbbf24}
  .histempty{font-size:11.5px;color:var(--faint);padding:14px 4px}

  /* 结算 */
  .endcard{text-align:center}
  .endcard .bigmark{font-size:52px;line-height:1;margin-bottom:10px;filter:drop-shadow(0 0 26px rgba(255,150,70,.3))}
  .endcard h2{font-family:var(--serif);font-size:34px;letter-spacing:.18em;margin:0 0 6px}
  .endcard .esub{color:var(--muted);font-size:13px;margin-bottom:22px}
  .endstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}
  .endstats>div{padding:13px 10px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.028)}
  .endstats span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.15em;color:var(--faint);text-transform:uppercase}
  .endstats b{display:block;font-family:var(--mono);font-size:19px;margin-top:5px;color:#ffe1b8}

  .logline{
    position:absolute;left:50%;bottom:6px;transform:translateX(-50%);z-index:4;
    font-size:11.5px;color:var(--muted);white-space:nowrap;pointer-events:none;
    text-shadow:0 2px 8px #000;
  }
  #toast{
    position:fixed;left:50%;bottom:250px;transform:translate(-50%,12px);z-index:300;
    padding:10px 20px;border-radius:999px;font-size:12.5px;color:#ffe3c4;
    background:rgba(22,15,9,.97);border:1px solid rgba(255,170,90,.3);
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:86vw;text-align:center;
  }
  #toast.on{opacity:1;transform:translate(-50%,0)}
  #toast.bad{border-color:rgba(244,63,94,.45);color:#ffd0d8}
  #toast.good{border-color:rgba(74,222,128,.4);color:#d8ffe6}

  .pop{
    position:fixed;z-index:250;pointer-events:none;font-family:var(--mono);font-weight:700;
    font-size:22px;color:#ffd0a8;text-shadow:0 2px 10px #000;animation:popup .85s ease-out forwards;
  }
  .pop.block{color:#8fdcff;font-size:17px}
  .pop.heal{color:#7bf0a2;font-size:17px}
  .pop.poison{color:#b9f07f}
  .pop.burn{color:#ffab6e}
  @keyframes popup{
    0%{opacity:0;transform:translate(-50%,0) scale(.55) rotate(var(--rot,0deg))}
    16%{opacity:1;transform:translate(-50%,-16px) scale(1.22) rotate(var(--rot,0deg))}
    34%{transform:translate(-50%,-22px) scale(1.02) rotate(var(--rot,0deg))}
    100%{opacity:0;transform:translate(-50%,-62px) scale(1) rotate(var(--rot,0deg))}
  }
  .shake{animation:shake .28s ease}
  @keyframes shake{
    0%,100%{transform:translate(0)}
    22%{transform:translate(-7px,2px)}
    46%{transform:translate(6px,-2px)}
    70%{transform:translate(-3px,1px)}
  }
  .pulse{animation:pulse .28s ease}
  @keyframes pulse{0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}
  body.hurt::after{
    content:"";position:fixed;inset:0;z-index:240;pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(244,63,94,.3));
    animation:hurt .35s ease forwards;
  }
  @keyframes hurt{0%{opacity:1}100%{opacity:0}}

  .hidden{display:none!important}
  .muted{color:var(--muted)}
  .mono{font-family:var(--mono)}
  .center{text-align:center}
  .divider{height:1px;background:var(--line);margin:16px 0}
  .small{font-size:11px;line-height:1.6;color:var(--muted)}

  /* ============================================================
     视觉强化层
  ============================================================ */
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
  #flash{position:fixed;inset:0;pointer-events:none;z-index:85;opacity:0}
  #flash.on{animation:fxflash .46s ease-out forwards}
  #flash.red{background:radial-gradient(circle at 50% 56%,rgba(244,63,94,.42),rgba(244,63,94,.10) 58%,transparent 78%)}
  #flash.gold{background:radial-gradient(circle at 50% 46%,rgba(251,191,36,.38),rgba(251,191,36,.06) 62%,transparent 80%)}
  #flash.cyan{background:radial-gradient(circle at 50% 62%,rgba(94,234,212,.28),transparent 72%)}
  @keyframes fxflash{0%{opacity:1}100%{opacity:0}}

  #app::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:45;
    background:
      radial-gradient(ellipse at 50% 48%,transparent 44%,rgba(0,0,0,.40) 100%),
      repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px);
  }

  /* 战场氛围 */
  .arena::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 82%,rgba(255,120,40,.13),transparent 56%),
      radial-gradient(ellipse at 50% 8%,rgba(255,190,120,.05),transparent 42%);
    animation:forgebreath 8s ease-in-out infinite;
  }
  .arena::after{
    content:"";position:absolute;left:50%;bottom:4%;width:min(74vw,760px);height:120px;transform:translateX(-50%);
    pointer-events:none;background:radial-gradient(ellipse at 50% 100%,rgba(255,130,50,.18),transparent 70%);
    filter:blur(6px);animation:forgebreath 6s ease-in-out infinite reverse;
  }
  @keyframes forgebreath{0%,100%{opacity:.65}50%{opacity:1}}
  .forge-ring::before{border-top-color:rgba(255,200,140,.42)}
  .forge-ring{filter:drop-shadow(0 0 26px rgba(255,110,35,.18))}

  /* 敌人 */
  .enemy-side{--aura:255,138,61}
  .enemy-side.elite{--aura:244,63,94}
  .enemy-side.boss{--aura:251,191,36}
  .enemy-visual{
    background:
      radial-gradient(circle at 50% 38%,rgba(58,38,22,.98),rgba(16,11,7,.98) 72%),
      radial-gradient(circle at 50% 72%,rgba(var(--aura),.12),transparent 62%);
    border-color:rgba(var(--aura),.26);
    box-shadow:
      0 0 0 8px rgba(var(--aura),.035),
      0 30px 70px -34px rgba(var(--aura),.55),
      inset 0 0 46px rgba(var(--aura),.10),
      inset 0 -18px 40px rgba(0,0,0,.55);
    transition:box-shadow .3s ease,border-color .3s ease;
  }
  .enemy-visual::before{
    content:"";position:absolute;inset:-42%;border-radius:50%;z-index:-1;
    background:radial-gradient(circle,rgba(var(--aura),.20),rgba(var(--aura),.055) 46%,transparent 68%);
    animation:aurapulse 4.4s ease-in-out infinite;
  }
  .enemy-visual::after{
    border-color:rgba(var(--aura),.14);
    border-top-color:rgba(var(--aura),.5);
    inset:-11px;
  }
  .enemy-side.elite .enemy-visual{box-shadow:0 0 0 8px rgba(var(--aura),.045),0 32px 80px -32px rgba(var(--aura),.65),inset 0 0 48px rgba(var(--aura),.12),inset 0 -18px 40px rgba(0,0,0,.55)}
  .enemy-side.boss .enemy-visual{box-shadow:0 0 0 9px rgba(var(--aura),.05),0 34px 90px -30px rgba(var(--aura),.7),inset 0 0 52px rgba(var(--aura),.14),inset 0 -20px 44px rgba(0,0,0,.6)}
  @keyframes aurapulse{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.1);opacity:1}}
  @keyframes elitehue{0%,100%{filter:hue-rotate(0)}50%{filter:hue-rotate(-12deg)}}
  #enemyArt{
    display:block;line-height:1;
    filter:drop-shadow(0 10px 18px rgba(0,0,0,.55)) drop-shadow(0 0 24px rgba(var(--aura),.35));
    animation:bob 4.8s ease-in-out infinite;
    transition:filter .1s ease;
  }
  #enemyArt.hit{filter:brightness(1.9) saturate(.5) drop-shadow(0 0 26px rgba(255,228,190,.85)) drop-shadow(0 0 10px rgba(255,140,80,.6))}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-7px) rotate(1.2deg)}}
  .enemy-shadow{
    position:absolute;left:50%;bottom:-2px;width:76%;height:20px;transform:translateX(-50%);
    border-radius:50%;pointer-events:none;
    background:radial-gradient(ellipse,rgba(0,0,0,.62),transparent 68%);
    filter:blur(7px);animation:shadowbob 4.8s ease-in-out infinite;
  }
  @keyframes shadowbob{0%,100%{transform:translateX(-50%) scale(1);opacity:.7}50%{transform:translateX(-50%) scale(.86);opacity:.45}}
  .enemy-side{position:relative}
  .enemy-side .enemy-visual{margin-top:2px}
  .intent{transition:border-color .2s,box-shadow .2s,background .2s}
  .intent.atk{border-color:rgba(244,63,94,.38);box-shadow:0 0 26px -12px rgba(244,63,94,.8);animation:intpulse 1.9s ease-in-out infinite}
  .intent.buff{border-color:rgba(251,191,36,.34);box-shadow:0 0 24px -14px rgba(251,191,36,.9)}
  .intent.def{border-color:rgba(94,200,255,.34);box-shadow:0 0 24px -14px rgba(94,200,255,.9)}
  .intent.debuff{border-color:rgba(192,132,252,.34)}
  @keyframes intpulse{0%,100%{box-shadow:0 0 20px -14px rgba(244,63,94,.5)}50%{box-shadow:0 0 34px -10px rgba(244,63,94,1)}}
  .kindtag.boss{animation:bossglow 2.4s ease-in-out infinite}
  @keyframes bossglow{0%,100%{box-shadow:0 0 0 rgba(251,191,36,0)}50%{box-shadow:0 0 16px rgba(251,191,36,.4)}}

  /* 重击反冲 / 敌方濒死 / 狂暴 */
  .enemy-visual.punch{animation:enemyPunch .28s cubic-bezier(.3,.7,.3,1)}
  @keyframes enemyPunch{
    0%{transform:scale(1)}
    28%{transform:scale(.9) translateX(5px)}
    60%{transform:scale(1.07) translateX(-3px)}
    100%{transform:scale(1)}
  }
  .enemy-visual.dying{animation:enemyDying .4s cubic-bezier(.4,0,.2,1) forwards}
  @keyframes enemyDying{
    0%{transform:scale(1);filter:brightness(1);opacity:1}
    30%{transform:scale(1.16);filter:brightness(2.4) saturate(.4)}
    100%{transform:scale(.55) translateY(-14px);filter:brightness(2.8) blur(6px);opacity:0}
  }
  .enemy-side.enraged .enemy-visual{
    border-color:rgba(255,74,74,.5);
    box-shadow:0 0 0 9px rgba(255,60,60,.07),0 30px 80px -28px rgba(255,46,46,.7),inset 0 0 52px rgba(255,52,52,.18),inset 0 -20px 44px rgba(0,0,0,.6);
    animation:enragePulse 1.5s ease-in-out infinite;
  }
  .enemy-side.enraged #enemyArt{filter:drop-shadow(0 10px 18px rgba(0,0,0,.55)) drop-shadow(0 0 30px rgba(255,70,60,.65)) saturate(1.25)}
  .enemy-side.enraged .enemy-visual::before{background:radial-gradient(circle,rgba(255,70,60,.3),rgba(255,50,50,.08) 46%,transparent 68%)}
  @keyframes enragePulse{
    0%,100%{box-shadow:0 0 0 9px rgba(255,60,60,.05),0 30px 80px -30px rgba(255,46,46,.5),inset 0 0 46px rgba(255,52,52,.12)}
    50%{box-shadow:0 0 0 11px rgba(255,60,60,.1),0 30px 90px -26px rgba(255,46,46,.85),inset 0 0 62px rgba(255,52,52,.26)}
  }
  .endturn.ready{animation:endReady .9s ease-out}
  @keyframes endReady{
    0%{box-shadow:0 0 0 rgba(255,170,90,0)}
    35%{box-shadow:0 0 26px rgba(255,170,90,.55)}
    100%{box-shadow:0 0 0 rgba(255,170,90,0)}
  }

  /* 玩家 */
  .player-side{box-shadow:0 18px 50px -32px #000,inset 0 1px 0 rgba(255,200,140,.07)}
  .pavatar{position:relative;box-shadow:0 0 0 1px rgba(255,170,90,.14),0 0 20px -6px rgba(255,140,50,.55)}
  .pavatar::after{
    content:"";position:absolute;inset:-5px;border-radius:50%;
    border:1px solid rgba(255,170,90,.16);border-top-color:rgba(255,200,140,.45);
    animation:spin 12s linear infinite;pointer-events:none;
  }
  .blockbadge.on{animation:blockglow 2s ease-in-out infinite}
  @keyframes blockglow{0%,100%{box-shadow:0 0 0 rgba(94,200,255,0)}50%{box-shadow:0 0 16px rgba(94,200,255,.35)}}
  .bar.hp i:not(.ghost){position:relative;z-index:1;overflow:hidden}
  .bar.hp i:not(.ghost)::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.38),transparent);
    transform:translateX(-110%);animation:barsheen 3.6s ease-in-out infinite;
  }
  .bar.hp i.ghost{
    position:absolute;left:0;top:0;bottom:0;border-radius:99px;z-index:0;
    background:rgba(255,226,196,.34);transition:width .6s ease .16s;
  }
  @keyframes barsheen{0%,55%{transform:translateX(-110%)}100%{transform:translateX(110%)}}

  /* 能量球 */
  .energy::before{
    content:"";position:absolute;inset:4px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 36% 30%,rgba(255,226,160,.42),rgba(255,150,60,.10) 52%,transparent 70%);
    animation:orbpulse 2.6s ease-in-out infinite;
  }
  .energy b{position:relative;z-index:1;text-shadow:0 0 14px rgba(255,190,110,.6)}
  .energy.bump{animation:pulse .34s ease}
  @keyframes orbpulse{0%,100%{opacity:.72;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}

  /* 卡牌 */
  .card{
    isolation:isolate;
    background:
      radial-gradient(120% 90% at 50% -10%,rgba(255,255,255,.10),transparent 55%),
      radial-gradient(80% 60% at 50% 110%,rgba(0,0,0,.5),transparent 70%),
      linear-gradient(165deg,#2c2117,#171009 54%,#0a0705);
    box-shadow:0 16px 32px -20px #000,inset 0 1px 0 rgba(255,255,255,.05),inset 0 -14px 26px -18px rgba(0,0,0,.9);
  }
  .card::before{
    content:"";position:absolute;inset:3px;border-radius:9px;z-index:-1;pointer-events:none;
    border:1px solid rgba(255,255,255,.06);
    background:radial-gradient(90% 50% at 50% 0%,rgba(255,255,255,.05),transparent 62%);
  }
  .card::after{
    content:"";position:absolute;inset:0;border-radius:11px;pointer-events:none;z-index:4;
    background-image:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.15) 48%,rgba(255,255,255,.03) 56%,transparent 64%);
    background-size:260% 100%;background-position:170% 0;opacity:0;
    transition:opacity .2s ease,background-position .55s cubic-bezier(.2,.7,.3,1);
  }
  .card:hover::after{opacity:1;background-position:-70% 0}
  .card .cart{position:relative;font-size:28px}
  .card .cart::before{
    content:"";position:absolute;left:50%;top:50%;width:54px;height:54px;transform:translate(-50%,-50%);
    border-radius:50%;z-index:-1;pointer-events:none;
    background:radial-gradient(circle,rgba(255,255,255,.10),rgba(255,255,255,.02) 55%,transparent 70%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);
  }
  .card .cname{position:relative;z-index:1}
  .card .cost{box-shadow:0 4px 10px -4px #000,inset 0 1px 0 rgba(255,235,200,.25)}
  .card.playable .cost{box-shadow:0 0 0 1px rgba(255,214,150,.18),0 0 16px rgba(255,150,60,.45),0 4px 10px -4px #000}
  .card.r-rare{border-color:rgba(251,191,36,.55);box-shadow:0 16px 32px -20px #000,inset 0 0 26px rgba(251,191,36,.07),inset 0 1px 0 rgba(255,240,190,.16)}
  .card.r-rare .cname{color:#ffe6b0;text-shadow:0 0 16px rgba(251,191,36,.28)}
  .card.r-rare .gem{box-shadow:0 0 9px var(--gold),0 0 20px rgba(251,191,36,.55)}
  .card.r-rare::after{background-image:linear-gradient(115deg,transparent 34%,rgba(255,220,140,.24) 47%,rgba(255,255,255,.08) 55%,transparent 66%)}
  .card.r-uncommon{border-color:rgba(192,132,252,.5)}
  .card.r-uncommon .gem{box-shadow:0 0 9px rgba(192,132,252,.9)}
  .card.t-attack .ctype{color:#ffb4a2;border-bottom-color:rgba(244,63,94,.18)}
  .card.t-skill .ctype{color:#9fd8ff;border-bottom-color:rgba(94,200,255,.16)}
  .card.t-power .ctype{color:#ffd479;border-bottom-color:rgba(251,191,36,.18)}
  .card.curse .cname{text-shadow:0 0 14px rgba(244,63,94,.35)}
  .card.deal{animation:cardIn .34s cubic-bezier(.2,.85,.25,1) backwards;animation-delay:calc(var(--i,0) * 42ms)}
  @keyframes cardIn{from{opacity:0;transform:translateY(30px) rotate(-4deg) scale(.93)}to{opacity:1;transform:none}}
  .hand .card:hover{box-shadow:0 30px 55px -24px #000,0 0 34px -16px var(--rc)}

  /* 回合横幅 */
  .turnbanner{
    position:fixed;left:0;right:0;top:31%;z-index:95;text-align:center;pointer-events:none;opacity:0;
  }
  .turnbanner b{
    display:block;font-family:var(--serif);font-size:clamp(24px,4.6vw,42px);letter-spacing:.42em;
    color:#ffe7c4;text-shadow:0 0 34px rgba(255,140,60,.55),0 2px 18px #000;text-indent:.42em;
  }
  .turnbanner span{
    display:block;margin-top:9px;font-family:var(--mono);font-size:10px;letter-spacing:.34em;
    color:var(--muted);text-transform:uppercase;text-indent:.34em;
  }
  .turnbanner.show{animation:bannerIn 1.25s cubic-bezier(.2,.8,.25,1) forwards}
  .turnbanner.enemy b{color:#ffd2da;text-shadow:0 0 34px rgba(244,63,94,.55),0 2px 18px #000}
  @keyframes bannerIn{
    0%{opacity:0;transform:translateY(14px) scale(.96);filter:blur(6px)}
    16%{opacity:1;transform:none;filter:blur(0)}
    74%{opacity:1}
    100%{opacity:0;transform:translateY(-10px);filter:blur(3px)}
  }

  /* 伤害数字 */
  .pop{
    font-size:27px;color:#ffdcb4;letter-spacing:.02em;
    text-shadow:0 0 14px rgba(255,120,40,.65),0 3px 12px #000,0 0 2px #000;
  }
  .pop.crit{font-size:36px;color:#ffe08a;text-shadow:0 0 20px rgba(255,170,60,.85),0 3px 14px #000}
  .pop.block{color:#9fe4ff;text-shadow:0 0 12px rgba(94,200,255,.6),0 2px 10px #000}
  .pop.heal{color:#8af2ae;text-shadow:0 0 12px rgba(74,222,128,.6),0 2px 10px #000}
  .pop.poison{color:#c4f58a;text-shadow:0 0 12px rgba(120,220,90,.6),0 2px 10px #000}
  .pop.burn{color:#ffb078;text-shadow:0 0 12px rgba(255,120,40,.7),0 2px 10px #000}

  /* 药水 */
  .potion{position:relative;overflow:hidden}
  .potion::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(140deg,rgba(255,255,255,.26),transparent 46%);
    opacity:.8;
  }
  .potion::after{
    content:"";position:absolute;left:24%;bottom:14%;width:5px;height:5px;border-radius:50%;
    background:rgba(235,220,255,.85);box-shadow:0 0 6px rgba(200,170,255,.9);
    animation:bubble 2.6s ease-in infinite;pointer-events:none;
  }
  .potion .pico{position:relative;z-index:1;animation:potionbob 3.4s ease-in-out infinite}
  @keyframes bubble{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-19px);opacity:0}}
  @keyframes potionbob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-2px) rotate(2deg)}}

  /* 开始界面 */
  #start::before{
    content:"";position:absolute;left:50%;bottom:-42vh;width:130vmin;height:130vmin;transform:translateX(-50%);
    border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(255,120,40,.17),rgba(255,90,20,.05) 46%,transparent 66%);

  }
  .hero-title h1{text-shadow:0 0 42px rgba(255,140,60,.30),0 0 110px rgba(255,100,30,.15)}
  @keyframes titleglow{
    0%,100%{text-shadow:0 0 36px rgba(255,140,60,.24),0 0 100px rgba(255,100,30,.12)}
    50%{text-shadow:0 0 54px rgba(255,160,80,.42),0 0 130px rgba(255,100,30,.22)}

  .classcard{transition:transform .2s,border-color .2s,box-shadow .25s,background .25s}
  .classcard::after{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;
    background:radial-gradient(ellipse at 50% -20%,color-mix(in srgb,var(--cc) 22%,transparent),transparent 62%);
  }
  .classcard:hover::after{opacity:1}
  .classcard:hover .cc-ico{transform:translateY(-2px) scale(1.06);filter:drop-shadow(0 0 26px var(--cc))}
  .classcard .cc-ico{transition:transform .25s,filter .25s}
  .classcard.sel .cc-ico{animation:iconbreathe 3s ease-in-out infinite}
  @keyframes iconbreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  .classcard.sel{background:linear-gradient(165deg,rgba(44,32,21,.96),rgba(17,12,8,.99))}

  /* 通用按钮/节点微光 */
  .btn.primary{position:relative;overflow:hidden}
  .btn.primary::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 34%,rgba(255,255,255,.20) 46%,transparent 58%);
    transform:translateX(-130%);animation:btnsheen 4.2s ease-in-out infinite;
  }
  @keyframes btnsheen{0%,58%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
  .nodecard::after{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .22s;
    background:radial-gradient(ellipse at 50% 0%,rgba(255,190,120,.10),transparent 58%);
  }
  .nodecard:hover::after{opacity:1}

  /* 震屏 */
  #battle.fxshake{animation:fxshake .3s cubic-bezier(.36,.07,.19,.97)}
  #battle.fxshake-big{animation:fxshake-big .42s cubic-bezier(.36,.07,.19,.97)}
  @keyframes fxshake{
    0%,100%{transform:translate(0,0)}
    22%{transform:translate(-4px,2px)}
    46%{transform:translate(3px,-2px)}
    70%{transform:translate(-2px,1px)}
  }
  @keyframes fxshake-big{
    0%,100%{transform:translate(0,0)}
    12%{transform:translate(-9px,4px) rotate(-.2deg)}
    28%{transform:translate(8px,-4px) rotate(.2deg)}
    46%{transform:translate(-6px,3px)}
    64%{transform:translate(4px,-2px)}
    82%{transform:translate(-2px,1px)}
  }

<script>
(function(){
  "use strict";

  /* ============================================================
     工具
  ============================================================ */
  var $ = function(id){ return document.getElementById(id); };
  var rand01 = Math.random;
  var seedRng = function(seed){
    var t = seed >>> 0;
    return function(){
      t = (t + 0x6D2B79F5) >>> 0;
      var r = Math.imul(t ^ (t >>> 15), 1 | t);
      r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  };
  var rnd = function(n){ return Math.floor(rand01()*n); };
  var pick = function(a){ return a[rnd(a.length)]; };
  var clamp = function(v,a,b){ return Math.max(a,Math.min(b,v)); };
  var esc = function(s){ return String(s).replace(/[&<>"]/g,function(c){ return c==='&'?'&':c==='<'?'<':c==='>'?'>':'"'; }); };
  var shuffle = function(a){
    for (var i=a.length-1;i>0;i--){ var j=rnd(i+1); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  };
  var fmtTime = function(ms){
    var s = Math.floor(ms/1000), m = Math.floor(s/60);
    return (m<10?'0':'')+m+':'+((s%60)<10?'0':'')+(s%60);
  };
  function uid(){ return 'c' + (++UID); }
  var UID = 0;

  /* ============================================================
     音效
  ============================================================ */
  var soundOn = true;
  try { var sv = localStorage.getItem('deckforge.sound.v1'); if (sv === '0') soundOn = false; } catch(e){}
  var AC = null;
  function audio(){
    if (!soundOn) return null;
    if (!AC){
      try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ AC = null; }
    }
    if (AC && AC.state === 'suspended') { try { AC.resume(); } catch(e){} }
    return AC;
  }
  function tone(freq, dur, type, gain, delay){
    var ac = audio(); if (!ac) return;
    var t0 = ac.currentTime + (delay||0);
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain || 0.035, t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0+dur+0.02);
  }
  function sfx(kind){
    if (!soundOn) return;
    switch(kind){
      case 'click': tone(420,.05,'sine',.02); break;
      case 'card': tone(520,.07,'triangle',.025); tone(780,.06,'sine',.015,.035); break;
      case 'hit': tone(110,.12,'sawtooth',.03); tone(70,.14,'square',.018,.02); break;
      case 'block': tone(300,.06,'triangle',.022); tone(420,.05,'sine',.012,.03); break;
      case 'coin': tone(880,.07,'sine',.025); tone(1320,.09,'sine',.02,.055); break;
      case 'heal': tone(620,.1,'sine',.025); tone(930,.12,'sine',.02,.07); break;
      case 'buff': tone(440,.08,'triangle',.02); tone(660,.1,'triangle',.02,.06); break;
      case 'turn': tone(220,.1,'sine',.018); break;
      case 'win': [523,659,784,1047].forEach(function(f,i){ tone(f,.22,'triangle',.03,i*.11); }); break;
      case 'lose': [330,262,196,131].forEach(function(f,i){ tone(f,.3,'sawtooth',.022,i*.13); }); break;
      case 'bad': tone(150,.12,'square',.025); break;
      case 'forfeit': tone(180,.25,'sawtooth',.02); break;
    }
  }

  /* ============================================================
     视觉特效层
  ============================================================ */
  var FX = (function(){
    var cv = document.getElementById('fx');
    var ctx = cv ? cv.getContext('2d') : null;
    var W = 0, H = 0, DPR = Math.min(1.5, window.devicePixelRatio || 1);
    var parts = [], running = false, last = 0;
    var reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    var CO = {
      ember:{h:24,s:100,l:62},
      fire:{h:12,s:100,l:58},
      blood:{h:348,s:92,l:60},
      cyan:{h:192,s:96,l:66},
      mint:{h:146,s:78,l:62},
      gold:{h:44,s:100,l:64},
      violet:{h:266,s:88,l:70},
      white:{h:42,s:50,l:96}
    };
    function sprite(c){
      var el = document.createElement('canvas');
      el.width = el.height = 64;
      var g = el.getContext('2d');
      var grd = g.createRadialGradient(32,32,0,32,32,32);
      grd.addColorStop(0,'hsla('+c.h+','+c.s+'%,'+c.l+'%,1)');
      grd.addColorStop(.28,'hsla('+c.h+','+c.s+'%,'+c.l+'%,.62)');
      grd.addColorStop(.62,'hsla('+c.h+','+c.s+'%,'+c.l+'%,.15)');
      grd.addColorStop(1,'hsla('+c.h+','+c.s+'%,'+c.l+'%,0)');
      g.fillStyle = grd; g.fillRect(0,0,64,64);
      return el;
    }
    Object.keys(CO).forEach(function(k){
      CO[k].spr = sprite(CO[k]);
      CO[k].css = 'hsla('+CO[k].h+','+CO[k].s+'%,'+CO[k].l+'%,1)';
    });
    function resize(){
      if (!cv) return;
      W = window.innerWidth; H = window.innerHeight;
      cv.width = Math.floor(W*DPR); cv.height = Math.floor(H*DPR);
      cv.style.width = W+'px'; cv.style.height = H+'px';
      ctx.setTransform(DPR,0,0,DPR,0,0);
    }
    function add(p){
      if (reduced || !ctx) return;
      if (parts.length > 300) parts.splice(0, parts.length-300);
      parts.push(p);
      if (!running){ running = true; last = 0; requestAnimationFrame(tick); }
    }
    function tick(ts){
      if (!last) last = ts;
      var dt = Math.min(.034, (ts-last)/1000); last = ts;
      ctx.clearRect(0,0,W,H);
      ctx.globalCompositeOperation = 'lighter';
      for (var i=parts.length-1;i>=0;i--){
        var p = parts[i];
        p.life += dt;
        var k = p.life / p.max;
        if (k >= 1){ parts.splice(i,1); continue; }
        if (p.t === 'spark'){
          p.vy += p.g*dt;
          p.vx -= p.vx*Math.min(.95,p.drag*dt);
          p.vy -= p.vy*Math.min(.95,p.drag*dt*.5);
          p.x += p.vx*dt; p.y += p.vy*dt;
          ctx.globalAlpha = (1-k)*(.55+Math.random()*.45);
          var s = p.size*(1+k*1.2);
          ctx.drawImage(p.spr, p.x-s/2, p.y-s/2, s, s);
        } else if (p.t === 'ring'){
          var r = p.r + p.vr*p.life;
          ctx.globalAlpha = (1-k)*.85;
          ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2);
          ctx.lineWidth = Math.max(.6,p.w*(1-k*.55)); ctx.strokeStyle = p.css; ctx.stroke();
        } else if (p.t === 'slash'){
          var hw = p.len*(.6+k*.7);
          ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
          ctx.globalAlpha = (1-k)*.9;
          ctx.strokeStyle = p.css; ctx.lineWidth = Math.max(.6,p.w*(1-k*.6)); ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(-hw,-hw*.18); ctx.quadraticCurveTo(0,hw*.12,hw,hw*.18); ctx.stroke();
          ctx.restore();
        } else if (p.t === 'trail'){
          // 卡牌飞向目标的拖尾：只画头部后方一小段，像拖着火星划过
          var ease = 1 - Math.pow(1-k, 2);
          var hx = p.x0+(p.x1-p.x0)*ease, hy = p.y0+(p.y1-p.y0)*ease;
          var backT = Math.max(0, ease - (p.seg || .34));
          var bx = p.x0+(p.x1-p.x0)*backT, by = p.y0+(p.y1-p.y0)*backT;
          ctx.globalAlpha = (1-k)*.9;
          ctx.strokeStyle = p.css; ctx.lineWidth = Math.max(.6,p.w*(1-k*.6)); ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(hx,hy); ctx.stroke();
          ctx.globalAlpha = (1-k)*.65;
          ctx.strokeStyle = 'rgba(255,248,236,.95)'; ctx.lineWidth = Math.max(.4,p.w*.32);
          ctx.beginPath(); ctx.moveTo((bx+hx)/2,(by+hy)/2); ctx.lineTo(hx,hy); ctx.stroke();
          var hs = p.w*2.4;
          ctx.globalAlpha = (1-k)*.8;
          ctx.drawImage(p.spr, hx-hs/2, hy-hs/2, hs, hs);
        } else if (p.t === 'beam'){
          // 敌方攻击预警光束：由粗到细、由亮到暗
          var bw = p.w*(.28+(1-k)*.72);
          ctx.globalAlpha = (1-k)*.7;
          ctx.strokeStyle = p.css; ctx.lineWidth = bw; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(p.x0,p.y0); ctx.lineTo(p.x1,p.y1); ctx.stroke();
          ctx.globalAlpha = (1-k)*.55;
          ctx.strokeStyle = 'rgba(255,244,232,.85)'; ctx.lineWidth = Math.max(.6,bw*.26);
          ctx.stroke();
          ctx.globalAlpha = (1-k)*.9;
          var bs = 5+(1-k)*9;
          ctx.drawImage(p.spr, p.x1-bs/2, p.y1-bs/2, bs, bs);
        } else {
          p.x += p.vx*dt; p.y += p.vy*dt;
          ctx.globalAlpha = (1-k)*.85;
          var ms = p.size*(1+k*.4);
          ctx.drawImage(p.spr, p.x-ms/2, p.y-ms/2, ms, ms);
        }
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (parts.length){ requestAnimationFrame(tick); }
      else { running = false; last = 0; ctx.clearRect(0,0,W,H); }
    }
    function burst(x,y,col,n,opt){
      if (reduced || !ctx) return;
      opt = opt || {};
      var c = CO[col] || CO.ember;
      n = n || 12;
      for (var i=0;i<n;i++){
        var a = Math.random()*Math.PI*2;
        var sp = (opt.speed || 170)*(.35+Math.random());
        add({
          t:'spark', x:x+(Math.random()-.5)*8, y:y+(Math.random()-.5)*8,
          vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-(opt.up||0),
          g:(opt.g === undefined ? 300 : opt.g), life:0, max:.42+Math.random()*.5,
          size:(opt.size||9)*(.55+Math.random()*.9), spr:c.spr, drag:2.1
        });
      }
      if (opt.ring !== false) ring(x,y,col,{r0:opt.r0||12, vr:opt.vr||300, max:opt.rmax||.44, w:opt.w||2});
    }
    function ring(x,y,col,opt){
      if (reduced || !ctx) return;
      opt = opt || {};
      var c = CO[col] || CO.ember;
      add({t:'ring', x:x, y:y, r:opt.r0||8, vr:opt.vr||280, life:0, max:opt.max||.44, w:opt.w||2, css:c.css});
    }
    function slash(x,y,col,opt){
      if (reduced || !ctx) return;
      opt = opt || {};
      var c = CO[col] || CO.white;
      var n = opt.n || 2;
      for (var i=0;i<n;i++){
        add({t:'slash', x:x, y:y, rot:(opt.rot === undefined ? (-.9+Math.random()*1.8) : opt.rot+i*.5),
          len:opt.len || (78+Math.random()*46), life:0, max:opt.max||.28,
          w:opt.w || (2.5+Math.random()*3), css:c.css});
      }
    }
    function mote(x,y,col,opt){
      if (reduced || !ctx) return;
      opt = opt || {};
      var c = CO[col] || CO.ember;
      add({
        t:'mote', x:x+(Math.random()-.5)*(opt.spread||24), y:y+(Math.random()-.5)*10,
        vx:(Math.random()-.5)*20, vy:-(16+Math.random()*30), life:0,
        max:.9+Math.random()*.8, size:(opt.size||5)*(.6+Math.random()), spr:c.spr
      });
    }
    function trail(x0,y0,x1,y1,col,opt){
      if (reduced || !ctx) return;
      opt = opt || {};
      var c = CO[col] || CO.ember;
      add({t:'trail', x0:x0, y0:y0, x1:x1, y1:y1, life:0, max:opt.max||.44, w:opt.w||3.4, seg:opt.seg||.34, css:c.css, spr:c.spr});
    }
    function beam(x0,y0,x1,y1,col,opt){
      if (reduced || !ctx) return;
      opt = opt || {};
      var c = CO[col] || CO.ember;
      add({t:'beam', x0:x0, y0:y0, x1:x1, y1:y1, life:0, max:opt.max||.34, w:opt.w||11, css:c.css, spr:c.spr});
      // 光束沿途撒一些火星，避免只有一条硬线
      var n = opt.n === undefined ? 7 : opt.n;
      for (var i=0;i<n;i++){
        var f = .18 + Math.random()*.7;
        add({t:'spark', x:x0+(x1-x0)*f, y:y0+(y1-y0)*f,
          vx:(Math.random()-.5)*90, vy:(Math.random()-.5)*90-20,
          g:120, life:0, max:.3+Math.random()*.26,
          size:5+Math.random()*7, spr:c.spr, drag:2.4});
      }
    }
    function center(el){
      if (!el) return {x:0,y:0};
      var r = el.getBoundingClientRect();
      return {x:r.left+r.width/2, y:r.top+r.height/2};
    }
    function shake(big){
      if (reduced) return;
      var el = document.getElementById('battle');
      if (!el) return;
      el.classList.remove('fxshake','fxshake-big');
      void el.offsetWidth;
      el.classList.add(big ? 'fxshake-big' : 'fxshake');
      clearTimeout(shake._t);
      shake._t = setTimeout(function(){ el.classList.remove('fxshake','fxshake-big'); }, 440);
    }
    function flash(col){
      if (reduced) return;
      var el = document.getElementById('flash');
      if (!el) return;
      el.className = 'on ' + (col || 'red');
      clearTimeout(flash._t);
      flash._t = setTimeout(function(){ el.className = ''; }, 480);
    }
    resize();
    window.addEventListener('resize', resize);
    return {burst:burst, ring:ring, slash:slash, mote:mote, trail:trail, beam:beam, center:center, shake:shake, flash:flash};
  })();

  /* ============================================================
     数据：状态 / 卡牌 / 遗物 / 敌人 / 职业
  ============================================================ */
  var STATUS = {
    str:   { name:'力量', icon:'💪', desc:'每次攻击的每一段伤害 +X。' },
    dex:   { name:'敏捷', icon:'🌀', desc:'每次获得格挡时 +X。' },
    vuln:  { name:'易伤', icon:'🎯', desc:'受到的攻击伤害 +50%，自己的回合结束 -1。' },
    weak:  { name:'虚弱', icon:'💧', desc:'造成的攻击伤害 -25%，自己的回合结束 -1。' },
    poison:{ name:'中毒', icon:'☠', desc:'回合结束失去 X 点生命，然后 -1。' },
    burn:  { name:'灼烧', icon:'🔥', desc:'回合结束失去 X 点生命，不会自然衰减。' },
    thorns:{ name:'荆棘', icon:'🌵', desc:'受到攻击时，对攻击者造成 X 点伤害。' },
    regen: { name:'再生', icon:'💚', desc:'回合结束恢复 X 点生命，然后 -1。' },
    frost: { name:'冰霜', icon:'❄️', desc:'敌人的攻击伤害 -X，敌方回合结束 -1。' }
  };

  var POTIONS = {
    firebomb:{name:'火焰炸弹',icon:'💣',rarity:'common',desc:'对敌人造成 20 点伤害。',effects:[{k:'dmg',n:20}]},
    blockTonic:{name:'铁皮药剂',icon:'🧱',rarity:'common',desc:'获得 12 点格挡。',effects:[{k:'blk',n:12}]},
    energyTonic:{name:'能量药剂',icon:'⚡',rarity:'uncommon',desc:'获得 2 点能量。',effects:[{k:'nrg',n:2}]},
    swiftTonic:{name:'迅捷药剂',icon:'💨',rarity:'common',desc:'抽 3 张牌。',effects:[{k:'drw',n:3}]},
    healingTonic:{name:'治疗药剂',icon:'💚',rarity:'common',desc:'恢复 15 点生命。',effects:[{k:'heal',n:15}]},
    strengthTonic:{name:'力量药剂',icon:'💪',rarity:'uncommon',desc:'获得 3 点力量。',effects:[{k:'st',s:'str',n:3,who:'p'}]},

  function pushHistory(win){
    var row = {
      cls: S.cls, clsName: S.cls ? CLASSES[S.cls].name : '—',
      floor: S.floor, mode: S.mode, asc: S.ascension, score: runScore(),
      win: !!win, daily: !!S.daily, date: dateKey()
    };
    meta.history.unshift(row);
    if (meta.history.length > 12) meta.history.length = 12;
    if (S.cls) meta.deepest = Math.max(meta.deepest || 0, S.floor);

  /* ============================================================
     卡牌实例
  ============================================================ */
  function makeCard(id, up){
    return { uid: uid(), id: id, up: !!up };
  }
  function cardDef(inst){
    var base = CARDS[inst.id];
    if (!base) return { name:'未知', cost:0, text:'', type:'skill', rarity:'common', icon:'❔' };
    if (inst.up && base.up){
      var d = Object.assign({}, base, base.up);
      d.name = base.name;
      d.icon = base.icon;
      d.cls = base.cls;
      d.type = base.type;
      d.rarity = base.rarity;
      d.upgraded = true;
      return d;
    }
    return base;
  }
  function cardColor(inst){
    var d = cardDef(inst);
    return (RARITY[d.rarity] || RARITY.common).color;
  }
  function cardHTML(inst, extra, idx){
    var d = cardDef(inst);
    var color = (RARITY[d.rarity] || RARITY.common).color;
    var type = TYPE_NAME[d.type] || '技能';
    var cls = 'card r-' + (d.rarity || 'common') + ' t-' + (d.type || 'skill') +
      (d.upgraded ? ' ups' : '') + (d.unplayable ? ' unplayable' : '') + (d.type === 'curse' ? ' curse' : '') + (extra || '');
    var style = '--rc:'+color + (idx ? ';--i:'+idx : '');
    return '<div class="'+cls+'" data-uid="'+inst.uid+'" style="'+style+'" title="'+esc(d.text)+'">' +
      '<div class="cost">'+(d.unplayable ? '—' : d.cost)+'</div>' +
      (d.upgraded ? '<div class="upmark">+</div>' : '') +
      '<div class="cname">'+esc(d.name)+'</div>' +
      '<div class="cart">'+(d.icon||'❔')+'</div>' +
      '<div class="ctype">'+type+'</div>' +
      '<div class="ctext">'+esc(d.text)+'</div>' +
      '<div class="gem"></div>' +
    '</div>';
  }

        '<h3>'+c.name+'</h3>' +

        '<p>'+c.desc+'</p>' +
        '<div class="cc-stats"><span class="cc-tag">生命 <b>'+c.hp+'</b></span>' +
          c.tags.map(function(t){ return '<span class="cc-tag">'+t+'</span>'; }).join('') +
        '</div>' +
      '</button>';
    });
    grid.innerHTML = html;
    var modeRow = $('modeRow');
    if (modeRow){
      var mh = '';
      var micons = { standard:'🔥', deep:'🌊', endless:'♾️' };
      Object.keys(MODES).forEach(function(k){
        var m = MODES[k];
        mh += '<button class="modebtn'+(S.mode===k?' sel':'')+'" data-mode="'+k+'">' +
          '<span class="mi">'+micons[k]+'</span><span><span class="mt">'+m.name+'</span>' +
          '<span class="mf">'+(k==='endless'?'999 层':m.floors+' 层')+'</span></span>' +
        '</button>';
      });
      modeRow.innerHTML = mh;
      modeRow.querySelectorAll('[data-mode]').forEach(function(btn){
        btn.addEventListener('click', function(){
          S.mode = btn.getAttribute('data-mode');
          renderStart(); sfx('click');
        });
      });
    }
    var modeDesc = $('modeDesc');
    if (modeDesc){
      var cm = MODES[S.mode] || MODES.standard;
      modeDesc.textContent = cm.name + '：' + cm.desc;

      ascRow.innerHTML = ah;

  function startDaily(){
    var key = dateKey();
    var classes = Object.keys(CLASSES);
    S.daily = key;
    S.mode = 'standard';

    S.pickedClass = classes[key % classes.length];
